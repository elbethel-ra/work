<meta charset="utf-8">
<title>사회복지사 1급 기출노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one column, bottom tab bar, question screen fills the tall Z Flip 4 display.
   Palette: exam-sheet ink navy with a highlighter-yellow accent (the pen used on answer sheets). */
:root{
  --bg:#10131a; --surface:#181c26; --surface2:#212634; --line:#2d3446;
  --fg:#e8eaf0; --muted:#9aa2b6; --hi:#f2cf5b; --hi-ink:#2a2200;
  --ok:#5fcf9a; --ok-bg:#12281f; --bad:#ff8680; --bad-bg:#2c1717;
  --font:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --serif:"Gowun Batang","Noto Serif KR",serif;
  --nav-h:62px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:560px;margin:0 auto;padding-block:16px calc(var(--nav-h) + 24px)}
#app.noNav{padding-bottom:24px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* header */
.hero{display:flex;flex-direction:column;gap:4px;padding:8px 0 16px}
.hero .brand{font-family:var(--serif);font-size:26px;line-height:1.25;letter-spacing:-.01em}
.hero .brand mark{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--hi) 55%,transparent) 55%);color:inherit;padding:0 2px}
.stat{display:flex;gap:16px;flex-wrap:wrap}
.stat b{color:var(--fg)}

/* sections */
.sec{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.sec>label,.sec>.lab{font-size:13px;color:var(--muted);letter-spacing:.04em;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:40px;padding:6px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);
  font-size:14px;color:var(--fg);display:inline-flex;align-items:center;gap:6px
}
.chip[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.chip small{opacity:.7;font-size:11px}
.grp{display:flex;flex-direction:column;gap:6px}
.grp .gl{font-size:12px;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:40px;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--fg);font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
select,textarea{
  width:100%;min-height:46px;background:var(--surface);color:var(--fg);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;font:inherit;font-size:14px
}
textarea{min-height:120px;resize:vertical;font-family:ui-monospace,monospace;font-size:12px;line-height:1.4}

/* primary action */
.dock{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,var(--bg) 35%);z-index:5;pointer-events:none}
.dock>*{pointer-events:auto;max-width:560px;margin:0 auto;display:flex}
.btn{
  min-height:52px;border-radius:14px;padding:0 20px;font-weight:700;font-size:16px;
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%
}
.btn.primary{background:var(--hi);color:var(--hi-ink)}
.btn.primary:disabled{background:var(--surface2);color:var(--muted)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.sm{min-height:42px;font-size:14px;width:auto;padding:0 16px;border-radius:12px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

/* nav */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px));
}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted);min-width:0}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--hi);font-weight:700}
.badge{background:var(--bad);color:#2a0b09;border-radius:9px;font-size:11px;font-weight:700;min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;margin-left:4px}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0 10px;z-index:3}
.qtop .bar{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.qtop .bar i{display:block;height:100%;background:var(--hi);border-radius:3px;transition:width .2s}
.iconbtn{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn svg{width:22px;height:22px}
.iconbtn[aria-pressed="true"]{color:var(--hi)}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--muted);margin:4px 0 12px}
.qmeta .tag{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 8px}
.stem p{margin:0 0 8px;font-size:16.5px;line-height:1.65;font-weight:500;text-wrap:pretty}
.stem p.it{font-size:15px;font-weight:400;background:var(--surface);border-radius:10px;padding:8px 12px;margin-bottom:6px;color:#d6dae6}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.ch{
  display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px;font-size:15px;line-height:1.55
}
.ch .bub{
  flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--muted);margin-top:0
}
.ch .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.ch:not(:disabled):active{background:var(--surface2)}
.ch.right{background:var(--ok-bg);border-color:var(--ok)}
.ch.right .bub{background:var(--ok);border-color:var(--ok);color:#06241a}
.ch.wrong{background:var(--bad-bg);border-color:var(--bad)}
.ch.wrong .bub{background:var(--bad);border-color:var(--bad);color:#2a0b09}
.ch.dim{opacity:.6}
.result{margin-top:16px;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.result.ok{background:var(--ok-bg);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.result.bad{background:var(--bad-bg);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.result .t{font-weight:700;font-size:16px}
.result.ok .t{color:var(--ok)} .result.bad .t{color:var(--bad)}
.rev{background:var(--surface);border:1px dashed var(--hi);border-radius:12px;padding:10px 12px;font-size:13.5px}
.rev b{color:var(--hi)}
.expl{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.expl .lab{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.expl p{margin:0 0 8px;font-size:14.5px;line-height:1.7;white-space:pre-line}
.expl p:last-child{margin-bottom:0}
.qnav{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 0 calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);margin-top:16px}
.qnav .btn{width:auto;flex:1}
.qnav .btn.prev{flex:none;width:96px}
.flag{font-size:13px;color:var(--muted);padding:10px 0;text-decoration:underline;text-underline-offset:3px}
.flag[aria-pressed="true"]{color:var(--hi)}

/* lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.item{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item .m{font-size:12px;color:var(--muted)}
.item .q{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.sum b{display:block;font-size:22px;font-family:var(--serif)}
.pbar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--ok)}
.pbar i.lo{background:var(--bad)}
.pbar i.mid{background:var(--hi)}
.subrow{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.subrow .h{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.empty{padding:36px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 80px);transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);padding:8px 16px;border-radius:20px;font-size:13px;z-index:20}
/* mock exam */
.tm{font-family:var(--serif);font-size:20px;color:var(--hi);min-width:64px}
.tm.low{color:var(--bad)}
.ch.sel{background:color-mix(in srgb,var(--hi) 14%,var(--surface));border-color:var(--hi)}
.ch.sel .bub{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.navgrid button{min-height:46px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;position:relative}
.navgrid button.done{background:color-mix(in srgb,var(--hi) 16%,var(--surface));border-color:var(--hi)}
.navgrid button.cur{outline:2px solid var(--fg);outline-offset:1px}
.navgrid button.mk::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.verdict{margin-top:14px;border-radius:14px;padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.verdict.pass{border-color:var(--ok);background:var(--ok-bg)}
.verdict.fail{border-color:var(--bad);background:var(--bad-bg)}
.verdict b{font-size:16px}
.low-tag{color:var(--bad);font-size:12px;margin-left:6px}
/* study + stats */
.topic{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:8px;overflow:hidden}
.topic>button.hd{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:12px 14px}
.topic .r1{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;font-weight:500}
.topic .r2{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.topic .body{padding:0 14px 14px;border-top:1px solid var(--line)}
.yrs{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;align-items:end;height:74px;margin-top:12px}
.yrs div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--muted);gap:2px}
.yrs i{display:block;width:100%;background:var(--hi);border-radius:3px 3px 0 0;min-height:0}
.up{color:var(--bad)} .dn{color:var(--ok)}
.rank{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:8px}
.rank b{font-family:var(--serif);color:var(--hi);font-size:18px;min-width:20px}
.rank span{font-size:14px;flex:1;min-width:0}
.rank small{font-size:12px;color:var(--muted);flex:none}
.chart{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:104px;margin-top:10px}
.chart .col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px;font-size:10px;color:var(--muted)}
.chart .bars{width:100%;display:flex;flex-direction:column;border-radius:3px;overflow:hidden}
.chart .bars i{display:block;width:100%}
.chart .col.today{color:var(--hi);font-weight:700}
.kv{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.kv b{color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>

<script>window.__DATA={"data/e_ad.json":{"17-3-26":{"x":"기업이 판매 수익의 일정 비율을 비영리기관에 기부하는 방식은 공익연계마케팅(cause-related marketing)의 정의다. 기업의 이윤 추구와 사회적 대의 지원이 연결되는 것이 핵심이다. 사회마케팅은 사회적 행동 변화를 목표로 하는 기법이라 구별된다."},"17-3-27":{"x":"비정형적 의사결정은 반복되지 않는 새로운 문제에 대해 의사결정자의 직관과 판단으로 이루어진다. 대안선택흐름도표는 개인 차원의 기법이고, 브레인스토밍은 모든 구성원에게 주제를 공개하고 비판 없이 아이디어를 내는 방법이다. 판단적 결정이 과학적 절차로 이루어진다는 보기와 직관적 결정이 지식·경험에만 의한다는 보기는 정의가 맞지 않는다."},"17-3-28":{"x":"TQM은 서비스 품질을 마지막 단계에서 점검하는 것이 아니라 전 과정에서 지속적으로 개선하는 관리 철학이다. 고객중심, 지속적 개선, 자료에 기반한 의사결정, 전 구성원의 참여가 핵심이므로 '마지막 단계에 고려한다'가 옳지 않다."},"17-3-29":{"x":"참여적 리더십에서는 의사결정에 하급자가 참여하지만 최종 결정과 책임은 리더에게 있다. 하급자가 의사결정을 '적극적으로 주도'한다는 것은 위임적(방임적) 리더십에 가깝다. 참여적 리더십의 단점은 시간 소요와 책임 분산이다."},"17-3-30":{"x":"전달체계 원칙은 포괄성(다양한 서비스), 적절성(양과 질의 충분함), 전문성(자격 있는 사람이 핵심 업무 담당), 접근성(쉽게 이용)이다. 보기의 설명을 순서대로 대응하면 ㄱ 포괄성, ㄴ 적절성, ㄷ 전문성, ㄹ 접근성이다."},"17-3-31":{"x":"부문화는 업무를 기준에 따라 나누는 것으로, 지리적 기준(거주지역)과 시간 기준(교대 근무)이 옳다. ㄱ의 서비스 제공·사례관리·지역사회조직은 기능 기준이고, ㄷ의 개별·집단·지역사회조직은 서비스(방법) 기준이라 두 설명의 기준 이름이 바뀌어 있다."},"17-3-32":{"x":"비용-효과분석은 효율성 평가이고, 노력성은 투입된 인력·시간·비용 등 노력의 양을 평가하는 기준이다. 따라서 '노력성: 비용-효과분석'이 옳지 않다. 비용-편익분석도 효율성 기준에 해당한다."},"17-3-33":{"x":"전략적 기획은 조직의 기본 목표와 방향, 장기적 행동계획을 결정하는 기획이다. 사업계획·할당 기획은 중간관리층, 프로그램 기획은 감독관리층, 장기 기획은 최고관리층의 몫이므로 다른 보기는 계층이 뒤바뀌었다. 외부 환경과의 경쟁을 다루는 것은 전략기획이다."},"17-3-34":{"x":"Z이론(오우치)은 신뢰·헌신·집단 협력에 기반한 일본식 경영 이론으로, 인간을 통제와 강제의 대상으로 보는 것은 X이론이다. 따라서 Z이론 설명이 옳지 않다. 맥클리랜드의 성취동기이론은 권력·친화·성취 욕구로 구분한다."},"17-3-35":{"x":"전달체계는 서비스 종류가 아니라 '운영 주체'에 따라 공공과 민간으로 나뉜다. 서비스 종류에 따라 구분한다는 설명이 옳지 않다. 구조·기능 차원에서는 행정체계와 집행체계로 나뉘고 읍·면·동은 집행체계다."},"17-3-36":{"x":"사회복지통합관리망(2010), 주민생활지원서비스(2006), 사회보장정보시스템(2013)은 모두 2000년 이후 변화다. 사회복지전문요원제는 1987년 도입되어 2000년 이전이다. 따라서 ㄱ, ㄴ, ㄹ이 답이다."},"17-3-37":{"x":"개인의 욕구를 조직과 통합하고 업무절차 표준화, 직원 선발·훈련·보상으로 조직의 영속성을 확보하는 기능은 유지 하위체계다. 생산은 서비스 산출, 적응은 환경 변화 대응, 경계는 투입·산출 관리, 관리는 조정·통제를 담당한다."},"17-3-38":{"x":"인사관리에서는 직무분석을 먼저 하고 그 결과로 직무기술서(직무 자체)와 직무명세서(직무수행자 요건)를 작성한다. '직무분석 이전에 작성한다'는 순서가 틀렸다."},"17-3-39":{"x":"과업환경은 조직과 직접 상호작용하는 환경으로 클라이언트, 재정자원 제공자, 보충적 서비스 제공자, 경쟁조직 등이 해당한다. 문화적 조건은 모든 조직에 영향을 주는 일반환경이다."},"17-3-40":{"x":"과학적 관리론은 인간을 경제적 보상에 반응하는 기계적 존재로 보고 효율성을 추구한 이론이다. 인간의 정서와 사회적 관계를 중시한 것은 인간관계론이므로 2번이 옳지 않다."},"17-3-41":{"x":"PERT는 활동 간 선후 관계와 소요시간을 네트워크로 나타내 최단 완료 기간을 추정하는 기법이다. 막대로 단순히 일정을 보여주는 간트 차트보다 활동 간 상관관계를 파악하는 데 더 유용하므로 '유용하지 않다'가 옳지 않다."},"17-3-42":{"x":"사회복지행정의 실천원칙 중 조직화의 원칙은 구조와 업무 분담을 명확히 하는 것을 말하고, 직무에 대한 조직의 연대책임을 강조한다는 설명은 맞지 않다. 연대책임이 아니라 책임과 권한의 명확한 배분이 핵심이다."},"17-3-43":{"x":"최근 사회서비스 공급에서는 영리부문 참여가 증가하는 추세(시장화, 바우처, 장기요양 등)다. 감소하고 있다는 설명이 옳지 않다."},"17-3-44":{"x":"성과평가는 프로그램이 낳은 변화나 결과(자아존중감 향상, 취업률)뿐 아니라 비용 대비 결과를 비교하는 효율성 평가(1인당 취업비용 비교)도 포함하는 넓은 개념이다. 세 항목이 모두 해당한다."},"17-3-45":{"x":"평가 결과가 반드시 기관의 변화를 수반하는 것은 아니며, 결과를 활용하는 방식에 따라 달라진다. 환류, 책무성, 관리수단, 자원 확보 영향은 평가의 의의에 해당한다."},"17-3-46":{"x":"논리모델에서 산출은 활동의 직접 결과(교육시간, 출석률)이고, 성과는 참여자에게 나타난 단기·중기 변화다. 노인 자살률 감소는 장기적 영향에 가깝고 부양의식 향상은 지역 차원이라 성과로 묶은 보기가 옳지 않다."},"17-3-47":{"x":"작은 정부론, 사회서비스 바우처, 장기요양보험처럼 민간 공급과 시장 기제를 활용하는 흐름은 민영화 경향이다. 집권화가 아니라 분권화와 민간 참여 확대가 특징이다."},"17-3-48":{"x":"성과주의 예산은 사업의 단위원가와 업무량을 기초로 하므로 예산 배정이 객관적 자료에 기반한다. 직관적 성격이 강한 것은 품목별 예산이 아니라 점증주의 예산에 가깝다. 따라서 직관적이라는 설명이 옳지 않다."},"17-3-49":{"x":"사회복지사업의 재정 흐름은 2005년 국고보조사업 일부를 지방으로 이양한 분권교부세 방향이었다. 지방정부 사업이 국고보조사업으로 이양되었다는 설명은 방향이 반대다."},"17-3-50":{"x":"맥클리랜드는 성취동기이론, 매슬로우는 욕구계층이론, 허즈버그는 동기-위생이론, 맥그리거는 X·Y이론, 알더퍼는 ERG이론이다. 올바른 연결은 성취동기이론-맥클리랜드다."},"18-3-26":{"x":"베버의 관료제는 법규에 근거한 합법적 권위와 합리성을 바탕으로 일상적·반복적 업무에 효율적이다. 비공식 집단과 외부 정치 상황을 다룬 것은 인간관계론 및 정치경제이론이므로 ㄴ, ㄹ이 옳다."},"18-3-27":{"x":"조직의 공식 구조를 통해 업무를 규정하고 목표·과업 변화에 맞춰 구조를 세우는 기능은 조직화(organizing)다. 인사는 인력 확보·훈련, 지휘는 지시와 동기부여, 조정은 활동의 통합이다."},"18-3-28":{"x":"정치적 조건은 일반환경이며, 과업환경이 아니다. 과업환경은 조직과 직접 상호작용하는 클라이언트, 재정 제공자, 경쟁조직 등이다. 따라서 정치적 조건을 과업환경이라 한 설명이 옳지 않다."},"18-3-29":{"x":"자원을 가진 이해관계집단의 영향력과 재원을 둘러싼 권력관계를 강조하는 이론은 정치경제이론이다. 신제도이론은 제도적 압력에 의한 동형화, 조직군생태이론은 환경에 의한 조직 선택을 설명한다."},"18-3-30":{"x":"사회복지행정은 가치가 개입되는 활동이므로 사회복지행정가가 가치중립적이어야 한다는 설명은 옳지 않다. 사회복지 가치와 윤리에 기반한 판단이 요구된다."},"18-3-31":{"x":"사회복지조직 분류 중 에치오니의 규범적 조직, 블라우·스콧의 호혜조직, 지벨만의 운영주체 분류, 하센필드의 인간식별·유지·변화 기술 구분은 모두 옳다. 스미스(G. Smith)의 분류를 '업무통제에 따른 사회적경제조직·사업조직·공공조직'으로 제시한 보기가 잘못되어 정답이다. 학자별 분류 기준과 유형은 쌍으로 암기해야 한다."},"18-3-32":{"x":"TQM은 서비스 생산 과정과 절차를 지속적으로 개선해 고객 만족과 품질을 높이는 관리 철학이다. 최고책임자의 결정권이 아니라 전 구성원 참여를 강조하며, 인간관계론에 가깝다."},"18-3-33":{"x":"표적조직이 평화적 요구를 무시할 때 집단행동으로 압력을 가하는 전략은 방해전략(disruption)이다. 반작용이 따를 수 있다는 점이 특징이다. 교환, 흡수, 경쟁은 보다 협력적·경쟁적 방식이다."},"18-3-34":{"x":"퀸이 말한 혁신적 슈퍼바이저는 변화 예측과 창의적 사고, 의사소통, 갈등 예방 능력을 갖춘다. 개인 성과 점검은 관리적·감독적 기능에 해당해 혁신적 능력으로 보기 어렵다."},"18-3-35":{"x":"전달체계 원칙에서 충분한 양과 질은 적절성, 종합적인 제공은 포괄성이다. 책임성과 전문성의 설명은 잘못되었고, 접근성과 연속성의 설명만 옳아 ㄴ, ㄷ이 정답이다."},"18-3-36":{"x":"안전 확보, 작업환경의 안전, 사고 예방, 이용자 권리옹호를 포함한 대책은 위험관리(risk management)다. 서비스 질과 연결된 안전 확보와 사고 예방이 핵심 키워드다."},"18-3-37":{"x":"회계연도 개시 전까지 예산이 성립되지 못했을 때 전년도 예산에 준해 필수경비를 집행하는 제도는 준예산이다. 추가경정예산은 성립 후 변경, 특별예산은 특정 목적 별도 예산이다."},"18-3-38":{"x":"참여적 리더십은 직원을 의사결정에 참여시키되 최종 권한과 책임은 상급자에게 남아 있다. 권한과 책임을 포기하는 것은 위임적·방임적 리더십에 해당한다."},"18-3-39":{"x":"위계적 욕구이론은 매슬로우의 욕구계층이론이다. 로크의 목표설정이론은 구체적이고 도전적인 목표가 동기와 성과를 높인다고 보는 인지 중심 이론이다."},"18-3-40":{"x":"리더의 지위권력, 직원과의 관계, 과업구조, 직원의 성숙도 같은 상황 변수에 따라 효과적인 리더십이 달라진다는 것은 상황이론이다. 한 조직에서의 성공이 다른 조직에서도 보장되지 않는다는 점이 핵심이다."},"18-3-41":{"x":"직업능력검사를 통한 채용, 오리엔테이션, 직무기술서 작성, 행동평가를 통한 성과평가는 모두 인적자원관리의 채용·개발·직무관리·평가 활동에 해당한다. 네 항목 모두 옳다."},"18-3-42":{"x":"사회복지사업법상 시설평가의 기준은 보건복지부장관이 시설의 서비스 최저기준 등을 고려해 정한다. 평가는 3년마다 실시하고, 평가 결과는 공표할 수 있으며 시설 지원에 반영할 수 있다. 따라서 나머지 보기는 주기·공표 가능 여부 등에서 틀렸다. 현행 법령 조문은 확인하길 권한다."},"18-3-43":{"x":"행복e음(사회복지통합관리망)은 2010년 구축되었고 희망복지지원단은 2012년 시·군·구에 설치되었다. 희망복지지원단 설치 후에 구축했다는 순서가 틀렸다."},"18-3-44":{"x":"막대그래프로 일정을 나타내 막대그래프 차트라 불리고 작업 간 연결성 파악이 어려운 기법은 간트 차트다. PERT와 CPM은 활동 간 선후관계를 네트워크로 나타내는 기법이다."},"18-3-45":{"x":"공익연계마케팅은 기업은 이미지와 매출, 사회복지조직은 기부금 등 혜택을 얻는 상호 이익 구조다. 비영리조직은 생산과 소비가 동시에 일어나는 서비스 특성이 있고, 4P의 P는 product·price·place·promotion이다."},"18-3-46":{"x":"스키드모어의 기획 과정은 목적·목표 설정으로 시작한다. 자원 고려가 첫 번째 단계라는 설명이 틀리고, 구체적 프로그램 수립, 결과 예측, 개방성 유지 설명은 옳다."},"18-3-47":{"x":"프로그램 활동으로 나타난 양적 최종 실적(서비스 제공시간, 참가자 수)은 산출(output)이다. 투입은 자원, 전환은 활동 과정, 성과는 참여자에게 나타난 변화다."},"18-3-48":{"x":"영향성은 프로그램이 사회문제 해결 등에 미친 영향의 정도를 말하고, 사회집단 간 공평한 배분은 형평성에 해당한다. 따라서 영향성 설명이 옳지 않다."},"18-3-49":{"x":"사회복지조직은 정부 보조금 등 외부재원 의존도가 높아 지역사회 타 기관과의 연계 노력이 중요하다. 사회서비스 바우처는 공공재원에 기반한 제도이며 민간재원 감소의 예로 보기 어렵다."},"18-3-50":{"x":"기획은 목표 지향적이면서 목표 달성 과정에 대한 계획을 다루는 과정지향적 성격도 갖는다. 과정지향적이지 않다는 설명이 옳지 않다."},"19-3-26":{"x":"사회복지조직은 인간을 대상으로 하고 성과를 계량화하기 어려워 조직성과의 객관적 증명이 쉽지 않다. 클라이언트와의 직접 접촉이 핵심이고 재원이 다양하며 전문성이 중요하다."},"19-3-27":{"x":"최근 사회복지는 시설보호에서 지역사회 중심의 이용시설·재가서비스로 이동하는 추세다. 생활시설 중심 보호가 강조된다는 설명이 옳지 않다."},"19-3-28":{"x":"관료제는 권위가 수직적 위계로 구조화되고, 개인의 사적 감정이 배제되며, 규칙에 따라 직무가 배분되고 분업·전문화가 이루어진다. 수평적 권위 구조라는 ㄱ이 틀렸다."},"19-3-29":{"x":"비공식 집단과 사회적 관계가 생산성에 영향을 준다고 본 이론은 인간관계이론(호손 실험)이다. 과학적 관리론은 공식 구조와 경제적 동기를 강조한다."},"19-3-30":{"x":"사회적기업도 사회서비스 제공형 등으로 사회서비스 공급에 참여한다. 참여할 수 없다는 설명이 옳지 않다."},"19-3-31":{"x":"행렬조직은 기능별 부서 체계와 사업(프로젝트)별 체계를 결합해 직무 분업과 사업 협력을 동시에 추구하는 구조다. 명령계통이 이중이라 갈등이 생길 수 있다는 점이 단점이다."},"19-3-32":{"x":"집권화는 권한이 상층부에 집중되는 것이어서 구성원의 재량과 자발적 참여를 줄인다. 구성원의 재량을 확대하는 것은 분권화다."},"19-3-33":{"x":"인구사회학적 조건, 사회적 태도·가치, 과학기술 수준은 모두 일반환경에 속하며 조직에 미치는 영향 정도에 따라 일반환경과 과업환경으로 구분한다. 네 설명 모두 옳다."},"19-3-34":{"x":"준예산에서는 임·직원 보수, 법인·시설 운영에 직접 필요한 필수경비, 법령상 지급의무 경비를 집행할 수 있다. 협회 회비는 필수경비로 보기 어렵다. 직원 급여, 전기요금, 사용자 부담 국민연금은 모두 해당한다."},"19-3-35":{"x":"퀸의 경쟁가치모형에서는 인간관계 지향(동기부여형)과 합리목표 지향(목표달성형)이 상반된 축에 놓인다. 관리격자의 이상형은 9.9형, 피들러는 불리한 상황에서 과업 중심, 허시·블랜차드는 성숙도가 낮으면 지시형, 변혁적 리더는 비전과 동기를 강조한다."},"19-3-36":{"x":"맥클랜드의 세 욕구는 친교(친화), 권력, 성취다. 대면서비스는 친교, 팀장 업무는 권력, 어려운 과제는 성취욕구가 높은 자원봉사자에게 맞는다."},"19-3-37":{"x":"성장욕구가 관계욕구보다 상위라는 단계 구분은 알더퍼의 ERG이론에 있다. 맥클랜드의 성취동기이론은 욕구를 위계로 나누지 않는다."},"19-3-38":{"x":"소진은 열성, 침체, 좌절, 무관심 단계로 진행되는 것이 일반적이다. 직무만족은 조직몰입에 긍정적이고, 브레인스토밍은 질보다 양을 중시하며, 갈등은 순기능도 있다."},"19-3-39":{"x":"직무에 대한 업무내용과 책임을 종합적으로 분류하는 인적자원관리의 기초는 직무분석이다. 직무분석 결과로 직무기술서·직무명세서가 작성된다."},"19-3-40":{"x":"예산총계주의 원칙에 따라 세입과 세출은 모두 예산에 계상해야 한다. 예산은 회계연도 개시 전에 결정해야 하고 단년도주의가 일반적이며 반드시 흑자일 필요는 없다."},"19-3-41":{"x":"SERVQUAL의 5개 차원은 유형성, 신뢰성, 반응성, 확신성, 공감성이다. 중립성은 포함되지 않는다."},"19-3-42":{"x":"서비스를 적극적으로 홍보하는 것은 접근성 원칙에 해당하고, 통합성은 여러 서비스를 연결해 제공하는 원칙이다. 통합성의 예로 홍보를 든 보기가 옳지 않다."},"19-3-43":{"x":"전담직원 채용(스태핑), 개별 사정과 상담(사례관리), 취업 성공률이 낮을 것으로 보이는 대상자를 걸러내 타 기관에 보내려는 것(크리밍, 의뢰)은 나타나지만, 서비스를 과도하게 이용하는 현상은 나타나지 않는다."},"19-3-44":{"x":"책임행렬표는 목표, 활동, 담당자별 책임 유형을 표로 나타낸 기법이다. PERT는 새로운 프로그램에 유용하고, 임계경로 파악은 PERT/CPM, 마일스톤은 주요 시점 관리 기법이다."},"19-3-45":{"x":"논리모델에서 투입은 비용과 인력 등 자원이다. 프로그램 참여자의 스트레스 완화와 삶의 질 향상은 성과이고, 상담전문가 10인은 투입 자원이다. 따라서 ㄱ, ㄹ만 옳다."},"19-3-46":{"x":"마케팅 믹스 4P는 상품(product), 가격(price), 유통(place), 촉진(promotion)이다. 성과(performance)는 포함되지 않는다."},"19-3-47":{"x":"양적 평가지표가 많을 때 평가지표 충족에만 관심이 집중되어 서비스 효과성이 낮아지는 평가의 부작용에 대한 설명으로 답이 제시된 항목은 기준행동이다. 목표대치와 비슷한 맥락으로 이해하면 된다."},"19-3-48":{"x":"과정 기준은 절차나 규정 준수 여부로 측정한다. 노력은 투입된 자원, 효율성은 투입 대비 산출, 효과성은 목표 달성, 영향은 사회문제에 미친 영향이다."},"19-3-49":{"x":"총괄평가는 프로그램 종료 후 성과와 비용 등 결과에 초점을 둔다. 프로그램 개선 목적의 모니터링은 형성평가다."},"19-3-50":{"x":"클라이언트인구는 프로그램에 실제로 참여하는 사람이다. 위험인구는 문제에 취약한 사람, 표적인구는 수급 자격을 갖춘 사람이며 일반인구가 가장 많다."},"20-3-26":{"x":"사회복지행정은 공공조직뿐 아니라 민간 사회복지조직에서도 이루어지는 활동이다. 민간조직을 제외한다는 설명이 옳지 않다."},"20-3-27":{"x":"비공식 조직은 구성원 간 친밀과 소속감으로 조직의 응집력을 높이는 순기능이 있다. 파벌과 정실인사는 역기능이다."},"20-3-28":{"x":"관료제의 복잡한 규칙은 창의성을 저해하는 역기능이 있다. 창조성이 향상된다는 설명이 옳지 않다."},"20-3-29":{"x":"조직문화는 서비스 체계의 규범과 가치, 구성원의 상황 인식, 태도·행태를 통한 조직효과성과의 연결 역할을 한다. 세 설명 모두 옳다."},"20-3-30":{"x":"조직의 내·외부 환경의 역학과 환경으로부터의 합법성 확보를 강조하는 이론은 정치경제이론이다. 자원과 권력 관계에 초점을 둔다."},"20-3-31":{"x":"사회복지행정은 지역사회와 연계하고 구성원의 참여를 허용하는 개방적 관리가 특징이다. 관료적이고 위계적인 부서 간 관리 기술만을 필요로 한다는 설명이 옳지 않다."},"20-3-32":{"x":"1950년대 KAVA는 한국전쟁 후 구호물자 배분과 기관 간 조정(중복·누락 방지)이 중심이었다. 지역사회 조직화나 공동체 형성에 적극적이었다는 설명은 맞지 않다."},"20-3-33":{"x":"하센필드의 환경 대응전략은 권위주의, 경쟁, 협동(협력), 방해 전략이다. 전문화 전략은 포함되지 않는다."},"20-3-34":{"x":"관리격자이론은 인간에 대한 관심과 생산에 대한 관심 두 축으로 유형을 나누는 행동이론으로, 상황 요소를 고려하는 상황이론이 아니다. 따라서 상황 요소를 고려한다는 설명이 옳지 않다."},"20-3-35":{"x":"사회복지시설평가의 이용자 권리 지표는 생활시설뿐 아니라 이용시설 평가에도 적용된다. 거주시설에 한정한다는 설명이 옳지 않다."},"20-3-36":{"x":"동료와 비교해 자신의 투입·보상을 판단하고 행동을 결정하는 것은 아담스의 형평성(공평성)이론이다. 사회적 비교가 핵심이다."},"20-3-37":{"x":"직무수행평가는 구성원에게 직무수행의 기대치와 기준을 알려 주고 피드백하는 기능이 있다. 평가 기준 확립은 첫 단계이며, 도표평정식은 관대화 오류가 발생할 수 있다."},"20-3-38":{"x":"후원금 사용 정보는 투명하게 공개해야 하며 책임성 확보의 기본이다. 개인정보 보호는 개인 식별정보에 한하며 후원금 사용 내역 자체를 미공개하는 것은 책임성 확보 노력이 아니다."},"20-3-39":{"x":"새로운 전문지식을 지속적으로 습득하고 직무연수 방식으로 제공되는 직원능력 개발 방법은 계속교육이다. 순환보직은 직무 순환 배치다."},"20-3-40":{"x":"복지다원주의는 국가 외에도 민간, 영리, 비공식 부문이 복지를 분담한다는 관점이어서 국가 주도의 공급은 맞지 않다."},"20-3-41":{"x":"소진은 직무 스트레스에 대한 반응으로, 목적의식과 관심을 서서히 잃어 가는 과정이며, 감정이입을 요구하는 대인서비스 직무에서 주로 나타난다. 세 설명 모두 옳다."},"20-3-42":{"x":"변혁적 리더십은 비전 제시, 지적 자극, 조직문화 창출을 강조한다. 금전적 보상 중심은 거래적 리더십이고, 사적 이익보다 조직 목표를 우선한다."},"20-3-43":{"x":"우편 등 매체를 통해 잠재 후원자에게 정보를 직접 전달하는 방식은 다이렉트 마케팅이다. 데이터베이스 마케팅은 축적된 고객 정보를 분석·활용하는 방식이다."},"20-3-44":{"x":"TQM은 전 구성원의 집단적 노력과 협력을 통해 지속적으로 품질을 개선하는 관리 철학이다. 현상 유지, 전문가 직관, 부서 간 경쟁, 전문가 주도 품질결정은 TQM과 반대되는 설명이다."},"20-3-45":{"x":"사회복지법인 및 사회복지시설 재무·회계규칙의 결산서 첨부서류에는 과목 전용조서, 사업수입명세서, 사업비명세서, 인건비명세서 등이 있다. 세입·세출명세서는 결산서 자체의 구성에 해당해 첨부서류가 아니다. 구체 조문은 현행 규칙으로 확인해야 한다."},"20-3-46":{"x":"사회복지전문요원(1987), 보건복지사무소 시범사업(1995), 사회복지사무소 시범사업(2004), 희망복지지원단(2012), 지역사회보장협의체(2015 법 개정 이후 정착) 순이다."},"20-3-47":{"x":"간트 차트는 헨리 간트가 개발한 막대 형태의 일정 도표로 활동 간 상관관계를 파악하기 어렵다. 순환적 과정은 PDCA, 주요 활동과 시간계획의 연결은 PERT에 가까운 설명이다."},"20-3-48":{"x":"성과목표는 프로그램 참여자에게 나타나는 변화의 정도를 제시한다. 자아존중감 10% 향상은 성과목표이고 나머지는 서비스 제공량을 나타내는 산출목표다."},"20-3-49":{"x":"품목별 예산은 지출 항목별로 통제하므로 예산 남용을 막고 회계책임을 명확히 하지만 신축적 집행에는 불리하다. 신축성 있게 집행할 수 있다는 설명이 옳지 않다."},"20-3-50":{"x":"전문가와 실무자들이 모여 상호 질의와 응답으로 자료를 모으는 방법은 초점집단조사(FGI)다. 델파이는 익명의 반복 설문을 통해 의견을 모으는 방식이다."},"21-3-26":{"x":"효과성은 조직의 목표를 얼마나 달성했는가를 나타낸다. 투입 대비 산출의 비율은 효율성이다."},"21-3-27":{"x":"사회복지관은 지역사회를 기반으로 주민의 복지 욕구를 해결하는 종합적 서비스 기관이다. 설치 의무나 사회복지전담공무원 고용 의무는 없고, 프로젝트 팀 구조 활용도 가능하다."},"21-3-28":{"x":"민간 사회복지기관은 국가나 지방자치단체의 보조금을 받는 경우가 많다. 보조금을 받지 않는다는 설명이 옳지 않다."},"21-3-29":{"x":"과학적 관리론은 과업을 과학적으로 분석하고 경제적 보상으로 생산성을 높이려 한 이론이다. 호손 실험은 인간관계론의 근거다."},"21-3-30":{"x":"조직 관리 방법이 환경과 조건에 따라 달라지고 최선의 단일 이론이 없다고 보는 것은 상황이론이다."},"21-3-31":{"x":"한국에서도 비영리조직에 대한 세제 혜택(기부금 소득공제, 법인세 감면 등)이 있다. 세제혜택이 없다는 설명이 옳지 않다."},"21-3-32":{"x":"공공기관과 민간기관, 시민단체 등이 함께 참여하는 지역 협력 네트워크는 지역복지 거버넌스 구축의 예다."},"21-3-33":{"x":"사회복지기관도 서비스 수요와 재원을 두고 다른 기관과 경쟁 또는 협력하므로 경쟁을 고려하지 않는다는 설명이 옳지 않다."},"21-3-34":{"x":"직원에 대한 관심은 높고 생산(과업) 관심은 낮아 화기애애한 분위기를 중시하는 유형은 관리격자의 (1,9)형 컨트리클럽형이다."},"21-3-35":{"x":"구성원의 참여동기 증대, 의사소통 활성화, 집단 지식 활용은 참여적 리더십의 장점이다."},"21-3-36":{"x":"채용, 배치, 평가, 승진은 인적자원관리 영역이지만 재무는 재정관리 영역이다."},"21-3-37":{"x":"OJT는 직장 내에서 상사나 선배가 일상 업무를 통해 가르치는 훈련이다. 조직 외부 교육기관에서 하는 것은 Off-JT다."},"21-3-38":{"x":"직무기술서는 직무 명칭, 직무 내용, 핵심 과업, 수행방법 등 직무 자체를 기술한 문서다. 급여 수준은 포함되지 않는다."},"21-3-39":{"x":"기획예산제도(PPBS)는 장기적 목표와 사업 계획을 연계해 미래의 비용까지 고려하는 제도다. 미래 비용을 고려하지 않는다는 설명이 옳지 않다."},"21-3-40":{"x":"후원금은 경기와 후원자 사정에 따라 변동하는 유동적 재원이다. 보조금과 이용료도 재원에 포함되며 모금 전략이 필요하다. 법인 전입금은 민간재원이다."},"21-3-41":{"x":"서비스 질은 사회복지평가의 핵심 기준 중 하나다. 서비스 질이 평가 기준이 될 수 없다는 설명이 옳지 않다."},"21-3-42":{"x":"보건복지사무소 시범사업(1995), 사회복지사무소 시범사업(2004), 행복e음 개통(2010), 읍·면·동 복지허브화(2016), 지역사회 통합돌봄(2018 이후) 순이다."},"21-3-43":{"x":"포괄성은 클라이언트의 다양한 욕구를 충족하기 위해 여러 서비스를 함께 제공해야 한다는 원칙이다. 한 가지 욕구를 전문가 집단이 해결하는 방식이라는 설명이 틀렸다."},"21-3-44":{"x":"방침관리기획(PDCA)은 계획-실행-점검-조치의 순환적 관리 사이클이며, 체계이론을 적용한 모델이라는 보기 설명이 옳지 않다. 논리모델, 전략기획, 간트, PERT 설명은 일반적으로 쓰이는 정의다."},"21-3-45":{"x":"마케팅 믹스 4P는 제품, 가격, 판촉(촉진), 입지(유통)다. 성과(performance)는 포함되지 않는다."},"21-3-46":{"x":"비영리조직 마케팅은 공익사업과 수익사업을 적절히 운영하고 후원자와 이용자의 욕구에 대응하기 위해 필요하다. 영리 추구만이 목적이 아니며, 비물질적 서비스도 마케팅 대상이고 재정 자립도 목표가 될 수 있다."},"21-3-47":{"x":"효과성은 목표 달성 정도를 평가하는 기준이고, 비용편익분석은 투입 비용과 편익을 비교하는 효율성 평가 방법이다. 효과성 평가를 위해 비용편익분석을 실시한다는 설명이 옳지 않다."},"21-3-48":{"x":"사회복지시설 평가는 3년마다 실시하고 평가 결과는 공표할 수 있으며 시설 지원에 반영할 수 있다. 따라서 ㄱ, ㄹ이 옳다. 구체적인 주기와 공표 규정은 현행 사회복지사업법으로 확인하길 권한다."},"21-3-49":{"x":"효율성은 투입 대비 산출의 비율이며 최소 비용으로 최대 효과를 거두는 것과 관련된다. 비용 절감도 서비스 목표 달성을 위한 자원 활용과 연결되므로 관련성이 없다는 설명이 옳지 않다."},"21-3-50":{"x":"지역사회 통합돌봄은 시설에서 지역사회로의 전환을 지원하는 정책이지, 생활시설 거주자의 퇴소를 금지하는 것이 아니다. 퇴소를 금지한다는 설명이 옳지 않다."},"22-3-26":{"x":"사회복지행정가는 대안 모색, 우선순위 결정, 조직이론 이해, 권한위임과 실행 능력을 갖춰야 하며 배타적 사고는 협력과 개방을 요구하는 행정 환경에 맞지 않는다."},"22-3-27":{"x":"사회복지행정의 실행 과정은 기획, 조직화, 촉진(지휘), 평가, 환류 순서로 이해한다. 목표와 계획을 세운 뒤 구조를 만들고 실행하며 결과를 평가해 다음 계획에 반영한다."},"22-3-28":{"x":"과학적 관리론에서는 관리자만 목표 설정 책임을 갖고 직원의 참여적 의사결정은 제한된다. 그래서 직원 참여를 지향하는 사회복지조직에 적용하기 어렵다."},"22-3-29":{"x":"상황이론은 조직을 둘러싼 사회·정치·경제·문화 환경 변수에 따라 효과적인 관리 방식이 달라진다고 본다. 시간·동작 연구는 과학적 관리론, 승진과 성취 욕구는 동기이론과 관련된다."},"22-3-30":{"x":"태스크포스(TF)는 특정 목표를 위해 전문가들로 구성하는 임시적 팀 조직으로, 환경 변화에 대응하기 위해 만드는 성격이 강하다. 세 설명 모두 옳다."},"22-3-31":{"x":"균형성과표(BSC)는 재무, 고객, 내부 프로세스, 학습과 성장의 네 관점에서 조직 성과를 관리하는 도구다. 공정한 직원 채용용 면접평가표가 아니다."},"22-3-32":{"x":"학습조직의 시스템 사고는 전체와 부분 간 역동적 관계를 이해하는 것이다. 자기숙련은 개인의 지속적 학습, 공유비전은 함께 만든 비전, 사고모형은 고정관념 점검, 팀학습은 대화와 협력을 통한 학습이다."},"22-3-33":{"x":"사회복지사업 정보와 지원대상자의 자격·수급이력 정보를 통합 관리하고 소득·재산 정보를 연계하는 시스템은 사회보장정보시스템이다. 복지로는 대국민 포털이다."},"22-3-34":{"x":"스키드모어의 기획은 목표 설정에서 출발해 가용자원 검토, 대안 모색, 결과 예측, 최종 대안 선택, 프로그램 실행계획 수립 순으로 진행한다."},"22-3-35":{"x":"예산 통제의 원칙에는 강제, 개별화, 효율성, 예외, 보고, 개정, 계획 등이 있다. 접근성은 해당하지 않는다."},"22-3-36":{"x":"사회복지관 예산 제출 시 첨부서류에는 예산총칙, 세입·세출 명세서, 임직원 보수 일람표, 이사회 또는 시설운영위원회 회의록 등이 있다. 사업수입 명세서는 결산서 첨부서류에 가깝다. 구체 조문은 현행 규칙으로 확인해야 한다."},"22-3-37":{"x":"책임성은 효과성과 효율성을 모두 고려해 입증해야 한다. 효율성을 배제하고 효과성만 극대화한다는 설명이 옳지 않다."},"22-3-38":{"x":"자녀와 비슷한 연령의 아이들을 돕고 싶다는 학부모의 욕구를 파악해 후원자로 참여시킨 것은 고객(후원자)과의 관계 형성을 중시하는 고객관계관리(CRM) 마케팅이다."},"22-3-39":{"x":"서비스 받은 수, 투입된 시간과 자원, 담당자의 활동은 모두 투입된 노력의 양을 측정하는 노력 기준이다."},"22-3-40":{"x":"공급주체의 다양화, 성과 강조와 마케팅 활성화, 기업 경영기법 도입은 최근 환경 변화다. 거주시설의 대규모화가 아니라 소규모화와 지역사회 중심으로 변화하는 추세다."},"22-3-41":{"x":"사회복지관의 서비스 최저기준은 시설 환경, 안전관리, 인력관리, 이용자 인권 등을 포함하며 시설의 규모 자체는 해당하지 않는다. 구체 항목은 현행 규정으로 확인해야 한다."},"22-3-42":{"x":"알더퍼의 ERG이론은 상위 욕구가 좌절되면 하위 욕구를 더 원하게 된다는 좌절-퇴행을 설명한다. 허즈버그는 불만요인을 위생요인으로, 매슬로우는 5단계를 제시했다."},"22-3-43":{"x":"변혁적 리더십은 비전 제시로 구성원이 스스로 혁신하도록 이끈다. 봉사를 핵심 가치로 하는 것은 서번트 리더십, 상벌 체계를 강조하는 것은 거래적 리더십이다."},"22-3-44":{"x":"직무명세는 직무수행에 필요한 지식·기능·능력을 기술하고, 직무평가는 조직 목표 달성에 대한 직무의 기여도와 상대적 가치를 평가한다. 직무분석은 직무명세 이전에 이루어진다."},"22-3-45":{"x":"허시와 블랜차드의 상황적 리더십은 구성원의 성숙도에 따라 리더십 유형이 달라져야 한다고 본다. 관리격자 모형은 행동이론이며 이상형은 9.9형이다."},"22-3-46":{"x":"참여적 리더십은 의사결정 참여로 협력과 동기부여 효과가 있지만 시간과 에너지가 더 든다. 의사결정 시간이 절약된다는 설명이 옳지 않다."},"22-3-47":{"x":"급여 유형(현금·현물·서비스 등)에 따라 적합한 전달체계가 다르므로 둘은 관련이 있다. 관련이 없다는 설명이 옳지 않다."},"22-3-48":{"x":"지역사회복지협의체(2005년경) → 희망복지지원단(2012) → 읍면동 복지허브화(2016) 순이다."},"22-3-49":{"x":"SERVQUAL에서 유형성은 시설, 장비, 직원 용모 등의 외형이다. 신뢰성은 약속한 서비스를 정확히 수행하는 능력, 확신성은 전문성과 정중함, 공감성은 개별적 관심, 반응성은 신속한 대응이다."},"22-3-50":{"x":"TQM은 개인보다 조직 전체의 협력과 팀워크를 중시한다. 개인 노력이 더 기여한다는 설명이 옳지 않다."},"23-3-26":{"x":"사회복지관에 대한 국고보조는 1989년 사회복지관 운영 지침이 시행되며 제도화되었고 2000년대에 처음 제도화된 것이 아니다. 따라서 2000년대에 제도화되었다는 설명이 옳지 않다."},"23-3-27":{"x":"조직화는 조직의 공식 구조를 통해 업무를 규정하는 활동이고 이사회 등에 활동을 보고하는 것은 보고 기능에 해당한다. 기획, 평가, 인사 설명은 옳다."},"23-3-28":{"x":"사회복지서비스는 성과를 계량화해 평가하기 어렵다는 특성이 있다. 행정가는 가치중립이 아니라 가치에 기반해 판단하며 재정관리와 효율성은 모두 행정에 포함된다."},"23-3-29":{"x":"사회적·심리적 욕구, 비공식 집단의 중요성, 비물질적 보상에 대한 민감성을 강조하는 이론은 인간관계론이다."},"23-3-30":{"x":"베버의 관료제는 합법적·합리적 권위에 기반한다. 전통적 권위에 의한 통제는 이상적 관료제와 맞지 않는다."},"23-3-31":{"x":"신공공관리론은 민간 경영기법과 시장 경쟁 원리를 도입해 정부 역할을 줄이려 했다. 민간 서비스를 정부가 직접 공급하게 했다는 설명은 반대다. 협치는 뉴거버넌스에 가깝다."},"23-3-32":{"x":"휴먼서비스 조직은 목표가 모호하고 기술이 불확실하다는 특성이 있다. 명확한 지식과 기술을 사용한다는 설명이 옳지 않다."},"23-3-33":{"x":"공식화 정도가 높으면 규정에 따라 업무를 처리하므로 직원의 재량이 줄어든다. 규모가 커지면 공식화가 높아지고 분권화가 높으면 권한이 분산된다."},"23-3-34":{"x":"조직의 본래 목적(프로그램 성과)보다 수단(모금실적)이 우선시되어 목표가 뒤바뀌는 현상은 목적전치다."},"23-3-35":{"x":"컨트리클럽형은 사람에 대한 관심은 높고 일에 대한 관심은 낮은 유형이다. 둘 다 높은 유형은 팀형(9.9)이다."},"23-3-36":{"x":"인적자원관리에는 보상관리가 포함되며 동기부여를 위해 중요하다. 보상관리가 해당되지 않는다는 설명이 옳지 않다."},"23-3-37":{"x":"직무기술서는 작업조건, 직무의 성격·내용·수행방법, 책임과 행동을 정리한 문서다. 종사자의 교육수준과 능력은 직무명세서에 해당한다."},"23-3-38":{"x":"슈퍼비전은 동료집단 간에도 이루어질 수 있다(동료 슈퍼비전). 수행되지 않는다는 설명이 옳지 않다."},"23-3-39":{"x":"품목별 예산은 수입과 지출을 항목별로 명시해 수립한다. 영기준 예산은 전년도 예산을 전제하지 않고 비용-편익을 따지며, 계획 예산은 장기 계획 중심, 성과주의 예산은 성과를 고려한다."},"23-3-40":{"x":"사회서비스는 공공, 민간, 영리 등 다양한 주체가 공급한다. 단일 공급주체에 의한다는 설명이 옳지 않다."},"23-3-41":{"x":"사고·사건 예방과 사후 대응을 포함하는 위험관리는 서비스 질 관리에 필요하다. TQM은 사회복지기관에도 적용할 수 있고 지속적 개선이 핵심이며, SERVQUAL에는 확신성이 포함된다. 유형성은 시설·장비 등 물리적 외형이고 즉각적 반응은 반응성이다."},"23-3-42":{"x":"주민생활지원서비스(2006) → 행복e음 개통(2010) → 읍·면·동 복지허브화(2016) → 지역사회 통합돌봄(2018 이후) 순이다."},"23-3-43":{"x":"쓰레기통 모형은 목표가 모호하고 기술이 불분명하며 참여가 유동적인 조직에서의 의사결정을 설명한다. 점증모형은 현재 상태에서 조금씩 변화하는 방식, 만족모형은 만족할 만한 수준에서 선택하는 방식이다."},"23-3-44":{"x":"정보화가 진행될수록 변화하는 기술을 학습하고 적응해야 하므로 학습조직의 필요성은 오히려 커졌다. 감소했다는 설명이 옳지 않다."},"23-3-45":{"x":"사회복지조직은 목표가 모호하고 성과 측정이 어려워 조직 목표 달성의 측정이 용이하다는 설명이 옳지 않다."},"23-3-46":{"x":"유통은 이용 접근성을 높이는 활동, 제품은 욕구 충족을 위한 재화·서비스다. 가격은 판매자가 임의로 정하는 금액이 아니라 이용자가 지불하는 비용을 포함하는 개념이고, 촉진은 홍보·광고 등 알리는 활동이다."},"23-3-47":{"x":"비용-효과분석은 결과를 금전이 아닌 단위로 비교하고, 비용-편익분석은 비용과 편익을 모두 금전 가치로 환산한다. 노력성은 투입된 자원 평가, 효과성은 목표 달성 정도 평가다. ㄴ, ㄷ, ㄹ이 옳다."},"23-3-48":{"x":"혁신은 조직 목표를 더 효과적으로 달성하기 위한 계획된 변화다. 사회환경 변화와 무관하지 않으며 내부 환경을 고려해야 성공하고 변혁적 리더십은 구성원의 변화를 이끈다."},"23-3-49":{"x":"비영리조직도 책임성과 서비스 질을 고려해 운영해야 한다. 수익성과 서비스 질을 고려하지 않는다는 설명이 옳지 않다."},"23-3-50":{"x":"사회복지조직에는 기업의 경영관리 기법 도입이 늘고 있다. 줄어들고 있다는 설명이 옳지 않다."},"24-3-26":{"x":"사회복지서비스는 대상이 인간이고 목표가 모호해 효과성을 객관적으로 입증하기 어렵다. 입증이 용이하다는 설명이 옳지 않다."},"24-3-27":{"x":"외국원조기관은 1970년대 전후에 철수했고 이후 자생적 단체와 정부 역할이 확대되었다. 1960년대 철수 후 성장했다는 시기 서술이 옳지 않은 것으로 출제되었다."},"24-3-28":{"x":"메이요의 호손 실험은 근로조건만이 아니라 심리적·사회적 요인이 생산성에 영향을 준다는 것을 보여 주었다. 비공식 집단과 사회적 상호작용이 중요하다."},"24-3-29":{"x":"상황이론은 조직을 개방체계로 보고 환경 상황에 따라 관리 방식이 달라진다고 본다. 폐쇄체계로 보며 내부 상황에 초점을 둔다는 설명이 옳지 않다."},"24-3-30":{"x":"과학적 관리론은 시간·동작 연구와 경제적 보상을 강조한다. 권위의 위계구조와 사적 감정 배제는 베버의 관료제 특성이다."},"24-3-31":{"x":"수직적 분화(계층)가 많아질수록 의사소통 경로가 길어져 절차가 복잡해진다. 집권화가 높으면 권한이 집중되고 공식화가 높으면 재량이 줄어든다."},"24-3-32":{"x":"일상 업무와 별도로 특별과업·문제해결을 위해 전문가 중심으로 구성하고 수직적 분화와 공식화가 낮은 구조는 위원회 구조다."},"24-3-33":{"x":"경직된 조직문화는 환경 변화에 적응하기 어렵게 한다. 불확실한 환경에 대처하도록 돕는다는 설명이 옳지 않다."},"24-3-34":{"x":"섬김 리더십은 인간 존중, 정의, 정직, 공동체 윤리를 강조하고 청지기 책무를 중시한다. 가치의 협상은 거래적 리더십 관련이며 지능·외모 강조는 특성이론이다."},"24-3-35":{"x":"급여와 근무환경 개선으로 불만족 요인을 줄이려는 접근은 허즈버그의 동기-위생이론에서 위생요인 관리에 해당한다."},"24-3-36":{"x":"인적자원관리의 구성요소는 확보, 개발, 보상, 유지(이직관리 포함)다. 정치는 구성요소가 아니다."},"24-3-37":{"x":"짧은 시간에 많은 사람에게 교육 내용을 체계적으로 전달하는 방식은 강의다. 멘토링, 감수성 훈련, 역할연기는 소수 참여형이다."},"24-3-38":{"x":"직무수행평가는 기준 확립, 기대치 전달, 직무수행 측정, 기준과 비교, 평가 결과 면담 순으로 진행한다."},"24-3-39":{"x":"시설을 운영하는 법인은 법인회계와 시설회계를 구분하여 관리한다. 통합 관리한다는 설명이 옳지 않다."},"24-3-40":{"x":"예산집행 통제 기제는 강제성을 갖는 규정을 포함해야 한다. 강제 규정을 두지 않는다는 설명이 옳지 않다."},"24-3-41":{"x":"SERVQUAL의 5개 차원은 신뢰성(약속대로 제공), 확신성(자신감·신뢰), 유형성(시설·환경), 반응성, 공감성이다. ㄱ은 신뢰성, ㄷ은 확신성, ㄹ은 유형성에 해당한다. 안전하게 제공했는가(ㄴ)는 별도 차원이 아니어서 제외된다."},"24-3-42":{"x":"지역사회복지협의체는 2015년 지역사회보장협의체로 명칭이 바뀌었다. 사회복지전문요원제는 전담공무원 제도 이전이다."},"24-3-43":{"x":"최소 비용으로 최대 효과를 얻는 것은 효율성이며 전문성과는 다르다. 전문성은 자격을 갖춘 사람이 업무를 담당하는 원칙이다."},"24-3-44":{"x":"대면하여 토의하되 집단 상호작용을 최소화하고 투표 등 민주적 방식으로 결정하는 기법은 명목집단기법이다."},"24-3-45":{"x":"활동 간 상호관계, 임계경로, 여유시간을 파악할 수 있는 일정 관리 기법은 PERT다. 간트 차트는 활동 간 연계를 보여주기 어렵다."},"24-3-46":{"x":"마케팅 과정은 고객 및 시장 조사, STP 전략 설계, 마케팅 믹스, 고객관계관리 순서로 이해한다."},"24-3-47":{"x":"다이렉트 마케팅은 우편, 전화, 이메일 등 개별 대상에게 직접 전달하는 방식이다. 방송·잡지 등 대중매체 활용은 맞지 않다."},"24-3-48":{"x":"표적 인구가 아닌 사람이 서비스에 접근해 자원을 낭비하게 되는 문제는 서비스 과활용이다. 크리밍은 성과가 높을 대상만 선별하는 문제다."},"24-3-49":{"x":"평가의 목적에는 책임성 이행이 있고, 재무·회계적 책임과 전문적 책임을 이행하는 것이 포함된다."},"24-3-50":{"x":"핵심 리더의 변화 노력에 대한 구성원의 공개 지지는 혁신을 촉진하는 요인이지 방해 요인이 아니다."},"25-3-26":{"x":"사회복지행정은 사회복지정책을 구체적인 서비스로 전환하는 과정이다. 정부와 민간조직 모두를 대상으로 하며 가치가 개입되고 효과성과 효율성을 모두 중시한다."},"25-3-27":{"x":"2008년 노인장기요양보험제도 도입 이후 민간기관의 참여가 오히려 확대되었다. 금지되었다는 설명이 옳지 않다."},"25-3-28":{"x":"과학적 관리론, 관료제이론, 인간관계론의 설명은 옳다. 상황이론은 조직 상황에 따라 효과적인 방법이 달라진다고 보므로 상황과 무관한 이상적 방법을 추구한다는 설명이 옳지 않다."},"25-3-29":{"x":"신공공관리는 시장원리를 도입하고 규모 축소, 분권화와 권한 위임을 추구한다. 조직 확장과 중앙집권화를 지향한다는 설명이 옳지 않다."},"25-3-30":{"x":"비영리조직은 이윤을 구성원에게 배당하지 않고 조직 목적에 재투자한다. 배당한다는 설명이 옳지 않다."},"25-3-31":{"x":"위기와 갈등을 신속하게 해결하는 데는 일반적으로 권한이 집중된 집권화가 유리하다. 분권화의 특성으로 보기 어렵다."},"25-3-32":{"x":"특정 사업을 위해 기존 부서에서 인력을 파견하고 임시로 활동하다가 과업이 끝나면 해체되는 조직은 태스크포스다."},"25-3-33":{"x":"허즈버그의 동기요인은 성취, 인정, 업무 자체, 책임감, 성장 등이다. 급여, 근로조건, 인간관계, 기술적 감독은 위생요인이다."},"25-3-34":{"x":"관리격자는 인간에 대한 관심과 생산(과업)에 대한 관심 두 축으로 구성된다. 중도형(5.5)은 두 요소 사이의 타협과 균형을 추구하고 이상형은 팀형(9.9)이다."},"25-3-35":{"x":"직무설계는 직무 내용, 수행방법, 직무 간 관계를 설정하는 것이다. 직무분석은 직무의 정보를 수집하는 것이고 직무기술서는 직무 내용, 직무명세서는 수행자 자격 요건을 기술한다."},"25-3-36":{"x":"직원의 정신적·심리적 부담을 완화하는 것은 슈퍼비전의 지지적 기능이다. 교육적 기능은 지식과 기술을 가르쳐 역량을 높이는 기능이다."},"25-3-37":{"x":"프로그램 예산은 사업(프로그램)의 목적과 성과를 중심으로 편성하며 지출 품목을 강조하는 것은 품목별 예산이다."},"25-3-38":{"x":"사회복지법인에서도 예산 전용은 가능하며, 관·항 간 전용은 이사회 의결 등 절차를 거치고 목 간 전용은 비교적 자유롭다. 전용할 수 없다는 설명이 옳지 않다. 세부 요건은 현행 규칙으로 확인해야 한다."},"25-3-39":{"x":"예산은 편성한 뒤 시설운영위원회에 보고하고 법인 이사회 의결을 거쳐 지방자치단체에 제출하고 공고하는 순서로 진행한다."},"25-3-40":{"x":"직원의 지식수준과 정중함, 신뢰와 확신을 주는 능력은 확신성(assurance)이다. 즉응성은 신속한 대응, 신뢰성은 약속 이행, 공감성은 개별적 관심이다."},"25-3-41":{"x":"지역사회통합돌봄과 원스톱 서비스로 서비스의 단편성과 비연속성을 해결하려는 원칙은 통합성이다."},"25-3-42":{"x":"사회복지법인은 민간 전달체계에 속한다. 행정복지센터와 공단은 공공 전달체계이므로 사회복지법인을 공공이라 한 설명이 옳지 않다."},"25-3-43":{"x":"PERT는 활동 간 선후 관계와 소요시간을 확률적으로 추정하므로 일정 변경이나 유동적 상황에 대처하기 용이하다. 어렵다는 설명이 옳지 않다."},"25-3-44":{"x":"정보관리는 책임성, 효과성, 전문성 강화에 중요하지만 사회복지조직에서 가장 우선하는 일이라고 할 수는 없다. 최우선이라는 설명이 옳지 않다."},"25-3-45":{"x":"쓰레기통 모형은 조직화된 무질서 상황에서 문제, 해결책, 참여자, 선택 기회가 우연히 만나 의사결정이 이루어진다고 본다. 합리적·체계적 의사결정과 거리가 멀다."},"25-3-46":{"x":"비영리조직도 책임성과 효과성 요구가 커지면서 마케팅의 중요성이 커졌다. 마케팅은 판매나 이윤이 아니라 욕구 충족과 자원 확보가 목적이며 후원자뿐 아니라 이용자도 대상이다."},"25-3-47":{"x":"책임성 요구가 늘면서 서비스의 질적 평가도 강화되고 있다. 질적 평가가 제외되었다는 설명이 옳지 않다."},"25-3-48":{"x":"최근 사회복지조직에는 기업 경영 방식 활용이 늘고 있다. 민간 공급이 확대되고 성과 중심 평가로 전환되며 전문가 활용은 늘고 있다."},"25-3-49":{"x":"비용-편익분석은 효율성 평가이고, 총괄평가는 종결 후 성과를 평가한다. 비용-효과분석은 효율성 평가 방법이므로 효과성 평가라는 ㄴ은 옳지 않다."},"25-3-50":{"x":"사회복지서비스는 생산과 소비가 동시에 이루어지는 특성이 있어 마케팅 전략에서 이를 고려한다. 시장조사를 하고 클라이언트도 대상이 될 수 있다."},"26-3-26":{"x":"브룸의 기대이론은 노력이 성과로, 성과가 보상(결과)으로 이어진다는 기대와 보상의 가치를 강조한다. 제도와 절차를 강조하는 이론은 아니다."},"26-3-27":{"x":"직원들이 자신감이 부족한 상황에서 리더가 지원과 지시를 제공하며 목표 달성을 돕는 모습은 하우스의 경로-목적이론에 해당한다."},"26-3-28":{"x":"사회복지사무소 시범사업(2004), 사회서비스 전자바우처(2007), 희망복지지원단(2012), 지역사회 통합돌봄 선도사업(2019) 순이다."},"26-3-29":{"x":"사회복지행정에서는 정책, 클라이언트, 종사자 간 목표에 대한 합의점을 찾기가 어렵다. 용이하다는 설명이 옳지 않다."},"26-3-30":{"x":"SERVQUAL에서 신뢰성은 약속한 서비스를 정확하게 수행하는 것이다. 즉응성은 신속한 대응, 공감성은 관심, 확신성은 전문성과 신뢰, 유형성은 시설·환경이다."},"26-3-31":{"x":"희망복지지원단은 2012년 시·군·구에 구축되기 시작했다. 행복e음은 2010년, 지역사회보장협의체는 2015년 명칭 변경, 장애등급제는 2019년에 폐지되었다."},"26-3-32":{"x":"조직 외부와 내부에서 역량 있는 사람을 찾고 업무능력·인성·헌신 등을 고려하는 과정은 직원 모집과 채용이다."},"26-3-33":{"x":"인간관계이론도 생산성 향상을 목표로 하며, 직원 만족이 생산성에 미치는 영향에 주목한다. 만족과 보상을 가장 중요한 목표로 한다는 설명이 옳지 않다."},"26-3-34":{"x":"성과평가는 인적자원개발 방향 설정, 직무수행의 조직 전략 부합 여부 파악, 임금·승진·전환배치 등 인사결정 정보를 얻는 데 쓰인다. 수급이력 통합은 정보시스템 기능이다."},"26-3-35":{"x":"접근성은 서비스 이용에 장애가 되는 지리, 비용, 정보 등을 줄이는 원칙이다. 이용자의 비용 부담을 고려하지 않는다는 설명이 옳지 않다."},"26-3-36":{"x":"TQM에서 품질은 조직의 일차적 목적이고(ㄱ), 변화와 개선은 지속적으로 이루어져야 한다(ㄷ). 품질을 결정하는 것은 직원이 아니라 고객이므로 ㄴ은 틀리고, 서비스 질은 제공 이후가 아니라 전 과정에서 고려해야 하므로 ㄹ도 틀리다. 따라서 ㄱ, ㄷ이 정답이다."},"26-3-37":{"x":"슈퍼바이저는 교육·지지·행정 기능으로 직원의 능력을 향상시킨다. 비생산적인 부서를 해체·축소하는 일은 슈퍼바이저의 역할이 아니다."},"26-3-38":{"x":"논리모델은 투입-활동-산출-성과를 도식화하는 기법이다. 임계경로는 PERT/CPM, 시간별 과업 막대는 간트 차트, PDCA는 순환적 과정 점검과 관련된다."},"26-3-39":{"x":"체계이론은 조직을 유기적으로 상호작용하는 하위체계로 구성된 개방체계로 본다. 관료제는 수직적 위계, 상황이론은 환경 영향을 중시한다."},"26-3-40":{"x":"마케팅 믹스 4P는 가격, 장소(유통), 제품, 촉진이다."},"26-3-41":{"x":"추가경정예산은 확정된 날부터 7일 이내에 시장·군수·구청장에게 제출한다. 예산총계주의를 따르고 법인 이사회 의결과 시설운영위원회 보고를 거친다. 구체 기간은 현행 규칙으로 확인해야 한다."},"26-3-42":{"x":"기능 조직과 프로젝트 조직을 결합한 유형은 매트릭스 조직이고, 정해진 기간 동안만 임시로 편성한 조직은 태스크포스다."},"26-3-43":{"x":"조직 부서가 지역으로 분산될수록 공간적 분화가 커져 복잡성이 높아진다. 낮아진다는 설명이 옳지 않다."},"26-3-44":{"x":"사회복지시설 평가는 사회복지사업법에 따라 3년마다 실시한다. 4년 주기라는 설명이 옳지 않다."},"26-3-45":{"x":"지역사회 통합돌봄은 지역사회에서 돌봄을 통합 제공하는 정책이며 사회서비스를 대폭 축소하는 것이 아니다. 오히려 서비스 연계와 확대에 초점이 있다."},"26-3-46":{"x":"리더십과 슈퍼비전은 위계 여부와 관계없이 동료 간에도 이루어질 수 있다. 위계서열이 없는 조직에서만 수행된다는 설명이 옳지 않다."},"26-3-47":{"x":"비영리조직은 조세감면 혜택을 받을 수 있다. 수입을 구성원에게 배당하지 않고 수익사업도 운영할 수 있으며 후원금 외에도 보조금과 이용료로 운영된다."},"26-3-48":{"x":"직무분석을 먼저 한 뒤 그 결과로 직무기술서와 직무명세서를 작성한다. 직무분석 이전에 작성한다는 설명이 옳지 않다."},"26-3-49":{"x":"사회복지조직의 마케팅은 대량소비와 이윤추구가 목적이 아니라 책임성, 고객만족, 후원자 개발과 재정 확보, 환경 분석을 위해 필요하다."},"26-3-50":{"x":"급여 인상과 승진에서 형평성 확보를 강조하고 직원의 지각을 살피는 것은 아담스의 공정성(형평성)이론이다."}},"data/e_cm.json":{"17-2-51":{"x":"여러 이익집단이 정책과정에 영향을 미치고 정책이 이익집단 간 갈등과 타협의 산물이라고 보는 이론은 다원주의이론입니다."},"17-2-52":{"x":"워렌의 지역사회 기능 비교 척도는 자치성, 서비스 영역의 일치성, 심리적 동일시, 수평적 유형입니다. '사회성: 사회적 분화 정도'는 비교 척도가 아닙니다."},"17-2-53":{"x":"퇴니스는 사회가 공동사회에서 이익사회로 변화한다고 보았습니다. 이익사회에서 공동사회로 발전한다는 설명이 틀렸습니다."},"17-2-54":{"x":"주민이 자유롭게 의견을 제시할 기회가 없었던 문제는 효과적인 의사소통의 개발과 유지 원칙으로 해결합니다."},"17-2-55":{"x":"외부 재정지원자의 요구를 무시하기 어려운 상황에서 후원기관을 다양화해 자율성을 확대한 것은 권력의존이론으로 설명합니다. 의존 대상을 늘려 의존도를 낮추는 전략입니다."},"17-2-56":{"x":"사회복지관의 운영 근거는 사회복지사업법입니다. 사회보장기본법이 아닙니다. 3번이 틀렸습니다."},"17-2-57":{"x":"사회서비스 부서 창설, 대인사회서비스, 서비스의 협력과 통합을 제안한 영국 보고서는 시봄보고서(1968)입니다."},"17-2-58":{"x":"조선시대 흉년으로 인한 이재민과 빈민을 구제한 국가기관은 진휼청입니다. 활인서는 도성 내 병자 구료, 동서대비원은 병자·빈민 구호 기관입니다."},"17-2-59":{"x":"선출된 공무원, 재단, 정부기관을 표적으로 하고 조직을 일차적 구성원으로 하며 중재자, 협상가, 대변인 역할을 하는 웨일과 갬블의 모델은 연합입니다."},"17-2-60":{"x":"대표성 있는 참여자를 선택해 한곳에 모아 개방형 질문으로 토론하게 하는 방법은 초점집단 기법입니다."},"17-2-61":{"x":"지역사회복지운동은 조직운동, 생활운동, 사회권 확립운동, 연대운동 등입니다. 노동자 소득을 높이는 민중운동은 지역사회복지운동으로 보지 않습니다."},"17-2-62":{"x":"로스만의 지역사회개발모델의 변화전술은 합의와 집단토의입니다.\n\n분석전문가는 사회계획모델, 소비자 역할은 사회계획·사회행동의 구분이며, 약물중독 같은 특정 집단이나 제도 변화는 사회행동·사회계획 모델과 관련됩니다."},"17-2-63":{"x":"잠재적 수급권자 파악, 자산조사와 욕구조사, 서비스 의뢰, 취업정보 알선은 자원연결자 역할입니다."},"17-2-64":{"x":"지방자치는 주민의 참여 기회(ㄱ), 맞춤형 프로그램(ㄴ), 지방행정부서의 역할 강화(ㄷ), 비정부조직의 자원 활용(ㄹ)에 긍정적 영향을 주었습니다."},"17-2-65":{"x":"참여자의 적응 촉진과 저항·갈등 관리는 계획을 실행하는 실행단계의 활동입니다."},"17-2-66":{"x":"지역사회보장계획은 보건의료뿐 아니라 복지, 주거, 고용, 문화 등을 포함합니다. 주택·고용·문화를 제외한다는 설명이 틀렸습니다."},"17-2-67":{"x":"조직화 기술에는 회의, 협상, 이슈 설정, 지도자 발굴 기술 등이 있습니다. 주민통제는 조직화 기술이 아닙니다."},"17-2-68":{"x":"점검단계에서는 진척도를 파악하고(ㄱ), 갠트 차트를 활용할 수 있으며(ㄴ), 욕구조사에서는 주요 정보제공자 인터뷰, 포럼, 사회지표를 활용합니다(ㄹ).\n\n평가단계에서는 결과평가만이 아니라 과정평가도 합니다(ㄷ은 틀림)."},"17-2-69":{"x":"연계 기술은 자원연결자 역할과 연결됩니다. 옹호자 역할은 옹호 기술과 연결되므로 2번의 연결이 틀렸습니다."},"17-2-70":{"x":"마을기업은 지역공동체 이익을 추구하고 지역자원을 활용하며(ㄱ), 협동조합은 조합원 권익 향상과 지역사회 공헌을 목적으로 합니다(ㄷ).\n\n사회적 기업은 영업활동을 하면서 사회적 목적을 추구하는 기업이고(ㄴ은 틀림), 지역자활센터는 사회복지법인만 신청할 수 있는 것이 아닙니다(ㄹ은 틀림)."},"17-2-71":{"x":"지역사회보장협의체는 민·관 협력 네트워크로 운영되며, 민간사회복지기관에 대한 감사·평가를 하는 기구가 아닙니다."},"17-2-72":{"x":"지역사회보장계획은 5년이 아니라 4년 단위로 수립합니다(사회보장급여법). 5년 단위 지역사회복지계획이라는 설명이 틀렸습니다."},"17-2-73":{"x":"사회자본은 신뢰와 호혜성에 기반한 관계로, 사용할수록 증가하며 총량이 고정되어 있지 않습니다. 3번이 틀렸습니다."},"17-2-74":{"x":"옹호는 사회정의를 지키려는 목적(ㄱ)이며, 대상에 강력한 영향력이나 압력을 행사하고(ㄷ), 정당한 처우나 서비스를 받지 못할 때 활용합니다(ㄹ)."},"17-2-75":{"x":"희망복지지원단은 시·군·구에 설치되어 지역 내 자원과 서비스를 총괄적으로 조정하는 통합사례관리 조직입니다.\n\n드림스타트는 공공 사업이고, 공모사업은 기획배분이며(지정기탁은 기부자가 지정), 지역아동센터는 보호·교육·문화 등을 제공하고, 건강가정지원센터는 시·군·구에 설치합니다."},"18-2-51":{"x":"길버트와 스펙트가 사회복지제도로 정착되었다고 한 지역사회 기능은 상부상조 기능입니다. 사회통합 기능이 아닙니다. 5번이 틀렸습니다."},"18-2-52":{"x":"지역사회개발은 주민의 참여와 주도를 강조합니다. 전문가에 의한 주도적 개입을 강조한다는 설명이 틀렸습니다."},"18-2-53":{"x":"사회복지관 국고보조금 지침은 1980년대 후반에 마련되었습니다. 1970년대라는 설명이 틀렸습니다."},"18-2-54":{"x":"미국에서는 1970년대 인종차별 금지와 반전운동이 지역사회조직사업을 촉진했습니다."},"18-2-55":{"x":"그리피스 보고서(1988)는 지방정부에 권한과 재정을 이양할 것(ㄱ), 케어 매니지먼트(ㄷ), 서비스 제공 주체의 다양화(ㄹ)를 강조했습니다.\n\n지방정부는 직접 공급자가 아니라 조정자·구매자 역할을 해야 한다고 했습니다(ㄴ은 틀림)."},"18-2-56":{"x":"1:1 관계망 프로그램은 참여, 호혜성, 네트워크, 교환 개념과 관련됩니다. 진화와는 관계가 없습니다."},"18-2-57":{"x":"원도심의 공동화, 농촌의 인구 변화, 지역 계층화와 같이 공간 구조의 변화를 설명하는 이론은 생태체계이론입니다."},"18-2-58":{"x":"사회운동모델의 성취목표는 사회정의를 위한 행동입니다(ㄱ).\n\n근린지역사회조직모델의 사회복지사 역할은 조직가이고(ㄴ은 틀림), 사회계획모델의 관심은 대상자를 위한 서비스 계획이 아닌 지역사회 문제의 계획입니다(ㄷ은 틀림), 정치·사회행동모델의 일차적 구성원은 시민입니다(ㄹ은 틀림)."},"18-2-59":{"x":"로스만의 지역사회개발모델은 변화전략으로 문제 확인과 해결에 주민이 참여하도록 합니다. 표적대상에 대한 조치를 위해 주민을 동원하는 것은 사회행동모델의 전략입니다."},"18-2-60":{"x":"갈등이론, 다원주의, 시민 참여의 극대화, 교육자·자원개발자·운동가 역할은 테일러와 로버츠의 정치적 권력강화모델입니다."},"18-2-61":{"x":"마을 축제를 위해 주민을 조직화하고 주민이 스스로 하도록 한 사례에서는 참여 유도, 역량강화, 지역특성 반영, 갈등 중재가 해당합니다. 취약계층의 권리를 대변하는 것은 옹호 활동입니다."},"18-2-62":{"x":"조례 제정을 위한 입법활동으로 학생의 건강권을 확보하려는 것은 옹호자의 핵심 역할입니다."},"18-2-63":{"x":"바자회를 열고 후원단체를 발굴하는 자원개발에서는 기관의 신뢰성을 형성·유지하는 노력이 필요합니다."},"18-2-64":{"x":"지원 가능한 급여와 서비스를 알려주어 이용하게 한 것은 자원연결자 역할입니다."},"18-2-65":{"x":"초기 욕구사정은 욕구의 상대적 중요성과 우선순위를 확인하고 서비스 접근성을 보는 것이며, 성과평가가 아닙니다."},"18-2-66":{"x":"욕구의 내용 결정에 초점을 두고 참여자가 직접 만나 우선순위를 정하며 반복을 통해 합의에 이를 수 있는 방법은 명목집단기법입니다."},"18-2-67":{"x":"인과관계에 근거한 개입가설 개발은 문제 분석이 아니라 개입전략 개발 단계의 활동입니다. 문제 분석에서는 문제의 원인, 영향, 표적집단을 분석합니다. 2번의 연결이 틀렸습니다."},"18-2-68":{"x":"지역자활센터는 조건부수급자뿐 아니라 일반수급자, 차상위계층 등 저소득층 전반을 대상으로 자활사업을 합니다. 조건부수급자만을 대상으로 한다는 설명이 틀렸습니다."},"18-2-69":{"x":"주민복지증진, 주민조직화, 사례 발굴과 개입, 아동·청소년 사회교육과 문화복지를 모두 수행하는 기관은 사회복지관입니다."},"18-2-70":{"x":"사회적기업은 영업활동을 하며 이윤을 창출할 수 있고, 이윤을 사회적 목적에 재투자합니다. 이윤창출이 제한된다는 설명이 틀렸습니다."},"18-2-71":{"x":"시·군·구 지역사회보장계획은 지역사회보장협의체의 심의를 거쳐 시·군·구 의회에 보고합니다. 의회의 심의와 협의체의 보고라는 서술은 순서와 주체가 바뀌었습니다. 3번이 틀렸습니다. 수립 주기와 제출 시기 같은 세부 내용은 법 개정으로 달라질 수 있으니 현행 사회보장급여법으로 확인하세요."},"18-2-72":{"x":"지역사회보장계획의 심의·자문과 사회보장급여에 관한 사항 등은 대표협의체가 담당하고, 실무협의체는 실무적 협의와 지원을 합니다. 실무협의체가 시·군·구의 사회보장급여 제공을 심의·자문한다는 설명이 틀렸습니다."},"18-2-73":{"x":"아른스테인 주민참여 8단계 중 주민이 계획에 우월한 결정권을 행사하고 집행에서도 강력한 권한을 갖는 단계는 권한위임입니다. 주민통제는 가장 높은 단계입니다."},"18-2-74":{"x":"지방자치단체는 지역 특성에 맞는 사회적기업 지원시책을 수립·시행해야 하고(ㄱ), 탈시설 경향으로 지역사회 중심 복지체계가 중요해졌습니다(ㄴ).\n\n읍면동 복지허브화는 지역사회복지 네트워크를 강화하는 방향입니다(ㄷ은 틀림)."},"18-2-75":{"x":"복지재정의 분권화로 지방자치단체 재정 격차에 따른 지역 간 사회복지 불균형이 나타났습니다."},"19-2-51":{"x":"힐러리가 제시한 지역사회의 기본 요소는 사회적 상호작용, 공동의 유대감, 지리적 영역의 공유입니다."},"19-2-52":{"x":"영국의 흐름은 토인비홀 설립(1884) → 정신보건법 제정(1959) → 시봄보고서(1968) → 하버트보고서(1970년대 후반) → 그리피스보고서(1988)입니다."},"19-2-53":{"x":"웨일과 갬블의 프로그램 개발과 지역사회연계 모델에서 사회복지사의 역할은 계획가, 관리자, 프로포절 제안자입니다."},"19-2-54":{"x":"지역사회의 역량은 다양성 존중과 사회가치의 공유(ㄱ), 구성원의 자율성 유지와 공동 이익의 극대화(ㄷ), 법적 테두리 내에서 공동선의 추구와 조정(ㄹ)으로 높아집니다.\n\n하위집단의 동질성만 강조하면 통합을 해칠 수 있습니다(ㄴ은 틀림)."},"19-2-55":{"x":"지역사회복지실천은 지역사회의 고유한 특성과 문제를 고려해야 합니다. 지역사회의 특성과 문제를 일반화하는 것은 원칙에 맞지 않습니다."},"19-2-56":{"x":"자원 배분과 권력 이양은 사회행동모델이 성취하는 목표이고, 복잡한 문제를 조사·분석해 해결방안을 찾는 것은 사회계획모델입니다."},"19-2-57":{"x":"2000년대 이후 시·군·구 희망복지지원단 설치(ㄴ)와 지역사회서비스투자사업 실시(ㄹ)가 영향을 주었습니다.\n\n지방자치단체장의 직접 선출(ㄱ, 1995)과 영구임대아파트단지 내 사회복지관 건립 의무화(ㄷ, 1989 이후)는 1990년대 이전의 일입니다."},"19-2-58":{"x":"행동에 영향을 준 사회·경제·정치적 구조와 문화적 가치, 규범의 의미를 해석해야 한다는 관점은 사회구성론입니다."},"19-2-59":{"x":"지역사회복지운동은 주민이 주체가 되는 것입니다. 서비스 제공기관의 주도성 강화를 목적으로 한다는 설명이 틀렸습니다."},"19-2-60":{"x":"당사자들이 문제의식을 갖게 하고 스스로 문제해결능력을 키우도록 하는 것은 조직화 기술입니다."},"19-2-61":{"x":"전문가로 구성된 정보제공자에게 여러 번 설문을 반복해 합의에 이르는 방법은 델파이기법입니다."},"19-2-62":{"x":"지역사회 복지의제 개발과 주민 의식화는 연계기술이 아니라 조직화 기술과 관련된 내용입니다. 5번이 틀렸습니다."},"19-2-63":{"x":"총괄평가는 프로그램이 끝난 뒤 결과를 평가하는 것입니다. 수행 중 문제점을 관찰·수정하는 평가는 형성평가입니다. 4번이 틀렸습니다."},"19-2-64":{"x":"지방자치단체에 별도의 조치를 요청하기 위해 다수인의 서명지를 전달하는 활동은 청원입니다."},"19-2-65":{"x":"조력자는 불만을 집약하고(ㄱ), 주민들에게 공동의 목표를 강조합니다(ㄹ).\n\n문제 조사·평가는 조사자·분석가, 옹호와 대변은 옹호자의 역할입니다."},"19-2-66":{"x":"행정기관이 일방적으로 교육·설득하고 주민은 단순히 참여하는, 권력분배가 가장 낮은 수준은 조작입니다."},"19-2-67":{"x":"실무분과는 지역사회보장계획의 연차별 시행계획을 모니터링하는 역할을 합니다.\n\n통합사례관리 지원이나 계획의 의회 보고는 협의체의 역할이 아니고, 사회복지법인 이사의 추천은 협의체와 무관하며, 읍·면·동 협의체는 실무협의체의 지원 대상이 아닙니다."},"19-2-68":{"x":"계획 수립 과정은 지역사회보장조사(ㄷ) → 비전·목표 수립(ㅂ) → 세부사업 계획(ㄱ) → 행·재정계획(ㄹ) → 협의체 심의(ㄴ) → 의회 보고(ㅁ) 순입니다."},"19-2-69":{"x":"기초지방자치단체 간 사회보장의 균형 발전 노력은 시·군·구 지역사회보장계획에 포함되지 않습니다."},"19-2-70":{"x":"읍·면·동 지역사회보장협의체는 복지대상자 발굴, 지역특화사업, 자원 발굴과 연계, 인적안전망 구축을 합니다. 지역사회보장지표의 생성은 역할이 아닙니다."},"19-2-71":{"x":"사회복지공동모금회의 신청사업은 공모형태로 진행되나, 프로그램사업과 긴급지원사업으로 나눈다는 설명은 이 시험에서 옳지 않은 것으로 처리되었습니다."},"19-2-72":{"x":"사회적 기업은 취약계층에게 일자리를 제공하고 영업활동을 하며, 영리를 추구하지 않는 조직이 아닙니다. 3번이 틀렸습니다."},"19-2-73":{"x":"사회복지협의회는 사회복지사업법에 근거한 법정단체로, 사회복지시설 및 기관 중심으로 지역사회복지 증진을 목적으로 합니다."},"19-2-74":{"x":"독거노인의 복합적·장기적 욕구를 사정하고 서비스 제공과 점검계획을 세우는 것은 사례관리이고, 주민봉사단을 조직하는 것은 주민조직화입니다."},"19-2-75":{"x":"사회보장정보시스템(행복e음)은 2010년에 개시되어 읍면동 개편과 직접 관계가 없는 현상입니다."},"20-2-51":{"x":"던햄은 사회복지기관이 조직운영과 실천에서 민주적이어야 한다고 했습니다.\n\nUN은 정부의 적극적 지원을 강조했고, 로스는 초기에 누구나 참여할 수 있는 사업부터 하라고 했으며, 맥닐은 지역사회의 자기결정을 존중하되 자발적 사업을 지지했고, 워렌은 지역사회의 이익 옹호와 권력집중을 목적으로 보지 않았습니다."},"20-2-52":{"x":"지역사회의 기능을 사회통제, 사회통합 등 다섯 가지로 구분한 학자는 길버트와 스펙트입니다. 로스가 아닙니다."},"20-2-53":{"x":"2010년 사회복지통합관리망(행복e음)이 구축되었습니다.\n\n국민기초생활보장제도는 2000년 시행이고, 협동조합기본법은 2012년 제정, 희망복지지원단은 2012년 이후 운영, 주민자치센터가 행정복지센터로 바뀐 것은 2016년 이후입니다."},"20-2-54":{"x":"1990년대에 사회복지공동모금제도가 실시되었고(ㄴ), 2000년대에 지역사회복지계획 수립이 법제화되었습니다(ㄷ).\n\n재가복지서비스는 1990년대에 도입되었습니다(ㄱ은 틀림)."},"20-2-55":{"x":"갈등이론은 갈등을 사회적 과정의 본질로 봅니다(ㄱ).\n\n특정 소수 집단의 역할을 중시하는 것은 엘리트 이론이고(ㄴ), 교환적 활동을 강조하는 것은 사회교환이론이며(ㄷ), 갈등이론은 사회문제를 개인의 적응이 아니라 사회변화로 해결하려 합니다(ㄹ)."},"20-2-56":{"x":"특정 문화가 있는 지역에서 일어나는 억압도 정당화될 수 없습니다. 문화에 대한 이해가 억압을 인정한다는 뜻은 아니므로 5번이 틀렸습니다."},"20-2-57":{"x":"주민 교육으로 역량을 강화해 복지관 사업에 참여시키는 것은 사회학습이론, 후원기관을 다양화해 한 곳에 대한 의존을 줄이는 것은 권력의존이론으로 설명합니다."},"20-2-58":{"x":"권력구조에 대항하는 것은 사회행동모델의 특징입니다. 사회계획모델은 전문가가 문제를 분석해 해결책을 제시하는 모델입니다. 3번이 틀렸습니다."},"20-2-59":{"x":"저항과 갈등 관리는 계획을 실행하는 실행단계의 활동입니다. 평가단계에서는 결과와 과정을 평가합니다."},"20-2-60":{"x":"업무 설계 기제로 구체적 실행 방법을 명시하고 개별 기관이 다룰 수 있는 범위의 이슈를 해결하는 활동은 프로그램 기획입니다."},"20-2-61":{"x":"네트워크는 목적에 따라 느슨한 결속도 유용합니다. 항상 강한 결속력이 필요하다는 설명(ㄱ)이 틀렸습니다."},"20-2-62":{"x":"권력 키우기, 의식 고양하기, 공공의제 만들기, 사회자본 확장은 모두 임파워먼트 기술입니다."},"20-2-63":{"x":"주민의 관점에서 개발계획을 수립하고 주민이 사회·경제적 투자를 이용하도록 준비시키는 웨일과 갬블의 모델은 지역사회 사회·경제개발모델입니다."},"20-2-64":{"x":"자금을 제공하는 것은 평가자의 기술이 아닙니다. 평가자는 성과를 점검하고 평가하는 역할을 합니다."},"20-2-65":{"x":"주거지원 서비스를 위해 자원을 연결하고 계획하는 역할은 관리자, 정보전달자, 네트워커, 계획가입니다. 후보자는 해당하지 않습니다."},"20-2-66":{"x":"협상은 사회행동모델에서도 사용할 수 있습니다. 사용할 수 없다는 설명이 틀렸습니다."},"20-2-67":{"x":"지방자치가 발달하면 중앙정부의 권한이 지방으로 이양되므로 중앙정부의 책임과 권한이 강화되는 것은 아닙니다."},"20-2-68":{"x":"시·군·구 지역사회보장계획에는 전달체계의 조직과 운영, 부정수급 현황과 방지대책, 사각지대 발굴·지원 방안, 분야별 추진전략과 중점 사업이 포함됩니다. 모두 정답표 기준으로 옳습니다. 계획의 세부 항목은 법 개정으로 달라질 수 있으니 현행 사회보장급여법으로 확인하세요."},"20-2-69":{"x":"시·군·구 지역사회보장협의체가 심의·자문하는 내용에는 사회보장 추진, 급여 제공, 계획의 수립·시행·평가, 읍·면·동 협의체의 구성·운영이 있습니다. 특별자치시는 시·도 단위의 협의체 사항이어서 5번은 시·군·구 협의체의 내용이 아닙니다."},"20-2-70":{"x":"사회복지전문요원은 1987년에 서울, 부산, 대구 등에 처음 배치되었습니다. 1992년이라는 설명이 틀렸습니다."},"20-2-71":{"x":"사회복지협의회는 사회복지사업법에 따라 중앙, 시·도, 시·군·구에 설치되는 법정 민간단체입니다. 시·군·구에 설치하지 않아도 된다는 설명이 틀렸습니다."},"20-2-72":{"x":"사회복지관은 기초생활수급자 등 취약계층의 가구 전체를 서비스 대상으로 우선 제공합니다. 어머니, 배우자, 자녀 모두 포함됩니다."},"20-2-73":{"x":"협동조합의 발기인은 5인 이상의 조합원 자격을 가진 자이고(ㄱ), 마을기업은 지역 주민 의견을 반영하며(ㄴ), 자활기업은 조합 또는 부가가치세법상 사업자로 합니다(ㄷ)."},"20-2-74":{"x":"읍·면·동 찾아가는 보건복지서비스(ㄷ)와 사회적 경제 주체의 다양화(ㄹ)가 최근 동향입니다.\n\n사회서비스원은 중앙정부가 아니라 시·도 단위로 운영되고(ㄱ은 틀림), 복지 허브화는 시·군·구가 아니라 읍·면·동 단위입니다(ㄴ은 틀림)."},"20-2-75":{"x":"복지권리의식과 시민의식 배양(ㄱ), 지역자원동원과 조직 간 협력(ㄴ), 정체성 확인과 역량강화(ㄷ), 사회정의 실현(ㄹ)은 모두 지역사회복지운동의 의의입니다."},"21-2-51":{"x":"기능적 공동체는 멤버십 개념(ㄱ), 외국인근로자 공동체(ㄴ), 온라인 커뮤니티(ㄷ), 사회문화적 동질성(ㄹ)을 모두 포함합니다."},"21-2-52":{"x":"사회구성주의이론은 지역사회 문제를 객관적 사실이 아니라 특정 집단이 규정한 것이라고 봅니다.\n\n1번은 생태체계이론, 2번은 갈등이론, 4번은 구조기능론, 5번은 엘리트이론에 대한 설명입니다."},"21-2-53":{"x":"지역사회복지협의체가 지역사회보장협의체로 대체된 것이 맞는 순서입니다. 시·군·구 지역사회보장협의체가 지역사회복지협의체로 대체되었다는 설명은 순서가 반대입니다."},"21-2-54":{"x":"사회적 자본은 신뢰와 네트워크를 바탕으로 지역사회의 문제해결 능력을 높입니다. 무관하다는 설명이 틀렸습니다."},"21-2-55":{"x":"대면접촉이 이루어지는 가까운 지역사회에 초점을 두고 조직화와 삶의 질 증진을 목표로 하며 조직가, 촉진자, 교육자, 코치 역할을 하는 모델은 근린지역사회조직모형입니다."},"21-2-56":{"x":"던햄의 지역사회 유형은 인구 크기, 경제적 기반, 행정구역, 사회적 특수성입니다. 연대성 수준은 뒤르켐 등의 구분입니다."},"21-2-57":{"x":"1980년대 그리피스 보고서는 지역사회보호에서 복지 주체의 다원화에 영향을 주었습니다.\n\n헐 하우스는 미국 인보관이고, 우애방문단은 개별 접근이며, 인보관은 개혁에 관심을 두었고, 존슨 행정부의 빈곤과의 전쟁은 미국의 이야기입니다."},"21-2-58":{"x":"공식 사회복지조직은 조직의 미션 달성이 목표이고(ㄱ), 주요 참여자는 전문직이며, 주민조직은 일반주민이 주요 참여자입니다(ㄹ).\n\n지역사회개입모델과 정부통제로부터의 자율성에 관한 비교는 서술이 맞지 않습니다(ㄴ, ㄷ은 틀림)."},"21-2-59":{"x":"자원을 조정하고 연계하는 활동은 연계·중개 활동이고, 옹호 활동은 압력, 피케팅, 증언 청취 요청, 탄원서 서명 등 사회정의와 권리를 위한 활동입니다."},"21-2-60":{"x":"자원봉사자 수, 사회복지 예산 규모, 기업의 사회공헌 프로그램은 지역사회의 자원을 파악하는 자원 사정입니다."},"21-2-61":{"x":"주민 스스로 돌봄과 자원봉사를 활성화하도록 자조모임을 지원하고 사회적 관계망을 확충하는 것은 포플의 커뮤니티케어 모형입니다."},"21-2-62":{"x":"주민의 강점을 인정하고 스스로 삶을 결정하도록 역량을 강화하는 실천 기술은 임파워먼트입니다."},"21-2-63":{"x":"사회정의 준수와 유지는 네트워크 기술의 특성이 아니라 옹호나 사회행동과 관련됩니다."},"21-2-64":{"x":"예산과 자원봉사자를 확보하기 위해 클럽 운영진에게 모임 개최를 요청한 것은 자원개발 및 동원 기술입니다."},"21-2-65":{"x":"지방분권이 이루어지면 지방자치단체의 책임성이 강화됩니다. 중앙정부의 책임성이 강화된다는 설명이 틀렸습니다."},"21-2-66":{"x":"우리나라 지방자치는 1952년 시작되었다가 중단되었고, 1991년 지방의회가 구성되었으며 1995년에 단체장을 직접 선출하는 방식이 시행되었습니다. 1990년에 처음 실시되었다는 설명이 틀렸습니다."},"21-2-67":{"x":"지역사회보장계획은 사회보장에 관한 기본계획과 연계되어야 합니다.\n\n계획은 변경할 수 있고, 4년마다 수립하며(3년이 아님), 시·군·구 계획은 협의체의 심의와 의회 보고를 거치고, 지역사회보장지원센터 설치가 아니라 한국사회보장정보원 등이 지원합니다. 세부 사항은 현행 사회보장급여법으로 확인하세요."},"21-2-68":{"x":"지역사회보장협의체는 실무협의체, 실무분과, 읍·면·동 협의체 간 수평적 네트워크 관계를 형성합니다.\n\n법적 근거는 사회보장급여법이고, 위원 수와 임기는 조례로 정하며, 사회복지사업에 관한 심의·건의는 사회복지위원회의 일이고, 거버넌스를 강화하는 기구입니다."},"21-2-69":{"x":"사회복지관은 사회복지법인, 비영리법인뿐 아니라 지방자치단체도 설치·운영할 수 있습니다. 법인에 한한다는 설명이 틀렸습니다."},"21-2-70":{"x":"사회복지협의회는 민간 단체입니다. 시·군·구에 설치된 공공기관이라는 설명이 틀렸습니다."},"21-2-71":{"x":"사회복지공동모금회는 사회복지사업법에 따른 사회복지법인이며 기획·홍보·모금·배분을 수행하는 민간운동적 단체입니다. 기부금 단체로는 법정기부금 단체에 해당하므로 지정기부금 모금단체라는 설명이 틀렸습니다."},"21-2-72":{"x":"사회적 기업, 마을기업, 사회적 협동조합, 자활기업은 모두 사회적 경제 주체입니다."},"21-2-73":{"x":"지역사회복지운동은 복지권리와 시민의식을 배양하는 사회권 확립운동입니다.\n\n계획된 조직적 활동이고, 주민이 주체이며, 개인의 변화보다 지역사회 변화에 초점을 두고, 일부 주민이 아닌 지역 전체를 대상으로 합니다."},"21-2-74":{"x":"A시의 추천으로 위원이 되었지만 실제 결정은 시의 의도대로 된 상황은 주민이 의견을 내도록 하되 영향력은 주지 않는 회유 수준입니다."},"21-2-75":{"x":"사회복지통합관리망(행복e음, 2010) → 희망복지지원단 운영(2012) → 찾아가는 보건복지서비스(2016) → 사회서비스원 시범사업(2019) 순입니다."},"22-2-51":{"x":"지역사회 내 상이한 단위 조직 간의 구조적·기능적 관련 정도는 워렌의 지역사회 비교척도 중 수평적 유형입니다."},"22-2-52":{"x":"주민이 필요한 재화와 서비스를 제공받는 기능은 생산·분배·소비 기능이고, 사회규범에 순응하게 하는 기능은 사회통제 기능입니다."},"22-2-53":{"x":"영구임대주택단지 내 사회복지관 건립 의무화(1989) → 국민기초생활보장법 제정(1999) → 지역사회복지협의체를 지역사회보장협의체로 변경(2015) 순입니다."},"22-2-54":{"x":"지역사회보호가 강조되면서 민간서비스와 비공식 서비스의 역할이 오히려 커졌습니다. 감소했다는 설명이 틀렸습니다."},"22-2-55":{"x":"자기효능감과 집단효능감은 사회교환이론의 개념이 아닙니다. 사회교환이론은 보상과 비용, 교환관계를 설명합니다."},"22-2-56":{"x":"지역사회복지실천은 지역사회의 고유한 특성과 문제를 고려합니다. 지역사회 특성과 문제를 일반화하는 것은 원칙에 맞지 않습니다."},"22-2-57":{"x":"사회구성(주의)이론은 가치, 규범, 신념, 태도가 문화적 집단에 따라 다르게 구성된다고 봅니다.\n\n지역사회상실이론은 전통적 기능의 상실을, 자원동원이론은 자원이 집단행동의 성패에 영향을 준다고 보며, 다원주의는 집단 간 경쟁과 타협, 권력의존이론은 자원 의존 관계를 설명합니다."},"22-2-58":{"x":"테일러와 로버츠의 모델은 프로그램 개발 및 조정, 계획, 지역사회연계, 지역사회개발, 정치적 권력(역량)강화입니다. 연합은 웨일과 갬블의 모델입니다."},"22-2-59":{"x":"지역사회개발모델은 정부조직을 협력의 대상으로 봅니다. 경쟁자로 인식하는 것은 사회행동모델에 가깝습니다."},"22-2-60":{"x":"불평등에 도전하고 사회적·정치적·경제적 정의를 위해 행동하며 선출직 공무원도 표적체계에 포함되는 웨일과 갬블의 모델은 정치·사회행동 모델입니다."},"22-2-61":{"x":"이슈를 개념화하고 가치관과 이론, 자료를 분석하는 활동은 문제확인 단계입니다."},"22-2-62":{"x":"실천계획의 목표 설정은 계획단계의 과업입니다. 실행단계에서는 재정 집행, 갈등 관리, 적응 촉진, 네트워크 구축 등을 합니다."},"22-2-63":{"x":"소외된 집단의 입장을 주장하고 보이콧과 피케팅으로 표적을 난처하게 하며 정당한 처우를 받지 못할 때 쓰는 기술은 옹호입니다."},"22-2-64":{"x":"조직화 기술은 지역주민이 주체가 되어 사회복지조직의 목표를 이루고(ㄱ), 문제를 함께 풀어가는 과정을 포함합니다(ㄴ).\n\n거버넌스 구조와 기능을 축소하는 것은 아닙니다(ㄷ은 틀림)."},"22-2-65":{"x":"전문가 패널의 의견을 합의가 이루어질 때까지 반복 설문으로 수렴하는 방법은 델파이 기법입니다."},"22-2-66":{"x":"복지예산이 지방으로 이양되면 지방정부의 책임이 강화됩니다.\n\n지방정부의 책임을 강조하고, 지역 간 격차가 발생할 수 있으며, 단체장은 주민이 선출하고, 민간의 참여가 오히려 확대됩니다."},"22-2-67":{"x":"시·군·구 지역사회보장계획에는 전달체계의 조직과 운영(ㄱ), 사각지대 발굴·지원 방안(ㄴ), 통계 수집·관리 방안(ㄷ), 재원의 규모와 조달 방안(ㄹ)이 포함됩니다. 세부 항목은 법 개정으로 달라질 수 있으니 현행 사회보장급여법으로 확인하세요."},"22-2-68":{"x":"읍·면·동의 지역사회보장조사와 지역사회보장지표에 관한 사항은 시·군·구 협의체의 심의·자문 사항이 아닙니다."},"22-2-69":{"x":"복권의 발행은 사회복지공동모금회법이 아니라 복권 관련 법령에 따라 정해지며, 모금회가 기획재정부장관의 승인을 받아 발행하는 방식이 아닙니다. 5번이 틀렸습니다."},"22-2-70":{"x":"사회복지관의 서비스 제공 기능에는 가족기능 강화, 지역사회보호, 교육문화, 자활지원이 있습니다. 사례관리는 별도의 기능 영역입니다."},"22-2-71":{"x":"한국사회복지협의회의 주요 사업은 교육훈련, 홍보, 자원봉사 진흥, 기부문화 조성 등입니다. 읍·면·동이 위탁하는 업무는 주요 사업이 아닙니다."},"22-2-72":{"x":"사회적 기업은 경제적 이익도 추구하며(ㄱ), 사회적 경제는 자본주의 시장경제의 대안 모델이고(ㄴ), 사회적협동조합은 취약계층에게 서비스와 일자리를 제공합니다(ㄷ)."},"22-2-73":{"x":"지역사회복지운동은 노동운동이나 여성운동과 달리 계층적 기반이 뚜렷하지 않습니다. 1번이 틀렸습니다."},"22-2-74":{"x":"주민참여는 지방자치 발달, 마을만들기, 정책결정과정, 아른스테인의 사다리와 관련됩니다. 공무원 중심의 정책 결정권한 강화는 주민참여와 반대입니다."},"22-2-75":{"x":"지역사회통합돌봄은 확대·제도화되는 방향으로 추진되어 왔습니다. 축소되었다는 설명이 틀렸습니다."},"23-2-51":{"x":"구성원이 사회규범에 순응하게 하는 지역사회 기능은 사회통제 기능입니다."},"23-2-52":{"x":"개인의 자유와 권리 증진, 의견수렴을 통한 합리적 의사결정, 공동체의식 강화의 효과를 가진 이념은 주민참여입니다."},"23-2-53":{"x":"1990년대에 재가복지봉사센터가 설치·운영되었습니다.\n\n지역자활센터는 2000년대, 사회복지관 국고보조금은 1980년대 후반, 희망복지지원단은 2010년대, 사회복지사무소 시범 설치는 1990년대 중반입니다."},"23-2-54":{"x":"헐 하우스는 미국 시카고의 인보관입니다. 하버트 보고서가 헐 하우스 건립의 기초가 되었다는 설명이 틀렸습니다."},"23-2-55":{"x":"갈등이론은 이해관계의 대립을 불평등한 자원 분배로 설명합니다."},"23-2-56":{"x":"외국인 노동자의 유입으로 특정 국적의 주거 공동체가 형성되고 주민 간 갈등이 생기는 공간적 변화는 생태학이론으로 분석합니다."},"23-2-57":{"x":"사회복지관이 지방정부의 보조금에 의존하여 지도점검을 받는 것은 자원 의존 관계를 보여주는 권력의존이론의 사례입니다(ㄷ)."},"23-2-58":{"x":"지역사회복지실천에서 문제 인식을 획일화해서는 안 됩니다. 다양한 구성원의 관점을 반영해야 합니다."},"23-2-59":{"x":"공통 관심사나 특정 이슈에 대한 정책, 행위, 인식의 변화를 목표로 하고 일반대중과 정부기관을 표적체계로 하며 조직가·촉진자·옹호자·정보전달자 역할을 하는 모델은 기능적 지역사회조직입니다."},"23-2-60":{"x":"지역사회개발모델은 구성원의 조직화를 주요 과정으로 봅니다(ㄱ). 사회행동모델은 집단 간 갈등관계로 타협과 조정이 어렵다고 봅니다(ㄹ).\n\n지역사회개발모델의 변화 매개체는 과업지향적 소집단이고(ㄴ은 틀림), 사회계획모델의 사회복지사는 분석가·계획가입니다(ㄷ은 틀림)."},"23-2-61":{"x":"테일러와 로버츠의 모델 중 지역주민의 역량강화와 지도력 개발에 관심을 두는 것은 지역사회개발이나 정치적 역량강화입니다. 프로그램 개발과 조정은 서비스 프로그램의 개발에 초점을 둡니다."},"23-2-62":{"x":"재정자원 집행, 추진인력의 확보와 활용, 네트워크 구축은 계획을 실제로 옮기는 실행단계의 과업입니다."},"23-2-63":{"x":"지역사회포럼은 주민이 참여할 수 있는 공개 모임을 열어 의견을 모으는 방법입니다.\n\n명목집단기법은 소집단 토론으로 우선순위를 정하고, 초점집단은 소수가 토론하며, 델파이는 전문가 반복 설문, 사회지표분석은 기존 통계 활용, 핵심정보제공자 조사는 문제를 잘 아는 사람의 정보를 얻는 방법입니다."},"23-2-64":{"x":"서명운동과 조례제정 입법 활동으로 아동돌봄시설 확충을 요구한 것은 옹호자의 핵심 역할입니다."},"23-2-65":{"x":"지역주민 권익향상을 위한 사회행동은 연계가 아니라 옹호·사회행동 기술입니다. 연계는 자원과 서비스의 연결과 협력에 초점을 둡니다."},"23-2-66":{"x":"예산과 자원봉사자를 얻기 위해 지역 내 종교단체에 지원을 요청한 것은 자원개발 및 동원 기술입니다."},"23-2-67":{"x":"지방분권은 주민참여를 통해 권력의 재분배가 이루어지게 합니다.\n\n사회보험은 중앙 중심이고, 욕구에 대한 민감성은 높아지며, 지역 간 격차가 생길 수 있고, 중앙정부의 책임은 약화될 수 있습니다."},"23-2-68":{"x":"지역사회보장계획은 사회보장급여법에 근거하고(ㄴ), 4년마다 수립하며 매년 연차별 시행계획을 세웁니다(ㄹ).\n\n시·군·구 계획은 협의체의 심의와 의회 보고를 거치고(ㄱ은 순서·주체가 틀림), 제출 기한은 전년도 9월 30일이며 11월 30일은 아닙니다(ㄷ은 틀림). 수립 시기와 같은 세부 사항은 법 개정으로 달라질 수 있으니 현행 법령으로 확인하세요."},"23-2-69":{"x":"실무협의체는 전문성 원칙에 따라 현장 전문가를 중심으로 구성합니다.\n\n사회보장업무 담당 공무원도 포함될 수 있고, 위원 수는 10명 미만으로 정해져 있지 않으며, 조례 제정은 협의체의 역할이 아니고, 사회보장급여 제공 심의·자문은 대표협의체의 역할입니다."},"23-2-70":{"x":"자원봉사활동의 진흥을 위한 국가 기본계획 수립은 행정안전부의 업무입니다. 자원봉사활동기본법에 따른 주무부처가 보건복지부가 아닙니다."},"23-2-71":{"x":"아동 자립생활 지원을 위한 후원자 개발은 지역 자원을 동원·개발하는 지역조직화 기능입니다. 나머지는 서비스 제공 기능에 해당합니다."},"23-2-72":{"x":"사회적기업은 유급근로자를 고용하고 영업활동을 해야 하며(ㄱ), 민법상 조합, 상법상 회사, 특별법상 법인 등 다양한 조직형태를 가질 수 있고(ㄴ), 이해관계자가 참여하는 의사결정 구조를 갖춥니다(ㄹ).\n\n인증은 고용노동부가 합니다(ㄷ은 틀림)."},"23-2-73":{"x":"주민참여 수준이 높은 순서는 의사결정권 행사(ㄹ) → 계획단계 참여(ㄱ) → 조직대상자(ㄴ) → 단순정보수혜자(ㄷ)입니다."},"23-2-74":{"x":"지역사회복지운동은 목적지향적인 조직적 활동입니다.\n\n전문가뿐 아니라 주민이 참여하는 활동이고, 정치권력의 장악이 목적이 아니며, 구조적 문제를 포함하고, 서비스 제공 활동도 합니다."},"23-2-75":{"x":"통합사례관리는 확대·강화되는 추세입니다. 축소되었다는 설명이 틀렸습니다."},"24-2-51":{"x":"1950년대 영국에서 정신장애인과 지적장애인의 시설수용에 대한 문제제기로 등장했고 정상화 가치와 관련된 것은 지역사회보호입니다."},"24-2-52":{"x":"사회적 위험으로 어려움에 처한 구성원들이 서로 돕는 기능은 상부상조의 기능입니다."},"24-2-53":{"x":"오가통 제도는 일제강점기가 아니라 조선시대의 인보제도입니다. 2번이 틀렸습니다."},"24-2-54":{"x":"헐 하우스는 미국의 인보관으로 제인 아담스가 설립했습니다. 영국의 지역사회복지 역사에 해당하지 않습니다."},"24-2-55":{"x":"교환이론은 자원의 교환을 통한 지역사회 발전을 강조합니다.\n\n이익집단 간 갈등과 타협은 다원주의이론, 소수 엘리트는 엘리트이론, 갈등을 변화의 원동력으로 보는 것은 갈등이론, 하위체계의 기능과 역할은 기능주의·체계이론의 개념입니다."},"24-2-56":{"x":"사회자본이론의 개념은 신뢰, 호혜성, 네트워크입니다. 경계는 체계이론의 개념입니다."},"24-2-57":{"x":"중앙정부로부터 받은 예산을 이익집단(노인회)의 요구와 영향력에 따라 배분한 것은 이익집단 간 경쟁과 영향력을 설명하는 다원주의이론으로 설명합니다."},"24-2-58":{"x":"사회복지사는 상호학습을 통해 참여자의 문화적 배경을 배우려는 자세가 필요합니다."},"24-2-59":{"x":"지역사회복지실천은 욕구 변화에 유연하게 대응하고(ㄱ), 주민을 중심으로 목표를 설정·평가하며(ㄴ), 지역사회의 자기결정권을 강조합니다(ㄹ).\n\n지역사회 특성의 일반화(ㄷ)는 원칙이 아닙니다."},"24-2-60":{"x":"포플의 지역사회복지실천 모델에는 지역사회보호, 지역사회조직, 지역사회개발, 지역사회교육, 지역사회행동, 페미니스트 지역사회사업, 인종차별철폐 지역사회사업이 있습니다. 지역사회연계는 테일러와 로버츠의 모델입니다."},"24-2-61":{"x":"무력화된 클라이언트의 잠재 역량과 자원을 인정하고 삶을 스스로 결정하도록 북돋우는 것은 임파워먼트 기술입니다."},"24-2-62":{"x":"협력·조정을 위한 네트워크 구축은 실행단계의 활동입니다. 사정 단계에서는 욕구 파악, 자료수집, 주민 의견 수렴, 우선순위 결정을 합니다."},"24-2-63":{"x":"지역사회복지실천 과정은 지역사회 사정 → 실행계획 수립 → 실행 → 성과평가 순입니다."},"24-2-64":{"x":"지역사회개발모델에서 조력자 역할은 좋은 대인관계 조성, 불만 집약, 공동목표 강조, 조직화 격려입니다. 지역사회 진단은 전문가의 역할입니다."},"24-2-65":{"x":"샌더스가 사회계획모델에서 제시한 역할은 분석가, 계획가, 조직가, 행정가입니다. 옹호자는 사회행동모델의 역할입니다."},"24-2-66":{"x":"사회행동모델은 클라이언트 집단을 억압받는 희생자로 봅니다. 소비자로 보는 것은 사회계획모델입니다."},"24-2-67":{"x":"지역사회 공공의제를 개발하고 주민 의식화를 강화하는 것은 연계기술이 아니라 조직화 기술입니다."},"24-2-68":{"x":"지방자치는 자기통치원리를 담고 있고(ㄱ), 주민자치와 단체자치를 일컬으며(ㄴ), 지방자치단체는 사회복지시설을 평가할 수 있고(ㄷ), 지방자치법 제정으로 분권을 위한 법적 장치가 마련되었습니다(ㄹ)."},"24-2-69":{"x":"지역사회보장계획의 수립 및 지역사회보장조사의 시기·방법 등 필요한 사항은 대통령령으로 정합니다.\n\n시장·군수·구청장은 시·도지사에게 제출하고, 시·군·구 계획은 협의체의 심의와 의회 보고를 거치며, 근거 법은 사회보장급여법입니다. 세부 사항은 법 개정으로 달라질 수 있으니 현행 법령으로 확인하세요."},"24-2-70":{"x":"사회복지사업법 제34조의5의 사회복지관 사업은 서비스 제공, 사례관리, 지역조직화의 3대 기능입니다. 사례관리는 국가·지방자치단체·민간의 서비스를 연계·제공하는 사업이며, 주민교육과 복지자원관리는 지역조직화입니다."},"24-2-71":{"x":"주민 협력 강화를 위한 주민의식 교육은 지역조직화 기능입니다. 나머지는 사례관리 기능에 해당합니다."},"24-2-72":{"x":"사회복지공동모금회의 임원 임기는 3년이며 한 차례만 연임할 수 있습니다. 2년이라는 설명이 틀렸습니다."},"24-2-73":{"x":"지역공동체에 기반해 활동하고, 도시재생 활성화 및 지원에 관한 특별법에 근거하며, 주민이 지역자원을 활용해 수익사업을 하는 것은 마을기업입니다."},"24-2-74":{"x":"아른스테인의 주민참여 8단계는 조작, 치료, 정보제공, 상담, 회유, 협동관계, 권한위임, 주민통제입니다. 주민동원은 단계에 포함되지 않습니다."},"24-2-75":{"x":"행복e음 구축(2010) → 희망복지지원단 설치(2012) → 읍·면·동 복지 허브화(2016) → 지역사회통합돌봄 선도사업(2019) 순입니다."},"25-2-51":{"x":"지역주민이 이용자이자 제공자이며 주체성에 초점을 두는 지역사회복지 이념은 주민참여입니다."},"25-2-52":{"x":"지역사회의 지식, 사회적 가치, 행동양식을 전달하는 기능은 사회화 기능입니다."},"25-2-53":{"x":"던햄의 지역사회 유형은 인구 크기, 인구구성의 사회적 특수성, 경제적 기반, 행정구역입니다. 보기 모두 옳습니다."},"25-2-54":{"x":"시·군·구 희망복지지원단은 2012년부터 설치·운영되었습니다. 2020년대라는 설명이 틀렸습니다."},"25-2-55":{"x":"영국의 흐름은 토인비홀 설립(1884) → 정신보건법(1959) → 시봄보고서(1968) → 하버트보고서 → 바클레이보고서(1982) 순입니다."},"25-2-56":{"x":"지방정부의 보조금을 받고 그 요구와 통제를 수용한 사례는 자원 의존 관계를 설명하는 권력의존이론입니다."},"25-2-57":{"x":"갈등이론은 자원의 불평등 분배로 이해관계의 대립이 생긴다고 보고(ㄴ), 사회자본이론은 신뢰와 네트워크로 문제해결 규범이 형성된다고 봅니다(ㄹ).\n\n지역사회 갈등이 변화의 원동력이라는 것은 갈등이론이고(ㄱ), 인간행동이 상호작용 중에 학습된다는 것은 사회학습이론입니다(ㄷ)."},"25-2-58":{"x":"지역사회연계는 테일러와 로버츠의 모델입니다. 포플의 모델에는 지역사회보호, 지역사회조직, 지역사회개발, 지역사회교육, 지역사회행동, 페미니스트, 인종차별철폐 모델이 있습니다."},"25-2-59":{"x":"지역사회개발모델은 역량강화, 통합, 자조를 목표로 하고(ㄱ), 사회행동모델에서 사회복지사는 옹호자, 선동가, 협상가입니다(ㄷ).\n\n과업지향적 소집단은 지역사회개발의 변화 매개체이고(ㄴ), 전문가 주도는 사회계획모델의 특성입니다(ㄹ)."},"25-2-60":{"x":"공통 관심사나 특정 이슈에 대한 정책, 행위, 인식의 변화를 관심으로 하는 모델은 기능적 지역사회조직모델입니다. 근린지역사회조직모델의 관심영역은 지역사회 삶의 질입니다."},"25-2-61":{"x":"지역사회 문제해결을 위해 관계망을 형성·조정하며 다양한 구성원이 참여하고 클라이언트와 후원자의 영향력이 동등한 모델은 테일러와 로버츠의 지역사회연계모델입니다."},"25-2-62":{"x":"지역사회개발모델에서 사회복지사의 핵심 역할은 조력자, 촉진자, 안내자, 교육자입니다. 치료자는 해당하지 않습니다."},"25-2-63":{"x":"총괄평가는 프로그램이 끝난 뒤 결과를 평가하는 것입니다. 수행과정 중 문제점을 수정하는 평가는 형성평가입니다. 5번이 틀렸습니다."},"25-2-64":{"x":"서베이는 주민 설문으로 직접 자료를 수집하고(ㄱ), 사회지표분석은 기존 자료를 활용하며(ㄷ), 명목집단기법은 다양한 의견을 수렴하며 우선순위를 정합니다(ㄹ).\n\n전문가 패널의 반복 설문은 델파이 기법입니다(ㄴ은 틀림)."},"25-2-65":{"x":"주민의 효율적 통제는 조직화 기술이 아닙니다. 조직화는 주민의 참여와 의사소통, 갈등조율, 지도력 개발, 정보수집과 분석을 포함합니다."},"25-2-66":{"x":"복지재단에 신청해 예산을 확보하고 대학에 봉사자를 요청한 것은 자원개발 및 동원 기술입니다."},"25-2-67":{"x":"사례관리 계획을 위해 기관들과 서비스의 중복과 누락을 방지하는 방안을 논의한 것은 조정자의 역할입니다."},"25-2-68":{"x":"지방자치제도는 복지예산을 지방으로 분산해 지역 맞춤형으로 쓰는 방향이며, 중앙집중화로 정책효과가 강화되는 것이 아닙니다. 2번이 틀렸습니다."},"25-2-69":{"x":"지방분권은 지방의회의 사회적 책임성을 강화합니다. 약화된다는 설명이 틀렸습니다."},"25-2-70":{"x":"실무협의체 위원은 10명 이상 40명 이하로 구성합니다.\n\n조례 제정은 지방의회가 하고, 대표협의체 위원에는 공무원이 포함되며, 사회보장급여 제공에 관한 심의·자문은 대표협의체가 하고, 계획 시행결과 평가는 대표협의체와 지방자치단체의 몫입니다. 세부 사항은 법 개정으로 달라질 수 있으니 현행 법령으로 확인하세요."},"25-2-71":{"x":"시·군·구는 4년마다 지역사회보장계획을 수립해야 하고(ㄱ), 지역사회보장조사는 욕구조사와 자원조사로 구성됩니다(ㄹ).\n\n시·군·구 계획은 협의체의 심의와 지방의회 보고를 거치며(ㄴ은 틀림), 사회보험 재원 규모는 포함되지 않고 지역사회보장에 필요한 재원이 포함됩니다(ㄷ은 틀림)."},"25-2-72":{"x":"자활기금의 설치·운영은 지방자치단체와 관련된 업무이고, 지역자활센터가 하는 일이 아닙니다."},"25-2-73":{"x":"독거노인을 위한 일상생활 지원은 서비스제공 기능입니다. 욕구조사, 자원봉사자 개발·관리, 현장실습 교육, 후원자 개발은 지역조직화 및 기타 기능에 가깝습니다."},"25-2-74":{"x":"사회적 경제는 사회통합과 공동체의식에 기여하고(ㄴ), 호혜와 연대에 기초한 대안이며(ㄷ), 협동조합, 마을기업, 자활기업 등이 있습니다(ㄹ).\n\n사회적 경제의 주체는 정부와 시장이 아니라 제3섹터입니다(ㄱ은 틀림)."},"25-2-75":{"x":"지역사회복지운동은 특정 계층에 국한되지 않고 지역주민 전체의 삶의 질을 목적으로 합니다. 수단지향적이라는 설명이 틀렸습니다."},"26-2-51":{"x":"서비스 제공자뿐 아니라 다양한 사회적 인간관계의 조직화와 관련되고 다양한 욕구를 가진 이용자에게 서비스를 제공하기 위한 필수 요소는 네트워크입니다."},"26-2-52":{"x":"단위 조직들이 구조적, 기능적으로 관련된 정도는 수평적 유형이고, 동일 지역 내에서 학교, 공공시설 등이 운영되는 정도는 서비스 영역의 일치성입니다."},"26-2-53":{"x":"자원봉사활동기본법 시행(2005) → 노인장기요양보험제도 시행(2008) → 동주민센터의 행정복지센터 변경(2010년대 후반) → 지역사회 통합돌봄 기본계획 발표 순으로 정답표를 처리했습니다."},"26-2-54":{"x":"새마을운동은 농촌생활환경 개선운동으로 시작해 소득증대운동으로 발전했습니다. 발전하지 못했다는 설명이 틀렸습니다."},"26-2-55":{"x":"지방자치단체의 지도점검과 중앙정부 예산지원에 대한 영향은 자원 의존 관계를 설명하는 권력의존이론의 사례입니다. 지역사회조직은 권력의 균형적인 배분을 위해 자원개발에 힘써야 한다는 설명이 해당합니다."},"26-2-56":{"x":"장애인 개인뿐 아니라 가족, 이웃, 공공기관 등 하위체계의 상호작용을 파악하는 접근은 사회체계이론입니다."},"26-2-57":{"x":"지역사회의 특성은 지역마다 다르므로 일반화하지 않는 것이 원칙입니다."},"26-2-58":{"x":"지역사회개발모델은 과업 중심이 아니라 과정 중심 목표(역량 개발과 통합)를 강조합니다. 과업지향적 목표를 강조한다는 설명이 틀렸습니다."},"26-2-59":{"x":"기능적 지역조직화 모델에서 표적집단은 일반대중과 정부제도이고(ㄱ), 사회복지사는 조직가, 옹호자, 정보 전달자이며(ㄴ), 핵심 목표는 이슈 관련 정책, 행동, 태도의 변화입니다(ㄷ)."},"26-2-60":{"x":"실행계획 단계에서는 정책 접근법, 프로그램 접근법, 프로젝트 접근법 등을 사용합니다.\n\n문제확인은 포괄적 사정과 관련되지 않고, 문제분석에서 개방형 설문 반복은 델파이이며, 과정목표와 결과목표는 서술이 서로 바뀌어 있고, 실행과정 점검에서는 모니터링을 합니다."},"26-2-61":{"x":"형평성은 서비스가 필요한 사람에게 공평하게 제공되는 정도입니다. 프로그램 이용자 수는 노력성(투입)에 가깝습니다."},"26-2-62":{"x":"읍·면·동 지역사회보장협의체는 지역의 자원을 발굴하고 연계하는 자원 개발의 현장입니다."},"26-2-63":{"x":"연계체계는 시간이 지나면서 느슨해질 수 있으므로, 상황에 맞게 방식을 조정·갱신해야 합니다. 기존 방식을 고수한다는 설명이 틀렸습니다."},"26-2-64":{"x":"주민이 자신들의 문제를 함께 풀며 권력과 통제구조를 변화시킬 수 있는 지역사회복지 실천기술은 주민 조직화입니다."},"26-2-65":{"x":"네트워크 기술은 사회적 자본의 증대를 추구합니다. 사회적 자본 감소를 추구한다는 설명이 틀렸습니다."},"26-2-66":{"x":"지역사회 옹호는 개인적 문제 해결이 아니라 지역사회 전체의 공동 문제와 구조적 변화를 위한 활동입니다. 1번이 틀렸습니다."},"26-2-67":{"x":"지방분권은 지방정부의 권한과 책임성 강화, 맞춤형 서비스, 주민참여와 연대 강화, 효율적 집행체계 구축에 중요합니다."},"26-2-68":{"x":"지역사회보장계획은 지역사회보장협의체의 심의를 거쳐 지방의회에 보고합니다.\n\n계획은 4년마다 수립하며, 사회보장급여법에 따라 수립하고, 재원의 규모와 조달 방안도 포함합니다. 5번의 기수 설명은 맞지 않습니다. 계획의 기수와 기간은 해마다 달라지므로 현행 기준을 확인하세요."},"26-2-69":{"x":"지역사회보장협의체 위원의 임기는 2년이고 위원장은 연임할 수 있습니다. 임기 3년이라는 설명이 틀렸습니다. 세부 임기와 인원은 법 개정으로 달라질 수 있으니 현행 법령으로 확인하세요."},"26-2-70":{"x":"사회복지공동모금회는 민간 주도의 활동입니다. 관 중심의 활동이라는 설명이 틀렸습니다."},"26-2-71":{"x":"시·도 사회복지협의회는 한국사회복지협의회의 지회가 아니라 독립된 법인으로 운영됩니다. 1번이 틀렸습니다."},"26-2-72":{"x":"사회복지관은 독거노인(ㄱ), 차상위계층(ㄴ), 수급자(ㄷ), 한부모·다문화가족 같은 취약계층(ㄹ)에게 서비스를 우선 제공합니다."},"26-2-73":{"x":"자활기업은 협동조합기본법이 아니라 국민기초생활보장법에 따라 자활공동체에서 명칭이 변경되었습니다. 2번이 틀렸습니다."},"26-2-74":{"x":"결정권한은 시에 있지만 주민의 요청으로 협상할 수 있고 책임까지 공유하려는 단계는 협동관계입니다."},"26-2-75":{"x":"지역사회복지 활성화를 위해 민간 영역의 자율적 발전(ㄱ), 통합돌봄과 사회서비스 기반 구축(ㄷ), 합리적 정책 수립(ㄹ), 자원 활용과 조직 간 협력(ㅁ)이 필요합니다.\n\n특정 계층 중심의 수단적 운동 활성화(ㄴ)는 과제가 아닙니다."}},"data/e_hb.json":{"17-1-1":{"x":"스키너는 조작적 조건화(강화·처벌)를 설명한 행동주의자입니다. '모방학습'의 중요성은 반두라의 사회학습이론이 강조한 것이어서 4번이 틀렸습니다.\n\n피아제=인지발달 준거틀, 프로이트=무의식 갈등, 에릭슨=생애주기별 개입 지표, 매슬로우=욕구 사정으로 연결하면 나머지는 모두 옳습니다."},"17-1-2":{"x":"로저스는 인간중심상담에서 자기결정과 비심판적·수용적 태도를 중시했습니다. ㄱ, ㄴ이 맞습니다.\n\nㄷ의 '지시적 상담'은 로저스의 비지시적(내담자 중심) 접근과 반대입니다."},"17-1-3":{"x":"발달은 누적적이어서 각 단계는 이전 단계의 영향을 받습니다. 1번이 틀렸습니다.\n\n개인차 존재, 결정적 시기, 유전과 환경의 상호작용, 발달 방향(중심에서 말초, 상체에서 하체)은 모두 발달의 일반 원리입니다."},"17-1-4":{"x":"투사는 자신의 부정적 충동·감정을 타인의 것으로 돌려 원인을 전가하는 방어기제입니다.\n\n1번은 억압이 아니라 '격리', 2번은 반동형성이 아니라 '합리화', 4번은 보상이 아니라 '억압', 5번은 전치가 아니라 '전환(신체화)'에 대한 설명입니다."},"17-1-5":{"x":"소속감과 사랑의 욕구는 친분·우정·애정에 해당합니다. '존경'은 자존감 욕구에 속하므로 3번이 틀렸습니다.\n\n욕구 순서는 생리 → 안전 → 소속과 사랑 → 자존감 → 자아실현입니다."},"17-1-6":{"x":"구체적 조작기(7~11세)에는 인지 능력이 빠르게 발달하고, 비논리적 사고에서 논리적 사고로 전환됩니다. ㄱ, ㄴ이 맞습니다.\n\n분류화·서열화·탈중심화는 이 시기에 획득되지만, 언어기술 획득은 전조작기의 특성이어서 ㄷ은 틀렸습니다. ㄹ은 이 시기에 보존 개념을 획득해 형태나 위치가 바뀌어도 양은 같다고 이해하므로 틀렸습니다."},"17-1-7":{"x":"정보처리기법은 인지이론에 속합니다. 이완훈련, 토큰경제, 자기주장훈련, 타임아웃은 모두 행동주의 기법입니다."},"17-1-8":{"x":"집단무의식의 원형은 인류 보편의 것이어서 개인마다 다르지 않습니다. 4번이 틀렸습니다.\n\n나머지는 자아(의식의 중심), 페르소나(사회적 가면), 그림자(부정적 무의식), 개성화(자기실현)에 대한 올바른 설명입니다."},"17-1-9":{"x":"피아제는 발달단계의 순서가 문화나 개인에 관계없이 모두에게 같다고 보았습니다. 1번이 틀렸습니다.\n\n나머지는 단계별 질적 차이, 동화와 조절을 통한 적응, 상위 단계가 하위 단계를 통합한다는 점, 각 단계가 하나의 일관된 체계라는 점을 옳게 설명합니다."},"17-1-10":{"x":"아들러의 지배형은 사회적 관심은 낮고 활동수준은 높아 독단적이고 공격적으로 자신의 욕구를 충족하는 유형입니다.\n\n2번은 사회적 유용형, 3번은 회피형, 4번은 기생(획득)형에 대한 설명입니다."},"17-1-11":{"x":"에릭슨의 정체감 대 역할혼미(청소년기)에서 중요한 관계 범위는 또래집단과 외집단입니다.\n\n자율성 대 수치심은 부모, 근면성 대 열등감은 이웃·학교, 친밀감 대 고립감은 동료·연인, 통합성 대 절망감은 인류(또는 동족)와 연결됩니다."},"17-1-12":{"x":"생태학적 관점은 병리가 아니라 인간과 환경의 상호작용·적합성을 강조합니다. 2번이 틀렸습니다."},"17-1-13":{"x":"안정상태는 환경과 상호작용하며 에너지를 계속 사용해 체계의 균형을 유지하는 상태입니다.\n\n시너지는 개방체계의 특성이고, 항상성은 불균형이 아니라 균형 유지 경향입니다. 균형(평형)은 폐쇄체계에 가깝고, 피드백은 정보를 되돌려 주는 과정이어서 5번 설명은 엔트로피에 해당합니다."},"17-1-14":{"x":"조직의 문제 해결이나 성과물 산출을 목적으로 하는 집단은 과업집단입니다. 성장·치료·사회화·교육집단은 구성원의 성장과 치료, 사회화, 학습이 목적입니다."},"17-1-15":{"x":"개방체계는 환경과 활발히 교류하며 정보와 에너지를 받아들이므로 ㄴ, ㄷ이 맞습니다.\n\n엔트로피(무질서)가 지속되는 것은 폐쇄체계의 특성이고, 투입과 산출이 거의 없는 것도 폐쇄체계입니다."},"17-1-16":{"x":"문화는 개인의 생리적·심리적 욕구 충족 방식에 영향을 줍니다.\n\n동화는 원문화를 버리고 주류문화를 받아들이는 것이고, 문화는 거시체계에 속합니다. 문화 요소들은 서로 영향을 주며 계속 변화합니다."},"17-1-17":{"x":"유전성 질환을 가진 태아가 모두 임신 초기에 유산되는 것은 아닙니다. 4번이 틀렸습니다. 많은 경우 출산 후 장애나 질환으로 나타납니다."},"17-1-18":{"x":"감각운동기(0~2세)의 핵심 성취는 대상영속성의 획득입니다.\n\n분류·서열화·보존은 구체적 조작기, 조합기술(조합적 사고)은 형식적 조작기의 특성입니다."},"17-1-19":{"x":"융은 장년기 초반에 자아가 발달하고 외부 세계에 대처하며 여성은 독립적·공격적인 측면(아니무스)이 나타난다고 보았습니다. ㄱ, ㄹ이 맞습니다.\n\n남성의 여성적 측면은 아니무스가 아니라 아니마여서 ㄴ은 틀렸고, ㄷ의 자아정체감 대 혼란은 에릭슨의 개념입니다."},"17-1-20":{"x":"애착관계 형성은 영아기의 과업입니다. 유아기·아동기에는 또래관계, 도덕·가치체계 발달, 성역할 습득, 학습기술 습득이 주요 과업입니다."},"17-1-21":{"x":"펙의 '자아분화 대 직업역할몰두'는 노년기 과제이고, 청년기·장년기 과제와 연결되지 않습니다. 2번이 틀렸습니다."},"17-1-22":{"x":"철분 섭취는 태아에게 해롭지 않고 오히려 빈혈 예방에 필요합니다.\n\n간접흡연·알코올·PCB 노출·일부 항생제(테트라사이클린 등) 복용은 기형이나 저체중 위험을 높입니다."},"17-1-23":{"x":"연역적 사고는 형식적 조작기(청소년기)에 가능한 사고입니다.\n\n유아기(전조작기)에는 상징적 사고, 자기중심적 사고, 비가역적 사고, 물활론적 사고가 나타납니다."},"17-1-24":{"x":"퀴블러-로스의 죽음 직면 5단계는 부정, 분노, 타협, 우울, 수용입니다. '자학'은 포함되지 않습니다."},"17-1-25":{"x":"생애주기의 연령 구분은 국가와 사회적 상황에 따라 다양합니다. 5번이 옳습니다.\n\n성장과 발달은 종단적으로 일어나며, 삶은 연속적이고 전체로 이해해야 합니다. 환경과 유전을 함께 고려해야 합니다."},"18-1-1":{"x":"발달은 상부에서 하부로, 중심에서 말초로 진행됩니다. 2번은 방향이 반대입니다."},"18-1-2":{"x":"구체적 조작기에는 구체적 대상에 대해서만 논리적 사고가 가능하고, 추상적 사고는 형식적 조작기부터 가능합니다. 3번이 틀렸습니다."},"18-1-3":{"x":"로저스는 성격발달단계를 제시하지 않았습니다. 단계별 발달 이론은 프로이트·에릭슨·피아제 등의 것입니다. 2번이 틀렸습니다.\n\n로저스는 주관적 경험, 자아개념, 인간의 긍정적 본성과 통합성을 강조했습니다."},"18-1-4":{"x":"에릭슨의 이론은 단계별 누적적 발달(ㄱ), 사회문화적 영향(ㄴ), 청소년기 자아정체감 형성(ㄷ), 전 생애 발달(ㄹ)을 모두 포함합니다. 모두 맞습니다."},"18-1-5":{"x":"생태체계이론은 체계이론과 생태학적 관점을 통합하며(ㄱ), 인간과 환경을 분리하지 않고(ㄴ), 사정 단계에서 유용합니다(ㄹ).\n\n적합성은 인간의 욕구와 환경 자원이 부합하는 정도이고, 균형 회복 경향은 항상성의 정의여서 ㄷ은 틀렸습니다."},"18-1-6":{"x":"실행자이자 마음의 이성적 부분은 자아(ego)입니다. 초자아는 양심과 도덕을 담당하므로 3번이 틀렸습니다."},"18-1-7":{"x":"충동적 감정을 더 안전한 대상으로 돌려 긴장을 푸는 것은 전치입니다. 아버지에게 혼난 아이가 개를 차는 것이 대표 예입니다."},"18-1-8":{"x":"아들러는 열등감이 우월성 추구와 자기완성의 동기가 된다고 보았습니다. 열등감이 의지를 약화시킨다는 설명은 틀렸습니다."},"18-1-9":{"x":"모델링·관찰학습·자기강화·자기효능감은 반두라의 개념입니다. 논박은 엘리스의 인지행동(REBT) 개념입니다."},"18-1-10":{"x":"외부환경과 에너지를 교환하지 않고 고립된 체계는 폐쇄체계입니다. 개방체계는 투입과 산출이 활발합니다."},"18-1-11":{"x":"남성의 여성적 면이 아니마, 여성의 남성적 면이 아니무스입니다. 4번은 반대로 서술했습니다."},"18-1-12":{"x":"3차 순환반응기(12~18개월)는 시행착오를 통해 새로운 방법을 탐색하는 시기입니다. 행동하기 전에 생각하는 것은 마지막 단계인 표상적 사고(18~24개월)입니다."},"18-1-13":{"x":"자연집단의 예는 또래집단이고, 형성집단의 예는 치료집단입니다. ㄱ, ㄷ이 맞습니다.\n\nㄴ의 과업집단은 2차 집단이고, ㄹ의 이웃은 1차 집단(가족·또래·이웃 등 친밀한 관계)에 속하므로 두 연결은 틀렸습니다."},"18-1-14":{"x":"청소년기에는 자기개념이 발달하지만, 자기효능감이 급격히 증가한다고 일반화할 수는 없습니다. 효능감의 변화는 개인차가 큽니다. 1번이 틀렸습니다.\n\n청소년기는 추상적·연역적 사고가 가능하고(형식적 조작기), 상상적 청중과 개인적 우화 같은 자아중심성이 나타납니다."},"18-1-15":{"x":"마샤의 정체감 유실은 탐색 없이 부모나 사회의 가치를 그대로 받아들여 전념한 상태입니다. 철수가 적성을 탐색하지 않고 아버지의 영향으로 진로를 정한 사례가 해당합니다.\n\n정체감 유예는 탐색 중이지만 전념하지 않은 상태, 성취는 탐색 후 전념한 상태입니다."},"18-1-16":{"x":"에릭슨의 성인초기 과업인 친밀감 대 고립감과 스턴버그 사랑의 삼각형 이론의 구성요소(친밀감·열정·헌신)에 공통으로 들어가는 요소는 친밀감입니다."},"18-1-17":{"x":"스키너의 행동주의는 행동이 환경에 의해 결정된다는 환경결정론입니다.\n\n정신결정론은 프로이트, 상호결정론은 반두라의 가정입니다. 매슬로우는 인간의 자유의지와 성장 가능성을 강조했으므로 환경결정론이 아닙니다."},"18-1-18":{"x":"비물질문화는 관념문화(신념·신화·종교·과학)와 규범문화(법·관습·도덕)를 포함합니다.\n\n법과 관습은 규범문화이고, 신화와 전설은 관념문화입니다. 종교적 신념과 과학적 진리는 관념문화에 속하며, 문화는 중간체계가 아니라 거시체계입니다."},"18-1-19":{"x":"브론펜브레너의 거시체계는 국가, 사회제도, 문화, 가치관 등 가장 큰 사회적 맥락을 말합니다.\n\n1번은 개인, 2번은 미시체계, 4번은 중간체계에 대한 설명입니다. 거시체계는 일방적이 아니라 상호작용적 영향을 줍니다."},"18-1-20":{"x":"정체감 대 역할혼미(청소년기)의 자아 강점은 성실(충성)입니다. '목적'은 주도성 대 죄의식(학령전기)의 강점입니다."},"18-1-21":{"x":"엄마가 떠날 때 심하게 울고, 재회 후에도 안정되지 못하고 분노하며 울음을 그치지 않는 것은 불안정 저항(양가)애착의 전형적인 반응입니다.\n\n안정애착은 재회 시 쉽게 안정되고, 회피애착은 양육자를 무시하며, 혼란애착은 접근과 회피를 함께 보입니다."},"18-1-22":{"x":"태아기에 가장 먼저 발달하는 기관은 심장입니다. 임신 3~4주경 심장이 뛰기 시작합니다."},"18-1-23":{"x":"애착관계의 시작과 분리불안의 증가는 주로 영아기(생후 6~8개월 전후)의 특징입니다. 2~3세의 특징으로는 맞지 않습니다.\n\n2~3세에는 걷기·뛰기와 숟가락질이 가능해지고, 항문기에 배변훈련을 하며, 언어가 급격히 늘어 문장을 말하기 시작합니다."},"18-1-24":{"x":"중년기에는 결정성 지능(경험과 지식)은 유지되거나 증가하고, 유동성 지능(속도·추론)은 감소합니다. 5번은 반대로 서술했습니다."},"18-1-25":{"x":"영아기 대상영속성(ㄱ), 아동기 보존개념 획득과 분류·조합(ㄷ), 노년기 죽음에 대한 퀴블러-로스의 5단계(ㄹ)는 옳습니다.\n\nㄴ은 틀렸습니다. 유아기(3~6세)는 보상과 처벌을 피하려는 콜버그의 전인습적 수준입니다. 착한 아이 지향은 인습적 수준입니다."},"19-1-1":{"x":"성격은 비교적 일관되게 유지되는 특성이어서 행동을 예측할 수 있습니다. 심리역동적 특성 때문에 일관된 행동을 기대할 수 없다는 설명은 틀렸습니다."},"19-1-2":{"x":"발달이론은 신체·심리·사회적 기능을 분절적이 아니라 통합적으로 이해하게 합니다. 4번이 틀렸습니다."},"19-1-3":{"x":"발달은 일정한 순서와 방향이 있어 어느 정도 예측이 가능합니다. 예측 불가능한 변화라는 설명은 틀렸습니다."},"19-1-4":{"x":"영아기(신뢰감 대 불신감)의 긍정적 결과는 희망이고, 주요 관계는 어머니입니다. 지혜는 노년기(통합성 대 절망감)의 강점입니다."},"19-1-5":{"x":"불안의 3유형인 현실적 불안(ㄴ), 신경증적 불안(ㄷ), 도덕적 불안(ㄹ)에 대한 설명이 옳아서 ㄴ, ㄷ, ㄹ이 정답입니다.\n\nㄱ은 틀렸습니다. 불안은 자아가 위험을 예고하는 신호이고, 위급 상황에 적합하게 반응하지 못하는 상태가 아닙니다."},"19-1-6":{"x":"해리는 의식의 일부가 분리되는 것(기억 상실, 이인증 등)입니다. 어떤 대상에게 피해를 준 것을 취소하거나 무효화하는 것은 '취소(undoing)'입니다."},"19-1-7":{"x":"외향형(ㄱ)과 사고형(ㄷ)에 대한 설명이 옳습니다.\n\nㄴ은 감정형이 아니라 감각형의 설명입니다. ㄹ의 직관형은 가능성과 육감을 중시하며, 이성이 아니라 직관에 의존합니다."},"19-1-8":{"x":"원형과 집단무의식은 융의 분석심리이론 개념입니다. 에릭슨은 심리사회적 발달이론입니다."},"19-1-9":{"x":"콜버그의 후인습적 수준은 인간의 존엄성과 양심, 보편적 윤리에 따라 자율적·독립적으로 판단하는 단계입니다.\n\n1·4번은 전인습적 수준, 2번은 인습적 수준(3단계), 5번은 인습적 수준(4단계)의 특성입니다."},"19-1-10":{"x":"반두라가 말한 자기효능감의 원천은 성취경험, 대리경험, 언어적 설득, 정서적 각성입니다. 행동조성(조형)은 스키너의 조작적 조건화 기법입니다."},"19-1-11":{"x":"폐쇄체계는 엔트로피가 증가합니다(ㄱ). 환류는 정보의 투입에 대한 반응으로 적응에 쓰입니다(ㄴ). 체계는 부분이면서 전체이고 위계가 있습니다(ㄹ).\n\nㄷ은 틀렸습니다. 항상성은 외부와 교류하면서도 체계의 균형을 유지하려는 경향입니다."},"19-1-12":{"x":"생태학의 핵심 개념은 개인과 환경 간의 적합성입니다. 무의식 결정론은 정신분석, 단선적 인과론은 단순 인과 관점, 자아실현 경향성과 창조적 힘은 인본주의의 개념입니다."},"19-1-13":{"x":"가상공간은 시공을 초월한 새로운 공동체 형성을 가능하게 합니다.\n\n경계는 조직의 유지와 변화에 영향을 줍니다. 가족의 반복적 상호작용은 행동에 영향을 주고, 집단은 부분의 합 이상입니다. 지역사회는 완전개방체계가 아닙니다."},"19-1-14":{"x":"신념·태도·문화를 통해 간접적으로 영향을 미치는 것은 거시체계입니다. 중간체계는 미시체계 간의 상호작용입니다."},"19-1-15":{"x":"생태체계이론은 환경과의 상호작용을 중시합니다. 개인의 심리역동적 변화의지에 초점을 두는 것은 정신분석 관점입니다."},"19-1-16":{"x":"문화는 구성원이 공유하는 생활양식이며 다른 사회와 구별됩니다.\n\n문화는 거시체계이고 후천적으로 학습됩니다. 종교적 신념·신화·사상은 규범문화가 아니라 관념문화이고, 문화는 변화합니다."},"19-1-17":{"x":"이 문항은 시험에서 오류로 인정되어 1번과 2번이 모두 정답 처리되었습니다. 앱에서는 공식 정답표에 따라 1번을 정답으로 처리합니다.\n\n태아기(임신 3개월 이후 출생까지)와 태내기(수정 후 출생까지)의 구분 때문에 1번 표현이 부정확하고, 2번도 영향 요인 서술이 논란이었습니다. 3~5번은 임신부 연령·정서·약물이 태아에 영향을 준다는 옳은 설명입니다."},"19-1-18":{"x":"영아기에는 반사운동(ㄱ), 양육자와의 신뢰감 형성(ㄴ), 대상영속성 발달(ㄷ)이 나타납니다.\n\n서열화 사고는 구체적 조작기(아동기)의 특성입니다."},"19-1-19":{"x":"분리불안은 영아기의 특징입니다. 유아기(3~6세)는 전조작기이지만 분리불안을 대표 특성으로 보지 않습니다. 1번이 틀렸습니다."},"19-1-20":{"x":"아동기에는 동성 또래와의 관계를 통해 사회화를 경험합니다.\n\n자아중심적 사고는 유아기, 신뢰감 대 불신감은 영아기, 심리사회적 유예는 청소년기, 경험 없이 추론하는 것은 형식적 조작기(청소년기)의 특성입니다."},"19-1-21":{"x":"청소년기는 형식적 조작기에 해당합니다. 구체적 조작기는 아동기입니다."},"19-1-22":{"x":"청년기에도 부모로부터의 독립에 대한 양가감정이 완전히 해소된 것은 아닙니다. 1번이 틀렸습니다.\n\n직업의 준비와 선택, 친밀감 형성, 성역할 정체감 확립이 청년기의 주요 과업입니다."},"19-1-23":{"x":"중장년기에는 생산성 대 침체성(ㄱ), 빈둥지 증후군(ㄷ), 융의 개성화(ㄹ)가 나타납니다.\n\n전인습적 도덕기(ㄴ)는 유아기·아동기의 특성입니다."},"19-1-24":{"x":"퀴블러-로스의 4단계는 우울입니다. 의사의 오진이라고 생각하며 회피하는 것은 1단계인 부정에 해당합니다."},"19-1-25":{"x":"아동기의 주요 과업은 근면성(에릭슨)과 보존개념 획득(피아제)입니다.\n\n자율적 도덕성은 아동기 후반, 분류화는 아동기, 서열화는 아동기, 자아통합은 노년기의 과업입니다."},"20-1-1":{"x":"인간발달은 유전과 환경의 상호작용으로 이루어집니다. 환경보다 유전을 중시한다는 설명은 틀렸습니다."},"20-1-2":{"x":"성장은 양적 변화(ㄱ), 성숙은 유전인자에 의해 방향이 정해지는 발달(ㄴ), 학습은 경험과 훈련을 통한 변화(ㄷ)입니다. 모두 옳습니다."},"20-1-3":{"x":"클라이언트의 과거 정신적 외상을 중시하는 것은 정신분석(프로이트)입니다. 로저스는 현재의 경험과 자기결정, 공감, 비지시적·비심판적 태도를 강조했습니다."},"20-1-4":{"x":"개방형 가족체계는 에너지, 정보, 자원을 다른 체계와 교환합니다.\n\n1·2·4·5번은 외부와 단절되고 고립된 폐쇄형 가족체계의 특성입니다."},"20-1-5":{"x":"스키너의 행동주의이론과 강화계획이 맞는 연결입니다.\n\n타임아웃은 행동주의 기법이고, 합리정서치료는 엘리스의 이론이며, 자유연상은 프로이트의 기법입니다. 행동조성은 스키너와 연결됩니다."},"20-1-6":{"x":"로저스는 인간을 합목적적·건설적 존재로 보고(ㄱ), 완전히 기능하는 사람은 경험에 개방적이며(ㄷ), 무조건적 긍정적 관심이 건강한 성격발달의 핵심이라고 했습니다(ㄹ).\n\nㄴ은 틀렸습니다. 로저스는 객관적 현실보다 개인의 주관적 경험(현상학적 장)을 강조했습니다."},"20-1-7":{"x":"매슬로우의 위계에서 안전의 욕구는 소속과 사랑의 욕구보다 하위 단계입니다. 3번이 틀렸습니다."},"20-1-8":{"x":"페르소나는 개인이 사회에 보여주는 가면으로, 사회적 요구에 대한 반응입니다.\n\n1번은 아니마와 아니무스가 뒤바뀌었습니다. 2번은 프로이트, 3번의 음영(그림자)은 자기와 다른 개념이고, 집단무의식은 콤플렉스가 아니라 원형에 기초합니다."},"20-1-9":{"x":"사회적 관심, 창조적 자아, 가족형상은 아들러의 개인심리이론 개념입니다. 에릭슨의 이론이 아닙니다."},"20-1-10":{"x":"아들러는 인간을 사회적 존재로 보았고(ㄱ), 출생순위와 형제관계 경험이 생활양식에 영향을 준다고 했습니다(ㄷ).\n\n성격발달 단계를 제시한 것은 아닙니다(ㄴ)."},"20-1-11":{"x":"피아제는 발달이 아동과 환경의 상호작용으로 단계적으로 이루어지며 단계의 순서는 바뀌지 않는다고 보았습니다.\n\n추상적 사고와 가설검증은 형식적 조작기, 무의식은 프로이트, 도덕발달 6단계는 콜버그, 보존개념은 구체적 조작기에서 획득됩니다."},"20-1-12":{"x":"자신의 용납할 수 없는 욕망·충동을 타인의 것으로 돌리는 방어기제는 투사입니다."},"20-1-13":{"x":"관찰학습은 주의집중 → 보존(기억) → 운동재생 → 동기화(동기유발) 순서입니다. 마지막 단계는 운동재생이 아니라 동기화입니다."},"20-1-14":{"x":"행동주의는 행동이 환경 자극에 의해 동기화된다고 봅니다(ㄱ). 변별자극은 반응이 보상될 것이라는 신호입니다(ㄴ). 정적 강화와 부적 강화는 모두 행동의 빈도를 높입니다(ㄷ)."},"20-1-15":{"x":"생태학적 이론은 인간을 환경과 상호작용하는 능동적 존재로 봅니다. 수동적 존재로 보는 것은 틀렸습니다."},"20-1-16":{"x":"체계 내부나 외부와의 상호작용이 늘어 에너지가 증가하는 것은 시너지입니다.\n\n엔트로피는 무질서·에너지 소멸, 넥엔트로피는 체계가 질서와 에너지를 얻는 상태, 항상성은 균형 유지 경향, 홀론은 부분이자 전체인 체계 개념입니다."},"20-1-17":{"x":"자조집단은 비슷한 어려움을 가진 구성원들이 경험을 나누며 스스로 변화를 추구하는 집단입니다.\n\n일차집단은 혈연·지연의 자연발생 집단이고, 이차집단과 자연집단 설명이 서로 바뀌어 있습니다. 개방집단은 새 구성원이 들어올 수 있는 집단입니다."},"20-1-18":{"x":"터너증후군은 성염색체가 X 하나만 있는 여성(XO)입니다. 남아가 XXY 등을 가지는 것은 클라인펠터증후군입니다. 2번이 틀렸습니다."},"20-1-19":{"x":"연하반사·빨기반사는 생존반사이지만, 바빈스키반사와 모로반사는 원시반사로 분류되어 3번의 분류가 틀렸습니다."},"20-1-20":{"x":"아동기에는 단체놀이를 통해 개인의 목표가 집단의 목표에 속함을 알고 역할분담을 배웁니다(ㄷ).\n\nㄱ은 유아기, ㄴ(조합기술)과 ㄹ(가설연역적 사고)은 청소년기(형식적 조작기)에 해당합니다."},"20-1-21":{"x":"유아기(3~6세)는 프로이트의 남근기로, 오이디푸스·엘렉트라 콤플렉스가 일어납니다.\n\n후인습적 도덕은 청소년기 이후, 자율적 도덕성은 아동기 후반, 심리사회적 유예는 청소년기, 보존·분류는 구체적 조작기(아동기)의 특성입니다."},"20-1-22":{"x":"상상적 청중과 개인적 우화는 타인을 배려하는 사고가 아니라 청소년기의 자아중심성을 보여주는 현상입니다. 3번이 틀렸습니다."},"20-1-23":{"x":"퀴블러-로스의 마지막 단계는 타협이 아니라 수용입니다."},"20-1-24":{"x":"개성화를 통해 외부에 쏟던 에너지를 내면으로 돌린다고 설명한 것은 융입니다. 아들러가 아닙니다. 2번이 틀렸습니다."},"20-1-25":{"x":"마샤의 정체감 상태는 성취, 유예, 유실, 혼란 네 가지입니다. '정체감 수행'은 없습니다."},"21-1-1":{"x":"아들러의 개인심리이론은 인간을 분리할 수 없는 통합된 유기체로 보았고, 이 점이 실천에 기여했습니다.\n\n피아제는 단계의 순서가 불변이라고 보았고, 모방학습은 반두라, 스키너는 외적 강화를 강조, 생애발달 단계 파악은 에릭슨 등의 공헌입니다."},"21-1-2":{"x":"발달에는 결정적 시기가 있습니다.\n\n발달은 예측 가능하고, 안정성과 변화가 함께 있으며, 상부에서 하부, 중심에서 말초로 진행됩니다. 순서와 방향은 일정해도 속도에는 개인차가 있습니다."},"21-1-3":{"x":"생태학 이론은 정신적·환경적 결정론을 바탕으로 하지 않습니다(ㄴ은 틀림). 타인과 관계 맺는 능력은 후천적이 아니라 선천적(생득적)이라고 전제합니다(ㄹ은 틀림).\n\n상호작용하는 단일체계(ㄱ)와 상호교류의 산물로서의 성격(ㄷ)은 옳습니다."},"21-1-4":{"x":"남근기에는 동성 부모와의 동일시가 일어나 초자아가 형성됩니다.\n\n구강기·항문기·생식기·잠복기의 설명은 서로 뒤섞여 있습니다. 자율성 대 수치심은 에릭슨 이론, 오이디푸스 콤플렉스는 남근기, 잠복기는 리비도가 잠재되는 시기입니다."},"21-1-5":{"x":"에릭슨의 이론은 개념이 모호하고 과학적·경험적 근거가 부족하다는 비판을 받습니다.\n\n그는 생물학적·사회문화적 요인을 모두 인정했고, 성인기 이후까지 발달을 다루었으며, 자아의 창조적 기능을 강조했습니다."},"21-1-6":{"x":"융의 이론에서 자기는 중년 이후 나타나는 원형이고(ㄱ), 성격은 과거와 미래의 열망 모두의 영향을 받으며(ㄴ), 리비도는 삶의 에너지이고(ㄷ), 발달은 개성화를 통한 자기실현입니다(ㄹ). 모두 옳습니다."},"21-1-7":{"x":"위기와 전념으로 정체감을 구분한 것은 마샤의 이론입니다. 아들러의 생활양식 유형(지배형·획득형·회피형·사회적 유용형)과 무관해서 2번이 틀렸습니다."},"21-1-8":{"x":"관찰학습의 첫 단계는 주의집중이고, 마지막이 동기화(동기유발)입니다. 4번은 순서를 잘못 서술했습니다."},"21-1-9":{"x":"행동조성(shaping)은 목표 행동에 가까운 행동을 단계적으로 강화해 복잡한 행동을 습득시키는 기법입니다.\n\n스키너는 반응적 행동보다 조작적 행동을 강조했고, 행동은 환경의 결과로 보았습니다. 변동간격계획은 시간 간격이 변하는 계획이며, 부적 강화는 행동 빈도를 높입니다."},"21-1-10":{"x":"로저스는 보편적·객관적 경험이 아니라 개인의 주관적 경험을 강조했습니다. 3번이 틀렸습니다."},"21-1-11":{"x":"매슬로우는 하위 욕구가 어느 정도 충족되면 상위 욕구가 나타난다고 했으며, 하위 욕구가 완전히 충족되어야만 한다고 보지 않았습니다. 4번이 틀렸습니다."},"21-1-12":{"x":"피아제가 든 인지발달 촉진 요인은 성숙, 물리적 경험, 사회적 상호작용, 평형화입니다. 애착 형성은 포함되지 않습니다."},"21-1-13":{"x":"넥엔트로피(ㄴ)는 체계 내 유용하지 않은 에너지가 줄고 질서가 늘어나는 상태이고, 공유영역(ㄷ)은 체계 간 교류가 일어나는 부분입니다.\n\n균형은 구조를 바꾸는 과정이 아니라 안정을 유지하는 상태이고, 홀론은 부분이면서 전체인 체계를 뜻합니다."},"21-1-14":{"x":"둘 이상의 미시체계 간 상호작용은 중간체계입니다. 개인이 직접 참여하지 않지만 발달에 영향을 주는 환경은 외체계입니다."},"21-1-15":{"x":"자신의 죽음을 인정하고 가족을 배려하며 조용히 이야기를 나누는 것은 수용 단계입니다."},"21-1-16":{"x":"이 문항은 시험에서 오류로 확정되어 전항 정답 처리되었습니다. 앱에서는 가답안인 4번을 정답으로 처리합니다.\n\n성염색체 이상(클라인펠터·터너), 임산부 불안의 영향, 영양 섭취, 기형발생물질에 대한 1·2·3·5번은 옳습니다."},"21-1-17":{"x":"자율성 대 수치심은 유아기(2~4세)의 위기입니다. 영아기는 신뢰감 대 불신감입니다."},"21-1-18":{"x":"유아기는 영아기에 비해 성장 속도가 느려집니다. 5번이 틀렸습니다."},"21-1-19":{"x":"이 문항은 시험에서 오류로 확정되어 전항 정답 처리되었습니다. 앱에서는 가답안인 3번을 정답으로 처리합니다.\n\n아동기(구체적 조작기)에는 보존개념과 분류·유목화가 가능합니다. 가설연역적 추리와 자아정체감 획득은 청소년기의 특성입니다."},"21-1-20":{"x":"이 문항은 시험에서 1번과 5번이 정답 처리되었습니다. 앱에서는 1번을 정답으로 처리합니다.\n\n성적 성숙에는 개인차가 있지만 발달의 순서는 대체로 일정합니다. 1차 성징은 생식기관, 2차 성징은 가슴·변성 등 외형 변화여서 4·5번 설명은 서로 뒤바뀌었습니다."},"21-1-21":{"x":"하비거스트의 청년기 과업은 배우자 선택, 직장생활 시작, 직업 준비와 선택, 사회적 집단 형성 등입니다. 경제적 수입 감소에 대한 적응은 노년기의 과업입니다."},"21-1-22":{"x":"혼(Horn)은 반대로 결정적(결정성) 지능은 유지·증가하고, 유동적 지능은 감소한다고 했습니다. 1번이 틀렸습니다."},"21-1-23":{"x":"공식 정답표는 5번입니다. 분리이론(상호 분리), 활동이론(역할 대치 활동), 에릭슨의 자아통합, 퀴블러-로스의 5단계는 모두 노년기에 관한 옳은 설명입니다.\n\n5번의 펙 이론은 중년기와 노년기의 과업을 나누어 제시한 이론이어서 논란의 여지가 있는 보기입니다. 앱은 공식 정답 5번으로 채점하며, 이 문항은 오류 신고 대상으로 두는 것을 권합니다."},"21-1-24":{"x":"거시체계는 역사적·사회적·문화적 요인에 의해 형성되고 수정됩니다.\n\n1번은 가족체계의 구성요소, 3번은 미시체계, 4번은 여러 체계를 뭉뚱그린 설명이며, 거시체계는 일방적이 아니라 상호작용적 영향을 줍니다."},"21-1-25":{"x":"노년기는 노화와 함께 경제적 어려움, 역할 상실, 죽음에 대한 두려움 등 심리적 위기를 경험할 수 있습니다. 심리적 위기가 없다는 설명은 틀렸습니다."},"22-1-1":{"x":"발달에는 결정적(최적의) 시기가 존재합니다. 최적의 시기가 존재하지 않는다는 설명은 틀렸습니다."},"22-1-2":{"x":"성숙은 유전인자에 의해 방향이 정해지는 발달입니다. 환경과의 상호작용에 의한 사회적 발달은 학습에 가깝습니다. 2번이 틀렸습니다."},"22-1-3":{"x":"같은 나이인데도 노안, 흰머리, 기억력 저하의 정도가 사람마다 다르다는 사례는 발달에 개인차가 있음을 보여줍니다."},"22-1-4":{"x":"잠복기에는 원초아의 충동이 약해지고 초자아가 강해집니다(ㄴ). 방어기제는 외부 요구와 내적 불안으로부터 스스로를 보호하려는 무의식적 시도입니다(ㄹ).\n\nㄱ은 틀렸습니다. 일차적 사고과정과 쾌락원칙은 원초아의 특징이고, 자아는 이차적 사고과정과 현실원칙을 따릅니다. ㄷ의 신경증적 불안은 원초아의 충동을 자아가 통제하지 못할 때 나타납니다."},"22-1-5":{"x":"페르소나는 외부 요구와 기대에 맞추는 과정에서 생긴 자아의 가면입니
