회의 문화적 우월성을 전제로한다.","용광로 개념은 동화주의와 관련이 있다."],"a":2},{"id":"23-1-20","y":2023,"g":1,"n":20,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["노년기(65세 이상)에 관한 설명으로 옳지 않은 것은?"],"c":["주요 과업은 이제까지의 자신의 삶을 수용하는 것이다.","생에 대한 회상이 증가하고 사고의 융통성이 증가한다.","친근한 사물에 대한 애착이 많아진다.","치매의 발병 가능성이 다른 연령대에 비해 높아진다.","내향성이 증가한다."],"a":2},{"id":"23-1-21","y":2023,"g":1,"n":21,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["신생아기(출생-1개월)의 반사운동에 관한 설명으로 옳지 않은 것은?"],"c":["바빈스키반사(babinski reflect)는 입 부근에 부드러운 자극을 주면 자극이 있는 쪽으로 입을 벌리는 반사운동이다.","파악반사(grasping reflect)는 손에 닿는 것을 움켜쥐고놓지 않으려는 반사운동이다.","연하반사(swallowing reflect)는 입 속에 있는 음식물을삼키려는 반사운동이다.","모로반사(moro reflect)는 갑작스러운 외부 자극에 팔과다리를 쭉 펴면서 껴안으려고 하는 반사운동이다.","원시반사(primitive reflect)에는 바빈스키, 모로, 파악, 걷기 반사 등이 있다."],"a":1},{"id":"23-1-22","y":2023,"g":1,"n":22,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["청소년기(13-19세)에 관한 설명으로 옳지 않은 것은?"],"c":["친밀감 형성이 주요 발달과업이다.","신체적 발달이 활발하여 제2의 성장 급등기로 불린다.","특징적 발달 중 하나로 성적 성숙이 있다.","정서의 변화가 심하며 극단적 정서를 경험하기도 한다.","추상적 이론과 관념적 사상에 빠져 때로 부정적 정서를경험한다."],"a":1},{"id":"23-1-23","y":2023,"g":1,"n":23,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 모두 고르기","s":["아동기(7-12세)에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 제1의 반항기이다.","ㄴ. 조합기술의 획득으로 사칙연산이 가능해진다.","ㄷ. 객관적, 논리적 사고가 가능해진다.","ㄹ. 정서적 통제와 분화된 정서표현이 가능해진다.","ㅁ. 타인의 입장을 고려하지 못한다."],"c":["ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄷ, ㄹ, ㅁ","ㄱ, ㄷ, ㄹ, ㅁ"],"a":3},{"id":"23-1-24","y":2023,"g":1,"n":24,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 모두 고르기","s":["생애주기별 특징으로 옳은 것을 모두 고른 것은?","ㄱ. 유아기(3-6세)는 성역할을 인식하기 시작한다.","ㄴ. 아동기(7-12세)는 자기중심성을 보이며 자신의 시각에서 사물을 본다.","ㄷ. 성인기(20-35세)는 신체적 기능이 최고조에 달하며 이 시기를 정점으로 쇠퇴하기 시작한다.","ㄹ. 노년기(65세 이상)는 단기기억보다 장기기억의 감퇴 속도가 느리다."],"c":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":4},{"id":"23-1-25","y":2023,"g":1,"n":25,"t":"체계이론·생태체계","f":"옳지 않은 것","s":["이상행동과 사회복지실천에 관한 설명으로 옳지 않은 것은?"],"c":["사회문화적 규범에서 벗어나거나 개인과 타인에게 불편과 고통을 유발하는 행동이다.","유일한 진단분류체계로 '정신질환 진단 및 통계편람(DSM)'이 있다.","이상행동의 개념은 사회문화, 역사진행과정의 영향을 받는다.","정신건강사회복지사가 전문실천가로 활동한다.","이상행동은 클라이언트들이 겪는 문제의 원인이나 결과가 되기도 한다."],"a":2},{"id":"24-1-1","y":2024,"g":1,"n":1,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["인간발달이론이 사회복지실천에 미친 영향으로 옳지 않은 것은?"],"c":["스키너(B. Skinner) 이론은 행동결정요인으로 인지와 정서의 중요성을 이해하는 계기를 제공하였다.","융(C. Jung) 이론은 중년기 이후의 발달을 이해하는데 도움을 제공하였다.","에릭슨(E. Erikson) 이론은 생애주기별 실천개입의 기반을제공하였다.","프로이트(S. Freud) 이론은 인간행동의 무의식적 측면을심층적으로 분석할 수 있는 기반을 제공하였다.","매슬로우(A. Maslow) 이론은 인간의 욕구를 파악할 수 있는 근거를 마련하였다."],"a":1},{"id":"24-1-2","y":2024,"g":1,"n":2,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["인간발달에 관한 설명으로 옳은 것은?"],"c":["긍정적ㆍ상승적 변화는 발달로 간주하지만, 부정적ㆍ퇴행적 변화는 발달로 보지 않는다.","순서대로 진행되고 예측가능하다는 특징이 있다.","인간의 전반적 변화를 다루기 때문에 개인차는 중요하지않다고 본다.","키ㆍ몸무게 등의 질적 변화와 인지특성ㆍ정서 등의 양적변화를 모두 포함하는 개념이다.","각 발달단계에서의 발달 속도는 거의 일정한 것으로 알려져 있다."],"a":2},{"id":"24-1-3","y":2024,"g":1,"n":3,"t":"사회환경(가족·집단·조직·문화·지역사회)","f":"옳지 않은 것","s":["문화와 관련된 설명으로 옳지 않은 것은?"],"c":["문화는 인간집단의 생활양식의 총체로 정의할 수 있다.","다문화주의는 다양한 문화나 언어를 공유하고 상호 존중하여 적극 수용하려는 입장을 취한다.","베리(J. Berry)의 이론에서 동화(assimilation)는 자신의 고유문화와 새로운 문화를 모두 존중하는 상태를 의미한다.","문화는 학습되고 전승되는 특징이 있다.","주류와 비주류 문화 사이의 권력 차이로 차별이 발생할수 있다."],"a":3},{"id":"24-1-4","y":2024,"g":1,"n":4,"t":"행동주의·사회학습이론","f":"옳지 않은 것","s":["스키너(B. Skinner)의 이론에 관한 설명으로 옳지 않은 것은?"],"c":["강화계획 중 반응율이 가장 높은 것은 가변비율(variable-ratio) 계획이다.","정적 강화물의 예시로 음식, 돈, 칭찬 등을 들 수 있다.","인간행동은 예측가능하며 통제될 수 있다고 본다.","인간의 창조성과 자아실현을 강조한다.","부적 강화는 바람직한 행동의 빈도를 증가시키는데 초점을 둔다."],"a":4},{"id":"24-1-5","y":2024,"g":1,"n":5,"t":"융·아들러(분석심리·개인심리)","f":"옳은 것 모두 고르기","s":["학자와 주요개념의 연결로 옳은 것을 모두 고른 것은?","ㄱ. 로저스(C. Rogers) - 자기실현 경향성","ㄴ. 벡(A. Beck) - 비합리적인 신념","ㄷ. 반두라(A. Bandura) - 행동조성","ㄹ. 아들러(A. Adler) - 집단무의식"],"c":["ㄱ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"a":1},{"id":"24-1-6","y":2024,"g":1,"n":6,"t":"융·아들러(분석심리·개인심리)","f":"옳은 것 고르기","s":["아들러(A. Adler)의 이론에 관한 설명으로 옳은 것은?"],"c":["성격은 점성원리에 따라 발달한다.","개인의 창조성을 부정한다.","무의식적 결정론을 고수하고 있다.","유전적ㆍ환경적 요인의 중요성을 배제한다.","인간을 목표지향적 존재로 본다."],"a":5},{"id":"24-1-7","y":2024,"g":1,"n":7,"t":"에릭슨 심리사회적 발달","f":"옳은 것 고르기","s":["에릭슨(E. Erikson)의 심리사회적 발달단계 위기와 성취 덕목(virtue)이 옳게 연결된 것은?"],"c":["근면성 대 열등감 - 성실(fidelity)","주도성 대 죄의식 - 목적(purpose)","신뢰 대 불신 - 의지(will)","자율성 대 수치심과 의심 - 능력(competence)","정체감 대 정체감 혼란 - 희망(hope)"],"a":2},{"id":"24-1-8","y":2024,"g":1,"n":8,"t":"인본주의(로저스·매슬로우)","f":"옳지 않은 것","s":["로저스(C. Rogers) 이론에 관한 설명으로 옳지 않은 것은?"],"c":["개인의 잠재력 실현을 위하여 조건적 긍정적 관심의 제공이 중요함을 강조하였다.","자기실현을 완성하는 사람의 특성을 완전히 기능하는 사람(fully functioning person)이라는 용어로 제시하였다.","클라이언트에 대한 공감적 이해의 중요성을 강조하였다.","주관적이고 사적인 경험 세계를 강조하였다.","인간을 긍정적이며 창조적인 존재로 보았다."],"a":1},{"id":"24-1-9","y":2024,"g":1,"n":9,"t":"융·아들러(분석심리·개인심리)","f":"옳은 것 고르기","s":["융(C. Jung)의 이론에 관한 설명으로 옳은 것은?"],"c":["정신분석(psychoanalysis)이론이라 불린다.","사회적 관심과 활동수준을 기준으로 심리적 유형을 8가지로 구분하였다.","발달단계에 관하여 언급하지 않았다는 특징을 지니고 있다.","개성화(individuation)를 통한 자기실현과정을 중요시하였다.","성격형성에 있어서 창조적 자기(creative self)의 역할을강조하였다."],"a":4},{"id":"24-1-10","y":2024,"g":1,"n":10,"t":"행동주의·사회학습이론","f":"옳은 것 모두 고르기","s":["반두라(A. Bandura)의 이론에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 개인의 신념, 기대와 같은 인지적 요인을 중요시 하였다.","ㄴ. 대리적 강화(vicarious reinforcement)의 중요성을 강조하였다.","ㄷ. 자기효능감을 높이는 가장 효과적인 방법으로 대리적 경험을 제시하였다.","ㄹ. 외부로부터 주어지는 강화의 중요성을 강조하는 자기강화(self reinforcement)의 개념을 제시하였다."],"c":["ㄱ","ㄴ","ㄱ, ㄴ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"24-1-11","y":2024,"g":1,"n":11,"t":"프로이트·정신분석·방어기제","f":"옳지 않은 것","s":["방어기제와 그 예시로 옳지 않은 것은?","생각한다."],"c":["합리화(rationalization): 지원한 회사에 불합격한 후 그냥한번 지원해본 것이며 합격했어도 다니지 않았을 것이라","억압(repression): 시험을 망친 후 성적발표 날짜를 아예잊어버린다.","투사(projection): 자신이 싫어하는 직장 상사에 대해서상사가 자기를 싫어하기 때문에 사이가 나쁘다고 여긴다.","반동형성(reaction formation): 관심이 가는 이성에게 오히려 짓궂은 말을 하게 된다.","전치(displacement): 낮은 성적을 받은 이유를 교수가중요치 않은 문제만 출제한 탓이라 여긴다."],"a":5},{"id":"24-1-12","y":2024,"g":1,"n":12,"t":"피아제 인지발달","f":"옳지 않은 것","s":["피아제(J. Piaget)의 이론에 관한 설명으로 옳지 않은 것은?"],"c":["인간은 자신과 환경 사이에 조화로운 관계인 평형화(equilibration)를 이루고자 하는 경향성이 있다.","감각운동기에 대상영속성(object permanence)을 획득한다.","조절(accommodation)은 새로운 정보를 접했을 때 기존의 도식을 변경하는 것을 말한다.","구체적 조작기에는 추상적 사고가 가능해진다.","보존(conservation) 개념 획득을 위해서는 동일성, 가역성, 보상성의 원리를 이해해야 한다."],"a":4},{"id":"24-1-13","y":2024,"g":1,"n":13,"t":"체계이론·생태체계","f":"옳은 것 고르기","s":["생태체계 이론의 중간체계(meso system)에 관한 설명으로 옳은 것은?"],"c":["미시체계 간의 상호작용에 초점을 둔다.","개인이 직접적으로 대면하는 체계를 의미한다.","신념, 태도, 전통 등을 통해 영향력을 행사한다.","대표적인 중간체계로 가족과 집단을 들 수 있다.","문화, 정치, 사회, 법, 종교 등이 해당된다."],"a":1},{"id":"24-1-14","y":2024,"g":1,"n":14,"t":"체계이론·생태체계","f":"옳은 것 모두 고르기","s":["체계로서의 지역사회에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 지역을 중심으로 형성된 공동체적 특징을 지닌다.","ㄴ. 구성원에게 사회규범에 순응하도록 규제하는 사회통제의 기능을 지닌다.","ㄷ. 사회가 향유하는 지식, 가치 등을 구성원에게 전달하는 기능을 지닌다.","ㄹ. 외부와 상호작용을 통하여 엔트로피(entropy) 상태를 유지하는 것이 필요하다."],"c":["ㄱ","ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"24-1-15","y":2024,"g":1,"n":15,"t":"체계이론·생태체계","f":"사례·제시문 판단","s":["브론펜브레너(U. Bronfenbrenner)의 생태체계이론에서 다음에 해당하는 개념으로 옳은 것은?","- 전 생애에 걸쳐 발생하는 변화와 사회역사적인 환경을 포함한다.","- 인간의 생애 단일 사건 뿐 아니라 시간의 경과와 함께 연속적으로 일어나는 사건들이 누적되어 영향을 미친다는 것을 보여주고 있다."],"c":["미시체계(micro system)","외체계(exo system)","거시체계(macro system)","환류체계(feedback system)","시간체계(chrono system)"],"a":5},{"id":"24-1-16","y":2024,"g":1,"n":16,"t":"체계이론·생태체계","f":"사례·제시문 판단","s":["다음에 해당하는 개념으로 옳은 것은?","- 한 체계에서 일부가 변화하면 그 변화가 체계의 나머지 부분들의 변화를 초래하게 되는 개념을 말한다.","- 예시로는 회사에서 간부 직원이 바뀌었을 때, 파생적으로 나타나는 조직의 변화 및 직원 역할의 변화 등을 들 수 있다."],"c":["균형(equilibrium)","호혜성(reciprocity)","안정상태(steady state)","항상성(homeostasis)","적합성(goodness of fit)"],"a":2},{"id":"24-1-17","y":2024,"g":1,"n":17,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["영아기(0-2세)에 관한 설명으로 옳은 것은?"],"c":["콜버그(L. Kohlberg): 전인습적 도덕기에 해당한다.","에릭슨(E. Erikson): 주 양육자와의 “신뢰 대 불신”이 중요한 시기이다.","피아제(J. Piaget): 보존(conservation) 개념이 확립되는시기이다.","프로이트(S. Freud): 거세불안(castration anxiety)을 경험하는 시기이다.","융(C. Jung): 생활양식이 형성되는 시기이다."],"a":2},{"id":"24-1-18","y":2024,"g":1,"n":18,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["청소년기(13-19세)에 관한 설명으로 옳지 않은 것은?"],"c":["신체적 측면에서 제2의 급성장기이다.","심리적 이유기의 특징을 보인다.","부모보다 또래집단의 영향력이 커진다.","피아제(J. Piaget)에 의하면 비가역적 사고의 특징이 나타나는 시기이다.","프로이트(S. Freud)의 심리성적발달단계에서 생식기에해당한다."],"a":4},{"id":"24-1-19","y":2024,"g":1,"n":19,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["유아기(3-6세)에 관한 설명으로 옳지 않은 것은?"],"c":["자신의 성을 인식하는 성 정체성이 발달한다.","놀이를 통한 발달이 활발한 시기이다.","신체적 성장이 영아기(0-2세)보다 빠른 속도로 진행된다.","언어발달이 현저하게 이루어지는 시기이다.","정서적 표현의 특징은 일시적이며 유동적이다."],"a":3},{"id":"24-1-20","y":2024,"g":1,"n":20,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["청년기(20-39세)에 관한 설명으로 옳은 것은?"],"c":["에릭슨(E. Erikson)은 근면성의 발달을 중요한 과업으로보았다.","다른 시기에 비하여 경제적으로 안정되어 있고 직업에서도 높은 지위와 책임을 갖게 된다.","빈둥지 증후군을 경험하는 시기이다.","또래와의 상호작용을 통하여 자아개념이 발달하기 시작한다.","직업 준비와 직업선택에 대한 의사결정을 하는 시기이다."],"a":5},{"id":"24-1-21","y":2024,"g":1,"n":21,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["생애주기와 발달적 특징의 연결로 옳지 않은 것은?"],"c":["영아기(0-2세) - 애착발달","아동기(7-12세) - 자아정체감 확립","청소년기(13-19세) - 제2차 성장의 발달","중년기(40-64세) - 신진대사의 저하","노년기(65세 이상) - 내향성과 수동성의 증가"],"a":2},{"id":"24-1-22","y":2024,"g":1,"n":22,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["다음 중 태내기(수정-출산)에 관한 설명으로 옳지 않은 것은?"],"c":["배종기(germinal period)는 수정 후 수정란이 자궁벽에착상할 때까지의 시기를 말한다.","임신 3개월이 지나면 태아의 성별구별이 가능해진다.","양수검사(amniocentesis)를 통해서 다운 증후군 등 다양한 유전적 결함을 판별할 수 있다.","임신 중 어머니의 과도한 음주는 태아알콜증후군(fetalalcohol syndrome)을 초래할 수 있다.","배아의 구성은 외배엽과 내배엽으로 이루어지며, 외배엽은 폐, 간, 소화기관 등을 형성하게 된다."],"a":5},{"id":"24-1-23","y":2024,"g":1,"n":23,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["중년기(40-64세)의 설명으로 옳은 것은?"],"c":["에릭슨(E. Erikson)에 의하면 “생산성 대 침체”라는 심리사회적 위기를 극복하게 되면 돌봄(care)의 덕목을 갖추게 된다.","유동성 지능(fluid intelligence)은 높아지며 문제해결능력도 향상될 수 있다.","자아통합이 완성되는 시기로 자신의 삶에 대한 평가를시도한다.","갱년기 증상은 여성에게 나타나고 남성은 경험하지 않는다.","융(C. Jung)에 의하면 남성에게는 아니무스가, 여성에게는 아니마가 드러나는 시기이다."],"a":1},{"id":"24-1-24","y":2024,"g":1,"n":24,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 모두 고르기","s":["아동기(7-12세)의 발달에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 프로이트(S. Freud): 성 에너지(리비도)가 무의식 속에 잠복하는 잠재기(latency stage)","ㄴ. 피아제(J. Piaget): 보존, 분류, 유목화, 서열화 등의 개념을 점차적으로 획득","ㄷ. 콜버그(L. Kohlberg): 인습적 수준의 도덕성 발달단계로 옮겨가는 시기","ㄹ. 에릭슨(E. Erikson): \"주도성 대 죄의식\"의 발달이 중요한 시기"],"c":["ㄱ, ㄴ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":3},{"id":"24-1-25","y":2024,"g":1,"n":25,"t":"체계이론·생태체계","f":"옳지 않은 것","s":["체계이론에 관한 설명으로 옳지 않은 것은?","려운 방식으로 움직이고 있다는 정보를 제공하여 체계의 변화를 도모한다."],"c":["넥엔트로피(negentropy)란 체계를 유지하고, 발전을 도모하고, 생존하는 것을 의미한다.","항상성(homeostasis)은 비교적 안정적으로 균형 상태를유지하기 위한 체계의 경향을 말한다.","경계(boundary)는 체계를 외부 환경과 구분 짓는 둘레를말한다.","다중종결성(multifinality)은 서로 다른 경로와 방법을 통해 같은 결과에 도달할 수 있음을 말한다.","부적 환류(negative feedback)는 체계가 목적 달성이 어"],"a":4},{"id":"25-1-1","y":2025,"g":1,"n":1,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["인간발달이론과 사회복지실천에 관한 설명으로 옳은 것은?"],"c":["인간발달이론은 문제의 사정단계에서만 유용하다.","발달 단계별 욕구를 기반으로 사회복지서비스를 개발할수 있다.","클라이언트를 둘러싼 환경의 영향력을 평가할 수 없다.","사회환경보다 클라이언트의 생물학적 요소를 더 중시한다.","다양한 클라이언트의 발달과업을 획일적으로 이해할 수있다."],"a":2},{"id":"25-1-2","y":2025,"g":1,"n":2,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["인간발달의 개념과 원리에 관한 설명으로 옳은 것은?"],"c":["발달에는 개인차가 존재하므로 최적의 시기가 따로 존재하지 않는다.","일정한 순서와 방향이 없어서 예측이 불가능하다.","성숙(maturation)은 경험이나 훈련의 결과와 상관없이 진행된다.","발달은 소근육 말초부위에서 대근육 중심부위로 진행된다.","성장(growth)은 유전적으로 미리 정해진 정도까지 도달하는 생물학적 변화이다."],"a":3},{"id":"25-1-3","y":2025,"g":1,"n":3,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["인간행동에 관한 관점으로 옳지 않은 것은?"],"c":["정신분석이론은 유년기의 경험을 강조한다.","생태체계이론은 환경속의 인간의 관점을 강조한다.","인지이론은 인간의 사고가 감정과 행동을 결정한다고 본다.","인본주의이론은 인간에 대한 무조건적인 존중을 강조한다.","행동주의이론은 개인의 무의식을 강조한다."],"a":5},{"id":"25-1-4","y":2025,"g":1,"n":4,"t":"융·아들러(분석심리·개인심리)","f":"옳은 것 고르기","s":["성격이론, 학자 및 주요 개념의 연결이 옳은 것은?"],"c":["인본주의이론 - 융(C. Jung) - 동화","정신분석이론 - 매슬로우(A. Maslow) - 열등감","인지발달이론 - 피아제(J. Piaget) - 결핍동기","개인심리이론 - 아들러(A. Adler) - 생활양식","분석심리이론 - 로저스(C. Rogers) - 아니마"],"a":4},{"id":"25-1-5","y":2025,"g":1,"n":5,"t":"행동주의·사회학습이론","f":"옳은 것 모두 고르기","s":["행동주의이론에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 인간을 주관적인 존재로 규정하였다.","ㄴ. 인간행동은 인간이 지닌 자유의지의 결과이다.","ㄷ. 선행조건과 결과에 따라 행동이 형성된다는 입장을 가지고 있다.","ㄹ. 경험주의에 근간을 두고 구체적으로 관찰할 수 있는 행동에 초점을 둔다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ"],"a":4},{"id":"25-1-6","y":2025,"g":1,"n":6,"t":"행동주의·사회학습이론","f":"옳지 않은 것","s":["스키너(B. Skinner)의 이론에 관한 설명으로 옳지 않은 것은?"],"c":["부적강화는 바람직한 행동의 빈도를 감소시킨다.","가변비율(variable-ratio)계획이 강화계획 중에서 반응률이가장 높다.","인간행동은 내적 충동보다는 외적 자극에 반응하여 나타난다.","고정간격(fixed-interval)계획은 정해진 시간 간격이 지난후 강화를 주는 것이다.","인간행동은 예측 가능하며 통제할 수 있다."],"a":1},{"id":"25-1-7","y":2025,"g":1,"n":7,"t":"융·아들러(분석심리·개인심리)","f":"옳지 않은 것","s":["아들러(A. Adler)의 이론에 관한 설명으로 옳지 않은 것은?"],"c":["인간은 사회적 관심에 의해 동기화된다.","출생순위는 성격형성에 영향을 준다.","우월에 대한 추구는 선천적으로 타고 나는 것이다.","성격유형을 태도와 기능의 조합에 따라 구분했다.","가상적 목표(fictional finalism)는 어려움에 부딪힐 때 효과적으로 대처하는데 도움이 된다."],"a":4},{"id":"25-1-8","y":2025,"g":1,"n":8,"t":"프로이트·정신분석·방어기제","f":"옳지 않은 것","s":["프로이트(S. Freud)의 이론에 관한 설명으로 옳지 않은 것은?"],"c":["초자아(superego)의 특질은 자아이상(ego ideal)과 양심(conscience)으로 구성된다.","프로이트(S. Freud)는 실수행위를 통해 무의식이 작용하는 증거를 파악하였다.","내면화(introjection)는 심리적 갈등이 근육계통의 증상으로 나타나는 방어기제이다.","자아(ego)는 2차적 사고과정과 현실원칙에 의해 지배된다.","남자아이는 남근기에 오이디푸스 콤플렉스(Oedipuscomplex)로 인한 거세불안을 경험한다."],"a":3},{"id":"25-1-9","y":2025,"g":1,"n":9,"t":"인본주의(로저스·매슬로우)","f":"옳지 않은 것","s":["로저스(C. Rogers)의 이론에 관한 설명으로 옳지 않은 것은?"],"c":["인간의 내재된 잠재력을 강조한다.","인간의 욕구발달단계를 제시한다.","인간의 자아실현 경향성을 강조한다.","인간의 주관적 경험을 강조한다.","인간을 통합적 존재로 본다."],"a":2},{"id":"25-1-10","y":2025,"g":1,"n":10,"t":"피아제 인지발달","f":"옳지 않은 것","s":["피아제(J. Piaget)의 이론에서 '구체적 조작기'에 관한 설명으로 옳지 않은 것은?"],"c":["물활론적 사고를 한다.","논리적 사고가 가능해진다.","보존개념을 획득한다.","순서대로 나열하는 것이 가능해진다.","자기중심성에서 벗어나 타인의 입장을 고려할 수 있게된다."],"a":1},{"id":"25-1-11","y":2025,"g":1,"n":11,"t":"인본주의(로저스·매슬로우)","f":"옳은 것 고르기","s":["매슬로우(A. Maslow)의 이론에 관한 설명으로 옳은 것은?"],"c":["인간의 무의식을 강조하였다.","인간의 본성은 본래 선하다고 주장하였다.","인간행동에 대한 환경결정론을 강조하였다.","자기완성의 필수요인으로 열등감 극복을 강조하였다.","모방학습의 중요성을 강조하였다."],"a":2},{"id":"25-1-12","y":2025,"g":1,"n":12,"t":"체계이론·생태체계","f":"옳지 않은 것","s":["생태체계이론과 사회복지실천의 연관성으로 옳지 않은 것","은?"],"c":["문제에 대한 총체적 이해와 접근을 용이하게 해준다.","사회복지실천을 위한 사정도구로서 유용성을 가진다.","환경의 체계 수준별 개입 근거를 제시한다.","각 체계들로부터 다양한 정보획득이 용이하다.","원인과 결과의 단선적 인과관계를 강조한다."],"a":5},{"id":"25-1-13","y":2025,"g":1,"n":13,"t":"체계이론·생태체계","f":"옳은 것 모두 고르기","s":["사회체계이론에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 엔트로피(entropy)는 폐쇄체계에서 주로 나타난다.","ㄴ. 항상성(homeostasis)은 체계의 혼란과 무질서를 증가시킨다.","ㄷ. 체계(system)의 속성은 경계의 개방성과 침투성에 따라 결정된다.","ㄹ. 균형(equilibrium)은 주로 외부와의 교류가 활발한 개방체계에서 나타난다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":2},{"id":"25-1-14","y":2025,"g":1,"n":14,"t":"콜버그·도덕성 발달","f":"옳은 것 고르기","s":["콜버그(L. Kohlberg)의 이론에 관한 설명으로 옳은 것은?"],"c":["전인습적 수준: 사회적인 인정에 관심을 가지고 착한 행동을 함으로써 타인의 인정을 받고자 한다.","인습적 수준: 개인의 양심에 비추어 옳고 그름을 판단한다.","인습적 수준: 행동의 결과가 가져오는 보상이나 처벌에의해 옳고 그름을 판단한다.","후인습적 수준: 사회질서의 유지를 위해 법과 규칙은 준수되어야 하지만, 민주적인 절차를 통해 바뀔 수 있다고생각한다.","후인습적 수준: 규칙을 준수하고 사회질서를 유지하는것이 도덕적 행동이라 생각한다."],"a":4},{"id":"25-1-15","y":2025,"g":1,"n":15,"t":"사회환경(가족·집단·조직·문화·지역사회)","f":"사례·제시문 판단","s":["다음에 해당하는 사회환경 수준으로 옳은 것은?","○ 개인에게 영향을 주는 정부의 입법과 사회정책","○ 방송매체를 통하여 형성된 외모, 의복, 문화 등에 관한 유행"],"c":["미시체계","중간체계","거시체계","외체계","시간체계"],"a":3},{"id":"25-1-16","y":2025,"g":1,"n":16,"t":"체계이론·생태체계","f":"옳은 것 고르기","s":["브론펜브레너(U. Bronfenbrenner)의 중간체계(mesosystem)에 관한 설명으로 옳은 것은?"],"c":["가족, 친구, 학교, 종교단체 등이 포함된다.","부모와 교사와의 관계, 형제관계 등을 말한다.","신념, 태도, 전통을 통해 개인에게 영향을 준다.","아동의 발달에 영향을 주는 학교위원회가 해당된다.","개인이 어느 시대에 출생했는지에 관심을 둔다."],"a":2},{"id":"25-1-17","y":2025,"g":1,"n":17,"t":"체계이론·생태체계","f":"옳은 것 모두 고르기","s":["브론펜브레너(U. Bronfenbrenner)의 미시체계(microsystem)에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 인간이 가장 밀접하게 상호작용하는 사회환경을 말한다.","ㄴ. 전 생애에 걸쳐 일어나는 개인의 변화와 사회역사적 환경을 포함한다.","ㄷ. 개인이 직접 참여하지 않으나, 부모의 직장, 형제가 속한 학급 등이 포함된다."],"c":["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":1},{"id":"25-1-18","y":2025,"g":1,"n":18,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["영아기(0-2세)의 특징으로 옳은 것은?"],"c":["애착관계를 형성한다.","분류화 개념을 획득한다.","서열화를 획득한다.","오이디푸스 콤플렉스(Oedipus complex)를 경험한다.","상징적 사고가 활발한 시기이다."],"a":1},{"id":"25-1-19","y":2025,"g":1,"n":19,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["유아기(3-6세)의 발달특성에 관한 설명으로 옳지 않은 것은?"],"c":["성역할의 내면화가 이루어진다.","영아기(0-2세)보다 발달속도가 느려진다.","에릭슨(E. Erikson)의 주도성 대 죄책감 단계에 해당된다.","프로이트(S. Freud)의 남근기에 해당된다.","피아제(J. Piaget)의 자율적 도덕성 단계에 도달한다."],"a":5},{"id":"25-1-20","y":2025,"g":1,"n":20,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["아동기(7-12세)의 발달에 관한 설명으로 옳지 않은 것은?"],"c":["가역적 사고가 발달한다.","단체놀이를 통해 분업의 원리를 학습한다.","운동기술이나 근육의 협응능력이 정교해진다.","형식적 조작사고에서 구체적 조작사고로 전환된다.","에릭슨(E. Erikson)은 근면성의 발달을 중요한 과업으로보았다."],"a":4},{"id":"25-1-21","y":2025,"g":1,"n":21,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["청소년기(13-19세)의 발달에 관한 설명으로 옳은 것은?"],"c":["조합기술(combination skill)이 획득된다.","가설연역적 사고에서 경험귀납적 사고로 전환된다.","마샤(J. Marcia)는 자아정체감을 4가지 유형으로 구분했다.","2차 성징은 직접적인 생식기능과 관련된 성적 성숙이다.","상상적 청중(imaginary audience)과 개인적 우화(personal fable)를 통해 자아중심성에서 벗어날 수 있다."],"a":3},{"id":"25-1-22","y":2025,"g":1,"n":22,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["청년기(20-39세)의 발달에 관한 설명으로 옳은 것은?"],"c":["자아통합이 완성되는 시기로 삶 전체에 대한 평가를 시도한다.","전환적 추론이 가능해진다.","부모로부터의 독립에 대한 양가감정에서 해방된다.","피아제(J. Piaget)는 구체적 조작 사고가 발달한다고 보았다.","에릭슨(E. Erikson)은 친밀감 대 고립의 심리사회적 위기가 발생한다고 보았다."],"a":5},{"id":"25-1-23","y":2025,"g":1,"n":23,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["중년기(40-64세)에 관한 설명으로 옳은 것은?"],"c":["에릭슨(E. Erikson)의 정체성 대 침체 단계에 해당된다.","갱년기는 남성에게는 나타나지 않는다.","여성은 에스트로겐 분비가 증가하고, 남성은 테스토스테론 분비가 감소한다.","시각, 청각, 미각, 후각 등의 감각기능이 가장 좋은 시기이다.","결정성(crystallized)지능은 계속 발달한다."],"a":5},{"id":"25-1-24","y":2025,"g":1,"n":24,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["노년기(65세 이상)에 관한 설명으로 옳지 않은 것은?"],"c":["외향성이 증가한다.","노년기 사회적 역할과 관계망의 축소는 고독과 소외를초래할 수도 있다.","친근한 사물에 대한 애착이 증가한다.","생에 대한 회상경향이 증가한다.","에릭슨(E. Erikson)은 심리사회적 위기를 극복하면 지혜라는 능력을 얻게 된다고 보았다."],"a":1},{"id":"25-1-25","y":2025,"g":1,"n":25,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["생애주기별 특징에 관한 설명으로 옳은 것은?"],"c":["영아기(0-2세) - 성역할 인식 확립","아동기(7-12세) - 대상영속성 형성","청소년기(13-19세) - 자아정체감 확립","중년기(40-64세) - 자아통합 완성","노년기(65세 이상) - 친밀감 형성"],"a":3},{"id":"26-1-1","y":2026,"g":1,"n":1,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["인간발달에 관한 설명으로 옳은 것은?"],"c":["성숙(maturation)은 인간의 양적 변화인 표면적 변화만을의미한다.","발달은 분화와 통합의 과정을 반복하며 이루어진다.","성장(growth)은 유전적이며 내적인 요인에 의해 특정한시기에 일어나는 신체적ㆍ정신적 변화이다.","발달은 일정한 방향으로 진행되는데, 소근육이 대근육보다 먼저 발달한다.","인간의 발달과정은 영아기부터 노년기까지로, 비연속적이며 상승적이다."],"a":2},{"id":"26-1-2","y":2026,"g":1,"n":2,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["인간발달이론과 사회복지실천에 관한 설명으로 옳지 않은 것은?"],"c":["인간의 적응과 부적응을 판단하는 기준을 제공한다.","클라이언트 사정을 위한 유용한 지식이다.","클라이언트의 발달과업을 성취할 수 있도록 지원하는 근거가 된다.","개인의 성장 과정에서 나타나는 문제의 원인을 이해하는데 도움을 제공한다.","클라이언트를 둘러싼 사회환경보다 생물학적 요소의 중요성을 강조한다."],"a":5},{"id":"26-1-3","y":2026,"g":1,"n":3,"t":"체계이론·생태체계","f":"옳은 것 고르기","s":["이상행동과 사회복지실천에 관한 설명으로 옳은 것은?"],"c":["이상행동의 개념은 사회문화와 관계없이 병리학적 용어로규정된다.","이상행동은 클라이언트가 겪는 문제의 원인이 될 수 있다.","이상행동에 대한 이해는 정신건강사회복지사만의 고유 영역이다.","이상행동의 광의적 개념은 조현병, 인격장애 등 정신과적인 진단을 받은 정신장애를 의미한다.","진단분류체계로는 '정신질환 진단 및 통계편람(DSM)'이유일하다."],"a":2},{"id":"26-1-4","y":2026,"g":1,"n":4,"t":"프로이트·정신분석·방어기제","f":"사례·제시문 판단","s":["다음에서 설명하는 방어기제에 해당하는 것은?","○ 수용할 수 없는 사고나 충동, 고통스러운 경험, 인정할 수 없는 기억을 무의식 속으로 추방시켜 의식화되는 것을 막아주는 기제를 말한다.","○ 고통스러운 일을 잊어버리는 기억상실, 하기 싫고 귀찮은 과제를 깜빡 잊는 경우를 예로 들 수 있다."],"c":["부정","투사","억압","승화","반동형성"],"a":3},{"id":"26-1-5","y":2026,"g":1,"n":5,"t":"에릭슨 심리사회적 발달","f":"옳지 않은 것","s":["에릭슨(E. Erikson)의 심리사회적 발달단계에서 주요 발달과업과 위기의 연결로 옳지 않은 것은?"],"c":["신뢰감 대 불신감","근면성 대 열등감","주도성 대 죄책감","친밀감 대 역할혼미","자율성 대 수치심과 의심"],"a":4},{"id":"26-1-6","y":2026,"g":1,"n":6,"t":"융·아들러(분석심리·개인심리)","f":"옳지 않은 것","s":["융(C. Jung)의 분석심리이론에 관한 설명으로 옳지 않은 것","은?"],"c":["페르소나(persona)는 개인이 사회적 요구에 반응하기 위한 가면을 의미한다.","무의식은 개인무의식과 집단무의식으로 나뉜다.","남성의 내부에 있는 여성성을 아니무스(animus)라고 한다.","원형(archetype)은 집단무의식의 주요 구성요소이다.","인간은 자신의 일부로 받아들이기를 꺼리는 그림자(shadow)를 가지고 있다."],"a":3},{"id":"26-1-7","y":2026,"g":1,"n":7,"t":"행동주의·사회학습이론","f":"옳지 않은 것","s":["스키너(B. Skinner)의 이론에 관한 설명으로 옳지 않은 것은?"],"c":["강화에는 정적 강화와 부적 강화가 있다.","강화계획은 크게 연속강화계획과 간헐강화계획으로 구분된다.","고정간격강화계획은 일정한 수의 반응이 나타난 후에 강화시키는 절차이다.","일차적 강화물은 음식, 물, 따뜻함 등과 같은 무조건 자극으로서 학습이 필요하지 않은 것을 말한다.","벌은 혐오적인 사건을 표현하거나 긍정적인 강화물을 제거하는 것으로, 특정행동의 빈도를 감소시키는 결과를 초래한다."],"a":3},{"id":"26-1-8","y":2026,"g":1,"n":8,"t":"행동주의·사회학습이론","f":"사례·제시문 판단","s":["반두라(A. Bandura)의 관찰학습과정 중 다음에 해당하는 것은?","○ 모델을 모방하기 위하여 모델의 상징적 표상을 연습하는 과정이다.","○ 모델의 상징적 표상을 잘 기억하여 그 행동을 계속적으로 연습하는 것이 필요하다.","○ 기억된 정보를 구체적 행동으로 전환시키는 단계로서 실천을 통해 학습하는 과정이다."],"c":["운동재생과정","기억과정","조정과정","동기화과정","주의집중과정"],"a":1},{"id":"26-1-9","y":2026,"g":1,"n":9,"t":"융·아들러(분석심리·개인심리)","f":"옳지 않은 것","s":["학자의 이론과 주요 개념의 연결이 옳지 않은 것은?"],"c":["아들러(A. Adler)의 개인심리이론 - 열등감과 보상","피아제(J. Piaget)의 인지발달이론 - 동화와 조절","스키너(B. Skinner)의 행동주의이론 - 조작적 조건화와소거","프로이트(S. Freud)의 정신분석이론 - 무의식과 리비도","로저스(C. Rogers)의 인본주의이론 - 출생순위와 생활양식"],"a":5},{"id":"26-1-10","y":2026,"g":1,"n":10,"t":"피아제 인지발달","f":"옳은 것 모두 고르기","s":["벡(A. Beck)이 제시한 인지적 왜곡에 해당하는 것을 모두 고른 것은?","ㄱ. 개인화　　　　ㄴ. 이분법적 사고","ㄷ. 과잉일반화　　ㄹ. 임의적 추론"],"c":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"26-1-11","y":2026,"g":1,"n":11,"t":"피아제 인지발달","f":"옳은 것 모두 고르기","s":["피아제(J. Piaget)의 인지발달이론에서 전조작기의 발달 특성으로 옳은 것을 모두 고른 것은?","ㄱ. 상징적 사고로 병원놀이, 소꿉놀이 등의 가상놀이가 가능하다.","ㄴ. 모든 물체에 생명과 감정을 부여하는 물활론적 사고를 한다.","ㄷ. 수, 길이, 면적, 무게, 부피 등 여러 형태의 보존개념이 획득된다.","ㄹ. 추상적인 사고가 가능하며 완전한 추론이 가능하다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"a":1},{"id":"26-1-12","y":2026,"g":1,"n":12,"t":"체계이론·생태체계","f":"사례·제시문 판단","s":["다음에서 설명하는 일반체계이론의 개념으로 옳은 것은?","○ 체계가 내외적 균형상태를 성취하기 위한 자기조절 과정을 의미한다.","○ 지속적이고 안정적인 균형상태를 유지하기 위한 체계의 경향을 의미한다."],"c":["홀론(holon)","시너지(synergy)","엔트로피(entropy)","항상성(homeostasis)","투입(input)"],"a":4},{"id":"26-1-13","y":2026,"g":1,"n":13,"t":"체계이론·생태체계","f":"사례·제시문 판단","s":["다음에서 설명하는 생태체계이론의 주요개념으로 옳은 것은?","○ 문제를 극복하려는 노력을 의미하는 적응의 한 형태이다.","○ 스트레스 요인에 대응할 때 개인과 환경 간의 적합성을 회복시키거나 높여주는 행동방식을 의미한다.","○ 스트레스 상황에서 개인이 사용하는 반응과 전략으로, 개인의 기능을 유지하고 향상시킬 수 있다."],"c":["대처(coping)","균형(equilibrium)","호혜성(reciprocity)","다중종결성(multifinality)","안정상태(steady state)"],"a":1},{"id":"26-1-14","y":2026,"g":1,"n":14,"t":"체계이론·생태체계","f":"옳은 것 모두 고르기","s":["브론펜브레너(U. Bronfenbrenner)의 생태체계이론에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 인간을 둘러싼 사회환경을 미시체계, 중간체계, 내부체계, 외체계로 구분했다.","ㄴ. 외체계는 개인이 직접 참여하지는 않으나 개인에게 영향을 미치는 체계로 부모의 직장, 의료기관, 사회복지기관 등이 포함된다.","ㄷ. 중간체계는 상호작용하는 내부체계와 외체계간 관계로 구성된다.","ㄹ. 미시체계는 인간발달에 가장 직접적 영향을 미치는 환경으로, 가족이 대표적 예이다."],"c":["ㄴ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄷ, ㄹ"],"a":4},{"id":"26-1-15","y":2026,"g":1,"n":15,"t":"사회환경(가족·집단·조직·문화·지역사회)","f":"옳지 않은 것","s":["사회환경체계에 관한 설명으로 옳지 않은 것은?"],"c":["가족은 사회복지실천의 주요 대상이다.","조직은 목적지향적이며 분업적 특성이 있다.","집단은 집단의 구성 동기에 따라 자연집단과 형성집단으로 분류된다.","지역사회는 공동의 문제를 해결하고 삶의 질 향상을 위해 조직화가 가능한 대상이다.","집단은 구성원의 상호작용이 중요하므로 최소 단위는 3인 이상이다."],"a":5},{"id":"26-1-16","y":2026,"g":1,"n":16,"t":"사회환경(가족·집단·조직·문화·지역사회)","f":"사례·제시문 판단","s":["다음에서 설명하는 사회환경체계로 옳은 것은?","○ 사회나 국가, 민족의 역사적 전통, 가치, 이념 등이 반영된 정치, 경제, 교육 등 광범위한 사회·문화적 요소들을 의미한다.","○ 개인의 삶에 직접적으로 개입하지는 않지만, 제도나 법, 정책 등 사회구조적 맥락에서 영향을 미친다."],"c":["미시체계","거시체계","외체계","시간체계","내부체계"],"a":2},{"id":"26-1-17","y":2026,"g":1,"n":17,"t":"사회환경(가족·집단·조직·문화·지역사회)","f":"옳지 않은 것","s":["문화와 사회복지실천에 관한 설명으로 옳지 않은 것은?"],"c":["문화는 인간의 삶과 의식 속에 내재되어 개인의 행동에영향을 미친다.","사회복지사는 자신에게 내재되어 있는 문화에 대한 정확한 이해를 바탕으로 다른 문화에 대해서는 배타적인 태도를 취해야 한다.","다양한 문화적 배경의 클라이언트를 대상으로 사회복지실천을 하기 위해서는 문화적 역량이 요구된다.","문화는 후천적 학습에 의해 획득되는 특성이 있다.","문화변용, 문화마찰 등의 용어는 문화의 역동적 특성을나타낸다."],"a":2},{"id":"26-1-18","y":2026,"g":1,"n":18,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["태아(수정-출산)의 성장발달에 부정적인 영향을 미치는 요인에 관한 설명으로 옳지 않은 것은?"],"c":["임신부의 심리적 불안이나 우울은 태아의 발달에 영향을미치지 않는다.","임신부의 흡연은 태아의 미숙아 출생률을 증가시킨다.","임신부의 알코올 섭취는 해독 기능이 없는 태아에게 축적되어 안면기형 등의 부작용을 초래할 수 있다.","임신부가 방사선에 노출될 경우 태아가 사망하거나 출생시 조산, 저체중, 뇌손상 등이 발생할 수 있다.","임신부가 코카인, 헤로인의 약물 등에 의존하게 되면 태아가 약물에 중독된 채로 태어날 수 있다."],"a":1},{"id":"26-1-19","y":2026,"g":1,"n":19,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["신생아의 발바닥을 살살 긁어 간지럽히면 발가락을 부채모양으로 펴는 반사운동은?"],"c":["모로반사(moro reflex)","흡인반사(sucking reflex)","탐색반사(rooting reflex)","파악반사(grasping reflex)","바빈스키반사(babinski reflex)"],"a":5},{"id":"26-1-20","y":2026,"g":1,"n":20,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["영아기(0-2세)의 발달 특성으로 옳은 것은?"],"c":["영아의 골격은 성인보다 크기는 작지만, 숫자는 같으며단단하다.","영아기에는 대상영속성(object permanence)이 형성된다.","영아기의 성장발육은 머리에서 다리로, 팔다리와 같은하위부위에서 몸통부위로 진행한다.","가장 발달이 빠른 시기로, 뇌는 생후 6개월에는 성인의50%, 두 살이 되면 80%까지 발달한다.","프로이트(S. Freud)는 이 시기를 자신의 성기에 관심을가지는 남근기라고 하였다."],"a":2},{"id":"26-1-21","y":2026,"g":1,"n":21,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["유아기(3-6세)의 발달에 대한 설명으로 옳지 않은 것은?"],"c":["상상과 현실을 구분하지 못하는 사고 특징을 가진다.","모든 사람을 자신의 관점에서만 본다.","아무 관계가 없는 사건들을 연결지어 생각한다.","에릭슨(E. Erikson)에 의하면 기본적 신뢰감이 형성되는발달단계이다.","언어를 사회적 상호작용의 도구로 활발하게 사용하기 시작한다."],"a":4},{"id":"26-1-22","y":2026,"g":1,"n":22,"t":"에릭슨 심리사회적 발달","f":"사례·제시문 판단","s":["다음에서 설명하는 마샤(J. Marcia)의 청소년기 자아정체감 발달유형은?","정체성 위기상태에 처해 정체감을 확립하기 위하여 다양한 역할실험을 수행하고 있으나, 아직 구체적인 의사결정은 하지 못한 상태"],"c":["정체감 유예(identity moratorium)","정체감 혼란(identity diffusion)","정체감 유실(identity foreclosure)","정체감 완성(identity completion)","정체감 성취(identity achievement)"],"a":1},{"id":"26-1-23","y":2026,"g":1,"n":23,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 모두 고르기","s":["하비거스트(R. Havighurst)의 청년기 발달과업에 해당하는 것을 모두 고른 것은?","ㄱ. 가정을 꾸린다.","ㄴ. 직업생활을 시작한다.","ㄷ. 마음에 맞는 사람과 사회적 집단을 형성한다.","ㄹ. 자신의 삶의 의미를 되돌아보고 의미있는 활동을 찾는다."],"c":["ㄱ","ㄱ, ㄴ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"26-1-24","y":2026,"g":1,"n":24,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["노년기(65세 이상)의 발달특성에 관한 설명으로 옳지 않은 것은?"],"c":["오래 사용하여 친근한 물건에 대한 애착심이 증가할 수있다.","결정성(crystallized) 지능은 감퇴하나 유동성(fluid) 지능은 지속적으로 향상될 수 있다.","배우자 사망 등을 겪게 되면서 심리적 우울감을 경험할수 있다.","피부는 수분과 피하지방이 감소되어 얇아지고 건조해지며 탄력성도 떨어질 수 있다.","은퇴로 개인의 소득이 줄어들고, 상실을 경험하며 자아정체감이 저하되기도 한다."],"a":2},{"id":"26-1-25","y":2026,"g":1,"n":25,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["생애주기에서 노년기 발달과제를 제시한 학자와 과업이 옳게 연결된 것은?"],"c":["버틀러(R. Butler) - 인생의 주기를 6단계로 나누고, 노년기에는 건강, 은퇴, 상실, 관계 등의 적응에 직면한다.","펙(R. Peck) - 인생의 겨울에 해당하는 시기로 성인후기전환기와 성인후기 두 단계로 나누었으며 신체변화와 성격과의 관계를 강조했다.","에릭슨(E. Erikson) - 죽음을 앞두고 자신의 삶을 통찰하고 점검하는 시기로, 노년기의 중요과업과 위기는 자아통합 대 절망이다.","레빈슨(D. Levinson) - 노인들이 죽음이 가까워짐에 따라 과거에 대해 추억하고, 죽음에 대한 조망에 초점을 두고 생을 회고한다.","하비거스트(R. Havighurst) - 건강한 노인의 성격발달을위해 자아분화 대 역할몰입, 신체초월 대 신체몰입, 자아초월 대 자아몰입의 과업과 위기를 제시하였다."],"a":3}],"data/q_lw.json":[{"id":"17-3-51","y":2017,"g":3,"n":51,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳지 않은 것","s":["우리나라 사회복지법에 관한 설명으로 옳지 않은 것은?"],"c":["헌법상의 생존권을 구체적으로 실현하기 위한 법이 사회복지법이다.","사회복지법은 단일 법전 형식이 아니라 개별법 체계로구성되어 있다.","최저임금법은 실질적 의미의 사회복지법에 포함된다.","사회복지법은 사회법으로서 과실책임의 원칙에 기초하고있다.","사회복지법에는 공법과 사법의 요소들이 공존하고 있다."],"a":4},{"id":"17-3-52","y":2017,"g":3,"n":52,"t":"사회복지사업법","f":"옳지 않은 것","s":["사회복지사업법상 사회복지사 의무채용 제외시설이 아닌 곳은?"],"c":["영유아보육법에 따른 어린이집","노인복지법에 따른 노인복지관","장애인복지법에 따른 점자도서관","정신보건법에 따른 정신질환자지역사회재활시설","성매매방지 및 피해자보호 등에 관한 법률에 따른 성매매피해상담소"],"a":2},{"id":"17-3-53","y":2017,"g":3,"n":53,"t":"의료급여법·긴급복지지원법·기초연금법","f":"옳지 않은 것","s":["기초연금법에 관한 설명으로 옳지 않은 것은?"],"c":["기초연금은 65세 이상인 사람으로서 소득인정액이 선정기준액 이하인 사람에게 지급한다.","기초연금 수급희망자는 특별자치시장ㆍ특별자치도지사ㆍ시장ㆍ군수ㆍ구청장에게 기초연금의 지급을 신청할 수 있다.","부부가 모두 기초연금 수급권자인 경우 각각의 기초연금액에서 기초연금액의 100분의 30에 해당하는 금액을 감액한다.","수급권자가 국외로 이주한 경우 수급권을 상실한다.","시장은 수급자가 법령에 따라 사망한 것으로 추정되는경우 그 사유가 발생한 날이 속하는 달의 다음 달부터 그 사유가 소멸한 날이 속하는 달까지는 기초연금의 지급을 정지한다."],"a":3},{"id":"17-3-54","y":2017,"g":3,"n":54,"t":"국민기초생활보장법","f":"옳은 것 고르기","s":["국민기초생활 보장법에 따른 의료급여 수급자로서 의료급여법상 1종수급권자가 아닌 사람은?"],"c":["18세인 자","65세인 자","장애인고용촉진 및 직업재활법에 따른 중증장애인","임신 중에 있는 자","병역법에 따른 병역의무를 이행중인 자"],"a":1},{"id":"17-3-55","y":2017,"g":3,"n":55,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳지 않은 것","s":["2000년대 제정된 사회복지법이 아닌 것은?"],"c":["영유아보육법","긴급복지지원법","노인장기요양보험법","장애인연금법","다문화가족지원법"],"a":1},{"id":"17-3-56","y":2017,"g":3,"n":56,"t":"사회복지사업법","f":"옳지 않은 것","s":["사회복지사업법상 사회복지서비스 실시에 관한 설명으로 옳지 않은 것은?"],"c":["복지담당공무원은 보호대상자의 동의를 받아 서비스 제공을 직권으로 신청할 수 있다.","복지담당공무원은 보호대상자 및 그 부양의무자의 소득ㆍ재산ㆍ근로능력 및 취업 상태를 조사할 수 있다.","시장ㆍ군수ㆍ구청장은 서비스 제공의 실시 여부와 그 유형을 결정하였을 때에는 이를 서면이나 전자문서로 신청인에게 알려야 한다.","서비스는 현물 또는 사회복지서비스 이용권으로 제공된다.","보건복지부장관은 보호대상자와 그 부양의무자의 정보를5년 초과하여 보유할 수 없다."],"a":5},{"id":"17-3-57","y":2017,"g":3,"n":57,"t":"국민기초생활보장법","f":"옳지 않은 것","s":["국민기초생활 보장법상 소득의 범위에 해당하지 않는 것은?"],"c":["퇴직금","임대소득","사업소득","국민연금법에 따른 연금","친족으로부터 정기적으로 받는 금품 중 보건복지부장관이 정하는 금액 이상의 금품"],"a":1},{"id":"17-3-58","y":2017,"g":3,"n":58,"t":"사회복지사업법","f":"옳은 것 모두 고르기","s":["사회복지사업법상 사회복지법인의 정관에 포함되어야 할 사항을 모두 고른 것은?","ㄱ. 회의에 관한 사항","ㄴ. 자산 및 회계에 관한 사항","ㄷ. 임원의 임면 등에 관한 사항","ㄹ. 공고 및 공고방법에 관한 사항"],"c":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"17-3-59","y":2017,"g":3,"n":59,"t":"사회복지사업법","f":"옳지 않은 것","s":["사회복지사업법상 사회복지위원회 등에 관한 설명으로 옳지 않은 것은?"],"c":["사회복지위원회는 특별시ㆍ광역시ㆍ도ㆍ특별자치도에 둔다.","사회복지업무 또는 보건의료를 담당하는 공무원은 지역사회복지협의체(지역사회보장협의체) 위원이 될 수 없다.","지역사회복지협의체(지역사회보장협의체)는 지역사회보장계획을 심의하거나 건의한다.","사회복지위원회 위원의 임기는 2년이다.","읍ㆍ면ㆍ동 복지위원은 명예직으로 수당이 지급될 수 있다."],"a":2},{"id":"17-3-60","y":2017,"g":3,"n":60,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 모두 고르기","s":["사회복지와 관련한 헌법의 내용으로 옳은 것을 모두 고른 것은?","ㄱ. 헌법 전문에는 사회복지와 관련된 내용이 없다.","ㄴ. 환경권의 내용과 행사에 관하여는 조례로 정한다.","ㄷ. 모든 국민은 능력에 따라 균등하게 교육을 받을 권리를 가진다.","ㄹ. 여자의 근로는 특별한 보호를 받으며, 고용·임금 및 근로조건에 있어서 부당한 차별을 받지 아니한다."],"c":["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":3},{"id":"17-3-61","y":2017,"g":3,"n":61,"t":"노인복지법·장애인복지법·장애인연금법","f":"옳은 것 고르기","s":["장애인복지법상 장애인등록에 관한 설명으로 옳은 것은?"],"c":["장애인등록을 할 수 있는 자는 장애인 본인에 한한다.","국가는 외국인이 장애인으로 등록된 경우 예산 등을 고려하여 장애인복지사업의 지원을 제한할 수 있다.","장애인 등록증을 받은 자가 사망하면 그 등록에 따른 권한은 상속권자에게 상속된다.","구청장은 장애인의 등급사정을 위하여 구청장 직속의 정밀심사기관을 두어야 한다.","장애인의 등급사정을 위해 고용노동부에 등급판정위원회를 둘 수 있다."],"a":2},{"id":"17-3-62","y":2017,"g":3,"n":62,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 고르기","s":["사회복지법의 법원(法源)에 관한 설명으로 옳은 것은?"],"c":["대통령의 긴급명령은 법원이 될 수 없다.","국무총리는 사회복지에 관하여 총리령을 직권으로 제정할 수 없다.","법률의 위임에 의한 조례는 법률과 동등한 자격을 가진다.","법령의 범위를 벗어난 조례는 법적 구속력이 없다.","관습법은 사회복지법의 법원이 될 수 없다."],"a":4},{"id":"17-3-63","y":2017,"g":3,"n":63,"t":"노인복지법·장애인복지법·장애인연금법","f":"옳지 않은 것","s":["노인복지법상 노인학대에 관한 설명으로 옳지 않은 것은?"],"c":["지방자치단체는 노인학대를 예방하기 위하여 긴급전화를설치하여야 한다.","누구든지 노인학대를 알게 된 때에는 수사기관에 신고할수 있다.","누구든지 정당한 사유 없이 노인학대 현장에 출동한 자에 대하여 현장조사를 거부하여서는 아니 된다.","부양의무자인 자녀는 노인을 위하여 지급된 금품을 그목적외의 용도에 사용할 수 있다.","노인학대신고를 접수한 노인보호전문기관의 직원은 지체없이 노인학대의 현장에 출동하여야 한다."],"a":4},{"id":"17-3-64","y":2017,"g":3,"n":64,"t":"가족·여성 관련법(한부모·다문화·가정폭력·성폭력 등)","f":"옳지 않은 것","s":["가정폭력방지 및 피해자보호 등에 관한 법률상 가정폭력피해자 보호시설의 종류에 해당하지 않는 것은?"],"c":["단기보호시설","장기보호시설","외국인보호시설","장애인보호시설","노인보호시설"],"a":5},{"id":"17-3-65","y":2017,"g":3,"n":65,"t":"가족·여성 관련법(한부모·다문화·가정폭력·성폭력 등)","f":"사례·제시문 판단","s":["한부모가족지원법상 지원대상자인 아동으로 옳은 것은 모두 몇 개인가?","ㄱ. 부모의 생사가 분명하지 아니한 아동","ㄴ. 부모가 유기하여 부양을 받을 수 없는 아동","ㄷ. 부모가 신체의 질병으로 장기간 노동능력을 상실한 아동","ㄹ. 부모가 가정의 불화로 가출하여 부모의 부양을 받을 수 없는 아동","ㅁ. 부모의 장기복역으로 부양을 받을 수 없는 아동"],"c":["1개","2개","3개","4개","5개"],"a":5},{"id":"17-3-66","y":2017,"g":3,"n":66,"t":"가족·여성 관련법(한부모·다문화·가정폭력·성폭력 등)","f":"빈칸 채우기","s":["다문화가족지원법상 실태조사 등에 관한 내용이다. ( )에 들어갈 용어를 바르게 짝지은 것은?","( ㄱ )장관은 다문화가족의 현황 및 실태를 파악하고 다문화가족 지원을 위한 정책수립에 활용하기 위하여 ( ㄴ )년마다 다문화가족에 대한 실태조사를 실시하고 그 결과를 공표하여야 한다."],"c":["ㄱ: 고용노동부, ㄴ: 3","ㄱ: 고용노동부, ㄴ: 5","ㄱ: 여성가족부, ㄴ: 3","ㄱ: 여성가족부, ㄴ: 5","ㄱ: 보건복지부, ㄴ: 3"],"a":3},{"id":"17-3-67","y":2017,"g":3,"n":67,"t":"가족·여성 관련법(한부모·다문화·가정폭력·성폭력 등)","f":"옳지 않은 것","s":["성폭력방지 및 피해자보호 등에 관한 법률상 피해자보호에 관한 설명으로 옳지 않은 것은?"],"c":["일반보호시설에의 입소기간은 1년 이내이나 예외적으로연장할 수 있다.","누구든지 피해자를 고용하고 있는 자는 성폭력과 관련하여 피해자를 해고하여서는 아니 된다.","지방자치단체는 성폭력 전담의료기관의 의료 지원에 필요한 경비의 전부를 지원할 수 없다.","국가는 피해자에 대하여 법률상담과 소송대리 등의 지원을 할 수 있다.","미성년자가 피해자인 경우 성폭력행위자가 아닌 보호자가 입소에 동의하는 때에는 그 미성년자는 보호시설에 입소할 수 있다."],"a":3},{"id":"17-3-68","y":2017,"g":3,"n":68,"t":"사회보장기본법·사회보장급여법","f":"옳지 않은 것","s":["사회보장기본법상 사회보장제도의 운영원칙에 관한 설명으로 옳지 않은 것은?"],"c":["국가와 지방자치단체가 사회보장제도를 운영할 때에는이 제도를 필요로 하는 모든 국민에게 적용하여야 한다.","사회보험은 국가와 지방자치단체의 책임으로 시행하는것을 원칙으로 한다.","국가와 지방자치단체는 사회보장제도의 정책 결정 및 시행 과정에 공익의 대표자 및 이해관계인 등을 참여시켜 이를 민주적으로 결정하고 시행하여야 한다.","국가와 지방자치단체가 사회보장제도를 운영할 때에는국민의 다양한 복지 욕구를 효율적으로 충족시키기 위하여 연계성과 전문성을 높여야 한다.","국가와 지방자치단체는 사회보장제도의 급여 수준과 비용 부담 등에서 형평성을 유지하여야 한다."],"a":2},{"id":"17-3-69","y":2017,"g":3,"n":69,"t":"고용보험법·산업재해보상보험법","f":"옳지 않은 것","s":["산업재해보상보험법상 용어에 관한 설명으로 옳지 않은 것은?"],"c":["업무상의 사유에 따른 근로자의 부상ㆍ질병ㆍ장해 또는사망은 업무상의 재해이다.","근로자란 근로기준법에 따른 근로자를 말한다.","사실혼 관계에 있는 배우자는 유족에 포함되지 않는다.","치유란 부상 또는 질병이 완치되거나 치료의 효과를 더이상 기대할 수 없고 그 증상이 고정된 상태에 이르게 된 것을 말한다.","진폐는 분진을 흡입하여 폐에 생기는 섬유증식성 변화를주된 증상으로 하는 질병이다."],"a":3},{"id":"17-3-70","y":2017,"g":3,"n":70,"t":"국민건강보험법·노인장기요양보험법","f":"사례·제시문 판단","s":["노인장기요양보험법상 다음은 어떤 장기요양급여에 관한 설명인가?","수급자를 하루 중 일정한 시간 동안 장기요양기관에 보호하며 신체활동 지원 및 심신기능의 유지·향상을 위한 교육·훈련 등을 제공하는 장기요양급여"],"c":["방문요양","방문간호","주ㆍ야간보호","단기보호","기타재가급여"],"a":3},{"id":"17-3-71","y":2017,"g":3,"n":71,"t":"사회보장기본법·사회보장급여법","f":"옳지 않은 것","s":["사회보장기본법상 ‘사회보장에 관한 국민의 권리’에 대한 설명으로 옳지 않은 것은?"],"c":["국가와 지방자치단체는 최저보장수준과 최저임금 등을고려하여 사회보장급여의 수준을 결정하여야 한다.","관계 법령에서 따로 정하는 경우에는 국가나 지방자치단체가 사회보장급여의 신청을 대신할 수 있다.","사회보장수급권은 관계 법령에서 따로 정하고 있는 경우에는 제한될 수 있다.","사회보장수급권은 압류할 수 있다.","모든 국민은 사회보장 관계 법령에서 정하는 바에 따라사회보장수급권을 가진다."],"a":4},{"id":"17-3-72","y":2017,"g":3,"n":72,"t":"사회보장기본법·사회보장급여법","f":"옳은 것 모두 고르기","s":["사회보장기본법상 비용부담에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 사회보장 비용의 부담은 각각의 사회보장제도의 목적에 따라 국가, 지방자치단체 및 민간부문 간에 합리적으로 조정되어야 한다.","ㄴ. 국가만이 공공부조에 드는 비용의 전부 또는 일부를 부담한다.","ㄷ. 관계 법령에서 정하는 일정 소득 수준 이하의 국민에 대한 사회서비스에 대해서는 국가와 지방자치단체가 비용의 전부 또는 일부를 부담한다.","ㄹ. 부담 능력이 있는 국민에 대한 사회서비스에 대해서는 관계 법령에서 정하는 바에 따라 지방자치단체가 그 비용의 일부를 부담할 수 있다."],"c":["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ"],"a":5},{"id":"17-3-73","y":2017,"g":3,"n":73,"t":"국민연금법","f":"옳지 않은 것","s":["국민연금에 관한 헌법재판소의 결정 내용으로 옳지 않은 것은?"],"c":["국민연금제도는 다음세대에서 현재세대로 국민간에 소득재분배의 기능을 한다.","국민연금보험료는 조세로 볼 수 없다.","국민연금의 소득재분배 기능은 고소득자의 재산권을 침해하는 것이 아니다.","국민연금제도는 헌법상의 시장경제질서에 위배되지 않는다.","공적연금수급권은 재산권 보호의 대상이 된다."],"a":1},{"id":"17-3-74","y":2017,"g":3,"n":74,"t":"국민연금법","f":"옳지 않은 것","s":["국민연금법상 유족연금에 관한 설명으로 옳지 않은 것은?"],"c":["노령연금 수급권자가 사망하면 그 유족에게 유족연금이지급된다.","가입기간이 10년 이상인 가입자가 사망하면 그 유족에게유족연금이 지급된다.","유족연금 수급권자인 배우자가 재혼한 때에는 그 수급권은 소멸한다.","자녀인 유족연금 수급권자가 다른 사람에게 입양된 때에는 그 수급권은 소멸하지 않는다.","장애등급이 3급인 장애연금 수급권자가 사망하면 그 유족에게 유족연금이 지급되지 아니한다."],"a":4},{"id":"17-3-75","y":2017,"g":3,"n":75,"t":"사회보장기본법·사회보장급여법","f":"빈칸 채우기","s":["사회보장기본법상 사회보장 기본계획에 대한 내용이다. ( )에 들어갈 숫자로 옳은 것은?","보건복지부장관은 관계 중앙행정기관의 장과 협의하며 사회보장 증진을 위하여 사회보장에 관한 기본계획을 (　　　)년 마다 수립하여야 한다."],"c":["1","2","3","4","5"],"a":5},{"id":"18-3-51","y":2018,"g":3,"n":51,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 고르기","s":["법률의 제정에 관한 헌법의 내용으로 옳은 것은?"],"c":["법률은 국무회의의 의결을 거쳐 대통령이 제정한다.","대통령은 법률안의 일부에 대하여 재의를 요구할 수 있다.","국무회의에서 의결된 법률안은 지체없이 대통령이 공포한다.","법률은 특별한 규정이 없는 한 공포한 날로부터 20일을경과함으로써 효력을 발생한다.","대통령이 15일 이내에 재의 요구를 하지 아니한 때에는그 법률안은 폐기된다."],"a":4},{"id":"18-3-52","y":2018,"g":3,"n":52,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 고르기","s":["사회복지법의 체계와 법원(法源)에 관한 설명으로 옳은 것은?"],"c":["시행령은 업무소관 부처의 장관이 발한다.","국무총리는 소관사무에 관하여 법률의 위임 또는 직원으로 부령을 발할 수 있다.","지방자치단체는 법령의 범위 안에서 자치에 관한 규정을제정할 수 있다.","장애인복지법 시행규칙은 지방의회에서 제정한다.","국민연금법 시행령보다 국민연금법 시행규칙이 상위의법규범이다."],"a":3},{"id":"18-3-53","y":2018,"g":3,"n":53,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 고르기","s":["다음 중 가장 최근에 제정된 법률은?"],"c":["장애인복지법","사회복지사업법","고용보험법","노인장기요양보험법","산업재해보상보험법"],"a":4},{"id":"18-3-54","y":2018,"g":3,"n":54,"t":"사회보장기본법·사회보장급여법","f":"옳은 것 고르기","s":["사회보장기본법상 사회보장위원회에 관한 설명으로 옳은 것은?"],"c":["사회보장위원회는 대통령 소속으로 둔다.","부위원장은 기획재정부장관, 법무부장관 및 보건복지부장관이 된다.","보궐위원의 임기는 2년으로 한다.","공무원인 위원의 임기는 1년으로 한다.","사회보장위원회는 위원장 1명, 부위원장 3명과 행정안전부장관, 고용노동부장관, 여성가족부장관, 국토교통부장관을 포함한 30명 이내의 위원으로 구성한다."],"a":5},{"id":"18-3-55","y":2018,"g":3,"n":55,"t":"사회보장기본법·사회보장급여법","f":"옳은 것 고르기","s":["사회보장기본법의 내용으로 옳은 것은?"],"c":["지방자치단체의 장은 사회보장제도를 신설할 경우 신설의 타당성 등에 대하여 보건복지부장관과 협의하여야 하고, 협의가 이루어지지 아니할 경우 대통령이 이를 조정한다.","보건복지부장관은 사회보장급여 관련 업무에 공통적으로적용되는 기준을 마련할 수 있다.","사회보장수급권은 관계 법령에서 정하는 바에 따라 다른사람에게 양도할 수 없으나 담보로 제공할 수 있다.","사회보장수급권은 포기할 수 있으나, 포기는 취소할 수없다.","사회보장수급권은 어떤 경우에도 제한되거나 정지될 수없다."],"a":2},{"id":"18-3-56","y":2018,"g":3,"n":56,"t":"사회보장기본법·사회보장급여법","f":"옳지 않은 것","s":["사회보장기본법의 내용으로 옳지 않은 것은?"],"c":["국내외에 거주하는 외국인에게 평등주의의 원칙에 따라사회보장제도를 적용하여야 한다.","국가와 지방자치단체는 공공부문과 민간부문의 소득보장제도가 효과적으로 연계되도록 하여야 한다.","국가와 지방자치단체는 사회보장제도를 시행할 때에 가정과 지역공동체의 자발적인 복지활동을 촉진하여야 한다.","사회보장에 관한 다른 법률을 제정하거나 개정하는 경우에는 사회보장기본법에 부합되도록 하여야 한다.","모든 국민은 자신의 능력을 최대한 발휘하여 자립ㆍ자활할 수 있도록 노력하여야 한다."],"a":1},{"id":"18-3-57","y":2018,"g":3,"n":57,"t":"사회보장기본법·사회보장급여법","f":"사례·제시문 판단","s":["다음은 사회보장기본법상 어떤 용어에 관한 정의인가?","국가·지방자치단체 및 민간부문의 도움이 필요한 모든 국민에게 복지, 보건의료, 교육, 고용, 주거, 문화, 환경 등의 분야에서 인간다운 생활을 보장하고 상담, 재활, 돌봄, 정보의 제공, 관련 시설의 이용, 역량 개발, 사회참여 지원 등을 통하여 국민의 삶의 질이 향상되도록 지원하는 제도를 말한다."],"c":["사회서비스","공공부조제도","사회보험제도","평생사회안전망","맞춤형 사회보장제도"],"a":1},{"id":"18-3-58","y":2018,"g":3,"n":58,"t":"국민건강보험법·노인장기요양보험법","f":"옳지 않은 것","s":["노인장기요양보험법의 내용으로 옳지 않은 것은?"],"c":["장기요양사업이란 장기요양보험료, 국가 및 지방자치단체의 부담금 등을 재원으로 하여 노인 등에게 장기요양급여를 제공하는 사업을 말한다.","장기요양보험사업의 피보험자는 국민건강보험법에 따른국민건강보험공단으로 한다.","국가는 노인성질환예방사업을 수행하는 지방자치단체에대하여 이에 소요되는 비용을 지원할 수 있다.","장기요양급여는 노인등이 가족과 함께 생활하면서 가정에서 장기요양을 받는 재가급여를 우선적으로 제공하여야 한다.","보건복지부장관은 장기요양사업의 실태를 파악하기 위하여 3년마다 장기요양인정에 관한 사항등에 관한 조사를 정기적으로 실시하고 그 결과를 공표하여야 한다."],"a":2},{"id":"18-3-59","y":2018,"g":3,"n":59,"t":"고용보험법·산업재해보상보험법","f":"옳은 것 고르기","s":["산업재해보상보험법상 업무상 재해를 입은 근로자 등의 진료ㆍ요양 및 재활 사업을 수행하는 기관은?"],"c":["국민연금공단","국민건강보험공단","근로복지공단","한국장애인고용공단","한국산업인력공단"],"a":3},{"id":"18-3-60","y":2018,"g":3,"n":60,"t":"사회복지사업법","f":"옳은 것 고르기","s":["사회복지사업법상 사회복지의 날은?"],"c":["4월 20일","6월 5일","7월 11일","9월 7일","10월 2일"],"a":4},{"id":"18-3-61","y":2018,"g":3,"n":61,"t":"사회복지사업법","f":"옳지 않은 것","s":["사회복지사업법상 사회복지법인에 관한 설명으로 옳지 않은 것은?"],"c":["사회복지법인의 이사 중에 결원이 생겼을 때에는 3개월이내에 보충하여야 한다.","사회복지법인의 이사는 해당 법인이 설치한 사회복지시설의 장을 제외한 그 시설의 직원을 겸할 수 없다.","시ㆍ도지사는 임시이사가 선임되었음에도 불구하고 해당사회복지법인이 정당한 사유 없이 이사회 소집을 기피할 경우 이사회 소집을 권고할 수 있다.","해산한 사회복지법인의 남은 재산은 정관으로 정하는 바에 따라 국가 또는 지방자치단체에 귀속된다.","사회복지법인은 설립하려는 자는 시ㆍ도지사의 허가를받아야 한다."],"a":1},{"id":"18-3-62","y":2018,"g":3,"n":62,"t":"사회복지사업법","f":"옳은 것 고르기","s":["사회복지사업법상 사회복지시설에 관한 설명으로 옳은 것은?"],"c":["국가는 사회복지시설을 운영할 수 없다.","사회복지시설의 장은 상근(常勤)하여야 한다.","사회복지시설의 운영자는 지진에 의한 물적 피해의 책임을 이행하기 위하여 책임보험에 가입 하여야 한다.","보건복지부장관은 사회복지시설에 대하여 정기 및 수시안전점검을 실시하여야 한다.","지방자치단체가 설치한 사회복지시설은 비영리법인에 위탁하여 운영하여야 한다."],"a":2},{"id":"18-3-63","y":2018,"g":3,"n":63,"t":"의료급여법·긴급복지지원법·기초연금법","f":"빈칸 채우기","s":["의료급여법의 내용이다. ( )에 들어갈 숫자를 옳게 짝지은 것은?","- 의료급여기관은 의료급여가 끝난 날부터 ( ㄱ )년간 보건복지부령으로 정하는 바에 따라 급여비용의 청구에 관한 서류를 보존하여야 한다.","- 약국 등 보건복지부령으로 정하는 의료급여기관은 처방전을 급여비용을 청구한 날부터 ( ㄴ )년간 보존하여야 한다."],"c":["ㄱ : 2, ㄴ : 3","ㄱ : 3, ㄴ : 3","ㄱ : 3, ㄴ : 5","ㄱ : 5, ㄴ : 3","ㄱ : 5, ㄴ : 5"],"a":4},{"id":"18-3-64","y":2018,"g":3,"n":64,"t":"국민기초생활보장법","f":"옳은 것 고르기","s":["국민기초생활 보장법의 내용으로 옳은 것은?"],"c":["국외에 체류하는 외국인도 수급권자가 된다.","기준 중위소득은 지방자치단체별로 중앙생활보장위원회가 고시한다.","주거급여는 여성가족부소관으로 한다.","보장기관은 차상위자가 자활에 필요한 자산을 형성할 수있도록 재정적인 지원을 할 수는 없다.","소관 중앙행정기관의 장은 수급자의 최저생활을 보장하기 위하여 3년마다 소관별로 기초생활보장 기본계획을 수립하여 보건복지부장관에게 제출하여야 한다."],"a":5},{"id":"18-3-65","y":2018,"g":3,"n":65,"t":"의료급여법·긴급복지지원법·기초연금법","f":"옳지 않은 것","s":["기초연금법의 내용으로 옳지 않은 것은?"],"c":["보건복지부장관은 선정기준액을 정하는 경우 65세 이상인 사람 중 기초연금 수급자가 100분의 70 수준이 되도록 한다.","기초연금으로 지급받은 금품은 압류할 수 없다.","기초연금의 지급이 정지된 기간에는 기초연금을 지급하지 아니한다.","기초연금 수급권자가 국외로 이주한 때에 기초연금 수급권을 상실한다.","기초연금 수급권자의 권리는 3년간 행사하지 아니하면시효의 완성으로 소멸한다."],"a":5},{"id":"18-3-66","y":2018,"g":3,"n":66,"t":"가족·여성 관련법(한부모·다문화·가정폭력·성폭력 등)","f":"옳지 않은 것","s":["가정폭력방지 및 피해자보호 등에 관한 법률상 긴급전화센터의 업무에 해당하지 않는 것은?"],"c":["가정폭력상담","관련 기관ㆍ시설과의 연계","가정폭력관련 법률자문 및 가해자조사","경찰관서 등으로부터 인도받은 피해자의 임시 보호","피해자에 대한 긴급한 구조의 지원"],"a":3},{"id":"18-3-67","y":2018,"g":3,"n":67,"t":"사회복지사업법","f":"빈칸 채우기","s":["사회복지사업법상 사회복지법인의 임원에 관한 내용이다. ( )에 들어갈 숫자를 옳게 짝지은 것은?","- 법인은 대표이사를 포함한 이사 ( ㄱ )명 이상과 감사 2명 이상을 두어야 한다.","- 이사의 임기는 3년으로 하고 감사의 임기는 ( ㄴ )년으로 하며, 각각 연임할 수 있다.","- 외국인인 이사는 이사 현원의 ( ㄷ )분의 1 미만이어야 한다."],"c":["ㄱ : 5, ㄴ : 3, ㄷ : 2","ㄱ : 5, ㄴ : 3, ㄷ : 5","ㄱ : 7, ㄴ : 2, ㄷ : 2","ㄱ : 7, ㄴ : 2, ㄷ : 3","ㄱ : 7, ㄴ : 2, ㄷ : 5"],"a":3},{"id":"18-3-68","y":2018,"g":3,"n":68,"t":"모금회법·자원봉사활동기본법·사회적경제관련법","f":"옳지 않은 것","s":["자원봉사활동 기본법상 자원봉사활동의 원칙에 해당하지 않는 것은?"],"c":["무보수성","비집단성","비영리성","비정파성(非政派性)","비종파성(非宗派性)"],"a":2},{"id":"18-3-69","y":2018,"g":3,"n":69,"t":"국민건강보험법·노인장기요양보험법","f":"옳은 것 모두 고르기","s":["다음 중 국민건강보험법상 국민건강보험종합계획에 포함되어야 할 사항을 모두 고른 것은?","ㄱ. 보험료 부과체계에 관한 사항","ㄴ. 요양급여비용에 관한 사항","ㄷ. 취약계층 지원에 관한 사항","ㄹ. 건강보험에 관한 통계 및 정보의 관리에 관한 사항"],"c":["ㄱ, ㄴ","ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"18-3-70","y":2018,"g":3,"n":70,"t":"가족·여성 관련법(한부모·다문화·가정폭력·성폭력 등)","f":"옳은 것 고르기","s":["다문화가족지원법의 내용으로 옳은 것은?"],"c":["여성가족부장관은 다문화가족 지원을 위하여 3년마다 다문화가족정책에 관한 기본계획을 수립하여야 한다.","다문화가족의 삶의 질 향상과 사회통합에 관한 중요 사항을 심의ㆍ조정하기 위하여 여성가족부장관 소속으로 다문화가족정책위원회를 둔다.","지방자치단체는 다문화가족의 현황 및 실태를 파악하고다문화가족 지원을 위한 정책수립에 활용하기 위하여 5년마다 다문화가족에 대한 실태조사를 실시하고 그 결과를 공표하여야 한다.","시ㆍ도에는 다문화가족 지원을 담당할 기구와 공무원을두어야 한다.","기업은 다문화가족에 대한 사회적 차별 및 편견을 예방하고 사회구성원이 문화적 다양성을 인정하고 존중할 수 있도록 홍보와 교육 및 재정상 필요한 조치를 하여야 한다."],"a":4},{"id":"18-3-71","y":2018,"g":3,"n":71,"t":"국민연금법","f":"옳지 않은 것","s":["국민연금법에 따른 급여에 해당하지 않은 것은?"],"c":["노령연금","장애연금","유족연금","반환일시금","장의비(葬儀費)"],"a":5},{"id":"18-3-72","y":2018,"g":3,"n":72,"t":"아동복지법·영유아보육법·청소년복지지원법","f":"옳지 않은 것","s":["아동복지법의 내용으로 옳지 않은 것은?"],"c":["학교의 장은 친권자가 없는 아동을 발견한 경우 그 복지를 위하여 필요하다고 인정할 때에는 시장ㆍ군수ㆍ구청장에게 친권자의 선임을 청구하여야 한다.","아동위원은 명예직으로 하되, 아동위원에 대하여는 수당을 지급할 수 있다.","누구든지 아동의 정신건강 및 발달에 해를 끼치는 정서적 학대행위를 하여서는 아니 된다.","매년 5월 5일을 어린이날로 하며, 5월 1일부터 5월 7일까지를 어린이주간으로 한다.","법원의 심리과정에서 변호사가 아닌 아동보호전문기관의상담원은 학대아동사건의 심리에 있어서 법원의 허가를 받아 보조인이 될 수 있다."],"a":1},{"id":"18-3-73","y":2018,"g":3,"n":73,"t":"고용보험법·산업재해보상보험법","f":"빈칸 채우기","s":["다음은 고용보험법상 이직한 피보험자의 구직급여 수급 요건 중 하나이다. ( )에 들어갈 숫자를 옳게 짝지은 것은?","이직일 이전 ( ㄱ )개월간 피보험 단위기간이 통산하여 ( ㄴ )일 이상일 것"],"c":["ㄱ : 6, ㄴ : 90","ㄱ : 6, ㄴ : 120","ㄱ : 10, ㄴ : 180","ㄱ : 18, ㄴ : 120","ㄱ : 18, ㄴ : 180"],"a":5},{"id":"18-3-74","y":2018,"g":3,"n":74,"t":"노인복지법·장애인복지법·장애인연금법","f":"옳지 않은 것","s":["장애인복지법의 내용으로 옳지 않은 것은?"],"c":["중앙행정기관의 장은 해당 기관의 장애인정책을 효율적으로 수립ㆍ시행하기 위하여 소속공무원 중에서 장애인정책책임관을 지정할 수 있다.","재한외국인 처우 기본법에 따른 결혼이민자는 장애인복지법에 따른 장애인 등록을 할 수 없다.","국가와 지방자치단체는 장애 정도가 심하여 자립하기가매우 곤란한 장애인이 필요한 보호 등을 평생 받을 수 있도록 알맞은 정책을 강구하여야 한다.","장애인은 장애인 관련 정책결정과정에 우선적으로 참여할 권리가 있다.","국가는 초ㆍ중등교육법에 따른 학교에서 사용하는 교과용도서에 장애인에 대한 인식개선을 위한 내용이 포함되도록 하여야 한다."],"a":2},{"id":"18-3-75","y":2018,"g":3,"n":75,"t":"노인복지법·장애인복지법·장애인연금법","f":"옳지 않은 것","s":["노인복지법의 내용으로 옳지 않은 것은?"],"c":["국가는 노인보건복지관련 연구시설을 위하여 필요하다고인정하는 경우 국유재산법 규정에 불구하고 국유재산을 무상으로 대부할 수 있다.","지방자치단체는 노인보건복지관련 사업의 육성을 위하여필요하다고 인정하는 경우 지방재정법의 규정에 불구하고 공유재산을 무상으로 사용하게 할 수 있다.","재가노인복지시설, 노인공동생활가정 및 노인요양공동생활가정은 공동주택에만 설치할 수 있다.","노인복지법에 의한 노인복지주택의 건축물의 용도는 건축관계법령에 불구하고 노유자시설로 본다.","노인복지시설에서 노인을 위하여 사용하는 건물ㆍ토지등에 대하여는 관계법령이 정하는 바에 의하여 조세 기타 공과금을 감면할 수 있다."],"a":3},{"id":"19-3-51","y":2019,"g":3,"n":51,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 고르기","s":["헌법 규정의 내용 중 사회적 기본권으로 보기 어려운 것은?"],"c":["모든 국민은 신체의 자유를 가진다.","모든 국민은 근로의 권리를 가진다.","모든 국민은 인간다운 생활을 할 권리를 가진다.","모든 국민은 능력에 따라 균등하게 교육을 받을 권리를가진다.","모든 국민은 건강하고 쾌적한 환경에서 생활할 권리를가진다."],"a":1},{"id":"19-3-52","y":2019,"g":3,"n":52,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"순서 나열","s":["법률의 제정연도가 빠른 순서대로 나열된 것은?","ㄱ. 국민연금법　　　　　　ㄴ. 고용보험법","ㄷ. 국민건강보험법　　　　ㄹ. 산업재해보상보험법"],"c":["ㄱ - ㄴ - ㄷ - ㄹ","ㄱ - ㄷ - ㄹ - ㄴ","ㄹ - ㄱ - ㄴ - ㄷ","ㄹ - ㄱ - ㄷ - ㄴ","ㄹ - ㄴ - ㄱ - ㄷ"],"a":3},{"id":"19-3-53","y":2019,"g":3,"n":53,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"순서 나열","s":["헌법 규정 중 ( )에 들어갈 내용이 순서대로 옳은 것은?","- 신체장애자 및 질병·노령 기타의 사유로 생활능력이 없는 국민은 (　　　)이 정하는 바에 의하여 국가의 보호를 받는다.","- 지방자치단체는 주민의 복리에 관한 사무를 처리하고 재산을 관리하며, (　　　)의 범위안에서 자치에 관한 규정을 제정할 수 있다."],"c":["대통령령, 법률","법률, 대통령령","법률, 법령","법령, 법률","대통령령, 법령"],"a":3},{"id":"19-3-54","y":2019,"g":3,"n":54,"t":"사회보장기본법·사회보장급여법","f":"옳지 않은 것","s":["사회보장기본법상 국가와 지방자치단체가 구축ㆍ운영하여야 하는 사회보장급여의 관리체계로 명시되지 않은 것은?"],"c":["사회보장제도의 평가 및 개선","사회보장수급권자 권리구제","사회보장급여의 사각지대 발굴","사회보장급여의 부정ㆍ오류 관리","사회보장급여의 과오지급액의 환수 등 관리"],"a":1},{"id":"19-3-55","y":2019,"g":3,"n":55,"t":"사회보장기본법·사회보장급여법","f":"옳지 않은 것","s":["사회보장기본법의 내용으로 옳지 않은 것은?"],"c":["국내에 거주하는 외국인에게 사회보장제도를 적용할 때에는 상호주의의 원칙에 따르되, 관계 법령에서 정하는 바에 따른다.","보건복지부장관은 사회보장정보시스템의 구축ㆍ운영을총괄한다.","사회보장정보의 보호 및 관리는 사회보장위원회의 심의ㆍ조정 사항이 아니다.","모든 국민은 자신의 능력을 최대한 발휘하여 자립ㆍ자활할 수 있도록 노력하여야 한다.","국가와 지방자치단체는 사회보장에 관한 책임과 역할을합리적으로 분담하여야 한다."],"a":3},{"id":"19-3-56","y":2019,"g":3,"n":56,"t":"사회보장기본법·사회보장급여법","f":"옳지 않은 것","s":["사회보장기본법상 사회보장에 관한 국민의 권리의 내용으로 옳지 않은 것은?"],"c":["사회보장수급권의 포기는 취소할 수 있다.","모든 국민은 사회보장 관계 법령에서 정하는 바에 따라사회보장급여를 받을 권리를 가진다.","국가는 관계 법령에서 정하는 바에 따라 최저보장수준과최저임금을 매년 공표하여야 한다.","사회보장수급권은 다른 사람에게 양도하거나 담보로 제공할 수 있다.","사회보장수급권은 제한되거나 정지될 수 없다. 다만, 관계 법령에서 따로 정하고 있는 경우에는 그러하지 아니하다."],"a":4},{"id":"19-3-57","y":2019,"g":3,"n":57,"t":"사회보장기본법·사회보장급여법","f":"옳은 것 모두 고르기","s":["사회보장급여의 이용ㆍ제공 및 수급권자 발굴에 관한 법률의 내용으로 옳은 것을 모두 고른 것은?","ㄱ. \"지원대상자\"란 사회보장급여를 필요로 하는 사람을 말한다.","ㄴ. \"보장기관\"이란 관계 법령 등에 따라 사회보장급여를 제공하는 국가기관과 지방자치단체를 말한다.","ㄷ. 통합사례관리를 실시하기 위하여 필요한 경우에는 특별자치시 및 시·군·구에 통합사례관리사를 둘 수 있다."],"c":["ㄱ","ㄷ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":5},{"id":"19-3-58","y":2019,"g":3,"n":58,"t":"사회복지사업법","f":"옳은 것 고르기","s":["사회복지사업법상 사회복지시설(이하 “시설”이라 한다)에 관한 설명으로 옳은 것은?"],"c":["국가가 시설을 설치ㆍ운영하려는 경우에는 소재지 관할시ㆍ도지사에게 신고하여야 한다.","화재로 인한 손해배상책임을 이행하기 위하여 시설의 운영자는 손해보험회사의 책임보험 및 한국사회복지공제회의 책임공제에 각각 가입하여야 한다.","시ㆍ도지사의 해임명령에 따라 사회복지법인의 임원에서해임된 자는 해임된 날부터 7년 이내에는 시설의 장이 될 수 없다.","시장ㆍ군수ㆍ구청장은 시설에 대하여 정기 및 수시 안전점검을 실시한 후 그 결과를 시ㆍ도지사에게 제출하여야 한다.","국가나 지방자치단체가 설치ㆍ운영하는 시설 중 사회복지관은 지역사회의 특성과 지역주민의 복지욕구를 고려하여 서비스 제공 등 지역복지증진을 위한 사업을 실시할 수 있다."],"a":5},{"id":"19-3-59","y":2019,"g":3,"n":59,"t":"사회복지사업법","f":"옳은 것 고르기","s":["사회복지사업법상 사회복지법인(이하 “법인”이라 한다)에 관한 설명으로 옳은 것은?"],"c":["법인을 설립하려는 자는 시장ㆍ군수ㆍ구청장의 허가를받아야 한다.","법인은 대표이사를 제외하고 이사 7명 이상을 두어야 한다.","이사의 임기는 4년으로 하고 연임할 수 있다.","법인은 수익사업에서 생긴 수익을 법인 또는 법인이 설치한 사회복지시설의 운영 외의 목적에 사용할 수 없다.","이사는 법인이 설치한 사회복지시설의 장 또는 그 시설의 직원을 겸할 수 있다."],"a":4},{"id":"19-3-60","y":2019,"g":3,"n":60,"t":"사회복지사업법","f":"옳지 않은 것","s":["사회복지사업법의 내용으로 옳지 않은 것은?"],"c":["사회복지서비스를 제공하는 자는 사회복지서비스를 이용하는 사람의 선택권을 보장하여야 한다.","사회복지서비스를 필요로 하는 사람에 대한 사회복지서비스 제공은 현금으로 제공하는 것이 원칙이다.","국가는 매년 9월 7일을 사회복지의 날로 한다.","보건복지부장관은 사회복지사가 법원의 판결에 따라 자격이 정지된 경우에는 그 자격을 취소하여야 한다.","시장ㆍ군수ㆍ구청장은 정당한 이유 없이 사회복지시설의설치를 지연시키는 조치를 하여서는 아니 된다."],"a":2},{"id":"19-3-61","y":2019,"g":3,"n":61,"t":"국민기초생활보장법","f":"옳지 않은 것","s":["국민기초생활 보장법의 내용으로 옳지 않은 것은?"],"c":["수급자에 대한 급여는 정당한 사유 없이 수급자에게 불리하게 변경할 수 없다.","“수급자”란 이 법에 따른 급여를 받는 사람을 말한다.","이 법에 따른 급여는 건강하고 문화적인 최저생활을 유지할 수 있는 것이어야 한다.","수급자 및 차상위자는 상호 협력하여 자활기업을 설립ㆍ운영할 수 있다.","교육급여는 보건복지부장관의 소관으로 한다."],"a":5},{"id":"19-3-62","y":2019,"g":3,"n":62,"t":"의료급여법·긴급복지지원법·기초연금법","f":"옳지 않은 것","s":["긴급복지지원법상 긴급지원의 종류 중 직접지원에 해당하지 않는 것은?"],"c":["생계지원","의료지원","교육지원","정보제공 지원","사회복지시설 이용 지원"],"a":4},{"id":"19-3-63","y":2019,"g":3,"n":63,"t":"의료급여법·긴급복지지원법·기초연금법","f":"옳은 것 고르기","s":["기초연금법의 내용으로 옳은 것은?"],"c":["“소득인정액”이란 본인 및 배우자의 소득평가액과 재산의 소득환산액을 합산한 금액을 말한다.","기초연금 수급권자가 국외로 이주하더라도 기초연금 수급권을 상실하지 않는다.","기초연금으로 지급받은 금품은 압류할 수 있다.","기초연금은 기초연금의 지급을 신청한 날이 속하는 달의다음 달부터 지급한다.","본인과 그 배우자가 모두 기초연금 수급권자인 경우에는각각의 기초연금액에서 기초연금액의 100분의 50에 해당하는 금액을 감액한다."],"a":1},{"id":"19-3-64","y":2019,"g":3,"n":64,"t":"고용보험법·산업재해보상보험법","f":"옳지 않은 것","s":["고용보험법의 내용으로 옳지 않은 것은?"],"c":["“일용근로자”는 1개월 미만 동안 고용되는 자를 말한다.","실업급여에는 취업촉진수당이 포함되지 않는다.","“실업”이란 근로의 의사와 능력이 있음에도 불구하고 취업하지 못한 상태에 있는 것을 말한다.","구직급여를 지급받으려는 자는 이직 후 지체없이 직업안정기관에 출석하여 실업을 신고하여야 한다.","65세 이후에 고용되거나 자영업을 개시한 자에 대한 고용안정ㆍ직업능력개발 사업에 관하여는 이 법을 적용한다."],"a":2},{"id":"19-3-65","y":2019,"g":3,"n":65,"t":"국민연금법","f":"옳은 것 고르기","s":["국민연금법의 내용으로 옳은 것은?"],"c":["이 법을 적용할 때 배우자의 범위에는 사실상의 혼인관계에 있는 자를 제외한다.","수급권을 취득할 당시 가입자였던 자의 태아가 출생하면그 자녀는 가입자였던 자에 의하여 생계를 유지하고 있던 자녀로 본다.","가입자의 종류는 사업장가입자와 지역가입자의 2가지로구분된다.","지역가입자가 사업장가입자의 자격을 취득한 때에는 그에 해당하게 된 날의 다음 날에 지역가입자의 자격을 상실한다.","수급권자가 사망한 경우 그 수급권자에게 미지급 급여가있으면 그 급여를 받을 순위는 자녀, 배우자, 부모의 순으로 한다."],"a":2},{"id":"19-3-66","y":2019,"g":3,"n":66,"t":"국민건강보험법·노인장기요양보험법","f":"옳은 것 모두 고르기","s":["노인장기요양보험법상 장기요양인정을 신청할 수 있는 자격을 갖춘 자를 모두 고른 것은?","ㄱ. 65세 미만의 자로서 대통령령으로 정하는 노인성 질병을 가진 자로 「의료급여법」 제3조제1항에 따른 수급권자","ㄴ. 대통령령으로 정하는 노인성 질병이 없는 65세 미만의 외국인으로서 「국민건강보험법」 제109조에 따른 건강보험의 가입자","ㄷ. 65세 이상의 노인으로 「국민건강보험법」 제5조에 따른 건강보험 가입자의 피부양자"],"c":["ㄱ","ㄷ","ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":4},{"id":"19-3-67","y":2019,"g":3,"n":67,"t":"고용보험법·산업재해보상보험법","f":"옳지 않은 것","s":["산업재해보상보험법상 보험급여의 종류로 명시되지 않은 것은?"],"c":["휴업급여","구직급여","유족급여","상병보상연금","장해급여"],"a":2},{"id":"19-3-68","y":2019,"g":3,"n":68,"t":"국민건강보험법·노인장기요양보험법","f":"옳은 것 고르기","s":["국민건강보험법상 가입자가 자격을 상실하는 시기로 옳은 것은?"],"c":["사망한 날의 다음 날","국적을 잃은 날","국내에 거주하지 아니하게 된 날","직장가입자의 피부양자가 된 다음 날","수급권자가 된 다음 날"],"a":1},{"id":"19-3-69","y":2019,"g":3,"n":69,"t":"모금회법·자원봉사활동기본법·사회적경제관련법","f":"옳은 것 고르기","s":["사회복지공동모금회법의 내용으로 옳은 것은?"],"c":["사회복지공동모금회에는 20명 이상 25명 이하의 이사를둔다.","사회복지공동모금회는 보건복지부장관의 승인 없이 복권을 발행할 수 있다.","사회복지공동모금회는 모금창구로 지정된 언론기관의 명의로 모금계좌를 개설할 수 없다.","사회복지공동모금회의 회계연도는 1월 1일부터 12월 31일까지로 한다.","기부금품의 기부자는 사용 용도를 지정할 수 없다."],"a":4},{"id":"19-3-70","y":2019,"g":3,"n":70,"t":"노인복지법·장애인복지법·장애인연금법","f":"옳은 것 고르기","s":["실태조사의 주체와 조사주기를 올바르게 짝지은 것은?"],"c":["장애인복지법상 장애실태조사: 보건복지부장관, 5년","아동복지법상 아동종합실태조사: 보건복지부장관, 3년","한부모가족지원법상 한부모가족 실태조사: 여성가족부장관, 3년","노인복지법상 노인실태조사: 여성가족부장관, 3년","다문화가족지원법상 다문화가족 실태조사: 보건복지부장관, 5년"],"a":3},{"id":"19-3-71","y":2019,"g":3,"n":71,"t":"노인복지법·장애인복지법·장애인연금법","f":"순서 나열","s":["장애인복지법상 벌칙에 관한 내용이다. ( )에 들어갈 숫자가 순서대로 옳은 것은?","장애인의 신체에 폭행을 가한 사람은 (　　　)년 이하의 징역 또는 (　　　)천만원 이하의 벌금에 처한다."],"c":["1, 1","3, 3","5, 5","7, 7","10, 7"],"a":3},{"id":"19-3-72","y":2019,"g":3,"n":72,"t":"아동복지법·영유아보육법·청소년복지지원법","f":"옳지 않은 것","s":["아동복지법의 내용으로 옳지 않은 것은?"],"c":["“아동”이란 18세 미만인 사람을 말한다.","보건복지부장관은 5년마다 아동정책기본계획을 수립하여야 한다.","국가 또는 지방자치단체 외의 자는 관할 시장ㆍ군수ㆍ구청장에게 신고하고 아동복지시설을 설치할 수 있다.","아동정책조정위원회는 국무총리 소속으로 둔다.","국가기관은 아동학대 예방교육을 연 2회 이상 실시하여야 한다."],"a":5},{"id":"19-3-73","y":2019,"g":3,"n":73,"t":"가족·여성 관련법(한부모·다문화·가정폭력·성폭력 등)","f":"옳은 것 모두 고르기","s":["성폭력방지 및 피해자보호 등에 관한 법률상 국가와 지방자치단체의 책무에 해당하는 것을 모두 고른 것은?","ㄱ. 성폭력 신고체계의 구축·운영","ㄴ. 성폭력 예방을 위한 유해환경 개선","ㄷ. 성폭력 예방을 위한 조사·연구, 교육 및 홍보","ㄹ. 피해자에 대한 직업훈련 및 법률구조 등 사회복귀 지원"],"c":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"19-3-74","y":2019,"g":3,"n":74,"t":"가족·여성 관련법(한부모·다문화·가정폭력·성폭력 등)","f":"옳지 않은 것","s":["가정폭력방지 및 피해자보호 등에 관한 법률의 내용으로 옳지 않은 것은?"],"c":["단기보호시설은 피해자등을 6개월의 범위에서 보호하는시설이다.","국가는 가정폭력 관련 상담소의 설치ㆍ운영에 드는 경비의 전부를 보조하여야 한다.","여성가족부장관 또는 시ㆍ도지사는 긴급전화센터를 설치ㆍ운영하여야 한다.","가정폭력의 예방과 방지에 관한 교육 및 홍보는 가정폭력 관련 상담소의 업무에 해당한다.","사회복지법인은 시장ㆍ군수ㆍ구청장의 인가를 받아 가정폭력피해자 보호시설을 설치ㆍ운영할 수 있다."],"a":2},{"id":"19-3-75","y":2019,"g":3,"n":75,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 고르기","s":["사회보장과 관련한 헌법재판소 결정의 내용으로 옳은 것은?"],"c":["국민연금법상 연금보험료의 강제징수는 헌법상 재산권보장에 위배된다.","국민건강보험료 체납으로 인하여 보험급여가 제한되는기간 중에 발생한 보험료에 대한 강제 징수는 건강보험가입자의 재산권을 침해한다.","국민기초생활 보장법령상 수급자등의 금융자산을 확인할수 있는 자료의 제출요구는 급여신청자의 평등권을 침해한다.","60세 이상의 국민에 대한 국민연금제도 가입을 제한하는것은 헌법상의 인간다운 생활을 할 권리를 침해하는 것이라고 볼 수 없다.","사회복지사업법의 규정 내용 중 사회복지법인의 재산을기본재산과 보통재산으로 구분하도록 한 것은 명확성의 원칙에 위반된다."],"a":4},{"id":"20-3-51","y":2020,"g":3,"n":51,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"순서 나열","s":["제정연도가 가장 빠른 것과 가장 늦은 것을 순서대로 짝지은 것은?","ㄱ. 긴급복지지원법　　　　　ㄴ. 고용보험법","ㄷ. 노인복지법　　　　　　　ㄹ. 기초연금법"],"c":["ㄴ, ㄱ","ㄴ, ㄹ","ㄷ, ㄱ","ㄷ, ㄴ","ㄷ, ㄹ"],"a":5},{"id":"20-3-52","y":2020,"g":3,"n":52,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"순서 나열","s":["헌법 제34조 규정의 일부이다. ( )에 들어갈 내용이 순서대로 옳은 것은?","- 국가는 사회보장·(　　　)의 증진에 노력할 의무를 진다.","- 신체장애자 및 질병·노령 기타의 사유로 생활능력이 없는 국민은 (　　　)이 정하는 바에 의하여 국가의 보호를 받는다."],"c":["공공부조, 헌법","공공부조, 법률","사회복지, 헌법","사회복지, 법률","자원봉사, 법률"],"a":4},{"id":"20-3-53","y":2020,"g":3,"n":53,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 고르기","s":["법령의 제정에 관한 헌법의 내용으로 옳은 것은?"],"c":["국무총리는 총리령을 발할 수 없다.","지방자치단체의 장은 부령을 발할 수 있다.","정부는 법률안을 제출할 수 없다.","법률안은 국무회의의 심의를 거쳐야 한다.","법률은 특별한 규정이 없는 한 공포한 날로부터 90일을경과함으로써 효력을 발생한다."],"a":4},{"id":"20-3-54","y":2020,"g":3,"n":54,"t":"사회보장기본법·사회보장급여법","f":"옳지 않은 것","s":["사회보장기본법의 내용으로 옳지 않은 것은?"],"c":["사회보장위원회의 위원장은 보건복지부장관이 된다.","사회보장위원회는 30명 이내의 위원으로 구성한다.","사회보장 기본계획은 5년마다 수립하여야 한다.","보건복지부장관은 사회보장정보시스템의 구축ㆍ운영을총괄한다.","모든 국민은 사회보장 관계 법령에서 정하는 바에 따라사회보장급여를 받을 권리를 가진다."],"a":1},{"id":"20-3-55","y":2020,"g":3,"n":55,"t":"사회보장기본법·사회보장급여법","f":"옳지 않은 것","s":["사회보장기본법상 사회보장제도의 신설 또는 변경에 따른 협의 및 조정에 관한 내용으로 옳지 않은 것은?"],"c":["국가와 지방자치단체는 기존 제도와의 관계, 사회보장전달체계와 재정 등에 미치는 영향등을 사전에 충분히 검토하여야 한다.","지방자치단체의 장은 국무조정실장과 협의하여야 한다.","중앙행정기관의 장은 보건복지부장관과 협의하여야 한다.","국가와 지방자치단체는 사회보장급여가 중복 또는 누락되지 아니하도록 하여야 한다.","중앙행정기관의 장은 협의에 관련된 자료의 수집ㆍ조사및 분석에 관한 업무를 사회보장정보원에 위탁할 수 있다."],"a":2},{"id":"20-3-56","y":2020,"g":3,"n":56,"t":"사회보장기본법·사회보장급여법","f":"옳지 않은 것","s":["사회보장급여의 이용ㆍ제공 및 수급권자 발굴에 관한 법률상 사회보장정보원에 관한 내용으로 옳지 않은 것은?"],"c":["사회보장정보원은 법인으로 한다.","정부는 사회보장정보원의 설립에 필요한 비용을 출연할수 있다.","사회보장정보원의 운영에 필요한 비용은 정부가 지원할수 없으며 정보이용자가 지불하는 부담금으로 충당한다.","사회보장정보원에 관하여 이 법에서 규정한 사항 외에는「민법」중 재단법인에 관한 규정을 준용한다.","사회보장정보원의 임직원은 그 직무상 알게 된 비밀을다른 용도로 사용하여서는 아니 된다."],"a":3},{"id":"20-3-57","y":2020,"g":3,"n":57,"t":"사회복지사업법","f":"옳지 않은 것","s":["사회보장급여의 이용ㆍ제공 및 수급권자 발굴에 관한 법률상 사회복지전담공무원에 관한 내용으로 옳지 않은 것을 모두 고른 것은?","ㄱ. 시·군·구, 읍·면·동에 사회복지전담공무원을 둘 수 있고 시·도에는 둘 수 없다.","ㄴ. 사회복지전담공무원은 「사회복지사업법」에 따른 사회복지사의 자격을 가진 사람으로 한다.","ㄷ. 시·도지사 및 시장·군수·구청장은 「지방공무원 교육훈련법」에 따라 사회복지전담공무원의 교육훈련에 필요한 시책을 수립·시행하여야 한다."],"c":["ㄱ","ㄴ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ"],"a":1},{"id":"20-3-58","y":2020,"g":3,"n":58,"t":"사회복지사업법","f":"옳지 않은 것","s":["사회복지사업법에서 열거하고 있는 사회복지사업 관련 법률에 해당하지 않는 것은?"],"c":["아동복지법","노인복지법","입양특례법","국민건강보험법","사회복지공동모금회법"],"a":4},{"id":"20-3-59","y":2020,"g":3,"n":59,"t":"사회복지사업법","f":"옳은 것 고르기","s":["사회복지사업법상 사회복지시설(이하 ‘시설’이라 한다)의 운영위원회에 관한 내용으로 옳은 것은?"],"c":["시설의 장은 운영위원이 될 수 없다.","운영위원회의 위원은 시설의 장이 위촉한다.","시설 거주자 대표는 운영위원이 될 수 없다.","운영위원회는 시설운영에 관하여 의결권을 갖는다.","시설 거주자의 보호자 대표는 운영위원이 될 수 있다."],"a":5},{"id":"20-3-60","y":2020,"g":3,"n":60,"t":"사회복지사업법","f":"옳은 것 고르기","s":["사회복지사업법상 사회복지법인(이하 ‘법인’이라 한다)에 관한 내용으로 옳은 것은?"],"c":["법인 설립 허가자는 보건복지부장관이다.","법인 설립은 시장ㆍ군수ㆍ구청장에 신고한다.","해산한 법인의 남은 재산은 설립자에 귀속된다.","이사는 법인이 설치한 사회복지시설의 장을 겸직할 수있다.","주된 사무소가 서로 다른 시ㆍ도에 소재한 법인이 합병할 경우 시ㆍ도지사에게 신고하여야 한다."],"a":4},{"id":"20-3-61","y":2020,"g":3,"n":61,"t":"국민기초생활보장법","f":"옳은 것 고르기","s":["국민기초생활보장법상 용어의 정의로 옳은 것은?"],"c":["수급권자란 이 법에 따른 급여를 받는 사람을 말한다.","기준 중위소득이란 국민 가구소득의 평균값을 말한다.","보장기관이란 이 법에 따른 급여를 실시하는 사회복지시설을 말한다.","소득인정액이란 보장기관이 급여의 결정 및 실시 등에사용하기 위하여 산출한 개별가구의 소득평가액과 재산의 소득환산액을 합산한 금액을 말한다.","최저생계비란 국민이 쾌적한 문화생활을 유지하기 위하여 필요한 적정선의 비용을 말한다."],"a":4},{"id":"20-3-62","y":2020,"g":3,"n":62,"t":"국민기초생활보장법","f":"옳지 않은 것","s":["국민기초생활보장법상 자활 지원에 관한 내용으로 옳지 않은 것은?","형성할 수 있도록 재정적인 지원을 할 수 있다."],"c":["보장기관은 자활지원사업의 원활한 추진을 위하여 자활기금을 적립한다.","보장기관은 지역자활센터에 국유ㆍ공유 재산의 무상임대지원을 할 수 있다.","보장기관은 수급자 및 차상위자가 자활에 필요한 자산을","보장기관은 수급자 및 차상위자의 자활 촉진에 필요한사업을 수행하게 하기 위하여 법인 등의 신청을 받아 지역자활센터를 지정할 수 있다.","수급자 및 소득인정액이 기준 중위소득의 100분의 70이상인 자는 상호 협력하여 자활기업을 설립ㆍ운영할 수 있다."],"a":5},{"id":"20-3-63","y":2020,"g":3,"n":63,"t":"의료급여법·긴급복지지원법·기초연금법","f":"순서 나열","s":["기초연금법의 내용이다. ( )에 들어갈 숫자가 순서대로 옳은 것은?","- 보건복지부장관은 선정기준액을 정하는 경우 65세 이상인 사람 중 기초연금 수급자가 100분의 (　　) 수준이 되도록 한다.","- 본인과 그 배우자가 모두 기초연금 수급권자인 경우에는 각각의 기초연금액에서 기초연금액의 100분의 (　　)에 해당하는 금액을 감액한다."],"c":["60, 40","60, 50","70, 20","70, 30","80, 10"],"a":3},{"id":"20-3-64","y":2020,"g":3,"n":64,"t":"의료급여법·긴급복지지원법·기초연금법","f":"옳지 않은 것","s":["긴급복지지원법의 내용으로 옳지 않은 것은?"],"c":["주거지가 불분명한 자도 긴급지원대상자가 될 수 있다.","국내에 체류하는 모든 외국인은 긴급지원대상자가 될 수없다.","위기상황에 처한 사람에게 일시적으로 신속하게 지원하는 것을 기본원칙으로 한다.","누구든지 긴급지원대상자를 발견한 경우에는 관할 시장ㆍ군수ㆍ구청장에게 신고하여야 한다.","국가 및 지방자치단체는 위기상황에 처한 사람에 대한발굴조사를 연 1회 이상 정기적으로 실시하여야 한다."],"a":2},{"id":"20-3-65","y":2020,"g":3,"n":65,"t":"국민건강보험법·노인장기요양보험법","f":"옳지 않은 것","s":["국민건강보험법상 요양급여에 해당하지 않는 것은?"],"c":["예방ㆍ재활","이송(移送)","요양병원간병비","처치ㆍ수술 및 그 밖의 치료","약제(藥劑)ㆍ치료재료의 지급"],"a":3},{"id":"20-3-66","y":2020,"g":3,"n":66,"t":"고용보험법·산업재해보상보험법","f":"옳지 않은 것","s":["산업재해보상보험법상 업무상 사고에 해당하지 않는 것은?"],"c":["출장기간 중 발생한 모든 사고","근로자가 근로계약에 따른 업무나 그에 따르는 행위를하던 중 발생한 사고","휴게시간 중 사업주의 지배관리하에 있다고 볼 수 있는행위로 발생한 사고","사업주가 주관하거나 사업주의 지시에 따라 참여한 행사나 행사준비 중에 발생한 사고","사업주가 제공한 시설물 등을 이용하던 중 그 시설물 등의 결함이나 관리소홀로 발생한 사고"],"a":1},{"id":"20-3-67","y":2020,"g":3,"n":67,"t":"국민건강보험법·노인장기요양보험법","f":"옳은 것 모두 고르기","s":["노인장기요양보험법상 장기요양급여 제공의 기본원칙에 해당하는 것을 모두 고른 것은?","ㄱ. 노인 등의 심신상태나 건강 등이 악화되지 아니하도록 의료서비스와 연계하여 이를 제공하여야 한다.","ㄴ. 노인 등이 자신의 의사와 능력에 따라 최대한 자립적으로 일상생활을 수행할 수 있도록 제공하여야 한다.","ㄷ. 노인 등이 가족과 함께 생활하면서 가정에서 장기요양을 받는 재가급여를 우선적으로 제공하여야 한다.","ㄹ. 노인 등의 심신상태·생활환경과 노인 등 및 그 가족의 욕구·선택을 종합적으로 고려하여 필요한 범위 안에서 이를 적정하게 제공하여야 한다."],"c":["ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"20-3-68","y":2020,"g":3,"n":68,"t":"고용보험법·산업재해보상보험법","f":"옳은 것 고르기","s":["고용보험법의 내용으로 옳은 것은?"],"c":["고용노동부장관은 보험사업에 대하여 3년마다 평가를 하여야 한다.","국가는 매년 보험사업에 드는 비용의 20%를 특별회계에서 부담하여야 한다.","피보험자는 이 법이 적용되는 사업에 고용된 날의 다음달부터 피보험자격을 취득한다.","실업급여로서 지급된 금품에 대하여 국가는 「국세기본법」에 따른 모든 공과금을 부과하여야 한다.","고용보험사업으로 고용안정ㆍ직업능력개발 사업, 실업급여, 육아휴직 급여 및 출산전후 휴가급여 등을 실시한다."],"a":5},{"id":"20-3-69","y":2020,"g":3,"n":69,"t":"아동복지법·영유아보육법·청소년복지지원법","f":"순서 나열","s":["아동복지법의 내용이다. ( )에 들어갈 내용이 순서대로 옳은 것은?","- 국무총리 소속으로 (　　　)를 둔다.","- 시·도지사, 시장·군수·구청장 소속으로 (　　　)를 각각 둔다.","- 보건복지부장관은 아동정책기본계획을 (　　　)년마다 수립하여야 한다.","- 보건복지부장관은 아동종합실태를 (　　　)년마다 조사하여 그 결과를 공표하여야 한다."],"c":["아동복지심의위원회, 아동정책조정위원회, 3, 5","아동정책조정위원회, 아동복지심의위원회, 3, 5","아동복지심의위원회, 아동정책조정위원회, 5, 3","아동정책조정위원회, 아동복지심의위원회, 5, 3","아동정책조정위원회, 아동복지심의위원회, 5, 5"],"a":5},{"id":"20-3-70","y":2020,"g":3,"n":70,"t":"노인복지법·장애인복지법·장애인연금법","f":"옳지 않은 것","s":["장애인복지법에 근거하여 설치 또는 설립하는 것이 아닌 것은?"],"c":["장애인 거주시설","한국장애인개발원","장애인권익옹호기관","발달장애인지원센터","장애인자립생활지원센터"],"a":4},{"id":"20-3-71","y":2020,"g":3,"n":71,"t":"노인복지법·장애인복지법·장애인연금법","f":"옳지 않은 것","s":["노인복지법상 노인학대에 관한 내용으로 옳지 않은 것은?"],"c":["「119구조ㆍ구급에 관한 법률」에 따른 119구급대의 구급대원은 65세 이상의 사람에 대한 노인학대 신고의무자에 속한다.","노인학대를 알게 된 때에는 신고의무자만 신고할 수 있다.","법원이 노인학대관련범죄자에 대하여 취업제한명령을 하는 경우, 취업제한기간은 10년을 초과하지 못한다.","노인학대신고를 접수한 노인보호전문기관의 직원은 지체없이 노인학대의 현장에 출동하여야 한다.","국가와 지방자치단체는 노인학대를 예방하고 수시로 신고를 받을 수 있도록 긴급전화를 설치하여야 한다."],"a":2},{"id":"20-3-72","y":2020,"g":3,"n":72,"t":"모금회법·자원봉사활동기본법·사회적경제관련법","f":"옳지 않은 것","s":["사회복지공동모금회법상 공동모금재원 배분기준에 포함되어야 하는 사항으로 명시되지 않은 것은?"],"c":["배분한도액","배분심사기준","배분신청자의 재산","공동모금재원의 배분대상","배분신청기간 및 배분신청서 제출 장소"],"a":3},{"id":"20-3-73","y":2020,"g":3,"n":73,"t":"가족·여성 관련법(한부모·다문화·가정폭력·성폭력 등)","f":"옳지 않은 것","s":["다문화가족지원법의 내용으로 옳지 않은 것은?"],"c":["다문화가족은 대한민국 국적을 취득한 자로 이루어진 가족이어야 한다.","다문화가족이 이혼 등의 사유로 해체된 경우에도 그 구성원이었던 자녀에 대하여 이 법을 적용한다.","다문화가족지원센터는 결혼이민자 등에 대한 한국어 교육 업무를 수행한다.","국가와 지방자치단체는 다문화가족에 대해 가족생활교육등을 추진하는 경우, 문화의 차이를 고려한 전문적인 서비스가 제공될 수 있도록 노력하여야 한다.","여성가족부장관은 5년마다 다문화가족정책에 관한 기본계획을 수립하여야 한다."],"a":1},{"id":"20-3-74","y":2020,"g":3,"n":74,"t":"가족·여성 관련법(한부모·다문화·가정폭력·성폭력 등)","f":"옳지 않은 것","s":["성폭력방지 및 피해자보호 등에 관한 법률상 성폭력피해자보호시설의 종류가 아닌 것은?"],"c":["일반보호시설","상담지원시설","외국인보호시설","특별지원 보호시설","자립지원 공동생활시설"],"a":2},{"id":"20-3-75","y":2020,"g":3,"n":75,"t":"가족·여성 관련법(한부모·다문화·가정폭력·성폭력 등)","f":"옳지 않은 것","s":["가정폭력방지 및 피해자보호 등에 관한 법률의 내용으로 옳지 않은 것은?"],"c":["이 법에서의 ‘아동’이란 18세 미만인 자를 말한다.","국가인권위원회 위원장은 3년마다 가정폭력에 대한 실태조사를 실시하여야 한다.","시ㆍ도지사는 외국어 서비스를 제공하는 긴급전화센터를따로 설치ㆍ운영할 수 있다.","지방자치단체는 가정폭력 관련 상담소를 외국인, 장애인등 대상별로 특화하여 운영할 수 있다.","지방자치단체는 가정폭력 관련 상담원 교육훈련시설을설치ㆍ운영할 수 있다."],"a":2},{"id":"21-3-51","y":2021,"g":3,"n":51,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 고르기","s":["법률과 그 제정연대의 연결이 옳은 것은?"],"c":["산업재해보상보험법, 장애인복지법 - 1970년대","사회복지사업법, 국민기초생활 보장법 - 1980년대","고용보험법, 사회복지공동모금회법 - 1990년대","국민연금법, 노인복지법 - 2000년대","아동복지법, 국민건강보험법 - 2010년대"],"a":3},{"id":"21-3-52","y":2021,"g":3,"n":52,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 고르기","s":["사회복지법의 성문법원에 해당하는 것끼리 묶은 것은?"],"c":["관습법, 판례법","헌법, 판례법","헌법, 명령","관습법, 법률","법률, 조리"],"a":3},{"id":"21-3-53","y":2021,"g":3,"n":53,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳지 않은 것","s":["자치법규에 관한 설명으로 옳지 않은 것은?"],"c":["조례는 지방의회에서 제정하는 자치법규이다.","지방자치단체는 법령의 범위와 무관하게 조례를 제정할수 있다.","규칙은 지방자치단체의 장이 법령이나 조례가 위임한 범위에서 그 권한에 속하는 사무에 관하여 제정할 수 있는 자치법규이다.","시ㆍ군 및 자치구의 조례나 규칙은 시ㆍ도의 조례나 규칙을 위반하여서는 아니 된다.","조례안이 지방의회에서 의결되면 의장은 의결된 날부터5일 이내에 그 지방자치단체의 장에게 이를 이송하여야 한다."],"a":2},{"id":"21-3-54","y":2021,"g":3,"n":54,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳지 않은 것","s":["우리나라 법체계에 관한 설명으로 옳지 않은 것은?"],"c":["법규범 위계에서 최상위 법규범은 헌법이다.","법률은 법규범의 위계에서 헌법 다음 단계의 규범이다.","법률은 국회에서 제정하거나 행정부에서 제출하여 국회의 의결을 거쳐 제정된다.","시행령은 국무총리나 행정각부의 장이 발(發)하는 명령이다.","명령에는 시행령과 시행규칙이 있다."],"a":4},{"id":"21-3-55","y":2021,"g":3,"n":55,"t":"사회보장기본법·사회보장급여법","f":"옳은 것 모두 고르기","s":["사회보장기본법상 사회보장수급권에 관한 내용으로 옳은 것을 모두 고른 것은?","ㄱ. 모든 국민은 사회보장 관계 법령에서 정하는 바에 따라 사회보장급여를 받을 권리인 사회보장수급권을 가진다.","ㄴ. 사회보장수급권은 정당한 권한이 있는 기관에게 구두로 통지하여 포기할 수 있다.","ㄷ. 사회보장수급권은 수급자 임의로 다른 사람에게 양도할 수 있다.","ㄹ. 사회보장수급권의 포기는 취소할 수 없다."],"c":["ㄱ","ㄱ, ㄹ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ"],"a":1},{"id":"21-3-56","y":2021,"g":3,"n":56,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 고르기","s":["각 법률의 권리구제절차 내용으로 옳은 것은?"],"c":["국민연금법에 따르면 심사청구와 재심사청구의 순으로진행된다.","국민건강보험법에 명시되어 있는 권리구제절차는 심사청구이다.","고용보험법에 명시되어 있는 권리구제절차는 이의신청이다.","한부모가족지원법에 따르면 이의신청과 심판청구의 순으로 진행된다.","기초연금법에 명시되어 있는 권리구제절차는 이의신청과재심사청구이다."],"a":1},{"id":"21-3-57","y":2021,"g":3,"n":57,"t":"사회보장기본법·사회보장급여법","f":"옳은 것 모두 고르기","s":["사회보장기본법상 용어의 정의에 관한 내용으로 옳은 것을 모두 고른 것은?","ㄱ. \"사회보험\"이란 국민에게 발생하는 사회적 위험을 보험의 방식으로 대처함으로써 국민의 건강과 소득을 보장하는 제도를 말한다.","ㄴ. \"공공부조\"(公共扶助)란 국가와 지방자치단체의 책임 하에 생활 유지 능력이 없거나 생활이 어려운 국민의 최저생활을 보장하고 자립을 지원하는 제도를 말한다.","ㄷ. \"평생사회안전망\"이란 생애주기에 걸쳐 보편적으로 충족되어야 하는 기본욕구와 특정한 사회위험에 의하여 발생하는 특수욕구를 동시에 고려하여 소득·서비스를 보장하는 맞춤형 사회보장제도를 말한다."],"c":["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":5},{"id":"21-3-58","y":2021,"g":3,"n":58,"t":"사회보장기본법·사회보장급여법","f":"옳은 것 고르기","s":["사회보장급여의 이용ㆍ제공 및 수급권자 발굴에 관한 법률의 설명으로 옳은 것은?"],"c":["2017년 12월 30일에 제정, 2018년 7월 1일부터 시행되었다.","지원대상자가 누락되지 않도록 하기 위해 보장기관의 업무담당자는 지원대상자의 동의를 받지 않고도 직권으로 사회보장급여의 제공을 신청할 수 있다.","수급자란 사회보장급여를 받고 있는 사람을 말한다.","보건복지부 장관은 사회보장급여 부정수급 실태조사를 5년마다 실시하고 그 결과를 공개해야 한다.","이 법에 따른 처분에 이의가 있는 수급권자등은 그 처분을 받은 날부터 30일 이내에 처분을 결정한 보장기관의 장에게 이의신청을 해야 한다."],"a":3},{"id":"21-3-59","y":2021,"g":3,"n":59,"t":"사회복지사업법","f":"옳은 것 고르기","s":["사회복지사업법상 기본이념에 해당하는 것은?"],"c":["사회통합과 행복한 복지사회의 실현","국민의 복지증진에 이바지","어려운 사람의 자활을 지원","사회 참여와 평등을 통한 사회통합","사회복지서비스를 이용하는 사람의 선택권 보장"],"a":5},{"id":"21-3-60","y":2021,"g":3,"n":60,"t":"사회복지사업법","f":"옳은 것 고르기","s":["사회복지사업법의 내용으로 옳은 것은?"],"c":["「사회보장기본법」상 사회서비스는 사회복지서비스의범위에 포함되는 개념이다.","사회복지서비스 제공은 현물 제공이 원칙이다.","사회복지사 자격은 1년을 초과하여 정지시킬 수 있다.","사회복지법인은 보건복지부장관의 허가를 받아 설립한다.","보건복지부장관은 시설에서 제공하는 서비스의 적정기준을 마련하여야 한다."],"a":2},{"id":"21-3-61","y":2021,"g":3,"n":61,"t":"사회복지사업법","f":"옳은 것 고르기","s":["사회복지사업법에 명시된 날에 해당하는 것은?"],"c":["장애인의 날 4월 20일","노인의 날 10월 2일","아동학대 예방의 날 11월 19일","사회복지의 날 9월 7일","어버이 날 5월 8일"],"a":4},{"id":"21-3-62","y":2021,"g":3,"n":62,"t":"국민기초생활보장법","f":"옳지 않은 것","s":["국민기초생활 보장법상 외국인에 대한 특례 규정이다. ( )에 들어갈 내용이 옳지 않은 것은?","국내에 체류하고 있는 외국인 중 ( ㄱ )하며 본인 또는 배우자가 임신 중이거나 ( ㄴ )하고 있거나 ( ㄷ )과 ( ㄹ )으로서 ( ㅁ )으로 정하는 사람이 이 법에 따른 급여를 받을 수 있는 자격을 가진 경우에는 수급권자가 된다."],"c":["ㄱ: 대한민국 국민과 혼인","ㄴ: 대한민국 국적의 미성년 자녀를 양육","ㄷ: 배우자의 대한민국 국적인 직계비속","ㄹ: 생계나 주거를 같이하고 있는 사람","ㅁ: 대통령령"],"a":3},{"id":"21-3-63","y":2021,"g":3,"n":63,"t":"국민기초생활보장법","f":"옳은 것 고르기","s":["국민기초생활 보장법상 5년 이하의 징역 또는 5천만원 이하의 벌금에 처해지는 경우는?"],"c":["부정한 방법으로 급여를 받은 경우","수급권자의 금융정보를 사용ㆍ제공한 경우","지급받은 급여를 용도 외로 사용한 경우","직무상 알게 된 비밀을 누설한 경우","종교상의 행위를 강제한 경우"],"a":2},{"id":"21-3-64","y":2021,"g":3,"n":64,"t":"고용보험법·산업재해보상보험법","f":"옳지 않은 것","s":["산업재해보상보험법상 '업무상 사고'에 해당하지 않는 것은?"],"c":["근로자가 근로계약에 따른 업무나 그에 따르는 행위를하던 중 발생한 사고","사업주가 제공한 시설물 등을 이용하던 중 그 시설물 등의 결함이나 관리소홀로 발생한 사고","사업주가 주관하거나 사업주의 지시에 따라 참여한 행사나 행사준비 중에 발생한 사고","비통상적인 경로와 방법으로 출퇴근하는 중 발생한 사고","휴게시간 중 사업주의 지배관리하에 있다고 볼 수 있는행위로 발생한 사고"],"a":4},{"id":"21-3-65","y":2021,"g":3,"n":65,"t":"의료급여법·긴급복지지원법·기초연금법","f":"빈칸 채우기","s":["기초연금법상 수급권자의 범위에 관한 내용이다. ( )에 들어갈 숫자가 옳은 것은?","- 기초연금은 ( ㄱ )세 이상인 사람으로서 소득인정액이 보건복지부장관이 정하여 고시하는 금액(이하 \"선정기준액\"이라 한다) 이하인 사람에게 지급한다.","- 보건복지부장관은 선정기준액을 정하는 경우 ( ㄱ )세 이상인 사람 중 기초연금수급자가 100분의 ( ㄴ ) 수준이 되도록 한다."],"c":["ㄱ: 60, ㄴ: 70","ㄱ: 65, ㄴ: 70","ㄱ: 65, ㄴ: 80","ㄱ: 70, ㄴ: 70","ㄱ: 70, ㄴ: 80"],"a":2},{"id":"21-3-66","y":2021,"g":3,"n":66,"t":"국민연금법","f":"옳은 것 모두 고르기","s":["국민연금법상 급여의 종류에 해당하는 것을 모두 고른 것","은?","ㄱ. 노령연금　　　　ㄴ. 장해급여","ㄷ. 유족연금　　　　ㄹ. 반환일시금"],"c":["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"21-3-67","y":2021,"g":3,"n":67,"t":"고용보험법·산업재해보상보험법","f":"옳은 것 고르기","s":["고용보험법의 내용으로 옳은 것은?"],"c":["구직급여를 지급받으려는 사람은 이직 후 지체없이 직업안정기관에 출석하여 실업을 신고하여야 한다.","농업ㆍ임업 및 어업 중 법인이 아닌 자가 상시 4명의 근로자를 사용하는 사업에 대하여 고용보험법은 적용된다.","구직급여의 수급 요건으로서 기준기간은 피보험자의 이직일 이전 36개월로 한다.","실업 신고일부터 계산하기 시작하여 14일간의 대기기간중에는 구직급여를 지급하지 않는다.","이주비는 구직급여의 종류에 해당한다."],"a":1},{"id":"21-3-68","y":2021,"g":3,"n":68,"t":"국민건강보험법·노인장기요양보험법","f":"옳지 않은 것","s":["국민건강보험법상 국민건강보험공단이 관장하는 업무에 해당하지 않는 것은?"],"c":["가입자 및 피부양자의 자격관리","자산의 관리ㆍ운영 및 증식사업","의료시설의 운영","건강보험에 관한 교육훈련 및 홍보","요양급여비용의 심사"],"a":5},{"id":"21-3-69","y":2021,"g":3,"n":69,"t":"노인복지법·장애인복지법·장애인연금법","f":"옳은 것 모두 고르기","s":["학대에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 장애인복지법상 장애인 학대에 경제적 착취는 포함되지 않는다.","ㄴ. 아동학대범죄의 처벌 등에 관한 특례법에 따른 아동학대범죄는 아동복지법상 아동학대관련범죄에 해당한다.","ㄷ. 노인복지법상 노인학대라 함은 노인에 대하여 신체적·정신적·정서적·성적 폭력 및 경제적 착취 또는 가혹행위를 하거나 유기 또는 방임을 하는 것을 말한다."],"c":["ㄷ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":4},{"id":"21-3-70","y":2021,"g":3,"n":70,"t":"노인복지법·장애인복지법·장애인연금법","f":"옳지 않은 것","s":["노인복지법상 노인복지시설의 종류에 해당하지 않는 것은?"],"c":["노인주거복지시설","독거노인종합지원센터","노인보호전문기관","학대피해노인 전용쉼터","노인일자리지원기관"],"a":2},{"id":"21-3-71","y":2021,"g":3,"n":71,"t":"아동복지법·영유아보육법·청소년복지지원법","f":"옳지 않은 것","s":["사회복지법상 연령 규정이 옳지 않은 것은?","만인 사람을 말한다."],"c":["다문화가족지원법상 “아동ㆍ청소년”이란 24세 이하인 사람을 말한다.","아동복지법상 “아동”이란 18세 미만인 사람을 말한다.","한부모가족지원법상 “청소년 한부모”란 24세 이하의 모또는 부를 말한다.","한부모가족지원법상 “취학 중인 경우의 아동”은 24세 미","노인복지법상 노인의 정의에 대한 연령 규정은 없다."],"a":4},{"id":"21-3-72","y":2021,"g":3,"n":72,"t":"모금회법·자원봉사활동기본법·사회적경제관련법","f":"옳지 않은 것","s":["사회복지공동모금회법의 내용으로 옳지 않은 것은?"],"c":["기부하는 자의 의사에 반하여 기부금품을 모집하여서는아니 된다.","공동모금재원은 지역ㆍ단체ㆍ대상자 및 사업별로 복지수요가 공정하게 충족되도록 배분하여야 한다.","공동모금재원의 배분은 객관적인 기준에 따라 효율적으로 이루어지도록 하고, 그 결과를 공개하여야 한다.","이 법 또는 모금회의 정관으로 규정하지 아니한 사항은「민법」중 사단법인에 관한 규정을 준용한다.","국가나 지방자치단체는 모금회에 기부금품 모집에 필요한 비용과 모금회의 관리ㆍ운영에 필요한 비용을 보조할 수 있다."],"a":4},{"id":"21-3-73","y":2021,"g":3,"n":73,"t":"모금회법·자원봉사활동기본법·사회적경제관련법","f":"빈칸 채우기","s":["자원봉사활동의 기본방향에 관한 자원봉사활동 기본법 제2조제2호 규정이다. ( )에 들어갈 내용이 아닌 하나는?","자원봉사활동은 무보수성, 자발성, (　　), (　　), (　　), (　　)의 원칙 아래 수행될 수 있도록 하여야 한다."],"c":["공익성","비영리성","비정파성(非政派性)","비종파성(非宗派性)","무차별성"],"a":5},{"id":"21-3-74","y":2021,"g":3,"n":74,"t":"가족·여성 관련법(한부모·다문화·가정폭력·성폭력 등)","f":"옳지 않은 것","s":["성폭력방지 및 피해자보호 등에 관한 법률의 내용으로 옳지 않은 것은?"],"c":["피해자의 의사에 반하여 피해자 상담을 할 수 있다.","보호시설의 장이나 종사자는 업무상 알게 된 비밀을 누설해서는 아니 된다.","보호시설에 대한 보호비용의 지원 방법 및 절차 등에 필요한 사항은 여성가족부령으로 정한다.","시장ㆍ군수ㆍ구청장은 민간의료시설을 피해자등의 치료를 위한 전담의료기관으로 지정할 수 있다.","국가 또는 지방자치단체는 이 법 제27조제2항에 따른 치료 등 의료 지원에 필요한 경비의 전부 또는 일부를 지원할 수 있다."],"a":1},{"id":"21-3-75","y":2021,"g":3,"n":75,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳지 않은 것","s":["장애인고용부담금 부과처분과 관련한 헌법재판소 결정(2001헌바96)의 내용으로 옳지 않은 것은?"],"c":["기업의 경제상 자유는 공공복리를 위해 법률로 제한할수 있다.","국가는 경제주체 간의 조화를 통한 경제민주화를 위해규제와 조정을 할 수 있다.","고용부담금제도는 장애인고용의무제의 실효성을 확보하는 수단이므로 입법목적의 정당성이 인정된다.","고용부담금제도는 그 자체가 고용의무를 성실히 이행하는 사업주와 그렇지 않는 사업주간의 경제적 부담의 불균형을 조정하는 기능을 하기 때문에 고용부담금제도 자체의 차별성은 문제가 되지 않는다.","대통령령이 정하는 일정수 이상의 근로자를 고용하는 사업주는 기준고용률 이상에 해당하는 장애인을 고용해야 한다고 규정한 구 장애인고용촉진등에관한법률 제35조제1항 본문은 헌법에 불합치한다."],"a":5},{"id":"22-3-51","y":2022,"g":3,"n":51,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳지 않은 것","s":["헌법 규정의 사회적 기본권에 관한 설명으로 옳지 않은 것은?"],"c":["국가는 근로자의 고용의 증진과 적정임금의 보장에 노력하여야 한다.","국가는 여자의 복지와 권익의 향상을 위하여 노력하여야한다.","국가는 모든 공무원인 근로자의 단결권ㆍ단체교섭권 및단체행동권을 보장하여야 한다.","국가는 평생교육을 진흥하여야 한다.","국가는 모성의 보호를 위하여 노력하여야 한다."],"a":3},{"id":"22-3-52","y":2022,"g":3,"n":52,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 모두 고르기","s":["우리나라 사회복지법의 법원에 해당하는 것을 모두 고른 것은?","ㄱ. 대통령령　　　　　　　　　ㄴ. 조례","ㄷ. 일반적으로 승인된 국제법규　　ㄹ. 규칙"],"c":["ㄱ","ㄱ, ㄴ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"22-3-53","y":2022,"g":3,"n":53,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 고르기","s":["법률의 제정연도가 가장 빠른 것은?"],"c":["사회보장기본법","국민건강보험법","고용보험법","영유아보육법","노인복지법"],"a":5},{"id":"22-3-54","y":2022,"g":3,"n":54,"t":"사회보장기본법·사회보장급여법","f":"빈칸 채우기","s":["사회보장기본법상 사회보장제도의 운영원칙에 관한 사항이다. ( )에 들어갈 내용으로 옳은 것은?","사회보험은 ( ㄱ )의 책임으로 시행하고, 공공부조와 사회서비스는 ( ㄴ )의 책임으로 시행하는 것을 원칙으로 한다."],"c":["ㄱ: 국가, ㄴ: 국가","ㄱ: 지방자치단체, ㄴ: 지방자치단체","ㄱ: 국가와 지방자치단체, ㄴ: 국가","ㄱ: 국가, ㄴ: 국가와 지방자치단체","ㄱ: 국가와 지방자치단체, ㄴ: 국가와 지방자치단체"],"a":4},{"id":"22-3-55","y":2022,"g":3,"n":55,"t":"사회보장기본법·사회보장급여법","f":"옳지 않은 것","s":["사회보장기본법상 국가와 지방자치단체에 관한 설명으로 옳지 않은 것은?"],"c":["국가와 지방자치단체는 모든 국민의 인간다운 생활을 유지ㆍ증진하는 책임을 가진다.","국가와 지방자치단체는 사회보장에 관한 책임과 역할을합리적으로 분담하여야 한다.","국가와 지방자치단체는 사회보장제도의 안정적인 운영을위하여 중장기 사회보장 재정추계를 매년 실시하고 이를 공표하여야 한다.","국가와 지방자치단체는 지속가능한 사회보장제도를 확립하고 매년 이에 필요한 재원을 조달하여야 한다.","국가와 지방자치단체는 가정이 건전하게 유지되고 그 기능이 향상되도록 노력하여야 한다."],"a":3},{"id":"22-3-56","y":2022,"g":3,"n":56,"t":"사회보장기본법·사회보장급여법","f":"옳은 것 모두 고르기","s":["사회보장기본법상 사회보장위원회 위원으로 포함되어야 하는 중앙행정기관의 장을 모두 고른 것은?","ㄱ. 행정안전부장관　　　　　ㄴ. 고용노동부장관","ㄷ. 기획재정부장관　　　　　ㄹ. 국토교통부장관"],"c":["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"22-3-57","y":2022,"g":3,"n":57,"t":"사회보장기본법·사회보장급여법","f":"사례·제시문 판단","s":["사회보장급여의 이용ㆍ제공 및 수급권자 발굴에 관한 법률","의 내용으로 옳지 않은 것은?"],"c":["보장기관의 장은 ｢긴급복지지원법｣ 제7조의2에 따른 발굴조사를 실시한 경우를 제외하고 지원대상자에 대한 발굴조사를 1년마다 정기적으로 실시하여야 한다.","보장기관은 지역의 사회보장 수준이 균등하게 실현될 수있도록 노력하여야 한다.","누구든지 사회적 위험으로 인하여 사회보장급여를 필요로 하는 지원대상자를 발견하였을 때에는 보장기관에 알려야 한다.","이의신청은 그 처분을 받은 날로부터 90일 이내에 처분을 결정한 보장기관의 장에게 할 수 있다.","사회서비스 제공기관의 운영자는 위기가구의 발굴 지원업무 수행을 위해 사회서비스정보시스템을 이용할 수 있다."],"a":1},{"id":"22-3-58","y":2022,"g":3,"n":58,"t":"사회보장기본법·사회보장급여법","f":"옳은 것 모두 고르기","s":["사회보장급여의 이용ㆍ제공 및 수급권자 발굴에 관한 법률상 수급자격 확인을 위해 지원대상자와 그 부양의무자에 대하여 조사할 수 있는 사항을 모두 고른 것은?","ㄱ. 인적사항 및 가족관계 확인에 관한 사항","ㄴ. 소득·재산·근로능력 및 취업상태에 관한 사항","ㄷ. 사회보장급여 수급이력에 관한 사항","ㄹ. 수급권자를 선정하기 위하여 보장기관의 장이 필요하다고 인정하는 사항"],"c":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"22-3-59","y":2022,"g":3,"n":59,"t":"사회복지사업법","f":"옳지 않은 것","s":["사회복지사업법의 내용으로 옳지 않은 것은?"],"c":["보건복지부장관은 사회복지사가 거짓으로 자격을 취득한경우 그 자격을 취소하여야 한다.","사회복지법인을 설립하려는 자는 대통령령으로 정하는바에 따라 시ㆍ도지사의 허가를 받아야 한다.","사회복지법인이 설립 후 기본재산을 출연하지 아니한 때시ㆍ도지사는 시정명령을 내릴 수 있다.","누구든지 정당한 이유 없이 사회복지시설의 설치를 방해하여서는 아니 된다.","사회복지를 필요로 하는 사람은 누구든지 자신의 의사에따라 서비스를 신청하고 제공받을 수 있다."],"a":3},{"id":"22-3-60","y":2022,"g":3,"n":60,"t":"사회복지사업법","f":"옳은 것 고르기","s":["사회복지사업법상 사회복지시설(이하 '시설'이라고 한다)에 관한 설명으로 옳은 것은?"],"c":["지방자치단체가 시설을 설치ㆍ운영하려는 경우에는 보건복지부에 신고하여야 한다.","사회복지법인의 대표는 시설에 대하여 정기 및 수시 안전점검을 실시하여야 한다.","시설을 설치ㆍ운영하는 자는 시설에 근무할 종사자를 채용할 수 있다.","시설의 장은 시설의 운영에 관한 사항을 의결하기 위하여 시설에 운영위원회를 두어야 한다.","지방자치단체는 시설의 책임보험 가입에 드는 비용의 전부를 보조하여야 한다."],"a":3},{"id":"22-3-61","y":2022,"g":3,"n":61,"t":"사회복지사업법","f":"옳지 않은 것","s":["사회복지사업법상 사회복지법인(이하 '법인'으로 한다)에 관한 설명으로 옳지 않은 것은?"],"c":["법인이 설치한 사회복지시설의 장과 직원은 그 법인의이사를 겸할 수 없다.","파산선고를 받고 복권되지 아니한 사람은 임원이 될 수없다.","법인은 대표이사를 포함한 이사 7명 이상과 감사 2명 이상을 두어야 한다.","이사회는 안건, 표결수 등을 기재한 회의록을 작성하여야 한다.","해산한 법인의 남은 재산은 정관으로 정하는 바에 따라국가 또는 지방자치단체에 귀속된다."],"a":1},{"id":"22-3-62","y":2022,"g":3,"n":62,"t":"사회복지사업법","f":"순서 나열","s":["국민기초생활 보장법상 보장기관과 보장시설에 대한 예시이다. '보장기관 - 보장시설'을 순서대로 옳게 짝지은 것은?","ㄱ. 「장애인복지법」 제58조 제1항 제1호의 장애인 거주시설","ㄴ. 「사회복지사업법」 제2조 제4호의 사회복지시설 중 결핵 및 한센병요양시설","ㄷ. 대전광역시장","ㄹ. 전라남도지사","ㅁ. 인천광역시 교육감"],"c":["ㄱ - ㄴ","ㄴ - ㅁ","ㄷ - ㄱ","ㄹ - ㄷ","ㅁ - ㄹ"],"a":3},{"id":"22-3-63","y":2022,"g":3,"n":63,"t":"의료급여법·긴급복지지원법·기초연금법","f":"옳지 않은 것","s":["의료급여법상 의료급여의 내용에 해당하지 않는 것은?"],"c":["진찰ㆍ검사","예방ㆍ재활","입원","간호","화장 또는 매장 등 장제 조치"],"a":5},{"id":"22-3-64","y":2022,"g":3,"n":64,"t":"의료급여법·긴급복지지원법·기초연금법","f":"옳은 것 모두 고르기","s":["기초연금법상 기초연금의 지급정지 사유에 해당하는 것을 모두 고른 것은?","ㄱ. 기초연금 수급자가 금고 이상의 형을 선고받고 교정시설 또는 치료감호시설에 수용되어 있는 경우","ㄴ. 기초연금 수급자가 행방불명되거나 실종되는 등 대통령령으로 정하는 바에 따라 사망한 것으로 추정되는 경우","ㄷ. 기초연금 수급권자가 국적을 상실한 때","ㄹ. 기초연금 수급자의 국외 체류기간이 60일 이상 지속되는 경우"],"c":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"22-3-65","y":2022,"g":3,"n":65,"t":"의료급여법·긴급복지지원법·기초연금법","f":"옳지 않은 것","s":["긴급복지지원법상 직무수행 과정에서 긴급지원대상자가 있음을 알게 된 경우 이를 신고하고, 긴급지원대상자가 신속하게 지원을 받을 수 있도록 노력하여야 하는 자에 해당하지 않는 것은?"],"c":["｢의료법｣에 따른 의료기관의 종사자","｢고등교육법｣에 따른 직원","｢지방공무원법｣에 따른 공무원","｢무형문화재 보전 및 진흥에 관한 법률｣에 따라 지정된국가무형문화재의 보유자","｢사회복지사업법｣에 따른 사회복지시설의 종사자"],"a":4},{"id":"22-3-66","y":2022,"g":3,"n":66,"t":"국민건강보험법·노인장기요양보험법","f":"옳은 것 고르기","s":["국민건강보험법상 건강보험심사평가원의 업무에 해당하는 것은?"],"c":["요양급여의 적정성 평가","가입자의 자격 관리","보험급여의 관리","보험급여 비용의 지급","보험료의 부과ㆍ징수"],"a":1},{"id":"22-3-67","y":2022,"g":3,"n":67,"t":"국민연금법","f":"옳은 것 모두 고르기","s":["국민연금법상 급여의 종류에 해당하는 것을 모두 고른 것은?","ㄱ. 노령연금　　　ㄴ. 장애인연금　　　ㄷ. 장해급여","ㄹ. 장애연금　　　ㅁ. 반환일시금"],"c":["ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㅁ","ㄱ, ㄷ, ㅁ","ㄱ, ㄹ, ㅁ","ㄴ, ㄷ, ㄹ"],"a":4},{"id":"22-3-68","y":2022,"g":3,"n":68,"t":"고용보험법·산업재해보상보험법","f":"옳지 않은 것","s":["산업재해보상보험법의 내용으로 옳지 않은 것은?"],"c":["“업무상의 재해”란 업무상의 사유에 따른 근로자의 부상ㆍ질병ㆍ장해 또는 사망을 말한다.","보험급여에는 간병급여, 상병보상연금, 실업급여 등이 있다.","근로복지공단은 법인으로 한다.","“출퇴근”이란 취업과 관련하여 주거와 취업장소 사이의이동 또는 한 취업장소에서 다른 취업장소로의 이동을 말한다.","요양급여는 근로자가 업무상의 사유로 부상을 당하거나질병에 걸린 경우에 그 근로자에게 지급한다."],"a":2},{"id":"22-3-69","y":2022,"g":3,"n":69,"t":"고용보험법·산업재해보상보험법","f":"옳은 것 고르기","s":["고용보험법의 내용으로 옳은 것은?"],"c":["고용보험기금은 기획재정부장관이 관리ㆍ운용한다.","국가는 매년 보험사업에 드는 비용의 일부를 일반회계에서 부담하여야 한다.","취업촉진 수당의 종류로는 구직급여, 직업능력개발 수당등이 있다.","“실업”이란 근로의 의사와 능력이 없어 취업하지 못한상태에 있는 것을 말한다.","“일용근로자”란 6개월 미만 동안 고용되는 사람을 말한다."],"a":2},{"id":"22-3-70","y":2022,"g":3,"n":70,"t":"국민건강보험법·노인장기요양보험법","f":"옳은 것 고르기","s":["노인장기요양보험법의 내용으로 옳은 것은?"],"c":["장기요양보험사업은 보건복지부장관이 관장한다.","“장기요양급여”란 장기요양등급판정 결과에 따라 1개월이상 동안 혼자서 일상생활을 수행하기 어렵다고 인정되는 자에게 신체활동ㆍ가사활동의 지원 또는 간병 등의 서비스를 말한다.","장기요양기관은 수급자에게 재가급여 또는 시설급여를제공한 경우 시ㆍ도지사에게 장기요양급여비용을 청구하여야 한다.","“노인등”이란 60세 이상의 노인 또는 60세 미만의 자로서 치매ㆍ뇌혈관성질환 등 대통령령으로 정하는 노인성 질병을 가진 자를 말한다.","재가급여에는 방문요양, 방문목욕, 특별현금급여가 있다."],"a":1},{"id":"22-3-71","y":2022,"g":3,"n":71,"t":"가족·여성 관련법(한부모·다문화·가정폭력·성폭력 등)","f":"옳지 않은 것","s":["한부모가족지원법의 내용으로 옳지 않은 것은?"],"c":["“청소년 한부모”란 24세 이하의 모 또는 부를 말한다.","한부모가족의 모 또는 부와 아동은 한부모가족 관련 정책결정과정에 참여할 권리가 있다.","여성가족부장관은 자녀양육비 산정을 위한 자녀양육비가이드라인을 마련하여 법원이 이혼 판결 시 적극 활용할 수 있도록 노력하여야 한다.","국가와 지방자치단체는 청소년 한부모의 건강증진을 위하여 건강진단을 실시할 수 있다.","국가나 지방자치단체는 아동양육비를 대여할 수 있다."],"a":5},{"id":"22-3-72","y":2022,"g":3,"n":72,"t":"노인복지법·장애인복지법·장애인연금법","f":"옳지 않은 것","s":["노인복지법의 내용으로 옳지 않은 것은?"],"c":["노인복지주택 입소자격자는 60세 이상의 노인이다.","보건복지부장관은 요양보호사가 거짓으로 자격증을 취득한 경우 그 자격을 취소하여야 한다.","누구든지 노인학대를 알게 된 때에는 노인보호전문기관또는 수사기관에 신고할 수 있다.","노인일자리전담기관에는 노인인력개발기관, 노인취업알선기관, 노인일자리지원기관이 있다.","지방자치단체는 65세 이상의 자에 대하여 건강진단과 보건교육을 실시할 수 있다."],"a":2},{"id":"22-3-73","y":2022,"g":3,"n":73,"t":"노인복지법·장애인복지법·장애인연금법","f":"옳은 것 고르기","s":["장애인복지법의 내용으로 옳은 것은?"],"c":["｢난민법｣ 제2조 제2호에 따른 난민인정자는 장애인등록을 할 수 있다.","보건복지부장관은 3년마다 장애인정책종합계획을 수립ㆍ시행하여야 한다.","보건복지부장관은 5년마다 장애실태조사를 실시하여야한다.","보건복지부장관은 피해장애인의 임시 보호 및 사회복귀지원을 위하여 장애인 쉼터를 설치ㆍ운영할 수 있다.","장애인복지시설의 장은 장애인 거주시설에서 제공하여야하는 서비스의 최저기준을 마련하여야 한다."],"a":1},{"id":"22-3-74","y":2022,"g":3,"n":74,"t":"아동복지법·영유아보육법·청소년복지지원법","f":"옳은 것 고르기","s":["아동복지법의 내용으로 옳은 것은?"],"c":["시장ㆍ군수ㆍ구청장은 보호조치 중인 보호대상아동의 양육상황을 3년마다 점검하여야 한다.","시ㆍ군ㆍ구에 두는 아동위원은 명예직으로 수당을 지급할 수 없다.","보건복지부장관 소속으로 아동정책조정위원회를 둔다.","아동권리보장원의 장은 아동학대가 종료된 이후에도 아동학대의 재발 여부를 확인하여야 한다.","아동복지시설의 장은 보호하고 있는 12세 이상의 아동을대상으로 자립지원계획을 수립하여야 한다."],"a":4},{"id":"22-3-75","y":2022,"g":3,"n":75,"t":"모금회법·자원봉사활동기본법·사회적경제관련법","f":"옳은 것 고르기","s":["사회복지공동모금회법의 내용으로 옳은 것은?"],"c":["배분분과실행위원회는 위원장 1명을 포함하여 20명 이내의 위원으로 구성한다.","국가나 지방자치단체는 모금회의 관리ㆍ운영에 필요한비용을 보조할 수 있다.","기부금품의 기부자는 배분지역, 배분대상자 또는 사용용도를 지정할 수 없다.","사회복지공동모금회는 언론기관을 모금창구로 지정할 수있으나 지정된 언론기관의 명의로 모금계좌를 개설할 수 없다.","모금회의 정관으로 규정하지 아니한 사항은 ｢민법｣ 중사단법인에 관한 규정을 준용한다."],"a":2},{"id":"23-3-51","y":2023,"g":3,"n":51,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"순서 나열","s":["법률의 제정 연도가 빠른 순서대로 옳게 나열된 것은?","ㄱ. 국민기초생활보장법　　　ㄴ. 산업재해보상보험법","ㄷ. 사회복지사업법　　　　　ㄹ. 고용보험법","ㅁ. 노인복지법"],"c":["ㄱ - ㄴ - ㄷ - ㄹ - ㅁ","ㄴ - ㄱ - ㅁ - ㄷ - ㄹ","ㄴ - ㄷ - ㅁ - ㄹ - ㄱ","ㄷ - ㄱ - ㄹ - ㅁ - ㄴ","ㄷ - ㅁ - ㄴ - ㄹ - ㄱ"],"a":3},{"id":"23-3-52","y":2023,"g":3,"n":52,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"빈칸 채우기","s":["헌법 제34조 규정의 일부이다. ㄱ∼ㄷ에 들어갈 내용으로 옳은 것은?","- 국가는 ( ㄱ )·( ㄴ )의 증진에 노력할 의무를 진다.","- 신체장애자 및 질병·노령 기타의 사유로 생활능력이 없는 국민은 ( ㄷ )이 정하는 바에 의하여 국가의 보호를 받는다."],"c":["ㄱ: 사회보장, ㄴ: 사회복지, ㄷ: 법률","ㄱ: 사회보장, ㄴ: 공공부조, ㄷ: 법률","ㄱ: 사회복지, ㄴ: 공공부조, ㄷ: 헌법","ㄱ: 사회복지, ㄴ: 사회복지서비스, ㄷ: 헌법","ㄱ: 공공부조, ㄴ: 사회복지서비스, ㄷ: 법률"],"a":1},{"id":"23-3-53","y":2023,"g":3,"n":53,"t":"국민연금법","f":"옳은 것 모두 고르기","s":["사회복지법의 역사적 변천에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 2014년 기초노령연금법이 제정되면서 기초연금법은 폐지되었다.","ㄴ. 1999년 제정된 국민의료보험법은 국민건강보험법을 대체한 것이다.","ㄷ. 1973년 제정된 국민복지연금법은 1986년 국민연금법으로 전부개정 되었다."],"c":["ㄱ","ㄴ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ"],"a":3},{"id":"23-3-54","y":2023,"g":3,"n":54,"t":"사회보장기본법·사회보장급여법","f":"옳지 않은 것","s":["사회보장기본법상 국가와 지방자치단체의 사회보장 운영원칙에 관한 설명으로 옳지 않은 것은?"],"c":["사회보험은 지방자치단체의 책임으로 시행하는 것을 원칙으로 한다.","공공부조와 사회서비스는 국가와 지방자치단체의 책임으로 시행하는 것을 원칙으로 한다.","사회보장제도의 급여수준과 비용부담 등에서 형평성을유지하여야 한다.","사회보장제도를 필요로 하는 모든 국민에게 적용하여야한다.","국민의 다양한 복지욕구를 효율적으로 충족시키기 위하여 연계성과 전문성을 높여야 한다."],"a":1},{"id":"23-3-55","y":2023,"g":3,"n":55,"t":"사회보장기본법·사회보장급여법","f":"옳지 않은 것","s":["사회보장기본법상 사회보장수급권에 관한 설명으로 옳지 않은 것은?"],"c":["사회보장급여를 받으려는 사람은 국가나 지방자치단체에신청하는 것을 원칙으로 하고 있다.","사회보장수급권은 다른 사람에게 양도하거나 담보로 제공할 수 없다.","사회보장수급권은 원칙적으로 제한되거나 정지될 수 없다.","사회보장수급권은 구두로 통지하여 포기할 수 있다.","사회보장수급권의 포기는 취소할 수 있다."],"a":4},{"id":"23-3-56","y":2023,"g":3,"n":56,"t":"사회보장기본법·사회보장급여법","f":"사례·제시문 판단","s":["사회보장기본법상 사회보장위원회에 관한 설명으로 옳은 것은?","그 재임기간으로 한다."],"c":["대통령 소속의 위원회이다.","위원장 1명, 부위원장 2명과 행정안전부장관, 고용노동부장관을 포함한 40명 이내의 위원으로 구성한다.","위원의 임기는 3년으로 하되, 공무원인 위원의 임기는","고용노동부에 사무국을 둔다.","관계 중앙행정기관의 장은 위원회의 심의ㆍ조정 사항을반영하여 사회보장제도를 운영 또는 개선하여야 한다."],"a":5},{"id":"23-3-57","y":2023,"g":3,"n":57,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳지 않은 것","s":["자치법규에 관한 설명으로 옳지 않은 것은?"],"c":["지방의회는 규칙 제정권을 갖고 지방자치단체의 장은 조례 제정권을 갖는다.","시ㆍ군 및 자치구의 조례는 시ㆍ도의 조례를 위반해서는아니 된다.","사회복지시설의 설치ㆍ운영 및 관리는 주민의 복지증진과 관련된 지방자치단체의 사무이다.","지방자치단체는 법령의 범위안에서 자치에 관한 규정을제정할 수 있다.","주민은 지방자치단체의 조례를 제정할 것을 청구할 수있다."],"a":1},{"id":"23-3-58","y":2023,"g":3,"n":58,"t":"사회보장기본법·사회보장급여법","f":"옳은 것 고르기","s":["사회보장급여의 이용ㆍ제공 및 수급권자의 발굴에 관한 법률의 내용으로 옳은 것은?"],"c":["시장ㆍ군수ㆍ구청장은 중앙생활보장위원회를 둔다.","보건복지부장관은 사회보장급여 부정수급 실태조사를 3년마다 실시하고 그 결과를 공개하여야 한다.","“수급권자”란 사회보장급여를 제공하는 국가기관과 지방자치단체를 말한다.","보장기관의 업무담당자는 지원대상자가 심신미약 등 대통령령으로 정하는 경우에 해당하면 지원대상자의 동의하에서만 직권으로 사회보장급여의 제공을 신청할 수 있다.","보장기관의 장은 지원대상자 발굴체계의 운영 실태를 3년마다 점검하고 개선방안을 마련하여야 한다."],"a":2},{"id":"23-3-59","y":2023,"g":3,"n":59,"t":"사회복지사업법","f":"옳지 않은 것","s":["사회복지사업법상 사회복지서비스 제공의 원칙에 관한 설명으로 옳지 않은 것은?"],"c":["사회복지서비스는 현물로 제공하는 것이 원칙이다.","지방자치단체는 사회복지서비스의 품질향상을 위하여 필요한 시책을 마련하여야 한다.","지방자치단체는 사회복지시설의 서비스 환경 등을 평가할 수 있다.","시장ㆍ군수ㆍ구청장은 보호대상자에게 사회복지서비스이용권을 지급할 수 있다.","보건복지부장관은 사회복지서비스 품질 평가를 위한 전문기관을 직접 설치ㆍ운영해야 하며, 관계기관 등에 위탁하여서는 아니 된다."],"a":5},{"id":"23-3-60","y":2023,"g":3,"n":60,"t":"사회복지사업법","f":"옳지 않은 것","s":["사회복지사업법상 사회복지사에 관한 설명으로 옳지 않은 것은?"],"c":["사회복지사의 등급은 1급ㆍ2급으로 한다.","보건복지부장관은 정신건강사회복지사ㆍ의료사회복지사ㆍ학교사회복지사의 자격을 부여할 수 있다.","보건복지부장관은 사회복지사가 거짓이나 그 밖의 부정한 방법으로 자격을 취득한 경우 그 자격을 1년의 범위에서 정지할 수 있다.","사회복지법인에 종사하는 사회복지사는 정기적으로 보수교육을 받아야 한다.","자신의 사회복지사 자격증은 타인에게 빌려주어서는 아니 된다."],"a":3},{"id":"23-3-61","y":2023,"g":3,"n":61,"t":"사회복지사업법","f":"옳은 것 고르기","s":["사회복지사업법상 사회복지시설에 관한 설명으로 옳은 것은?"],"c":["사회복지시설 운영위원회는 심의ㆍ의결기구이다.","사회복지시설은 손해배상책임의 면책사업자이다.","사회복지시설의 장은 비상근으로 근무할 수 있다.","사회복지시설은 둘 이상의 사회복지사업을 통합하여 수행할 수 있다.","지방자치단체는 사회복지시설을 설치ㆍ운영하여서는 아니 된다."],"a":4},{"id":"23-3-62","y":2023,"g":3,"n":62,"t":"국민기초생활보장법","f":"옳은 것 고르기","s":["국민기초생활 보장법상 급여의 종류와 방법에 관한 설명으로 옳은 것은?"],"c":["부양의무자가 ｢병역법｣에 따라 징집되거나 소집된 경우부양능력이 있는 것으로 본다.","보장기관은 차상위자의 가구별 생활여건을 고려하여 예산의 범위에서 급여의 전부 또는 일부를 실시할 수 있다.","생계급여 선정기준은 기준 중위소득의 100분의 50 이상으로 한다.","생계급여는 상반기ㆍ하반기로 나누어 지급하여야 한다.","주거급여는 주택 매입비, 수선유지비 등이 포함된다."],"a":2},{"id":"23-3-63","y":2023,"g":3,"n":63,"t":"국민기초생활보장법","f":"옳은 것 모두 고르기","s":["국민기초생활 보장법상 급여의 기본원칙을 모두 고른 것은?","ㄱ. 근로능력 활용　　　　　　ㄴ. 보충급여","ㄷ. 타법 우선　　　　　　　　ㄹ. 수익자부담"],"c":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"23-3-64","y":2023,"g":3,"n":64,"t":"의료급여법·긴급복지지원법·기초연금법","f":"옳은 것 모두 고르기","s":["긴급복지지원법상 “위기상황”에 해당하는 사유를 모두 고른 것은?","ㄱ. 주소득자가 사망, 가출, 행방불명 등으로 소득을 상실하여 생계유지가 어렵게 된 경우","ㄴ. 본인이 중한 질병 또는 부상을 당하여 생계유지가 어렵게 된 경우","ㄷ. 본인이 가구구성원으로부터 방임 등을 당하여 생계유지가 어렵게 된 경우","ㄹ. 본인이 가구구성원으로부터 성폭력을 당하여 생계유지가 어렵게 된 경우"],"c":["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"23-3-65","y":2023,"g":3,"n":65,"t":"가족·여성 관련법(한부모·다문화·가정폭력·성폭력 등)","f":"옳지 않은 것","s":["건강가정기본법에 관한 설명으로 옳지 않은 것은?"],"c":["“가족”이라 함은 혼인ㆍ혈연ㆍ입양으로 이루어진 사회의기본단위를 말한다.","모든 국민은 혼인과 출산의 사회적 중요성을 인식하여야한다.","“1인가구”라 함은 성인 1명 또는 그와 생계를 같이하는미성년자녀로 구성된 생활단위를 말한다.","국가는 양성이 평등한 육아휴직제 등의 정책을 적극적으로 확대 시행하여야 한다.","국가는 생애주기에 따르는 가족구성원의 종합적인 건강증진대책을 마련하여야 한다."],"a":3},{"id":"23-3-66","y":2023,"g":3,"n":66,"t":"사회복지사업법","f":"옳은 것 고르기","s":["사회복지사업법령상 보건복지부장관이 시설에서 제공하는 서비스의 최저기준을 마련하지 않아도 되는 시설은?"],"c":["사회복지관","자원봉사센터","아동양육시설","장애인 지역사회재활시설","부자가족복지시설"],"a":2},{"id":"23-3-67","y":2023,"g":3,"n":67,"t":"국민기초생활보장법","f":"옳은 것 고르기","s":["국민기초생활 보장법상 보장기관에 관한 설명으로 옳은 것은?"],"c":["교육급여 및 의료급여는 시ㆍ도교육감이 실시한다.","생계급여는 수급자의 거주지를 관할하는 시ㆍ도지사와시장ㆍ군수ㆍ구청장이 실시한다.","보장기관은 위기개입상담원을 배치하여야 한다.","생활보장위원회는 자문기구이다.","소관 중앙행정기관의 장은 5년마다 기초생활보장 시행계획을 수립하여야 한다."],"a":2},{"id":"23-3-68","y":2023,"g":3,"n":68,"t":"고용보험법·산업재해보상보험법","f":"옳은 것 모두 고르기","s":["고용보험법령상 중대한 귀책사유로 해고된 피보험자로서 구직급여 수급자격의 제한사유에 해당되는 것을 모두 고른 것은?","ㄱ. 「형법」을 위반하여 금고 이상의 형을 선고받은 경우","ㄴ. 정당한 사유 없이 근로계약을 위반하여 장기간 무단 결근한 경우","ㄷ. 사업기밀을 경쟁관계에 있는 사업자에게 제공한 경우"],"c":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":5},{"id":"23-3-69","y":2023,"g":3,"n":69,"t":"고용보험법·산업재해보상보험법","f":"옳지 않은 것","s":["산업재해보상보험법령상 유족급여에 관한 설명으로 옳지 않은 것은?"],"c":["근로자가 업무상의 사유로 사망한 경우 유족에게 지급한다.","유족보상연금 수급권자가 2명 이상 있을 때 그 중 1명을대표자로 선임할 수 있다.","근로자와 ｢주민등록법｣상 세대를 같이 하고 동거하던 유족으로서 근로자의 소득으로 생계의 상당 부분을 유지하고 있던 사람은 유
