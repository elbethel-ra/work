","갈등이론"],"a":3},{"id":"19-2-59","y":2019,"g":2,"n":59,"t":"지역사회복지 역사·정책동향","f":"옳지 않은 것","s":["지역사회복지운동에 관한 설명으로 옳지 않은 것은?"],"c":["지역사회복지서비스 제공기관의 주도성을 강화하기 위해필요하다.","지역주민, 지역사회활동가, 사회복지전문가 등이 운동의주체가 될 수 있다.","지역사회문제를 해결하기 위한 목적지향성을 가진다.","국민기초생활보장법 시행 이후 자활후견기관(지역자활센터)이 설치ㆍ운영되어 자활운동이 공적전달체계에 편입되었다.","지역주민의 삶의 질과 관련된 생활영역을 포함한다."],"a":1},{"id":"19-2-60","y":2019,"g":2,"n":60,"t":"실천기술·사회복지사 역할","f":"사례·제시문 판단","s":["다음 설명에 해당하는 지역사회복지 실천기술은?","A사회복지사는 지역사회 내 저소득 장애인의 취업문제를 해결하는 과정에서 당사자들이 문제의식을 갖게 하고, 그들 스스로 문제해결능력을 향상시키기 위해 노력하였다."],"c":["중개","연계","옹호","조직화","자원개발"],"a":4},{"id":"19-2-61","y":2019,"g":2,"n":61,"t":"실천과정·욕구사정","f":"사례·제시문 판단","s":["다음에 제시된 지역사회 욕구사정 방법은?","- 지역사회문제에 대한 전문지식을 갖고 있는 주요 정보제공자 구성","- 응답 내용이 합의에 이르기까지 여러 번에 걸쳐 설문 과정 반복","- 설문구성은 개방형으로 시작해서 이후에는 유사한 응답내용을 폐쇄형으로 구성하여 질문"],"c":["델파이기법","초점집단기법","공청회","지역포럼기법","사회지표분석"],"a":1},{"id":"19-2-62","y":2019,"g":2,"n":62,"t":"실천기술·사회복지사 역할","f":"옳지 않은 것","s":["지역사회복지실천에서 연계기술(networking)에 관한 설명으로 옳지 않은 것은?","행"],"c":["사회복지기관의 서비스 제공과정에서 효율성 증대","사회복지사의 연계망 강화 및 확장","이용자 중심의 통합적 서비스 제공","서비스 계획의 공동 수립과 서비스 제공에서 팀 접근 수","지역사회 복지의제 개발과 주민 의식화"],"a":5},{"id":"19-2-63","y":2019,"g":2,"n":63,"t":"실천과정·욕구사정","f":"옳지 않은 것","s":["지역사회복지 실천과정에 관한 설명으로 옳지 않은 것은?"],"c":["지역사회문제해결 과정으로 볼 수 있다.","문제발견은 다양한 정보수집과 자료수집과정을 통해 이루어진다.","문제를 어떻게 개념화하느냐에 따라 해결방안과 실천전략이 달라진다.","총괄평가는 프로그램 수행과정 중에 실시되어 프로그램의 문제점을 관찰ㆍ수정하는데 유용하다.","정책목표를 수립할 때 실현가능성을 고려할 필요가 있다."],"a":4},{"id":"19-2-64","y":2019,"g":2,"n":64,"t":"실천기술·사회복지사 역할","f":"사례·제시문 판단","s":["다음이 설명하는 지역사회복지 실천기술은?","A지방자치단체가 별도의 조치를 해줄 것을 요청하기 위해 다수인의 서명지를 전달하는 활동"],"c":["설득","청원","의뢰","지역사회교육","정보제공"],"a":2},{"id":"19-2-65","y":2019,"g":2,"n":65,"t":"실천기술·사회복지사 역할","f":"옳은 것 모두 고르기","s":["지역사회복지실천에서 조력자의 역할로 옳은 것을 모두 고른 것은?","ㄱ. 지역사회 내 다양한 집단들에 의해 표출된 불만의 집약","ㄴ. 지역사회문제의 조사 및 평가","ㄷ. 지역사회 내 불이익을 당하는 주민의 옹호와 대변","ㄹ. 지역사회조직 과정에서 지역주민들에게 공동의 목표 강조"],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"a":3},{"id":"19-2-66","y":2019,"g":2,"n":66,"t":"실천과정·욕구사정","f":"사례·제시문 판단","s":["다음 설명은 아른스테인(S. Arnstein)이 분류한 주민참여단계 중 어디에 해당되는가?","- 행정기관과 주민이 서로 간의 관계 확인","- 행정기관이 일방적으로 주민들을 교육, 설득시키고 주민은 단순히 참여하는 수준","- 주민참여에서 권력분배정도가 가장 낮은 수준"],"c":["주민회유(placation)","협동관계(partnership)","정보제공(informing)","권한위임(delegated power)","조작(manipulation)"],"a":5},{"id":"19-2-67","y":2019,"g":2,"n":67,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳은 것 고르기","s":["지역사회보장협의체의 구성 조직 및 역할을 적절하게 연결하고 있는 것은?"],"c":["대표협의체: 통합사례관리 지원","실무협의체: 지역사회보장계획의 의회 보고","실무분과: 사회복지법인 이사의 추천과 선임 조정","실무분과: 지역사회보장계획의 연차별 시행계획 모니터링","읍ㆍ면ㆍ동 지역사회보장협의체: 실무협의체 업무 지원"],"a":4},{"id":"19-2-68","y":2019,"g":2,"n":68,"t":"실천과정·욕구사정","f":"순서 나열","s":["지역사회보장계획의 수립 과정을 순서대로 옳게 나열한 것은?","ㄱ. 세부사업 계획 수립","ㄴ. 지역사회보장협의체 심의","ㄷ. 지역사회보장조사","ㄹ. 행·재정계획 수립","ㅁ. 의회 보고","ㅂ. 추진 비전 및 목표 수립"],"c":["ㄱ - ㄴ - ㅁ - ㄹ - ㅂ - ㄷ","ㄴ - ㄹ - ㄱ - ㅁ - ㅂ - ㄷ","ㄷ - ㄹ - ㅂ - ㄱ - ㄴ - ㅁ","ㄷ - ㅂ - ㄹ - ㄱ - ㄴ - ㅁ","ㄷ - ㅂ - ㄱ - ㄹ - ㄴ - ㅁ"],"a":5},{"id":"19-2-69","y":2019,"g":2,"n":69,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳은 것 고르기","s":["시ㆍ군ㆍ구 지역사회보장계획의 내용에 포함될 수 없는 것은?"],"c":["지역사회보장의 수요 측정 내용","지역사회보장의 중점 추진사업 및 연계협력 방안","지역사회보장 전달체계의 조직과 운영","사회보장급여의 사각지대 발굴 및 지원 방안","기초지방자치단체 간 사회보장의 균형 발전 노력"],"a":5},{"id":"19-2-70","y":2019,"g":2,"n":70,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳은 것 고르기","s":["읍ㆍ면ㆍ동 지역사회보장협의체의 역할로 볼 수 없는 것은?"],"c":["복지대상자 발굴","지역특화사업 추진","지역자원의 발굴 및 연계","지역인적안전망 구축","지역사회보장지표의 생성"],"a":5},{"id":"19-2-71","y":2019,"g":2,"n":71,"t":"실천과정·욕구사정","f":"옳지 않은 것","s":["자원 동원 기관에 관한 설명으로 옳지 않은 것은?"],"c":["사회복지공동모금회의 신청사업은 프로그램사업과 긴급지원사업으로 나누어 공모형태로 진행된다.","기업의 사회공헌센터를 통한 기여 형태는 현금, 물품, 인력 등으로 다양하다.","기부식품등 제공사업은 이용자에게 기초푸드뱅크ㆍ마켓을 통해 기부물품을 제공하고 있다.","자원봉사센터는 자원봉사활동기본법에 근거하여 자원봉사자를 양성ㆍ배치하는 역할을 수행한다.","사회복지공동모금회는 노블레스 오블리주 실천을 위한아너 소사이어티(honor society)를 운영하고 있다."],"a":1},{"id":"19-2-72","y":2019,"g":2,"n":72,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳지 않은 것","s":["사회적 경제 영역에 관한 설명으로 옳지 않은 것은?","호혜적 경제활동조직이다."],"c":["협동조합은 협동조합기본법에 따라 조합원의 권익옹호와지역사회에 공헌하는 사업조직을 말한다.","마을기업은 주민이 지역자원을 활용한 수익사업을 통해지역공동체를 활성화한다.","사회적 기업은 취약계층에게 일자리를 제공하며 사회적기업육성법에 따라 영리를 추구하지 않는다.","자활기업은 저소득층이 상호 협력하여 공동사업자의 형태로 탈빈곤을 도모한다.","사회적 경제는 사회적 목적과 민주적 운영 원리를 가진"],"a":3},{"id":"19-2-73","y":2019,"g":2,"n":73,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳은 것 고르기","s":["사회복지협의회에 관한 설명으로 옳은 것은?"],"c":["읍ㆍ면ㆍ동 중심의 공공부문 전달체계와 지역사회보호체계를 구축하고 운영한다.","관계법령에 따라 10명 이상 40명 이하의 규모로 위원회를 구성해야 한다.","시ㆍ군ㆍ구 단위에 의무적으로 설치하여야 한다.","사회복지시설 및 기관 중심의 지역사회복지 증진을 위한법정단체이다.","사회보장급여의 이용ㆍ제공 및 수급권자 발굴에 관한 법률에 근거하여 설립된다."],"a":4},{"id":"19-2-74","y":2019,"g":2,"n":74,"t":"실천과정·욕구사정","f":"순서 나열","s":["다음 사례의 ㄱ, ㄴ과 관련한 사회복지관의 역할을 순서대로 옳게 나열한 것은?","ㄱ. A종합사회복지관은 인근 독거노인의 복합적이고 장기적인 욕구를 사정하고 통합적인 서비스 제공 및 점검계획을 수립하였다.","ㄴ. 이후 독거노인의 생활을 지원하기 위해 주민봉사단을 조직하며 정기적인 가정방문을 실시하고 있다."],"c":["지역사회보호, 주민조직화","사례개입, 당사자 교육","서비스 연계, 자원 개발 및 관리","서비스 제공, 복지네트워크 구축","사례관리, 주민조직화"],"a":5},{"id":"19-2-75","y":2019,"g":2,"n":75,"t":"지역사회복지 역사·정책동향","f":"옳지 않은 것","s":["최근 공공 사회복지전달체계가 읍ㆍ면ㆍ동 중심으로 개편됨에 따라 나타난 현상이 아닌 것은?"],"c":["찾아가는 보건ㆍ복지서비스 확대","읍ㆍ면ㆍ동에서 통합사례관리 직접 수행","사회보장정보시스템(행복e음) 개시","복지ㆍ보건ㆍ고용 연계 등 통합서비스 강화","지역인적안전망 구성의 활성화"],"a":3},{"id":"20-2-51","y":2020,"g":2,"n":51,"t":"지역사회복지 역사·정책동향","f":"옳은 것 고르기","s":["지역사회복지에 관한 내용으로 옳은 것은?"],"c":["UN 지역사회개발 원칙은 정부의 적극적 지원을 받는 것이 아니라 민간 자원동원을 강조하였다.","던햄(A. Dunham)은 사회복지기관은 조직운영과 실천을민주적으로 해야 한다고 하였다.","로스(M. G. Ross)는 추진회 활동 초기에는 소수집단을위한 사업부터 전개하는 것이 좋다고 하였다.","맥닐(C. F. McNeil)은 지역사회도 자기결정의 권리가 있어 자발적인 사업추진은 거부해야 한다고 하였다.","워렌(R. L. Warren)은 지역사회조직사업의 주요 목적은지역사회이익 옹호, 폭넓은 권력집중이라고 하였다."],"a":2},{"id":"20-2-52","y":2020,"g":2,"n":52,"t":"지역사회 개념·유형·기능","f":"옳지 않은 것","s":["지역사회에 관한 설명으로 옳지 않은 것은?"],"c":["지역사회에 대한 정의나 구분은 학자에 따라 매우 다양하다.","현대의 지역사회는 지리적 개념을 넘어 기능적 개념까지포괄하는 추세이다.","지역사회를 상호의존적인 집단들의 결합체로도 볼 수 있다.","펠린(P. F. Fellin)은 역량있는 지역사회를 바람직한 지역사회로 보았다.","로스(M. G. Ross)는 지역사회의 기능을 사회통제, 사회통합 등 다섯 가지로 구분하였다."],"a":5},{"id":"20-2-53","y":2020,"g":2,"n":53,"t":"지역사회복지 역사·정책동향","f":"옳은 것 고르기","s":["한국 지역사회복지 역사에 관한 설명으로 옳은 것은?"],"c":["2001년 국민기초생활보장제도 시행으로 정부의 책임성강화","2007년 「협동조합기본법」의 제정으로 자활공동체가보다 쉽게 협동조합을 결성할 수 있게 됨" 회적행동 모형","연합 모형","사회운동 모형"],"a":1},{"id":"21-2-56","y":2021,"g":2,"n":56,"t":"지역사회복지 역사·정책동향","f":"옳지 않은 것","s":["던햄(A. Dunham)의 지역사회유형 구분과 예시의 연결로 옳지 않은 것은?"],"c":["인구 크기 - 대도시, 중ㆍ소도시 등","산업구조 및 경제적 기반 - 농촌, 어촌, 산업단지 등","연대성 수준 - 기계적연대 지역, 유기적연대 지역 등","행정구역 - 특별시, 광역시ㆍ도, 시ㆍ군ㆍ구 등","인구 구성의 사회적 특수성 - 쪽방촌, 외국인 밀집지역등"],"a":3},{"id":"21-2-57","y":2021,"g":2,"n":57,"t":"지역사회복지 역사·정책동향","f":"사례·제시문 판단","s":["영국의 지역사회복지 역사에 관한 설명으로 옳은 것은?","노력하였다."],"c":["헐 하우스(Hull House)는 빈민들의 도덕성 향상을 위해","우애방문단은 기존 사회질서를 비판하고 개혁을 주장하였다.","인보관 이념은 우애방문단 활동의 기반이 되었다.","1960년대 존슨행정부는 '빈곤과의 전쟁'을 선포하고 다양한 지역사회 개혁을 단행하였다.","1980년대 그리피스(E. Griffiths) 보고서는 복지 주체의다원화에 영향을 미쳤다."],"a":5},{"id":"21-2-58","y":2021,"g":2,"n":58,"t":"실천모델(로스만·웨일과 갬블·테일러와 로버츠)","f":"옳은 것 모두 고르기","s":["공식 사회복지조직과 주민조직을 네 가지 차원에서 비교ㆍ제시하였다. 다음에서 옳은 것을 모두 고른 것은?","| | 차원 | 공식 사회복지조직 | 주민조직 |","|---|---|---|---|","| ㄱ | 목표 | 조직의 미션달성 | 지역사회 문제해결 |","| ㄴ | 지역사회개입모델 | 사회행동모델이 주로 쓰임 | 사회계획모델이 주로 쓰임 |","| ㄷ | 정부통제로부터의 자율성 | 상대적으로 높음 | 상대적으로 낮음 |","| ㄹ | 주요 참여자 | 사회복지사 등의 전문직 | 일반주민 |"],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":3},{"id":"21-2-59","y":2021,"g":2,"n":59,"t":"실천기술·사회복지사 역할","f":"옳지 않은 것","s":["지역사회복지실천에서 옹호(advocacy)활동에 해당하지 않는 것은?"],"c":["지역사회 내 복지자원을 조정하고 연계한다.","시의원 등에게 정치적 압력을 행사한다.","피케팅으로 해당 기관을 난처하게 한다.","행정기관에 증언 청취를 요청한다.","지역주민으로부터 탄원서에 서명을 받는다."],"a":1},{"id":"21-2-60","y":2021,"g":2,"n":60,"t":"실천과정·욕구사정","f":"사례·제시문 판단","s":["다음 자료를 활용한 지역사회 사정(assessment) 유형에 해당하는 것은?","- 사회복지시설 및 기관의 자원봉사자 수","- 관할 지방자치단체의 사회복지분야 예산 규모","- 기업의 사회공헌 프로그램 유형과 이용자 수"],"c":["하위체계 사정","포괄적 사정","자원 사정","문제중심 사정","협력적 사정"],"a":3},{"id":"21-2-61","y":2021,"g":2,"n":61,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"사례·제시문 판단","s":["다음 사례에 해당하는 지역사회복지 실천모형은?","행복사회복지관은 지역 내 노인, 장애인, 아동을 위해 주민 스스로 돌봄과 자원봉사활동을 활성화하도록 자조모임 지원 등 사회적 관계망을 확충하였다."],"c":["M.Weil &D. Gamble의 연합 모형","J. Rothman의 합리적계획 모형","K. Popple의 커뮤니티케어 모형","J. Rothman의 연대조직 모형","M.Weil &D. Gamble의 기능적 지역조직 모형"],"a":3},{"id":"21-2-62","y":2021,"g":2,"n":62,"t":"실천기술·사회복지사 역할","f":"사례·제시문 판단","s":["다음에서 설명하고 있는 지역사회복지실천 기술은?","지역주민의 강점을 인정하고 스스로 삶을 결정할 수 있도록 역량을 강화하며, 지역구성원의 능력에 대한 신념을 중요시 한다."],"c":["임파워먼트","자원개발과 동원","조직화","네트워크","지역사회연계"],"a":1},{"id":"21-2-63","y":2021,"g":2,"n":63,"t":"실천기술·사회복지사 역할","f":"옳지 않은 것","s":["네트워크 기술의 특성으로 옳지 않은 것은?"],"c":["자원의 효율적 관리","사회정의 준수 및 유지","서비스의 중복과 누락 방지","참여를 통한 시민 연대의식 강화","지역주민에게 필요한 자원이나 서비스 연결"],"a":2},{"id":"21-2-64","y":2021,"g":2,"n":64,"t":"실천과정·욕구사정","f":"사례·제시문 판단","s":["지역사회복지 실천 과정에서 사회복지사가 활용한 기술은?","사회복지사A는 가족캠핑을 희망하는 한부모 가족 10세대를 대상으로 프로그램을 계획하고 있다. A는 개인적으로 참여하고 있는 수영 클럽을 통해 프로그램 운영에 필요한 예산과 자원봉사자를 확보하고자 운영진에게 모임 개최를 요청하였고, 성공적인 결과를 얻었다."],"c":["옹호","조직화","임파워먼트","지역사회교육","자원개발 및 동원"],"a":5},{"id":"21-2-65","y":2021,"g":2,"n":65,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳지 않은 것","s":["지방분권에 관한 설명으로 옳지 않은 것은?"],"c":["주민참여 기회가 확대된다.","중앙정부의 책임성이 강화된다.","지역 특성에 맞는 정책을 수립할 수 있다.","지역 간 복지수준의 격차가 발생할 수 있다.","지방자치단체의 역할과 책임을 강화시킬 수 있다."],"a":2},{"id":"21-2-66","y":2021,"g":2,"n":66,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳지 않은 것","s":["지방자치제에 관한 설명으로 옳지 않은 것은?"],"c":["민주주의 사상에 기초를 두고 있다.","지방자치단체의 장은 선거로 선출한다.","지역문제에 대한 자기통치 원리를 담고 있다.","우리나라에서는 1990년에 처음으로 실시되었다.","지방자치단체의 행정사무가 주민참여에 의해 이루어져야한다."],"a":4},{"id":"21-2-67","y":2021,"g":2,"n":67,"t":"실천과정·욕구사정","f":"사례·제시문 판단","s":["지역사회보장계획에 관한 설명으로 옳은 것은?","한다."],"c":["시ㆍ군ㆍ구 지역사회보장계획은 변경할 수 없다.","사회보장에 관한 기본계획과 연계되도록 하여야 한다.","3년마다 수립하고, 매년 연차별 시행계획을 수립하여야","시ㆍ군ㆍ구 지역사회보장계획은 사회보장위원회의 심의를 거쳐야 한다.","지역사회보장계획의 평가, 지원 등을 위한 지역사회보장지원센터를 설치ㆍ운영할 수 있다."],"a":2},{"id":"21-2-68","y":2021,"g":2,"n":68,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳은 것 고르기","s":["지역사회보장협의체에 관한 설명으로 옳은 것은?"],"c":["사회복지사업법에 법적 근거를 두고 있다.","10명 이상 25명 이하의 위원으로 구성하고, 임기는 2년이다.","관할 지역의 사회복지사업에 관한 중요사항을 심의ㆍ건의한다.","민ㆍ관 네트워크를 통한 지역복지 거버넌스 구조와 기능을 축소시킨다.","실무협의체, 실무분과, 읍ㆍ면ㆍ동 협의체 간 수평적 네트워크 관계를 형성한다."],"a":5},{"id":"21-2-69","y":2021,"g":2,"n":69,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳지 않은 것","s":["다음 사회복지관에 관한 설명으로 옳지 않은 것은?","행복시(市)에서 직영하고 있는 A사회복지관은 노인, 장애인 등 취약계층의 욕구 충족과 사회적 지지체계 구축을 위한 자원봉사 프로그램을 개발하였고, 이를 심의하기 위해 운영위원회를 개최하였다."],"c":["운영위원회는 프로그램 개발, 평가에 관한 사항을 심의한다.","자원봉사자 개발ㆍ관리는 지역조직화 기능에 해당한다.","취약계층 주민에게 우선적인 서비스를 제공하여야 한다.","운영위원회는 5명 이상 15명 이하의 위원으로 구성한다.","사회복지법인, 기타 비영리법인에 한하여 설치ㆍ운영할수 있다."],"a":5},{"id":"21-2-70","y":2021,"g":2,"n":70,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳지 않은 것","s":["사회복지협의회에 관한 설명으로 옳지 않은 것은?"],"c":["사회복지사업법에 근거를 둔 법정단체이다.","민ㆍ관 협력을 위해 시ㆍ군ㆍ구에 설치된 공공기관이다.","한국사회복지협의회는 기타 공공기관으로 지정되었다.","사회복지기관 간 연계ㆍ협력ㆍ조정 등의 업무를 수행한다.","광역 및 지역 단위 사회복지협의회는 독립적인 사회복지법인이다."],"a":2},{"id":"21-2-71","y":2021,"g":2,"n":71,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳지 않은 것","s":["사회복지공동모금회에 관한 설명으로 옳지 않은 것은?"],"c":["기획, 홍보, 모금, 배분 업무를 수행한다.","사회복지사업법에 의한 사회복지법인이다.","지정기부금 모금단체이다.","사회복지 프로그램의 전문성 제고에 기여할 수 있다.","지역사회의 자원을 동원하는 민간운동적인 특성이 있다."],"a":3},{"id":"21-2-72","y":2021,"g":2,"n":72,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳은 것 모두 고르기","s":["사회적 경제 주체에 해당하는 것을 모두 고른 것은?","ㄱ. 사회적 기업　　　　ㄴ. 마을기업","ㄷ. 사회적 협동조합　　ㄹ. 자활기업"],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"21-2-73","y":2021,"g":2,"n":73,"t":"지역사회복지 역사·정책동향","f":"옳은 것 고르기","s":["지역사회복지운동에 관한 설명으로 옳은 것은?"],"c":["계획되지 않은 조직적 활동이다.","사회복지 전문가 중심의 활동이다.","개인의 성장과 변화에 우선적인 초점을 둔다.","노동자, 장애인 등 일부 주민을 대상으로 한다.","복지권리ㆍ시민의식을 배양하는 사회권 확립운동이다."],"a":5},{"id":"21-2-74","y":2021,"g":2,"n":74,"t":"실천과정·욕구사정","f":"사례·제시문 판단","s":["다음 사례에서 설명하는 아른스테인(S. Arnstein)의 주민참여 수준은?","A시(市)는 도시재생사업과 관련하여 주민들과 갈등을 겪고 있다. B씨는 A시의 추천으로 도시재생사업 추진위원회에 주민대표로 참여하였다. 하지만 회의는 B씨의 기대와는 달리 A시가 의도한 방향대로 최종 결정되었다."],"c":["조작","회유","주민통제","권한위임","정보제공"],"a":2},{"id":"21-2-75","y":2021,"g":2,"n":75,"t":"지역사회복지 역사·정책동향","f":"순서 나열","s":["최근 지역사회복지의 변화과정을 순서대로 옳게 나열한 것은?","ㄱ. 사회서비스원 시범사업","ㄴ. 희망복지지원단 운영","ㄷ. 사회복지통합관리망(행복e음) 구축","ㄹ. 찾아가는 보건복지서비스"],"c":["ㄱ - ㄴ - ㄷ – ㄹ","ㄴ - ㄷ - ㄱ – ㄹ","ㄴ - ㄷ - ㄹ - ㄱ","ㄷ - ㄴ - ㄹ – ㄱ","ㄷ - ㄹ - ㄴ – ㄱ"],"a":4},{"id":"22-2-51","y":2022,"g":2,"n":51,"t":"지역사회복지 역사·정책동향","f":"사례·제시문 판단","s":["다음은 워렌(R. Warren)이 제시한 지역사회 비교척도 중 어느 것에 해당하는가?","지역사회 내 정을 중요하게 여긴다.","이해관계의 대립을 불평등한 분배로 설명한다."],"a":5},{"id":"23-2-56","y":2023,"g":2,"n":56,"t":"지역사회복지 이론","f":"사례·제시문 판단","s":["다음 A지역의 변화를 분석하기 위한 지역사회복지 실천이론은?","A지역은 외국인 노동자의 유입으로 특정 국적의 외국인 주거 공동체가 형성되기 시작하면서 주민 간 갈등이 발생하였다."],"c":["생태학이론","사회학습이론","엘리트주의이론","교환이론","다원주의이론"],"a":1},{"id":"23-2-57","y":2023,"g":2,"n":57,"t":"지역사회복지 이론","f":"옳은 것 모두 고르기","s":["지역사회복지를 권력의존이론의 관점에서 설명한 것을 모두 고른 것은?","ㄱ. 장애인 편의시설 설치를 위해 다양한 장애인 단체가 의사결정에 참여하도록 한다.","ㄴ. 노인복지관은 은퇴 노인의 재능을 활용한 봉사활동을 기획한다.","ㄷ. 사회복지관은 지방정부로부터 보조금 집행에 대한 지도점검을 받았다."],"c":["ㄱ","ㄷ","ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":2},{"id":"23-2-58","y":2023,"g":2,"n":58,"t":"실천과정·욕구사정","f":"옳지 않은 것","s":["지역사회복지실천의 원칙으로 옳지 않은 것은?"],"c":["지역사회 기관 간 협력관계 구축","지역사회 특성을 반영한 계획 수립","지역사회 문제 인식의 획일화","욕구 가변성에 따른 실천과정의 변화 이해","지역사회 변화에 초점을 둔 개입"],"a":3},{"id":"23-2-59","y":2023,"g":2,"n":59,"t":"실천모델(로스만·웨일과 갬블·테일러와 로버츠)","f":"사례·제시문 판단","s":["다음에서 설명하는 웨일과 갬블(M. Weil &D. Gamble)의 지역사회복지 실천모델은?","- 공통 관심사나 특정 이슈에 대한 정책, 행위, 인식의 변화에 초점","- 일반대중 및 정부기관을 변화의 표적체계로 파악","- 조직가, 촉진자, 옹호자, 정보전달자를 사회복지사의 주요 역할로 인식"],"c":["사회계획","기능적 지역사회조직","프로그램 개발과 지역사회 연계","연합","정치사회행동"],"a":2},{"id":"23-2-60","y":2023,"g":2,"n":60,"t":"실천모델(로스만·웨일과 갬블·테일러와 로버츠)","f":"옳은 것 모두 고르기","s":["로스만(J. Rothman)의 지역사회복지 실천모델에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 지역사회개발모델은 지역사회 구성원의 조직화를 주요 실천과정으로 본다.","ㄴ. 지역사회개발모델의 변화 매개체는 공식적 조직과 객관적 자료이다.","ㄷ. 사회계획모델에서 사회복지사의 핵심 역할은 협상가, 옹호자이다.","ㄹ. 사회행동모델에서는 지역사회 내 집단들이 갈등관계로 인해 타협과 조정이 어렵다고 본다."],"c":["ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ"],"a":2},{"id":"23-2-61","y":2023,"g":2,"n":61,"t":"실천모델(로스만·웨일과 갬블·테일러와 로버츠)","f":"옳지 않은 것","s":["테일러와 로버츠(S. Taylor &R. Roberts)의 지역사회복지 실천모델에 관한 설명으로 옳지 않은 것은?"],"c":["프로그램 개발과 조정: 지역주민의 역량강화 및 지도력개발에 관심","계획: 구체적 조사전략 및 기술 강조","지역사회연계: 지역사회 문제해결을 위한 관계망 구축강조","지역사회개발: 지역주민의 참여와 자조 중시","정치적 역량강화: 상대적으로 권력이 약한 시민의 권한강화에 관심"],"a":1},{"id":"23-2-62","y":2023,"g":2,"n":62,"t":"실천과정·욕구사정","f":"사례·제시문 판단","s":["지역사회복지 실천과정에서 다음 과업이 수행되는 단계는?","- 재정자원의 집행","- 추진인력의 확보 및 활용","- 협력과 조정을 위한 네트워크 구축"],"c":["문 "g":2,"n":56,"t":"지역사회복지 이론","f":"사례·제시문 판단","s":["다음 사례에 해당하는 지역사회복지이론은?","A사회복지기관은 지방정부로부터 보조금을 지원받은 후 지방정부의 요구와 통제를 수용하였다."],"c":["갈등이론","엘리트주의이론","사회체계이론","권력의존이론","사회자본이론"],"a":4},{"id":"25-2-57","y":2025,"g":2,"n":57,"t":"지역사회복지 이론","f":"옳은 것 모두 고르기","s":["지역사회복지이론에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 사회체계이론 - 지역사회 내 갈등이 변화의 원동력이다.","ㄴ. 갈등이론 - 자원의 불평등 분배로 인해 이해관계의 대립이 발생한다.","ㄷ. 자원동원이론 - 인간행동은 타인이나 사회환경과 상호작용하는 동안에 학습된다.","ㄹ. 사회자본이론 - 신뢰와 네트워크를 통해 지역사회 문제 해결을 위한 규범 등이 형성된다."],"c":["ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":2},{"id":"25-2-58","y":2025,"g":2,"n":58,"t":"지역사회복지 역사·정책동향","f":"옳지 않은 것","s":["포플(K. Popple, 1996)의 지역사회복지 실천모델로 옳지 않은 것은?"],"c":["지역사회연계","지역사회교육","지역사회개발","지역사회행동","인종차별철폐지역사회사업"],"a":1},{"id":"25-2-59","y":2025,"g":2,"n":59,"t":"실천모델(로스만·웨일과 갬블·테일러와 로버츠)","f":"옳은 것 모두 고르기","s":["로스만(J. Rothman)의 지역사회복지 실천모델에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 지역사회개발모델은 지역사회 역량강화, 통합, 자조를 활동 목표로 둔다.","ㄴ. 사회계획모델에서는 변화의 매개체로 과업지향적인 소집단을 활용한다.","ㄷ. 사회행동모델에서 사회복지사의 핵심 역할은 옹호자, 선동가, 협상가이다.","ㄹ. 지역사회개발모델은 지역사회 문제 해결을 위해 전문가의 주도적 개입을 강조한다."],"c":["ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ"],"a":1},{"id":"25-2-60","y":2025,"g":2,"n":60,"t":"실천모델(로스만·웨일과 갬블·테일러와 로버츠)","f":"옳지 않은 것","s":["웨일과 갬블(M. Weil & D. Gamble)의 근린지역사회조직모델에 관한 설명으로 옳지 않은 것은?"],"c":["조직화를 위한 구성원의 능력개발에 초점을 둔다.","일차적 구성원은 지역사회 이웃주민이다.","사회복지사의 주요 역할은 조직가, 교육자, 촉진자, 코치이다.","지방정부, 외부개발자, 지역주민을 변화의 표적체계로 본다.","관심영역은 공통 관심사나 특정 이슈에 대한 정책, 행위,인식의 변화이다."],"a":5},{"id":"25-2-61","y":2025,"g":2,"n":61,"t":"실천모델(로스만·웨일과 갬블·테일러와 로버츠)","f":"사례·제시문 판단","s":["다음에서 설명하는 테일러와 로버츠(S. Taylor & R.Roberts)의 지역사회복지 실천모델은?","○ 지역사회의 문제해결을 위해 관계망을 형성하거나 조정","○ 사회복지사, 자원봉사자, 행정가 등 다양한 구성원이 참여","○ 지역사회복지 실천 과정에서 클라이언트와 후원자의 영향력이 동등"],"c":["계획모델","지역사회연계모델","지역사회개발모델","정치적 역량강화모델","프로그램 개발 및 조정모델"],"a":2},{"id":"25-2-62","y":2025,"g":2,"n":62,"t":"실천기술·사회복지사 역할","f":"옳지 않은 것","s":["지역사회개발모델에서 사회복지사의 핵심 역할이 아닌 것은?"],"c":["치료자","조력자","촉진자","안내자","교육자"],"a":1},{"id":"25-2-63","y":2025,"g":2,"n":63,"t":"실천과정·욕구사정","f":"옳지 않은 것","s":["지역사회복지 실천과정에 관한 설명으로 옳지 않은 것은?"],"c":["지역사회문제 해결과정으로 볼 수 있다.","지역사회 사정은 지역사회의 욕구와 자원을 파악하는 단계이다.","지역사회 문제나 욕구는 지역사회 상황에 따라 다양한형태로 나타날 수 있다.","자원동원, 재정집행, 네트워크는 실행단계에서 수행된다.","총괄평가는 수행과정 중에 실시되어 실천과정의 문제점을 수정하는데 유용하다."],"a":5},{"id":"25-2-64","y":2025,"g":2,"n":64,"t":"실천과정·욕구사정","f":"옳은 것 모두 고르기","s":["다음에서 설명하는 지역사회 욕구사정 방법에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 서베이 - 지역주민으로부터 설문조사를 통해 직접적으로 자료를 수집하는 방법","ㄴ. 초점집단기법 - 전문가 패널을 대상으로 반복된 설문을 통해 합의에 이를 때까지 의견을 수렴하는 방법","ㄷ. 사회지표분석 - 정부기관이나 사회복지관련 조직에 의해 수집된 기존 자료를 활용하는 방법","ㄹ. 명목집단기법 - 지역사회 내 다양한 의견을 수렴하며 욕구의 우선순위를 결정하는 방법"],"c":["ㄱ, ㄷ","ㄱ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":4},{"id":"25-2-65","y":2025,"g":2,"n":65,"t":"실천기술·사회복지사 역할","f":"옳지 않은 것","s":["지역사회복지 실천기술 중 조직화 기술에 해당하지 않는 것은?"],"c":["주민의 효율적 통제 기술","주민회의, 토론 등을 통한 의사소통","구성원 간 갈등조율을 위한 대인관계기술","주민지도력 발굴 및 향상 교육","지역사회 문제와 이슈에 대한 정보수집 및 분석"],"a":1},{"id":"25-2-66","y":2025,"g":2,"n":66,"t":"실천기술·사회복지사 역할","f":"사례·제시문 판단","s":["다음 지역사회복지 실천과정에서 사회복지사가 활용한 기술은?","A사회복지사는 사회적 고립가구 지원을 위해 OO복지재단에 신청서를 제출하여 사업에 필요한 예산을 확보하였으며 지역 대학교에 봉사자를 요청하였다."],"c":["협상","자원개발 및 동원","옹호","조직화","지역사회 교육"],"a":2},{"id":"25-2-67","y":2025,"g":2,"n":67,"t":"실천기술·사회복지사 역할","f":"사례·제시문 판단","s":["다음 사례에 제시된 사회복지사의 핵심 역할은?","A사회복지사는 지역 내 복합적인 욕구를 가진 가구에 대한 사례관리 계획을 수립하였다. 이를 위해 지역사회의 다양한 기관들과 함께 서비스의 중복과 누락을 방지하기 위한 효율적인 개입 방안을 논의하였다."],"c":["옹호자","교육자","조정자","자원개발자","협상가"],"a":3},{"id":"25-2-68","y":2025,"g":2,"n":68,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳지 않은 것","s":["지방자치제도에 관한 설명으로 옳지 않은 것은?"],"c":["지역복지 활성화의 토대가 될 수 있다.","복지예산의 중앙집중화로 정책 효과성이 강화된다.","우리나라는 지방자치법의 제정으로 도입되었다.","지역복지 실현을 위해 중앙정부와 분담적 관계를 추구한다.","사회복지서비스의 책임과 권한이 지방에 이양된다."],"a":2},{"id":"25-2-69","y":2025,"g":2,"n":69,"t":"지역사회복지 역사·정책동향","f":"옳지 않은 것","s":["지방분권화가 지역사회복지에 미치는 영향으로 옳지 않은것은?"],"c":["지역 간의 경쟁이 심화되어 지역 이기주의가 나타날 수있다.","지역사회복지에 대한 자기통치 원리가 중요시된다.","지역주민의 의사를 반영한 행정서비스가 강화된다.","지역 간 상대적 박탈감으로 사회적 형평성 문제가 발생된다.","지방의회의 사회적 책임성이 약화된다."],"a":5},{"id":"25-2-70","y":2025,"g":2,"n":70,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳은 것 고르기","s":["지역사회보장협의체의 구성 및 역할에 관한 설명으로 옳은것은?"],"c":["대표협의체는 사회보장급여 제공과 관련된 조례를 제정한다.","대표협의체 위원에는 공무원이 포함되지 않는다.","실무협의체는 사회보장급여 제공에 관한 사항을 심의ㆍ자문한다.","실무협의체 위원은 10명 이상 40명 이하로 구성한다.","읍ㆍ면ㆍ동 지역사회보장협의체는 지역사회보장계획의시행결과를 평가한다."],"a":4},{"id":"25-2-71","y":2025,"g":2,"n":71,"t":"실천과정·욕구사정","f":"옳은 것 모두 고르기","s":["시ㆍ군ㆍ구 지역사회보장계획 수립 및 시행절차에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 시·군·구는 4년마다 지역사회보장계획을 수립하여야 한다.","ㄴ. 사회보장위원회의 심의와 지방의회 보고를 거쳐 시·도지사에게 제출한다.","ㄷ. 지역사회보장계획에는 사회보험에 필요한 재원 규모와 조달방안이 포함된다.","ㄹ. 지역사회보장조사는 지역사회보장 욕구조사와 자원조사로 구성된다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄷ","ㄴ, ㄹ"],"a":3},{"id":"25-2-72","y":2025,"g":2,"n":72,"t":"실천기술·사회복지사 역할","f":"옳지 않은 것","s":["지역사회 복지기관의 역할로 옳지 않은 것은?"],"c":["사회복지협의회: 사회복지기관 간의 연계ㆍ협력ㆍ조정","자원봉사센터: 자원봉사 프로그램 개발ㆍ보급","지역자활센터: 자활기금 설치ㆍ운영","사회복지공동모금회: 모금 및 배분의 운용ㆍ관리","사회복지관: 지역사회 복지문제 예방ㆍ해결"],"a":3},{"id":"25-2-73","y":2025,"g":2,"n":73,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳은 것 고르기","s":["사회복지관 사업 내용 중 서비스제공 기능에 해당하는 것은?"],"c":["지역욕구조사 실시","자원봉사자 개발 및 관리","사회복지현장실습 교육 및 지도","독거노인을 위한 일상생활 지원","후원자 개발을 위한 기관 소식지 제작"],"a":4},{"id":"25-2-74","y":2025,"g":2,"n":74,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳은 것 모두 고르기","s":["사회적 경제에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 사회적 경제주체는 정부와 시장이다.","ㄴ. 사회통합과 공동체의식 증진에 기여할 수 있다.","ㄷ. 호혜와 연대에 기초한 사회적 자본으로 시장경제의 대안이 된다.","ㄹ. 사회적 경제조직의 유형에는 협동조합, 마을기업, 자활기업 등이 있다."],"c":["ㄱ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":5},{"id":"25-2-75","y":2025,"g":2,"n":75,"t":"지역사회복지 역사·정책동향","f":"옳지 않은 것","s":["지역사회복지운동에 관한 설명으로 옳지 않은 것은?","전자문제집 CBT 앱(구글플레이) : [다운로드]"],"c":["지역사회의 부당한 권력구조를 변화시키기 위해 노력한다.","지역주민 참여를 위한 수요자 중심의 활동이 이루어진다.","지역사회복지운동의 주체로 사회복지 실무자도 포함된다.","특정 계층에 국한된 수단지향적인 활동이다.","조례제정운동과 같은 제도변화과정을 예로 들 수 있다."],"a":4},{"id":"26-2-51","y":2026,"g":2,"n":51,"t":"지역사회복지 역사·정책동향","f":"사례·제시문 판단","s":["다음 설명에서 제시한 지역사회복지 이념은?","○ 다양한 욕구를 가진 이용자에게 서비스를 제공하기 위한 필수 요소이다.","○ 서비스 제공자뿐 아니라 다양한 사회적 인간관계의 조직화와 관련된다."],"c":["정상화","네트워크","탈시설화","주민참여","사회통합"],"a":2},{"id":"26-2-52","y":2026,"g":2,"n":52,"t":"지역사회복지 역사·정책동향","f":"사례·제시문 판단","s":["워렌(R. Warren)의 지역사회 기능 비교척도로 옳은 것은?","A: 지역사회 내 단위 조직들이 구조적, 기능적으로 관련된 정도","B: 동일지역 내에서 학교, 공공시설 등이 운영되고 있는 정도"],"c":["A: 지역적 자치성, B: 서비스 영역의 일치성","A: 수평적 유형, B: 서비스 영역의 일치성","A: 지역적 자치성, B: 지역에 대한 주민의 심리적 동일시","A: 수평적 유형, B: 지역적 자치성","A: 서비스 영역의 일치성, B: 지역에 대한 주민의 심리적 동일시"],"a":2},{"id":"26-2-53","y":2026,"g":2,"n":53,"t":"지역사회복지 역사·정책동향","f":"순서 나열","s":["최근 지역사회복지 동향을 과거부터 시대순으로 옳게 나열한 것은?","ㄱ. 노인장기요양보험제도 시행","ㄴ. 「자원봉사활동 기본법」시행","ㄷ. 지역사회 통합돌봄(커뮤니티 케어) 기본계획 발표","ㄹ. 동주민센터를 행정복지센터로 변경"],"c":["ㄱ → ㄴ → ㄷ → ㄹ","ㄱ → ㄴ → ㄹ → ㄷ","ㄴ → ㄱ → ㄷ → ㄹ","ㄴ → ㄱ → ㄹ → ㄷ","ㄴ → ㄷ → ㄱ → ㄹ"],"a":4},{"id":"26-2-54","y":2026,"g":2,"n":54,"t":"지역사회복지 역사·정책동향","f":"옳지 않은 것","s":["우리나라 새마을운동에 관한 설명으로 옳지 않은 것은?"],"c":["기본정신은 근면, 자조, 협동이다.","정부가 지정한 새마을의 날은 매년 4월 22일이다.","새마을운동중앙본부가 창립되어 민간주도로 전환되었다.","1970년대 새마을운동 기록물은 유네스코 세계기록유산에 등재되어 있다.","농촌생활환경 개선운동으로 시작한 이 운동은 소득증대운동으로 발전하지 못하였다."],"a":5},{"id":"26-2-55","y":2026,"g":2,"n":55,"t":"지역사회복지 이론","f":"사례·제시문 판단","s":["다음 사례와 관련된 지역사회복지 이론에 관한 설명으로 옳은 것은?","○ 사회복지관은 지방자치단체로부터 보조금 집행에 대한 지도점검을 받았다.","○ 재정자립도가 낮은 지방자치단체는 중앙정부의 예산지원에 영향을 받는다."],"c":["지역사회는 자원 교환의 불균형을 수정하기 위해 경쟁,재평가 등과 같은 전략을 활용할 수 있다.","사회운동의 성패는 조직원의 충원과 자금조달, 적절한조직구조를 개발할 수 있는 능력에 있다.","지역사회조직은 권력의 균형적인 배분을 위해 지역사회자원 개발에 힘써야 한다.","학습과 교육은 지역주민의 비판적 의식을 향상시키며,이는 개인 및 사회 발전의 핵심 요소이다.","지역사회는 인구 이동, 이민과 이주, 도시의 성장 등을통해 역동적으로 변화한다."],"a":3},{"id":"26-2-56","y":2026,"g":2,"n":56,"t":"지역사회복지 이론","f":"사례·제시문 판단","s":["다음의 지역사회문제를 해결하고자 할 때 직접적으로 연결되는 이론은?","한 지역사회에 장애인 학대문제가 발생하였다. 사회복지사는 장애인 개인에 대한 접근뿐만 아니라 이들의 가족, 친척, 이웃, 지역사회 내 공공기관 등의 하위체계가 그 동안 어떻게 연관되어 상호작용 해왔는지 파악하며 대응 방안을 모색하고 있다."],"c":["사회학습이론","사회체계이론","다원주의이론","사회연결망이론","사회자본이론"],"a":2},{"id":"26-2-57","y":2026,"g":2,"n":57,"t":"지역사회복지 역사·정책동향","f":"옳지 않은 것","s":["지역사회복지실천의 원칙에 해당하지 않는 것은?"],"c":["지역사회 기관간 협력관계 구축","지역사회 변화에 초점","지역사회 특성의 일반화","지역사회 자기결정권 강조","지역사회 내 효과적인 의사소통 통로 개발"],"a":3},{"id":"26-2-58","y":2026,"g":2,"n":58,"t":"실천모델(로스만·웨일과 갬블·테일러와 로버츠)","f":"옳지 않은 것","s":["로스만(J. Rothman)의 지역사회복지 실천모델에 관한 설명으로 옳지 않은 것은?"],"c":["지역사회개발모델은 지역사회 역량 개발과 통합이라는과업지향적 목표를 강조한다.","사회행동모델에서 사용하는 주요 기술과 기법은 갈등,대결, 협상이다.","사회계획모델에서 사회복지사의 역할은 분석가, 행정가등이다.","지역사회개발모델에서 변화 매개체는 과업지향적 소집단이다.","사회행동모델에서는 권리가 박탈당한 사람의 이익을 대변한다."],"a":1},{"id":"26-2-59","y":2026,"g":2,"n":59,"t":"실천모델(로스만·웨일과 갬블·테일러와 로버츠)","f":"옳은 것 모두 고르기","s":["웨일과 갬블(M. Weil &D. Gamble)의 기능적 지역조직화 모델에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 표적집단은 일반대중과 정부제도이다.","ㄴ. 사회복지사의 역할은 조직가, 옹호자, 정보 전달자이다.","ㄷ. 핵심 목표는 선택한 이슈와 관련된 정책, 행동, 태도의 변화이다."],"c":["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":5},{"id":"26-2-60","y":2026,"g":2,"n":60,"t":"실천과정·욕구사정","f":"옳은 것 고르기","s":["지역사회복지의 실천과정에 관한 설명으로 옳은 것은?"],"c":["지역사회 문제확인 단계에서는 지역의 특정 부분을 조사하는 포괄적 사정을 수행한다.","지역사회 문제분석 단계에서는 주요 정보제공자에게 지역문제에 대한 개방형 설문지를 발송하여 회수된 응답내용을 종합 정리하는 초점집단기법을 사용한다.","지역사회 개입목적과 목표설정 단계에서는 표적집단의변화내용에 관한 과정목표와 개입주체의 활동내용 및 방법에 관한 결과목표 등을 논리적으로 구성한다.","구체적인 실행계획 단계에서는 정책 접근법, 프로그램접근법, 프로젝트 접근법 등을 사용한다.","실행과정 점검단계에서는 모니터링 외에 형성 평가, 결과 평가 등을 수행한다."],"a":4},{"id":"26-2-61","y":2026,"g":2,"n":61,"t":"실천과정·욕구사정","f":"옳지 않은 것","s":["지역사회복지 프로그램의 평가기준과 관련 요소의 연결이 옳지 않은 것은?"],"c":["노력성 - 프로그램 예산 및 자원","효과성 - 이용자의 행동상 변화","품질 - 서비스 인력의 전문자격 소유 여부와 정도","영향 - 위기집단과 표적집단 내에서의 변화 정도","형평성 - 프로그램 이용자 수"],"a":5},{"id":"26-2-62","y":2026,"g":2,"n":62,"t":"지역사회복지 역사·정책동향","f":"옳은 것 고르기","s":["지역사회복지의 실천방법과 관련 현장의 연결이 옳은 것은?"],"c":["주민 조직화 - 시ㆍ군ㆍ구 희망복지지원단","자원 개발 - 읍ㆍ면ㆍ동 지역사회보장협의체","사례관리 - 종합사회복지관 주민조직화팀","지역사회교육 - 시ㆍ도 지역사회보장계획 TF팀","사회행동 - 행정복지센터 찾아가는 보건복지팀"],"a":2},{"id":"26-2-63","y":2026,"g":2,"n":63,"t":"실천기술·사회복지사 역할","f":"옳지 않은 것","s":["지역사회복지의 실천기술에 관한 설명으로 옳지 않은 것은?"],"c":["지역사회 구성원간 신뢰와 호혜성이 형성되면 네트워크가 지속될 수 있다.","효과적인 주민 조직화를 위해 주민의 개인적 이익에 대한 관심을 조직화에 활용할 수 있다.","임파워먼트는 개인의 문제와 제도적 권력관계의 연관성을 깨닫도록 하는 노력이 중요하다.","연계체계는 시간이 지남에 따라 느슨해질 수 있으므로기존의 회의 방식을 고수해야 한다.","사회자본을 만들기 위해 지역주민들이 서로에 대한 책임감을 인식하도록 돕는다."],"a":4},{"id":"26-2-64","y":2026,"g":2,"n":64,"t":"실천기술·사회복지사 역할","f":"사례·제시문 판단","s":["다음에서 설명하는 지역사회복지 실천기술은?","○ 실행과정에서 대인관계 기술이 중요하다.","○ 주민이 자신들의 문제를 함께 풀어가는 과정을 포함한다.","○ 주민참여를 통해 권력과 통제구조를 변화시켜 지속적인 변화를 이끌어낼 수 있다."],"c":["연계","지역사회 사정","주민 조직화","자원동원","지역사회교육"],"a":3},{"id":"26-2-65","y":2026,"g":2,"n":65,"t":"지역사회복지 역사·정책동향","f":"옳지 않은 것","s":["지역사회복지 실천과정에서 사회복지사가 네트워크 기술을 사용하는 이유로 옳지 않은 것은?"],"c":["개별 사회복지조직의 사회적 자본 감소 추구","'환경 속의 인간'이라는 사회복지실천 이념의 구체화","지역사회 내 사회복지시설의 중복서비스 제거","다수의 주민을 사회복지실천에 참여시킴으로 시민연대의식 강화","업무 공유에 따른 서비스 제공 비용 감소로 조직의 이익증대"],"a":1},{"id":"26-2-66","y":2026,"g":2,"n":66,"t":"실천기술·사회복지사 역할","f":"옳지 않은 것","s":["지역사회복지 실천을 위한 옹호 기술에 관한 설명으로 옳지 않은 것은?"],"c":["지역사회 옹호는 일반 지역주민이 겪는 개인적 문제를해결하기 위해 이들과 주민을 조직화하는 활동이다.","개인 옹호는 주민 스스로 자신을 옹호하기 어려운 상황에서 그 개인과 가족을 대신하여 수행하는 활동이다.","집단 옹호는 특정 집단이 불이익을 받을 때 이들의 공동문제를 해결하기 위한 활동이다.","정치 옹호는 입법, 행정, 사법영역에서 다양한 형태로 전개되는 사회 정의와 복지 증진을 위한 활동이다.","체계변화 옹호는 지역주민들과 함께 근본적인 제도상의변화를 도모하는 활동이다."],"a":1},{"id":"26-2-67","y":2026,"g":2,"n":67,"t":"지역사회복지 역사·정책동향","f":"옳은 것 모두 고르기","s":["지역사회복지를 위한 지방분권의 중요성으로 옳은 것을 모두 고른 것은?","ㄱ. 지방정부의 권한과 책임성 강화","ㄴ. 주민 욕구 중심의 맞춤형 복지서비스 제공","ㄷ. 주민 참여의 강조로 지역사회복지 연대 강화","ㄹ. 지역 실정에 맞는 효율적인 복지 집행체계의 구축"],"c":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"26-2-68","y":2026,"g":2,"n":68,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳은 것 고르기","s":["지역사회보장계획에 관한 설명으로 옳은 것은?"],"c":["시ㆍ군ㆍ구는 5년마다 지역사회보장계획을 수립하여야한다.","지역사회보장계획은 ｢사회복지사업법｣에 따라 수립한다.","지역사회보장계획은 지역사회보장협의체 심의를 거쳐 지방의회에 보고한다.","지역사회보장에 필요한 재원의 규모와 조달 방안은 포함되지 않는다.","현재 시행되고 있는 제3기 지역사회보장계획은 2023년부터 2027년까지이다."],"a":3},{"id":"26-2-69","y":2026,"g":2,"n":69,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳지 않은 것","s":["지역사회보장협의체에 관한 설명으로 옳지 않은 것은?"],"c":["심의, 자문 역할을 수행한다.","위원의 수는 10명 이상 40명 이하이다.","대표협의체 위원은 민간 복지시설의 대표와 관련 공무원등으로 구성된다.","위원의 임기는 3년이고 위원장은 연임할 수 있다.","관련법 개정에 의해 2015년부터 지역사회복지협의체에서 지역사회보장협의체로 변경되었다."],"a":4},{"id":"26-2-70","y":2026,"g":2,"n":70,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳지 않은 것","s":["사회복지공동모금회에 관한 설명으로 옳지 않은 것은?"],"c":["사회복지법인이다.","특별시ㆍ광역시ㆍ특별자치시ㆍ도ㆍ특별자치도 단위 사회복지공동모금지회를 둔다.","지회장은 이사회의 의결을 거쳐 회장이 임명한다.","기부금품 모금은 시기에 따라 연중모금과 집중모금으로구분할 수 있다.","사회복지공동모금회는 중앙회 및 17개 시ㆍ도별 지회로구성된 관 중심의 활동이다."],"a":5},{"id":"26-2-71","y":2026,"g":2,"n":71,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳지 않은 것","s":["사회복지협의회에 관한 설명으로 옳지 않은 것은?"],"c":["시ㆍ도 사회복지협의회는 한국사회복지협의회의 지회로운영된다.","민간 사회복지 증진을 위한 ｢사회복지사업법｣에 근거한법정 단체이다.","사회복지에 관한 조사ㆍ연구 및 정책을 건의한다.","사회복지 관련 기관ㆍ단체 간의 연계ㆍ협력ㆍ조정 등을수행한다.","시ㆍ도 및 시ㆍ군ㆍ구 단위에도 의무 설치한다."],"a":1},{"id":"26-2-72","y":2026,"g":2,"n":72,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳은 것 모두 고르기","s":["사회복지사업법상 사회복지관의 서비스 우선 제공 대상자를 모두 고른 것은?","ㄱ. A씨는 70세 남성으로 혼자 생활을 하고 있다.","ㄴ. B씨는 최근 실직한 45세 미혼 여성으로 차상위 계층이다.","ㄷ. C씨는 67세 지체장애인으로 「국민기초생활보장법」에 따른 수급자이다.","ㄹ. D씨는 35세의 결혼이주 여성으로 한국인 남편과 사별하고 자녀 둘을 키우고 있다."],"c":["ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"26-2-73","y":2026,"g":2,"n":73,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳지 않은 것","s":["사회적 경제에 관한 설명으로 옳지 않은 것은?"],"c":["마을기업의 운영 원칙은 공동체성, 공공성, 지역성, 기업성이다.","자활기업은 ｢협동조합 기본법｣에 따라 자활공동체에서명칭이 변경되었다.","사회적기업은 취약계층에게 사회서비스 또는 일자리를제공한다.","사회적 경제는 이윤 극대화의 시장경제와 달리 사람의가치를 우위에 두는 경제활동이다.","협동조합은 조합원의 권익옹호와 권익을 향상하고 지역사회에 공헌하고자 한다."],"a":2},{"id":"26-2-74","y":2026,"g":2,"n":74,"t":"실천과정·욕구사정","f":"사례·제시문 판단","s":["다음 사례가 제시하고 있는 아른스테인(S. Arnstein)의 주민참여 단계는?","A시(市) 내 복지정책과에서는 지역의 고독사 대응 및 예방 관련 계획을 수립하고자 준비하고 있다. 관련 주민모임은 이 계획의 결정권한을 A시가 가지고 있지만 주민들이 요청하는 경우 계획내용에 협상이 가능하다고 믿고, 의사결정의 책임까지 공유하고자 노력한다."],"c":["시민통제","권한위임","협동관계","회유","상담ㆍ자문"],"a":3},{"id":"26-2-75","y":2026,"g":2,"n":75,"t":"지역사회복지 역사·정책동향","f":"옳은 것 모두 고르기","s":["지역사회복지 활성화를 위한 과제로 옳은 것을 모두 고른 것은?","ㄱ. 민간 사회복지영역의 자율적 발전","ㄴ. 특정 계층 중심의 수단적 지역사회복지운동의 활성화","ㄷ. 지역사회 중심의 통합돌봄과 사회서비스 기반 구축","ㄹ. 지방분권 정책에 따른 합리적인 지역사회복지정책의 수립","ㅁ. 지역사회의 다양한 자원 활용과 조직 간의 유기적 협력"],"c":["ㄱ, ㄴ, ㅁ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ","ㄱ, ㄷ, ㄹ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"],"a":4}],"data/q_hb.json":[{"id":"17-1-1","y":2017,"g":1,"n":1,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["인간발달 이론이 사회복지실천에 미친 영향으로 옳지 않은 것은?"],"c":["피아제(J. Piaget)의 이론은 아동의 과학적, 수리적 추리과정의 발달과정을 이해할 수 있도록 준거틀을 제시하였다.","프로이드(S. Freud)의 이론은 클라이언트의 심리내적 갈등이 무의식의 동기에서 비롯된다는 것을 인식하도록 하였다.","에릭슨(E. Erikson)의 이론은 클라이언트의 생애주기에 따른 실천개입의 지표를 제시해 주었다.","스키너(B. Skinner)의 이론은 클라이언트의 모방학습의 중요성을 인식하도록 하였다.","매슬로우(A. Maslow)의 이론은 클라이언트의 욕구를 파악하고 평가하는데 유용하다."],"a":4},{"id":"17-1-2","y":2017,"g":1,"n":2,"t":"인본주의(로저스·매슬로우)","f":"옳은 것 모두 고르기","s":["로저스(C. Rogers)의 이론이 사회복지실천에 미친 영향으로 옳은 것을 모두 고른 것은?","ㄱ. 클라이언트의 자기결정권의 중요성을 인식하는데 유용하다.","ㄴ. 클라이언트에 대한 비심판적인 태도의 중요성을 인식하는데 유용하다.","ㄷ. 상담사의 지시적인 상담의 중요성을 인식하는데 유용하다."],"c":["ㄱ","ㄴ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":3},{"id":"17-1-3","y":2017,"g":1,"n":3,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["인간발달에 관한 설명으로 옳지 않은 것은?"],"c":["각 단계의 발달은 이전 단계의 발달에 의하여 영향을 받지 않는다.","인간발달에는 일반적인 원리가 존재하지만 모든 사람들이동일하게 발달하는 것은 아니다.","발달과정에는 결정적 시기가 존재한다.","유전적 요인과 환경적 요인 모두 인간발달에 중요하다.","중추부에서 말초로, 상체에서 하체의 방향으로 발달한다."],"a":1},{"id":"17-1-4","y":2017,"g":1,"n":4,"t":"프로이트·정신분석·방어기제","f":"옳은 것 고르기","s":["방어기제에 관한 설명으로 옳은 것은?"],"c":["억압(repression): 고통스런 생각이나 기억을 감정상태와분리시키는 것이다.","반동형성(reaction formation): 불합리한 태도, 생각, 행동을 정당한 것으로 그럴 듯한 이유를 붙이는 것이다.","투사(projection): 자신의 부정적인 충동, 욕구, 감정 등을타인에게 찾아 그 원인을 전가시키는 것이다.","보상(compensation): 죄의식을 느끼게 하는 일들을 의식으로부터 무의식으로 밀어내는 것이다.","전치(displacement): 심리적인 갈등이 신체적인 증상으로나타나는 것이다."],"a":3},{"id":"17-1-5","y":2017,"g":1,"n":5,"t":"인본주의(로저스·매슬로우)","f":"옳지 않은 것","s":["매슬로우(A. Maslow)의 욕구단계에 관한 설명으로 옳지 않은 것은?"],"c":["생리적 욕구 - 음식, 수면, 성의 욕구","안전의 욕구 - 보호, 의존, 질서, 구조의 욕구","소속감과 사랑의 욕구 - 친분, 우정, 존경의 욕구","자존감의 욕구 - 능력, 신뢰감, 성취, 독립의 욕구","자아실현의 욕구 - 자발성, 포부실현, 창조성의 욕구"],"a":3},{"id":"17-1-6","y":2017,"g":1,"n":6,"t":"피아제 인지발달","f":"옳은 것 모두 고르기","s":["피아제(J. Piaget)의 인지발달이론에서 ‘구체적 조작기’에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 인지적 능력이 급속도로 발전하는 단계이다.","ㄴ. 비논리적 사고에서 논리적 사고로 전환된다.","ㄷ. 분류화, 서열화, 탈중심화, 언어기술을 획득한다.","ㄹ. 대상의 형태와 위치가 변화하면 그 양적 속성도 바뀐다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"a":1},{"id":"17-1-7","y":2017,"g":1,"n":7,"t":"행동주의·사회학습이론","f":"옳지 않은 것","s":["행동주의 기법에 해당하지 않는 것은?"],"c":["이완훈련기법","토큰경제기법","정보처리기법","자기주장훈련","타임아웃기법"],"a":3},{"id":"17-1-8","y":2017,"g":1,"n":8,"t":"융·아들러(분석심리·개인심리)","f":"옳지 않은 것","s":["융(C. Jung)의 분석심리 이론에 관한 설명으로 옳지 않은 것은?"],"c":["자아(ego): 의식과 무의식을 결합시키는 원형적인 심상이며, 의식은 자아에 의해 지배된다.","페르소나(persona): ‘자아의 가면’이라고 하며 외부와의적응에서 생긴 기능 콤플렉스이다.","음영/그림자(shadow): 자신이 모르는 무의식적 측면에 있는 부정적인 또 다른 나의 모습으로 모순된 행동을 하게 만든다.","집단무의식(collective unconscious): 인류역사를 통해 조상으로부터 물려받은 정서적 소인으로 개인마다 그 원형은 다르다.","개성화(individuation): 자기실현이라고도 하며 모든 콤플렉스와 원형을 끌어들여 성격을 조화하고 안정성을 유지하는 것이다."],"a":4},{"id":"17-1-9","y":2017,"g":1,"n":9,"t":"피아제 인지발달","f":"옳지 않은 것","s":["피아제(J. Piaget)의 인지발달이론에 관한 설명으로 옳지 않은 것은?"],"c":["발달단계의 순서는 문화와 개인에 따라 다르게 나타난다.","인지구조는 각 단계마다 사고의 방식이 질적으로 다르다.","인지발달은 동화기제와 조절기제를 활용하여 환경에 적응하는 것이다.","상위단계는 바로 하위단계를 기초로 형성되고 하위단계를통합한다.","각 단계는 내부적으로 일관된 체계를 갖추고 있는 하나의완전체이다."],"a":1},{"id":"17-1-10","y":2017,"g":1,"n":10,"t":"융·아들러(분석심리·개인심리)","f":"사례·제시문 판단","s":["아들러(A. Adler)의 생활양식 유형 중 ‘지배형’에 관한 설명으로 옳은 것은?","에게 의존하여 자신의 욕구를 충족시킨다."],"c":["사회적 관심이 적고 활동수준이 높아 독단적이고 공격적이며 자신의 욕구를 충족시킨다.","사회적 관심과 활동수준이 높아 자신과 타인의 욕구를동시에 충족시키며 인생과업을 완수한다.","사회적 관심과 활동수준이 낮은 유형으로 성공보다 실패하는 것을 더 두려워한다.","기생적인 방법으로 외부세계와 관계를 맺으며 다른 사람","사회적 관심이 많고 활동수준이 낮으며 타인의 안녕에관심이 많다."],"a":1},{"id":"17-1-11","y":2017,"g":1,"n":11,"t":"에릭슨 심리사회적 발달","f":"옳은 것 고르기","s":["에릭슨(E. Erikson)의 심리사회적 위기와 주요 관계가 바르게 연결된 것은?"],"c":["자율성 대 수치감 - 교사","근면성 대 열등감 - 부모","통합성 대 절망감 - 동료","친밀성 대 고립감 - 리더","정체감 대 역할혼미 - 또래집단"],"a":5},{"id":"17-1-12","y":2017,"g":1,"n":12,"t":"체계이론·생태체계","f":"옳지 않은 것","s":["생태학적 이론에 관한 설명으로 옳지 않은 것은?"],"c":["인간과 환경의 지속적인 상호작용을 강조한다.","인간의 병리적인 관점을 강조한다.","적합성이란 인간의 욕구와 환경자원이 부합되는 정도를말한다.","인간은 자신의 요구에 맞게 환경을 만들어내기도 한다.","인간의 생활상의 문제는 전체 생활공간 내에서 이해한다."],"a":2},{"id":"17-1-13","y":2017,"g":1,"n":13,"t":"체계이론·생태체계","f":"옳은 것 고르기","s":["사회체계이론의 주요 개념에 관한 설명으로 옳은 것은?"],"c":["시너지(synergy)는 폐쇄체계의 특징과 관련이 있다.","안정상태(steady state)는 환경과의 상호작용에서 부분들간의 관계를 유지하기 위하여 에너지를 계속적으로 사용하는 상태를 의미한다.","항상성(homeostasis)은 시스템에서 위기가 왔을 때 불균형을 유지하려는 경향을 말한다.","균형(equilibrium)은 주로 개방체계에서 나타나며 외부로부터 새로운 에너지를 투입하여 변화시키려 노력하는 속성이다.","피드백(feedback)은 체계 구성간의 상호작용이 증가함에따라 유용한 에너지가 감소하는 상태를 의미한다."],"a":2},{"id":"17-1-14","y":2017,"g":1,"n":14,"t":"사회환경(가족·집단·조직·문화·지역사회)","f":"옳은 것 고르기","s":["조직문제에 대한 해결책 모색이나 성과물 산출을 목적으로 하는 집단은?"],"c":["성장집단","치료집단","사회화집단","과업집단","교육집단"],"a":4},{"id":"17-1-15","y":2017,"g":1,"n":15,"t":"체계이론·생태체계","f":"옳은 것 모두 고르기","s":["개방형 가족체계에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 가족 체계 내 엔트로피 상태가 지속된다.","ㄴ. 외부로부터 정보를 통해 체계의 기능을 발전시킨다.","ㄷ. 지역사회와의 교류가 활발하다.","ㄹ. 투입과 산출이 거의 없는 상태이다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":3},{"id":"17-1-16","y":2017,"g":1,"n":16,"t":"사회환경(가족·집단·조직·문화·지역사회)","f":"옳은 것 고르기","s":["문화에 관한 설명으로 옳은 것은?"],"c":["동화(assimilation)는 원문화의 가치를 유지하면서 주류사회의 문화에 소극적으로 참여하는 유형이다.","인간행동에 영향을 주는 미시체계이다.","개인의 생리적 욕구와 심리적 욕구 충족에 영향을 준다.","예술, 도덕, 제도 등이 각기 독립적으로 존재하며, 서로영향을 주지 않는다.","지속적으로 누적되기 때문에 항상 같은 형태를 지닌다."],"a":3},{"id":"17-1-17","y":2017,"g":1,"n":17,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["태아기의 유전성 질환에 관한 설명으로 옳지 않은 것은?"],"c":["유전성 질환은 유전자 이상으로 발생하는 신체적ㆍ정신적 이상을 모두 가리키는 것이다.","유전자 이상으로 인한 장애에 묘성(cat-cry) 증후군이 포함된다.","유전성 질환은 유전적 요인과 환경적 요인의 상호작용에의해 발생할 수 있다.","유전성 질환을 가진 태아는 임신초기에 유산된다.","유전질환 가능성을 알기 위하여 임신 15∼17주 경 양수를 채취하여 진단할 수 있으나 태아에 손상을 줄 우려가 있다."],"a":4},{"id":"17-1-18","y":2017,"g":1,"n":18,"t":"피아제 인지발달","f":"옳은 것 고르기","s":["피아제(J. Piaget)의 감각운동기의 발달특성에 관한 설명으로 옳은 것은?"],"c":["대상을 특징에 따라 분류(classification)한다.","대상을 연속(seriation)적인 순서에 따라 배열한다.","대상의 질량 혹은 무게가 형태 및 위치에 따라 변하여도보존(conservation)될 수 있다고 생각한다.","대상영속성(object permanence)을 획득한다.","조합기술(combination skill)을 획득한다."],"a":4},{"id":"17-1-19","y":2017,"g":1,"n":19,"t":"융·아들러(분석심리·개인심리)","f":"옳은 것 모두 고르기","s":["융(C. Jung)이 제시한 장년기의 성격발달 특성으로 옳은 것을 모두 고른 것은?","ㄱ. 자아가 발달하고 외부세계에 대처하는 역량을 발휘한다.","ㄴ. 남성은 여성적 측면인 아니무스를 나타낸다.","ㄷ. 외부세계에 쏟았던 에너지를 자기내면에 돌려 자아정체감 대 혼란이 나타난다.","ㄹ. 여성은 독립적이고 공격적인 측면이 나타난다."],"c":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"a":2},{"id":"17-1-20","y":2017,"g":1,"n":20,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["유아기(3-6세) 혹은 아동기(7-12세)의 주요 발달과업에 해당하지 않는 것은?"],"c":["애착관계 형성","또래관계 증진","도덕 및 가치체계 발달","성역할 습득","학습기술 습득"],"a":1},{"id":"17-1-21","y":2017,"g":1,"n":21,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["청년기 혹은 장년기의 발달과제의 학자와 내용의 연결이 옳지 않은 것은?"],"c":["레빈슨(D. Levinson) - 직업 선택, 사회적 역할","펙(R. Peck) - 자아분화, 친밀한 관계 활동","굴드(R. Gould) - 자신의 삶에 대한 책임 있는 행동","에릭슨(E. Erikson) - 타인과 조화로운 관계 형성","하비거스트(R. Havighurst) - 배우자 선택, 가정관리"],"a":2},{"id":"17-1-22","y":2017,"g":1,"n":22,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["임신 중 태아기에 기형 혹은 저체중을 발생시키는 요인으로 옳지 않은 것은"],"c":["간접흡연","항생제 섭취","알코올 섭취","폴리염화비페닐(PCB)에 노출","철분 섭취"],"a":5},{"id":"17-1-23","y":2017,"g":1,"n":23,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["유아기(3-6세)의 인지발달 특성에 해당하지 않는 것은?"],"c":["표상에 의한 상징적 사고","자기중심적 사고","비가역적 사고","물활론적 사고","연역적 사고"],"a":5},{"id":"17-1-24","y":2017,"g":1,"n":24,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["퀴블러-로스(Kübler-Ross)가 제시한 ‘죽음의 직면단계’에 포함되지 않는 것은?"],"c":["부정","자학","타협","우울","분노"],"a":2},{"id":"17-1-25","y":2017,"g":1,"n":25,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["인간생애주기의 이해에 관한 설명으로 옳은 것은?"],"c":["성장과 발달은 횡단적으로 일어난다.","인간의 삶에는 비지속성 혹은 단절의 특성이 있다.","인간 삶을 전체가 아닌 부분으로 이해하여야 한다.","인간행동 이해를 위하여 환경보다 유전적 원인을 분석하여야 한다.","생애주기의 연령구분은 국가와 사회적 상황에 따라 다양하게 나타난다."],"a":5},{"id":"18-1-1","y":2018,"g":1,"n":1,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["인간발달에 관한 설명으로 옳지 않은 것은?"],"c":["발달의 속도에는 개인차가 있다.","발달은 하부에서 상부로, 말초부위에서 중심부위로 진행된다.","발달은 유전과 환경의 상호작용에 의해 이루어진다.","발달에는 결정적 시기가 있다.","발달은 양적 변화와 질적 변화를 포함한다."],"a":2},{"id":"18-1-2","y":2018,"g":1,"n":2,"t":"피아제 인지발달","f":"옳지 않은 것","s":["피아제(J. Piaget)의 인지발달이론에 관한 설명으로 옳지 않은 것은?"],"c":["인지발달은 동화기제와 조절기제를 활용하여 환경에 적응하는 것이다.","인지발달은 감각운동기, 전조작기, 구체적 조작기, 형식적조작기로 구분한다.","구체적 조작기에는 추상적 사고가 가능하다.","인지발달은 개인과 환경의 상호작용에서 이루어지는 적응과정이다.","상위단계는 이전 하위단계를 기초로 형성되며 하위단계를통합한다."],"a":3},{"id":"18-1-3","y":2018,"g":1,"n":3,"t":"인본주의(로저스·매슬로우)","f":"옳지 않은 것","s":["로저스(C. Rogers)의 인본주의 이론에 관한 설명으로 옳지 않은 것은?"],"c":["인간의 주관적 경험을 강조한다.","인간의 성격발달단계를 제시한다.","인간을 통합적 존재로 규정한다.","인간을 합리적이고 미래지향적 존재로 규정한다.","인간 본성의 긍정적인 측면과 자아개념의 중요성을 강조한다."],"a":2},{"id":"18-1-4","y":2018,"g":1,"n":4,"t":"에릭슨 심리사회적 발달","f":"옳은 것 모두 고르기","s":["에릭슨(E.Erikson)의 이론에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 각 단계의 발달은 이전 단계의 발달을 토대로 이루어진다.","ㄴ. 사회문화적 환경이 성격 발달에 영향을 미친다.","ㄷ. 청소년기의 주요 발달과업은 자아정체감 형성이다.","ㄹ. 인간의 발달은 전 생애에 걸쳐 일어난다."],"c":["ㄱ,ㄴ","ㄱ,ㄷ","ㄷ,ㄹ","ㄱ,ㄴ,ㄹ","ㄱ,ㄴ,ㄷ,ㄹ"],"a":5},{"id":"18-1-5","y":2018,"g":1,"n":5,"t":"체계이론·생태체계","f":"옳은 것 모두 고르기","s":["생태체계이론에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 체계이론과 생태학적 관점을 통합한다.","ㄴ. 인간과 환경은 분리할 수 없으며 동시에 고려해야 한다.","ㄷ. 적합성(goodness-of-fit)이란 체계가 균형을 위협받았을 때 이를 회복하려는 경향을 말한다.","ㄹ. 실천과정의 사정(assessment) 단계에 유용하게 활용된다."],"c":["ㄱ,ㄷ","ㄴ,ㄷ","ㄷ,ㄹ","ㄱ,ㄴ,ㄹ","ㄱ,ㄴ,ㄷ,ㄹ"],"a":4},{"id":"18-1-6","y":2018,"g":1,"n":6,"t":"프로이트·정신분석·방어기제","f":"옳지 않은 것","s":["프로이드(S. Freud)의 정신분석이론에 관한 설명으로 옳지 않은 것은?"],"c":["어린 시절에 겪었던 과거 경험의 중요성을 강조한다.","엄격한 배변훈련으로 항문보유적 성격이 형성될 수 있다.","초자아는 성격의 실행자이자 마음의 이성적인 부분이다.","생식기에는 이성에 대한 관심과 호기심이 높아진다.","남자아이는 남근기에 오이디푸스 콤플렉스(Oedipuscomplex)로 인한 거세불안을 경험한다."],"a":3},{"id":"18-1-7","y":2018,"g":1,"n":7,"t":"프로이트·정신분석·방어기제","f":"사례·제시문 판단","s":["다음에서 설명하는 방어기제에 해당하는 것은?","어떤 대상이나 사물로 향했던 본능적이고 충동적인 감정을 덜 위험하거나 편안한 대상 혹은 사물로 향하게 하여 긴장을 완화시키는 방어기제이다. 아버지에게 혼이 난 아이가 마당의 개를 발로 차버림으로써 화를 푸는 것이 그 예이다."],"c":["부정(denial)","투사(projection)","반동형성(reaction formation)","해리(dissociation)","전치(displacement)"],"a":5},{"id":"18-1-8","y":2018,"g":1,"n":8,"t":"융·아들러(분석심리·개인심리)","f":"옳지 않은 것","s":["아들러(A. Adler)의 개인심리이론에 관한 설명으로 옳지 않은 것은?"],"c":["열등감은 보다 나은 자기완성의 의지를 약화시키는 요소이다.","인간은 우월성을 추구하려는 동기를 가지고 있다.","사회적 관심은 가족관계 및 아동기 경험의 맥락에서 발달한다.","인간은 자신의 삶을 스스로 창조해갈 수 있는 능동적인존재이다.","출생순위, 가족의 크기 등은 개인의 성격발달과 생활양식에 영향을 미친다."],"a":1},{"id":"18-1-9","y":2018,"g":1,"n":9,"t":"행동주의·사회학습이론","f":"옳지 않은 것","s":["반두라(A. Bandura)의 사회학습이론의 주요 개념으로 옳지 않은 것은?"],"c":["모델링","관찰학습","자기강화","자기효능감","논박"],"a":5},{"id":"18-1-10","y":2018,"g":1,"n":10,"t":"체계이론·생태체계","f":"사례·제시문 판단","s":["체계이론에서 다음에 해당하는 개념으로 옳은 것은?","외부환경과 에너지의 상호교환이 이루어지지 않은 채 고립되어, 다른 체계로부터 투입도 없고 다른 체계로 산출도 전하지 못하는 체계이다."],"c":["경계","폐쇄체계","홀론","다중종결성","개방체계"],"a":2},{"id":"18-1-11","y":2018,"g":1,"n":11,"t":"융·아들러(분석심리·개인심리)","f":"옳지 않은 것","s":["융(C. Jung)의 분석심리이론에 관한 설명으로 옳지 않은 것은?"],"c":["인간은 생물학적, 심리적, 사회문화적 존재이다.","인간은 자신의 일부로 받아들이기 꺼리는 그림자(shadow)를 가지고 있다.","집단무의식을 ‘조상 대대로의 경험의 침전물’로 보았다.","남자의 여성적인 면은 ‘아니무스(animus)', 여자의 남성적인 면은 ’아니마(anima)'이다.","페르소나(persona)는 개인이 외부에 표출하는 이미지 혹은 가면을 의미한다."],"a":4},{"id":"18-1-12","y":2018,"g":1,"n":12,"t":"피아제 인지발달","f":"옳지 않은 것","s":["피아제(J. Piaget)의 인지발달단계 중 감각운동기의 세부 단계와 그 설명으로 옳지 않은 것은?"],"c":["반사기(출생-1개월): 반사행동을 통하여 환경 내 자극들을 동화시키며 성장한다.","1차 순환반응기(1-4개월): 손가락 빨기와 같이 우연한신체적 경험을 하여 흥미 있는 결과를 얻었을 때 이를 반복한다.","2차 순환반응기(4-8개월): 딸랑이 흔들기와 같이 환경변화에 흥미를 가지고 그 행동을 반복한다.","2차 도식협응기(8-12개월): 장애물을 치우고 원하는 물건을 잡는 등 의도적 행동을 할 수 있다.","3차 순환반응기(12-18개월): 행동하기 전에 생각을 반복한다."],"a":5},{"id":"18-1-13","y":2018,"g":1,"n":13,"t":"사회환경(가족·집단·조직·문화·지역사회)","f":"옳은 것 모두 고르기","s":["집단의 구성동기에 따른 유형과 그 예가 올바르게 연결된 것을 모두 고른 것은?","ㄱ. 자연 집단(natural group) - 또래집단","ㄴ. 1차 집단(primary group) - 과업집단","ㄷ. 형성 집단(formed group) - 치료집단","ㄹ. 2차 집단(secondary group) - 이웃"],"c":["ㄱ,ㄹ","ㄱ,ㄷ","ㄴ,ㄹ","ㄴ,ㄷ,ㄹ","ㄱ,ㄴ,ㄷ,ㄹ"],"a":2},{"id":"18-1-14","y":2018,"g":1,"n":14,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["청소년기 인지발달의 일반적 특성으로 옳지 않은 것은?"],"c":["자기개념(self-concept)의 발달이 시작되고 자기효능감이 급격히 증가한다.","구체적인 사물에 한정되지 않고 추상적 개념을 다룰 수있다.","가설을 세울 수 있고 인간관계를 추론할 수 있는 연역적사고가 가능해진다.","피아제(J. Piaget)의 이론에 따르면 형식적 조작기에 속한다.","자아중심적 사고로 상상적 청중 현상과 개인적 우화 현상을 보인다."],"a":1},{"id":"18-1-15","y":2018,"g":1,"n":15,"t":"에릭슨 심리사회적 발달","f":"사례·제시문 판단","s":["마샤(J. Marcia)의 자아정체감이론에서 다음의 정체감 상태를 설명하는 것으로 옳은 것은?","철수는 어려서부터 변호사였던 아버지의 영향을 받아 법조인이 되는 것을 꿈으로 생각 하였고, 사회에서도 유망한 직업이라 생각하여 법학과에 진학하였다. 철수는 법학 전공이 자신의 적성과 잘 맞는지 탐색해보지 못했지만 이미 선택했기에 법조인 외의 직업은 생각해본 적이 없다."],"c":["정체감 유실(identity foreclosure)","정체감 혼란(identity diffusion)","정체감 성취(identity achievement)","정체감 유예(identity moratorium)","정체감 전념(identity commitment)"],"a":1},{"id":"18-1-16","y":2018,"g":1,"n":16,"t":"생애주기별 발달(태아~노년기)","f":"사례·제시문 판단","s":["다음에서 공통으로 설명하는 요소로 옳은 것은?","- 에릭슨(E. Erikson)의 심리사회 발달단계에서 성인초기의 주요 발달과업이다.","- 스턴버그(R. Sternberg)의 애정발달이론에서 사람의 세 가지 구성요소 중 하나이다."],"c":["친밀감","열정","헌신","만족","정체감"],"a":1},{"id":"18-1-17","y":2018,"g":1,"n":17,"t":"행동주의·사회학습이론","f":"옳은 것 고르기","s":["다음의 이론과 그 기본 가정의 연결이 옳은 것은?"],"c":["피아제(J. Piaget)의 인지발달이론 - 정신결정론","프로이드(S. Freud)의 정신분석이론 - 상호결정론","스키너(B. F. Skinner)의 행동주의이론 - 환경결정론","반두라(A. Bandura)의 사회학습이론 - 정신결정론","매슬로우(A. Maslow)의 인본주의이론 - 환경결정론"],"a":3},{"id":"18-1-18","y":2018,"g":1,"n":18,"t":"사회환경(가족·집단·조직·문화·지역사회)","f":"옳은 것 고르기","s":["문화와 관련된 내용으로 옳은 것은?"],"c":["관념문화에는 법과 관습이 포함된다.","물질문화에는 신화와 전설이 포함된다.","문화는 중간체계로서 개인에게 영향을 미친다.","비물질문화에는 관념문화와 규범문화가 포함된다.","규범문화에는 종교적 신념과 과학적 진리가 포함된다."],"a":4},{"id":"18-1-19","y":2018,"g":1,"n":19,"t":"체계이론·생태체계","f":"옳은 것 고르기","s":["거시체계에 관한 설명으로 옳은 것은?"],"c":["개인을 의미한다.","가족, 소집단, 이웃이 포함된다.","국가, 사회제도가 포함된다.","미시체계 간의 연결망을 의미한다.","인간의 삶과 행동에 일방적인 영향을 미친다."],"a":3},{"id":"18-1-20","y":2018,"g":1,"n":20,"t":"에릭슨 심리사회적 발달","f":"옳지 않은 것","s":["에릭슨(E. Erikson)의 심리사회적 위기와 자아 강점의 연결이 옳지 않은 것은?"],"c":["신뢰 대 불신 - 희망","근면성 대 열등감 - 유능성","친밀감 대 고립감 - 사랑","정체감 대 역할 혼미 - 목적","자율성 대 수치심 - 의지"],"a":4},{"id":"18-1-21","y":2018,"g":1,"n":21,"t":"생애주기별 발달(태아~노년기)","f":"사례·제시문 판단","s":["다음에서 설명하는 아인스위드(M. Ainsworth)의 애착유형으로 옳은 것은?","어린이집에 맡겨지게 된 영희는 엄마가 자신을 어린이집에 놓고 떠나려고 하자 떨어지지 않으려고 계속 울었다. 두 시간이 지나고 엄마가 데리러 왔는데도 영희는 안정감을 보이지 못하고 엄마를 원망하듯이 울음을 그치지 못했다."],"c":["안정 회피애착형","안정 저항애착형","불안정 저항애착형","불안정 회피애착형","불안정 혼란애착형"],"a":3},{"id":"18-1-22","y":2018,"g":1,"n":22,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["태아의 발달과정 중 가장 먼저 발달하는 것은?"],"c":["귀","눈","다리","심장","외부생식기"],"a":4},{"id":"18-1-23","y":2018,"g":1,"n":23,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["2-3세 유아의 특징으로 옳지 않은 것은?"],"c":["숟가락질을 할 수 있다.","혼자 넘어지지 않고 잘 걸으며 뛸 수 있게 된다.","프로이드(S. Freud) 이론의 항문기에 해당되고 배변훈련이 시작된다.","양육자와의 애착관계가 시작되고 분리불안이 늘어난다.","언어활동이 급격히 증가하고 낱말을 이어 문장으로 말하기 시작한다."],"a":4},{"id":"18-1-24","y":2018,"g":1,"n":24,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["중년기에 경험하는 갱년기 증상에 관한 설명으로 옳지 않은 것은?"],"c":["여성은 안면홍조와 수면장애 등의 증상을 경험하며, 폐경으로 가임기가 끝나게 된다.","신체적 변화뿐만 아니라 우울, 무기력감 등 심리적 증상을 동반하게 된다.","남성은 성기능 저하 및 성욕감퇴를 경험하지만 생식능력은 있다.","여성의 경우 에스트로겐의 분비가 감소되며 남성의 경우테스토스테론의 분비가 감소된다.","결정성(crystallized)지능은 감소하고 유동성(fluid) 지능이증가하는 인지변화를 경험한다."],"a":5},{"id":"18-1-25","y":2018,"g":1,"n":25,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 모두 고르기","s":["연령별 발달과업에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 영아기(0-2세): 사물이 눈에 보이지 않아도 존재하고 있음을 아는 대상영속성(object permanence)이 습득된다.","ㄴ. 유아기(3-6세): 콜버그(L. Kohlberg)의 도덕발달단계에서 착한 아이를 지향하며 다른 사람의 인정이나 사회규범을 따르는 인습적 수준에 해당한다.","ㄷ. 아동기(7-12세): 보존개념을 획득하며 분류와 조합개념이 점차로 발달한다.","ㄹ. 노년기(65세 이상): 죽음과 상실에 대한 심리적 반응으로 퀴블러로스(Kubler-Ross)가 제시한 부정-분노-타협-우울-수용 과정을 경험할 수 있다."],"c":["ㄱ,ㄴ","ㄷ,ㄹ","ㄱ,ㄷ,ㄹ","ㄴ,ㄷ,ㄹ","ㄱ,ㄴ,ㄷ,ㄹ"],"a":3},{"id":"19-1-1","y":2019,"g":1,"n":1,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["인간행동과 성격에 관한 설명으로 옳지 않은 것은?"],"c":["인간행동은 개인의 성격특성에 따라 다르게 표출된다.","성격을 이해하면 행동의 변화추이를 예측할 수 있다.","인간행동의 이해와 개입을 위해서는 성격의 이해가 필요하다.","성격이론은 인간행동의 수정 방법을 찾는 데 도움이 된다.","성격은 심리역동적 특성이 있어 일관된 행동을 기대할 수없다."],"a":5},{"id":"19-1-2","y":2019,"g":1,"n":2,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["인간발달이론이 사회복지실천에 유용한 이유로 옳지 않은 것은?"],"c":["개인 적응과 부적응의 판단 기준이 된다.","모든 연령 계층의 클라이언트와 일할 수 있는 기반이 된다.","생애주기에 따른 변화와 안정 요인을 이해하게 한다.","발달단계에 따라 신체, 심리, 사회적 기능을 분절적으로이해하게 한다.","발달단계별 욕구에 따른 사회복지제도의 기반을 제공한다."],"a":4},{"id":"19-1-3","y":2019,"g":1,"n":3,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["인간발달의 원리로 옳지 않은 것은?"],"c":["유전과 환경의 영향을 모두 받는다.","일생에 걸친 예측 불가능한 변화이다.","발달의 정도와 속도는 개인마다 다르다.","일정한 순서와 방향성이 존재한다.","멈추는 일 없이 지속된다."],"a":2},{"id":"19-1-4","y":2019,"g":1,"n":4,"t":"에릭슨 심리사회적 발달","f":"옳지 않은 것","s":["에릭슨(E. Erikson)의 심리사회적 발달단계에서 긍정적 결과와 주요관계의 연결이 옳지 않은 것은?"],"c":["영아기(0-2세, 신뢰감 대 불신감): 지혜 - 어머니","유아기(2-4세, 자율성 대 수치심과 의심): 의지 - 부모","학령전기(4-6세, 주도성 대 죄의식): 목적 - 가족","아동기(6-12세, 근면성 대 열등감): 능력 - 이웃, 학교","청소년기(12-19세, 자아정체감 대 정체감 혼란): 성실 -또래집단"],"a":1},{"id":"19-1-5","y":2019,"g":1,"n":5,"t":"프로이트·정신분석·방어기제","f":"옳은 것 모두 고르기","s":["프로이드(S. Freud)의 정신분석이론에서 불안에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 불안: 공포상태로서 위급한 상황에 적합한 방법으로 반응하지 못하는 것이다.","ㄴ. 현실적 불안: 자아가 지각한 현실세계에 있는 위험 상황에 대한 두려움이다.","ㄷ. 신경증적 불안: 원초아의 충동이 의식될지도 모른다는 위협을 느낄 때 생기는 두려움이다.","ㄹ. 도덕적 불안: 원초아와 초자아 간의 갈등에서 느끼는 양심에 대한 두려움이다."],"c":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"19-1-6","y":2019,"g":1,"n":6,"t":"프로이트·정신분석·방어기제","f":"옳지 않은 것","s":["방어기제에 관한 설명으로 옳지 않은 것은?"],"c":["반동형성(reaction formation): 어떤 충동이나 감정을 반대로 표현하는 것이다.","전치(displacement): 본능적 충동의 대상을 원래의 대상에서 덜 위협적인 대상으로 옮겨서 발산하는 것이다.","전환(conversion): 심리적 갈등이 감각기관 또는 수의근계기관의 증상으로 표출되는 것이다.","투사(projection): 용납할 수 없는 자신의 충동, 생각, 행동을 무의식적으로 다른 사람의 탓으로 돌리는 것이다.","해리(dissociation): 어떤 대상에 피해를 주었을 경우, 취소 또는 무효화하는 것이다."],"a":5},{"id":"19-1-7","y":2019,"g":1,"n":7,"t":"융·아들러(분석심리·개인심리)","f":"옳은 것 모두 고르기","s":["융(C. Jung)이 제시한 성격특성에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 외향형: 정신에너지(리비도)가 외부세계를 향하고 있다.","ㄴ. 감정형: 구체적이고 사실적인 측면에 초점을 두고 매우 일관성 있는 현실수용을 중시한다.","ㄷ. 사고형: 객관적인 진실과 원리원칙에 의해 판단하며 논리적, 분석적이고 규범과 기준을 중시한다.","ㄹ. 직관형: 미래의 가능성과 육감에 초점을 두어 변화와 다양성을 중시하며 이성을 필요로 한다."],"c":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1},{"id":"19-1-8","y":2019,"g":1,"n":8,"t":"프로이트·정신분석·방어기제","f":"옳지 않은 것","s":["다음 학자의 주요 이론과 개념의 연결이 옳지 않은 것은?"],"c":["에릭슨(E. Erikson) - 분석심리이론 - 원형, 집단무의식","프로이드(S. Freud) - 정신분석이론 - 원초아, 자아, 초자아","아들러(A. Adler) - 개인심리이론 - 열등감과 보상, 생활양식","반두라(A. Bandura) - 사회학습이론 - 자기강화, 관찰학습","로저스(C. Rogers) - 인본주의이론 - 완전히 기능하는사람, 현상학적 장"],"a":1},{"id":"19-1-9","y":2019,"g":1,"n":9,"t":"콜버그·도덕성 발달","f":"옳은 것 고르기","s":["콜버그(L. Kohlberg)의 후인습적 수준의 도덕성에 관한 설명으로 옳은 것은?"],"c":["일반윤리에 의해 자신의 이익에 따라 행동을 판단한다.","개인 상호간 대인관계의 조화를 바탕으로 행동한다.","인간의 존엄성과 양심에 따라 자율적이고 독립적 판단이가능하다.","타인 중심에서 벗어나 개인의 욕구충족을 위해 행동한다.","도덕적으로 옳고 법적으로도 타당할 때 충족된다."],"a":3},{"id":"19-1-10","y":2019,"g":1,"n":10,"t":"행동주의·사회학습이론","f":"옳지 않은 것","s":["반두라(A. Bandura)가 설명한 자기효능감의 형성요인이 아닌 것은?"],"c":["대리경험","언어적 설득","정서적 각성","행동조성","성취경험"],"a":4},{"id":"19-1-11","y":2019,"g":1,"n":11,"t":"체계이론·생태체계","f":"옳은 것 모두 고르기","s":["사회체계이론의 주요 개념에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 폐쇄체계가 지속되면 엔트로피 속성이 나타난다.","ㄴ. 환류(feedback)는 정보의 투입에 대한 반응으로 일종의 적응기제이다.","ㄷ. 항상성은 외부체계로부터 투입이 없어 체계의 구조변화가 고정된 평형상태를 말한다.","ㄹ. 체계는 부분성과 전체성을 동시에 가지며 위계질서가 존재하는 경우가 많다."],"c":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"19-1-12","y":2019,"g":1,"n":12,"t":"체계이론·생태체계","f":"옳은 것 고르기","s":["생태학의 주요 개념에 해당하는 것은?"],"c":["무의식 결정론","자아실현 경향성","단선적 인과론","개인의 창조적 힘","개인-환경 간의 적합성"],"a":5},{"id":"19-1-13","y":2019,"g":1,"n":13,"t":"체계이론·생태체계","f":"옳은 것 고르기","s":["다양한 사회체계에 관한 설명으로 옳은 것은?"],"c":["조직의 경계 속성은 조직의 유지 및 변화와 관련이 없다.","가족체계 내 반복적 상호작용은 구성원들의 행동에 영향을 미치지 않는다.","집단체계의 전체는 하위체계인 개개인의 고유한 특성의총합과 동일하다.","지역사회는 완전개방체계의 속성을 유지한다.","가상공간은 시공을 초월하여 새로운 공동체 형성을 가능하게 한다."],"a":5},{"id":"19-1-14","y":2019,"g":1,"n":14,"t":"체계이론·생태체계","f":"옳지 않은 것","s":["브론펜브레너(U. Bronfenbrenner)의 중간체계(meso-system)에 관한 설명으로 옳지 않은 것은?"],"c":["미시체계 간의 상호작용으로 구성된다.","개인이 새로운 환경으로 이동할 때마다 형성되거나 변화된다.","개인이 다양한 역할을 동시에 수행한다는 의미가 내포된다.","신념, 태도, 문화를 통해 인간에게 간접적으로 강력한 영향력을 행사한다.","여러 미시체계가 각기 다른 가치관을 표방할 때 잠재적갈등의 위험이 따른다."],"a":4},{"id":"19-1-15","y":2019,"g":1,"n":15,"t":"체계이론·생태체계","f":"옳지 않은 것","s":["생태체계이론이 사회복지실천에 유용한 점으로 옳지 않은 것은?"],"c":["전체 체계를 고려하여 문제를 이해한다.","클라이언트와 사회복지사 간의 상호교류를 중시한다.","각 체계들로부터 풍부한 정보의 획득이 가능하다.","환경적 수준에 개입하는 근거를 제시한다.","개인의 심리역동적 변화의지 향상에 초점을 둔다."],"a":5},{"id":"19-1-16","y":2019,"g":1,"n":16,"t":"체계이론·생태체계","f":"사례·제시문 판단","s":["사회체계로서 문화에 관한 설명으로 옳은 것은?","구별된다."],"c":["미시체계에 해당된다.","후천적으로 습득되기보다는 타고 나는 것이다.","구성원 간 공유되는 생활양식으로 다른 사회 구성원과","규범적 문화는 종교적 신념, 신화, 사상 등으로 구성된다.","문화는 외부의 요구와 무관하게 고정되어 있다."],"a":3},{"id":"19-1-17","y":2019,"g":1,"n":17,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["태아기에 관한 설명으로 옳지 않은 것은? (문제 오류로 실제 시험에서는 1, 2번이 정답처리 되었습니다. 여기서는 1번을 누르면 정답 처리 됩니다.)"],"c":["수정이 이루어지는 순간부터 출생하기까지의 시기를 말한다.","태내발달은 어머니의 영양상태, 학력, 질병 등으로부터영향을 받는다.","임신부 연령은 임신부와 태아 모두에게 영향을 미칠 수있다.","태아는 임신부의 정서 상태로부터 영향을 받을 수 있다.","약물은 태아에게 치명적인 영향을 미칠 수 있다."],"a":1},{"id":"19-1-18","y":2019,"g":1,"n":18,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 모두 고르기","s":["영아기(0-2세)의 발달특성으로 옳은 것을 모두 고른 것은?","ㄱ. 외부자극에 주로 반사운동을 한다.","ㄴ. 주 양육자와 관계를 바탕으로 신뢰감을 형성한다.","ㄷ. 대상영속성이 발달한다.","ㄹ. 서열화 사고의 특징을 나타낸다."],"c":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"19-1-19","y":2019,"g":1,"n":19,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["유아기(3-6세)의 발달특성에 관한 설명으로 옳지 않은 것은?"],"c":["피아제(J. Piaget)의 전조작기의 시기로 분리불안이 나타난다.","프로이드(S. Freud)의 오이디푸스 콤플렉스 시기로 이성부모에게 관심을 갖게 된다.","콜버그(L. Kohlberg)의 도덕발달단계에서는 보상 또는처벌회피를 위해 행동한다.","에릭슨(E. Erikson)의 주도성 대 죄의식 단계로 부모와가족이 가장 큰 영향을 미친다.","성적 정체성(gender identity)이 발달하는 시기이다."],"a":1},{"id":"19-1-20","y":2019,"g":1,"n":20,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["아동기(7-12세)에 관한 설명으로 옳은 것은?"],"c":["자아중심적 사고 특성을 나타낸다.","동성 또래관계를 통해 사회화를 경험한다.","신뢰감 대 불신감이 형성되는 시기이다.","심리사회적 유예기간이다.","경험하지 않고도 추론이 가능해진다."],"a":2},{"id":"19-1-21","y":2019,"g":1,"n":21,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["청소년기(13-19세)에 관한 설명으로 옳지 않은 것은?"],"c":["구체적 조작기에 해당한다.","부모의 권위에 도전하며 잦은 갈등을 겪는 시기이다.","동년배 집단에 참여하여 다양한 경험을 한다.","심리적 이유기라고도 한다.","애착대상이 부모에서 친구로 이동한다."],"a":1},{"id":"19-1-22","y":2019,"g":1,"n":22,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["청년기(20-35세)에 관한 설명으로 옳지 않은 것은?"],"c":["부모로부터의 독립에 대한 양가감정에서 해방된다.","직업의 준비와 선택은 주요한 발달과업이다.","사랑하고 보살피는 능력이 심화되는 시기이다.","사회적 성역할 정체감이 확립되는 시기이다.","친밀감 형성과 성숙한 사회관계 성취가 중요하다."],"a":1},{"id":"19-1-23","y":2019,"g":1,"n":23,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 모두 고르기","s":["중장년기(36-64세)의 특성으로 옳은 것을 모두 고른 것은?","ㄱ. 생산성 대 침체성　　　　ㄴ. 전인습적 도덕기","ㄷ. 빈둥지 증후군　　　　　　ㄹ. 개성화"],"c":["ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"19-1-24","y":2019,"g":1,"n":24,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["퀴블러 로스(E. Kubler-Ross)의 죽음에 이르는 5단계에 관한 설명으로 옳지 않은 것은?"],"c":["1단계: 죽음을 사실로 받아들이지 않고 부정한다.","2단계: 주변 사람들에게 화를 내며 분노한다.","3단계: 죽음의 연기를 위해 특정 대상과 타협을 시도한다.","4단계: 의사의 오진이라고 생각하며 죽음을 회피한다.","5단계: 죽음을 수용하고 임종을 준비한다."],"a":4},{"id":"19-1-25","y":2019,"g":1,"n":25,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["생애주기에 따른 주요 발달과업의 연결이 옳은 것은?"],"c":["영아기(0-2세): 대상 영속성, 자율적 도덕성","아동기(7-12세): 근면성, 보존개념","청소년기(13-19세): 자아정체감, 분류화","청년기(20-35세): 친밀감, 서열화","중장년기(36-64세): 자아통합, 노부모 부양"],"a":2},{"id":"20-1-1","y":2020,"g":1,"n":1,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["인간발달의 원리에 관한 설명으로 옳지 않은 것은?"],"c":["환경적 요인보다 유전적 요인을 중요시 한다.","결정적 시기가 있다.","일정한 순서가 있다.","개인차이가 존재한다.","특정단계의 발달은 이전의 발달과업 성취에 기초한다."],"a":1},{"id":"20-1-2","y":2020,"g":1,"n":2,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 모두 고르기","s":["다음의 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 성장은 키가 커지거나 몸무게가 늘어나는 등의 양적 변화를 의미한다.","ㄴ. 성숙은 유전인자에 의해 발달 과정이 방향 지어지는 것을 의미한다.","ㄷ. 학습은 직·간접 경험 및 훈련과정을 통한 변화를 의미한다."],"c":["ㄱ","ㄴ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":5},{"id":"20-1-3","y":2020,"g":1,"n":3,"t":"인본주의(로저스·매슬로우)","f":"옳지 않은 것","s":["로저스(C. Rogers)의 이론이 사회복지실천에 미친 영향으로 옳지 않은 것은?"],"c":["비지시적인 상담의 중요성을 강조한다.","공감적 상담의 중요성을 강조한다.","비심판적 태도는 원조관계에 유용하다.","클라이언트 자기결정권의 중요성을 강조한다.","클라이언트의 과거 정신적 외상의 중요성을 강조한다."],"a":5},{"id":"20-1-4","y":2020,"g":1,"n":4,"t":"사회환경(가족·집단·조직·문화·지역사회)","f":"옳은 것 고르기","s":["개방형 가족체계에 관한 설명으로 옳은 것은?"],"c":["외부체계와의 상호작용을 하지 않는다.","체계 내의 가족기능은 쇠퇴하게 된다.","에너지, 정보, 자원을 다른 체계들과 교환한다.","주변 환경으로부터 고립되어 있다.","지역사회와의 교류가 제한된다."],"a":3},{"id":"20-1-5","y":2020,"g":1,"n":5,"t":"융·아들러(분석심리·개인심리)","f":"옳은 것 고르기","s":["다음 학자의 주요이론과 기법의 연결이 옳은 것은?"],"c":["스키너(B. Skinner) - 행동주의이론 - 강화계획","프로이드(S. Freud) - 정신분석이론 - 타임아웃기법","피아제(J. Piaget) - 분석심리이론 - 합리정서치료","매슬로우(A. Maslow) - 인본주의이론 - 자유연상","융(C. Jung) - 개인심리이론 - 행동조성"],"a":1},{"id":"20-1-6","y":2020,"g":1,"n":6,"t":"인본주의(로저스·매슬로우)","f":"옳은 것 모두 고르기","s":["로저스(C. Rogers)의 이론에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 인간은 합목적이며 건설적인 존재이다.","ㄴ. 모든 인간에게는 객관적 현실만 존재한다.","ㄷ. 완전히 기능하는 사람은 자신의 경험에 대해 개방적이다.","ㄹ. 무조건적인 긍정적 관심이 건강한 성격 발달을 위한 중요한 요소이다."],"c":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"20-1-7","y":2020,"g":1,"n":7,"t":"인본주의(로저스·매슬로우)","f":"옳지 않은 것","s":["매슬로우(A. Maslow)의 이론에 관한 설명으로 옳지 않은 것은?"],"c":["인간의 창조성은 잠재적 본성이다.","각 개인은 통합된 전체로 간주된다.","안전의 욕구는 소속과 사랑의 욕구보다 상위단계의 욕구이다.","인간의 욕구는 자신을 성장하도록 동기부여 한다.","인간본성에 대해서 낙관적인 태도를 보이고 있다."],"a":3},{"id":"20-1-8","y":2020,"g":1,"n":8,"t":"융·아들러(분석심리·개인심리)","f":"옳은 것 고르기","s":["융(C. Jung)의 이론에 관한 설명으로 옳은 것은?"],"c":["남성의 여성적인 면은 아니무스(animus), 여성의 남성적인 면은 아니마(anima)이다.","원초아(id), 자아(ego), 초자아(super-ego)의 중요성을강조한다.","음영(shadow)은 자기나 자아상과 같은 개념으로 인간의어둡고 동물적인 측면이다.","페르소나(persona)는 개인이 외부세계에 보여주는 이미지이며, 사회적 요구에 대한 반응이다.","집단무의식(collective unconscious)은 다양한 콤플렉스에 기초한다."],"a":4},{"id":"20-1-9","y":2020,"g":1,"n":9,"t":"에릭슨 심리사회적 발달","f":"옳지 않은 것","s":["에릭슨(E. Erikson)의 이론에 관한 설명으로 옳지 않은 것은?"],"c":["사회적 관심, 창조적 자아, 가족형상 등을 강조한다.","청소년기의 자아정체감 발달을 강조한다.","성격발달에 있어서 환경과의 상호작용이 중요하다고 본다.","각 단계의 발달은 이전 단계의 심리사회적 갈등해결과통합을 토대로 이루어진다.","발달은 점성의 원리에 기초한다."],"a":1},{"id":"20-1-10","y":2020,"g":1,"n":10,"t":"융·아들러(분석심리·개인심리)","f":"옳은 것 모두 고르기","s":["아들러(A. Adler)의 이론에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 인간을 사회적 존재로 보았다.","ㄴ. 인간의 성격발달 단계를 제시하였다.","ㄷ. 출생순위, 가족과 형제관계에서의 경험은 생활양식에 영향을 준다."],"c":["ㄱ","ㄴ","ㄷ","ㄱ, ㄴ","ㄱ, ㄷ"],"a":5},{"id":"20-1-11","y":2020,"g":1,"n":11,"t":"피아제 인지발달","f":"옳은 것 고르기","s":["피아제(J. Piaget)의 인지이론에 관한 설명으로 옳은 것은?"],"c":["구체적 조작기에는 추상적으로 사고하고 추론을 통해가설을 검증할 수 있다.","인지능력의 발달은 아동과 환경 간의 상호작용에 의해단계적으로 성취되며 발달단계의 순서는 변하지 않는다.","인간의 무의식에 초점을 둔다.","도덕발달단계를 1단계에서 6단계로 제시한다.","보존개념은 전조작기에 획득된다."],"a":2},{"id":"20-1-12","y":2020,"g":1,"n":12,"t":"프로이트·정신분석·방어기제","f":"옳은 것 고르기","s":["받아들일 수 없는 자신의 욕망이나 충동을 타인에게 돌리는 방어기제는?"],"c":["전치(displacement)","억압(repression)","투사(projection)","합리화(rationalization)","반동형성(reaction formation)"],"a":3},{"id":"20-1-13","y":2020,"g":1,"n":13,"t":"행동주의·사회학습이론","f":"옳지 않은 것","s":["반두라(A. Bandura)의 사회학습이론으로 옳지 않은 것은?"],"c":["자기강화란 자기 스스로 목표한 일을 달성하고 자신에게 강화물을 주어서 행동을 유지하고 변화해 나가는 과정이다.","자기효능감은 자신이 바라는 목적을 이루기 위해 특정행동을 성공적으로 수행할 수 있다는 신념이다.","관찰학습은 단순한 환경적 자극에 대한 반응을 통하여행동을 학습하는 것이 아니라 타인의 행동을 관찰함으로써 행동을 습득하는 것이다.","관찰학습의 마지막 단계는 운동재생단계이다.","인간의 성격은 개인적, 행동적, 환경적 요소들 간의 지속적인 상호작용에 의하여 발달한다."],"a":4},{"id":"20-1-14","y":2020,"g":1,"n":14,"t":"행동주의·사회학습이론","f":"옳은 것 모두 고르기","s":["행동주의의 주요개념에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 인간의 행동은 환경적 자극에 의해 동기화된다.","ㄴ. 변별자극은 어떤 반응이 보상될 것이라는 단서 혹은 신호로 작용하는 자극이다.","ㄷ. 강화에는 즐거운 결과를 의미하는 정적 강화와 혐오적 결과를 제거하는 부적 강화가 있고 이 두 가지는 모두 행동의 빈도를 증가시킨다."],"c":["ㄱ","ㄴ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":5},{"id":"20-1-15","y":2020,"g":1,"n":15,"t":"체계이론·생태체계","f":"옳지 않은 것","s":["생태학적 이론에 관한 설명으로 옳지 않은 것은?"],"c":["개인을 환경과 상황 속에서 이해한다.","성격은 개인과 환경 사이의 상호작용의 산물이다.","적합성은 인간의 욕구와 환경자원이 부합되는 정도를말한다.","생활상의 문제는 전체적 생활공간 내에서 이해한다.","환경과의 상호작용에서 인간을 수동적인 존재로 본다."],"a":5},{"id":"20-1-16","y":2020,"g":1,"n":16,"t":"체계이론·생태체계","f":"옳은 것 고르기","s":["사회체계이론의 개념 중 체계 내부 간 또는 체계 외부와의 상호작용이 증가함으로써 체계내의 에너지양이 증가하는 것을 의미하는 것은?"],"c":["엔트로피(entropy)","시너지(synergy)","항상성(homeostasis)","넥엔트로피(negentropy)","홀론(holon)"],"a":2},{"id":"20-1-17","y":2020,"g":1,"n":17,"t":"사회환경(가족·집단·조직·문화·지역사회)","f":"사례·제시문 판단","s":["집단에 관한 설명으로 옳은 것은?","로 만들어진 집단이다."],"c":["일차집단(primary group)은 목적달성을 위해 인위적으","이차집단(secondary group)은 혈연이나 지연을 바탕으로 자연발생적으로 이루어진 집단이다.","자연집단(natural group)은 특정 위원회나 팀처럼 일정한 목적을 갖는 것이 특징이다.","자조집단(self-help group)은 유사한 어려움과 관심사를 가진 구성원들의 경험을 나누며 바람직한 변화를 추구한다.","개방집단(open-end group)은 집단이 진행되는 동안새로운 구성원의 입회가 불가능하다."],"a":4},{"id":"20-1-18","y":2020,"g":1,"n":18,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["태내기(prenatal period)의 발달에 관한 설명으로 옳지 않은 것은?"],"c":["환경호르몬, 방사능 등 외부환경과 임신부의 건강상태,정서상태, 생활습관 등이 태아의 발달에 영향을 미친다.","터너(Turner)증후군은 남아가 XXY, XXXY 등의 성염색체를 가져 외모는 남성이지만 사춘기에 여성적인 2차 성징이 나타난다.","양수검사는 임신초기에 할 경우 자연유산의 위험성이있으므로 임신중기에 실시하는 것이 좋다.","융모막검사는 정확도가 양수검사에 비해 떨어지고 유산의 위험성이나 사지 기형의 가능성이 있어 염색체 이상이나 노산일 경우에 제한적으로 실시하는 것이 좋다.","다운증후군은 23쌍의 염색체 중 21번 염색체가 하나더 존재해서 유발된다."],"a":2},{"id":"20-1-19","y":2020,"g":1,"n":19,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["영아기(0~2세)에 관한 설명으로 옳지 않은 것은?"],"c":["제1성장 급등기라고 할 정도로 일생 중 신체적으로 급격한 성장이 일어난다.","프로이드(S. Freud)의 구강기, 피아제(J. Piaget)의 감각운동기에 해당된다.","생존반사로는 연하반사(삼키기반사), 빨기반사, 바빈스키반사, 모로반사 등이 있다.","대상이 눈에 보이지 않아도 존재한다는 사실을 인식할수 있는 대상영속성이 습득된다.","양육자와의 애착관계형성은 사회#정서적 발달에 매우중요하다."],"a":3},{"id":"20-1-20","y":2020,"g":1,"n":20,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 모두 고르기","s":["아동기(7~12세)의 발달에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 에릭슨(E. Erikson)의 심리사회적 위기 중 솔선성 대 죄의식(initiavite vs guilg)에 해당된다.","ㄴ. 조합기술을 획득하기 위해서는 가역성, 보상성, 동일성의 원리에 대한 이해가 필요하다.","ㄷ. 단체놀이를 통해 개인의 목표가 단체의 목표에 속함을 인식하고 노동배분(역할분담)의 개념을 학습한다.","ㄹ. 추상적 사고가 가능해져서 미래의 사건을 예측할 수 있는 가설적, 연역적 사고가 발달한다."],"c":["ㄱ","ㄷ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄹ"],"a":2},{"id":"20-1-21","y":2020,"g":1,"n":21,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["유아기(3~6세)의 발달에 관한 설명으로 옳은 것은?"],"c":["프로이드(S. Freud)의 오이디푸스 콤플렉스와 엘렉트라콤플렉스가 일어나는 시기이다,","콜버그(L. Kohlberg)의 후인습적 단계의 도덕적 사고가나타나는 시기이다.","피아제(J. Piaget)의 자율적 도덕성의 단계이다.","심리사회적 유예가 일어나는 시기이다.","보존기술, 분류기술 등 기본적 논리체계가 획득된다."],"a":1},{"id":"20-1-22","y":2020,"g":1,"n":22,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["청소년기(13~19세)에 관한 설명으로 옳지 않은 것은?"],"c":["신체적 성장이 급속히 이루어진다는 점에서 제2의 성장급등기라고 한다.","어린이도 성인도 아니라는 점에서 주변인이라고 불린다.","상상적 청중과 개인적 우화는 청소년기에 타인을 배려하는 사고가 반영된 예이다.","피아제(J. Piaget)의 인지발달과정 중 형식적 조작기에해당된다.","정서적 변화가 급격히 일어난다는 점에서 질풍노도의시기라고 한다."],"a":3},{"id":"20-1-23","y":2020,"g":1,"n":23,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["노년기(성인후기, 65세 이상)에 관한 설명으로 옳지 않은 것은?"],"c":["시각, 청각, 미각 등의 감각기능이 약화되고, 생식기능또한 점차 약화된다.","퀴블러 로스(E. Kubler-Ross)는 인간이 죽음에 적응하는 5단계 중 마지막 단계를 타협단계라고 하였다.","신체변화에 대한 적응, 인생에 대한 평가, 역할 재조정,죽음에 대한 대비 등이 주요 발달과업이다.","에릭슨(E. Erikson)은 자아통합을 이루지 못하면 절망감을 느낀다고 보았다.","신장기능이 저하되어 신장질환에 걸릴 가능성이 증가하고, 방광이나 요도기능의 저하로 야간에 소변보는 횟수가 증가한다."],"a":2},{"id":"20-1-24","y":2020,"g":1,"n":24,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["중년기(성인중기, 40~64세)에 관한 설명으로 옳지 않은 것은?"],"c":["에릭슨(E. Erikson)의 생산성 대 침체성(generativity vsstagnation)의 단계에 해당된다.","아들러(A. Adler)는 외부에 쏟았던 에너지를 자기 내부로 돌리며 개성화과정을 경험한다고 본다.","결정성 지능은 계속 증가하지만 유동성 지능은 감소한다고 본다.","성인병 같은 다양한 신체적 질환이 많이 나타나고 갱년기를 경험한다.","남성은 테스토스테론이, 여성은 에스트로겐의 분비가감소되는 호르몬의 변화과정을 겪는다."],"a":2},{"id":"20-1-25","y":2020,"g":1,"n":25,"t":"에릭슨 심리사회적 발달","f":"옳은 것 고르기","s":["마샤(J. Marcia)의 자아정체감 유형에 속하지 않는 것은?"],"c":["정체감 수행(identity perfomance)","정체감 혼란(identity diffusion)","정체감 성취(identity achievement)","정체감 유예(identity moratorium)","정체감 유실(identity foreclosure)"],"a":1},{"id":"21-1-1","y":2021,"g":1,"n":1,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["인간발달 이론이 사회복지실천에 미친 영향으로 옳은 것은?"],"c":["아들러(A. Adler)의 이론은 인간을 하나의 통합된 유기체로 인식하는데 공헌하였다.","피아제(J. Piaget)의 이론은 발달단계의 순서가 개인과 문화에 따라 다르게 나타날 수 있음을 인식하는데 공헌하였다.","프로이트(S. Freud)의 이론은 모방학습의 중요성을 인식하는데 공헌하였다.","스키너(B. Skinner)의 이론은 인간행동이 내적 동기에 의해 강화됨을 이해하는데 공헌하였다.","로저스(C. Rogers)의 이론은 클라이언트의 생애발달 단계를 파악하고 평가하는데 공헌하였다."],"a":1},{"id":"21-1-2","y":2021,"g":1,"n":2,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["인간발달의 원리에 관한 설명으로 옳은 것은?"],"c":["무작위적으로 발달이 진행되기 때문에 예측이 불가능하다.","발달에는 결정적 시기가 있다.","안정적 속성보다 변화적 속성이 강하게 나타난다.","신체의 하부에서 상부로, 말초부위에서 중심부위로 진행된다.","순서와 방향성이 정해져 있으므로 발달속도에는 개인차가존재하지 않는다."],"a":2},{"id":"21-1-3","y":2021,"g":1,"n":3,"t":"체계이론·생태체계","f":"옳지 않은 것","s":["생태학 이론에 관한 설명으로 옳지 않은 것을 모두 고른 것은?","ㄱ. 인간과 환경을 서로 영향을 주고받는 단일체계로 간주한다.","ㄴ. 인간본성에 대한 정신적·환경적 결정론을 이론적 바탕으로 한다.","ㄷ. 성격을 개인과 환경 사이의 상호교류의 산물로 이해한다.","ㄹ. 타인과 관계를 맺는 인간의 능력은 환경과의 상호작용을 통하며 후천적으로 습득된다고 전제한다."],"c":["ㄷ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"21-1-4","y":2021,"g":1,"n":4,"t":"프로이트·정신분석·방어기제","f":"옳은 것 고르기","s":["프로이트(S. Freud)의 심리성적발달단계에 관한 설명으로 옳은 것은?"],"c":["남근기: 동성 부모에 대한 동일시의 기제가 나타나는 시기이다.","항문기: 양육자와의 상호작용과정에서 최초로 갈등을 경험하는 시기이다.","구강기: 자율성과 수치심을 주로 경험하는 시기이다.","생식기: 오이디푸스ㆍ엘렉트라 콤플렉스가 강해지는 시기이다.","잠복기: 리비도(libido)가 항문부위로 집중되는 시기이다."],"a":1},{"id":"21-1-5","y":2021,"g":1,"n":5,"t":"에릭슨 심리사회적 발달","f":"옳은 것 고르기","s":["에릭슨(E. Erikson)의 이론에 관한 설명으로 옳은 것은?"],"c":["발달에 영향을 미치는 유전적ㆍ생물학적 요인을 배제하였다.","발달에 영향을 미치는 사회적ㆍ문화적 요인을 인정하지않았다.","성인기 이후의 발달을 고려하지 않았다.","자아(ego)의 자율적, 창조적 기능을 고려하지 않았다.","과학적 근거나 경험적 증거가 미흡하다."],"a":5},{"id":"21-1-6","y":2021,"g":1,"n":6,"t":"융·아들러(분석심리·개인심리)","f":"옳은 것 모두 고르기","s":["융(C. Jung)의 이론에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 자기(Self)는 중년기 이후에 나타나는 원형(archetype)이다.","ㄴ. 과거의 사건 및 미래에 대한 열망이 성격발달에 동시에 영향을 미친다.","ㄷ. 리비도(libido)는 전반적인 삶의 에너지를 말한다.","ㄹ. 성격발달은 개성화를 통한 자기실현의 과정이다."],"c":["ㄴ","ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"21-1-7","y":2021,"g":1,"n":7,"t":"융·아들러(분석심리·개인심리)","f":"옳지 않은 것","s":["아들러(A. Adler)의 이론에 관한 설명으로 옳지 않은 것은?"],"c":["개인이 지닌 창조성과 주관성을 강조한다.","위기와 전념을 기준으로 생활양식을 4가지 유형으로 구분하였다.","열등감은 모든 인간이 지닌 보편적인 감정이다.","사회적 관심은 선천적으로 타고 나는 것이다.","개인이 추구하는 목표는 현실에서 검증하기 어려운 가상적 목표이다."],"a":2},{"id":"21-1-8","y":2021,"g":1,"n":8,"t":"행동주의·사회학습이론","f":"옳지 않은 것","s":["반두라(A. Bandura)의 이론에 관한 설명으로 옳지 않은 것은?"],"c":["학습은 사람, 환경 및 행동의 상호작용에 의해 이루어짐을 강조한다.","특정행동을 성공적으로 수행할 수 있다는 신념을 강조한다.","개인이 지닌 인지적 요인의 영향력을 강조한다.","관찰학습의 첫 번째 단계는 동기유발과정이며, 학습한 내용의 행동적 전환을 강조한다.","인간은 스스로 자신의 행동을 강화할 수 있음을 강조한다."],"a":4},{"id":"21-1-9","y":2021,"g":1,"n":9,"t":"행동주의·사회학습이론","f":"옳은 것 고르기","s":["스키너(B. Skinner)의 이론에 관한 설명으로 옳은 것은?"],"c":["행동조성(shaping)은 복잡한 행동의 점진적 습득을 설명하는 개념이다.","조작적 행동보다 반응적 행동을 강조한다.","변동간격계획은 평균적으로 일정한 수의 반응이 일어난후에 강화물을 제공하는 것을 말한다.","인간행동은 인간이 지닌 자유의지의 결과이다.","부적 강화는 특정 행동의 빈도를 감소시키는 효과를 지닌다."],"a":1},{"id":"21-1-10","y":2021,"g":1,"n":10,"t":"인본주의(로저스·매슬로우)","f":"옳지 않은 것","s":["로저스(C. Rogers)의 이론에 관한 설명으로 옳지 않은 것은?"],"c":["개입 과정에서 상담가의 진실성 및 일치성을 강조하였다.","자아실현을 하는 사람을 완전히 기능하는 인간(fullyfunctioning person)이라는 용어로 정리하였다.","인간이 지닌 보편적ㆍ객관적 경험을 강조하였다.","무조건적 긍정적 관심과 수용을 강조하였다.","인간 본성이 지닌 낙관적이고 긍정적인 측면을 강조하였다."],"a":3},{"id":"21-1-11","y":2021,"g":1,"n":11,"t":"인본주의(로저스·매슬로우)","f":"옳지 않은 것","s":["매슬로우(A. Maslow)의 욕구이론에 관한 설명으로 옳지 않은 것은?"],"c":["생리적 욕구는 가장 하위 단계에 있는 욕구이다.","극소수의 사람들만이 자아실현을 달성할 수 있다.","자아실현의 욕구는 가장 상위단계에 있는 욕구이다.","상위단계의 욕구는 하위단계의 욕구가 완전히 충족된 이후에 나타난다.","인간의 욕구는 강도와 중요도에 따라 위계적으로 구성되어 있다."],"a":4},{"id":"21-1-12","y":2021,"g":1,"n":12,"t":"피아제 인지발달","f":"옳지 않은 것","s":["피아제(J. Piaget)가 제시한 인지발달의 촉진요인이 아닌 것은?"],"c":["성숙","애착 형성","평형화","물리적 경험","사회적 상호작용"],"a":2},{"id":"21-1-13","y":2021,"g":1,"n":13,"t":"체계이론·생태체계","f":"옳은 것 모두 고르기","s":["체계이론의 개념에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 균형(equilibrium): 환경과 상호작용하기 위하여 체계의 구조를 변화시키는 과정 또는 상태","ㄴ. 넥엔트로피(negentropy): 체계내부의 유용하지 않은 에너지가 감소되는 상태","ㄷ. 공유영역(interface): 두 개 이상의 체계가 공존하는 부분으로 체계 간의 교류가 일어나는 장소","ㄹ. 홀론(holon): 외부와의 상호작용으로 체계내의 에너지가 증가하는 현상 또는 상태"],"c":["ㄱ","ㄱ, ㄹ","ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"21-1-14","y":2021,"g":1,"n":14,"t":"체계이론·생태체계","f":"빈칸 채우기","s":["브론펜브레너(U. Bronfenbrenner)의 생태체계이론에 관한 설명이다. ( )의 내용으로 옳은 것은?","- ( ㄱ )는 개인이 참여하는 둘 이상의 미시체계 간의 상호작용으로서, 미시체계간의 연결망을 의미한다.","- ( ㄴ )는 개인이 직접 참여하고 있지는 않지만, 그 개인의 발달에 영향을 주는 사회적 환경을 의미한다."],"c":["ㄱ: 외체계, ㄴ: 중간체계","ㄱ: 미시체계, ㄴ: 외체계","ㄱ: 중간체계, ㄴ: 외체계","ㄱ: 미시체계, ㄴ: 중간체계","ㄱ: 중간체계, ㄴ: 미시체계"],"a":3},{"id":"21-1-15","y":2021,"g":1,"n":15,"t":"생애주기별 발달(태아~노년기)","f":"사례·제시문 판단","s":["다음이 설명하는 퀴블러 로스(E. Kübler-Ross)의 죽음과 상실에 대한 심리적 단계는?","요양병원에 입원하고 있는 A씨는 간암 말기 진단을 받았다. 그는 자신이 죽는다는 것을 인정하고, 가족들이 받게 될 충격을 최소화하기 위해 만남과 헤어짐, 죽음, 추억 등의 이야기를 나누며 시간을 보내고 있다."],"c":["부정(Denial)","분노(Rage and Anger)","타협(Bargaining)","우울(Depression)","수용(Acceptance)"],"a":5},{"id":"21-1-16","y":2021,"g":1,"n":16,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["태내기(수정-출산)에 관한 설명으로 옳지 않은 것은?(문제 오류로 가답안 발표시 4번이 답안으로 발표되었으나, 확정답안 발표시 전항 정답 처리 되었습니다. 여기서는 가답안인 4번을 누르면 정답 처리 됩니다.)"],"c":["성염색체 이상증세로는 클라인펠터 증후군(Klinefelter'ssyndrome), 터너증후군(Turner's syndrome)이 있다.","임산부의 심각하고 지속적인 불안은 높은 비율의 유산이나 난산, 조산, 저체중아 출산과 연관이 있다.","태아의 성장, 발육을 위하여 칼슘, 단백질, 철분, 비타민등을 충분히 섭취하여야 한다.","다운증후군은 47개의 염색체를 가짐으로 나타나는 증후군이다.","기형발생물질이란 태내발달에 영향을 미쳐 심각한 손상을 일으키는 환경적 매개물을 말한다."],"a":4},{"id":"21-1-17","y":2021,"g":1,"n":17,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["영아기(0-2세)에 관한 설명으로 옳지 않은 것은?"],"c":["양육자와의 애착형성은 사회ㆍ정서적 발달에 중요하다.","피아제(J. Piaget)의 감각운동기에 해당한다.","프로이트(S. Freud)의 구강기에 해당한다.","에릭슨(E. Erikson)의 자율성 대 수치심 단계에 해당한다.","제1성장 급등기라고 할 정도로 일생 중 신체적으로 급격한 성장이 일어난다."],"a":4},{"id":"21-1-18","y":2021,"g":1,"n":18,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["유아기(3-6세)에 관한 설명으로 옳지 않은 것은?"],"c":["프로이트(S. Freud)의 오이디푸스ㆍ엘렉트라 콤플렉스가나타나는 시기이다.","콜버그(L. Kohlberg)의 도덕발달단계에서는 보상 또는처벌회피를 위해 행동을 하는 시기이다.","에릭슨(E. Erikson)의 주도성 대 죄의식 단계에 해당한다.","성적 정체성(gender identity)이 발달하는 시기이다.","영아기(0-2세)에 비해 성장속도가 빨라지는 특성을 보인다."],"a":5},{"id":"21-1-19","y":2021,"g":1,"n":19,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 모두 고르기","s":["아동기(7-12세)에 관한 설명으로 옳은 것을 모두 고른 것은?(문제 오류로 가답안 발표시 3번이 답안으로 발표되었으나, 확정답안 발표시 전항 정답 처리 되었습니다. 여기서는 가답안인 3번을 누르면 정답 처리 됩니다.)","ㄱ. 보존개념을 획득한다.","ㄴ. 분류화·유목화가 가능하다.","ㄷ. 가설연역적 추리가 가능하다.","ㄹ. 자아정체감을 획득한다."],"c":["ㄱ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":3},{"id":"21-1-20","y":2021,"g":1,"n":20,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["청소년기(13-19세)의 성적 성숙에 관한 설명으로 옳은 것은?(문제 오류로 가답안 발표시 1번이 답안으로 발표되었으나, 확정답안 발표시 1번, 5번이 정답 처리 되었습니다. 여기서는 가답안인 1번을 누르면 정답 처리 됩니다.)"],"c":["성적 성숙에는 개인차가 있지만 발달의 순서는 일정하다.","여성은 난소에서 에스트로겐이 분비되어 초경, 가슴 발육, 음모, 겨드랑이 체모 등의 순으로 성적 성숙이 진행된다.","남성은 고환에서 분비되는 안드로겐의 영향으로 음모,고환과 음경 확대, 겨드랑이 체모, 수염 등의 순으로 성적 성숙이 진행된다.","일차성징은 성적성숙의 생리적 징후로서 여성의 가슴 발달과 남성의 넓은 어깨를 비롯하여 변성, 근육 발달 등의 변화가 나타나는 것을 말한다.","이차성징은 여성의 난소, 나팔관, 자궁, 질, 남성의 고환,음경, 음낭 등 생식을 위해 필요한 기관의 발달을 말한다."],"a":1},{"id":"21-1-21","y":2021,"g":1,"n":21,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["하비거스트(R. Havighurst)의 청년기(20-35세) 발달과업으로 옳지 않은 것은?"],"c":["배우자 선택","직장생활 시작","경제적 수입 감소에 따른 적응","사회적 집단 형성","직업의 준비와 선택"],"a":3},{"id":"21-1-22","y":2021,"g":1,"n":22,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["중년기(40-64세)에 관한 설명으로 옳지 않은 것은?"],"c":["혼(J. Horn)은 유동적 지능은 증가하는 반면, 결정적 지능은 감소한다고 하였다.","레빈슨(D. Levinson)은 성인 초기의 생애 구조에 대한평가, 중년기에 대한 가능성 탐구, 새로운 생애 구조 설계를 위한 선택 등을 과업으로 제시하였다.","굴드(R. Gould)는 46세 이후에 그릇된 가정을 모두 극복하고 진정한 자아를 찾는 시기라고 하였다.","에릭슨(E. Erikson)은 생산성 대 침체성의 시기라고 하였다.","융(C. Jung)은 중년기에 관한 구체적인 개념을 발전시킨학자이다."],"a":1},{"id":"21-1-23","y":2021,"g":1,"n":23,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["노년기(65세 이상)에 관한 설명으로 옳지 않은 것은?"],"c":["분리이론은 노년기를 노인 개인과 사회가 동시에 상호분리를 시작하는 시기로 보는 이론이다.","활동이론은 노년기를 잘 보내기 위해서는 은퇴와 같은종결되는 역할들을 대치할 수 있는 활동을 발견하는 것이 중요하다는 이론이다.","에릭슨(E. Erikson)은 노년기의 발달과제로 자아통합이중요하다고 주장하였다.","퀴블러 로스(E. Kübler-Ross)는 죽음과 상실에 대한 심리적 5단계를 제시하였다.","펙(R. Peck)의 발달과업이론은 생애주기를 중년기와 노년기로 구분하여 설명하였다."],"a":5},{"id":"21-1-24","y":2021,"g":1,"n":24,"t":"체계이론·생태체계","f":"옳은 것 고르기","s":["브론펜브레너(U. Bronfenbrenner)의 거시체계(macro system)에 관한 설명으로 옳은 것은?"],"c":["가족 체계를 구성하는 요소는 개인이다.","역사적ㆍ사회적ㆍ문화적 요인에 의해서 형성되고 수정되는 특성이 있다.","개인이 가장 밀접하게 상호작용하는 사회적ㆍ물리적 환경을 말한다.","개인, 가족, 이웃, 소집단, 문화를 의미한다.","인간의 삶과 행동에 일방적인 영향을 미친다."],"a":2},{"id":"21-1-25","y":2021,"g":1,"n":25,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["인생주기별 특징에 관한 설명으로 옳지 않은 것은?"],"c":["영아기(0-2세)에는 주 양육자와의 안정된 정서적 신뢰관계가 다른 사람이나 사물과의 관계를 형성하는데 영향을 미치고 이후의 사회적 발달의 밑바탕이 된다.","유아기(3-6세)는 사물을 정신적으로 표상할 수 있는 능력이 발달하여 가장놀이를 즐기며, 이는 사회정서 발달에 영향을 미친다.","아동기(7-12세)는 또래 친구들과 함께 많은 시간을 보내면서 정서 및 사회적 발달에 영향을 받아 도당기라고도 한다.","청소년기(13-19세)는 또래집단의 지지를 더 선호함으로써 부모로부터 독립하려는 경향을 보인다.","노년기(65세 이상)는 생물학적으로 노화를 경험하는 시기이면서 경제적으로 안정된 시기이므로 심리적 위기를 경험하지 않는다."],"a":5},{"id":"22-1-1","y":2022,"g":1,"n":1,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["인간발달의 원리에 관한 설명으로 옳지 않은 것은?"],"c":["발달에는 최적의 시기가 존재하지 않는다.","발달의 각 영역은 상호 밀접한 연관이 있다.","일정한 순서와 방향이 있어서 예측 가능하다.","대근육이 있는 중심부위에서 소근육의 말초부위 순으로발달한다.","연속적 과정이지만 발달의 속도는 일정하지 않다."],"a":1},{"id":"22-1-2","y":2022,"g":1,"n":2,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["인간발달 및 그 유사개념에 관한 설명으로 옳지 않은 것은?"],"c":["성장(growth)은 시간의 경과에 따라 나타나는 양적 변화이다.","성숙(maturation)은 환경과의 상호작용에 의한 사회적 발달이다.","학습(learning)은 경험이나 훈련의 결과로 나타나는 행동변화이다.","인간발달은 유전과 환경의 상호작용 결과이다.","인간발달은 상승적 변화와 하강적 변화를 모두 포함한다."],"a":2},{"id":"22-1-3","y":2022,"g":1,"n":3,"t":"생애주기별 발달(태아~노년기)","f":"사례·제시문 판단","s":["동갑 친구들 A∼C의 대화에서 알 수 있는 인간발달의 원리는?","A: 나는 50세가 되니 확실히 노화가 느껴져. 얼마 전부터 노안이 와서 작은 글씨를 읽기 힘들어.","B: 나는 노안은 아직 안 왔는데 흰머리가 너무 많아지네. A는 흰머리가 거의 없구나.","C: 나는 노안도 왔고 흰머리도 많아. 게다가 기억력도 예전 같지 않아."],"c":["발달에는 개인차가 있다.","발달의 초기단계가 일생에서 가장 중요하다.","발달은 학습에 따른 결과이다.","발달은 분화와 통합의 과정이다.","발달은 이전의 발달과업 성취에 기초하여 이루어진다."],"a":1},{"id":"22-1-4","y":2022,"g":1,"n":4,"t":"프로이트·정신분석·방어기제","f":"옳은 것 모두 고르기","s":["프로이트(S. Freud)의 정신분석이론에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 자아(ego)는 일차적 사고과정과 현실원칙을 따른다.","ㄴ. 잠복기에 원초아(id)는 약해지고 초자아(superego)는 강해진다.","ㄷ. 신경증적 불안은 자아의 욕구를 초자아가 통제하지 못하고 압도될 때 나타난다.","ㄹ. 방어기제는 외부세계의 요구로부터 스스로를 보호하고자 하는 무의식적 시도이다."],"c":["ㄷ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"22-1-5","y":2022,"g":1,"n":5,"t":"융·아들러(분석심리·개인심리)","f":"옳은 것 고르기","s":["융(C. Jung)의 분석심리이론에 관한 설명으로 옳은 것은?"],"c":["페르소나(persona)는 외부의 요구나 기대에 부응하는 과정에서 생긴 자아의 가면이라고 한다.","인간을 성(性)적 에너지인 리비도(libido)에 의해 지배되는수동적 존재로 보았다.","원형(archetype)이란 개인의 의식 속에 존재하는 유일한정신기관이다.","아니무스(animus)는 남성이 억압시킨 여성성이다.","자아의 기능에서 감각(sensing)과 직관(intuiting)은 이성을 필요로 하는 합리적 기능이다."],"a":1},{"id":"22-1-6","y":2022,"g":1,"n":6,"t":"융·아들러(분석심리·개인심리)","f":"옳지 않은 것","s":["아들러(A. Adler)의 개인심리이론에 관한 설명으로 옳지 않은 것은?"],"c":["지배형 생활양식은 사회적 관심은 낮으나 활동수준이 높은 유형이다.","개인이 궁극적으로 추구하는 목적은 가상적 목표이다.","인간은 목적론적 존재이다.","아동에 대한 방임은 병적 열등감을 초래할 수 있다.","사회적 관심은 선천적으로 타고나는 것이어서 의식적인개발과 교육이 필요하지 않다."],"a":5},{"id":"22-1-7","y":2022,"g":1,"n":7,"t":"행동주의·사회학습이론","f":"옳은 것 모두 고르기","s":["고전적 조건형성의 학습 원리에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 시간의 원리: 무조건자극보다 조건자극이 늦게 제공되어야 조건형성이 이루어진다.","ㄴ. 강도의 원리: 무조건자극에 대한 반응이 조건자극에 대한 반응보다 약해야 한다.","ㄷ. 일관성의 원리: 무조건자극과 조건자극은 조건이 형성될 때까지 지속적으로 제시되어야 한다.","ㄹ. 계속성의 원리: 자극과 반응 과정의 반복 횟수가 많을수록 조건형성이 잘 이루어진다."],"c":["ㄱ, ㄴ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ"],"a":3},{"id":"22-1-8","y":2022,"g":1,"n":8,"t":"행동주의·사회학습이론","f":"옳은 것 고르기","s":["스키너(B. Skinner)의 조작적 조건형성을 위한 강화 계획 중 '가변(변동)간격 강화'에 해당하는 사례는?"],"c":["정시 출근한 아르바이트생에게 매주 추가수당을 지급하여정시 출근을 유도한다.","어린이집에서 어린이가 규칙을 지킬 때마다 바로 칭찬해서 규칙을 지키는 행동이 늘어나도록 한다.","수강생이 평균 10회 출석할 경우 상품을 1개 지급하되,출석 5회 이상 15회 이내에서 무작위로 지급하여 성실한 출석을 유도한다.","영업사원이 판매 목표를 10%씩 초과 달성할 때마다 초과달성분의 3%를 성과급으로 지급하여 의욕을 고취한다.","1년에 6회 자체 소방안전 점검을 하되, 불시에 실시하여소방안전 관리를 철저히 하도록 장려한다."],"a":5},{"id":"22-1-9","y":2022,"g":1,"n":9,"t":"인본주의(로저스·매슬로우)","f":"옳은 것 모두 고르기","s":["로저스(C. Rogers)의 이론에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 인간의 주관적 경험을 강조하였다.","ㄴ. 공감과 지시적인 상담을 강조하였다.","ㄷ. 인간을 통합적 존재로 규정하였다.","ㄹ. 인간의 욕구발달단계를 제시하였다."],"c":["ㄱ","ㄱ, ㄷ","ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":2},{"id":"22-1-10","y":2022,"g":1,"n":10,"t":"인본주의(로저스·매슬로우)","f":"옳은 것 고르기","s":["매슬로우(A. Maslow)의 이론에 관한 설명으로 옳은 것은?"],"c":["대부분의 사람들이 자아실현의 욕구를 달성한다.","자존감의 욕구는 소속과 사랑의 욕구보다 상위단계의 욕구이다.","인간본성에 대해 비관적인 태도를 갖고 있다.","인간의 성격은 환경에 의해 수동적으로 결정된다.","무조건적인 긍정적 관심을 강조하였다."],"a":2},{"id":"22-1-11","y":2022,"g":1,"n":11,"t":"피아제 인지발달","f":"옳지 않은 것","s":["피아제(J. Piaget)의 인지발달이론에서 '전조작기'의 발달 특성으로 옳지 않은 것은?"],"c":["상징놀이를 한다.","비가역적 사고를 한다.","물활론적 사고를 한다.","직관에 의존해 판단한다.","다중 유목화의 논리를 이해한다."],"a":5},{"id":"22-1-12","y":2022,"g":1,"n":12,"t":"콜버그·도덕성 발달","f":"옳지 않은 것","s":["콜버그(L. Kohlberg)의 도덕성 발달 이론에 관한 설명으로 옳지 않은 것은?"],"c":["법과 질서 지향 단계는 인습적 수준에 해당한다.","피아제(J. Piaget)의 도덕성 발달 이론에 기초를 제공하였다.","전인습적 수준에서는 행동의 원인보다 결과에 따라 옳고그름을 판단한다.","보편적 윤리 지향 단계에서는 정의, 평등 등 인권적 가치와 양심적 행위를 지향한다.","도덕적 딜레마가 포함된 이야기를 아동, 청소년 등에게들려주고, 이야기 속 주인공의 행동에 대한 도덕적 판단과 그 근거를 질문한 후 그 응답에 따라 도덕성 발달 단계를 파악하였다."],"a":2},{"id":"22-1-13","y":2022,"g":1,"n":13,"t":"체계이론·생태체계","f":"옳지 않은 것","s":["사회체계이론의 주요개념에 관한 설명으로 옳지 않은 것은?"],"c":["넥엔트로피(negentropy)는 폐쇄체계가 지속되면 나타나는 현상이다.","항상성(homeostasis)은 비교적 안정적이며 지속적인 균형상태를 유지하기 위한 체계의 경향을 말한다.","시너지(synergy)는 체계 내부 간 혹은 외부와의 상호작용이 증가함으로써 체계 내에서 유용한 에너지양이 증가하는 현상이다.","경계(boundary)란 체계와 환경 혹은 체계와 체계 간을구분하는 일종의 테두리를 의미한다.","균형(equilibrium)은 외부체계로부터의 투입이 없어 체계의 구조변화가 거의 없이 고정된 평형상태를 의미한다."],"a":1},{"id":"22-1-14","y":2022,"g":1,"n":14,"t":"체계이론·생태체계","f":"옳지 않은 것","s":["생태체계이론에 관한 설명으로 옳지 않은 것은?"],"c":["인간은 목적 지향적이다.","적합성은 개인이 환경과 효과적으로 상호작용을 할 수있는 능력이다.","생활상의 문제는 전체 생활공간 내에서 이해해야 한다.","스트레스는 개인과 환경 간 상호교류에서의 불균형이 야기하는 현상이다.","환경 속의 인간을 강조한다."],"a":2},{"id":"22-1-15","y":2022,"g":1,"n":15,"t":"체계이론·생태체계","f":"옳은 것 고르기","s":["브론펜브레너(U. Bronfenbrenner)의 미시체계(micro system)에 관한 설명으로 옳은 것은?"],"c":["개인의 생활에 직접적으로 개입하지 않는다.","조직수준에서 영향을 미칠 수 있는 체계이다.","개인의 성장 시기에 따라 달라지며 상호호혜성에 기반을두는 체계이다.","개인의 발달에 영향을 미치는 부모의 직업, 자녀의 학교등을 중시한다.","개인이 사회관습과 유행을 통해 자신의 가치관을 표현한다."],"a":3},{"id":"22-1-16","y":2022,"g":1,"n":16,"t":"체계이론·생태체계","f":"옳은 것 고르기","s":["브론펜브레너(U. Bronfenbrenner)의 거시체계(macro system) 수준에서 학교폭력 피해 청소년에게 개입한 사례는?"],"c":["피해 청소년과 개별 상담을 실시한다.","피해 청소년의 성장사와 가족력 등을 파악한다.","피해 청소년 부모의 근무 환경, 소득 등을 살펴본다.","피해 청소년이 다시 피해를 입지 않도록 학교폭력에 대한 처벌을 강화하는 특별법을 제정한다.","피해 청소년의 부모, 교사, 사회복지사가 함께 피해 청소년 보호를 위한 구체적 방법을 정기적으로 의논한다."],"a":4},{"id":"22-1-17","y":2022,"g":1,"n":17,"t":"사회환경(가족·집단·조직·문화·지역사회)","f":"옳지 않은 것","s":["문화에 관한 설명으로 옳지 않은 것은?"],"c":["사회체계로서 중간체계에 해당된다.","사회구성원들 간에 공유된다.","문화변용은 둘 이상의 문화가 지속적으로 접촉하여 한쪽이나 양쪽에 변화가 일어나는 현상이다.","세대 간에 전승되며 축적된다.","사회화에 대한 지침을 제공한다."],"a":1},{"id":"22-1-18","y":2022,"g":1,"n":18,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["태내기(수정-출산)에 유전적 요인으로 인해 발생할 수 있는 장애에 관한 설명으로 옳은 것은?"],"c":["다운증후군은 지능 저하를 동반하지 않는다.","헌팅톤병은 열성 유전인자 질병으로서 단백질의 대사장애를 일으킨다.","클라인펠터증후군은 X염색체를 더 많이 가진 남성에게나타난다.","터너증후군은 Y염색체 하나가 더 있는 남성에게 나타난다.","혈우병은 여성에게만 발병한다."],"a":3},{"id":"22-1-19","y":2022,"g":1,"n":19,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["유아기(3-6세)에 관한 설명으로 옳지 않은 것은?"],"c":["영아기(0-2세)보다 성장속도가 느려진다.","성역할의 내면화가 이루어진다.","오로지 자신의 관점에 비추어 타인의 감정이나 사고를예측하는 경향이 있다.","피아제(J. Piaget)의 형식적 조작기에 해당한다.","전환적 추론이 가능하다."],"a":4},{"id":"22-1-20","y":2022,"g":1,"n":20,"t":"에릭슨 심리사회적 발달","f":"옳은 것 고르기","s":["에릭슨(E. Erickson)의 심리사회이론에서 아동기(7-12세) 발달과업을 성취하지 못할 경우 경험하는 심리사회적 위기는?"],"c":["불신감","절망감","침체감","고립감","열등감"],"a":5},{"id":"22-1-21","y":2022,"g":1,"n":21,"t":"피아제 인지발달","f":"옳지 않은 것","s":["엘킨드(D. Elkind)가 제시한 청소년기(13-19세) 자기중심성(egocentrism)에 관한 내용으로 옳지 않은 것은?","리라 믿는다."],"c":["다른 사람이 경험하는 위기가 자신에게는 일어나지 않으","상상적 관중을 의식하여 작은 실수에 대해서도 번민한다.","자신의 감정이나 경험이 매우 특별하다고 생각한다.","자신과 타인에 대해 객관적으로 이해하고 판단한다.","자신이 타인으로부터 집중적인 관심의 대상이 된다고 믿는다."],"a":4},{"id":"22-1-22","y":2022,"g":1,"n":22,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["청년기(20-35세)에 관한 설명으로 옳지 않은 것은?"],"c":["자기 부양 능력을 갖추어야 하는 시기이다.","자아정체감 형성이 주요 발달 과제인 시기이다.","부모로부터 심리적, 경제적으로 독립하여 자율성을 성취하는 시기이다.","개인적 욕구와 사회적 욕구 사이에 균형을 찾아 직업을선택하는 시기이다.","타인과의 관계에서 친밀감을 형성하면서 결혼과 부모됨을 고려하는 시기이다."],"a":2},{"id":"22-1-23","y":2022,"g":1,"n":23,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["중년기(40-64세)에 관한 설명으로 옳은 것은?"],"c":["펙(R. Peck)은 신체 중시로부터 신체 초월을 중년기의중요한 발달과제로 보았다.","결정성(crystallized) 지능은 감소하고 유동성(fluid) 지능은 증가한다.","융(C. Jung)에 따르면, 외부세계에 쏟았던 에너지를 자신의 내부에 초점을 두며 개성화의 과정을 경험한다.","여성은 에스트로겐의 분비가 감소되고 남성은 테스토스테론의 분비가 증가된다.","갱년기는 여성만이 경험하는 것으로 신체적 변화와 동시에 우울, 무기력감 등 심리적 증상을 동반한다."],"a":3},{"id":"22-1-24","y":2022,"g":1,"n":24,"t":"행동주의·사회학습이론","f":"옳은 것 고르기","s":["다음 학자와 그의 주요 기법이 옳게 연결된 것은?"],"c":["반두라(A. Bandura) - 행동조성","로저스(C. Rogers) - 타임아웃","스키너(B. Skinner) - 모델링","피아제(J. Piaget) - 가족조각","프로이트(S. Freud) - 자유연상"],"a":5},{"id":"22-1-25","y":2022,"g":1,"n":25,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 모두 고르기","s":["생애주기에 따른 주요 발달과업의 연결이 옳은 것을 모두 고른 것은?","ㄱ. 영아기(0-2세) - 신뢰감, 애착형성","ㄴ. 청소년기(13-19세) - 생산성, 서열화","ㄷ. 노년기(65세 이상) - 자아통합, 죽음수용"],"c":["ㄱ","ㄴ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ"],"a":4},{"id":"23-1-1","y":2023,"g":1,"n":1,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["인간발달에 관한 설명으로 옳지 않은 것은?"],"c":["영아기에서 노년기까지 시간 흐름의 과정이다.","일정한 순서와 방향성이 있어 예측이 가능하다.","생애 전 과정에 걸쳐 진행되는 환경적, 유전적 상호작용의 결과이다.","각 발달단계별 인간행동의 특성이 있다.","발달에는 개인차가 있다."],"a":1},{"id":"23-1-2","y":2023,"g":1,"n":2,"t":"체계이론·생태체계","f":"옳지 않은 것","s":["생태체계이론의 유용성에 관한 설명으로 옳지 않은 것은?"],"c":["문제에 대한 총체적 이해와 조망을 제공한다.","각 체계들로부터 다양하고 객관적인 정보획득이 용이하다.","각 환경 수준별 개입의 근거를 제시한다.","구체적인 방법과 기술 제시에는 한계가 있다.","개인보다 가족, 집단, 공동체 등의 문제에 적용하는데 유용하다."],"a":5},{"id":"23-1-3","y":2023,"g":1,"n":3,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["인간발달이론과 사회복지실천에 관한 설명으로 옳지 않은 것은?"],"c":["다양한 연령층의 클라이언트와 일할 수 있는 토대가 된다.","발달단계별 욕구를 기반으로 사회복지서비스를 개발할 수있다.","발달단계별 발달과제는 문제해결의 목표와 방법 설정에유용하다.","발달단계별 발달 저해 요소들을 이해하는데 유용하다.","인간발달이론은 문제 사정단계에서만 유용하다."],"a":5},{"id":"23-1-4","y":2023,"g":1,"n":4,"t":"체계이론·생태체계","f":"옳은 것 고르기","s":["생태체계이론의 주요 개념에 관한 설명으로 옳은 것은?"],"c":["시너지는 폐쇄체계 내에서 체계 구성요소들 간 유용한 에너지의 증가를 의미한다.","엔트로피는 체계 내 질서, 형태, 분화 등이 정돈된 상태이다.","항상성은 모든 사회체계의 기본 속성으로 체계의 목표와정체성을 유지하려는 의도적 노력에 의해 수정된다.","피드백은 체계의 순환적 성격을 반영하는 개념으로 안정상태를 유지하는데 필요하다.","적합성은 인간의 적응욕구와 환경자원의 부합정도로서 특정 발달단계에서 성취된다."],"a":4},{"id":"23-1-5","y":2023,"g":1,"n":5,"t":"에릭슨 심리사회적 발달","f":"옳지 않은 것","s":["에릭슨(E. Erikson)의 이론으로 옳지 않은 것은?"],"c":["개인의 성격은 전 생애를 통하여 발달한다.","청소년기의 주요 발달과업은 자아정체감 형성이다.","각 단계의 발달은 이전 단계의 발달을 토대로 이루어진다.","성격발달에 있어서 환경과의 상호작용이 중요하다고 본다.","학령기(아동기)는 자율성 대 수치와 의심의 심리사회적 위기를 겪는다."],"a":5},{"id":"23-1-6","y":2023,"g":1,"n":6,"t":"프로이트·정신분석·방어기제","f":"사례·제시문 판단","s":["프로이트(S. Freud)의 정신분석이론에 관한 설명으로 옳은 것은?","타난다."],"c":["인간이 가진 자유의지의 중요성을 강조하였다.","거세불안과 남근선망은 주로 생식기(genital stage)에 나","성격구조를 원초아, 자아, 초자아로 구분하였다.","초자아는 현실원리에 지배되며 성격의 실행자이다.","성격의 구조나 발달단계를 제시하지 않았다."],"a":3},{"id":"23-1-7","y":2023,"g":1,"n":7,"t":"인본주의(로저스·매슬로우)","f":"옳지 않은 것","s":["매슬로우(A. Maslow)의 이론으로 옳지 않은 것은?"],"c":["인간에 대해 희망적이고 낙관적인 관점을 갖는다.","자아존중감의 욕구는 욕구 위계에서 가장 높은 단계이다.","일반적으로 욕구 위계서열이 높을수록 욕구의 강도가 낮다.","인간은 삶을 유지하려는 동기와 삶을 창조하려는 동기를가진다.","인간은 자아실현을 이루려고 노력하는 존재이다."],"a":2},{"id":"23-1-8","y":2023,"g":1,"n":8,"t":"행동주의·사회학습이론","f":"옳지 않은 것","s":["반두라(A. Bandura)의 사회학습이론의 주요 개념으로 옳지 않은 것은?"],"c":["모델이 관찰자와 유사할 때 관찰자는 모델을 더욱 모방하는 경향이 있다.","자신이 통제할 수 있는 보상을 자신에게 줌으로써 자기행동을 유지시키거나 개선시킬 수 있다.","학습은 사람, 환경 및 행동의 상호작용에 의해 이루어짐을 강조한다.","조작적 조건화에 의해 행동은 습득된다.","관찰학습은 주의집중과정→보존과정(기억과정)→운동재생과정→동기화과정을 통해 이루어진다."],"a":4},{"id":"23-1-9","y":2023,"g":1,"n":9,"t":"생애주기별 발달(태아~노년기)","f":"옳지 않은 것","s":["영아기(0-2세)에 관한 설명으로 옳지 않은 것은?"],"c":["인지발달은 감각기관과 운동기능을 통해 이루어지며 언어나 추상적 개념은 포함되지 않는다.","정서발달은 긍정적 정서를 표현하는 것에서 시작하여 점차 부정적 정서까지 표현하게 된다.","언어발달은 인지 및 사회성 발달과 밀접한 관련이 있다.","영아와 보호자 사이에 애착관계 형성이 중요하다.","낯가림이 시작된다."],"a":2},{"id":"23-1-10","y":2023,"g":1,"n":10,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["중년기(40-64세)에 관한 설명으로 옳은 것은?"],"c":["여성만이 우울, 무기력감 등 심리적 증상을 경험한다.","여성은 에스트로겐의 분비가 감소되고 남성은 테스토스테론의 분비가 증가된다.","인지적 반응속도가 최고조에 달한다.","외부세계에 쏟았던 에너지가 자신의 내부로 향한다.","친밀감 형성이 주요 과업이며 사회관계망이 축소된다."],"a":4},{"id":"23-1-11","y":2023,"g":1,"n":11,"t":"생애주기별 발달(태아~노년기)","f":"옳은 것 고르기","s":["유아기(3-6세)에 관한 설명으로 옳은 것은?"],"c":["남아는 오이디푸스 콤플렉스를 경험하고 여아는 엘렉트라 콤플렉스를 경험한다.","콜버그(L. Kohlberg)에 의하면 인습적 수준의 도덕성 발달단계를 보인다.","피아제의 구체적 조작기에 해당되며 상징적 사고가 가능하다.","인지발달은 상위 개념과 하위 개념을 구분하여 완전한수준의 분류능력을 보인다.","영아기에 비해 성장 속도가 빨라지며 지속적으로 성장한다."],"a":1},{"id":"23-1-12","y":2023,"g":1,"n":12,"t":"인본주의(로저스·매슬로우)","f":"사례·제시문 판단","s":["로저스(C. Rogers)의 인본주의 이론에 관한 설명으로 옳은","것을 모두 고른 것은?","ㄱ. 인간의 주관적 경험을 강조한다.","ㄴ. 인간은 자아실현경향을 가지고 있다.","ㄷ. 인간의 욕구발달단계를 제시했다.","ㄹ. 완전히 기능하는 사람은 자신의 경험에 개방적이다."],"c":["ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"23-1-13","y":2023,"g":1,"n":13,"t":"융·아들러(분석심리·개인심리)","f":"옳은 것 모두 고르기","s":["융(C. Jung)의 이론으로 옳은 것을 모두 고른 것은?","ㄱ. 무의식을 개인무의식과 집단무의식으로 구분하였다.","ㄴ. 그림자(shadow)는 인간에게 있는 동물적 본성을 포함하는 부정적인 측면이다.","ㄷ. 페르소나(persona)는 개인이 외부세계에 보여주는 이미지 혹은 가면이다.","ㄹ. 남성의 여성적 면은 아니무스(animus), 여성의 남성적 면은 아니마(anima)이다."],"c":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"23-1-14","y":2023,"g":1,"n":14,"t":"체계이론·생태체계","f":"옳은 것 고르기","s":["브론펜브레너(U. Bronfenbrenner)의 사회환경체계에 관한 설명으로 옳은 것은?"],"c":["문화, 정치, 교육정책 등 거시체계는 개인의 삶에 직접적이고 강력한 영향을 미친다.","인간을 둘러싼 사회환경을 미시체계, 중간체계, 내부체계, 거시체계로 구분했다.","중간체계는 상호작용하는 둘 이상의 미시체계 간의 관계로 구성된다.","내부체계는 개인이 직접 참여하거나 관여하지는 않으나개인에게 영향을 미치는 체계로 부모의 직장 등이 포함된다.","미시체계는 개인이 새로운 환경으로 이동할 때마다 형성되거나 확대된다."],"a":3},{"id":"23-1-15","y":2023,"g":1,"n":15,"t":"사회환경(가족·집단·조직·문화·지역사회)","f":"옳은 것 고르기","s":["집단에 관한 설명으로 옳은 것은?"],"c":["2차집단은 인간의 성격형성을 목적으로 한다.","개방집단은 구성원의 개별화와 일정 수준 이상의 심도깊은 목적 달성에 적합하다.","구성원의 상호작용이 중요하므로 최소 단위는 4인 이상이다.","형성집단은 특정 목적 없이 만들 수 있다.","집단활동을 통해 집단에 관한 정체성인 '우리의식'이 형성된다."],"a":5},{"id":"23-1-16","y":2023,"g":1,"n":16,"t":"사회환경(가족·집단·조직·문화·지역사회)","f":"옳은 것 고르기","s":["문화에 관한 설명으로 옳은 것은?"],"c":["선천적으로 습득된다.","개인행동에 대한 규제와 사회통제의 기능은 없다.","고정적이며 구체적이다.","다른 사회의 구성원과 구별되는 공통적 속성이 있다.","다양성은 차별을 의미한다."],"a":4},{"id":"23-1-17","y":2023,"g":1,"n":17,"t":"피아제 인지발달","f":"옳은 것 고르기","s":["피아제(J. Piaget)의 인지발달이론에 관한 설명으로 옳은 것은?"],"c":["전 생애의 인지발달을 다루고 있다.","문화적ㆍ사회경제적ㆍ인종적 차이를 고려하였다.","추상적 사고의 확립은 구체적 조작기의 특징이다.","인지는 동화와 조절의 과정을 통하여 발달한다.","전조작적 사고 단계에서 보존개념이 획득된다."],"a":4},{"id":"23-1-18","y":2023,"g":1,"n":18,"t":"행동주의·사회학습이론","f":"옳은 것 모두 고르기","s":["행동주의 이론에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 인간행동에 대한 환경의 결정력을 강조한다.","ㄴ. 강화계획은 행동의 반응 가능성을 증가시키고 유지시키기 위한 방법이다.","ㄷ. 행동조성(shaping)은 복잡한 행동의 점진적 습득을 설명하는 개념이다.","ㄹ. 고정간격 강화계획은 정해진 수의 반응이 일어난 후 강화를 주는 것이다."],"c":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ"],"a":5},{"id":"23-1-19","y":2023,"g":1,"n":19,"t":"사회환경(가족·집단·조직·문화·지역사회)","f":"옳지 않은 것","s":["다문화에 관한 설명으로 옳지 않은 것은?"],"c":["대표적인 사회문제로 인종차별이 있다.","다양한 문화를 수용하고 문화의 단일화를 지향한다.","서구화, 근대화, 세계화는 다문화의 중요성을 표면으로부상시켰다.","동화주의는 이민을 받는 사
