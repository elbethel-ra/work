다.\n\n프로이트가 리비도를 성적 에너지로 보았고, 융은 삶의 일반 에너지로 보았습니다. 원형은 집단무의식의 내용이고, 아니무스는 여성이 가진 남성성입니다. 감각과 직관은 비합리적 기능입니다."},"22-1-6":{"x":"아들러는 사회적 관심을 선천적 잠재력으로 보았지만, 의식적 개발과 교육을 통해 키워야 한다고 했습니다. 5번이 틀렸습니다."},"22-1-7":{"x":"일관성의 원리(ㄷ)와 계속성의 원리(ㄹ)는 맞습니다.\n\nㄱ은 틀렸습니다. 조건자극은 무조건자극보다 먼저 또는 동시에 주어져야 합니다. ㄴ도 틀렸습니다. 조건자극보다 무조건자극이 더 강해야 합니다."},"22-1-8":{"x":"가변(변동)간격 강화는 강화가 주어지는 시간 간격이 일정하지 않은 계획입니다. 불시에 점검하는 소방안전 점검이 해당합니다.\n\n1번은 고정간격, 2번은 연속강화, 3번은 변동비율, 4번은 고정비율에 가깝습니다."},"22-1-9":{"x":"로저스는 주관적 경험을 강조했고(ㄱ), 인간을 통합적 존재로 보았습니다(ㄷ).\n\n공감은 강조했지만 지시적 상담이 아니라 비지시적 상담이어서 ㄴ은 틀렸고, 욕구발달단계는 매슬로우의 이론이어서 ㄹ도 틀렸습니다."},"22-1-10":{"x":"매슬로우의 위계에서 자존감 욕구는 소속과 사랑 욕구보다 상위 단계입니다.\n\n자아실현은 소수만 달성하고, 인간 본성에 낙관적이며, 환경에 의한 수동적 결정은 행동주의 관점입니다. 무조건적 긍정적 관심은 로저스의 개념입니다."},"22-1-11":{"x":"다중 유목화(복합 분류)의 논리는 구체적 조작기에 이해할 수 있습니다. 전조작기의 특성이 아닙니다.\n\n전조작기에는 상징놀이, 비가역적 사고, 물활론적 사고, 직관적 판단이 나타납니다."},"22-1-12":{"x":"콜버그의 도덕성 발달 이론은 피아제의 도덕성 발달 이론을 확장·발전시킨 것입니다. '피아제 이론에 기초를 제공'했다는 설명은 방향이 반대입니다. 2번이 틀렸습니다."},"22-1-13":{"x":"넥엔트로피는 개방체계가 외부와 교류하며 질서와 에너지를 얻는 현상입니다. 폐쇄체계가 지속되면 나타나는 것은 엔트로피(무질서 증가)입니다. 1번이 틀렸습니다."},"22-1-14":{"x":"적합성은 인간의 욕구와 환경 자원이 부합하는 정도입니다. 개인이 환경과 효과적으로 상호작용하는 능력은 '유능성'에 가깝습니다. 2번이 틀렸습니다."},"22-1-15":{"x":"미시체계는 개인이 직접 경험하는 환경(가족·학교·또래)이며, 성장 시기에 따라 달라지고 상호호혜적 관계가 이루어집니다.\n\n개인 생활에 직접 영향을 주며, 부모의 직업은 외체계, 사회관습·유행은 거시체계의 예입니다."},"22-1-16":{"x":"학교폭력 처벌을 강화하는 특별법을 제정하는 것은 사회 전체의 제도·정책을 바꾸는 거시체계 수준의 개입입니다.\n\n1번은 개인, 2번은 미시체계, 3번은 외체계, 5번은 중간체계(체계 간 연결)에 해당합니다."},"22-1-17":{"x":"문화는 중간체계가 아니라 거시체계에 해당합니다. 1번이 틀렸습니다."},"22-1-18":{"x":"클라인펠터증후군은 남성이 X염색체를 하나 더 가진(XXY) 경우입니다.\n\n다운증후군은 지능 저하를 동반하고, 헌팅톤병은 우성 유전질환이며, 터너증후군은 X염색체가 하나 부족한 여성(XO)에게 나타납니다. 혈우병은 주로 남성에게 나타납니다."},"22-1-19":{"x":"유아기(3~6세)는 피아제의 전조작기입니다. 형식적 조작기는 청소년기입니다. 4번이 틀렸습니다."},"22-1-20":{"x":"에릭슨의 아동기(근면성 대 열등감) 과업을 성취하지 못하면 열등감을 경험합니다.\n\n불신감은 영아기, 침체감은 중년기, 고립감은 청년기, 절망감은 노년기의 위기입니다."},"22-1-21":{"x":"엘킨드가 말한 청소년기 자기중심성은 상상적 청중과 개인적 우화입니다. 자신과 타인을 객관적으로 판단한다는 설명은 반대입니다. 4번이 틀렸습니다."},"22-1-22":{"x":"자아정체감 형성은 청소년기의 주요 과제입니다. 청년기의 주요 과업은 친밀감 형성, 직업 선택, 독립 등입니다. 2번이 틀렸습니다."},"22-1-23":{"x":"융은 중년기에 외부로 쏟던 에너지를 내면으로 돌리며 개성화를 경험한다고 했습니다.\n\n펙은 중년기에 신체 중시에서 신체 초월이 아니라 지혜 중시로의 전환 등을 제시했습니다(신체 초월은 노년기). 결정성 지능은 유지되고 유동성 지능이 감소하며, 남성은 테스토스테론이 감소합니다. 갱년기는 남성도 경험합니다."},"22-1-24":{"x":"프로이트의 대표 기법은 자유연상입니다.\n\n행동조성은 스키너, 타임아웃은 행동주의 기법, 모델링은 반두라, 가족조각은 가족치료(사티어)의 기법입니다."},"22-1-25":{"x":"영아기의 신뢰감·애착형성(ㄱ)과 노년기의 자아통합·죽음수용(ㄷ)이 맞습니다.\n\n생산성은 중년기, 서열화는 아동기(구체적 조작기)의 특징입니다."},"23-1-1":{"x":"인간발달은 영아기뿐 아니라 태내기부터 노년기, 죽음까지 전 생애에 걸친 과정입니다. 영아기에서 시작한다는 설명은 틀렸습니다."},"23-1-2":{"x":"생태체계이론은 환경 속 인간을 이해하는 틀이어서 개인 문제에도 폭넓게 적용합니다. 개인보다 가족·집단·공동체에 적용하는 데에만 유용하다는 설명은 틀렸습니다."},"23-1-3":{"x":"인간발달이론은 사정 단계뿐 아니라 목표 설정, 개입, 평가 등 실천 전 과정에서 유용합니다. 5번이 틀렸습니다."},"23-1-4":{"x":"피드백은 체계의 순환적 성격을 반영하며, 안정상태(항상성) 유지에 필요합니다.\n\n시너지는 개방체계의 특성이고, 엔트로피는 무질서 증가, 항상성은 의도적 노력 없이 작동하며 목표 유지를 위한 의도적 수정과는 다릅니다. 적합성은 특정 발달단계에서만 성취되는 것이 아닙니다."},"23-1-5":{"x":"에릭슨의 학령기(아동기)는 근면성 대 열등감의 위기를 겪습니다. 자율성 대 수치심과 의심은 유아기(2~4세)의 위기입니다."},"23-1-6":{"x":"프로이트는 성격구조를 원초아, 자아, 초자아로 구분했습니다.\n\n그는 결정론을 취해 자유의지를 강조하지 않았고, 거세불안은 남근기에 나타납니다. 현실원리에 지배되는 성격의 실행자는 자아이며, 발달단계도 제시했습니다."},"23-1-7":{"x":"매슬로우의 위계에서 가장 높은 단계는 자아실현의 욕구입니다. 자아존중감(존경) 욕구는 4단계입니다. 2번이 틀렸습니다."},"23-1-8":{"x":"행동이 조작적 조건화에 의해 습득된다는 것은 스키너의 관점입니다. 반두라는 관찰학습과 인지 요인을 강조했습니다. 4번이 틀렸습니다."},"23-1-9":{"x":"영아의 정서는 흥분 상태에서 불쾌와 쾌로 분화되고 점차 기쁨, 분노, 공포 등으로 세분화됩니다. 긍정적 정서에서 시작해 부정적 정서로 나아간다는 서술은 틀렸습니다.\n\n감각운동기에는 언어와 추상적 개념이 포함되지 않고, 언어발달은 인지·사회성과 밀접하며, 애착 형성과 낯가림이 나타납니다."},"23-1-10":{"x":"중년기에는 외부세계에 쏟던 에너지가 자신의 내부로 향합니다(융의 개성화).\n\n심리적 증상은 남성도 겪고, 남성도 테스토스테론이 감소합니다. 인지적 반응 속도는 감소하며, 친밀감 형성은 청년기의 과업입니다."},"23-1-11":{"x":"유아기(남근기)에는 남아는 오이디푸스 콤플렉스, 여아는 엘렉트라 콤플렉스를 경험합니다.\n\n유아기는 콜버그의 전인습적 수준이고, 피아제의 전조작기이며, 분류 능력은 아직 불완전합니다. 성장 속도는 영아기보다 느려집니다."},"23-1-12":{"x":"로저스는 주관적 경험을 강조했고(ㄱ), 자아실현경향을 인간의 기본 동기로 보았으며(ㄴ), 완전히 기능하는 사람은 경험에 개방적이라고 했습니다(ㄹ).\n\n욕구발달단계는 매슬로우의 이론이어서 ㄷ은 틀렸습니다."},"23-1-13":{"x":"융은 무의식을 개인무의식과 집단무의식으로 구분했고(ㄱ), 그림자는 동물적 본성을 포함한 부정적 측면이며(ㄴ), 페르소나는 외부에 보여주는 가면입니다(ㄷ).\n\n남성의 여성적 면은 아니마, 여성의 남성적 면은 아니무스여서 ㄹ은 반대로 서술했습니다."},"23-1-14":{"x":"중간체계는 상호작용하는 둘 이상의 미시체계 간의 관계입니다.\n\n거시체계는 간접적으로 영향을 줍니다. 체계는 미시·중간·외체계·거시체계로 나뉘며 '내부체계'는 없습니다. 개인이 직접 관여하지 않지만 영향을 주는 부모의 직장은 외체계이고, 새 환경으로 이동할 때 형성되는 것은 중간체계입니다."},"23-1-15":{"x":"집단활동을 통해 집단에 대한 정체성인 '우리의식'이 형성됩니다.\n\n성격형성을 목적으로 하는 것은 1차 집단이고, 개방집단은 구성원의 개별화와 깊이 있는 목적 달성에는 불리합니다. 집단의 최소 단위를 4인 이상으로 보는 것은 틀렸고, 형성집단은 목적을 가지고 인위적으로 만든 집단입니다."},"23-1-16":{"x":"문화는 한 사회 구성원이 공유하여 다른 사회 구성원과 구별되는 공통된 속성이 있습니다.\n\n문화는 후천적으로 학습되고, 규제와 사회통제의 기능이 있으며, 변화하는 것이고, 다양성은 차별이 아니라 차이를 뜻합니다."},"23-1-17":{"x":"피아제는 인지가 동화와 조절을 통해 발달한다고 보았습니다.\n\n그의 이론은 주로 아동기에서 청소년기까지를 다루고, 문화·사회경제적 차이를 충분히 고려하지 않았다는 비판을 받습니다. 추상적 사고는 형식적 조작기, 보존개념은 구체적 조작기에 획득됩니다."},"23-1-18":{"x":"행동주의는 환경의 결정력을 강조하고(ㄱ), 강화계획은 반응 가능성을 높이고 유지시키는 방법이며(ㄴ), 행동조성은 복잡한 행동의 점진적 습득을 설명합니다(ㄷ).\n\nㄹ의 '정해진 수의 반응 후 강화'는 고정간격이 아니라 고정비율 강화계획입니다."},"23-1-19":{"x":"다문화는 다양한 문화를 수용하고 상호 존중하는 것으로, 문화의 단일화를 지향하지 않습니다. 단일화 지향은 동화주의에 가깝습니다. 2번이 틀렸습니다."},"23-1-20":{"x":"노년기에는 사고의 융통성이 감소하고 경직되는 경향이 있습니다. 2번이 틀렸습니다.\n\n자신의 삶을 수용하는 것이 주요 과업이고, 회상과 친근한 사물에 대한 애착, 내향성이 증가하며, 치매 가능성도 높아집니다."},"23-1-21":{"x":"입 부근에 부드러운 자극을 주면 그쪽으로 입을 벌리는 것은 찾기반사(탐색반사)입니다. 바빈스키반사는 발바닥을 자극하면 발가락이 부채처럼 펴지는 반사입니다. 1번이 틀렸습니다."},"23-1-22":{"x":"친밀감 형성은 청년기의 주요 과업입니다. 청소년기의 과업은 자아정체감 형성입니다."},"23-1-23":{"x":"아동기에는 조합기술로 사칙연산이 가능해지고(ㄴ), 객관적·논리적 사고가 가능해지며(ㄷ), 정서 통제와 분화된 표현이 가능해집니다(ㄹ).\n\n제1반항기는 유아기(2~4세)이고, 타인의 입장을 고려하지 못하는 것은 자기중심적 사고를 보이는 유아기의 특징입니다."},"23-1-24":{"x":"유아기에 성역할을 인식하기 시작하고(ㄱ), 청년기에 신체 기능이 정점에 달하며(ㄷ), 노년기에는 장기기억보다 단기기억이 먼저 더 많이 감퇴합니다(ㄹ).\n\n자기중심성은 아동기가 아니라 유아기의 특징입니다(ㄴ)."},"23-1-25":{"x":"이상행동의 진단분류체계로는 DSM뿐 아니라 ICD(국제질병분류)도 있습니다. 'DSM이 유일하다'는 설명이 틀렸습니다."},"24-1-1":{"x":"스키너는 행동이 환경과 강화에 의해 결정된다고 보았고, 인지와 정서는 중요하게 다루지 않았습니다. 인지와 정서의 중요성을 이해하게 한 것은 반두라의 사회학습이론 등입니다. 1번이 틀렸습니다."},"24-1-2":{"x":"인간발달은 순서대로 진행되고 예측 가능하다는 특징이 있습니다.\n\n발달은 상승적 변화와 퇴행적 변화를 모두 포함하고, 개인차가 중요하며, 키·몸무게는 양적 변화이고 인지·정서는 질적 변화입니다. 발달 속도는 일정하지 않습니다."},"24-1-3":{"x":"베리의 이론에서 고유문화와 새 문화를 모두 존중하는 상태는 통합입니다. 동화는 고유문화를 버리고 새 문화를 받아들이는 것입니다. 3번이 틀렸습니다."},"24-1-4":{"x":"인간의 창조성과 자아실현을 강조하는 것은 인본주의(로저스·매슬로우)입니다. 스키너는 환경이 행동을 결정하며 예측과 통제가 가능하다고 보았습니다."},"24-1-5":{"x":"로저스의 핵심 개념은 자기실현 경향성(ㄱ)입니다.\n\n비합리적 신념은 엘리스, 행동조성은 스키너, 집단무의식은 융의 개념입니다. 벡은 인지치료에서 자동적 사고와 인지 오류를 다뤘습니다."},"24-1-6":{"x":"아들러는 인간을 스스로 목표를 세우고 추구하는 목표지향적(목적론적) 존재로 보았습니다.\n\n점성원리는 에릭슨의 이론이고, 아들러는 창조성을 강조했으며, 무의식적 결정론은 프로이트의 입장입니다. 유전·환경 요인도 인정했습니다."},"24-1-7":{"x":"주도성 대 죄의식의 성취 덕목은 목적(purpose)입니다.\n\n근면성 대 열등감은 능력, 신뢰 대 불신은 희망, 자율성 대 수치심은 의지, 정체감 대 정체감 혼란은 성실(충성)입니다."},"24-1-8":{"x":"로저스는 조건적이 아니라 무조건적 긍정적 관심이 잠재력 실현에 중요하다고 강조했습니다. 1번이 틀렸습니다."},"24-1-9":{"x":"융은 개성화를 통한 자기실현 과정을 중요시했습니다.\n\n정신분석은 프로이트의 이론이고, 사회적 관심과 활동수준으로 유형을 나눈 것은 아들러입니다. 융은 인생을 전반기와 후반기로 나누어 발달을 설명했고, 창조적 자기는 아들러의 개념입니다."},"24-1-10":{"x":"반두라는 신념·기대 같은 인지적 요인을 중요시했고(ㄱ), 대리적 강화를 강조했습니다(ㄴ).\n\n자기효능감을 높이는 가장 효과적인 방법은 대리경험이 아니라 성취경험이어서 ㄷ은 틀렸습니다. 자기강화는 외부 강화가 아닌 스스로 주는 강화여서 ㄹ도 틀렸습니다."},"24-1-11":{"x":"낮은 성적의 이유를 교수 탓으로 돌리는 것은 투사나 합리화에 가깝습니다. 전치는 감정의 대상을 안전한 다른 대상으로 옮기는 것입니다. 5번이 틀렸습니다."},"24-1-12":{"x":"추상적 사고는 구체적 조작기가 아니라 형식적 조작기에 가능합니다. 4번이 틀렸습니다."},"24-1-13":{"x":"중간체계는 미시체계 간의 상호작용에 초점을 둡니다.\n\n개인이 직접 대면하는 체계는 미시체계이고, 신념·태도·전통은 거시체계, 문화·정치·법·종교도 거시체계입니다. 가족과 집단은 대표적 미시체계입니다."},"24-1-14":{"x":"지역사회는 공동체적 특징(ㄱ), 사회통제 기능(ㄴ), 지식과 가치 전달 기능(ㄷ)을 가집니다.\n\nㄹ은 틀렸습니다. 체계는 외부와 상호작용하면서 엔트로피가 아니라 넥엔트로피(질서) 상태를 유지하려 합니다."},"24-1-15":{"x":"전 생애에 걸친 변화와 사회역사적 환경, 시간 경과에 따른 사건의 누적 영향을 포함하는 것은 시간체계입니다."},"24-1-16":{"x":"한 체계의 일부가 변하면 나머지 부분도 변하게 되는 상호 영향을 호혜성이라고 합니다. 간부 교체가 조직과 직원 역할 변화로 이어지는 사례가 그 예입니다."},"24-1-17":{"x":"영아기는 에릭슨의 신뢰 대 불신 단계로, 주 양육자와의 관계가 중요합니다.\n\n전인습적 도덕기는 유아기, 보존개념은 아동기, 거세불안은 남근기, 생활양식 형성은 아들러의 개념입니다."},"24-1-18":{"x":"비가역적 사고는 피아제의 전조작기(유아기) 특성입니다. 청소년기는 형식적 조작기여서 4번이 틀렸습니다."},"24-1-19":{"x":"유아기(3~6세)의 성장 속도는 영아기보다 느려집니다. 3번이 틀렸습니다."},"24-1-20":{"x":"청년기는 직업 준비와 직업선택에 대한 의사결정을 하는 시기입니다.\n\n근면성은 아동기, 경제적 안정과 높은 지위는 중년기, 빈둥지 증후군도 중년기, 또래와의 상호작용으로 자아개념이 발달하는 것은 청소년기 이전의 특성입니다."},"24-1-21":{"x":"자아정체감 확립은 청소년기의 과업입니다. 아동기의 과업은 근면성과 또래 관계 등입니다. 2번이 틀렸습니다."},"24-1-22":{"x":"배아는 외배엽, 중배엽, 내배엽으로 이루어집니다. 폐·간·소화기관을 형성하는 것은 내배엽입니다. 외배엽은 신경계와 피부를 형성합니다. 5번이 틀렸습니다."},"24-1-23":{"x":"에릭슨에 의하면 생산성 대 침체를 극복하면 돌봄(care)의 덕목을 갖춥니다.\n\n유동성 지능은 중년기에 감소하고, 자아통합은 노년기의 과제입니다. 갱년기는 남성도 경험하며, 아니마·아니무스 설명은 반대입니다."},"24-1-24":{"x":"아동기는 프로이트의 잠재기(ㄱ), 피아제의 보존·분류·유목화·서열화 획득기(ㄴ), 콜버그의 인습적 수준으로 옮겨가는 시기(ㄷ)입니다.\n\n주도성 대 죄의식은 유아기이고, 아동기는 근면성 대 열등감입니다."},"24-1-25":{"x":"다중종결성은 같은 출발점에서도 서로 다른 결과에 이를 수 있다는 개념입니다. 서로 다른 경로로 같은 결과에 도달하는 것은 등종결성입니다. 4번이 틀렸습니다."},"25-1-1":{"x":"인간발달이론은 발달단계별 욕구를 파악하는 데 유용해, 이를 기반으로 사회복지서비스를 개발할 수 있습니다.\n\n사정 단계에만 유용한 것은 아니고, 환경의 영향력 평가도 가능하며, 생물학적 요소보다 사회환경을 함께 고려합니다. 발달과업은 개인에 따라 다르게 이해해야 합니다."},"25-1-2":{"x":"성숙은 경험이나 훈련과 관계없이 유전적 청사진에 따라 진행되는 발달입니다.\n\n발달에는 최적(결정적) 시기가 있고, 순서와 방향이 있어 예측이 가능하며, 중심에서 말초(대근육에서 소근육)로 진행됩니다. 성장은 양적 증가를 뜻합니다."},"25-1-3":{"x":"행동주의는 관찰 가능한 행동과 환경의 영향을 강조하고, 무의식을 강조하지 않습니다. 무의식을 강조하는 것은 정신분석입니다."},"25-1-4":{"x":"아들러의 개인심리이론의 핵심 개념은 생활양식입니다.\n\n동화는 피아제, 열등감은 아들러, 결핍동기는 매슬로우, 아니마는 융의 개념입니다. 학자와 개념의 연결이 서로 뒤섞여 있습니다."},"25-1-5":{"x":"행동주의는 선행조건과 결과에 따라 행동이 형성된다고 보고(ㄷ), 경험주의에 근거해 관찰 가능한 행동에 초점을 둡니다(ㄹ).\n\n주관적 존재로 보거나 자유의지를 강조하는 것은 인본주의입니다."},"25-1-6":{"x":"부적강화는 혐오자극을 제거해 바람직한 행동의 빈도를 증가시킵니다. 빈도를 감소시키는 것은 처벌입니다."},"25-1-7":{"x":"성격유형을 태도(내향·외향)와 기능(사고·감정·감각·직관)의 조합으로 구분한 것은 융입니다. 아들러는 생활양식 유형을 제시했습니다."},"25-1-8":{"x":"심리적 갈등이 신체나 근육 증상으로 나타나는 것은 전환입니다. 내면화(내사)는 타인의 가치나 태도를 자기 것으로 받아들이는 방어기제입니다. 3번이 틀렸습니다."},"25-1-9":{"x":"욕구발달단계(욕구위계)를 제시한 것은 매슬로우입니다. 로저스는 제시하지 않았습니다."},"25-1-10":{"x":"물활론적 사고는 전조작기의 특성입니다. 구체적 조작기에는 논리적 사고, 보존개념 획득, 서열화, 탈중심화가 가능합니다."},"25-1-11":{"x":"매슬로우는 인간 본성이 본래 선하고 성장하려는 경향이 있다고 보았습니다.\n\n무의식은 프로이트, 환경결정론은 행동주의, 열등감 극복은 아들러, 모방학습은 반두라의 강조점입니다."},"25-1-12":{"x":"생태체계이론은 단선적이 아니라 순환적 인과관계를 중시합니다. 5번이 틀렸습니다."},"25-1-13":{"x":"엔트로피는 폐쇄체계에서 주로 나타나고(ㄱ), 체계의 속성은 경계의 개방성과 침투성에 따라 결정됩니다(ㄷ).\n\n항상성은 혼란이 아니라 안정을 유지하려는 경향이고(ㄴ), 균형은 외부 교류가 적은 폐쇄체계에서 주로 나타납니다(ㄹ)."},"25-1-14":{"x":"후인습적 수준은 법과 규칙이 사회질서 유지에 필요하지만 민주적 절차를 통해 바뀔 수 있다고 보는 사회계약 단계를 포함합니다.\n\n사회적 인정을 구하는 것은 인습적 수준(착한 아이), 보상·처벌에 따른 판단은 전인습적 수준, 규칙 준수와 질서 유지는 인습적 수준(법과 질서)입니다."},"25-1-15":{"x":"정부의 입법과 사회정책, 방송매체를 통한 유행처럼 사회 전반의 제도와 문화적 환경은 거시체계입니다."},"25-1-16":{"x":"중간체계는 미시체계들 간의 관계입니다. 부모와 교사의 관계가 그 예입니다.\n\n가족·친구·학교는 미시체계, 학교위원회는 외체계, 신념·태도·전통은 거시체계, 출생 시대에 대한 관심은 시간체계입니다."},"25-1-17":{"x":"미시체계는 인간이 가장 밀접하게 상호작용하는 환경입니다(ㄱ).\n\nㄴ은 시간체계, ㄷ은 외체계에 대한 설명입니다."},"25-1-18":{"x":"애착관계 형성은 영아기의 핵심 발달 특성입니다.\n\n분류화와 서열화는 구체적 조작기, 오이디푸스 콤플렉스는 남근기(유아기), 상징적 사고는 전조작기(유아기)입니다."},"25-1-19":{"x":"피아제에 따르면 유아기(전조작기)는 타율적 도덕성의 단계이고, 자율적 도덕성은 아동기 후반부터 나타납니다. 5번이 틀렸습니다."},"25-1-20":{"x":"아동기에는 전조작기에서 구체적 조작기로 전환됩니다. 형식적 조작사고에서 구체적 조작사고로 전환된다는 서술은 방향이 반대입니다."},"25-1-21":{"x":"마샤는 정체감을 성취, 유예, 유실, 혼란의 4가지 유형으로 구분했습니다.\n\n조합기술과 가설연역적 사고는 형식적 조작기에 나타나고, 2차 성징은 생식기능과 직접 관련되지 않은 외형 변화이며, 상상적 청중과 개인적 우화는 자아중심성을 보여줍니다."},"25-1-22":{"x":"에릭슨은 청년기의 심리사회적 위기를 친밀감 대 고립감으로 보았습니다.\n\n자아통합은 노년기, 전환적 추론은 전조작기, 부모로부터의 독립 양가감정 해소는 청년기에도 완전하지 않으며, 구체적 조작은 아동기입니다."},"25-1-23":{"x":"중년기에도 결정성 지능(경험과 지식)은 계속 발달합니다.\n\n에릭슨의 중년기는 생산성 대 침체이고, 갱년기는 남성도 경험하며, 여성은 에스트로겐이 감소하고 남성도 테스토스테론이 감소합니다. 감각기능은 청년기에 가장 좋습니다."},"25-1-24":{"x":"노년기에는 외향성이 아니라 내향성이 증가합니다."},"25-1-25":{"x":"자아정체감 확립은 청소년기의 과업입니다.\n\n성역할 인식은 유아기, 대상영속성은 영아기, 자아통합은 노년기, 친밀감 형성은 청년기의 과업입니다."},"26-1-1":{"x":"발달은 분화와 통합의 과정을 반복하며 이루어집니다.\n\n성숙은 양적 변화만을 뜻하지 않고, 성장은 신체적 양적 증가이며, 발달은 대근육이 소근육보다 먼저 발달하고, 연속적이며 상승·하강을 모두 포함합니다."},"26-1-2":{"x":"인간발달이론은 생물학적 요소만이 아니라 환경과 상호작용하는 존재로서 인간을 이해하는 데 도움을 줍니다. 사회환경보다 생물학적 요소를 강조한다는 설명은 틀렸습니다."},"26-1-3":{"x":"이상행동은 클라이언트가 겪는 문제의 원인이나 결과가 될 수 있습니다.\n\n이상행동의 개념은 사회문화의 영향을 받고, 정신건강사회복지사만의 영역이 아니며, DSM만이 유일한 진단분류체계도 아닙니다(ICD도 있습니다)."},"26-1-4":{"x":"수용할 수 없는 충동이나 기억을 무의식으로 밀어내는 방어기제는 억압입니다. 고통스러운 일을 잊거나 귀찮은 과제를 깜빡하는 것이 그 예입니다."},"26-1-5":{"x":"친밀감 대 역할혼미는 없는 조합입니다. 친밀감 대 고립감이 맞고, 정체감 대 역할혼미(정체감 혼란)는 청소년기의 위기입니다."},"26-1-6":{"x":"남성 내부의 여성성은 아니마이고, 여성 내부의 남성성이 아니무스입니다. 3번이 틀렸습니다."},"26-1-7":{"x":"고정간격강화계획은 일정한 시간 간격이 지난 후 강화하는 방식입니다. 일정한 수의 반응이 나타난 후에 강화하는 것은 고정비율계획입니다."},"26-1-8":{"x":"기억된 모델의 상징적 표상을 연습하고 구체적 행동으로 옮기는 단계는 운동재생과정입니다."},"26-1-9":{"x":"출생순위와 생활양식은 아들러의 개인심리이론 개념입니다. 로저스의 개념은 자아실현경향과 완전히 기능하는 사람 등입니다."},"26-1-10":{"x":"벡의 인지적 왜곡에는 개인화, 이분법적 사고, 과잉일반화, 임의적 추론이 모두 포함됩니다."},"26-1-11":{"x":"전조작기에는 상징적 사고(ㄱ)와 물활론적 사고(ㄴ)가 나타납니다.\n\n보존개념 획득(ㄷ)은 구체적 조작기, 추상적 사고와 완전한 추론(ㄹ)은 형식적 조작기의 특성입니다."},"26-1-12":{"x":"자기조절 과정으로 지속적이고 안정적인 균형을 유지하려는 체계의 경향은 항상성입니다."},"26-1-13":{"x":"스트레스에 대응하며 개인과 환경 간의 적합성을 회복·향상시키는 노력은 대처(coping)입니다."},"26-1-14":{"x":"외체계는 개인이 직접 참여하지 않지만 영향을 미치는 체계(ㄴ)이고, 미시체계는 인간발달에 가장 직접적 영향을 미치는 환경으로 가족이 대표적입니다(ㄹ).\n\nㄱ의 '내부체계'는 없고, 거시체계가 들어가야 합니다. ㄷ의 중간체계는 미시체계 간의 관계이므로 틀렸습니다."},"26-1-15":{"x":"집단의 최소 단위는 둘 이상입니다. 3인 이상이라는 서술이 틀렸습니다.\n\n가족은 실천의 주요 대상이고, 조직은 목적지향적·분업적이며, 집단은 구성 동기에 따라 자연집단과 형성집단으로 나뉩니다."},"26-1-16":{"x":"역사적 전통, 가치, 이념과 제도·법·정책의 사회구조적 맥락은 거시체계입니다."},"26-1-17":{"x":"사회복지사는 자기 문화에 대한 이해를 바탕으로 다른 문화에 개방적이고 존중하는 태도를 취해야 합니다. 배타적 태도를 취해야 한다는 설명이 틀렸습니다."},"26-1-18":{"x":"임신부의 심리적 불안이나 우울도 태아의 발달에 영향을 미칩니다. 영향이 없다는 설명이 틀렸습니다."},"26-1-19":{"x":"발바닥을 자극하면 발가락이 부채처럼 펴지는 반사는 바빈스키반사입니다.\n\n모로반사는 큰 소리나 갑작스러운 자극에 팔다리를 펴는 반사, 흡인(빨기)·탐색(찾기)·파악(쥐기)반사는 각각 입과 손을 자극할 때 나타납니다."},"26-1-20":{"x":"영아기에는 감각운동기의 핵심 성취인 대상영속성이 형성됩니다.\n\n영아의 골격은 성인보다 뼈 수가 많고 연골이 많아 부드럽고, 성장은 머리에서 다리로, 중심에서 말초로 진행됩니다. 뇌는 두 살에 성인의 약 75~80%까지 발달하며, 남근기는 유아기입니다."},"26-1-21":{"x":"기본적 신뢰감이 형성되는 시기는 영아기입니다. 유아기는 에릭슨의 주도성 대 죄의식 단계입니다."},"26-1-22":{"x":"정체성 위기 속에서 다양한 역할을 실험하지만 아직 결정하지 못한 상태는 정체감 유예입니다."},"26-1-23":{"x":"하비거스트의 청년기 과업에는 가정 꾸리기(ㄱ), 직업생활 시작(ㄴ), 사회적 집단 형성(ㄷ)이 있습니다.\n\n삶의 의미를 되돌아보는 것(ㄹ)은 노년기의 과업입니다."},"26-1-24":{"x":"노년기에는 결정성 지능이 비교적 유지되고, 유동성 지능이 감퇴합니다. 2번은 반대로 서술했습니다."},"26-1-25":{"x":"에릭슨은 노년기를 죽음을 앞두고 삶을 통찰하고 점검하는 시기로 보았고, 중요한 위기는 자아통합 대 절망입니다.\n\n나머지는 학자와 과업이 뒤섞여 있습니다. 자아분화 대 역할몰입, 신체초월 대 신체몰입, 자아초월 대 자아몰입은 펙의 노년기 과업입니다."}},"data/e_lw.json":{"17-3-51":{"x":"사회복지법은 사회적 약자 보호를 위해 개인의 책임보다 사회적 책임·연대를 바탕으로 하며, 사법상 과실책임의 원칙을 수정하는 사회법이다. 따라서 과실책임의 원칙에 기초한다는 설명이 옳지 않다. 헌법상 생존권(사회권)을 구체화하고 개별법 체계이며 공법·사법 요소가 공존한다."},"17-3-52":{"x":"사회복지시설에는 사회복지사를 두는 것이 원칙이나, 어린이집, 점자도서관, 정신질환자 지역사회재활시설, 성매매피해상담소 등 시행령이 정한 시설은 의무채용 제외 시설이다. 노인복지관은 제외 시설이 아니므로 2번이 정답이다. 법령 명칭은 이후 바뀌었으므로(정신보건법은 현행 정신건강복지법) 시행령 현행 목록을 확인하라."},"17-3-53":{"x":"부부가 모두 기초연금 수급권자이면 각각의 기초연금액에서 20%를 감액한다(기초연금법 제8조). 30%라는 설명이 옳지 않다. 국외 이주 시 수급권 상실, 신청 기관, 사망 추정 시 지급 정지는 법에 규정되어 있다."},"17-3-54":{"x":"의료급여 1종 수급권자에는 18세 미만 아동, 65세 이상 노인, 중증장애인, 임산부, 병역의무 이행자 등이 해당한다. 18세인 사람은 18세 미만이 아니므로 1종이 아니다. 대상 구분은 의료급여법 시행령에 있으므로 현행 시행령도 확인하길 권한다."},"17-3-55":{"x":"영유아보육법은 1991년에 제정되어 2000년대 제정법이 아니다. 긴급복지지원법(2005), 노인장기요양보험법(2007), 장애인연금법(2010), 다문화가족지원법(2008)은 2000년대 제정법이다."},"17-3-56":{"x":"서비스 실시 절차의 보유기간 제한 규정(5년)은 존재하지 않는 내용이어서 옳지 않다. 참고로 이 문항이 다룬 사회복지사업법 제33조의2~8(사회복지서비스 신청·조사·결정)은 2017년 삭제되어 현재는 사회보장급여법에서 규율한다. 따라서 현행법으로는 문항의 법적 근거가 이관되었다.","note":"사회복지서비스 신청·조사 규정은 2017년 사회복지사업법에서 삭제되어 사회보장급여법으로 이관되었습니다."},"17-3-57":{"x":"기초생활보장법은 소득평가액을 근로소득, 사업소득, 재산소득, 이전소득으로 산정한다. 퇴직금은 소득의 범위에 들지 않는 것으로 출제되었다. 구체적 소득 범위는 시행령에서 정하므로 현행 시행령을 확인하라."},"17-3-58":{"x":"사회복지법인의 정관에는 목적, 명칭, 소재지, 사업 종류, 자산·회계, 임원 임면, 회의, 수익사업, 정관 변경, 해산 사유, 공고방법 등이 포함되어야 한다(사회복지사업법 제17조). 보기 ㄱ~ㄹ은 모두 포함된다."},"17-3-59":{"x":"문항이 전제한 사회복지위원회와 읍·면·동 복지위원 제도는 폐지되었다. 현재는 사회보장급여법상 시·도사회보장위원회와 지역사회보장협의체가 대신하며, 사회보장에 관한 업무를 담당하는 공무원도 협의체 위원이 될 수 있다. 그래서 현행법으로는 틀린 설명이 여러 개다.","cur":0,"note":"사회복지위원회와 읍·면·동 복지위원 제도가 폐지되고 시·도사회보장위원회·지역사회보장협의체로 대체되어, 현행법상 옳지 않은 보기가 여러 개입니다."},"17-3-60":{"x":"헌법 제31조 제1항 교육을 받을 권리와 제32조 제4항 여자의 근로 보호는 옳다. 헌법 전문에도 '국민생활의 균등한 향상'이 있고, 환경권의 내용과 행사는 법률로 정한다(제35조). 따라서 ㄷ, ㄹ만 옳다."},"17-3-61":{"x":"국가와 지방자치단체는 외국인으로서 장애인 등록을 한 사람에 대해 예산 등을 고려해 지원을 제한할 수 있다(장애인복지법 제32조의2). 등록은 본인뿐 아니라 법정대리인등도 신청할 수 있고 등록 권한은 상속되지 않는다. 등급판정위원회는 장애등급제 폐지로 더 이상 두지 않는다."},"17-3-62":{"x":"법령의 범위를 벗어난 조례는 상위법에 위반되어 효력이 없다. 조례는 법률보다 하위의 규범이며, 대통령 긴급명령과 관습법도 법원이 될 수 있고, 국무총리는 직권으로 총리령을 발할 수 있다."},"17-3-63":{"x":"노인복지법은 노인을 위해 증여·급여된 금품을 목적 외로 사용하는 행위를 금지한다(노인학대의 한 유형). 부양의무자인 자녀도 예외가 아니다. 따라서 목적 외 사용이 가능하다는 설명이 옳지 않다."},"17-3-64":{"x":"가정폭력 피해자 보호시설은 단기보호시설, 장기보호시설, 외국인보호시설, 장애인보호시설의 4종이다(가정폭력방지법 제7조의2). 노인보호시설은 해당하지 않는다."},"17-3-65":{"x":"한부모가족지원법이 열거하는 아동에는 부모의 사망·생사불명, 장애·질병으로 인한 장기 노동능력 상실, 장기복역, 이혼·유기로 부양받을 수 없는 아동과 이에 준하는 아동이 포함된다. 가출 등은 '준하는 자'로 성평등가족부령이 정하는 범위에 해당하는지 확인해야 한다. 공식 정답은 5개다."},"17-3-66":{"x":"다문화가족 실태조사는 3년마다 실시하고 결과를 공표한다(다문화가족지원법 제4조). 담당 부처는 여성가족부였으나 2025년 정부조직 개편으로 성평등가족부가 되었다. 정답은 여성가족부·3년의 조합이다.","note":"여성가족부는 성평등가족부로 개편되었습니다. 3년마다 조사하는 내용은 같습니다."},"17-3-67":{"x":"성폭력 피해자 보호에 필요한 의료 지원 경비는 국가나 지방자치단체가 전부 또는 일부를 지원할 수 있다. 지방자치단체가 전부를 지원할 수 없다는 설명이 옳지 않다. 일반보호시설 입소는 1년 이내이며 연장 규정이 있다."},"17-3-68":{"x":"사회보험은 국가의 책임으로 시행하고, 공공부조와 사회서비스는 국가와 지방자치단체의 책임으로 시행하는 것이 원칙이다(사회보장기본법 제25조 제5항). 사회보험을 국가와 지방자치단체의 책임으로 본다는 설명이 옳지 않다."},"17-3-69":{"x":"산재보험법상 유족에는 사실상 혼인관계에 있는 배우자도 포함된다. 사실혼 배우자가 포함되지 않는다는 설명이 옳지 않다."},"17-3-70":{"x":"하루 중 일정 시간 장기요양기관에 보호하며 신체활동 지원과 심신기능 유지·향상 교육·훈련을 제공하는 급여는 주·야간보호다. 단기보호는 일정 기간 입소 보호하는 급여다."},"17-3-71":{"x":"사회보장수급권은 관계 법령에 따라 다른 사람에게 양도하거나 담보로 제공할 수 없고 압류할 수도 없다(사회보장기본법 제12조). 압류할 수 있다는 설명이 옳지 않다."},"17-3-72":{"x":"사회보장 비용은 제도 목적에 따라 국가, 지방자치단체, 민간이 합리적으로 조정해 부담한다. 공공부조와 저소득층 사회서비스 비용은 국가와 지방자치단체가 부담하고, 부담 능력이 있는 국민의 사회서비스는 수익자 부담이 원칙이나 일부는 국가·지방자치단체가 부담할 수 있다. 국가만 부담한다는 ㄴ이 틀렸다."},"17-3-73":{"x":"헌법재판소는 국민연금이 현재 세대 내에서 소득재분배 기능을 하는 사회보험으로 보면서 조세가 아니고 재산권 침해도 아니라고 보았다. '다음 세대에서 현재 세대로' 소득재분배를 한다는 설명은 옳지 않다."},"17-3-74":{"x":"현행 국민연금법에서는 자녀·손자녀 수급권자가 파양된 때 소멸하며 입양은 소멸 사유가 아니다. 그 결과 노령연금 수급권자 사망, 10년 이상 가입자 사망, 배우자 재혼 소멸, 입양 시 비소멸, 2급 미만(3급) 장애연금 수급권자 사망 시 비지급이 모두 현행법에 부합한다. 공식 정답은 4번이었다.","cur":0,"note":"자녀 수급권자의 입양 소멸 규정이 삭제되어(파양 시 소멸) 4번도 현행법상 옳은 설명이 됩니다."},"17-3-75":{"x":"보건복지부장관은 관계 중앙행정기관의 장과 협의해 사회보장 기본계획을 5년마다 수립한다(사회보장기본법 제16조)."},"18-3-51":{"x":"법률은 특별한 규정이 없는 한 공포한 날부터 20일이 경과하면 효력이 발생한다(헌법 제53조 제7항). 법률은 국회가 제정하며 대통령은 법률안 일부에 재의를 요구할 수 없고, 재의 요구를 하지 않으면 법률로 확정된다."},"18-3-52":{"x":"지방자치단체는 법령의 범위 안에서 자치에 관한 규정(조례·규칙)을 제정할 수 있다(헌법 제117조). 시행령은 대통령이, 시행규칙은 부처 장관이 정하며 시행령이 시행규칙보다 상위 규범이다."},"18-3-53":{"x":"노인장기요양보험법은 2007년에 제정되어 보기 중 가장 최근이다. 사회복지사업법(1970), 산재보험법(1963), 장애인복지법(1989), 고용보험법(1993)이 이보다 앞선다."},"18-3-54":{"x":"사회보장위원회는 위원장 1명, 부위원장 3명과 행정안전부장관, 고용노동부장관, 성평등가족부장관, 국토교통부장관을 포함한 30명 이내 위원으로 구성한다(법 제21조). 위원회는 국무총리 소속이며 부위원장은 교육부·보건복지부·기획예산처 장관이다. 보기 5의 여성가족부는 현재 성평등가족부로 바뀌었다.","note":"여성가족부는 성평등가족부로 개편되었고 부위원장은 교육부·보건복지부·기획예산처 장관입니다."},"18-3-55":{"x":"보건복지부장관은 사회보장급여 관련 업무에 공통적으로 적용되는 기준을 마련할 수 있다(사회보장기본법 제26조 제5항). 사회보장수급권은 양도·담보·압류가 금지되며, 협의가 이루어지지 않으면 사회보장위원회가 조정한다."},"18-3-56":{"x":"사회보장기본법은 국내에 거주하는 외국인에게 상호주의의 원칙에 따라 사회보장제도를 적용하되 관계 법령에서 정하는 바에 따르도록 한다. 평등주의 원칙을 적용한다는 설명이 옳지 않다. 소득보장제도 연계, 자발적 복지활동 촉진, 다른 법률의 정합성, 국민의 자립 노력 의무는 법에 규정되어 있다."},"18-3-57":{"x":"국가·지방자치단체 및 민간의 도움이 필요한 국민에게 복지, 보건의료, 교육, 고용, 주거 등에서 상담, 재활, 돌봄, 정보 제공, 시설 이용, 역량 개발 등을 지원하는 제도는 사회서비스다(사회보장기본법 제3조). 공공부조는 생활이 어려운 국민의 최저생활을 보장하는 제도다."},"18-3-58":{"x":"장기요양보험사업의 보험자는 국민건강보험공단이고 피보험자는 건강보험 가입자 등이다. 피보험자가 공단이라는 설명이 옳지 않다. 3년마다 실태조사를 실시하는 것과 재가급여 우선 제공은 법에 규정되어 있다."},"18-3-59":{"x":"업무상 재해를 입은 근로자의 진료·요양 및 재활 사업, 보험급여의 지급 등을 수행하는 기관은 근로복지공단이다."},"18-3-60":{"x":"사회복지사업법은 매년 9월 7일을 사회복지의 날로 하고 그날부터 1주간을 사회복지주간으로 한다(제15조의2)."},"18-3-61":{"x":"사회복지법인의 이사나 감사에 결원이 생기면 2개월 이내에 보충해야 한다(사회복지사업법 제20조). 3개월이라는 설명이 옳지 않다. 설립허가는 시·도지사, 해산 후 남은 재산은 정관에 따라 국가·지방자치단체에 귀속된다."},"18-3-62":{"x":"사회복지시설의 장은 상근해야 한다(사회복지사업법 제35조). 국가도 시설을 운영할 수 있고, 책임보험 의무는 화재로 인한 손해배상 등이며 안전점검은 시설의 장이 실시한다. 지방자치단체 시설의 위탁은 의무가 아니다."},"18-3-63":{"x":"의료급여기관은 급여비용 청구 서류를 의료급여가 끝난 날부터 5년간 보존하고, 약국 등은 처방전을 급여비용 청구일부터 3년간 보존한다(의료급여법 제11조의2). 따라서 ㄱ 5, ㄴ 3이다."},"18-3-64":{"x":"소관 중앙행정기관의 장은 수급자의 최저생활 보장을 위해 3년마다 소관별 기초생활보장 기본계획을 수립해 보건복지부장관에게 제출한다(기초생활보장법 제20조의2). 기준 중위소득은 중앙생활보장위원회 심의를 거쳐 고시하고, 주거급여는 국토교통부 소관이다."},"18-3-65":{"x":"기초연금 수급권자의 권리와 환수금 환수권은 5년간 행사하지 않으면 시효로 소멸한다(기초연금법 제23조). 3년이라는 설명이 옳지 않다."},"18-3-66":{"x":"긴급전화센터는 피해자 신고접수와 상담, 관련 기관·시설 연계, 긴급한 구조의 지원, 피해자등의 임시 보호 업무를 수행한다(가정폭력방지법 제4조의6). 가정폭력 관련 법률자문과 가해자 조사는 업무에 포함되지 않는다."},"18-3-67":{"x":"사회복지법인은 대표이사를 포함한 이사 7명 이상과 감사 2명 이상을 두며, 이사의 임기는 3년, 감사의 임기는 2년이고 외국인 이사는 현원의 2분의 1 미만이어야 한다(사회복지사업법 제18조). 보기 3이 7·2·2와 일치한다."},"18-3-68":{"x":"자원봉사활동기본법의 원칙은 무보수성, 자발성, 공익성, 비영리성, 비정파성, 비종파성이다. 비집단성은 포함되지 않는다."},"18-3-69":{"x":"국민건강보험종합계획에는 건강보험정책의 기본목표, 보장성 강화, 재정 전망, 보험료 부과체계, 요양급여비용, 건강증진사업, 취약계층 지원, 통계·정보 관리 등이 포함된다(건강보험법 제3조의2). 네 항목 모두 포함된다."},"18-3-70":{"x":"다문화가족지원법은 특별시·광역시·도 및 시·군·구에 다문화가족 지원을 담당할 기구와 공무원을 두도록 한다. 기본계획은 5년마다 성평등가족부장관이 수립하고, 정책위원회는 국무총리 소속이며 실태조사는 3년마다 성평등가족부장관이 실시한다. 문항의 4번이 법에 부합한다.","note":"여성가족부는 성평등가족부로 개편되었고 기본계획은 5년마다 수립합니다."},"18-3-71":{"x":"국민연금 급여는 노령연금, 장애연금, 유족연금, 반환일시금이다. 장의비는 해당하지 않는다."},"18-3-72":{"x":"학교의 장은 친권자나 후견인이 없는 아동을 발견한 경우 가정법원에 후견인 선임을 청구할 수 있다. 시장·군수·구청장에게 친권자 선임을 청구한다는 설명은 법과 다르므로 옳지 않다. 어린이날은 5월 5일, 어린이주간은 5월 1일~7일이다."},"18-3-73":{"x":"구직급여는 이직일 이전 18개월 동안의 피보험 단위기간이 합산하여 180일 이상일 때 받을 수 있다(고용보험법 제40조). 따라서 18개월, 180일이다."},"18-3-74":{"x":"장애인복지법상 결혼이민자와 영주권자 등 일정한 외국인도 장애인 등록을 할 수 있다(제32조의2). 등록할 수 없다는 설명이 옳지 않다."},"18-3-75":{"x":"재가노인복지시설, 노인공동생활가정, 노인요양공동생활가정은 건축법에도 불구하고 단독주택 또는 공동주택에 설치할 수 있다(노인복지법 제55조). 공동주택에만 설치할 수 있다는 설명이 옳지 않다. 노인복지주택의 용도는 노유자시설로 본다."},"19-3-51":{"x":"신체의 자유는 자유권적 기본권이다. 근로의 권리, 인간다운 생활을 할 권리, 교육을 받을 권리, 환경권은 사회적 기본권(사회권)에 해당한다."},"19-3-52":{"x":"산업재해보상보험법(1963), 국민연금법(1986), 고용보험법(1993), 국민건강보험법(1999) 순으로 제정되었다."},"19-3-53":{"x":"헌법 제34조 제5항은 생활능력이 없는 국민이 '법률'이 정하는 바에 따라 국가의 보호를 받는다고 하고, 제117조 제1항은 지방자치단체가 '법령'의 범위 안에서 자치규정을 제정할 수 있다고 한다."},"19-3-54":{"x":"사회보장기본법상 사회보장급여의 관리체계에는 수급권자 권리구제, 사각지대 발굴, 부정·오류 관리, 과오지급액 환수 등이 포함된다(제30조). 사회보장제도의 평가 및 개선은 명시되지 않았다."},"19-3-55":{"x":"사회보장정보의 보호 및 관리는 사회보장위원회의 심의·조정 사항이다(사회보장기본법 제20조). 심의·조정 사항이 아니라는 설명이 옳지 않다. 외국인에게는 상호주의가 적용된다."},"19-3-56":{"x":"사회보장수급권은 양도하거나 담보로 제공할 수 없다(제12조). 양도·담보 제공이 가능하다는 설명이 옳지 않다. 수급권의 포기는 취소할 수 있다."},"19-3-57":{"x":"지원대상자는 사회보장급여를 필요로 하는 사람, 보장기관은 사회보장급여를 제공하는 국가기관과 지방자치단체이며, 통합사례관리사를 둘 수 있다(사회보장급여법 제2조, 제42조의2). 세 설명 모두 옳다."},"19-3-58":{"x":"국가나 지방자치단체가 설치·운영하는 사회복지관은 지역사회 특성과 주민의 복지 욕구를 고려해 서비스 제공 등 지역복지 증진 사업을 한다(사회복지사업법 제34조의5). 국가는 신고 없이 시설을 설치할 수 있고, 해임된 사람은 5년간 시설의 장이 될 수 없다."},"19-3-59":{"x":"사회복지법인은 수익사업의 수익을 법인 또는 시설의 운영 외의 목적에 사용할 수 없다. 설립허가는 시·도지사, 이사는 대표이사 포함 7명 이상, 임기는 3년이며 시설의 직원 겸직은 제한된다."},"19-3-60":{"x":"사회복지서비스는 현금이 아니라 현물 또는 이용권으로 제공하는 것이 원칙이다. 현금 제공이 원칙이라는 설명이 옳지 않다. 사회복지의 날은 매년 9월 7일이다.","note":"사회복지서비스 제공 방식은 현재 사회복지사업법이 아닌 사회보장급여법에서 주로 규정합니다."},"19-3-61":{"x":"국민기초생활보장법상 교육급여는 교육부장관 소관이다(보건복지부장관이 아니다). 생계·의료급여는 보건복지부, 주거급여는 국토교통부 소관이다. 급여는 건강하고 문화적인 최저생활을 유지할 수 있어야 하며, 정당한 사유 없이 불리하게 변경할 수 없다."},"19-3-62":{"x":"긴급복지지원법상 직접지원은 생계, 의료, 주거, 사회복지시설 이용, 교육, 그 밖의 지원이다. 정보제공 지원은 직접지원이 아니라 민간기관·단체와의 연계 지원 쪽으로 분류된다."},"19-3-63":{"x":"기초연금법상 소득인정액은 본인 및 배우자의 소득평가액과 재산의 소득환산액을 합산한 금액이다. 부부 동시 수급 시 감액률은 20%, 지급은 신청한 날이 속하는 달부터이며, 국외 이주 시 수급권을 상실하고 지급금품은 압류할 수 없다."},"19-3-64":{"x":"고용보험법상 실업급여에는 구직급여와 취업촉진수당이 포함된다. 취업촉진수당이 포함되지 않는다는 설명이 옳지 않다."},"19-3-65":{"x":"국민연금 수급권 취득 당시 가입자였던 자의 태아가 출생하면 그 자녀는 가입자였던 자에 의하여 생계를 유지하던 자녀로 본다. 배우자 범위에는 사실상 혼인관계 포함, 가입자 종류는 4가지, 미지급 급여 순위는 배우자, 자녀, 부모 순이다."},"19-3-66":{"x":"장기요양인정 신청 자격은 65세 이상 노인 또는 노인성 질병이 있는 65세 미만 사람으로서 건강보험 가입자·피부양자 또는 의료급여 수급권자다. 노인성 질병이 없는 65세 미만 외국인은 대상이 아니다. ㄱ, ㄷ이 옳다."},"19-3-67":{"x":"산재보험 급여는 요양급여, 휴업급여, 장해급여, 간병급여, 유족급여, 상병보상연금, 장례비, 직업재활급여 등이다. 구직급여는 고용보험의 실업급여다."},"19-3-68":{"x":"건강보험 가입자는 사망한 날의 다음 날 자격을 잃는다(건강보험법 제10조). 국적 상실, 국내 거주 불능, 피부양자 해당, 수급권자 해당은 모두 그 다음 날 또는 해당일 기준이어서 보기 1이 정답이다."},"19-3-69":{"x":"사회복지공동모금회의 이사는 15명 이상 20명 이하이고 회계연도는 1월 1일부터 12월 31일까지다. 복권 발행에는 복지부장관 승인이 필요하고 기부자는 용도를 지정할 수 있다."},"19-3-70":{"x":"한부모가족 실태조사는 3년마다 실시한다. 담당 부처는 여성가족부였으나 현재 성평등가족부다. 장애 실태조사, 노인실태조사 등은 보건복지부장관 소관이며 주기는 법에 따라 3년 또는 5년이다.","note":"여성가족부는 성평등가족부로 개편되었습니다."},"19-3-71":{"x":"장애인의 신체에 폭행을 가하거나 상해를 입힌 사람은 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다(장애인복지법 제86조)."},"19-3-72":{"x":"국가기관과 지방자치단체의 장 등은 아동학대 예방교육을 연 1회 이상 실시하고 결과를 보건복지부장관에게 제출한다. 연 2회 이상이라는 설명이 옳지 않다. 아동은 18세 미만, 기본계획은 5년마다 수립한다."},"19-3-73":{"x":"성폭력방지법상 국가와 지방자치단체는 신고체계 구축, 예방을 위한 유해환경 개선, 조사·연구·교육·홍보, 피해자 사회복귀 지원 등의 책무를 진다. 네 항목 모두 해당한다."},"19-3-74":{"x":"국가나 지방자치단체는 상담소나 보호시설의 설치·운영 경비의 일부를 보조할 수 있다. 전부를 보조하여야 한다는 설명이 옳지 않다. 긴급전화센터는 성평등가족부장관 또는 시·도지사가 설치한다."},"19-3-75":{"x":"헌법재판소는 60세 이상 국민의 국민연금 가입을 제한하는 것이 인간다운 생활을 할 권리를 침해하지 않는다고 보았다. 연금보험료 강제징수는 재산권을 침해하지 않고, 기본재산·보통재산 구분은 명확성 원칙에 위반되지 않는다."},"20-3-51":{"x":"노인복지법(1981)이 가장 빠르고 기초연금법(2014)이 가장 늦다. 고용보험법(1993), 긴급복지지원법(2005)은 그 사이다."},"20-3-52":{"x":"헌법 제34조 제2항은 국가가 사회보장·사회복지의 증진에 노력할 의무를 진다고 하고, 제5항은 생활능력이 없는 국민이 법률이 정하는 바에 의해 국가의 보호를 받는다고 한다."},"20-3-53":{"x":"법률안은 국무회의 심의를 거쳐야 한다(헌법 제89조). 정부도 법률안을 제출할 수 있고 국무총리는 총리령을 발할 수 있으며, 법률은 특별한 규정이 없으면 공포한 날로부터 20일 후 효력이 발생한다."},"20-3-54":{"x":"사회보장위원회의 위원장은 국무총리다. 보건복지부장관이 위원장이라는 설명이 옳지 않다. 위원은 30명 이내이며 기본계획은 5년마다 수립한다."},"20-3-55":{"x":"중앙행정기관의 장과 지방자치단체의 장은 사회보장제도 신설·변경 시 보건복지부장관과 협의해야 한다. 국무조정실장과 협의한다는 설명이 옳지 않다."},"20-3-56":{"x":"한국사회보장정보원은 운영에 필요한 비용을 정부가 출연하거나 지원할 수 있다. 정부 지원이 불가능하고 정보이용자의 부담금으로 충당한다는 설명이 옳지 않다."},"20-3-57":{"x":"사회복지전담공무원은 시·도, 시·군·구, 읍·면·동 또는 사회보장사무 전담기구에 둘 수 있다. 시·도에는 둘 수 없다는 ㄱ이 옳지 않다. ㄴ(사회복지사 자격)은 옳으며 ㄷ은 교육훈련 시책에 관한 설명이다."},"20-3-58":{"x":"사회복지사업법이 열거하는 관련 법률에는 아동복지법, 노인복지법, 입양특례법, 사회복지공동모금회법 등이 있다. 국민건강보험법은 사회보험법으로 포함되지 않는다."},"20-3-59":{"x":"시설 거주자의 보호자 대표는 시설 운영위원회 위원이 될 수 있다(사회복지사업법 제36조). 시설의 장과 거주자 대표도 위원이 될 수 있으며 운영위원회는 의결 기관이 아니라 심의·자문 성격이다."},"20-3-60":{"x":"법인의 이사는 시설의 장을 겸직할 수 있다. 법인 설립허가는 시·도지사가 하고 해산 후 남은 재산은 국가 또는 지방자치단체에 귀속된다. 합병은 시·도지사의 허가가 필요하다."},"20-3-61":{"x":"소득인정액은 보장기관이 급여 결정에 사용하기 위해 산출한 개별가구의 소득평가액과 재산의 소득환산액을 합산한 금액이다(기초생활보장법 제2조 제9호). 수급권자는 급여를 받을 수 있는 자격이 있는 사람, 수급자는 실제로 급여를 받는 사람이다."},"20-3-62":{"x":"자활기업은 수급자와 차상위자 등이 상호 협력하여 설립·운영한다. 소득인정액이 기준 중위소득의 100분의 70 이상인 자가 설립에 참여한다는 설명이 옳지 않다."},"20-3-63":{"x":"보건복지부장관은 기초연금 수급자가 65세 이상 인구의 100분의 70 수준이 되도록 선정기준액을 정하고, 부부가 모두 수급권자이면 각각 100분의 20을 감액한다(기초연금법 제3조, 제8조)."},"20-3-64":{"x":"국내에 체류하는 외국인 중 대통령령으로 정하는 사람은 긴급지원대상자가 될 수 있다. 모든 외국인이 될 수 없다는 설명이 옳지 않다. 발굴조사는 연 1회 이상 실시한다."},"20-3-65":{"x":"요양급여에는 진찰·검사, 약제·치료재료 지급, 처치·수술, 예방·재활, 입원, 간호, 이송이 포함된다. 요양병원간병비는 요양급여에 해당하지 않는다."},"20-3-66":{"x":"출장 기간 중 발생한 사고라도 사적 행위나 이탈 중 사고까지 모두 업무상 사고가 되는 것은 아니다(산재보험법 제37조). '모든 사고'라는 서술이 옳지 않다. 나머지는 업무상 사고 유형으로 법에 규정되어 있다."},"20-3-67":{"x":"장기요양급여 제공의 기본원칙은 의료서비스와의 연계, 자립 지원, 재가급여 우선, 심신상태와 욕구를 고려한 적정 제공이다. 네 설명 모두 해당한다."},"20-3-68":{"x":"고용보험법은 고용안정·직업능력개발 사업, 실업급여, 육아휴직 급여, 출산전후휴가 급여 등을 보험사업으로 실시한다. 실업급여로 지급된 금품에는 공과금을 부과하지 않으며 피보험자격은 고용된 날부터 취득한다."},"20-3-69":{"x":"국무총리 소속으로 아동정책조정위원회를, 시·도지사와 시장·군수·구청장 소속으로 아동복지심의위원회를 두며, 기본계획은 5년마다 수립한다. 아동종합실태조사는 현행법상 3년마다 실시한다(2020년 시험 당시 정답은 5·5였다).","cur":4,"note":"아동종합실태조사는 현행법상 3년마다 실시되어, 현행법 기준 정답은 4번(5년·3년)입니다."},"20-3-70":{"x":"발달장애인지원센터는 장애인복지법이 아니라 발달장애인 권리보장 및 지원에 관한 법률에 따라 설치된다. 장애인 거주시설, 한국장애인개발원, 장애인권익옹호기관, 장애인자립생활지원센터는 장애인복지법에 근거한다."},"20-3-71":{"x":"노인학대는 누구든지 알게 된 때 신고할 수 있고, 특정 직업군은 신고의무자다. 신고의무자만 신고할 수 있다는 설명이 옳지 않다."},"20-3-72":{"x":"공동모금재원 배분기준에는 배분한도액, 배분심사기준, 배분대상, 배분신청기간 및 서류 제출 장소 등이 포함된다(사회복지공동모금회법 제20조). 배분신청자의 재산은 명시되지 않았다."},"20-3-73":{"x":"다문화가족은 결혼이민자와 대한민국 국민으로 이루어진 가족 등이어야 하고, 대한민국 국적을 취득한 자만으로 이루어진 가족이어야 하는 것은 아니다. 해체된 경우의 자녀 적용과 한국어 교육, 기본계획 5년 주기는 옳다."},"20-3-74":{"x":"성폭력피해자 보호시설은 일반보호시설, 장애인 보호시설, 특별지원 보호시설, 외국인 보호시설, 자립지원 공동생활시설 등이다. 상담지원시설은 보호시설의 종류가 아니다."},"20-3-75":{"x":"가정폭력 실태조사는 국가인권위원회 위원장이 아니라 성평등가족부장관(당시 여성가족부장관)이 3년마다 실시한다. 따라서 국가인권위원장이 조사한다는 설명이 옳지 않다.","note":"여성가족부는 성평등가족부로 개편되었습니다."},"21-3-51":{"x":"고용보험법(1993)과 사회복지공동모금회법(1997)은 1990년대 제정이다. 산재보험법은 1960년대, 사회복지사업법은 1970년, 국민기초생활보장법은 1999년, 아동복지법은 1981년이다."},"21-3-52":{"x":"성문법원은 헌법, 법률, 명령, 자치법규, 조약 등이다. 관습법, 판례법, 조리는 불문법원이므로 헌법과 명령을 묶은 3번이 정답이다."},"21-3-53":{"x":"지방자치단체는 법령의 범위 안에서만 조례를 제정할 수 있다. 법령의 범위와 무관하게 제정할 수 있다는 설명이 옳지 않다."},"21-3-54":{"x":"시행령은 대통령령이다. 국무총리나 행정각부의 장이 발하는 것은 총리령·부령(시행규칙)이므로 4번이 옳지 않다."},"21-3-55":{"x":"사회보장수급권은 법령에 따라 서면으로 포기할 수 있으나 포기는 취소할 수 있고, 양도·담보 제공·압류가 금지된다. 따라서 ㄱ만 옳다."},"21-3-56":{"x":"국민연금법은 심사청구와 재심사청구의 순으로 진행한다. 건강보험은 이의신청과 심판청구, 고용보험은 심사·재심사 청구다. 기초연금법은 이의신청 규정이 있다."},"21-3-57":{"x":"사회보험, 공공부조, 평생사회안전망의 정의는 모두 사회보장기본법 제3조의 정의와 일치한다. 세 설명 모두 옳다."},"21-3-58":{"x":"사회보장급여법상 수급자는 사회보장급여를 받고 있는 사람이다. 법은 2014년 제정되어 2015년 시행되었고, 동의 없는 직권신청은 심신미약 등에 한정되며, 이의신청은 처분일부터 90일 이내다."},"21-3-59":{"x":"사회복지서비스를 이용하는 사람의 선택권 보장은 사회복지사업법상 기본이념에 해당한다(제1조의2). 사회통합과 평등, 자활 지원 등은 기본이념 항목과 다른 서술이다."},"21-3-60":{"x":"사회복지서비스는 현물로 제공하는 것이 원칙이고 필요한 경우 이용권으로 제공할 수 있다(사회복지사업법 제5조의2). 자격 정지는 1년 이내이고 법인 허가는 시·도지사가 하며, 최저기준은 보건복지부장관이 마련한다."},"21-3-61":{"x":"사회복지사업법은 매년 9월 7일을 사회복지의 날로 규정한다(제15조의2). 장애인의 날, 노인의 날 등은 다른 법률에 근거한다."},"21-3-62":{"x":"기초생활보장법상 외국인 특례는 대한민국 국민과 혼인하여 임신 중이거나 미성년 자녀를 양육하는 외국인 등이 대상이다. 배우자의 직계비속이 아니라 대한민국 국적의 직계존속과 생계·주거를 같이하는 경우다."},"21-3-63":{"x":"기초생활보장법상 금융정보 등을 사용·제공·누설한 자는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다(제48조)."},"21-3-64":{"x":"출퇴근 사고는 통상적인 경로와 방법으로 출퇴근하던 중 발생한 사고를 업무상 재해로 본다. 비통상적인 경로와 방법으로 출퇴근하는 중 사고는 해당하지 않는다."},"21-3-65":{"x":"기초연금은 65세 이상인 사람으로서 소득인정액이 선정기준액 이하인 사람에게 지급하고, 선정기준액은 65세 이상 인구의 100분의 70 수준이 되도록 정한다."},"21-3-66":{"x":"국민연금법상 급여는 노령연금, 장애연금, 유족연금, 반환일시금이다. 장해급여는 산재보험의 급여다."},"21-3-67":{"x":"구직급여를 받으려면 이직 후 지체 없이 직업안정기관에 출석해 실업을 신고해야 한다. 대기기간은 7일이고 기준기간은 이직일 이전 18개월이며 이주비는 구직급여가 아니다."},"21-3-68":{"x":"요양급여비용의 심사는 건강보험심사평가원의 업무이며 국민건강보험공단의 업무가 아니다."},"21-3-69":{"x":"장애인복지법상 학대에는 경제적 착취도 포함된다. 아동학대범죄는 아동학대관련범죄에 해당하고, 노인학대는 신체·정신·정서·성적 폭력, 경제적 착취, 가혹행위, 유기, 방임이다."},"21-3-70":{"x":"노인복지시설은 노인주거복지시설, 노인의료복지시설, 노인여가복지시설, 재가노인복지시설, 노인보호전문기관, 노인일자리지원기관, 학대피해노인 전용쉼터다. 독거노인종합지원센터는 별도 기관으로 시설 종류가 아니다."},"21-3-71":{"x":"한부모가족지원법상 취학 중인 아동은 22세 미만(병역 이행 기간 가산)을 말한다. 24세 미만이라는 설명이 옳지 않다. 청소년 한부모와 다문화가족지원법상 아동·청소년은 24세 이하이고 아동복지법상 아동은 18세 미만이며, 노인복지법에는 노인의 연령 정의가 없다."},"21-3-72":{"x":"사회복지공동모금회법은 법이나 정관에 규정이 없는 사항을 「민법」 중 재단법인에 관한 규정으로 준용한다. 사단법인 규정을 준용한다는 설명이 옳지 않다."},"21-3-73":{"x":"자원봉사활동의 원칙은 무보수성, 자발성, 공익성, 비영리성, 비정파성, 비종파성이다. 무차별성은 포함되지 않는다."},"21-3-74":{"x":"성폭력 피해자 상담은 피해자의 의사에 반하여 할 수 없다. 의사에 반하여 상담할 수 있다는 설명이 옳지 않다."},"21-3-75":{"x":"헌법재판소는 장애인고용부담금제도가 헌법에 합치한다고 보았다. 의무고용 조항을 헌법불합치로 결정했다는 설명이 옳지 않다."},"22-3-51":{"x":"헌법은 공무원인 근로자의 근로3권을 법률이 정하는 공무원에 한하여 보장한다(제33조 제2항). 모든 공무원에게 보장한다는 설명이 옳지 않다."},"22-3-52":{"x":"대통령령, 조례, 규칙, 일반적으로 승인된 국제법규는 모두 사회복지법의 법원이다."},"22-3-53":{"x":"노인복지법(1981)이 가장 빠르다. 영유아보육법(1991), 고용보험법(1993), 사회보장기본법(1995), 국민건강보험법(1999)이 그 뒤다."},"22-3-54":{"x":"사회보험은 국가의 책임으로, 공공부조와 사회서비스는 국가와 지방자치단체의 책임으로 시행하는 것이 원칙이다(사회보장기본법 제25조 제5항)."},"22-3-55":{"x":"보건복지부장관은 중장기 사회보장 재정추계를 적어도 3년마다 실시하고 공표해야 한다(제30조의3). 매년 실시한다는 설명이 옳지 않다."},"22-3-56":{"x":"사회보장위원회 위원에는 행정안전부, 고용노동부, 성평등가족부, 국토교통부 장관이 포함된다. 시험 당시에는 기획재정부장관도 부위원장이었으나 현행법은 부위원장을 교육부, 보건복지부, 기획예산처 장관으로 규정한다. 공식 정답은 4개 모두 포함이었다.","note":"현행 제21조는 부위원장을 교육부·보건복지부·기획예산처 장관으로 규정합니다."},"22-3-57":{"x":"사회보장급여법은 보장기관의 장이 발굴조사를 분기마다 정기적으로 실시하도록 한다(제12조의2). 1년마다 실시한다는 설명이 옳지 않다. 이의신청은 처분일부터 90일 이내다."},"22-3-58":{"x":"수급자격 확인을 위해서는 인적사항·가족관계, 소득·재산·근로능력·취업상태, 수급이력, 그 밖에 수급권자 선정에 필요한 사항을 조사할 수 있다(사회보장급여법 제6조). 네 항목 모두 해당한다."},"22-3-59":{"x":"사회복지법인이 설립 후 기본재산을 출연하지 않은 경우 시·도지사는 설립허가를 취소해야 한다(사회복지사업법 제26조 제1항 제7호). 시정명령만 할 수 있다는 설명이 옳지 않다. 거짓 설립허가도 반드시 취소 사유다."},"22-3-60":{"x":"시설을 설치·운영하는 자는 종사자를 채용할 수 있다. 지방자치단체는 신고 없이 시설을 설치할 수 있고 안전점검은 시설의 장이 하며, 운영위원회는 심의 기구이고 책임보험료는 보조할 수 있다."},"22-3-61":{"x":"사회복지시설의 장은 해당 법인의 이사를 겸할 수 있다(제18조). 겸할 수 없다는 설명이 옳지 않다."},"22-3-62":{"x":"보장기관은 급여를 실시하는 시·도지사, 시장·군수·구청장이며, 보장시설은 장애인 거주시설 등 생활시설이다. 대전광역시장(ㄷ)과 장애인 거주시설(ㄱ)의 조합이 옳다."},"22-3-63":{"x":"의료급여는 진찰·검사, 약제·치료재료, 처치·수술, 예방·재활, 입원, 간호, 이송 등이다. 화장 또는 매장 등 장제 조치는 해당하지 않는다."},"22-3-64":{"x":"기초연금 지급은 금고 이상 형 집행 중이거나 사망 추정, 국외 체류 60일 이상 지속될 때 정지된다. 국적 상실은 수급권 상실 사유이지 지급 정지 사유가 아니다."},"22-3-65":{"x":"긴급지원 신고의무자는 의료기관 종사자, 고등교육법상 직원, 공무원, 사회복지시설 종사자 등이다. 국가무형문화재 보유자는 해당하지 않는다."},"22-3-66":{"x":"건강보험심사평가원은 요양급여비용 심사와 요양급여의 적정성 평가를 담당한다. 자격 관리, 보험급여 관리·비용 지급, 보험료 부과·징수는 국민건강보험공단의 업무다."},"22-3-67":{"x":"국민연금법상 급여는 노령연금, 장애연금, 유족연금, 반환일시금이다. 장애인연금과 장해급여는 다른 법률의 급여다."},"22-3-68":{"x":"실업급여는 고용보험법의 급여다. 산재보험의 보험급여에는 요양급여, 휴업급여, 장해급여, 간병급여, 유족급여, 상병보상연금 등이 있으며 실업급여는 없다."},"22-3-69":{"x":"고용보험법에 따라 국가는 매년 보험사업에 드는 비용의 일부를 일반회계에서 부담한다. 기금은 고용노동부장관이 관리하고 일용근로자는 1개월 미만 고용되는 사람이다."},"22-3-70":{"x":"장기요양보험사업은 보건복지부장관이 관장한다(노인장기요양보험법 제7조). 비용 청구 상대는 공단이며 노인등은 65세 이상이다."},"22-3-71":{"x":"한부모가족지원법은 아동양육비를 복지급여로 지급한다. 아동양육비를 대여한다는 설명이 옳지 않다. 자녀양육비 가이드라인은 성평등가족부장관이 마련한다.","note":"여성가족부는 성평등가족부로 개편되었습니다."},"22-3-72":{"x":"요양보호사 자격 취소 권한은 보건복지부장관이 아니라 시·도지사에게 있다(노인복지법 제39조의14). 따라서 2번이 옳지 않다."},"22-3-73":{"x":"난민인정자는 장애인 등록을 할 수 있다(장애인복지법 제32조의2). 장애인정책종합계획은 5년마다, 장애실태조사는 3년마다 실시한다."},"22-3-74":{"x":"아동권리보장원의 장 또는 아동보호전문기관의 장은 아동학대 종료 후에도 재발 여부를 확인해야 한다(아동복지법 제28조). 자립지원계획은 15세 이상 아동 대상이고 아동정책조정위원회는 국무총리 소속이다."},"22-3-75":{"x":"국가나 지방자치단체는 모금회의 관리·운영에 필요한 비용을 보조할 수 있다. 모금회는 재단법인 규정을 준용하고 기부자는 용도 등을 지정할 수 있으며 모금계좌 개설 제한은 언론기관 명의로 하지 못하는 것이다."},"23-3-51":{"x":"산업재해보상보험법(1963), 사회복지사업법(1970), 노인복지법(1981), 고용보험법(1993), 국민기초생활보장법(1999) 순이다."},"23-3-52":{"x":"헌법 제34조는 국가가 사회보장·사회복지의 증진에 노력할 의무를 진다고 하고, 생활능력이 없는 국민은 법률이 정하는 바에 의하여 국가의 보호를 받는다고 한다."},"23-3-53":{"x":"국민복지연금법(1973)은 1986년 국민연금법으로 전부개정되었다. 2014년에는 기초노령연금법을 폐지하고 기초연금법이 제정되었으며, 국민건강보험법은 1999년에 제정되었다."},"23-3-54":{"x":"사회보험은 국가의 책임으로 시행하는 것이 원칙이다. 지방자치단체의 책임으로 시행한다는 설명이 옳지 않다."},"23-3-55":{"x":"사회보장수급권은 서면으로 포기할 수 있고 구두로는 포기할 수 없다. 포기는 취소할 수 있으며 양도·담보 제공은 금지된다."},"23-3-56":{"x":"국가와 지방자치단체는 사회보장위원회의 심의·조정 사항을 반영해 사회보장제도를 운영·개선해야 한다. 위원회는 국무총리 소속이며 위원장 1명, 부위원장 3명, 30명 이내 위원으로 구성하고 임기는 2년이다.","note":"현행 사회보장위원회는 위원장 1명, 부위원장 3명, 30명 이내로 구성되고 임기는 2년입니다."},"23-3-57":{"x":"조례는 지방의회가, 규칙은 지방자치단체의 장이 제정한다. 지방의회가 규칙 제정권을 갖고 장이 조례 제정권을 갖는다는 서술이 옳지 않다."},"23-3-58":{"x":"보건복지부장관은 사회보장급여 부정수급 실태조사를 3년마다 실시하고 결과를 공개해야 한다(사회보장급여법 제19조의2). 중앙생활보장위원회는 기초생활보장법상 기구이고 발굴체계 점검은 보건복지부장관이 매년 한다."},"23-3-59":{"x":"사회복지서비스 품질 평가를 위한 전문기관은 직접 설치하거나 관계기관 등에 위탁할 수 있다. 위탁하여서는 아니 된다는 설명이 옳지 않다. 서비스는 현물 제공이 원칙이고 필요시 이용권을 지급한다."},"23-3-60":{"x":"거짓이나 부정한 방법으로 자격을 취득한 경우에는 자격을 취소하여야 하며 정지할 수 있는 사유가 아니다(사회복지사업법 제11조의3). 1년 범위 정지 사유로 보는 설명이 옳지 않다."},"23-3-61":{"x":"사회복지시설은 둘 이상의 사회복지사업을 통합하여 수행할 수 있다(제34조의2). 운영위원회는 심의기구이고 시설의 장은 상근해야 하며 지방자치단체도 시설을 설치·운영할 수 있다."},"23-3-62":{"x":"보장기관은 차상위자의 가구별 생활여건을 고려해 예산의 범위에서 급여의 전부 또는 일부를 실시할 수 있다. 징집된 부양의무자는 부양능력이 없는 것으로 본다."},"23-3-63":{"x":"기초생활보장법의 급여 기본원칙에는 근로능력 활용, 보충급여, 타법 우선이 있다. 수익자부담은 해당하지 않는다."},"23-3-64":{"x":"주소득자의 사망·가출, 본인의 중한 질병·부상, 가구구성원으로부터의 방임·유기·학대·성폭력 등은 모두 긴급복지지원법상 위기상황이다."},"23-3-65":{"x":"건강가정기본법상 1인가구는 1명이 단독으로 생계를 유지하는 생활단위다. 성인 1명과 미성년 자녀로 구성된 생활단위라는 설명은 옳지 않다."},"23-3-66":{"x":"보건복지부장관은 사회복지관, 아동양육시설, 장애인 지역사회재활시설 등 시행규칙이 정하는 시설에 대해 서비스 최저기준을 마련한다. 자원봉사센터는 대상 시설이 아니다."},"23-3-67":{"x":"생계급여는 수급자의 거주지를 관할하는 시·도지사와 시장·군수·구청장이 실시한다. 교육급여는 시·도교육감, 의료급여는 시장·군수·구청장 등이 실시한다."},"23-3-68":{"x":"중대한 귀책사유로 해고되어 구직급여 수급자격이 제한되는 경우는 형법 위반으로 금고 이상 형을 선고받은 경우, 장기간 무단결근, 사업기밀 누설 등이다. 세 항목 모두 해당한다."},"23-3-69":{"x":"근로자의 소득으로 생계를 유지하고 있던 유족으로서 학업 등으로 주민등록을 달리하거나 동거하지 않았더라도 유족에 해당할 수 있다. 해당되지 않는다는 설명이 옳지 않다."},"23-3-70":{"x":"정신건강복지법상 보호의무자는 민법상 후견인 또는 부양의무자다. 파산선고를 받고 복권되지 않은 사람, 소송 중인 사람, 행방불명자, 미성년자는 보호의무자가 될 수 없다."},"23-3-71":{"x":"배우자의 학대로 아동 양육이나 모의 건강에 지장이 우려될 때 일시적으로 주거와 생계를 지원하는 시설은 일시지원복지시설이다."},"23-3-72":{"x":"대법원은 의족 파손도 업무상 재해의 요양급여 대상에 포함된다고 보았다. 의족 파손이 요양급여 대상 부상에 포함되지 않는다는 설명이 옳지 않다."},"23-3-73":{"x":"장기요양요원의 권리 침해 상담, 역량강화 교육, 건강관리 사업을 지원하는 기구는 장기요양요원지원센터다."},"23-3-74":{"x":"아동 안전 보호, 급식·간식 제공, 돌봄서비스, 교육·문화 프로그램 연계를 하는 시설은 다함께돌봄센터다(아동복지법)."},"23-3-75":{"x":"아동복지법상 보호가 필요한 아동 발굴과 양육환경 개선을 위해 요양급여 기록, 영유아건강검진 기록, 학교생활기록 정보, 단전 가구정보 등을 이용할 수 있다. 네 항목 모두 해당한다."},"24-3-51":{"x":"헌법 제10조는 모든 국민이 인간으로서의 존엄과 가치를 가지며 행복을 추구할 권리를 가진다고 한다."},"24-3-52":{"x":"다문화가족지원법(2008)이 가장 최근이다. 아동복지법(1981), 노인복지법(1981), 장애인복지법(1989), 한부모가족지원법(2007)은 그 이전이다."},"24-3-53":{"x":"지방자치단체의 조례는 성문법원이다. 관습법도 보충적 법원이 되고 법률은 국회가 제정하며 명령은 국회 의결이 필요 없고 일반적으로 승인된 국제법규도 법원이다."},"24-3-54":{"x":"아동복지법, 장애인복지법, 국민기초생활보장법, 기초연금법은 모두 사회복지사업법 제2조가 열거하는 사회복지사업 관련 법률이다."},"24-3-55":{"x":"이사 또는 감사에 결원이 생기면 2개월 이내에 보충해야 한다(사회복지사업법 제20조). 3개월 이내라는 설명이 옳지 않다."},"24-3-56":{"x":"국가나 지방자치단체는 시설의 책임보험·책임공제 가입 비용의 전부 또는 일부를 보조할 수 있다(사회복지사업법 제34조의3). 전부를 보조할 수 없다는 설명이 옳지 않다. 국가의 시설 운영, 운영위원회 심의, 폐쇄명령은 법에 근거가 있다."},"24-3-57":{"x":"국가와 지방자치단체는 사회복지 자원봉사활동의 지원·육성을 위해 홍보와 교육 등을 실시한다(제9조). 서비스는 현물 제공이 원칙이고 자격증 대여는 형사처벌되나 형량이 다르며 자격증은 보건복지부장관이 발급한다."},"24-3-58":{"x":"최저보장수준과 최저임금은 국가가 매년 공표한다. 지방자치단체가 공표한다는 ㄱ과, 수급권을 구두로 포기할 수 있다는 ㄴ이 옳지 않다. 수급권 제한은 필요 최소한에 그치고, 타인에게 피해를 주는 포기는 할 수 없다."},"24-3-59":{"x":"국가는 사회보장에 관한 상담에 응해야 한다(사회보장기본법 제11조). 사회보험은 국가 책임, 저소득층 사회서비스는 국가·지방자치단체 부담이며, 지방자치단체장은 보건복지부장관과 협의한다."},"24-3-60":{"x":"사회보장위원회 위원의 임기는 2년이다. 3년이라는 설명이 옳지 않다. 평생사회안전망 구축, 구상권 행사, 다른 법률과의 정합성 규정은 법에 있다."},"24-3-61":{"x":"정부는 한국사회보장정보원의 설립·운영에 필요한 비용을 출연할 수 있다. 출연할 수 없다는 설명이 옳지 않다. 나머지는 사회보장급여법의 규정이다."},"24-3-62":{"x":"보장기관의 장은 지원대상자 발굴을 위해 사회보장급여의 제공규모 등에 대한 정보 제공과 홍보에 노력해야 한다. 건강보험료 체납 정보는 3개월 이상 체납자이며 발굴조사는 분기마다 실시한다."},"24-3-63":{"x":"자활급여는 관련 비영리법인 등에 위탁하여 실시할 수 있다. 생계급여는 금전 또는 물품으로 지급할 수 있고, 주거급여가 임차료·수선유지비를 지급하며, 교육급여는 교육부장관 소관이다."},"24-3-64":{"x":"지역자활센터는 자활 정보제공·상담·직업교육·취업알선, 자영창업 지원, 자활기업 지원, 생업 자금융자 알선 등을 한다. 사업자금을 직접 융자하는 것은 사업이 아니며 알선이다."},"24-3-65":{"x":"보건복지부에 두는 의료급여심의위원회는 의료급여의 수가에 관한 사항 등을 심의한다. 의료급여증은 시장·군수·구청장이 발급하고 의료급여기금은 시·도에 설치한다."},"24-3-66":{"x":"부부가 모두 수급권자이면 각각 20%를 감액한다. 수급권의 시효는 5년이며, 사망 추정 시에는 수급권이 아니라 지급이 정지된다."},"24-3-67":{"x":"건강보험 가입자는 국내에 거주하지 아니하게 된 날의 다음 날 자격을 잃는다. 당일 상실이라는 설명이 옳지 않다."},"24-3-68":{"x":"특별현금급여는 가족요양비·특례요양비·요양병원간병비로 재가급여가 아니다. 재가급여에는 방문요양, 방문목욕, 방문간호, 주·야간보호, 단기보호, 기타재가급여가 있다."},"24-3-69":{"x":"가입자의 가입 종류가 변동되면 각 종류별 가입기간을 합산한 기간이 가입기간이다. 국민연금은 보건복지부장관이 관장하고 가입 대상은 18세 이상 60세 미만이며 배우자에는 사실혼 포함이다."},"24-3-70":{"x":"고용보험기금은 고용노동부장관이 관리·운용한다. 일용근로자는 1개월 미만 고용되는 사람이고 국가가 일반회계에서 비용 일부를 부담하며 실업급여 수급권은 양도·압류가 금지된다."},"24-3-71":{"x":"취업촉진수당에는 조기재취업 수당, 직업능력개발 수당, 광역 구직활동비, 이주비가 있다. 네 항목 모두 해당한다."},"24-3-72":{"x":"국가는 중앙노인보호전문기관을 설치·운영해야 한다(노인복지법 제39조의5). 노인복지주택은 60세 이상, 요양공동생활가정은 재가·의료복지 성격이며 지역노인보호전문기관은 시·도에 둔다."},"24-3-73":{"x":"보호조치 중인 보호대상아동의 양육상황은 매년 점검한다(아동복지법 제15조의3). 분기별로 점검한다는 설명이 옳지 않다. 아동정책조정위원회 위원장은 국무총리다."},"24-3-74":{"x":"한부모가족지원법상 모 또는 부에는 아동을 양육하는 미혼자(사실혼 제외)가 포함된다. 실태조사는 3년마다, 청소년 한부모는 24세 이하, 한부모가족의 날은 5월 10일이다."},"24-3-75":{"x":"모금회는 정관을 작성해 보건복지부장관의 인가를 받아 등기함으로써 설립된다. 허가를 받는다는 설명이 옳지 않다. 배분분과실행위원회는 20명 이상으로 구성되고 배분기준은 매년 8월 31일까지 공고한다."},"25-3-51":{"x":"산업재해보상보험법(1963)이 가장 빠르고 국민연금법(1986), 고용보험법(1993), 국민기초생활보장법(1999), 국민건강보험법(1999)이 그 뒤다."},"25-3-52":{"x":"대통령은 법률에서 구체적으로 위임받은 사항과 법률을 집행하기 위해 필요한 사항에 관해 대통령령을 발할 수 있다(헌법 제75조). 관습법·판례법·조리는 불문법원이고 시행령이 시행규칙보다 상위다."},"25-3-53":{"x":"노인복지법(1981), 노인장기요양보험법(2007), 심신장애자복지법(1981)에서 장애인복지법(1989)으로의 개정은 옳다. 아동복리법은 1981년에 아동복지법으로 전부개정되었으므로 1989년이라는 설명이 옳지 않다."},"25-3-54":{"x":"사회보장수급권은 서면으로 포기할 수 있고 포기는 취소할 수 있다. 취소할 수 없다는 설명이 옳지 않다. 양도·담보·압류는 금지되고 타인에게 피해를 주는 포기는 할 수 없다."},"25-3-55":{"x":"보건복지부장관은 관계 중앙행정기관의 장과 협의하여 5년마다 사회보장 기본계획을 수립한다. 기본계획은 사회보장위원회와 국무회의 심의를 거치며 지역사회보장계획은 4년마다 수립한다."},"25-3-56":{"x":"국민에게 발생하는 사회적 위험을 보험 방식으로 대처하는 제도는 사회보험이고, 국가와 지방자치단체의 책임으로 최저생활을 보장하고 자립을 지원하는 제도는 공공부조다."},"25-3-57":{"x":"사회보장위원회 위원의 임기는 2년이다. 4년이라는 설명이 옳지 않다. 국무총리 소속, 실무위원회 설치, 30명 이내 구성은 법에 규정되어 있다."},"25-3-58":{"x":"시·군·자치구의 조례와 규칙은 시·도의 조례와 규칙을 위반할 수 없으므로 시·도 규칙이 상위 규범이다. 시·군·구 규칙이 시·도 규칙보다 상위라는 설명이 옳지 않다."},"25-3-59":{"x":"공공부조 비용은 국가와 지방자치단체가 전부 또는 일부를 부담한다. 지방자치단체가 전부 부담한다는 설명이 옳지 않다."},"25-3-60":{"x":"사회복지사 결격사유는 피성년후견인이며 피한정후견인은 포함되지 않는다. 거짓 취득 시 자격 취소, 취소 후 2년 내 재교부 금지, 정기 보수교육은 법에 규정되어 있다."},"25-3-61":{"x":"설립허가를 반드시 취소하는 경우는 거짓이나 부정한 방법으로 설립허가를 받았을 때와 법인 설립 후 기본재산을 출연하지 아니한 때다(사회복지사업법 제26조 제1항 단서). 나머지는 시정명령 또는 취소 가능 사유다."},"25-3-62":{"x":"국가 또는 지방자치단체 외의 자가 시설을 설치·운영하려면 시장·군수·구청장에게 신고해야 한다(제34조). 사회복지관은 직업·취업 알선이 필요한 사람에게 우선 서비스를 제공하고, 시설 수용인원은 300명을 초과할 수 없으며 시설의 장은 상근해야 한다."},"25-3-63":{"x":"아동보호전문기관은 아동학대 신고접수, 현장조사, 상담·치료, 예방 교육·홍보, 가정 기능 회복 서비스, 사후관리를 담당한다. 응급보호는 법령상 별도 규정에 따른다."},"25-3-64":{"x":"노인에게 성적 수치심을 주는 행위, 구걸 행위, 노인을 위해 지급된 금품의 목적 외 사용은 모두 노인복지법 제39조의9가 정하는 금지행위다."},"25-3-65":{"x":"장애인연금법상 중증장애인에게는 장애인복지법상 장애수당을 지급하지 아니한다. 장애인정책조정위원회는 국무총리 소속이며 장애실태조사는 3년마다, 장애인의 날은 4월 20일이고 외국인도 일정 요건이면 등록할 수 있다."},"25-3-66":{"x":"한부모가족지원법상 아동은 18세 미만이며 취학 중이면 22세 미만이다(병역 이행 기간 가산). 기본계획은 성평등가족부장관이 5년마다 수립하고, 청소년 한부모는 24세 이하, 복지 급여는 생계비, 아동교육비, 아동양육비 등이며 임신부도 출산지원시설 이용 시 지원대상자가 된다."},"25-3-67":{"x":"가정폭력 예방교육 의무는 국가기관, 지방자치단체, 초·중등교육법상 학교의 장 등에게 있고 결과를 성평등가족부장관에게 제출한다. 문항이 열거한 유치원의 장과 어린이집의 원장은 법 문언과 일치하지 않아 옳지 않다."},"25-3-68":{"x":"기초생활보장법상 외국인 특례는 대한민국 국민과 혼인한 외국인으로서 임신 중이거나 미성년 자녀를 양육하거나 배우자의 대한민국 국적 직계존속과 생계·주거를 같이하는 사람이 대상이다. 성인 장애인과 함께 생활하는 사람은 해당하지 않는다."},"25-3-69":{"x":"보건복지부장관은 수행기관의 통합정보전산망 사용을 개인정보 보호 요건이 충족될 때 허용하며, 모든 정보를 제공하여야 하는 것은 아니다. 정보주체의 동의와 보호대책, 취급승인자만 취급, 비밀 사용 금지는 법에 규정되어 있다."},"25-3-70":{"x":"기초연금 수급권은 사망, 국적 상실, 국외 이주 시 상실된다(기초연금법 제17조). 장기요양등급판정을 받은 것은 상실 사유가 아니다."},"25-3-71":{"x":"수급권자가 업무 또는 공무로 인한 질병·부상으로 다른 법령에 따른 급여나 보상을 받는 경우에는 의료급여를 하지 않는다. 의료급여 업무는 거주지 관할 시장·군수·구청장이 하며 보건소도 의료급여기관이 될 수 있다."},"25-3-72":{"x":"국민건강보험공단은 예산안을 독자적으로 편성하는 것이 아니라 이사회 의결과 보건복지부장관의 승인을 거쳐 운영한다. 독자적으로 편성하고 지출할 수 있다는 설명이 옳지 않다."},"25-3-73":{"x":"산재보험 급여에는 요양급여, 휴업급여, 장해급여, 간병급여, 유족급여, 상병보상연금, 장례비, 직업재활급여가 있다. 예방·재활급여는 보험급여가 아니라 보험시설 사업이다."},"25-3-74":{"x":"고용보험사업은 고용안정·직업능력개발 사업, 실업급여, 육아휴직 급여, 출산전후휴가 급여 등이다. 자활급여는 기초생활보장법의 급여다."},"25-3-75":{"x":"장기요양인정 신청은 본인이나 대리인이 하며 장기요양기관이 수급자를 대리하여 신청하는 것은 허용되지 않는다. 의사소견서 첨부, 공단의 방문 조사, 6개월 이상 일상생활 곤란 시 등급 판정, 인정서 송부는 법에 규정되어 있다."},"26-3-51":{"x":"노인 일자리 및 사회활동 지원에 관한 법률이 가장 최근에 제정되었다. 사회보장기본법(1995), 국민건강보험법(1999), 긴급복지지원법(2005), 다문화가족지원법(2008)이 앞선다."},"26-3-52":{"x":"기초연금법은 2014년 기초노령연금법을 대체하여 제정되었고 장애인연금법으로 개정된 것이 아니다. 아동복리법에서 아동복지법으로, 국민복지연금법에서 국민연금법으로, 심신장애자복지법에서 장애인복지법으로, 정신보건법에서 현행 법으로 개정되었다."},"26-3-53":{"x":"양심의 자유는 자유권적 기본권이다. 보건에 관한 국가 보호, 사회보장·사회복지 증진, 인간다운 생활을 할 권리, 노인·청소년 복지향상 정책은 사회권적 기본권이다."},"26-3-54":{"x":"국회에서 의결된 법률안은 정부에 이송되어 15일 이내에 대통령이 공포한다(헌법 제53조 제1항). 입법권은 국회에 속하고 법률은 공포 후 20일 경과로 효력이 발생하며 정부도 법률안을 제출할 수 있다."},"26-3-55":{"x":"보건복지부장관은 중장기 사회보장 재정추계를 적어도 3년마다 실시하고 공표한다(사회보장기본법 제30조의3). 기본계획은 5년마다, 최저보장수준과 최저임금은 매년 공표하며, 지방자치단체장은 보건복지부장관과 협의한다."},"26-3-56":{"x":"사회보장급여법상 직무상 신고의무자에는 사회복지시설 종사자, 의료인, 구급대원, 경찰공무원, 어린이집 원장 등 보육교직원, 유아교육법·초중등교육법상 교직원, 학원 운영자·강사 등이 포함된다. 고등교육법상 교직원은 열거되지 않는다."},"26-3-57":{"x":"지역사회보장협의체는 지역사회보장계획 수립·시행·평가, 지역사회보장조사, 읍·면·동 협의체 구성·운영, 사회보장 추진 사항 등을 심의·자문한다. 국가와 지방자치단체의 역할 및 비용 부담은 사회보장위원회 심의 사항이다."},"26-3-58":{"x":"시·도사회보장위원회의 설치는 사회보장급여법 사항이다. 사회보장 기본계획, 사회보장제도 평가, 행정데이터 분석센터, 사회보장지출통계는 사회보장기본법에 규정되어 있다."},"26-3-59":{"x":"사회복지시설에 대한 정기 및 수시 안전점검은 시설의 장이 실시한다(사회복지사업법 제34조의4). 시장·군수·구청장이 실시한다는 설명이 옳지 않다. 사회복지관은 다문화가족 등에게 서비스를 우선 제공한다."},"26-3-60":{"x":"사회복지법인의 정관에는 자산 및 회계에 관한 사항이 포함되어야 한다(제17조). 이사는 시설의 장을 겸할 수 있고 해산 시 재산은 국가·지방자치단체에 귀속되며 설립은 시·도지사의 허가를 받고 이사 임기는 3년, 감사는 2년이다."},"26-3-61":{"x":"사회복지사업법 제2조는 사회복지사업 관련 법률로 스토킹방지 및 피해자보호 등에 관한 법률도 열거한다. 서비스는 자신의 의사에 따라 신청하며 현물 제공이 원칙이고 선택권 보장 의무와 복지 욕구 조사가 가능하다."},"26-3-62":{"x":"보건복지부장관 등은 급여의 종류별 수급자 선정기준과 최저보장수준을 결정하며, 소득인정액은 개별가구의 소득평가액과 재산의 소득환산액을 합산한 금액이다."},"26-3-63":{"x":"긴급복지지원법상 위기상황에는 가정폭력·성폭력, 화재·자연재해로 주거 곤란, 휴업·폐업·사업장 화재, 실직으로 소득 상실이 모두 포함된다."},"26-3-64":{"x":"수급권자가 의료급여를 거부한 경우 시장·군수·구청장은 의료급여를 중지할 수 있다. 중지하여서는 안 된다는 설명이 옳지 않다."},"26-3-65":{"x":"부부가 모두 기초연금 수급권자이면 각각 20%를 감액한다. 선정기준액은 65세 이상 70% 수준, 국외 체류 60일 이상이면 지급 정지, 지급금품은 압류할 수 없으며 국민연금기금은 재원이 아니다."},"26-3-66":{"x":"국민연금 출산크레딧은 개정으로 첫째 자녀부터 12개월을 인정한다(제19조). 둘째 자녀부터 12개월이라는 설명이 옳지 않다. 가입기간은 월 단위로 계산하고 재취득 시 합산하며 실업 크레딧은 1년을 넘지 못한다.","note":"국민연금 개혁으로 출산크레딧은 첫째 자녀부터 12개월입니다."},"26-3-67":{"x":"건강보험의 보험자는 국민건강보험공단이고 요양급여의 적정성 평가 등을 위해 건강보험심사평가원을 설립한다."},"26-3-68":{"x":"특별현금급여에는 가족요양비, 특례요양비, 요양병원간병비가 포함된다. 단기보호와 주·야간보호, 방문간호는 재가급여이며 시설급여는 노인요양시설 등 입소다."},"26-3-69":{"x":"고용보험기금은 보험료 반환, 일시 차입금 상환금과 이자, 업무 대행·위탁 기관 출연금 등에 사용한다. 세 항목 모두 해당한다."},"26-3-70":{"x":"아동위원은 시·군·구에 둔다. 특별시·광역시·도에 둔다는 설명이 옳지 않다. 아동위원은 명예직으로 수당이 지급될 수 있다."},"26-3-71":{"x":"사회보장위원회·장애인정책조정위원회·아동정책조정위원회·다문화가족정책위원회는 모두 국무총리 소속이다. 자원봉사진흥위원회는 행정안전부장관 소속이라 소속이 다르다."},"26-3-72":{"x":"장애인복지법의 기본이념은 장애인의 완전한 사회참여와 평등을 통하여 사회통합을 이루는 것이다."},"26-3-73":{"x":"노인복지법상 부양의무자는 배우자(사실혼 포함)와 직계비속 및 그 배우자다. 직계존비속이라는 서술이 옳지 않다."},"26-3-74":{"x":"장애인의 날은 매년 4월 20일이다. 아동학대예방의 날은 11월 19일, 노인학대예방의 날은 6월 15일, 정신건강의 날은 10월 10일, 한부모가족의 날은 5월 10일이다."},"26-3-75":{"x":"모금회는 집중모금을 하려면 모집일부터 15일 전에 그 내용을 보건복지부장관에게 보고해야 한다. 설립은 인가이고 국가 보조가 가능하며 배분분과 위원은 한 차례만 연임할 수 있고 배분기준은 매년 8월 31일까지 공고한다."}},"data/e_po.json":{"17-3-1":{"x":"일차적 사회안전망(사회보험)과 이차적 사회안전망(공공부조)은 목표에 따라 구분되지만, 엄격하게 분리해서 운영하는 것은 아닙니다. 서로 보완하며 운영합니다. 2번이 틀렸습니다."},"17-3-2":{"x":"오남용의 위험은 현금급여가 더 큽니다. 현물급여는 목적 외 사용을 막을 수 있어 목표효율성이 높습니다. 3번이 틀렸습니다."},"17-3-3":{"x":"베버리지 보고서는 모든 국민을 대상으로 하는 보편적 사회보험을 구상했습니다. 빈곤계층 선별 복지를 강조했다는 설명이 틀렸습니다."},"17-3-4":{"x":"산재보험은 당연적용사업장이 가입하지 않았더라도 근로자는 보상을 받을 수 있습니다. 미가입 사업장의 재해는 보상받을 수 없다는 설명이 틀렸습니다."},"17-3-5":{"x":"소득상한선을 낮게 유지하면 고소득자가 부담하는 보험료의 상한이 낮아져, 고소득층의 부담은 상대적으로 줄어듭니다. 3번이 틀렸습니다."},"17-3-6":{"x":"국민기초생활보장제도의 선정기준은 기준 중위소득을 활용합니다.\n\n공공부조는 행정관리비용이 사회보험보다 높고, 재원은 조세이며, 재원 부담자와 수급자가 다르고, 부양의무자 기준은 급여별로 다르게 적용되어 왔습니다. 현행 기준(생계급여의 부양의무자 기준 폐지 등)은 법령으로 확인하세요."},"17-3-7":{"x":"조합주의 복지국가는 직역별로 제도가 분립되어 있어 직장을 옮기면 가입 제도가 달라집니다. 직장 이동성을 활성화한다는 설명이 틀렸습니다."},"17-3-8":{"x":"롤스의 사회정의는 무지의 베일, 원초적 상황, 차등의 원칙, 최소극대화 원칙으로 구성됩니다. 획일적 평등사회를 주장한 것은 아닙니다."},"17-3-9":{"x":"후기산업사회에서는 고령화로 노인부양비가 증가합니다. 감소한다는 설명이 틀렸습니다."},"17-3-10":{"x":"최근 20년간 우리나라는 저성장과 불안정 고용이 이어져 복지 재원 마련이 오히려 어려워졌습니다. 높은 경제성장이 지속되어 재원 마련이 쉬워졌다는 설명이 틀렸습니다."},"17-3-11":{"x":"로렌츠 곡선에서 모든 개인이 동일한 소득을 가진 완전 균등 상태는 45도 대각선입니다. 수직선이라는 설명이 틀렸습니다."},"17-3-12":{"x":"공공부조는 자산조사를 거쳐 대상을 선정합니다(ㄴ).\n\n신청 과정을 거치며(ㄱ은 틀림), 중앙정부와 지방정부가 책임을 분담하는 것이 일반적이고(ㄷ은 틀림), 공공부조는 소득재분배 효과가 가장 큰 제도입니다(ㄹ은 틀림)."},"17-3-13":{"x":"보육급여는 소득에 관계없이 보편적으로 제공되는 보육 지원입니다. 생계·주거·의료·교육급여는 국민기초생활보장제도 등 빈곤층을 대상으로 하는 급여입니다."},"17-3-14":{"x":"적립방식에서도 수입과 지출이 균형을 이루도록 하는 수지상등의 원칙을 고려합니다. 고려하지 않는다는 설명이 틀렸습니다."},"17-3-15":{"x":"정책평가의 지표는 정책 목표에 맞게 선택해야 하며, 측정의 용이성을 우선해서는 안 됩니다. 2번이 틀렸습니다."},"17-3-16":{"x":"정책 대안은 과거 정책 검토, 해외 사례 검토, 사회과학적 지식 활용, 직관적 방법 등으로 개발할 수 있습니다."},"17-3-17":{"x":"최근 지방자치단체의 자체 복지사업이 증가하는 추세입니다.\n\n고용불안정은 사회보험 기반을 약화시키고, 복지 총지출은 증가했으며, 근로빈곤층 지원은 확대되었고, 복지정책 대상은 극빈층에서 중산층까지 넓어지고 있습니다."},"17-3-18":{"x":"경제정책은 복지정책에 영향을 주고(ㄱ), 복지정책도 경제에 영향을 주며(ㄴ), 서로 상쇄할 수 있고(ㄷ), 자본주의 유지를 위해 복지정책이 필요하다는 설명도 있습니다(ㄹ)."},"17-3-19":{"x":"시장의 기능에 따라 1차적으로 소득이 분배되는 것은 소득분배입니다. 소득재분배는 정부나 민간이 이를 사후적으로 조정하는 것입니다. 2번이 틀렸습니다."},"17-3-20":{"x":"국민연금은 저소득층에 유리하게 설계되어 있고(ㄱ), 균등부분에서 소득재분배가 나타나며(ㄴ), 연금액은 기본연금액과 부양가족연금액을 기초로 산정합니다(ㄹ).\n\n비례상수가 매년 0.5%씩 감소한다는 설명(ㄷ)은 틀렸습니다. 2025년 개정으로 소득대체율은 43%로 조정되었습니다."},"17-3-21":{"x":"장기요양보험은 재가급여를 시설급여보다 우선하며(ㄴ), 재가급여에는 방문요양, 방문목욕 등이 있고(ㄷ), 특별현금급여에는 가족요양비 등이 있습니다(ㄹ).\n\n시설급여 제공기관은 노인요양시설과 노인요양공동생활가정이며, 노인전문병원은 해당하지 않습니다(ㄱ은 틀림)."},"17-3-22":{"x":"건강보험료 경감 대상은 휴직자(ㄱ), 장애인(ㄷ), 섬·벽지·농어촌 거주자(ㄹ) 등입니다. 60세는 경감 대상이 아니며 65세 이상이 대상입니다(ㄴ은 틀림). 경감 대상은 법령 개정으로 달라질 수 있으니 현행 국민건강보험법으로 확인하세요."},"17-3-23":{"x":"산재보험의 장해급여는 장해 등급에 따라 연금 또는 일시금으로 지급됩니다.\n\n업무와 재해 사이에 인과관계가 있어야 하고, 수급권은 퇴직해도 소멸하지 않으며, 소관 부처는 고용노동부입니다."},"17-3-24":{"x":"이 문항은 관련 규정 개정 전 기준으로, 공식 정답은 4번입니다. 자영업자 구직급여의 소정급여일수는 시험 당시와 현재 규정이 다르므로 90~240일이라는 설명이 틀렸다는 점만 확인하세요. 임금근로자의 구직급여 소정급여일수는 현재 120~270일입니다(2026년 기준, 세부 요건은 현행 고용보험법으로 확인)."},"17-3-25":{"x":"사회투자모형에서 인적자원에 대한 투자는 결과의 평등이 아니라 기회의 평등을 지향합니다. 3번이 틀렸습니다."},"18-3-1":{"x":"드림스타트는 취약 아동의 출발선을 평등하게 하려는 기회의 평등 사업입니다. 결과의 평등과는 연결되지 않습니다. 5번이 틀렸습니다."},"18-3-2":{"x":"영국 국민보험법(1911)은 건강보험과 실업보험으로 구성되었고(ㄴ), 스웨덴은 노동계급과 농민의 적녹동맹으로 복지국가 기틀을 마련했습니다(ㄹ).\n\n독일 재해보험법(1884)은 사용자가 전액 부담했고(ㄱ은 틀림), 미국은 대공황 때 총수요관리 정책을 도입했습니다(ㄷ은 틀림)."},"18-3-3":{"x":"경제발전이 일정 수준에 이르면 복지발전 정도가 비슷해진다고 보는 것은 산업화이론(수렴이론)입니다. 독점자본이론은 자본의 이익을 위한 국가의 역할로 설명합니다. 3번이 틀렸습니다."},"18-3-4":{"x":"조지와 월딩의 소극적 집합주의는 자본주의 시장체계의 약점을 보완하기 위해 국가 개입을 인정하는 입장입니다.\n\n나머지는 모형이 서로 바뀌어 있습니다. 가족이나 시장이 기능하지 못할 때만 개입하는 것은 잔여적 모형이고, 욕구 원칙의 보편적 서비스는 제도적 재분배 모형입니다."},"18-3-5":{"x":"개인책임과 자조의 원리를 강조하는 것은 자유주의 복지국가입니다. 보수주의 복지국가는 가족과 지위 유지를 중시합니다. 3번이 틀렸습니다."},"18-3-6":{"x":"사회적 배제는 빈곤과 박탈에 대한 새로운 접근법이고(ㄱ), 상대적 빈곤은 박탈지표방식과 소득·지출 기준의 상대적 추정방식으로 측정할 수 있습니다(ㄹ).\n\n빈곤율은 빈곤선 이하 인구의 비율로 소득분포 상태를 보여주지 않고(ㄴ), 생계급여 선정기준은 기준 중위소득의 일정 비율(2026년 32%)입니다(ㄷ은 틀림)."},"18-3-7":{"x":"5분위 배율은 상위 20%의 소득을 하위 20%의 소득으로 나눈 값입니다(ㄷ). 로렌츠 곡선이 45도선과 일치하면 완전 균등입니다(ㄹ).\n\n10분위 분배율은 클수록 평등하며(ㄱ은 틀림), 지니계수 상승은 불평등 악화입니다(ㄴ은 틀림)."},"18-3-8":{"x":"복지국가 위기 이후에는 시장화, 노동시장 유연화, 투자·생산적 복지 강조, 법인세 인하가 나타났습니다. 계층 간 소득 불평등이 완화된 것이 아니라 불평등이 심화되었습니다."},"18-3-9":{"x":"증서(바우처)는 현물급여에 비해 소비자의 선택권이 높습니다. 선택권이 낮다는 설명이 틀렸습니다."},"18-3-10":{"x":"사회보험료는 소득상한선이 있고 근로소득에만 부과되는 경우가 많아, 소득세보다 역진적입니다.\n\n인적공제가 없어 저소득층에게 불리하고, 상한선이 있어 고소득층에게 유리하며, 반대급부는 사회보험료가 더 특정화되어 있고, 추정된 부담능력은 조세의 개념이 아니라 사회보험에서 쓰는 개념이 아닙니다."},"18-3-11":{"x":"사회수당은 모든 해당 인구에 동일하게 지급해 필요에 따른 적절성이 낮습니다. 사회적 적절성 실현 정도가 높다는 설명이 틀렸습니다."},"18-3-12":{"x":"이용료는 저소득층의 서비스 접근성을 떨어뜨릴 수 있습니다. 향상시킨다는 설명이 틀렸습니다."},"18-3-13":{"x":"공공부조는 수직적 재분배(ㄱ), 개인연금은 세대 내 재분배(ㄴ), 아동수당은 수평적 재분배(ㄷ), 장기요양보험은 세대 간 재분배(ㄹ)입니다."},"18-3-14":{"x":"일반보조금은 지역 간 재정격차를 해소하려는 목적이 있고(ㄱ), 범주적 보조금은 서비스의 전국적 통일성과 평등한 수준을 유지하기에 적합하며(ㄴ), 매칭펀드는 지방정부의 재정운영을 어렵게 할 수 있습니다(ㄷ)."},"18-3-15":{"x":"사회복지정책은 능력이 아니라 욕구와 필요에 따른 배분을 중시합니다. 능력에 비례한 배분은 시장 원리입니다. 4번이 틀렸습니다."},"18-3-16":{"x":"조직화된 무정부 상태에서 정책이 우연히 결정된다고 보는 것은 쓰레기통 모형입니다. 혼합모형은 합리모형과 점증모형을 혼합해 근본적 결정과 세부적 결정을 구분합니다. 2번이 틀렸습니다."},"18-3-17":{"x":"공공부조는 자산조사를 통해 필요한 사람에게만 지급하므로 사회보험에 비해 비용효과성(대상효율성)이 높습니다."},"18-3-18":{"x":"희망키움통장과 내일키움통장은 자산형성지원사업입니다.\n\n의료급여는 본인부담금이 있고, 중위소득은 가구소득의 중간값에 증가율을 반영해 산정하며(보기 3의 서술은 정확하지 않음), 노숙인의 의료급여 구분과 부양의무자 기준 적용은 급여별로 다릅니다. 현행 부양의무자 기준은 법령으로 확인하세요."},"18-3-19":{"x":"근로장려세제(EITC)는 근로소득이 있는 저소득 가구에 세금 환급 형태로 지원하는 조세환급제도입니다.\n\n접수는 세무서·홈택스이고, 자격기준은 소득·재산·부양자녀 등이며, 근거는 조세특례제한법이고(2008년 시행), 신청주의가 원칙입니다."},"18-3-20":{"x":"이 문항은 시험에서 오류로 3번과 5번이 정답 처리되었습니다. 앱에서는 3번을 정답으로 처리합니다.\n\n외래 본인부담금은 의료기관 종별과 질병 종류에 따라 달라지며, 포괄수가제는 2002년 시범 시행되었으나 7개 질병군 전체 적용은 이후입니다."},"18-3-21":{"x":"공식 정답은 5번입니다(시험 당시 군복무자에게 6개월 추가 산입). 다만 2026년 1월 시행 국민연금법 개정으로 군복무 크레딧은 최대 12개월로 확대되었다는 보도가 있어, 현행 기준으로는 서술이 달라집니다. 이 문항은 시험 당시 정답표로 채점하며, 실제 시험 대비에는 현행 규정으로 확인하세요.\n\n1번(실업크레딧으로 산입 가능), 2번(출산크레딧은 현행 첫째부터), 3번(농어업인 보험료 국고 지원 가능), 4번(소득활동 시 감액 기간은 최대 5년)은 시험 당시에도 틀린 서술입니다."},"18-3-22":{"x":"장기요양보험에는 가족에게 요양을 받을 때 지급하는 특별현금급여(가족요양비)가 있습니다.\n\n단기보호는 재가급여이고, 보험료는 건강보험료와 통합 징수하며, 인정 유효기간은 최소 1년 이상이고, 보험료율은 대통령령으로 정합니다."},"18-3-23":{"x":"산재보험의 도입 이론에는 사회적 타협이론, 산업위험이론, 사회비용최소화이론이 있습니다. 배상책임이론은 사용자 과실에 대한 민사 배상의 논리여서 도입 이론으로 보지 않습니다."},"18-3-24":{"x":"안토넨과 시필라의 모형에서 자산조사·시장의존 모형은 미국이 대표 사례입니다.\n\n보충주의는 독일, 공공서비스 모형은 스웨덴·핀란드 등 북유럽, 가족주의는 스페인·이탈리아 등 남유럽 국가입니다. 보기의 연결은 서로 바뀌어 있습니다."},"18-3-25":{"x":"1834년 신빈민법과 현재의 국민기초생활보장제도에는 모두 열등처우의 원칙(수급자의 생활수준은 최하위 노동자보다 낮아야 한다는 원칙)이 반영되어 있습니다."},"19-3-1":{"x":"사회보험은 국가의 책임으로 시행합니다.\n\n공공부조는 국가와 지방자치단체가 함께 책임지고, 사회서비스도 지방자치단체만의 책임이 아니며, 국가는 민간단체의 참여를 제한하지 않고, 사회보험 비용은 국가, 사용자, 가입자가 분담합니다."},"19-3-2":{"x":"보편주의는 소득이나 자산조사 없이 해당 인구집단 모두에게 지급하는 제도입니다. 실업급여는 가입자 전체에게 기여 요건에 따라 지급되는 사회보험입니다. 공공부조(생계·의료·주거)와 기초연금은 선별주의입니다."},"19-3-3":{"x":"국가나 지방자치단체는 사회복지법인에 우선해 사회복지시설을 설치·운영할 수 있습니다. 우선하여 설치할 수 없다는 설명이 틀렸습니다."},"19-3-4":{"x":"반집합주의는 개인, 시장, 경쟁, 가족 같은 가치를 선호합니다. 평등은 집합주의가 선호하는 가치입니다."},"19-3-5":{"x":"업무상 재해의 인정 기준은 업무상 사고, 업무상 질병, 출퇴근 재해입니다. 장애등급은 급여 산정과 관련된 개념입니다."},"19-3-6":{"x":"비례적 평등은 기여나 필요에 비례해 차등하는 형평(equity)이며, 결과의 평등이 아닙니다. 5번이 틀렸습니다."},"19-3-7":{"x":"장애인연금은 중증장애인에게 소득보장을 하는 공공부조 성격의 제도입니다. 장애연금, 장해연금, 상병보상연금, 노령연금은 사회보험입니다."},"19-3-8":{"x":"국민연금 가입기간 추가 산입의 비용은 국가가 부담하는 방식(크레딧)입니다. 국가와 사용자가 반씩 부담한다는 설명이 틀렸습니다.\n\n3번(자녀 두 명이면 12개월)은 시험 당시 기준이며, 2026년 1월 개정으로 출산크레딧이 첫째부터 12개월로 확대되었다는 보도가 있어 현행 기준과 다릅니다. 시험 당시 정답표로 채점합니다."},"19-3-9":{"x":"사회복지서비스의 교환은 대가를 반드시 지불해야 하는 쌍방적 교환이 아니라, 대가 없이 제공되는 일방적 이전관계입니다. 4번이 틀렸습니다."},"19-3-10":{"x":"아동복지정책은 요보호아동의 국내입양을 우선하고 국외입양은 최후의 수단으로 합니다. 국외입양을 활성화한다는 설명이 틀렸습니다."},"19-3-11":{"x":"케인즈는 소득이 증가하면 저축이 늘고, 저축이 소비를 줄여 유효수요가 감소한다고 보았습니다. 소득이 증가하면 저축이 감소한다는 설명이 틀렸습니다."},"19-3-12":{"x":"킹돈의 모형은 정치, 문제, 정책대안의 흐름이 각각 따로 흐르다가(ㄴ), 정책의 창이 열릴 때 결합합니다(ㄷ). 정치와 문제의 흐름이 결합해 정책의제를 결정합니다(ㄹ).\n\n정책결정이 체계적으로 이루어진다는 설명은 틀렸습니다(ㄱ). 조직화되지 않은 무질서 상태가 전제입니다."},"19-3-13":{"x":"사회적 기업은 영업활동을 하는 기업이며, 사회복지사업법에 따른 사회복지시설이 아닙니다. 4번이 틀렸습니다."},"19-3-14":{"x":"사회서비스는 사회적 욕구 충족에 초점을 둡니다.\n\n기관 운영 지원이 목적이 아니고, 이윤추구가 일차 목적이 아니며, 노동시장 참여도 강조하고, 공급자 지원에서 수요자 지원으로 변화했습니다."},"19-3-15":{"x":"사회적 연대는 개인이 희생을 강요받는 원리가 아니라, 구성원이 서로 돕는 상부상조의 원리입니다. 개인이 전체를 위해 희생해야 한다는 설명이 틀렸습니다."},"19-3-16":{"x":"정책평가는 정책결정에 필요한 정보 제공, 정책 개선, 정당성 확보, 이론 형성에 기여합니다."},"19-3-17":{"x":"사회보험의 보험료와 급여는 개별적 공평성과 사회적 적절성을 함께 반영합니다.\n\n급여는 보험료에 비례하지 않고 사회적 적절성을 고려하며, 민영보험은 개별 위험에 비례하고 사회보험은 집단적 위험으로 책정하며, 민영보험은 대부분 적립방식을 씁니다."},"19-3-18":{"x":"권리성은 사회보험이 구체적이고 강하며 공공부조는 상대적으로 약합니다(ㄷ은 반대로 서술). 특징은 사회보험이 사전적(예방), 공공부조가 사후적(구제)입니다(ㅁ도 반대로 서술)."},"19-3-19":{"x":"지니계수는 1에 가까울수록 불평등한 상태입니다. 평등하다는 설명이 틀렸습니다."},"19-3-20":{"x":"이 문항은 시험에서 오류로 모두 정답 처리되었습니다. 앱에서는 1번을 정답으로 처리합니다.\n\n현행 기준으로 차상위계층은 소득인정액이 기준 중위소득 50% 이하인 사람입니다. 생계급여 선정기준은 기준 중위소득의 32%(2026년), 교육급여는 50%입니다. 보기 2·4는 기준 비율이 현행과 다릅니다."},"19-3-21":{"x":"소득재분배는 일부의 효용을 줄이면서 다른 사람의 효용을 높이므로 파레토 효율의 정의에는 맞지 않습니다. 2번이 틀렸습니다."},"19-3-22":{"x":"장기요양기관에는 노인요양시설, 주야간보호시설, 단기보호시설, 노인요양공동생활가정, 방문요양기관 등이 있습니다. 노인요양병원은 장기요양기관이 아닙니다."},"19-3-23":{"x":"비정규직은 인적자본 형성 기회를 줄이고(ㄱ), 노동 유연성 증가가 원인에 포함됩니다(ㄷ).\n\n정규직과 비정규직의 사회보험 가입률에는 차이가 있습니다(ㄴ은 틀림)."},"19-3-24":{"x":"확정급여식 연금의 재정은 완전적립방식에서 부과방식까지 다양하고(ㄱ), 확정기여식 연금의 급여액은 적립금과 투자수익으로 결정됩니다(ㄴ).\n\n확정급여식에서는 투자위험을 연금제도가 부담하고(ㄷ은 틀림), 위험을 사회적으로 분산하는 것은 확정급여식의 장점입니다(ㄹ은 틀림)."},"19-3-25":{"x":"국가가 시장에 개입하는 근거는 시장실패이며, 긍정적·부정적 외부효과, 비대칭적 정보, 역선택이 모두 시장실패의 요인입니다."},"20-3-1":{"x":"길버트법(1782)은 원외구제를 허용했습니다.\n\n열등처우의 원칙은 신빈민법(1834), 비스마르크의 3대 사회보험은 질병, 산재, 노령폐질보험이고, 미국 사회보장법(1935)은 의료보험을 포함하지 않았으며, 베버리지 보고서는 정액 방식의 사회보험을 제안했습니다."},"20-3-2":{"x":"센 지수는 빈곤율, 빈곤갭, 빈곤집단 내 소득불평등(지니계수)을 모두 반영합니다.\n\n완전 평등 시 로렌츠 곡선은 대각선과 일치하고, 지니계수는 0~1이며, 빈곤갭은 빈곤선과 실제 소득의 격차, 빈곤율은 빈곤인구 비율입니다."},"20-3-3":{"x":"적극적 자유의 관점에서 자유의 침해는 개인에게 필요한 자원이나 기회를 박탈당한 것을 의미합니다.\n\n자유지상주의는 소극적 자유를 옹호하고, 소극적 자유는 국가 개입이 적을수록 좋으며, 적극적 자유의 관점에서는 국가가 임대인의 자유를 제약할 수 있고, 외적 강제가 없는 상태는 소극적 자유입니다."},"20-3-4":{"x":"권력자원론은 노동계급의 조직과 정치적 힘이 복지국가 발전을 결정한다고 봅니다. 사회복지정책이 권력 엘리트의 산물이라는 것은 엘리트이론의 주장입니다."},"20-3-5":{"x":"국민기초생활보장제도는 현재 기준 중위소득을 활용하는 상대적 빈곤개념을 적용합니다. 절대적 빈곤개념이라는 설명이 틀렸습니다."},"20-3-6":{"x":"생태주의 관점은 복지국가의 성장 패러다임에 비판적입니다. 성장을 옹호한다는 설명이 틀렸습니다."},"20-3-7":{"x":"사회적 배제 개념은 열등처우의 원칙이 아니라 1970~80년대 프랑스에서 빈곤과 박탈을 다차원적·동태적으로 설명하려는 흐름에서 등장했습니다. 3번이 틀렸습니다."},"20-3-8":{"x":"소득재분배 효과가 가장 큰 것은 누진적인 소득세입니다. 재산세의 효과가 가장 크다는 설명이 틀렸습니다."},"20-3-9":{"x":"복지혼합 유형에서 이용자의 선택권은 계약 < 증서 < 세제혜택 순으로 커집니다."},"20-3-10":{"x":"이용료의 소득재분배 효과는 정액제 < 정률제 < 연동제(소득에 따른 차등) 순으로 커집니다."},"20-3-11":{"x":"민간 실업보험에서는 역의 선택(ㄱ), 도덕적 해이(ㄴ), 위험의 상호의존성으로 인한 보험료 산정의 어려움(ㄷ)이 문제입니다. 무임승차자 문제(ㄹ)는 공공재에서 나타나는 문제입니다."},"20-3-12":{"x":"베버리지가 사회보장의 전제조건으로 든 것은 아동(가족)수당, 완전고용, 포괄적 의료 및 재활서비스입니다. 최저임금은 포함되지 않습니다."},"20-3-13":{"x":"아동수당은 연령이라는 인구학적 기준을 적용한 제도입니다.\n\n자산조사는 선별주의이고, 장애수당은 장애 정도에 대한 진단을 고려하며, 긴급복지지원은 선별적이고, 기초연금의 대상 선정에는 부양의무자 유무가 포함되지 않습니다."},"20-3-14":{"x":"정률 사회보험료는 소득상한선과 근로소득 중심 부과로 소득세보다 역진적이고(ㄱ), 사회보험료는 조세보다 징수 저항이 적으며(ㄴ), 소득이 높은 사람이 더 많이 부담하고(ㄷ), 조세는 지불능력과 관련됩니다(ㄹ)."},"20-3-15":{"x":"과정분석은 정책사정(정책이 어떻게 이루어지는지)을 이해하는 것이 목적입니다.\n\n산물분석은 정책선택 쟁점, 성과분석은 실행 결과의 평가이고, 정책형성 맥락은 과정분석입니다."},"20-3-16":{"x":"직장 내 괴롭힘이나 고객의 폭언 등으로 인한 업무상 정신적 스트레스로 생긴 질병도 업무상 재해로 인정될 수 있습니다. 인정되지 않는다는 설명이 틀렸습니다.\n\n보험료 징수는 사회보험 징수통합(2011년)에 따라 국민건강보험공단이 하며, 보험급여의 결정과 지급은 근로복지공단이 합니다."},"20-3-17":{"x":"민영화로 상업화되면 취약계층의 서비스 접근성이 오히려 낮아질 수 있습니다. 높아진다는 설명이 틀렸습니다."},"20-3-18":{"x":"북한이탈주민과 그 가족 중 보건복지부장관이 정하는 사람은 의료급여 1종 수급권자입니다. 2종이라는 설명이 틀렸습니다. 수급권자 구분은 법 개정으로 달라질 수 있으니 현행 의료급여법으로 확인하세요."},"20-3-19":{"x":"운영효율성은 공공부조가 가장 높지 않습니다. 자산조사와 관리 비용 때문에 사회수당이 더 높습니다. 5번이 틀렸습니다."},"20-3-20":{"x":"건강보험의 부가급여는 법에 임신·출산 진료비, 장제비, 상병수당 등이 규정되어 있지만, 장제비는 실제 지급하지 않아 '지급하고 있다'는 서술이 틀렸습니다. 상병수당은 시범사업을 거쳐 확대 중이며, 현행 시행 여부는 확인하세요."},"20-3-21":{"x":"근로장려금의 신청 접수는 보건복지부가 아니라 국세청(세무서·홈택스)이 담당합니다. 1번이 틀렸습니다."},"20-3-22":{"x":"실업급여를 받을 권리는 양도, 압류, 담보 제공이 금지됩니다.\n\n구직급여 급여일수는 대기기간을 제외하고, 육아휴직급여의 비율은 통상임금의 일정 비율이고, 자영업자 실업급여에 연장급여는 포함되지 않으며, 65세 이후 자영업을 개시한 사람에게는 적용이 제한됩니다."},"20-3-23":{"x":"기준 중위소득 4인 460만원의 30%(2019년 기준 생계급여 선정기준) = 138만원이고, 소득인정액 100만원을 빼면 월 생계급여는 38만원입니다."},"20-3-24":{"x":"통합 징수한 장기요양보험료와 건강보험료는 각각 독립회계로 관리해야 합니다.\n\n보험자는 국민건강보험공단이고, 유효기간은 최소 1년 이상이며, 재가급여의 본인부담은 15%, 시설급여와 특별현금급여는 중복해서 받을 수 없습니다."},"20-3-25":{"x":"기초연금은 보험료 납부 없이 지급되는 무기여방식의 노후 소득보장제도입니다.\n\n65세 이상 소득하위 70%에게 지급하는 선별 제도이고, 국민연금 급여액을 연계해 감액하며, 가구 유형과 소득에 따라 다르고, 유족급여는 없습니다."},"21-3-1":{"x":"사회복지정책은 능력이 아니라 욕구와 필요에 따른 배분을 원칙으로 합니다. 능력에 비례한 배분은 시장 원리입니다."},"21-3-2":{"x":"비경합적이고 비배제적인 성격 때문에 모든 구성원이 활용할 수 있는 재화는 공공재입니다."},"21-3-3":{"x":"시민권론(마샬)은 공민권(18세기) → 참정권(19세기) → 사회권(20세기) 순으로 발전했다고 설명합니다. 참정권, 공민권 순이라는 서술이 틀렸습니다."},"21-3-4":{"x":"신빈민법은 원외구제를 금지하고 작업장 수용을 원칙으로 했습니다. 원외구제를 인정했다는 설명이 틀렸습니다."},"21-3-5":{"x":"에스핑-앤더슨은 탈상품화와 계층화를 기준으로 유형을 나누었고(ㄱ), 자유주의 복지국가는 자산조사 공공부조의 비중이 크며(ㄴ), 사회민주주의 복지국가는 보편적 원칙으로 탈상품화 효과가 큽니다(ㄹ).\n\n보수주의 복지국가는 사회보험에 크게 의존합니다(ㄷ은 틀림)."},"21-3-6":{"x":"새로운 사회적 위험은 일과 가정의 양립, 고령화와 돌봄, 근로빈곤, 재정 부족 등입니다. 국가 간 노동 이동은 줄어드는 것이 아니라 늘어나고 있습니다."},"21-3-7":{"x":"비례적 평등은 개인의 능력, 업적, 공헌에 따라 자원을 분배하는 것입니다.\n\n적극적 자유는 자원과 기회를 가질 자유이고, 재분배는 부자의 소극적 자유를 일부 제약하며, 결과가 같으면 과정은 상관없다는 것은 결과의 평등이며, 기회의 평등은 소극적 평등 개념입니다."},"21-3-8":{"x":"기초생활보장제도의 선정기준은 기준 중위소득의 일정 비율로 상대적 빈곤 개념을 반영합니다.\n\n전물량 방식은 최소 생활필수품 전체를 계산하고, 라이덴 방식은 주관적 방식이며, 반물량 방식은 식료품비에 엥겔계수의 역수를 곱하고, 중위소득 기준은 상대적 빈곤 측정입니다."},"21-3-9":{"x":"과정분석은 정책형성의 정치적·사회적 배경을 고찰하므로 연구자의 가치와 관점이 개입될 수 있습니다. 연구자의 주관을 배제해야 한다는 설명이 틀렸습니다."},"21-3-10":{"x":"고용보험법상 구직급여는 현금급여입니다. 현물급여가 아닙니다."},"21-3-11":{"x":"장애인연금(ㄱ), 기초연금(ㄷ), 의료급여(ㄹ)는 선별주의에 근거한 제도입니다. 아동수당(ㄴ)은 인구학적 기준을 적용하는 보편주의 제도입니다."},"21-3-12":{"x":"사회복지전달체계는 공급자와 수요자를 이어주는 매개체이고(ㄴ), 서비스를 제공하기 위한 조직과 인력입니다(ㄷ), 공급자를 공간적으로 분산하면 접근성이 높아집니다(ㄹ).\n\n가격기구를 매개로 상호작용하는 것은 시장의 방식입니다(ㄱ은 틀림)."},"21-3-13":{"x":"사회복지정책의 수급조건에는 연령, 자산조사, 기여 여부, 진단평가가 있습니다. 최종 학력은 수급조건이 아닙니다."},"21-3-14":{"x":"사회복지재정의 기능 중 하나는 소득재분배입니다.\n\n재원은 주로 조세와 사회보험료이고, 조세가 누진적일수록 재분배 효과가 크며, 한국의 조세부담률은 OECD 평균보다 낮고, 이용료는 연동제가 정액제보다 재분배 효과가 큽니다."},"21-3-15":{"x":"사회복지 재화와 서비스는 정보의 불완전성으로 소비자들의 합리적 선택에 차이가 납니다.\n\n독점은 바람직하지 않고, 공공재는 공공에서 제공하는 것이 적절하며, 공공부문은 경쟁이 약하고, 오용과 남용의 문제가 발생할 수 있습니다."},"21-3-16":{"x":"자산형성지원으로 형성된 자산은 수급자의 소득환산액 산정에서 제외됩니다. 포함한다는 설명이 틀렸습니다."},"21-3-17":{"x":"이 문항은 시험에서 오류로 확정되어 전항 정답 처리되었습니다. 앱에서는 가답안인 4번을 정답으로 처리합니다.\n\n아동학대 예방의 날 지정(ㄴ), 아동보호전문기관의 신고접수와 현장조사 역할(ㄷ), 피해아동 가족에 대한 지원(ㄹ)이 옳은 설명입니다."},"21-3-18":{"x":"긴급복지지원법은 다른 법령에 따른 지원을 받는 경우 그 지원을 우선하고, 긴급지원은 이를 보충합니다. 국민기초생활보장법의 지원을 받고 있으면 이를 우선 적용합니다. 5번이 틀렸습니다."},"21-3-19":{"x":"사회복지시설 종사자도 사회복지운동의 주체가 될 수 있습니다. 될 수 없다는 설명이 틀렸습니다."},"21-3-20":{"x":"사회보험 급여는 자산조사가 아니라 가입과 기여, 사회적 위험의 발생에 근거해 결정됩니다. 2번이 틀렸습니다."},"21-3-21":{"x":"적립방식은 자신이 낸 보험료로 노후를 보장하는 방식이어서 세대 내 소득재분배 효과가 부과방식보다 큽니다(ㄱ).\n\n자본축적 효과는 적립방식이 크고(ㄴ은 틀림), 기금 확보가 쉬운 것은 부과방식이라는 점은 시험에서 정답에 포함되지 않았습니다(ㄷ)."},"21-3-22":{"x":"고용보험의 보험가입자는 사업주와 근로자 모두 포함합니다.\n\n보험료 부과·징수는 고용보험위원회가 아니고, 가입 대상은 근로자와 자영업자이며, 구직급여는 대기기간 7일을 거쳐 지급하고, 재원은 사업주와 근로자 등이 분담합니다."},"21-3-23":{"x":"공공부조(ㄱ), 취약계층 대상 사회복지서비스(ㄴ), 위험 미발생집단에서 발생집단으로의 이전(ㄷ), 부조방식이 보험방식보다 재분배 효과가 크다는 설명(ㄹ)은 모두 옳습니다."},"21-3-24":{"x":"우리나라는 조합방식 의료보험을 통합방식으로 전환해 국민건강보험제도로 변경했습니다(2000년 통합).\n\n건강보험은 강제가입이고, 보험료는 소득재분배 기능을 하며, 보험자는 국민건강보험공단이고, 직장가입자 보험료는 보수월액에 보험료율을 곱해 산정합니다."},"21-3-25":{"x":"총괄평가는 정책이 집행된 후 정책이 사회에 미친 영향을 평가하는 것입니다.\n\n과정평가는 집행 중 평가, 결과평가는 집행 후, 효율성 평가는 투입 대비 산출, 효과성 평가는 목적 달성 여부를 평가합니다."},"22-3-1":{"x":"조지와 윌딩의 이념 중 복지국가의 확대를 가장 지지하는 것은 페이비언 사회주의입니다."},"22-3-2":{"x":"소극적 자유는 간섭으로부터의 자유입니다. 자신이 원하는 것을 할 수 있는 능력은 적극적 자유입니다. 1번이 틀렸습니다."},"22-3-3":{"x":"국민연금의 연금크레딧 중 가장 최근에 시행된 것은 실업크레딧(2016년)입니다. 출산크레딧과 군복무크레딧은 2008년에 시행되었습니다. 2026년 개정으로 크레딧이 확대되었지만 이 문항의 정답은 달라지지 않습니다."},"22-3-4":{"x":"행위별수가제는 과잉진료를 유도할 수 있고(ㄱ), 의료진의 자율성이 확보됩니다(ㄴ). 포괄수가제는 발생빈도가 높은 질병군에 적용하며(ㄷ), 환자의 본인부담금이 줄 수 있습니다(ㄹ)."},"22-3-5":{"x":"노인장기요양보험기금과 국민건강보험기금은 보험료는 통합 징수하지만 회계는 각각 독립적으로 관리합니다. 통합하여 관리한다는 설명이 틀렸습니다."},"22-3-6":{"x":"고용보험은 직업능력개발훈련을 실시하는 사업주를 지원하고(ㄱ), 실업 신고 후 질병 등으로 구직활동을 할 수 없으면 상병급여를 지급합니다(ㄷ).\n\n예술인도 고용보험 가입 대상이고(ㄴ은 틀림), 고용안정·직업능력개발 사업의 보험료는 사업주가 부담합니다(ㄹ은 틀림)."},"22-3-7":{"x":"사회보험은 현물급여와 현금급여를 모두 제공하며, 민영보험은 현금급여를 원칙으로 합니다. 사회보험이 현금급여를 원칙으로 한다는 설명이 틀렸습니다."},"22-3-8":{"x":"국민기초생활보장 수급자 중 보장시설에서 급여를 받는 사람은 의료급여 1종 수급권자입니다. 2종이라는 설명이 틀렸습니다. 수급권자 구분은 현행 의료급여법으로 확인하세요."},"22-3-9":{"x":"산재보험의 급여에는 요양급여, 휴업급여, 장해급여, 간병급여, 유족급여, 상병보상연금, 장례비, 직업재활급여가 있습니다. 상병수당은 건강보험의 부가급여입니다."},"22-3-10":{"x":"사회복지 전담공무원은 수급권자의 동의를 받아 직권으로 급여를 신청할 수 있습니다.\n\n의료급여 선정기준은 기준 중위소득의 40%, 교육급여는 50%이고(2026년 기준), 수급권자는 법에 따른 급여를 받을 자격이 있는 사람이며, 보장기관은 시·도지사와 시장·군수·구청장입니다."},"22-3-11":{"x":"탈상품화 정도가 가장 높은 곳은 사회민주주의 복지국가입니다. 자유주의 복지국가는 탈상품화 정도가 낮습니다. 2번이 틀렸습니다."},"22-3-12":{"x":"낙수효과는 시장의 효과로, 국가가 복지를 제공해야 하는 이유가 아닙니다. 공공재, 외부효과, 역선택, 정보의 비대칭이 국가 개입의 근거입니다."},"22-3-13":{"x":"노인장기요양보험은 요양등급을 판정해 급여를 제공하므로 진단적 구분이 적용됩니다.\n\n국민연금은 가입·기여가 요건이고, 아동수당은 인구학적 기준을 적용하는 보편 제도이며, 기초생활보장은 선별 제도이고, 장애인연금은 중증장애인 중 저소득층에게 지급하는 선별 제도입니다."},"22-3-14":{"x":"길버트법은 원외구제를 허용했고(ㄱ), 비스마르크는 사회통합을 위해 사회보험을 도입했습니다(ㄹ).\n\n신빈민법은 지주계급을 위한 법이 아니라 구빈행정을 통일하고 원내구제를 원칙으로 했으며(ㄴ은 틀림), 미국 사회보장법(1935)은 연방정부의 책임을 확대했습니다(ㄷ은 틀림)."},"22-3-15":{"x":"건강보험의 할당은 기여조건, 급여는 현금·현물급여, 전달체계는 민간·공공 전달체계, 재정은 보험료·국고보조금·이용료입니다."},"22-3-16":{"x":"최저임금제는 근로기준법·최저임금법에 근거한 노동정책이며, 사회보장기본법상의 사회보장제도(사회보험, 공공부조, 사회서비스)가 아닙니다."},"22-3-17":{"x":"기업복지는 근로자 개인에 대한 혜택이어서 조세방식보다 재분배 효과가 작고, 오히려 격차를 키울 수 있습니다. 1번이 틀렸습니다."},"22-3-18":{"x":"개인 사업자가 노인요양시설을 운영하는 것은 민간 영리기관이 사회서비스를 전달하는 사례입니다. 나머지는 공공이나 비영리 조직이 전달하는 사례입니다."},"22-3-19":{"x":"합리모형은 인간의 합리성에 기초해 최선의 대안을 찾는 모형이고(ㄱ), 쓰레기통모형은 문제, 정책, 정치의 흐름이 우연히 결합해 정책의 창이 열릴 때 결정된다고 봅니다(ㄷ).\n\n조직화된 무정부 상태는 쓰레기통모형이고(ㄴ은 틀림), 혼합모형은 합리모형과 점증모형의 혼합입니다(ㄹ은 틀림)."},"22-3-20":{"x":"상대적 박탈은 생물학적 기준이 아니라 사회적 기준에서 박탈을 느끼는 것을 의미합니다. 5번이 틀렸습니다."},"22-3-21":{"x":"로렌츠곡선의 가로축은 인구의 누적분포입니다(ㄱ). 지니계수는 1에 가까울수록 불평등합니다(ㄴ). 5분위 배율은 수치가 작을수록 평등합니다(ㄹ).\n\n빈곤의 심도를 나타내는 것은 빈곤갭이며 빈곤율이 아닙니다(ㄷ은 틀림)."},"22-3-22":{"x":"기회를 제공하는 프로그램의 예로 장애인의무고용제를 들 수 있습니다.\n\n현금급여는 선택의 자유를 강조하고, 현물급여는 사회적 통제를 강조하며, 바우처는 수요자에게 지급하고, 소비자 선택권은 현금급여, 바우처, 현물급여 순으로 낮아집니다."},"22-3-23":{"x":"수렴이론은 산업화의 수준이 비슷해지면 사회복지제도도 수렴한다고 설명합니다. 사회적 양심과 이타주의를 말하는 것은 사회양심론입니다. 3번이 틀렸습니다."},"22-3-24":{"x":"공공부조는 고소득층에서 저소득층으로의 수직적 재분배의 예입니다.\n\n재분배는 시장 이후에 일어나고, 세대 내 재분배는 한 세대 안에서 이루어지며, 수직적 재분배가 누진성이 크고, 세대 간 재분배는 부과방식에서 이루어집니다."},"22-3-25":{"x":"사회투자전략은 현재 아동세대에 대한 선제적 투자를 중시합니다.\n\n인적자원 투자는 기회의 평등을 목적으로 하고, 현금이전보다 투자를 중시하며, 사회정책과 경제정책을 통합하고, 소비 지원보다 투자를 강조합니다."},"23-3-1":{"x":"베버리지 보고서의 5대 악은 결핍(궁핍), 질병, 무지, 불결, 나태입니다. 산업재해는 포함되지 않습니다."},"23-3-2":{"x":"정책평가는 가치를 판단하는 활동으로 가치중립적이지 않습니다. 5번이 틀렸습니다."},"23-3-3":{"x":"롤스의 정의의 제1원칙은 기본적 자유에 대한 동등한 권리입니다.\n\n제2원칙에서 기회균등이 전제되고, 최소극대화를 위한 차등은 허용되며, 최대다수의 최대행복은 공리주의, 정당한 소유는 노직의 주장입니다."},"23-3-4":{"x":"사회복지정책은 생존권 보장, 사회통합 증진, 개인의 자립성 증진을 위해 필요합니다. 능력에 따른 분배는 시장 원리입니다."},"23-3-5":{"x":"의회민주주의의 정착과 노동자계급의 조직화된 힘을 강조하는 이론은 권력자원이론입니다."},"23-3-6":{"x":"스핀햄랜드법(1795)은 임금 보조 제도입니다. 열등처우의 원칙을 명문화한 것은 신빈민법(1834)입니다. 4번이 틀렸습니다."},"23-3-7":{"x":"소극적 집합주의는 시장의 약점을 보완하고 불평등과 빈곤에 대응하기 위해 실용적으로 국가가 개입해야 한다고 봅니다."},"23-3-8":{"x":"탈상품화는 노동시장에 참여하지 않아도 생활할 수 있는 정도를 뜻합니다. 돌봄이나 서비스 부담을 가족에게 의존하지 않는 정도는 탈가족화입니다. 2번이 틀렸습니다."},"23-3-9":{"x":"행위별 수가제는 진료 행위마다 비용을 지불해 의료비를 늘릴 수 있는 방식입니다. 의료비 절감 효과와 가장 관련이 적습니다."},"23-3-10":{"x":"총급여액 1,800만원이면 장려금은 200만원 - (1,800만원 - 1,200만원) × 10% = 140만원입니다. 150만원이라는 계산이 틀렸습니다."},"23-3-11":{"x":"부양의무자 기준은 완화되었고(ㄱ), 기준 중위소득은 2015년 이후 지속적으로 인상되었으며(ㄴ), 근로능력평가 방식이 변화했습니다(ㄹ).\n\n교육급여는 최근 10년 내 신설된 것이 아닙니다(ㄷ은 틀림)."},"23-3-12":{"x":"공공부조는 자산조사를 통해 필요한 사람에게 지급하므로 대상효율성이 높습니다."},"23-3-13":{"x":"이 문항의 시험 당시 정답은 3번(취업성공패키지)입니다. 그러나 취업성공패키지는 2021년 1월 국민취업지원제도로 개편되어 현재는 운영되지 않습니다. 현행 기준으로는 맞는 보기가 없어, 앱에서는 채점에서 제외합니다.\n\n나머지 보기도 틀렸습니다. 노인 일자리사업의 운영기관은 한국노인인력개발원이고, 장애인 고용의무는 일정 규모 이상 사업체에 적용되며, 수급자 전원이 자활사업에 참여하는 것은 아니고, 고령자 미채용 기업에 부담금을 부과하지 않습니다.","cur":0,"note":"시험 당시 정답은 3번(취업성공패키지)이었으나, 이 제도는 2021년 국민취업지원제도로 개편되었습니다."},"23-3-14":{"x":"고용보험과 산재보험은 모두 소득활동 중 발생하는 소득상실 위험에 대한 사회안전망입니다.\n\n구직급여는 구직활동이 요건이고, 모든 근로자가 적용받는 것은 아니며, 장해급여는 장해가 남은 근로자에게 지급되고, 보험료율은 다릅니다."},"23-3-15":{"x":"상대적 빈곤선은 중위소득의 일정 비율(ㄱ)이나 타운센드의 박탈지표 방식(ㅁ)으로 설정합니다. 라이덴 방식은 주관적 방식이고, 반물량 방식과 라운트리 방식은 절대적 빈곤선 방식입니다."},"23-3-16":{"x":"우리나라의 사회보험은 업무가 연금·건강보험·고용·산재 등으로 나뉘어 있어 한 기관이 모두 운영하지 않습니다. 5번이 틀렸습니다."},"23-3-17":{"x":"공적연금은 국민연금과 특수직역연금으로 구분하여 운영하며(ㄱ), 노령, 장애, 사망으로 소득이 중단될 때 급여를 지급합니다(ㄹ).\n\n특수직역연금(공무원연금, 1960년)이 국민연금(1988년)보다 먼저 시행되었고(ㄴ은 틀림), 수급개시연령은 제도마다 달라 동일하지 않습니다(ㄷ은 틀림)."},"23-3-18":{"x":"길버트와 테렐의 전달체계 재구조화 전략은 기관들의 동일 장소 배치, 사례별 협력, 전문가 이탈 방지(전문화된 접근), 시민 참여 등입니다. 수급자 수요 강화는 포함되지 않습니다."},"23-3-19":{"x":"긍정적 외부효과가 큰 영역은 시장에 맡기면 과소 공급되므로 정부가 개입하는 것이 바람직합니다. 민간이 담당하는 것이 바람직하다는 설명이 틀렸습니다."},"23-3-20":{"x":"산물분석은 정해진 틀에 따라 정책 내용을 분석해서, 기존 주류적 입장을 대변할 가능성이 높다는 한계가 있습니다."},"23-3-21":{"x":"길버트와 테렐의 사회적 효과성은 사람들이 사회의 평등한 구성원으로 대우받는 정도로 판단하는 개념입니다."},"23-3-22":{"x":"드로어의 최적모형은 합리모형과 점증모형의 단순 혼합이 아니라 정책성과를 최적화하려는 모형이고(ㄱ), 합리적 요소와 초합리적 요소를 모두 고려하는 질적 모형이며(ㄴ), 체계론적 시각에서 파악하고(ㄹ), 실현가능성이 낮다는 비판을 받습니다(ㅁ).\n\n초합리성의 달성 방법에 대한 명확한 설명은 없습니다(ㄷ은 틀림)."},"23-3-23":{"x":"급여의 적절성은 시대와 환경에 따라 변합니다. 변하지 않는다는 설명이 틀렸습니다."},"23-3-24":{"x":"사회복지운동은 민간이 특정 견해를 관철시키려는 실천이고(ㄱ), 다양한 사회운동 주체가 참여하며(ㄴ), 종사자의 전문성을 실현하는 통로입니다(ㄷ).\n\n정부가 사회복지운동단체의 의견을 모두 수용한 것은 아닙니다(ㄹ은 틀림)."},"23-3-25":{"x":"아동수당은 일정 연령 미만의 아동에게 지급되며 만 10세 아동은 시험 당시 지급 대상이 아니었습니다. 아동수당의 지급 연령은 단계적으로 확대되고 있으므로 현행 기준은 확인하세요."},"24-3-1":{"x":"잔여적 개념은 가족과 시장을 통해 욕구를 충족하는 것을 기본으로 하고(ㄱ), 작은 정부와 시장을 중시하는 보수주의와 맥락이 같습니다(ㄷ).\n\n가족과 시장이 실패했을 때 국가가 잠정적으로 개입하는 것은 잔여적 개념입니다(ㄴ은 틀림). 제도적 개념은 권리성이 강합니다(ㄹ은 틀림)."},"24-3-2":{"x":"복지다원주의는 국가뿐 아니라 시장을 포함해 여러 주체가 복지를 공급한다고 봅니다. 시장을 복지 공급자로 수용하지 않는다는 설명이 틀렸습니다."},"24-3-3":{"x":"현물급여는 집합적 선을 추구하고 용도 외 사용을 방지하지만 관리비용이 많이 듭니다(ㄴ). 서비스는 목적 외 용도로 사용할 수 없고(ㄷ), 증서는 일정 범위에서만 교환가치를 가져 개인주의자와 집합주의자 모두 선호합니다(ㄹ).\n\n현금급여는 선택의 자유를 보장하지만 사회적 통제는 약합니다(ㄱ은 틀림). 기회는 재화를 이용할 가능성이며, 의사결정권은 권력입니다(ㅁ은 틀림)."},"24-3-4":{"x":"사회서비스 전자바우처는 수요자에게 이용권을 지급하는 수요자 중심의 지원방식입니다. 공급자 중심의 직접지원이라는 설명이 틀렸습니다."},"24-3-5":{"x":"보편주의는 기여자와 수혜자를 구별하지 않고(ㄴ), 선별주의는 자산조사나 소득조사를 하며(ㄷ), 둘 다 사회적 평등성이나 효과성을 나름 추구합니다(ㄹ).\n\n보편주의는 시민권에 입각하며 비납세자도 대상에서 제외하지 않습니다(ㄱ은 틀림)."},"24-3-6":{"x":"기업복지의 규모가 커질수록 기업 규모와 지위에 따른 노동자 간 불평등이 증가할 수 있습니다.\n\n조세지출은 공공재원이고, 기부금 규모는 국세청 추산보다 클 수 있으며, 이용료는 클라이언트가 직접 지불하는 것이고, 기업복지는 임금이 아닌 부가급여를 뜻합니다."},"24-3-7":{"x":"개인소득세는 누진성이 강하고, 일반소비세는 소득이 낮을수록 부담이 커 역진성이 강합니다.\n\n조세가 소득역진적이라는 설명이 틀리고, 사회보험료는 상한선이 있어 고소득층에 유리하며, 사회보험료는 임금의 성격이 있습니다."},"24-3-8":{"x":"서비스 접근성 자체를 중시해 독자적인 서비스를 제공하려는 전략은 전문화된 접근구조입니다."},"24-3-9":{"x":"권력자원이론(ㄴ), 이익집단이론(ㄷ), 수렴이론(ㅁ)에 대한 설명이 옳습니다.\n\n시민권론은 공민권, 정치권, 사회권 순이고(ㄱ은 순서가 다름), 국가중심이론은 국가의 자율성과 관료의 역할을 강조합니다(ㄹ은 틀림)."},"24-3-10":{"x":"반물량 방식은 식료품비에 엥겔계수의 역수를 곱해 빈곤선을 추정합니다.\n\n상대적 빈곤은 평균 생활수준과 비교한 개념이고, 라이덴 방식은 주관적 평가에 기초하며, 빈곤갭이 총소득 부족분을 나타내고, 지니계수 1은 완전 불평등입니다."},"24-3-11":{"x":"사회적 배제는 소득의 결핍에 국한하지 않고 다차원적으로 접근합니다. 소득 결핍으로 제한한다는 설명이 틀렸습니다."},"24-3-12":{"x":"길버트법(원외구제 허용, ㄱ), 스핀햄랜드법(임금 보조, ㄴ), 베버리지보고서를 근거로 한 가족수당법과 국민부조법 제정(ㅁ)이 옳습니다.\n\n신빈민법은 원내구제를 원칙으로 했지만 열등처우를 적용한 시기에 대한 서술이 틀렸고(ㄷ), 소수파보고서는 구빈법 폐지를 주장했습니다(ㄹ)."},"24-3-13":{"x":"TANF는 AFDC를 대체한 제도입니다. AFDC와 병행한다는 설명이 틀렸습니다."},"24-3-14":{"x":"능력에 따른 분배는 시장의 원리입니다. 역선택, 도덕적 해이, 규모의 경제, 정보의 비대칭은 국가 개입의 근거입니다."},"24-3-15":{"x":"에스핑-안데르센은 탈상품화와 계층화 등을 기준으로 복지국가를 세 유형으로 분류했습니다.\n\n보수주의는 가족주의, 자유주의는 공공부조 비중이 크고 탈상품화는 낮으며, 사회민주주의는 국가 책임이 크고, 보수주의 예는 독일·프랑스·이탈리아입니다."},"24-3-16":{"x":"부과방식 공적연금은 현재 근로세대의 보험료로 현재 노인세대의 연금을 지급하므로 세대 간 재분배입니다."},"24-3-17":{"x":"생계급여 선정기준은 기준 중위소득의 32%, 의료급여는 40% 이하입니다(2024년, 2026년에도 동일)."},"24-3-18":{"x":"사회서비스의 주체는 국가와 지방자치단체뿐 아니라 민간부문도 포함합니다. 민간부문을 제외한다는 설명이 틀렸습니다."},"24-3-19":{"x":"이 문항은 시험에서 오류로 확정되어 전항 정답 처리되었습니다. 앱에서는 가답안인 4번을 정답으로 처리합니다.\n\n직장가입자 보험료는 노사가 1/2씩 부담하고, 사립학교 교직원은 국가가 일부(20%)를 부담합니다. 기초연금은 공적연금 구분에 포함되지 않고, 노인전문요양병원은 시설급여 기관이 아니며, 상병수당은 산재가 아닌 건강보험의 부가급여입니다."},"24-3-20":{"x":"긴급복지지원은 위기상황에 신속히 지원하는 선지원 후심사의 원칙을 적용합니다. 선심사 후지원이라는 설명이 틀렸습니다."},"24-3-21":{"x":"긴급복지지원의 생계지원은 최대 6회, 의료지원은 최대 2회입니다. 합은 8입니다. 지원 횟수는 법령 개정으로 달라질 수 있으니 현행 긴급복지지원법으로 확인하세요."},"24-3-22":{"x":"공공부조는 사회보험에 비해 권리성이 약하고(ㄱ), 비용효과성이 높습니다(ㄴ).\n\n사회수당은 기여를 요건으로 하지 않고(ㄷ은 틀림), 사회보험은 방빈제도이고 공공부조는 구빈제도입니다(ㄹ은 반대)."},"24-3-23":{"x":"사업자도 소득과 재산 요건을 갖추면 근로장려금을 받을 수 있습니다. 받을 수 없다는 설명이 틀렸습니다. 지급 대상 요건은 조세특례제한법 개정에 따라 달라질 수 있으니 현행 기준을 확인하세요."},"24-3-24":{"x":"고용보험의 상병급여는 현금급여입니다. 산재보험의 요양급여, 장기요양보험의 재가급여, 의료급여, 건강검진은 현물급여입니다."},"24-3-25":{"x":"보건복지부장관이 관장하는 사회보험은 국민연금, 국민건강보험, 노인장기요양보험입니다. 산재보험과 고용보험은 고용노동부 관장입니다."},"25-3-1":{"x":"사회복지정책은 개인의 능력에 따른 분배가 아니라 욕구에 따른 분배를 통한 평등과 사회통합을 목적으로 합니다."},"25-3-2":{"x":"우리나라 노동시장은 비정규직, 플랫폼 노동 등으로 노동자 간 이질성이 커졌습니다. 동질성이 더욱 강화되었다는 설명이 틀렸습니다."},"25-3-3":{"x":"무지의 베일은 롤스의 절차적 장치입니다. 샌델은 롤스의 정의론을 비판하며 도덕과 공동선, 시민의 미덕을 강조했습니다. 1번이 틀렸습니다."},"25-3-4":{"x":"빈민법 시기의 사회복지 주체는 국가, 교회, 영주이고, 사회보험에서의 권리 수준은 계약에 입각한 권리이며, 복지국가의 대상자는 시민(개인)이고 권리 수준은 시민권입니다."},"25-3-5":{"x":"2차 대전 이후 서구 복지국가는 케인즈주의 경제정책을 바탕으로 대규모 재분배가 가능해진 시기입니다."},"25-3-6":{"x":"중상주의는 15세기 중반부터 18세기 중반까지의 경제사상이고(ㄱ), 식민지 개척과 무역정책으로 국가 재정을 마련했으며(ㄴ), 빈민의 근면을 위해 임금을 낮게 유지하려 했습니다(ㄹ).\n\n중상주의는 인구 증가를 국력으로 보았으며 억제하지 않았습니다(ㄷ은 틀림)."},"25-3-7":{"x":"건강보험은 건강한 사람으로부터 질병을 겪는 사람에게 자원을 재분배합니다(수평적 재분배).\n\n수직적 재분배가 가장 큰 것은 공공부조이고, 보험료는 소득에 비례하며 동일하지 않고, 자선활동도 파레토 개선이 될 수 있으며, 사회민주주의는 연대의 관점에서 정당화합니다."},"25-3-8":{"x":"사회적 배제는 빈곤에 이르는 과정과 동태적 변화에 주목합니다. 결과적 상태에 초점을 둔다는 설명이 틀렸습니다."},"25-3-9":{"x":"길버트의 권능부여국가는 근로촉진, 선별적 표적화, 민영화, 사회적 의무와 연계된 급여를 특징으로 합니다."},"25-3-10":{"x":"큰 범위의 기본적 결정은 합리적으로, 세부적 결정은 점증적으로 이루어진다고 보는 모형은 혼합모형입니다."},"25-3-11":{"x":"운영효율성이 가장 높은 급여는 관리가 쉬운 현금(ㄱ)이고, 목표효율성이 가장 높은 급여는 용도에 맞게 쓰이도록 하는 현물(ㄷ)입니다."},"25-3-12":{"x":"소득세의 누진성이 높을수록 재분배 효과가 큽니다. 누진성이 낮을수록 재분배 효과가 크다는 설명이 틀렸습니다."},"25-3-13":{"x":"중앙정부는 서비스의 지속성과 안정성을 확보하는 데 유리합니다.\n\n수혜자의 정책결정 참여와 지역주민 욕구에 대한 신속한 대응, 선택권 보장은 지방정부와 민간의 장점입니다."},"25-3-14":{"x":"사회복지전달체계는 제공자와 수급자를 연결하는 장치이고(ㄱ), 공공과 민간으로 나뉘며(ㄴ), 분열성, 불연속성, 무책임성, 비접근성을 배제해야 하고(ㄷ), 비영리 민간기관은 공공과 연계하기도 합니다(ㄹ)."},"25-3-15":{"x":"장기요양 재가급여, 산재 요양급여, 건강검진은 현물급여입니다. 생계급여는 현금급여입니다."},"25-3-16":{"x":"기초연금은 65세 이상 소득하위 70%에게 지급하는 선별적 제도입니다. 아동수당, 의무교육, 무상급식, 건강보험은 보편적 성격을 갖습니다."},"25-3-17":{"x":"사업주가 주관한 행사준비 중 사고(ㄱ), 휴게시간 중 사업주의 지배관리하의 사고(ㄴ), 통상적인 출퇴근 사고(ㄷ), 직장 내 괴롭힘으로 인한 정신적 스트레스 질병(ㄹ)은 모두 업무상 재해로 인정됩니다."},"25-3-18":{"x":"시험 당시 정답은 4번(ㄴ, ㄷ, ㅁ)이었습니다. 그러나 2025년 국민연금법 개정(2026년 1월 시행)으로 소득대체율은 2028년 40%가 아니라 43%로 조정되어 ㅁ이 틀리게 되었고, 현행 기준으로는 맞는 보기가 없어 앱에서는 채점에서 제외합니다.\n\n균등부분은 연금수급 전 3년간 전체 가입자 평균소득월액의 평균액이고 소득재분배 효과가 있습니다(ㄴ, ㄷ). 보험료 징수는 국민건강보험공단이 하고(ㄱ은 틀림), 소득비례부분은 본인의 가입기간 소득을 반영합니다(ㄹ은 틀림).","cur":0,"note":"시험 당시 정답은 4번(ㄴ, ㄷ, ㅁ)이었으나, 2026년 1월 시행 개정으로 소득대체율이 43%로 조정되었습니다."},"25-3-19":{"x":"우리나라는 7개 질병군에 포괄수가제를 적용하고 있습니다.\n\n질병군별 정액 지불은 포괄수가제이고, 행위별수가제는 행정이 복잡해 비용 증가 가능성이 있으며, 포괄수가제는 질병 단위 정액 보수이고, 병원 운영비 총액 지불은 총액계약제입니다."},"25-3-20":{"x":"노인요양공동생활가정은 5인 이상 9인 이하로 운영됩니다. 15인 이하라는 설명이 틀렸습니다."},"25-3-21":{"x":"사회보험은 보험료로, 공공부조는 조세로 재원을 충당합니다.\n\n사회보험은 사전적·예방적, 공공부조는 사후적 성격이고, 사회보험은 방빈(예방), 공공부조는 구빈이 목적이며, 계약적 권리성은 사회보험이 강하고, 운영주체는 반대입니다."},"25-3-22":{"x":"사회서비스는 주로 바우처 방식으로 수요자를 지원합니다.\n\n빈곤층만이 아닌 넓은 계층이 대상이고, 국비·지방비·이용자 부담이 섞이며, 여러 기관이 공급하고, 개별 욕구에 맞춘 서비스를 지향합니다."},"25-3-23":{"x":"우리나라의 최저임금제는 1988년에 시행되었습니다. 2000년이라는 설명이 틀렸습니다."},"25-3-24":{"x":"도덕적 해이는 보험 가입 집단의 규모가 클수록 강화되는 경향이 있습니다(감시가 어려워짐). 약화된다는 설명이 틀렸습니다."},"25-3-25":{"x":"사회보험의 급여는 법으로 정해진 권리여서 민간보험보다 법적 권리성이 강합니다.\n\n사회보험은 보험료가 주된 재원이고, 사회적 적절성은 사회보험에서 중요하며, 사회보험은 특정 사회적 위험을 대상으로 하고, 민간보험은 물가 변동을 보장하지 않습니다."},"26-3-1":{"x":"제도적 개념은 사회복지를 정상적인 사회제도로 보고 국가의 적극적 역할을 강조합니다.\n\n잔여적 개념은 사회문제의 원인을 개인 탓으로 보며 낙인이 크고, 제도적 개념은 예방과 재활이 제도화되어 있으며 시혜나 자선으로 보지 않습니다."},"26-3-2":{"x":"사회보장제도의 민영화로 인한 불평등 증가는 신자유주의 정책의 결과이지 등장 배경이 아닙니다. 1번이 틀렸습니다."},"26-3-3":{"x":"미국 사회보장법(1935)은 대공황 극복을 위해 도입되었고(ㄱ), 비스마르크 사회보험은 사회통합을 위한 것입니다(ㄷ).\n\n세계 최초의 실업보험은 영국의 국민보험법(1911)이고(ㄴ은 틀림), 영국 국민보험법은 베버리지보다 앞선 법입니다(ㄹ은 틀림)."},"26-3-4":{"x":"정치적 요인을 강조한 이론은 권력자원이론, 사회통제이론(음모이론), 이익집단이론입니다. 수렴이론은 산업화, 사회양심이론은 이타주의를 강조합니다."},"26-3-5":{"x":"빈민구제에 대한 국가의 책임을 최초로 제도화한 것은 엘리자베스 구빈법(1601)입니다. 신구빈법(1834)이 아닙니다."},"26-3-6":{"x":"제3의 길은 소극적 자유보다 기회의 평등, 권리와 책임의 호혜성, 복지혼합, 근로연계복지를 강조합니다. 소극적 자유를 강조한다는 설명이 틀렸습니다."},"26-3-7":{"x":"공리주의는 저소득층의 한계효용이 크므로 재분배가 총효용을 늘린다고 보고(ㄴ), 롤스는 최소수혜자에게 유익하면 차등을 정당하다고 보며(ㄷ), 마르크스는 생산수단의 사회화 이후 공정한 분배가 가능하다고 봅니다(ㄹ).\n\n자유지상주의는 조세를 통한 재분배를 정당하지 않다고 봅니다(ㄱ은 틀림)."},"26-3-8":{"x":"사회민주주의 복지국가는 탈가족화 수준이 높고 계층화 수준은 낮습니다.\n\n자유주의는 탈상품화 수준이 낮고, 보수주의는 계층화가 높으며 탈가족화 수준이 낮고, 자유주의의 탈가족화 수준은 시장을 통해 높은 편입니다."},"26-3-9":{"x":"사회보험은 소극적 자유(개인의 선택)를 일부 제한해 위험에 처한 사람들의 적극적 자유를 신장시킵니다.\n\n아픈 사람에게 의료자원을 더 분배하는 것은 필요에 따른 비례적 평등이고, 아동수당은 수량적 평등이며, 퇴직연금은 개인 적립이고, 디딤씨앗통장은 적극적 자유와 관련됩니다."},"26-3-10":{"x":"영향 평가는 정책이 가져온 변화나 파급효과를 보는 평가입니다. 대상자의 만족도를 묻는 것은 만족도 평가입니다. 4번이 틀렸습니다."},"26-3-11":{"x":"점증모형은 기존 정책이나 전년도 예산에 기초해 대안을 부분적으로 수정해 결정하는 모형입니다.\n\n1번은 쓰레기통모형, 2번은 합리모형, 4번은 제도모형, 5번은 효과-비용 분석에 가깝습니다."},"26-3-12":{"x":"고용보험의 구직급여는 현금급여입니다. 현물이라는 설명이 틀렸습니다."},"26-3-13":{"x":"근로장려금 제도는 조세지출(조세비용)에 해당합니다(ㄷ).\n\n소득세와 소비세는 공공재원이며(ㄱ은 틀림), 사회보험료의 보험료율은 대개 소득에 정률로 적용합니다(ㄴ은 틀림). 기부는 지속성을 보장하기 어렵습니다(ㄹ은 틀림)."},"26-3-14":{"x":"국민연금은 국민연금공단이 운영하는 공공 전달체계입니다. 지방정부와 민간의 혼합체계가 아닙니다. 1번이 틀렸습니다."},"26-3-15":{"x":"근로연계복지(ㄱ), 자활급여의 자산조사(ㄴ), 독립유공자에 대한 사회적 기여 보상(ㄷ), 부모급여의 인구학적 조건(ㄹ)은 모두 대상을 규정하는 기준입니다."},"26-3-16":{"x":"아동수당, 의무교육, 무상급식은 보편주의 성격입니다. 의료급여는 선별주의입니다."},"26-3-17":{"x":"노인장기요양보험은 사회보험입니다. 긴급복지지원, 기초연금, 장애인연금, 노인맞춤돌봄서비스는 공공부조·사회서비스입니다."},"26-3-18":{"x":"국민기초생활보장제도는 조세를 재원으로 합니다.\n\n중앙정부와 지방정부가 분담해 운영하고, 선정기준은 기준 중위소득을 활용한 상대적 빈곤이며, 빈곤 구제가 목적이고, 소득 상위 30% 제외는 기초연금의 선정 방식입니다."},"26-3-19":{"x":"2025년에 만 60세로 퇴직한 사람은 1965년생이어서 노령연금 수급개시연령이 만 63세입니다. 만 65세라서 5년의 소득공백이 생긴다는 설명이 틀렸습니다."},"26-3-20":{"x":"육아휴직급여는 고용보험에서 지급하며 폐지되지 않았습니다. 3번이 틀렸습니다."},"26-3-21":{"x":"아동수당은 귀속적 욕구, 건강보험은 보상(기여), 장애인활동지원은 진단적 구분, 기초생활보장은 자산조사적 욕구에 연결됩니다."},"26-3-22":{"x":"국민연금의 노령연금은 현금급여만 제공합니다. 나머지는 현물급여가 포함됩니다."},"26-3-23":{"x":"산재보험료는 사업주가 전액 부담합니다. 사업주와 근로자가 1/2씩 분담한다는 설명이 틀렸습니다."},"26-3-24":{"x":"노인빈곤율이 높아 노후소득보장 개선이 필요하고(ㄱ), 아동수당의 대상 연령 확대가 필요합니다(ㄷ).\n\n국민건강보험은 이미 통합방식으로 전환되었고(ㄴ은 틀림), 주거급여의 부양의무자 기준은 이미 폐지되었습니다(ㄹ은 틀림)."},"26-3-25":{"x":"기초연금은 소득인정액에 반영되어 생계급여가 감액될 수 있어 생계급여에 더하여 받아도 탈빈곤효과가 증가한다고 단정할 수 없습니다. 3번이 틀렸습니다."}},"data/e_pr.json":{"17-2-1":{"x":"연구와 조사를 통해 사회제도를 개혁해야 한다는 관점은 인보관운동의 것입니다. 자선조직협회는 빈곤의 원인을 개인의 도덕적 결함으로 보고 개별 접근을 했습니다. 4번이 틀렸습니다."},"17-2-2":{"x":"아동보호치료시설은 아동복지법상 생활(입소)시설입니다. 아동보호전문기관, 영유아보육시설, 지역아동센터, 가정위탁지원센터는 이용시설입니다."},"17-2-3":{"x":"윤리강령은 기관의 부당한 정책이나 요구에 대응하고 '즉시 사회복지윤리위원회에 보고'하도록 합니다. 시·군·구에 보고한다는 내용은 없습니다. 5번이 해당하지 않습니다."},"17-2-4":{"x":"의사 카보트가 매사추세츠병원에 의료사회복지사를 채용한 것은 1905년으로, 1915년 플렉스너의 비판보다 앞선 일입니다. 비판에 대한 반응이 아닙니다."},"17-2-5":{"x":"자립지원시설(아동복지시설)은 보건복지부 소관입니다. 청소년쉼터, 청소년상담복지센터, 다문화가족지원센터, 건강가정지원센터는 여성가족 분야 부처(현 성평등가족부) 소관입니다."},"17-2-6":{"x":"레비의 가치 분류 중 수단 가치는 사람을 대하는 방법에 관한 것으로, 자기결정권 존중이 해당합니다. 소속의 욕구, 건설적 변화에 대한 능력과 열망, 인간의 공통된 욕구, 상호책임성은 사람 가치(우선 가치)로 분류됩니다."},"17-2-7":{"x":"개인을 진단에 따른 증상을 가진 자로 규정하는 것은 병리 관점입니다. 강점관점은 클라이언트의 가능성과 자원에 초점을 둡니다."},"17-2-8":{"x":"법정 국가자격은 사회복지사와 정신건강(구 정신보건)사회복지사입니다. 의료사회복지사와 학교사회복지사는 민간자격입니다."},"17-2-9":{"x":"통합적 접근은 경험적으로 검증된 이론과 기법을 사용합니다. 이론에 기초한 개입보다 직관과 창의를 중시한다는 설명은 틀렸습니다."},"17-2-10":{"x":"개별화는 클라이언트를 독특한 개인으로 이해하고 개별적으로 접근하는 원칙입니다. 사고방식과 생활유형을 개별적으로 '조정'하는 것은 개별화가 아닙니다. 3번이 틀렸습니다."},"17-2-11":{"x":"위탁가정 아동 방문(ㄱ)과 정신장애인 재활 상담(ㄷ)은 개인과 가족을 대상으로 하는 미시적 실천입니다.\n\n모금 활동(ㄴ)과 자원 개발(ㄹ)은 지역사회·정책 수준의 거시적 실천에 가깝습니다."},"17-2-12":{"x":"사회복지사와 클라이언트의 대화를 상세히 기록하고 사회복지사의 생각과 느낌까지 담은 기록은 과정기록입니다."},"17-2-13":{"x":"클라이언트를 감동시키려고 노력하는 것은 전문적 관계의 목적에서 벗어난 행동으로 원조관계를 방해합니다."},"17-2-14":{"x":"4체계 모델에서 6체계 모델로 발전하는 것은 핀커스와 미나한의 모델이 콤튼과 갤러웨이의 모델로 확장된 것이고, 문제해결모델과는 무관한 설명입니다. 5번이 틀렸습니다."},"17-2-15":{"x":"문화적 민감성은 다문화 생활경험과 가치에 맞는 개입전략을 개발하는 것입니다.\n\n문화에 우열을 두거나, 자기 문화를 중심에 두거나, 권력 위계를 무시하거나, 자기 문화로 클라이언트의 상황을 규정하는 것은 부적절합니다."},"17-2-16":{"x":"클라이언트의 대응을 묻는 질문(ㄱ)과 정도를 묻는 질문(ㄷ)은 적절합니다.\n\n'왜'로 시작하는 질문(ㄴ)은 비난으로 들려 방어를 부르고, 두 가지를 한꺼번에 묻는 질문과 암시가 담긴 질문(ㄹ)은 피해야 합니다."},"17-2-17":{"x":"클라이언트와의 협력(ㄱ), 생태체계적 관점(ㄴ), 사회변화를 위한 행동 참여(ㄷ), 억압받는 집단의 역사적 관점 이해(ㄹ)는 모두 역량강화 실천 활동입니다."},"17-2-18":{"x":"사례관리는 탈시설화 이후 지역사회 서비스의 단편성과 중복을 해결하기 위해 시작되었습니다. 공공부문의 역할 확대를 위한 것이 아닙니다."},"17-2-19":{"x":"직면은 클라이언트의 말과 행동 사이의 모순이나 불일치를 보게 하는 기법입니다. 클라이언트의 결정이 합리적인데도 확신하지 못하는 경우에는 지지가 필요하고, 직면은 맞지 않습니다."},"17-2-20":{"x":"사례관리 과정은 아웃리치 → 사정 → 계획 → 점검 → 재사정 순입니다."},"17-2-21":{"x":"모델링은 시범을 보이고 모방하게 하는 행동 학습 기법입니다. 재명명, 일반화, 재보증, 직면은 관점이나 인식을 바꾸는 인지적 재구성 기법입니다."},"17-2-22":{"x":"표적문제를 선정할 때는 사회복지사 자신의 지식과 기술을 고려해야 합니다.\n\n표적문제는 소수로 선정하고, 우선순위는 클라이언트와 함께 정하며, 한쪽만 인식하는 문제를 모두 선정하는 것은 아니고, 클라이언트가 이해할 수 있는 용어로 기술해야 합니다."},"17-2-23":{"x":"언어적 표현과 비언어적 행동이 일치하지 않을 때는 비언어적 행동에 담긴 감정과 의미에 더 주의를 기울여야 합니다. 4번이 틀렸습니다."},"17-2-24":{"x":"다른 기관에 의뢰(ㄱ), 불리한 정책에 대한 옹호(ㄴ), 복합 욕구를 위한 서비스 조정·연계(ㄷ)는 사례관리자의 역할입니다.\n\n클라이언트를 대신해 행동하는 대변·옹호도 필요한 때가 있으므로, 어떠한 경우에도 대신해선 안 된다는 ㄹ은 틀렸습니다."},"17-2-25":{"x":"양가감정은 변화를 원하는 마음과 원하지 않는 마음이 공존하는 것이고(ㄱ), 자연스러운 현상입니다(ㄴ).\n\n양가감정을 수용하면 저항감이 줄어들고(ㄷ은 틀림), 초기 접촉단계부터 다루어야 합니다(ㄹ은 틀림)."},"18-2-1":{"x":"기능주의(랭크 등)는 인간의 성장가능성과 자유의지를 강조합니다.\n\n리치몬드는 진단주의의 대표이고, 과거의 영향을 중시하는 것은 진단주의이며, 시간제한적·과제중심적 단기개입과 기관의 기능 활용은 기능주의의 특성입니다."},"18-2-2":{"x":"슈퍼바이저는 사회복지사의 개인적 문제를 직접 치료하는 것이 아니라 적절한 지원과 조치를 하도록 하는 역할입니다. 직접 치료한다는 설명이 틀렸습니다."},"18-2-3":{"x":"민주주의는 서비스 이용자의 권리, 선택권, 참여를 강조해 사회복지실천에 영향을 주었습니다. 최소한의 수혜자격을 강조한 것은 열등처우 원칙과 관련된 제한적 구빈 관점입니다."},"18-2-4":{"x":"중개자(ㄱ), 중재자(ㄴ), 옹호자(ㄷ), 조력자(ㄹ)의 사례가 모두 옳게 연결되었습니다."},"18-2-5":{"x":"사적 질문을 받으면 간단히 답하고 초점을 클라이언트에게 돌리는 것이 좋습니다.\n\n중첩형 질문과 유도질문은 피해야 하고, 침묵은 반드시 저항이 아니며, 받아들이기 어려운 해석을 반복해서는 안 됩니다."},"18-2-6":{"x":"통합적 방법은 인간과 환경을 따로 보는 2궤도가 아니라 둘을 동시에 보는 1궤도(이중초점) 접근입니다. 4번이 틀렸습니다."},"18-2-7":{"x":"초기면접지에는 가족관계, 의뢰 이유, 이전 서비스 경험, 주요 문제가 들어가지만, 개입방법과 비용은 문제 사정과 계획이 이루어진 뒤 정하므로 포함되지 않습니다."},"18-2-8":{"x":"예비부모 대상 가족교육은 클라이언트에게 직접 제공하는 직접적 개입입니다. 나머지는 지역사회와 환경에 대한 간접적 개입입니다."},"18-2-9":{"x":"표적문제 우선순위는 긴급성, 변화·해결 가능성, 클라이언트의 선택 등을 고려해 정합니다. 측정가능성은 목표 설정의 기준입니다."},"18-2-10":{"x":"전문직의 속성(체계적 이론, 전문적 권위, 윤리강령 등)을 제시한 사람은 그린우드입니다. 플렉스너는 사회복지가 전문직이 아니라고 비판했습니다. 4번이 틀렸습니다."},"18-2-11":{"x":"노인의료복지시설과 자립지원시설은 모두 생활(입소)시설입니다.\n\n재가노인복지시설, 지역사회재활시설, 직업재활시설, 자활지원센터, 주간보호시설은 이용시설입니다."},"18-2-12":{"x":"강점관점의 대표 학자는 샐리비와 밀리(ㄴ)이고, 외상·학대·질병을 도전과 기회로 봅니다(ㄷ).\n\n클라이언트를 희생자로 보거나(ㄱ), 역기능과 증상 감소에 초점을 두는 것(ㄹ)은 병리관점입니다."},"18-2-13":{"x":"자기 인식을 바탕으로 자신의 감정과 반응을 있는 그대로 전달하는 능력은 진실성입니다."},"18-2-14":{"x":"한국사회복지사협회는 윤리위원회를 구성해 윤리실천의 질적 향상을 도모하고(ㄱ), 윤리강령 위배 행위를 접수해 공식 절차로 대처하며(ㄴ), 부당한 정책에는 즉시 윤리위원회에 보고하고(ㄷ), 협회의 윤리적 권고와 결정을 존중합니다(ㄹ)."},"18-2-15":{"x":"가족과 환경의 상호작용을 체계적으로 보여주는 도구는 생태도입니다. 가계도는 3세대 이상의 가족 구성, 관계, 반복되는 유형을 보여주는 도구여서 2번 설명이 맞지 않습니다."},"18-2-16":{"x":"변화전략 설정은 계획(개입)단계의 과업입니다. 평가 및 종결단계에서는 진전수준 검토, 사후관리 계획, 정서적 반응 처리, 성과의 안정화 등을 합니다."},"18-2-17":{"x":"임파워먼트 모델은 클라이언트 중심의 협력적 관계를 강조합니다. 실천가 중심의 개입은 맞지 않습니다."},"18-2-18":{"x":"사정을 위한 면접은 문제 이해, 강점 파악, 장애물 탐색, 욕구 우선순위 설정이 목적입니다. 환경 변화를 촉진하는 것은 개입단계의 기능입니다."},"18-2-19":{"x":"비스텍의 개별화는 클라이언트를 독특한 개인으로 인정하는 원칙으로, 그가 속한 집단의 특성을 탐색하는 과정을 포함합니다.\n\n의도적 감정표현은 클라이언트의 감정 표현을 돕는 원칙이고, 수용은 있는 그대로 받아들이는 것이며, 비심판적 태도는 클라이언트를 평가하지 않는 것이고, 통제된 정서적 관여는 사회복지사가 감정을 인식하고 조절하는 것입니다."},"18-2-20":{"x":"중도 탈락한 클라이언트를 찾아 서비스를 재개하는 활동은 서비스의 지속성에 해당합니다. 체계성은 서비스를 조직적으로 연결하고 조정하는 원칙이어서 4번이 틀렸습니다."},"18-2-21":{"x":"문화상대주의는 문화의 우열을 두지 않고 각 문화를 존중하는 입장입니다. 동화의 중요성을 강조한다는 설명은 틀렸습니다."},"18-2-22":{"x":"생태도는 가족과 환경 체계의 관계와 자원 흐름을 보여줍니다. 가족규칙은 가족 내부의 역동으로, 생태도로는 알 수 없습니다."},"18-2-23":{"x":"핀커스와 미나한의 4체계에서 변화매개체계는 변화를 돕는 사회복지사와 소속 기관이고, 이 사례에서는 중독치료 전문가입니다.\n\n남편은 클라이언트체계, 아내와 이웃주민은 행동체계 또는 표적·행동 관련 체계입니다."},"18-2-24":{"x":"지역사회보장협의체에서 기관실무자 네트워크 회의를 소집하는 것은 중시적(조직·기관 간) 실천입니다.\n\n청소서비스 제공은 미시적, 후원자 행사와 지역조사는 거시적, 욕구사정은 미시적 활동입니다."},"18-2-25":{"x":"사례관리 과정은 사정 - 계획 - 연계 및 조정 - 점검 순입니다."},"19-2-1":{"x":"사회복지실천은 개인이 조직에 순응하도록 돕는 것이 아니라, 개인과 사회의 상호 유익한 관계를 증진하는 것입니다. 5번이 틀렸습니다."},"19-2-2":{"x":"다문화가족지원센터는 이용시설, 사회복지공동모금회는 직접 서비스를 제공하지 않고 자원을 배분하는 간접서비스기관, 한국사회복지사협회는 민간기관의 예입니다."},"19-2-3":{"x":"사회복지 전문직은 전문적 이론체계를 갖고(ㄱ), 개인의 변화와 사회변혁에 관심을 두며(ㄴ), 미시와 거시 개입방법을 모두 이해해야 합니다(ㄷ).\n\n타 분야와 협업하려면 오히려 고유한 정체성이 필요합니다(ㄹ은 틀림)."},"19-2-4":{"x":"이 문항의 공식 정답은 4번입니다. 윤리기준은 변화하고(1), 갈등 대응의 첫 단계는 갈등의 인식이며(2), 결과의 모호성도 딜레마를 일으키고(3), 로웬버그와 돌고프의 모델은 윤리적 결정에 활용됩니다(5).\n\n기관 목표와 클라이언트 이익의 충돌이 딜레마의 원인이 될 수 있다는 4번의 서술이 왜 틀린 것으로 처리되었는지는 논란의 여지가 있어 오류 신고 대상으로 둘 만합니다."},"19-2-5":{"x":"원조 과정에서 사회복지사는 자신의 이익을 위해 행동해서는 안 되고(ㄱ), 로웬버그와 돌고프의 윤리원칙 준거틀은 생명보호를 최우선으로 합니다(ㄴ).\n\n윤리강령은 법적 제재의 근거가 아니며(ㄷ), 국가가 채택하지 않고 한국사회복지사협회가 제정합니다(ㄹ)."},"19-2-6":{"x":"조직이나 집단의 갈등을 해결하는 역할은 중재자입니다. 중개자는 클라이언트와 자원을 연결하는 역할입니다."},"19-2-7":{"x":"다문화주의는 문화의 우열 없이 다양성을 인정하는 문화상대주의입니다.\n\n다문화실천에서 지식, 기술, 태도가 모두 중요하고, 동화를 유도하지 않으며, 차이점을 고려해야 합니다. 윤리강령에는 다문화적 역량 관련 내용이 명시되어 있지 않다고 보아 5번은 틀립니다."},"19-2-8":{"x":"설명하는 접근은 통합적 접근(1970년대 이후)입니다. 그 이전의 일을 순서대로 보면 플렉스너의 전문직 비판(1915) → 리치몬드의 사회진단 출간(1917) → 개별·집단·지역사회 3대 방법론으로의 분화입니다."},"19-2-9":{"x":"체계이론은 문제현상의 분석틀을 제공하지만, 구체적인 개입방법은 제시하지 못한다는 한계가 있습니다. 3번이 틀렸습니다."},"19-2-10":{"x":"강점관점은 실천의 초점을 과거의 문제에서 현재와 미래의 가능성으로 전환합니다.\n\n병리관점은 문제에 초점을 두고 전문가를 삶의 전문가로 보며, 자원을 전문가의 지식과 기술로 봅니다. 강점관점에서는 클라이언트가 삶의 전문가이고 강점은 개인 내적·환경적 요소를 모두 포함합니다."},"19-2-11":{"x":"콤튼과 갤러웨이의 변화매개체계는 사회복지사가 속한 기관 등 변화를 일으키는 체계이며, 목표달성을 위해 사회복지사가 상호작용하는 체계는 행동체계입니다. 3번이 틀렸습니다."},"19-2-12":{"x":"임파워먼트는 개인, 대인관계, 제도적 차원에서 이루어지고(ㄱ), 클라이언트를 협력적 파트너로 보며(ㄴ), 자원 동원과 권리 옹호를 합니다(ㄷ).\n\n이념적 근원은 솔로몬(B. Solomon)의 활동에서 찾습니다(ㄹ은 틀림)."},"19-2-13":{"x":"사회복지사와 클라이언트가 서로 신뢰하고 일관된 태도를 유지하며 책임을 지는 것은
