은?"],"c":["투입: 독거노인 20명, 사회복지사 2명","활동: 자원봉사자 모집, 사회성 향상 프로그램 실시","산출: 교육시간, 출석률","성과: 노인의 자살률 감소, 노인부양의식 향상","영향: 지역의 독거노인 관심도 향상"],"a":4},{"id":"17-3-47","y":2017,"g":3,"n":47,"t":"행정 개념·역사·환경","f":"사례·제시문 판단","s":["다음 내용을 설명하는 사회복지서비스의 경향으로 옳은 것은?","○ 1980년대 미국 레이건 정부의 '작은 정부론' 표방","○ 2007년 우리나라 사회서비스 바우처 제도의 도입","○ 2008년 우리나라 노인장기요양보험제도의 실시"],"c":["민영화","집권화","통합성","협력성","책무성"],"a":1},{"id":"17-3-48","y":2017,"g":3,"n":48,"t":"재정관리·예산·회계·모금","f":"옳지 않은 것","s":["성과주의 예산모형에 관한 설명으로 옳지 않은 것은?"],"c":["사업별 예산통제가 가능하다.","예산 배정에 있어서 직관적 성격이 강하다.","목표수행에 중점을 두는 관리지향 예산제도이다.","예산집행에 있어 신축성을 부여한다.","실적의 평가를 용이하게 한다."],"a":2},{"id":"17-3-49","y":2017,"g":3,"n":49,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["우리나라 사회복지행정의 변화과정과 주요 정책에 관한 설명으로 옳지 않은 것은?","기 위한 민ㆍ관 협력을 기반으로 한다."],"c":["사회복지시설평가제 도입은 자원의 효율적 운영에 대한관심을 확대시키는 계기가 되었다.","주로 지방정부에서 운영되는 사회복지사업이 국고보조사업으로 이양되었다.","‘읍면동 복지허브화’ 전략은 맞춤형 통합서비스를 제공하","희망복지지원단은 공공영역에서의 사례관리 기능을 담당한다.","국민기초생활보장제도는 복지가 국민의 권리로서 인정받기 시작했다는 의미를 갖는다."],"a":2},{"id":"17-3-50","y":2017,"g":3,"n":50,"t":"리더십·동기부여·의사결정","f":"옳은 것 고르기","s":["동기부여 이론과 주요 학자의 연결이 옳은 것은?"],"c":["인간관계이론 - 매슬로우(Maslow)","ERG이론 - 허즈버그(Herzberg)","성취동기이론 – 맥클리랜드(McClelland)","욕구계층이론 – 맥그리거(McGregor)","XㆍY이론 – 알더퍼(Alderfer)"],"a":3},{"id":"18-3-26","y":2018,"g":3,"n":26,"t":"조직이론·조직구조","f":"옳은 것 모두 고르기","s":["베버(M. Weber)의 관료제이론에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 조직 내 비공식 집단의 중요성을 인식한다.","ㄴ. 조직이 수행해야 할 과업이 일상적·일률적인 경우 효율적이다.","ㄷ. 조직외부의 정치적 상황에 주목한다.","ㄹ. 조직운영의 권한양식이 합법성·합리성을 띠고 있다."],"c":["ㄱ,ㄷ","ㄱ,ㄹ","ㄴ,ㄹ","ㄱ,ㄴ,ㄹ","ㄴ,ㄷ,ㄹ"],"a":3},{"id":"18-3-27","y":2018,"g":3,"n":27,"t":"조직이론·조직구조","f":"사례·제시문 판단","s":["다음 설명에 해당하는 사회복지행정 기능은?","- 조직의 공식구조를 통해 업무를 규정한다.","- 조직목표와 과업 변화에 부응하며 조직구조를 확립한다."],"c":["조정(coordinating)","인사(staffing)","지휘(directing)","조직화(organizing)","기획(planning)"],"a":4},{"id":"18-3-28","y":2018,"g":3,"n":28,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["사회복지 조직환경에 관한 설명으로 옳지 않은 것은?"],"c":["조직과 상호작용하는 외부요소를 총칭한다.","경제적 조건은 조직의 재정적 기반 마련과 관련이 있다.","조직 간의 의뢰ㆍ협력체계는 보충적 서비스 제공 역할을한다.","법적 조건은 조직의 활동을 인가하는 기준이 된다.","정치적 조건은 과업환경으로서 규제를 통해 사회적 기반을 형성한다."],"a":5},{"id":"18-3-29","y":2018,"g":3,"n":29,"t":"조직이론·조직구조","f":"사례·제시문 판단","s":["다음 설명에 해당하는 조직이론은?","- 자원을 소유하고 있는 이해관계집단이 조직에 영향력을 발휘한다.","- 조직환경에서 재원을 둘러싼 권력관계를 부각시킨다.","- 외부환경에 의존하는 사회복지조직의 현실을 설명할 수 있다."],"c":["정치경제(Political Economy)이론","신제도(New Institutional)이론","과학적 관리(Scientific Managemet)이론","의사결정(Decision-Making)이론","조직군생태(Organizational Ecology)이론"],"a":1},{"id":"18-3-30","y":2018,"g":3,"n":30,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["사회복지행정의 특성으로 옳지 않은 것은?"],"c":["인적ㆍ물적자원을 활용하여 조직 목적과 목표를 달성한다.","지역사회의 욕구를 충족시키기 위한 활동이다.","사회복지행정가는 대안선택 시 가치중립적이어야 한다.","사회복지조직이 제공하는 서비스는 전문적인 성격을 가지고 있다.","사회복지행정가는 조직운영에서 지역사회 협력의 중요성을 인식해야 한다."],"a":3},{"id":"18-3-31","y":2018,"g":3,"n":31,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["사회복지조직에 관한 설명으로 옳지 않은 것은?"],"c":["에치오니(A. Etzioni)의 권력 형태에 따른 분류 중 사회복지조직은 규범적 조직에 속한다.","블라우(P. Blau)와 스콧(W. Scott)이 제시한 호혜적 조직은 조직 구성원들이 주요 수혜자인 조직을 말한다.","스미스(G. Smith)는 업무통제에 따라 사회적경제조직,사업조직, 공공조직으로 분류하였다.","지벨만(M Gibelman)은 운영주체에 따라 공공조직, 준공공조직, 준민간조직, 민간조직으로 분류하였다.","하센필드(Y. Hasenfeld)는 사회복지조직의 조직기술을인간식별기술, 인간유지기술, 인간변화 기술로 구분하였다."],"a":3},{"id":"18-3-32","y":2018,"g":3,"n":32,"t":"기획·프로그램 기획·평가","f":"옳은 것 고르기","s":["총체적 품질관리(TQM)에 관한 설명으로 옳은 것은?"],"c":["최고책임자의 의사결정권을 강조한다.","조직관리 및 업적평가 방식으로 고안되었다.","맥그리거(D. McGregor)의 X이론을 발전시켰다.","서비스 생산 과정과 절차를 지속적으로 개선한다.","작업시간 단축을 목표로 둔다."],"a":4},{"id":"18-3-33","y":2018,"g":3,"n":33,"t":"행정 개념·역사·환경","f":"사례·제시문 판단","s":["다음에서 설명하는 환경의존 대응전략은?","- 사회적 약자를 대신해 권한을 가진 조직으로부터 양보를 얻는 데 효과적일 수 있다.","- 일시적으로 얻은 이익을 상쇄하는 반작용을 야기할 수 있다.","- 표적조직이 평화적인 요구를 무시할 때 채택할 수 있다."],"c":["방해전략","교환전략","흡수전","경쟁전략","권위주의전략"],"a":1},{"id":"18-3-34","y":2018,"g":3,"n":34,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"옳지 않은 것","s":["퀸(R. Quinn)이 주장하는 혁신적 슈퍼바이저가 가져야 할 능력으로 옳지 않은 것은?"],"c":["유연한 변화를 만들기 위한 의사소통 능력","비판적ㆍ창의적 사고 능력","슈퍼바이저(supervisee)의 개인성과를 점검하는 능력","조직을 둘러싼 변화를 판단할 수 있는 능력","조직구성원과 이해관계자들 간의 갈등을 예방할 수 있는능력"],"a":3},{"id":"18-3-35","y":2018,"g":3,"n":35,"t":"행정 개념·역사·환경","f":"옳은 것 모두 고르기","s":["전달체계의 원칙에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 책임성: 충분한 양과 질 높은 서비스가 제공되어야 한다.","ㄴ. 접근성: 제약 없이 서비스를 쉽게 받을 수 있어야 한다.","ㄷ. 연속성: 필요한 서비스가 일정기간동안 지속적으로 제공되어야 한다.","ㄹ. 전문성: 종합적으로 서비스가 제공되어야 한다."],"c":["ㄱ,ㄴ","ㄴ,ㄷ","ㄱ,ㄴ,ㄷ","ㄱ,ㄷ,ㄹ","ㄴ,ㄷ,ㄹ"],"a":2},{"id":"18-3-36","y":2018,"g":3,"n":36,"t":"기획·프로그램 기획·평가","f":"사례·제시문 판단","s":["다음에서 설명하는 관리기법은?","- 안전 확보는 서비스 질과 연결된다.","- 작업환경의 안전과 사고 예방책이다.","- 이용자 권리옹호가 모든 대책에 포함된다."],"c":["목표관리법(MBO)","무결점운동(Zero Defect)","위험관리(Risk Management)","품질관리(Quality Control)","직무만족관리(Job Satisfaction Management)"],"a":3},{"id":"18-3-37","y":2018,"g":3,"n":37,"t":"재정관리·예산·회계·모금","f":"사례·제시문 판단","s":["사회복지법인 및 사회복지시설 재무ㆍ회계 규칙상 다음에서 설명하는 예산은?","회계연도 개시 전까지 법인 예산이 성립되지 아니한 때는 시장·군수·구청장에게 그 사유를 보고하고 예산 성립 전까지 임·직원의 보수, 법인 및 시설운영에 직접 사용되는 필수경비, 법령상 지급의무가 있는 경비는 전년도 예산에 준하여 집행할 수 있다."],"c":["계획예산","본예산","특별예산","준예산","추가경정예산"],"a":4},{"id":"18-3-38","y":2018,"g":3,"n":38,"t":"리더십·동기부여·의사결정","f":"옳지 않은 것","s":["참여적 리더십에 관한 설명으로 옳지 않은 것은?"],"c":["집단지식과 기술 활용이 용이하다.","상급자의 권한과 책임을 포기하는 것이다.","소요시간과 책임소재 문제 등이 단점이다.","기술수준이 높고, 동기부여 된 직원들이 있을 때 효과적이다.","직원들을 의사결정에 참여시켜 일에 대한 적극적 동기부여가 가능하다."],"a":2},{"id":"18-3-39","y":2018,"g":3,"n":39,"t":"리더십·동기부여·의사결정","f":"옳지 않은 것","s":["목표설정(Goal Setting)이론에 관한 설명으로 옳지 않은 것은?"],"c":["위계적 욕구이론이다.","인지에 초점을 둔 이론이다.","동기 형성을 위한 목표설정이 필요하다고 본다.","목표가 구체적일수록 효과적이라고 본다.","의미 있는 목표는 동기유발을 일으켜 조직성과 달성에기여한다고 본다."],"a":1},{"id":"18-3-40","y":2018,"g":3,"n":40,"t":"리더십·동기부여·의사결정","f":"사례·제시문 판단","s":["다음에서 설명하는 리더십이론은?","- 리더의 지위권력 정도, 직원과의 관계, 과업의 구조화가 중요하다.","- 직원의 성숙도가 중요하다.","- 한 조직에서 성공한 리더가 타 조직에서도 반드시 성공하는 것은 아니다."],"c":["행동이론","상황이론","특성이론","공동체이론","카리스마이론"],"a":2},{"id":"18-3-41","y":2018,"g":3,"n":41,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"옳은 것 모두 고르기","s":["사회복지조직에서의 인적자원관리에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 직원채용을 위해서 직업능력검사를 시행하였다.","ㄴ. 조직의 역사, 사명, 기본정책 등에 관하여 직원 오리엔테이션을 가졌다.","ㄷ. 업무 담당자를 위해 직무기술서를 작성하였다.","ㄹ. 업무성과 평가를 위해 직원의 행동평가를 실시하였다."],"c":["ㄱ,ㄷ","ㄴ,ㄹ","ㄱ,ㄴ,ㄷ","ㄱ,ㄷ,ㄹ","ㄱ,ㄴ,ㄷ,ㄹ"],"a":5},{"id":"18-3-42","y":2018,"g":3,"n":42,"t":"조직운영·법인·이사회","f":"옳은 것 고르기","s":["사회복지사업법상 사회복지 시설평가에 관한 설명으로 옳은 것은?"],"c":["보건복지부장관이 시설의 서비스 최저기준을 고려하여평가기준을 정한다.","1997년에 처음으로 시행되었다.","보건복지부장관과 시ㆍ군ㆍ구의 장이 시설평가의 주체이다.","4년마다 한번 씩 평가를 실시한다.","시설평가 결과를 공표할 수 없으나 시설의 지원에는 반영할 수 있다."],"a":1},{"id":"18-3-43","y":2018,"g":3,"n":43,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["우리나라 사회복지전달체계에 관한 설명으로 옳지 않은 것은?"],"c":["최근 민관 통합사례관리의 중요성이 높아지고 있다.","희망복지지원단을 시ㆍ군ㆍ구에 설치하였다.","2016년에 맞춤형 통합서비스를 목적으로 읍면동 복지허브화사업을 시작했다.","국민기초생활 보장법상 생계급여의 집행체계는 읍ㆍ면ㆍ동이다.","희망복지지원단 설치 후 사회복지통합관리망(행복e음)을구축하였다."],"a":5},{"id":"18-3-44","y":2018,"g":3,"n":44,"t":"기획·프로그램 기획·평가","f":"사례·제시문 판단","s":["다음에서 설명하는 기획기법은?","- 막대그래프를 이용하여 막대그래프 차트로도 불린다.","- 작업 간의 연결성에 대한 파악이 어렵다."],"c":["프로그램 평가검토 기법(PERT)","시간별 활동계획 도표(Gantt Chart)","월별 활동계획 카드(Shed - Graph)","방침관리기획(P-D-C-A)","주요경로방법(Critical Path Method)"],"a":2},{"id":"18-3-45","y":2018,"g":3,"n":45,"t":"마케팅·홍보·정보관리","f":"옳은 것 고르기","s":["사회복지조직을 포함한 비영리조직 마케팅에 관한 설명으로 옳은 것은?"],"c":["생산 후 소비의 발생이 이루어진다.","틈새시장 마케팅이 시장세분화 정도가 가장 높다.","사회복지서비스의 표준성은 영리조직 마케팅과의 차이점중 하나이다.","마케팅믹스의 4P는 유통(place), 촉진(promotion), 가격(price), 문제(problem)를 의미한다.","공익연계마케팅을 통해 참여 기업과 사회복지조직 모두혜택을 얻을 수 있다."],"a":5},{"id":"18-3-46","y":2018,"g":3,"n":46,"t":"기획·프로그램 기획·평가","f":"옳은 것 모두 고르기","s":["스키드모어(R. Skidmore)의 7단계 기획과정에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 구체적 프로그램수립단계는 도표 작성 등의 업무를 포함한다.","ㄴ. 결과예측단계는 발생 가능한 일을 다각도에서 예측해 보는 것이다.","ㄷ. 자원고려단계는 기획과정 중 첫 번째 과정으로 기관의 자원을 고려하는 것이다.","ㄹ. 개방성유지단계에서 보다 나은 절차가 없는 경우 기존 계획이 유지된다."],"c":["ㄱ,ㄹ","ㄴ,ㄷ","ㄷ,ㄹ","ㄱ,ㄴ,ㄹ","ㄱ,ㄴ,ㄷ,ㄹ"],"a":4},{"id":"18-3-47","y":2018,"g":3,"n":47,"t":"기획·프로그램 기획·평가","f":"사례·제시문 판단","s":["다음에서 설명하는 프로그램평가 요소는?","- 프로그램 활동 후 얻은 양적인 최종 실적을 의미한다.","- 서비스 제공시간과 프로그램 참가자 수 등으로 나타난다."],"c":["산출(output)","투입(input)","성과(outcome)","전환(throughput)","피드백(feedback)"],"a":1},{"id":"18-3-48","y":2018,"g":3,"n":48,"t":"기획·프로그램 기획·평가","f":"옳지 않은 것","s":["사회복지 평가기준과 그 설명으로 옳지 않은 것은?"],"c":["효과성은 목표달성 정도를 의미한다.","영향성은 사회집단 간 얼마나 공평하게 배분되었는가를의미한다.","노력성은 프로그램을 위해 동원된 자원 정도를 의미한다.","서비스 질은 이용자의 욕구 충족 수준과 전문가의 서비스 제공여부 등을 의미한다.","효율성은 투입 대비 산출을 의미한다."],"a":2},{"id":"18-3-49","y":2018,"g":3,"n":49,"t":"행정 개념·역사·환경","f":"옳은 것 모두 고르기","s":["사회복지재원에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 외부재원의 영향을 많이 받는다.","ㄴ. 사회서비스이용권(바우처)과 같은 민간재원이 감소하고 있다.","ㄷ. 재원확보를 위해서 지역사회의 타 기관과 연계노력을 해야 한다."],"c":["ㄱ","ㄷ","ㄱ,ㄴ","ㄱ,ㄷ","ㄴ,ㄷ"],"a":4},{"id":"18-3-50","y":2018,"g":3,"n":50,"t":"기획·프로그램 기획·평가","f":"옳지 않은 것","s":["기획에 관한 설명으로 옳지 않은 것은?"],"c":["연속적이며 동태적인 과업이다.","효율성 및 효과성 모두 관련이 있다.","타당한 사업 추진을 하기 위함이다.","미래의 환경 변화에 대응하기 위한 의사결정과정이다.","목표지향적이나 과정지향적이지는 않다."],"a":5},{"id":"19-3-26","y":2019,"g":3,"n":26,"t":"행정 개념·역사·환경","f":"옳은 것 고르기","s":["사회복지조직의 특성으로 옳은 것은?"],"c":["클라이언트와 직접 접촉을 피한다.","정부 이외의 지원을 받지 않는다.","조직성과의 객관적 증명이 쉽지 않다.","법률과 규칙에 의해 운영되므로 전문성은 중요하지 않다.","기업조직과 비교할 때 대표적 차별성은 효율성을 중요하게 여긴다는 점이다."],"a":3},{"id":"19-3-27","y":2019,"g":3,"n":27,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["최근 한국 사회복지행정의 추세에 관한 설명으로 옳지 않은 것은?"],"c":["민간부문과 공공부문의 협력이 강조되고 있다.","이용시설보다는 생활시설 중심의 보호가 강조된다.","공공성 강화방향으로 전달체계 개편이 이루어지고 있다.","영리기관의 전달체계 참여가 증가하고 있다.","지역사회를 중심으로 서비스를 통합하려고 한다."],"a":2},{"id":"19-3-28","y":2019,"g":3,"n":28,"t":"조직이론·조직구조","f":"옳은 것 모두 고르기","s":["관료제의 주요 특성으로 옳은 것을 모두 고른 것은?","ㄱ. 조직 내 권위는 수평적으로 구조화된다.","ㄴ. 조직 운영에서 구성원 개인의 사적 감정은 배제된다.","ㄷ. 직무 배분과 인력 배치는 공식적 규칙과 규정에 의해서 이루어진다.","ㄹ. 업무와 활동을 분업화함으로써 전문화를 추구한다."],"c":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"19-3-29","y":2019,"g":3,"n":29,"t":"조직이론·조직구조","f":"사례·제시문 판단","s":["다음에서 설명하는 이론은?","조직구성원은 비공식 집단의 성원으로 행동하며, 이러한 비공식 집단이 개인의 생산성에 영향을 준다."],"c":["인간관계이론","생산집단이론","과학적 관리론","상황생태이론","개방구조이론"],"a":1},{"id":"19-3-30","y":2019,"g":3,"n":30,"t":"조직운영·법인·이사회","f":"옳지 않은 것","s":["한국의 민간 사회복지조직에 관한 설명으로 옳지 않은 것은?"],"c":["사회적 기업은 사회서비스 공급에 참여할 수 없다.","사회서비스 공급에 영리 기관도 참여하고 있다.","사회복지법인 이외에도 사회복지시설을 운영할 수 있다.","지방자치단체와의 위ㆍ수탁 계약을 통해 서비스를 제공하는 경우가 있다.","정부보조금, 후원금, 이용료 등 재원이 다양하다."],"a":1},{"id":"19-3-31","y":2019,"g":3,"n":31,"t":"조직이론·조직구조","f":"옳은 것 고르기","s":["행렬조직(matrix organization)에 관한 설명으로 옳은 것은?"],"c":["직무 배치가 위계와 부서별 구분에 따라 이루어지는 전형적 조직이다.","조직운영을 지원하는 비공식 조직을 의미한다.","합리성을 강조하기 때문에 조직 유연성을 저하시킬 수있다.","직무별 분업을 인정하면서 동시에 사업별 협력을 강조한다.","현실에서 작동하지 않는 가상의 사업조직을 일컫는다."],"a":4},{"id":"19-3-32","y":2019,"g":3,"n":32,"t":"조직이론·조직구조","f":"옳지 않은 것","s":["조직의 구성요소에 관한 설명으로 옳지 않은 것은?"],"c":["예산, 구성원 수 등으로 조직의 규모를 나타낼 수 있다.","직무표준화 정도가 지나치게 높으면 구성원의 재량권은낮아진다.","사업의 종류가 많을수록 조직의 복잡성이 증가한다.","집권화는 구성원의 자발적 참여와 재량권을 확대시킨다.","분권화는 책임과 권한을 조직 내에 분산하는 전략이다."],"a":4},{"id":"19-3-33","y":2019,"g":3,"n":33,"t":"행정 개념·역사·환경","f":"옳은 것 모두 고르기","s":["사회복지조직의 환경에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 인구사회학적 조건은 사회문제와 욕구를 가늠할 수 있게 한다.","ㄴ. 빈곤이나 실업에 대한 사람들의 태도는 정책 수립과 실행에 영향을 미친다.","ㄷ. 과학기술 발전정도는 사회복지조직 운영에 영향을 미친다.","ㄹ. 조직에 미치는 영향에 따라 일반환경과 과업환경으로 구분할 수 있다."],"c":["ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"19-3-34","y":2019,"g":3,"n":34,"t":"재정관리·예산·회계·모금","f":"옳은 것 모두 고르기","s":["사회복지법인 및 사회복지시설 재무ㆍ회계규칙상 준예산 체제 하에서 집행할 수 있는 항목을 모두 고른 것은?","ㄱ. 직원 급여","ㄴ. 전기요금","ㄷ. 한국사회복지관협회 회비","ㄹ. 국민연금 보험료 사용자 부담분"],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"19-3-35","y":2019,"g":3,"n":35,"t":"리더십·동기부여·의사결정","f":"옳은 것 고르기","s":["리더십이론에 관한 설명으로 옳은 것은?"],"c":["블레이크와 머튼(R. Blake &J. Mouton)의 관리격자이론에 의하면 과업형(1.9)이 가장 이상적인 리더이다.","피들러(F. E. Fiedler)의 상황이론에 의하면 상황의 호의성이 모두 불리하면 리더가 인간중심의 행동을 해야 효과적이다.","허시와 블랜차드(P. Hersey &K. H. Blanchard)의 상황이론에 의하면 구성원의 성숙도가 낮을 경우 위임형 리더십이 적합하다.","퀸(R. Quinn)의 경쟁적 가치 리더십에 의하면 동기부여형 리더십은 목표달성가 리더십과 상반된 가치를 추구한다.","배스(B. M. Bass)의 변혁적 리더십에 의하면 변혁적 리더는 구성원의 욕구와 보상에 주된 관심을 갖는다."],"a":4},{"id":"19-3-36","y":2019,"g":3,"n":36,"t":"리더십·동기부여·의사결정","f":"빈칸 채우기","s":["다음 ( )에 들어갈 내용으로 옳은 것은?","맥클랜드(D. McClelland)의 성취동기이론을 자원봉사자관리에 적용할 경우 자원봉사자의 욕구 유형에 따라 배정할 업무가 다를 것이다. 가령 ( ㄱ )욕구가 강한 자원봉사자에게는 말벗되기 등 대면서비스를 담당하도록 배정하고, ( ㄴ )욕구가 강한 자원봉사자에게는 팀장 등 관리 업무를 맡기고, ( ㄷ )욕구가 강한 자원봉사자에게는 후원자 개발 등 다소 어려운 업무를 배정한다."],"c":["ㄱ: 인간관계, ㄴ: 성취, ㄷ: 권력","ㄱ: 친교, ㄴ: 권력, ㄷ: 성취","ㄱ: 관계, ㄴ: 성장, ㄷ: 자아실현","ㄱ: 사회적, ㄴ: 권력, ㄷ: 성장","ㄱ: 친교, ㄴ: 존경, ㄷ: 권력"],"a":2},{"id":"19-3-37","y":2019,"g":3,"n":37,"t":"리더십·동기부여·의사결정","f":"옳지 않은 것","s":["동기부여이론에 관한 설명으로 옳지 않은 것은?"],"c":["매슬로우(A. Maslow)의 욕구단계이론에서 최상위 단계는자아실현욕구이다.","알더퍼(C. Alderfer)의 ERG이론은 인간의 욕구를 세 가지 범주로 나누었다.","허즈버그(F. Herzberg)의 동기-위생이론에 의하면 감독,안전은 위생요인에 해당한다.","맥클랜드(D. McClelland)의 성취동기이론에 의하면 성장욕구는 관계욕구보다 상위 단계이다.","아담스(J. S. Adams)는 공평성이론에서 조직이 공평성을실천함으로써 구성원을 동기부여 할 수 있다고 하였다."],"a":4},{"id":"19-3-38","y":2019,"g":3,"n":38,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"옳은 것 고르기","s":["사회복지조직의 인적자원관리에 관한 설명으로 옳은 것은?"],"c":["직무만족은 조직몰입에 부정적인 영향을 미친다.","신규채용은 비공개모집을 원칙으로 한다.","브레인스토밍은 제시된 아이디어의 양보다는 질을 더욱중시한다.","갈등은 조직 내에 비능률을 가져오는 역기능만을 갖는다.","소진은 일반적으로 열성-침체-좌절-무관심의 단계로 진행된다."],"a":5},{"id":"19-3-39","y":2019,"g":3,"n":39,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"사례·제시문 판단","s":["다음에서 공통적으로 설명하는 인적자원관리 방식은?","- 인적자원관리의 기초가 된다.","- 직무에 대한 업무내용과 책임을 종합적으로 분류한다.","- 직무명세서 작성의 전 단계이다."],"c":["직무평가","직무분석","직무순환","직무수행평가","직무충실"],"a":2},{"id":"19-3-40","y":2019,"g":3,"n":40,"t":"재정관리·예산·회계·모금","f":"옳은 것 고르기","s":["사회복지조직의 예산 수립 원칙으로 옳은 것은?"],"c":["회계연도 개시와 동시에 결정되어야 한다.","수지 균형을 맞춰 흑자 예산이 되어야 한다.","회계연도가 중첩되도록 다년도로 수립하여야 한다.","예산이 집행된 후 즉시 심의ㆍ의결을 거쳐야 한다.","세입과 세출은 모두 예산에 계상하여야 한다."],"a":5},{"id":"19-3-41","y":2019,"g":3,"n":41,"t":"기획·프로그램 기획·평가","f":"옳지 않은 것","s":["패러슈라만 등(A. Parasuraman, V. A. Zeithaml &L. L. Berry)이 주장한 서비스 질측정도구인 SERVQUAL 구성 차원이 아닌 것은?"],"c":["중립성","신뢰성","확신성","유형성","공감성"],"a":1},{"id":"19-3-42","y":2019,"g":3,"n":42,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["독거노인을 위한 복지서비스 전달체계 구축 원칙과 내용이 옳지 않은 것은?"],"c":["충분성: 치매예방서비스 양을 증가시킴","연속성: 치매예방 및 관리서비스를 중단 없이 이용하게함","접근성: 치매예방서비스 비용을 낮춤","책임성: 치매예방서비스 불만사항 파악절차를 마련함","통합성: 치매예방서비스를 적극적으로 홍보함"],"a":5},{"id":"19-3-43","y":2019,"g":3,"n":43,"t":"기획·프로그램 기획·평가","f":"사례·제시문 판단","s":["다음에서 나타나지 않는 현상은?","A지역자활센터는 대상자의 취업 성공률을 높이기 위해 전담직원을 신규 채용해서 맞춤형 프로그램 기획을 담당하도록 하였다. 또한 대상자를 개별적으로 사정, 상담하며 취업 방해요인을 분석하였다. 몇몇 대상자들은 A센터의 취업성공률을 낮출 것이라고 보고 타기관으로 보낼 방안을 검토하고 이를 요청하였다."],"c":["서비스 과활용","크리밍","의뢰","사례관리","스태핑(staffing)"],"a":1},{"id":"19-3-44","y":2019,"g":3,"n":44,"t":"기획·프로그램 기획·평가","f":"옳은 것 고르기","s":["사회복지 기획과 관리기법에 관한 설명으로 옳은 것은?"],"c":["PERT는 최초로 시도되는 프로그램 관리에는 유용하지않다.","간트차트는 임계통로에 대한 정확한 정보파악에 유용하다.","책임행렬표는 목표, 활동, 책임유형을 구성원별로 제시한다.","사례모델링이란 클라이언트의 서비스 이용경로를 제시하는 것이다.","마일스톤은 월별 활동내용을 파악하는 주된 기법이다."],"a":3},{"id":"19-3-45","y":2019,"g":3,"n":45,"t":"기획·프로그램 기획·평가","f":"옳은 것 모두 고르기","s":["논리모델을 적용하여 치매부모부양 가족원 스트레스 완화 프로그램을 설계했을 때, 옳은 것을 모두 고른 것은?","ㄱ. 투입: 스트레스 완화 프로그램 실행 비용 1,500만원","ㄴ. 활동: 프로그램 참여자의 스트레스 완화","ㄷ. 산출: 상담전문가 10인","ㄹ. 성과: 치매부모부양 가족원 삶의 질 향상"],"c":["ㄱ","ㄱ, ㄹ","ㄴ, ㄷ","ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":2},{"id":"19-3-46","y":2019,"g":3,"n":46,"t":"마케팅·홍보·정보관리","f":"옳은 것 고르기","s":["일반적인 마케팅 믹스(4P) 전략에 포함되지 않는 것은?"],"c":["가격(Price)","촉진(Promotion)","성과(Performance)","유통(Place)","상품(Product)"],"a":3},{"id":"19-3-47","y":2019,"g":3,"n":47,"t":"기획·프로그램 기획·평가","f":"사례·제시문 판단","s":["다음에서 공통적으로 설명하는 것은?","- 사회복지서비스 평가로 인해 발생 가능한 부정적 현상이다.","- 양적 평가지표가 많을 때 증가되기 쉽다.","- 평가지표 충족에만 관심이 집중되어 서비스 효과성이 낮아질 수 있다."],"c":["레드테이프","모듈화","옴부즈맨","기준행동","분절성"],"a":4},{"id":"19-3-48","y":2019,"g":3,"n":48,"t":"기획·프로그램 기획·평가","f":"옳은 것 고르기","s":["사회복지 평가기준과 내용이 바르게 연결된 것은?"],"c":["노력: 클라이언트의 변화정도로 측정됨","효율성: 목표 달성 정도로 측정됨","효과성: 대안비용과의 비교로 측정됨","영향: 서비스가 인구집단에 형평성 있게 배분된 정도로측정됨","과정: 절차나 규정준수 여부 등으로 측정됨"],"a":5},{"id":"19-3-49","y":2019,"g":3,"n":49,"t":"기획·프로그램 기획·평가","f":"옳은 것 고르기","s":["사회복지평가의 유형에 관한 설명으로 옳은 것은?"],"c":["총괄평가는 주로 프로그램 개발을 목적으로 한다.","형성평가의 대표적인 예는 효과성 평가이다.","총괄평가는 모니터링 평가라고도 한다.","형성평가는 목표달성도에 주된 관심을 갖는다.","총괄평가는 성과와 비용에 관심이 크다."],"a":5},{"id":"19-3-50","y":2019,"g":3,"n":50,"t":"기획·프로그램 기획·평가","f":"옳은 것 고르기","s":["사회복지프로그램 기획과정에서 대상인구 규정에 관한 설명으로 옳은 것은?"],"c":["위험인구란 프로그램 수급 자격을 갖춘 사람을 말한다.","클라이언트인구란 프로그램에 실제 참여하는 사람을 말한다.","일반인구란 프로그램이 해결하려는 문제에 취약성이 있는 사람을 말한다.","일반적으로 표적인구가 일반인구보다 많다.","자원이 부족하면 클라이언트인구가 표적인구보다 많아진다."],"a":2},{"id":"20-3-26","y":2020,"g":3,"n":26,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["사회복지행정의 개념에 관한 설명으로 옳지 않은 것은?"],"c":["사회복지정책을 개별적이고 구체적인 서비스로 전환시키는 과정이다.","사회서비스 활동으로 민간조직을 제외한 공공조직이 수행한다.","관리자가 조직목표를 달성하기 위해서 수행하는 과정,기능 그리고 활동이다.","사회복지 과업수행을 위해서 인적ㆍ물적 자원을 체계적으로 결합ㆍ운영하는 합리적 행동이다.","사회복지제도와 정책을 서비스 급여, 프로그램으로 전환시키기 위한 전달체계이다."],"a":2},{"id":"20-3-27","y":2020,"g":3,"n":27,"t":"조직이론·조직구조","f":"옳은 것 고르기","s":["조직 내 비공식 조직의 순기능으로 옳은 것은?"],"c":["조직의 응집력을 높인다.","공식 업무의 신뢰성과 일관성을 높인다.","정형화된 구조로 조직의 안정성을 높인다.","파벌이나 정실인사의 부작용이 나타난다.","의사결정이 하층부에 위임되어 직원들의 참여의식을 높인다."],"a":1},{"id":"20-3-28","y":2020,"g":3,"n":28,"t":"조직이론·조직구조","f":"옳지 않은 것","s":["사회복지조직에서 활용되고 있는 관료제의 역기능으로 옳지 않은 것은?"],"c":["조직 운영규정 자체가 목적으로 인식될 수 있다.","조직변화가 어렵다.","부서이기주의가 나타날 수 있다.","서비스가 최저수준에 머무를 수 있다.","조직의 복잡한 규칙을 적용하면서 창조성이 향상된다."],"a":5},{"id":"20-3-29","y":2020,"g":3,"n":29,"t":"조직이론·조직구조","f":"옳은 것 모두 고르기","s":["사회복지조직의 조직문화에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 사회복지서비스 체계의 규범과 가치로서 역할을 한다.","ㄴ. 사회복지서비스 제공자의 상황인식에 중요한 역할을 한다.","ㄷ. 조직구성원의 행태와 인식 그리고 태도를 통해서 조직효과성과 연결하는 역할을 한다."],"c":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":5},{"id":"20-3-30","y":2020,"g":3,"n":30,"t":"조직이론·조직구조","f":"사례·제시문 판단","s":["다음에서 설명하고 있는 이론은?","- 서비스 전달체계에서 업무환경을 강조한다.","- 생존을 위해서 환경으로부터 합법성을 부여받아야 한다.","- 조직의 내·외부 환경의 역학 관계가 서비스 전달체계에 영향을 미친다."],"c":["관료제이론","정치경제이론","인간관계이론","목표관리이론(MBO)","총체적 품질관리(TQM)"],"a":2},{"id":"20-3-31","y":2020,"g":3,"n":31,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["사회복지행정의 특성에 관한 설명으로 옳지 않은 것은?"],"c":["조직들 간의 통합과 연계를 중시한다.","지역사회 욕구를 충족시키기 위한 조직관리 기술을 필요로 한다.","모든 구성원들이 조직운영 과정에 참여하여 일정 부분영향을 미친다.","조직 내부 부서 간의 관료적이고 위계적인 조직관리 기술을 필요로 한다.","사회복지조직의 관리자는 조직의 운영을 지역사회와 연관시킬 책임이 있다."],"a":4},{"id":"20-3-32","y":2020,"g":3,"n":32,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["1950년대 우리나라 사회복지행정 역사에 관한 설명으로 옳지 않은 것은?"],"c":["외국민간원조기관협의회(KAVA, Korea Association ofVoluntary Agencies)는 구호물자의 배분을 중심으로 사회복지행정 활동을 하였다.","KAVA는 구호 활동과 관련된 조직관리 기술을 도입했다.","사회복지기관들은 수용ㆍ보호에 바탕을 둔 행정관리 기술을 사용하였다.","KAVA는 서비스 중복, 누락, 서비스 제공자 간의 협력체계 구축에 초점을 두었다.","KAVA는 지역사회 조직화나 공동체 형성을 위한 조직관리 기술을 적극적으로 활용하였다."],"a":5},{"id":"20-3-33","y":2020,"g":3,"n":33,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["하센필드(Y. Hasenfeld)가 주장하는 조직환경 대응전략이 아닌 것은?"],"c":["권위주의 전략","경쟁전략","협동전략","방해전략","전문화 전략"],"a":5},{"id":"20-3-34","y":2020,"g":3,"n":34,"t":"리더십·동기부여·의사결정","f":"옳지 않은 것","s":["리더십이론에 관한 설명으로 옳지 않은 것은?"],"c":["관리격자이론은 조직원의 특성과 같은 상황적 요소를 고려하고 있다.","특성이론의 비판적 대안으로 행동이론이 등장하였다.","섬김의 리더십(Servant Leadership)은 힘과 권력에 의한조직지배를 지양한다.","거래적 리더십은 교환관계를 기반으로 하여 조직성과를높이고자 한다.","상황이론은 과업환경에 따라 적합하게 대응하는 리더십이 효과적이라고 가정한다."],"a":1},{"id":"20-3-35","y":2020,"g":3,"n":35,"t":"조직운영·법인·이사회","f":"옳지 않은 것","s":["사회복지시설평가에 관한 설명으로 옳지 않은 것은?"],"c":["평가의 근거는 1997년 개정된 사회복지사업법이다.","평가의 목적은 시설운영의 효율화 등을 위한 것이다.","이용자의 권리에 관한 지표의 경우 거주시설(생활시설)에한해서 적용하여 평가한다.","개별 사회복지시설의 고유성이 반영되지 못하는 점은 평가의 한계점으로 여겨진다.","평가지표 선정 시 현장의견수렴 절차가 필요하다."],"a":3},{"id":"20-3-36","y":2020,"g":3,"n":36,"t":"리더십·동기부여·의사결정","f":"사례·제시문 판단","s":["다음 사례에서 설명하는 동기이론은?","A는 자신보다 승진이 빠른 입사 동기인 사회복지사 B와의 비교로, 보충해야 할 업무역량을 분석하였다. A는 B가 가진 프로그램 기획력과 사례관리 역량의 필요성을 알게 되었고, 직무 향상과 승진을 위해 대학원 진학을 결정하였다."],"c":["욕구위계이론(A. Maslow)","동기위생이론(F. Herzberg)","ERG이론(C. Alderfer)","형평성이론(J. S. Adams)","기대이론(V. H. Vroom)"],"a":4},{"id":"20-3-37","y":2020,"g":3,"n":37,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"옳은 것 고르기","s":["직무수행평가에 관한 설명으로 옳은 것은?"],"c":["기준의 확립은 평가의 마지막 단계에서 이루어진다.","조직원들에게 직무수행의 기대치를 전달하는 목적을 지니고 있다.","도표평정식평가(Graphic Rating Scale)는 관대화오류(Leniency Error)가 발생되지 않는다.","자기평가는 서비스 이용자에 의한 평가보다 많은 비용이소모되는 어려움이 있다.","동료평가는 직무에 대해서 평가대상자보다 넓은 지식과이해를 하고 있다는 전제를 바탕으로 실시한다."],"a":2},{"id":"20-3-38","y":2020,"g":3,"n":38,"t":"조직이론·조직구조","f":"옳지 않은 것","s":["사회복지조직의 책임성을 확보하기 위한 노력이 아닌 것은?"],"c":["개인정보 보호를 위해 사회복지조직 후원금 사용 정보의미공개","「사회복지사업법」에 따른 사회복지법인 이사회 구성","「사회복지법인 및 사회복지시설 재무ㆍ회계규칙」에 근거한 예산 편성","배분사업 공모를 통한 사회복지 프로그램 재정지원 시행","사회복지예산 수립을 위한 주민참여제도 시행"],"a":1},{"id":"20-3-39","y":2020,"g":3,"n":39,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"사례·제시문 판단","s":["다음에서 설명하는 직원능력 개발방법은?","- 지속적이고 새로운 전문지식 습득 방법","- 지역사회의 필요 및 구성원의 욕구에 따라 융통성 있게 실시 가능","- 사회복지사에게 직무연수 방식으로 제공"],"c":["패널토의(Panel Discussion)","순환보직(Job Rotation)","계속교육(Continuing Education)","역할연기(Role Playing)","분임토의(Syndicate)"],"a":3},{"id":"20-3-40","y":2020,"g":3,"n":40,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["최근 사회복지행정의 환경 변화로 옳지 않은 것은?"],"c":["지역사회 주민운동의 활성화","사회서비스 공급의 주체로서 영리부문의 참여","지역사회보장협의체를 통한 민ㆍ관 협력체계 구축","사회적경제에 의한 비영리조직의 시장경쟁력 강화 필요","복지다원주의 패러다임 등장으로 국가 주도의 복지서비스 공급"],"a":5},{"id":"20-3-41","y":2020,"g":3,"n":41,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"옳은 것 모두 고르기","s":["직무소진(Burnout)에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 직무에서 비롯되는 스트레스에 대한 반응이다.","ㄴ. 목적의식이나 관심을 점차적으로 상실하는 과정이다.","ㄷ. 감정이입이 업무의 주요 기술인 직무현장에서 발생하는 현상이다."],"c":["ㄱ","ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":5},{"id":"20-3-42","y":2020,"g":3,"n":42,"t":"리더십·동기부여·의사결정","f":"옳은 것 모두 고르기","s":["변혁적 리더십에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 새로운 비전제시 및 지적 자극, 조직문화 창출을 지향한다.","ㄴ. 성과에 대한 금전적인 보상이 구성원의 높은 헌신을 가능하게 한다.","ㄷ. 조직목표 중 개인의 사적이익을 가장 우선시한다."],"c":["ㄱ","ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":1},{"id":"20-3-43","y":2020,"g":3,"n":43,"t":"마케팅·홍보·정보관리","f":"옳은 것 고르기","s":["사회복지관에서 우편으로 잠재적 후원자에게 기관의 현황이나 정보 등을 제공하여 후원자를 개발하는 마케팅 방법은?"],"c":["고객관계관리 마케팅","데이터베이스 마케팅","다이렉트 마케팅","소셜 마케팅","클라우드 펀딩"],"a":3},{"id":"20-3-44","y":2020,"g":3,"n":44,"t":"기획·프로그램 기획·평가","f":"옳은 것 고르기","s":["총체적 품질관리(TQM) 원칙에 관한 설명으로 옳은 것은?"],"c":["조직구성원들의 집단적 노력을 강조한다.","현상 유지가 조직의 중요한 관점이다.","의사결정은 전문가의 직관을 기반으로 한다.","구성원들과 각 부서는 경쟁체제를 형성한다.","품질결정은 전문가가 주도한다."],"a":1},{"id":"20-3-45","y":2020,"g":3,"n":45,"t":"재정관리·예산·회계·모금","f":"옳지 않은 것","s":["사회복지법인 및 사회복지시설 재무ㆍ회계규칙상 사회복지관의 결산보고서에 첨부해야하는 서류가 아닌 것은?"],"c":["과목 전용조서","사업수입명세서","사업비명세서","세입ㆍ세출명세서","인건비명세서"],"a":4},{"id":"20-3-46","y":2020,"g":3,"n":46,"t":"행정 개념·역사·환경","f":"순서 나열","s":["사회복지서비스 전달체계의 도입을 시대 순으로 나열한 것은?","ㄱ. 사회복지사무소 시범사업","ㄴ. 희망복지지원단","ㄷ. 사회복지전문요원","ㄹ. 보건복지사무소 시범사업","ㅁ. 지역사회보장협의체"],"c":["ㄹ - ㄷ - ㄴ - ㄱ - ㅁ","ㄷ - ㄹ - ㄱ - ㄴ - ㅁ","ㄹ - ㄱ - ㄷ - ㄴ - ㅁ","ㄱ - ㄷ - ㄹ - ㅁ - ㄴ","ㄷ - ㄹ - ㅁ - ㄴ - ㄱ"],"a":2},{"id":"20-3-47","y":2020,"g":3,"n":47,"t":"기획·프로그램 기획·평가","f":"옳은 것 모두 고르기","s":["시간별 활동계획도표(Gantt Chart)의 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 시간별 활동계획의 설계는 확인-조정-계획-실행의 순환적 과정으로 이루어진다.","ㄴ. 헨리 간트(H. Gantt)에 의해 최초로 개발되었다.","ㄷ. 목표달성 기한을 정해놓고 목표달성을 위해 설정된 주요활동과 시간계획을 연결시켜 도표로 나타낸 것이다.","ㄹ. 활동과 활동 사이의 상관관계를 파악하기 힘들다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"a":4},{"id":"20-3-48","y":2020,"g":3,"n":48,"t":"기획·프로그램 기획·평가","f":"옳은 것 고르기","s":["사회복지 프로그램 목표에서 성과목표로 옳은 것은?"],"c":["1시간씩 학습지도를 제공한다.","월 1회 요리교실을 진행한다.","자아존중감을 10% 이상 향상한다.","10분씩 명상훈련을 실시한다.","주 2회 물리치료를 제공한다."],"a":3},{"id":"20-3-49","y":2020,"g":3,"n":49,"t":"재정관리·예산·회계·모금","f":"옳지 않은 것","s":["품목별 예산에 관한 설명으로 옳지 않은 것은?"],"c":["예산의 남용을 방지할 수 있다.","회계책임을 명백히 할 수 있다.","신축성 있게 예산을 집행할 수 있다.","급여와 재화 및 서비스 구매에 효과적이다.","정책 및 사업의 우선순위를 소홀히 할 수 있다."],"a":3},{"id":"20-3-50","y":2020,"g":3,"n":50,"t":"기획·프로그램 기획·평가","f":"옳은 것 고르기","s":["중ㆍ장년 고독사 예방 프로그램을 기획하기 위해 사회복지관에서 근무하는 사회복지사, 사회복지전담공무원, 보건소 간호사 등이 모여 상호간 질의와 응답을 통해 자료를 수집하는 방법은?"],"c":["패널조사","초점집단조사","델파이기법","사회지표조사","서베이조사"],"a":2},{"id":"21-3-26","y":2021,"g":3,"n":26,"t":"기획·프로그램 기획·평가","f":"옳은 것 고르기","s":["사회복지행정에서 효과성(effectiveness)에 관한 설명으로 옳은 것은?"],"c":["조직의 목표 달성 정도","투입에 대한 산출의 비율","사회복지기관의 지역적 집중도","서비스 이용의 편의성 정도","서비스 자원의 활용가능성 정도"],"a":1},{"id":"21-3-27","y":2021,"g":3,"n":27,"t":"조직운영·법인·이사회","f":"옳은 것 고르기","s":["사회복지관 운영에 관한 설명으로 옳은 것은?"],"c":["기초 지방자치단체 마다 설치해야 한다.","사회복지전담공무원을 의무적으로 고용해야 한다.","지역사회를 기반으로 운영되는 사회복지기관이다.","중산층 주민은 이용할 수 없다.","프로젝트 팀 구조를 활용할 수 없다."],"a":3},{"id":"21-3-28","y":2021,"g":3,"n":28,"t":"재정관리·예산·회계·모금","f":"옳지 않은 것","s":["한국의 사회복지 행정체계에 관한 설명으로 옳지 않은 것은?"],"c":["공공 행정체계와 민간 행정체계로 구성된다.","중앙정부의 사회복지 담당 부처는 보건복지부이다.","지방자치단체의 사회복지 행정체계는 일반 행정체계에포함되어 있다.","민간 사회복지기관은 국가나 지방자치단체의 보조금을받지 않는다.","사회복지 행정체계에는 영리 사업자도 참여하고 있다."],"a":4},{"id":"21-3-29","y":2021,"g":3,"n":29,"t":"조직이론·조직구조","f":"옳은 것 모두 고르기","s":["과학적 관리론(scientific management)에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 조직 구성원의 업무를 과학적으로 분석하며 활용한다.","ㄴ. 집권화를 통한 위계구조 설정이 조직 성과의 결정적 요인이다.","ㄷ. 호손(Hawthorne) 공장에서의 실험결과를 적극 반영하였다.","ㄹ. 경제적 보상을 통해 생산성을 극대화할 수 있다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄷ","ㄷ, ㄹ"],"a":3},{"id":"21-3-30","y":2021,"g":3,"n":30,"t":"조직이론·조직구조","f":"사례·제시문 판단","s":["다음에서 설명하고 있는 조직이론은?","- 효과적인 조직관리 방법은 조직이 처한 환경과 조건에 따라 달라진다.","- 경직된 규칙과 구조를 가진 조직이 효과적일 경우도 있다.","- 어느 경우에나 적용되는 최선의 조직관리 이론은 없다."],"c":["상황이론","관료제이론","논리적합이론","인지이론","인간관계이론"],"a":1},{"id":"21-3-31","y":2021,"g":3,"n":31,"t":"조직이론·조직구조","f":"옳지 않은 것","s":["비영리조직의 특성을 설명한 것으로 옳지 않은 것은?"],"c":["사적 이익보다는 공동체의 이익을 우선적으로 추구한다.","필요에 따라 수익사업을 실시하기도 한다.","회원 조직도 비영리조직에 포함된다.","기부금이나 후원금이 조직의 중요한 재원이다.","한국에는 비영리조직에 대한 세제혜택이 없다."],"a":5},{"id":"21-3-32","y":2021,"g":3,"n":32,"t":"행정 개념·역사·환경","f":"사례·제시문 판단","s":["다음에 해당하는 사회복지조직 구조의 변화는?","A지방자치단체는 아동학대 문제에 적극 대처하기 위해 'A지역 아동보호네트워크'를 발족했다. 이 네트워크에는 지역 내 공공기관, 아동보호전문기관, 초등학교, 지역아동센터, 병원, 시민단체, 편의점 등이 참여하여 학대가 의심되는 아동을 발견했을 때 신속하게 신고, 접수 및 대응할 수 있도록 했다."],"c":["지역복지 거버넌스 구축","사업성과 평가체계 구축","서비스 경쟁체계 도입","복지시설 확충","서비스 품질인증제 도입"],"a":1},{"id":"21-3-33","y":2021,"g":3,"n":33,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["사회복지조직의 환경에 관한 설명으로 옳지 않은 것은?"],"c":["다른 기관과의 경쟁은 고려하지 않는다.","과학기술의 발전은 사회복지기관의 서비스에도 영향을미친다.","사회인구적 특성은 사회문제와 밀접한 관계가 있다.","경제적 상황은 서비스 수요에 영향을 미친다.","법적 규제가 많을수록 서비스에 대한 클라이언트의 접근이 제한된다."],"a":1},{"id":"21-3-34","y":2021,"g":3,"n":34,"t":"조직이론·조직구조","f":"사례·제시문 판단","s":["관리격자(managerial grid) 이론에 따르면 다음에 해당하는 리더십 유형은?","A사회복지관의 관장은 직원 개인의 문제와 상황에 관심을 갖고 적극적으로 지원한다. 관장은 조직 내 인간관계도 중요하게 여겨서 공식·비공식적 방식으로 직원들의 공동체 의식을 키우기 위해 노력한다. 사회복지관 사업관리는 서비스제공 팀장에게 일임하고 있으며, 자신은 화기애애한 조직 분위기를 조성하는 역할에 전념한다."],"c":["무력형(impoverished management)","과업형(task management)","팀형(team management)","중도형(middle of the road management)","컨트리클럽형(country club management)"],"a":5},{"id":"21-3-35","y":2021,"g":3,"n":35,"t":"리더십·동기부여·의사결정","f":"사례·제시문 판단","s":["다음에 해당하는 리더십 유형은?","- 조직의 목표에 대한 구성원의 참여동기가 증대될 수 있다.","- 조직의 리더와 구성원 간 의사소통이 활발해질 수 있다.","- 집단의 지식, 경험, 기술의 활용이 용이하다."],"c":["지시적 리더십","참여적 리더십","방임적 리더십","과업형 리더십","위계적 리더십"],"a":2},{"id":"21-3-36","y":2021,"g":3,"n":36,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"옳지 않은 것","s":["인적자원관리의 영역에 해당하지 않는 것은?"],"c":["채용","배치","평가","승진","재무"],"a":5},{"id":"21-3-37","y":2021,"g":3,"n":37,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"옳은 것 모두 고르기","s":["직무를 통한 연수(OJT)에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 직원이 지출한 자기개발 비용을 조직에서 지원한다.","ㄴ. 일반적으로 조직의 상사나 선배를 통해 이루어진다.","ㄷ. 일상적인 업무를 통해 이루어지는 경우가 많다.","ㄹ. 조직 외부의 전문교육 기관에서 제공된다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄷ","ㄷ, ㄹ"],"a":4},{"id":"21-3-38","y":2021,"g":3,"n":38,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"옳지 않은 것","s":["직무기술서에 포함되어야 할 내용으로 옳지 않은 것은?"],"c":["급여 수준","직무 명칭","직무 내용","직무 수행방법","핵심 과업"],"a":1},{"id":"21-3-39","y":2021,"g":3,"n":39,"t":"재정관리·예산·회계·모금","f":"옳지 않은 것","s":["예산에 관한 설명으로 옳지 않은 것은?"],"c":["영기준 예산(Zero Based Budgeting)은 예산의 효율성을중요시 한다.","영기준 예산(Zero Based Budgeting)은 전년도 예산을고려하지 않는다.","성과주의 예산(Performance Budgeting)은 업무에 중점을 두는 관리지향의 예산제도이다.","기획예산제도(Planning Programming BudgetingSystem)는 미래의 비용을 고려하지 않는다.","품목별 예산(Line Item Budgeting)은 전년도 예산을 근거로 한다."],"a":4},{"id":"21-3-40","y":2021,"g":3,"n":40,"t":"조직이론·조직구조","f":"옳은 것 고르기","s":["사회복지조직의 재원에 관한 설명으로 옳은 것은?"],"c":["국가와 지방자치단체의 보조금은 포함되지 않는다.","후원금은 증가하거나 감소하는 유동적인 재원이다.","서비스 이용료로 재정을 충당할 수 없다.","별도의 재원 확보를 위한 모금 전략은 불필요하다.","사회복지법인 등 비영리법인의 전입금은 공적 재원이다."],"a":2},{"id":"21-3-41","y":2021,"g":3,"n":41,"t":"기획·프로그램 기획·평가","f":"옳지 않은 것","s":["사회복지기관의 서비스 질에 관한 설명으로 옳지 않은 것은?"],"c":["서브퀄(SERVQUAL)에는 신뢰성과 확신성이 포함된다.","서비스 질은 사회복지평가의 기준이 될 수 없다.","위험관리(Risk Management)는 이용자에 대한 서비스 관리 측면과 조직관리 측면을 모두 포함한다.","총체적 품질관리(TQM)에서 서비스의 질은 고객의 결정에 의한다.","서비스 이용자와 제공자 관점에서 질적 평가가 중요시되고 있다."],"a":2},{"id":"21-3-42","y":2021,"g":3,"n":42,"t":"행정 개념·역사·환경","f":"순서 나열","s":["우리나라 사회복지전달체계의 변화 과정을 순서대로 나열한 것은?","ㄱ. 사회복지사무소 시범사업","ㄴ. 지역사회 통합돌봄","ㄷ. 읍·면·동 복지허브화","ㄹ. 사회복지통합관리망(행복e음) 개통","ㅁ. 보건복지사무소 시범사업"],"c":["ㄱ - ㅁ - ㄷ - ㄹ – ㄴ","ㄴ - ㄱ - ㄹ - ㅁ – ㄷ","ㄷ - ㄴ - ㅁ - ㄹ - ㄱ","ㄹ - ㅁ - ㄱ - ㄷ – ㄴ","ㅁ - ㄱ - ㄹ - ㄷ - ㄴ"],"a":5},{"id":"21-3-43","y":2021,"g":3,"n":43,"t":"재정관리·예산·회계·모금","f":"옳지 않은 것","s":["사회복지전달체계 구축 시 고려해야 할 사항으로 옳지 않은 것은?"],"c":["통합성: 서비스의 중복과 누락을 방지하고 다양한 서비스를 통합적으로 제공해야 한다.","포괄성: 클라이언트의 다양한 욕구 중 한 가지 욕구를해결하기 위하여 전문가 집단이 개입하는 방식이다.","적절성: 사회복지서비스의 양과 질이 서비스 수요자의욕구 충족과 서비스 목표 달성에 적합해야 한다.","접근성: 서비스 이용자에게 공간, 시간, 정보, 재정 등의제약이 없는 서비스 제공을 의미한다.","전문성: 충분한 사회복지전문가의 확보가 필요하다."],"a":2},{"id":"21-3-44","y":2021,"g":3,"n":44,"t":"기획·프로그램 기획·평가","f":"옳지 않은 것","s":["기획의 모델과 기법에 관한 설명으로 옳지 않은 것은?"],"c":["논리모델은 투입-활동-산출-성과로 도식화하는 방법이다.","전략적 기획은 과정을 강조하므로 우선순위를 설정하고단계적인 계획을 수립한다.","방침관리기획(PDCA)은 체계이론을 적용한 모델이다.","간트 도표(Gantt Chart)는 사업별로 진행시간을 파악하여 각각 단계별로 분류한 시간을 단선적 활동으로 나타낸다.","프로그램 평가 검토기법(PERT)은 일정한 기간에 추진해야 하는 행사에 필요한 복잡한 과업의 순서가 보이도록 하고 임계통로를 거친다."],"a":3},{"id":"21-3-45","y":2021,"g":3,"n":45,"t":"마케팅·홍보·정보관리","f":"옳지 않은 것","s":["마케팅 믹스(Marketing mix)의 4P에 해당하지 않는 것은?"],"c":["제품(Product)","가격(Price)","판매촉진(Promotion)","입지(Place)","성과(Performance)"],"a":5},{"id":"21-3-46","y":2021,"g":3,"n":46,"t":"마케팅·홍보·정보관리","f":"옳은 것 고르기","s":["비영리조직 마케팅에 관한 설명으로 옳은 것은?"],"c":["영리추구의 목적으로만 마케팅을 추진한다.","비영리조직 간의 경쟁에 대한 대응은 필요없다.","공익사업과 수익사업의 적절한 운영을 위하여 필요하다.","사회복지조직이 제공하는 비물질적인 서비스는 마케팅대상이 아니다.","비영리조직의 재정자립은 마케팅의 목표가 될 수 없다."],"a":3},{"id":"21-3-47","y":2021,"g":3,"n":47,"t":"기획·프로그램 기획·평가","f":"옳지 않은 것","s":["사회복지의 책임성 평가에 관한 설명으로 옳지 않은 것은?"],"c":["효과성 평가를 위하여 비용편익분석을 실시한다.","형성평가는 과정을 파악하는 동태적 분석으로 프로그램진행 중에 실시할 수 있다.","사회복지 프로그램 평가를 통하여 프로그램 수정과 정책개발 등에 활용한다.","사회복지전달체계는 사회복지의 책임성을 이행할 수 있도록 구축되어야 한다.","우리나라의 사회복지시설 평가는 사회복지사업법에 근거하여 실시한다."],"a":1},{"id":"21-3-48","y":2021,"g":3,"n":48,"t":"기획·프로그램 기획·평가","f":"사례·제시문 판단","s":["우리나라의 사회복지시설 평가제도에 관한 설명으로 옳은 것은?","ㄱ. 3년마다 평가 실시","ㄴ. 5년마다 평가 실시","ㄷ. 평가 결과의 비공개원칙","ㄹ. 평가 결과를 시설 지원에 반영"],"c":["ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"a":2},{"id":"21-3-49","y":2021,"g":3,"n":49,"t":"기획·프로그램 기획·평가","f":"옳지 않은 것","s":["사회복지평가의 기준이 되는 효율성에 관한 설명으로 옳지 않은 것은?"],"c":["사회복지조직의 책임성 평가 방식이다.","투입한 자원과 산출된 결과의 비율을 측정한다.","자금이나 시간의 투입과 서비스 제공 실적의 비율을 파악한다.","비용 절감은 서비스 이용자의 욕구 충족을 위한 목표와관련성이 없다.","최소한의 비용으로 최대한의 효과를 거둘 수 있도록 한다."],"a":4},{"id":"21-3-50","y":2021,"g":3,"n":50,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["사회복지행정 환경의 동향에 관한 설명으로 옳지 않은 것은?"],"c":["사회서비스 확대로 사회적 일자리가 창출되고 있다.","지방자치단체에서 주민참여를 활성화하고 있다.","주민센터를 행정복지센터로 개편하는 추세이다.","지역사회 통합돌봄 추진에 따라 생활시설 거주자의 퇴소를 금지하고 있다.","지역사회 통합돌봄 도입으로 전문직종 간 서비스를 연계하여 제공한다."],"a":4},{"id":"22-3-26","y":2022,"g":3,"n":26,"t":"조직이론·조직구조","f":"옳지 않은 것","s":["사회복지행정가가 가져야 할 능력이 아닌 것은?"],"c":["배타적 사고","대안모색","조직이론 이해","우선순위 결정","권한위임과 권한실행"],"a":1},{"id":"22-3-27","y":2022,"g":3,"n":27,"t":"행정 개념·역사·환경","f":"순서 나열","s":["사회복지행정의 실행 과정을 순서대로 나열한 것은?","ㄱ. 과업 평가　　　ㄴ. 과업 촉진　　　ㄷ. 과업 조직화","ㄹ. 과업 기획　　　ㅁ. 환류"],"c":["ㄱ - ㄷ - ㄹ - ㅁ - ㄴ","ㄷ - ㄱ - ㄹ - ㄴ - ㅁ","ㄷ - ㄹ - ㅁ - ㄴ - ㄱ","ㄹ - ㄴ - ㄷ - ㄱ - ㅁ","ㄹ - ㄷ - ㄴ - ㄱ - ㅁ"],"a":5},{"id":"22-3-28","y":2022,"g":3,"n":28,"t":"조직이론·조직구조","f":"빈칸 채우기","s":["다음의 ( )에 들어갈 내용으로 옳은 것은?","테일러(F. W. Taylor)가 개발한 과학적 관리론은 ( ㄱ )에게만 조직의 목표를 설정할 수 있는 ( ㄴ )을 부여하기 때문에 ( ㄷ )의 의사결정( ㄹ )을(를) 지향하는 사회복지조직에 적용하는 데는 한계가 있을 수 있다."],"c":["ㄱ: 직원, ㄴ: 책임, ㄷ: 직원, ㄹ: 과업","ㄱ: 관리자, ㄴ: 책임, ㄷ: 직원, ㄹ: 참여","ㄱ: 관리자, ㄴ: 과업, ㄷ: 관리자, ㄹ: 참여","ㄱ: 직원, ㄴ: 과업, ㄷ: 직원, ㄹ: 과업","ㄱ: 직원, ㄴ: 과업, ㄷ: 관리자, ㄹ: 참여"],"a":2},{"id":"22-3-29","y":2022,"g":3,"n":29,"t":"조직이론·조직구조","f":"옳은 것 모두 고르기","s":["사회복지조직관리자가 상황이론(contingency theory)을 활용할 경우 고려해야 할 것을 모두 고른 것은?","ㄱ. 계층적 승진 제도를 통해서 직원의 성취 욕구를 고려한다.","ㄴ. 시간과 동작 분석을 활용하며 표준시간과 표준동작을 정한다.","ㄷ. 사회복지조직을 둘러싸고 있는 사회, 정치, 경제, 문화 변수 등을 고려한다."],"c":["ㄱ","ㄴ","ㄷ","ㄱ, ㄷ","ㄴ, ㄷ"],"a":3},{"id":"22-3-30","y":2022,"g":3,"n":30,"t":"조직이론·조직구조","f":"옳은 것 모두 고르기","s":["조직구조 유형 중 태스크포스(TF)에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 팀 형식으로 운영하는 조직이다.","ㄴ. 특정 목표달성을 위한 업무에 전문가들을 배치한다.","ㄷ. 환경의 변화에 대응하기 위해서 만든 조직의 성격이 강하다."],"c":["ㄱ","ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":5},{"id":"22-3-31","y":2022,"g":3,"n":31,"t":"조직운영·법인·이사회","f":"옳지 않은 것","s":["현대조직운영 기법에 관한 설명으로 옳지 않은 것은?"],"c":["리스트럭처링(restructuring): 중복사업을 통합하여 조직경쟁력 확보","리엔지니어링(re-engineering): 업무시간을 간소화시켜서비스 시간 단축","벤치마킹(benchmarking): 특수분야에서 우수한 대상을찾아 뛰어난 부분 모방","아웃소싱(outsourcing): 계약을 통해 외부전문가에게 조직기능 일부 의뢰","균형성과표(balanced score card): 공정한 직원채용을위해서 만든 면접평가표"],"a":5},{"id":"22-3-32","y":2022,"g":3,"n":32,"t":"조직이론·조직구조","f":"옳은 것 고르기","s":["학습조직 구축요인에 관한 설명으로 옳은 것은?"],"c":["자기숙련(personal mastery): 명상 활동","공유비전(shared vision): 개인적 비전 유지","사고모형(mental models): 계층적 수직구조 이해","팀학습(team learning): 최고관리자의 감독과 통제를 통한 학습","시스템 사고(systems thinking): 전체와 부분 간 역동적관계 이해"],"a":5},{"id":"22-3-33","y":2022,"g":3,"n":33,"t":"마케팅·홍보·정보관리","f":"사례·제시문 판단","s":["다음에서 설명하는 사회복지정보시스템 명칭은?","- 사회복지사업 정보와 지원대상자의 자격정보, 수급이력정보 등을 통합관리하는 시스템","- 대상자의 소득, 재산, 인적자료, 수급이력정보 등을 연계하며 정확한 사회복지대상자 선정 및 효율적 복지업무 처리 지원"],"c":["복지로","사회보장정보시스템(범정부)","사회복지시설정보시스템","사회서비스전자바우처시스템","보건복지정보시스템"],"a":2},{"id":"22-3-34","y":2022,"g":3,"n":34,"t":"기획·프로그램 기획·평가","f":"순서 나열","s":["스키드모어(R. A. Skidmore)의 기획과정을 순서대로 나열한 것은?","ㄱ. 대안 모색　　　　　　　ㄴ. 가용자원 검토","ㄷ. 대안 결과예측　　　　　ㄹ. 최종대안 선택","ㅁ. 구체적 목표 설정　　　ㅂ. 프로그램 실행계획 수립"],"c":["ㄱ - ㄴ - ㄷ - ㅁ - ㅂ - ㄹ","ㄱ - ㄷ - ㄹ - ㄴ - ㅁ - ㅂ","ㄱ - ㄷ - ㅁ - ㄴ - ㅂ - ㄹ","ㅁ - ㄴ - ㄱ - ㄷ - ㄹ - ㅂ","ㅁ - ㅂ - ㄴ - ㄱ - ㄷ - ㄹ"],"a":4},{"id":"22-3-35","y":2022,"g":3,"n":35,"t":"재정관리·예산·회계·모금","f":"옳지 않은 것","s":["예산 통제의 원칙으로 옳지 않은 것은?"],"c":["강제의 원칙","개별화의 원칙","접근성의 원칙","효율성의 원칙","예외의 원칙"],"a":3},{"id":"22-3-36","y":2022,"g":3,"n":36,"t":"재정관리·예산·회계·모금","f":"옳지 않은 것","s":["사회복지법인 및 시설 재무ㆍ회계 규칙상 사회복지관에서 예산서류를 제출할 때 첨부하는 서류가 아닌 것은?"],"c":["예산총칙","세입ㆍ세출 명세서","사업수입 명세서","임직원 보수 일람표","예산을 의결한 이사회 회의록 또는 예산을 보고받은 시설운영위원회 회의록 사본"],"a":3},{"id":"22-3-37","y":2022,"g":3,"n":37,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["사회복지조직의 책임성에 관한 설명으로 옳지 않은 것은?"],"c":["업무수행 결과에 대한 책임뿐만 아니라 업무과정에 대한정당성을 의미한다.","책임성 이행측면에서 효율성을 배제하고 효과성을 극대화해야 한다.","지역사회와의 관계뿐만 아니라 조직 내 상호작용에서도정당성을 확보해야 한다.","정부 및 재정자원제공자, 사회복지조직, 사회복지전문직,클라이언트 등에게 책임성을 입증해야 한다.","클라이언트 집단의 욕구를 충족시키고 당면한 사회문제를 해결하고 있다는 증거를 보여줘야 한다."],"a":2},{"id":"22-3-38","y":2022,"g":3,"n":38,"t":"마케팅·홍보·정보관리","f":"사례·제시문 판단","s":["다음에서 설명하는 마케팅 방법은?","A초등학교의 학부모들이 사회복지사에게 본인들의 자녀와 연령대가 비슷한 아이들을 돕고 싶다고 이야기하였다. 이에 사회복지사들은 월 1회 아동문화체험 프로그램을 기획하며 이들을 후원자로 참여할 수 있도록 요청하였다."],"c":["사회 마케팅","공익연계 마케팅","다이렉트 마케팅","데이터베이스 마케팅","고객관계관리 마케팅"],"a":5},{"id":"22-3-39","y":2022,"g":3,"n":39,"t":"기획·프로그램 기획·평가","f":"사례·제시문 판단","s":["다음에서 설명하는 프로그램 평가의 기준은?","- 서비스를 받은 클라이언트 수","- 목표달성을 위해 투입된 시간 및 자원의 양","- 프로그램 담당자의 제반활동"],"c":["노력","영향","효과성","효율성","서비스의 질"],"a":1},{"id":"22-3-40","y":2022,"g":3,"n":40,"t":"행정 개념·역사·환경","f":"옳은 것 모두 고르기","s":["최근 사회복지조직의 환경변화로 옳은 것을 모두 고른 것은?","ㄱ. 사회복지 공급주체의 다양화","ㄴ. 행정관리능력 향상으로 거주시설 대규모화","ㄷ. 성과에 대한 강조와 마케팅 활성화","ㄹ. 기업의 경영관리 기법 도입"],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":4},{"id":"22-3-41","y":2022,"g":3,"n":41,"t":"행정 개념·역사·환경","f":"사례·제시문 판단","s":["사회복지관에서 제공해야 하는 서비스의 최저기준에 포함되","지 않는 것은?"],"c":["시설의 환경","시설의 규모","시설의 안전관리","시설의 인력관리","시설 이용자의 인권"],"a":2},{"id":"22-3-42","y":2022,"g":3,"n":42,"t":"리더십·동기부여·의사결정","f":"옳은 것 고르기","s":["동기부여 이론에 관한 설명으로 옳은 것은?"],"c":["알더퍼(C. Alderfer)의 ERG이론은 고순위 욕구가 충족되지 못하면 저순위 욕구를 더욱 원하게 된다는 좌절퇴행(frustration regression) 개념을 제시한다.","맥그리거(D. McGregor)의 XㆍY이론은 조직에 대한 기대와 현실 간 차이가 동기수준을 결정한다는 점을 강조한다.","허즈버그(F. Herzberg)의 동기-위생요인 이론은 불만 초래 요인을 동기요인으로 규정한다.","맥클리랜드(D. McClelland)의 성취동기이론은 조직 공정성을 성취동기 고취를 위한 핵심요소로 간주한다.","매슬로우(A. Maslow)의 욕구단계 이론은 욕구가 존재,관계, 성장욕구의 세 단계로 구성된다고 주장한다."],"a":1},{"id":"22-3-43","y":2022,"g":3,"n":43,"t":"리더십·동기부여·의사결정","f":"옳은 것 모두 고르기","s":["변혁적 리더십에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 구성원들에게 봉사하는 것을 핵심적 가치로 한다.","ㄴ. 구성원들에 대한 상벌체계를 강조한다.","ㄷ. 구성원들 스스로 혁신할 수 있도록 비전을 제시해주는 것을 강조한다."],"c":["ㄱ","ㄴ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ"],"a":3},{"id":"22-3-44","y":2022,"g":3,"n":44,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"옳은 것 모두 고르기","s":["인적자원관리에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 직무분석은 직무명세 이후 가능하다.","ㄴ. 직무명세는 특정 직무수행을 위해 필요한 지식과 기능, 능력 등을 작성하는 것이다.","ㄷ. 직무평가에서는 조직목표 달성에 대한 구성원의 기여도를 고려한다."],"c":["ㄴ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":4},{"id":"22-3-45","y":2022,"g":3,"n":45,"t":"리더십·동기부여·의사결정","f":"옳은 것 고르기","s":["리더십 이론에 관한 설명으로 옳은 것은?"],"c":["블레이크와 머튼(R. Blake &J. Mouton)의 관리격자 모형은 자질이론 중 하나이다.","블레이크와 머튼의 관리격자 모형에서 가장 바람직한 행동유형은 극단에 치우치지 않은 중도형이다.","허시와 블랜차드(P. Hersey &K. H. Blanchard)의 상황적 리더십 모형에서는 구성원의 성숙도를 중요하게 고려한다.","퀸(R. Quinn)의 경쟁가치 리더십 모형은 행동이론의 대표적 모형이다.","퀸의 경쟁가치 리더십 모형에서는 조직환경의 변화에 따라 리더십이 달라져서는 안 된다는 것을 강조한다."],"a":3},{"id":"22-3-46","y":2022,"g":3,"n":46,"t":"리더십·동기부여·의사결정","f":"옳지 않은 것","s":["참여적 리더십에 관한 설명으로 옳지 않은 것은?"],"c":["의사결정의 시간과 에너지가 절약될 수 있다.","하급자가 의사결정에 참여하는 것을 강조한다.","동기부여 수준이 높은 업무자로 구성된 조직에서 효과적이다.","책임성 소재가 모호해질 수 있다.","사회복지의 가치와 부합한다."],"a":1},{"id":"22-3-47","y":2022,"g":3,"n":47,"t":"조직운영·법인·이사회","f":"옳지 않은 것","s":["사회복지서비스 전달체계에 관한 설명으로 옳지 않은 것은?"],"c":["구조ㆍ기능 차원에서 행정체계와 집행체계로 구분할 수있다.","운영주체에 따라서 공공체계와 민간체계로 구분할 수 있다.","전달체계의 접근성을 높이기 위해서는 서비스 이용의 장애요인을 줄여야 한다.","사회복지서비스 급여의 유형과 전달체계 특성은 관련이없다.","서비스 제공기관을 의도적으로 중복해서 만드는 것이 전달체계를 개선해 줄 수도 있다."],"a":4},{"id":"22-3-48","y":2022,"g":3,"n":48,"t":"행정 개념·역사·환경","f":"순서 나열","s":["사회복지서비스 전달체계 도입 순서가 올바르게 제시된 것은?","ㄱ. 희망복지지원단 설치","ㄴ. 지역사회복지협의체 설치","ㄷ. 읍면동 복지허브화 사업 실행"],"c":["ㄱ - ㄴ - ㄷ","ㄱ - ㄷ - ㄴ","ㄴ - ㄱ - ㄷ","ㄴ - ㄷ - ㄱ","ㄷ - ㄴ - ㄱ"],"a":3},{"id":"22-3-49","y":2022,"g":3,"n":49,"t":"조직운영·법인·이사회","f":"옳은 것 고르기","s":["패러슈라만 등(A. Parasuraman, V. A. Zeithaml &L. L. Berry)의 SERVQUAL 구성차원에 관한 설명으로 옳은 것은?"],"c":["신뢰성: 이용자의 요구에 선제적으로 응대할 수 있는 능력","유형성: 시설, 장비 및 서비스 제공자 용모 등의 적합성","확신성: 이용자에 대한 관심이나 상황이해 능력","공감성: 전문적 지식과 기술, 정중한 태도로 이용자를 대하는 능력","대응성: 저렴한 비용으로 서비스를 제공할 수 있는 능력"],"a":2},{"id":"22-3-50","y":2022,"g":3,"n":50,"t":"기획·프로그램 기획·평가","f":"옳지 않은 것","s":["총체적 품질관리(TQM)에 관한 설명으로 옳지 않은 것은?"],"c":["지속적인 품질개선을 강조하는 일련의 과정이다.","자료와 사실에 기반한 의사결정을 중시한다.","좋은 품질이 무엇인지는 고객이 결정한다.","집단의 노력보다는 개인의 노력이 품질향상에 더 기여한다고 본다.","조직구성원에 대한 훈련을 강조한다."],"a":4},{"id":"23-3-26","y":2023,"g":3,"n":26,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["한국 사회복지행정의 역사에 관한 설명으로 옳지 않은 것은?"],"c":["1950∼1960년대 사회복지서비스는 주로 외국 원조단체들에 의해 제공되었다.","1970년대 사회복지사업법 제정으로 사회복지시설에 대한 제도적 지원과 감독의 근거가 마련되었다.","1980년대에 사회복지전문요원제도가 도입되었다.","1990년대에 사회복지시설 평가제도가 도입되었다.","2000년대에 사회복지관에 대한 정부 보조금 지원이 제도화 되었다."],"a":5},{"id":"23-3-27","y":2023,"g":3,"n":27,"t":"기획·프로그램 기획·평가","f":"옳은 것 모두 고르기","s":["사회복지행정의 기능에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 기획(planning): 조직의 목적과 목표달성 방법을 설정하는 활동","ㄴ. 조직화(organizing): 조직의 활동을 이사회와 행정기관 등에 보고하는 활동","ㄷ. 평가(evaluating): 설정된 목표에 따라 성과를 평가하는 활동","ㄹ. 인사(staffing): 직원 채용, 해고, 교육, 훈련 등의 활동"],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"23-3-28","y":2023,"g":3,"n":28,"t":"행정 개념·역사·환경","f":"옳은 것 고르기","s":["사회복지행정의 특징에 관한 설명으로 옳은 것은?"],"c":["서비스 성과를 평가하기 어렵다.","사회복지행정가는 가치중립적이어야 한다.","서비스 효율성은 고려하지 않는다.","재정관리는 사회복지행정에 포함되지 않는다.","직무환경에 관계없이 획일적으로 운영된다."],"a":1},{"id":"23-3-29","y":2023,"g":3,"n":29,"t":"조직이론·조직구조","f":"사례·제시문 판단","s":["다음에서 설명하는 조직이론은?","- 인간의 사회적, 심리적, 정서적 욕구 강조","- 조직 내 비공식 집단의 중요성 인식","- 조직 내 개인은 감정적이며 비물질적 보상에 민감하게 반응"],"c":["과학적 관리론","관료제론","인간관계론","행정관리론","자원의존론"],"a":3},{"id":"23-3-30","y":2023,"g":3,"n":30,"t":"조직이론·조직구조","f":"옳지 않은 것","s":["베버(M. Weber)가 제시한 이상적 관료제형으로 옳지 않은 것은?"],"c":["공식적 위계와 업무처리 구조","전문성에 근거한 분업구조","전통적 권위에 의한 조직 통제","직무 범위와 권한의 명확화","조직의 기능은 규칙에 의해 제한"],"a":3},{"id":"23-3-31","y":2023,"g":3,"n":31,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["신공공관리론(New Public Management)에 관한 설명으로 옳지 않은 것은?"],"c":["공공서비스 공급에 있어 정부실패를 해결하기 위해 대두하였다.","신자유주의에 이론적 기반을 둔다.","시장의 경쟁원리를 공공행정에 도입하였다.","민간이 공급하던 서비스를 정부가 직접 공급하도록 하였다.","정부, 시장, 시민사회의 협치를 추구한다."],"a":4},{"id":"23-3-32","y":2023,"g":3,"n":32,"t":"조직이론·조직구조","f":"옳지 않은 것","s":["하센펠트(Y. Hasenfeld)가 제시한 휴먼서비스 조직의 특성으로 옳지 않은 것은?"],"c":["인간을 원료(raw material)로 한다.","클라이언트와의 직접적 관계 속에서 활동한다.","조직의 목표가 불확실하며 모호해지기 쉽다.","조직의 업무과정에서 주로 전문가에 의존한다.","목표 달성을 위해 명확한 지식과 기술을 사용한다."],"a":5},{"id":"23-3-33","y":2023,"g":3,"n":33,"t":"조직이론·조직구조","f":"옳은 것 고르기","s":["조직구조에 관한 설명으로 옳은 것은?"],"c":["조직규모가 커질수록 공식화 정도가 낮아진다.","공식화 정도가 높을수록 직원의 재량권이 줄어든다.","과업의 종류가 많을수록 수직적 분화가 늘어난다.","분권화 정도가 높을수록 최고관리자에게 조직 통제권한이 집중된다.","집권화 정도가 높을수록 직원의 권한과 책임의 범위가모호해진다."],"a":2},{"id":"23-3-34","y":2023,"g":3,"n":34,"t":"기획·프로그램 기획·평가","f":"사례·제시문 판단","s":["다음 사례에 해당하는 현상은?","A사회복지기관은 프로그램 운영 성과를 높이기 위해 기부금 모금실적을 직원 직무평가에 반영하기로 했다. 직원들이 직무평가에서 높은 점수를 받기 위해 모금활동에 더 많은 시간과 노력을 기울이게 되면서 오히려 프로그램 운영 성과는 저조하게 되었다."],"c":["리스트럭쳐링(restructuring)","목적전치(goal displacement)","크리밍(creaming)","소진(burn out)","다운사이징(downsizing)"],"a":2},{"id":"23-3-35","y":2023,"g":3,"n":35,"t":"리더십·동기부여·의사결정","f":"옳지 않은 것","s":["리더십 이론에 관한 설명으로 옳지 않은 것은?"],"c":["상황이론에 의하면 상황에 따라 적합하게 대응하는 리더십이 효과적이다.","행동이론에서 컨트리클럽형(country club management)은 사람에 대한 관심과 일에 대한 관심이 모두 높은 리더이다.","행동이론에서 과업형은 일에만 관심이 있고 사람에 대해서는 전혀 관심이 없는 리더이다.","서번트 리더십(servant leadership)은 사회복지조직 관리에 적합한 리더십이 될 수 있다.","생산성 측면에서 서번트 리더십은 자발적 행동의 정도를중시한다."],"a":2},{"id":"23-3-36","y":2023,"g":3,"n":36,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"옳지 않은 것","s":["사회복지조직의 인적자원관리에 관한 설명으로 옳지 않은 것은?"],"c":["동기부여를 위한 보상관리는 해당되지 않는다.","직원채용, 직무수행 평가, 직원개발을 포함한다.","목표관리법(MBO)으로 직원을 평가할 수 있다.","직무수행 과정에서 경력을 개발해 나갈 수 있도록 한다.","직무만족도 개선과 소진관리가 포함된다."],"a":1},{"id":"23-3-37","y":2023,"g":3,"n":37,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"옳은 것 모두 고르기","s":["직무기술서에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 작업조건을 파악해서 작성한다.","ㄴ. 직무수행을 위한 책임과 행동을 명시한다.","ㄷ. 종사자의 교육수준, 기술, 능력 등을 포함한다.","ㄹ. 직무의 성격, 내용, 수행 방법 등을 정리한 문서이다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"23-3-38","y":2023,"g":3,"n":38,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"옳지 않은 것","s":["사회복지 슈퍼비전에 관한 설명으로 옳지 않은 것은?"],"c":["행정적 기능, 교육적 기능, 지지적 기능이 있다.","소진 발생 및 예방에 영향을 미친다.","동료집단 간에는 슈퍼비전이 수행되지 않는다.","슈퍼바이저는 직속상관이나 중간관리자가 주로 담당한다.","직무를 수행하면서 훈련을 받을 수 있다는 장점이 있다."],"a":3},{"id":"23-3-39","y":2023,"g":3,"n":39,"t":"재정관리·예산·회계·모금","f":"옳은 것 고르기","s":["예산에 관한 설명으로 옳은 것은?"],"c":["영기준 예산(Zero Based Budgeting)은 전년도 예산 내역을 반영하여 수립한다.","계획 예산(Planning Programming Budgeting System)은국가의 단기적 계획 수립을 위한 장기적 예산편성 방식이다.","영기준 예산(Zero Based Budgeting)은 비용-편익분석,비용-효과분석을 거치지 않고 수립한다.","성과주의 예산(Performance Budgeting)은 전년도 사업의 성과를 고려하지 않고 수립한다.","품목별 예산(Line Item Budgeting)은 수입과 지출을 항목별로 명시하여 수립한다."],"a":5},{"id":"23-3-40","y":2023,"g":3,"n":40,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["한국 사회복지행정 체계에 관한 설명으로 옳지 않은 것은?"],"c":["읍ㆍ면ㆍ동 중심의 서비스 제공에 노력하고 있다.","사회서비스는 단일한 공급주체에 의해 제공된다.","위험관리는 위험의 사전예방과 사후관리를 모두 포함한다.","지역사회 통합돌봄(커뮤니티 케어) 시행으로 지역사회 내보건복지 서비스 제공이 확대되고 있다.","사회서비스의 개념이 기존의 사회복지서비스를 포괄하고있다."],"a":2},{"id":"23-3-41","y":2023,"g":3,"n":41,"t":"기획·프로그램 기획·평가","f":"사례·제시문 판단","s":["사회복지조직의 서비스 질 관리에 관한 설명으로 옳은 것은?","반응을 말한다."],"c":["서비스 질 관리를 위하여 위험관리가 필요하다.","총체적 품질관리(TQM)는 기업의 소비자 만족을 극대화하기 위한 기법이므로 사회복지기관에 적용하기에는 적합하지 않다.","총체적 품질관리는 지속적인 개선보다는 현상유지에 초점을 둔다.","서브퀄(SERVQUAL)의 요소에 확신성(assurance)은 포함되지 않는다.","서브퀄에서 유형성(tangible)은 고객 요청에 대한 즉각적"],"a":1},{"id":"23-3-42","y":2023,"g":3,"n":42,"t":"행정 개념·역사·환경","f":"순서 나열","s":["한국의 사회복지전달체계 개편 순서를 올바르게 나열한 것은?","ㄱ. 주민생활지원서비스 전달체계","ㄴ. 사회복지통합관리망(행복e음) 개통","ㄷ. 읍·면·동 복지허브화","ㄹ. 지역사회 통합돌봄"],"c":["ㄱ - ㄴ - ㄷ - ㄹ","ㄱ - ㄴ - ㄹ - ㄷ","ㄱ - ㄷ - ㄴ - ㄹ","ㄴ - ㄱ - ㄷ - ㄹ","ㄴ - ㄷ - ㄱ - ㄹ"],"a":1},{"id":"23-3-43","y":2023,"g":3,"n":43,"t":"조직이론·조직구조","f":"옳은 것 고르기","s":["사회복지조직의 의사결정모형에 관한 설명으로 옳은 것은?"],"c":["점증모형은 여러 대안을 평가하여 합리적 평가 순위를정하는 모형이다.","연합모형은 경제적ㆍ시장 중심적 시각에서 이루어지는모형이다.","만족모형은 주로 해결해야 할 문제가 분명하고 단순한의사결정에 적용된다.","쓰레기통모형은 조직의 목표가 모호하고, 조직의 기술이막연한 경우에 적용되는 모형이다.","공공선택모형은 시민들을 공공재의 생산자로 규정하고정부를 소비자로 규정한다."],"a":4},{"id":"23-3-44","y":2023,"g":3,"n":44,"t":"마케팅·홍보·정보관리","f":"옳지 않은 것","s":["사회복지정보화에 관한 설명으로 옳지 않은 것은?"],"c":["조직의 업무효율성을 증대시킬 수 있다.","대상자 관리의 정확성, 객관성을 확보할 수 있다.","클라이언트에 대한 사생활침해 가능성이 높아졌다.","학습조직의 필요성이 감소하였다.","사회복지행정가가 정보를 체계적으로 다룰 수 있다."],"a":4},{"id":"23-3-45","y":2023,"g":3,"n":45,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["비영리조직 마케팅의 특성으로 옳지 않은 것은?"],"c":["이윤추구보다는 사회적 가치 실현에 주안점을 둔다.","마케팅에서 교환되는 것은 유형의 재화보다는 무형의 서비스가 대부분이다.","영리조직에 비해 인간의 태도나 행동을 변화시키는 것이어렵다.","서비스의 생산과 소비의 동시성을 고려한다.","조직의 목표달성과 측정이 용이하다."],"a":5},{"id":"23-3-46","y":2023,"g":3,"n":46,"t":"마케팅·홍보·정보관리","f":"옳은 것 모두 고르기","s":["마케팅믹스 4P에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 유통(Place): 고객이 서비스를 쉽게 이용할 수 있도록 하는 조직적 활동","ㄴ. 가격(Price): 판매자가 이윤 극대화를 위하여 임의로 설정하는 금액","ㄷ. 제품(Product): 고객의 욕구를 충족시키기 위하여 제공하는 재화나 서비스","ㄹ. 촉진(Promotion): 판매 실적에 따라 직원을 승진시키는 제도"],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":2},{"id":"23-3-47","y":2023,"g":3,"n":47,"t":"기획·프로그램 기획·평가","f":"옳은 것 모두 고르기","s":["프로그램 평가에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 비용-효과분석은 프로그램의 비용과 결과의 금전적 가치를 고려하지 않는다.","ㄴ. 비용-편익분석은 프로그램의 비용과 결과를 금전적 가치로 환산하며 평가한다.","ㄷ. 노력성 평가는 프로그램 수행에 투입된 인적·물적 자원 등을 기준으로 평가한다.","ㄹ. 효과성 평가는 프로그램의 목표 달성 정도를 평가한다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"23-3-48","y":2023,"g":3,"n":48,"t":"조직이론·조직구조","f":"옳은 것 고르기","s":["사회복지조직의 혁신에 관한 설명으로 옳은 것은?"],"c":["변혁적 리더십은 부하 직원의 변화를 필요로 하지 않는다.","혁신은 목표를 더 효과적으로 달성하기 위한 인위적이고계획적인 활동이다.","사회환경 변화와 조직 혁신은 무관하다.","조직 내부환경을 고려하지 않고 변화를 추진할 때 혁신이 성공한다.","변혁적 리더십은 조직보다는 개인의 사적 이익을 강조한다."],"a":2},{"id":"23-3-49","y":2023,"g":3,"n":49,"t":"기획·프로그램 기획·평가","f":"옳지 않은 것","s":["비영리 사회복지조직에 관한 설명으로 옳지 않은 것은?"],"c":["수익성과 서비스 질을 고려하지 않고 조직을 운영한다.","정부조직에 비해 관료화 정도가 낮다.","국가와 시장이 공급하기 어려운 서비스를 제공할 수 있다.","특정 이익집단을 위한 서비스를 제공할 수 있다.","개입대상 선정과 개입방법을 특화할 수 있다."],"a":1},{"id":"23-3-50","y":2023,"g":3,"n":50,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["사회복지행정환경의 변화에 관한 설명으로 옳지 않은 것은?"],"c":["책임성 요구가 높아지고 있다.","서비스 이용자의 소비자주권이 강해지고 있다.","빅데이터 활용이 증가하고 있다.","사회서비스 공급에 민간의 참여가 증가하고 있다.","기업의 경영관리 기법 도입이 줄어들고 있다."],"a":5},{"id":"24-3-26","y":2024,"g":3,"n":26,"t":"조직이론·조직구조","f":"옳지 않은 것","s":["사회복지조직의 특성에 관한 설명으로 옳지 않은 것은?"],"c":["사회복지사의 전문성과 자율성을 인정한다.","클라이언트와 사회복지사의 관계에 따라 서비스의 효과성이 좌우된다.","서비스의 효과성을 객관적으로 입증하기가 용이하다.","다양한 상황에서 윤리적 딜레마와 가치 선택에 직면한다.","조직의 목표가 명확하거나 구체적이기 어렵다."],"a":3},{"id":"24-3-27","y":2024,"g":3,"n":27,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["한국 사회복지행정의 역사에 관한 설명으로 옳지 않은 것은?"],"c":["6.25 전쟁 이후 외국원조기관을 중심으로 사회복지시설이 설립되었다.","1960년대 외국원조기관 철수 후 자생적 사회복지단체들이 성장했다.","1980년대 후반부터 지역사회 이용시설 중심의 사회복지기관이 증가했다.","1980년대 후반부터 사회복지전문요원이 배치되기 시작했다.","1990년대 후반에 사회복지시설 설치기준이 허가제에서신고제로 바뀌었다."],"a":2},{"id":"24-3-28","y":2024,"g":3,"n":28,"t":"조직이론·조직구조","f":"옳은 것 고르기","s":["메이요(E. Mayo)가 제시한 인간관계이론에 관한 설명으로 옳은 것은?"],"c":["생산성은 근로조건과 환경에 의해서만 좌우된다.","심리적 요인은 생산성 향상에 영향을 미친다.","사회적 상호작용은 생산성 향상에 부정적인 영향을 미친다.","공식적인 부서의 형성은 생산성 향상으로 이어진다.","근로자는 집단 구성원이 아닌 개인으로서 행동하고 반응한다."],"a":2},{"id":"24-3-29","y":2024,"g":3,"n":29,"t":"조직이론·조직구조","f":"옳지 않은 것","s":["조직이론에 관한 설명으로 옳지 않은 것은?"],"c":["학습조직이론: 개인 및 조직의 학습공유를 통해 역량강화","정치경제이론: 경제적 자원과 권력간 상호작용 강조","상황이론: 조직을 폐쇄체계로 id":"25-3-26","y":2025,"g":3,"n":26,"t":"행정 개념·역사·환경","f":"옳은 것 고르기","s":["사회복지행정의 개념에 관한 설명으로 옳은 것은?"],"c":["정부조직만을 대상으로 한다.","조직의 효과성보다 효율성이 중요하다.","정부 재정 외에 민간자원 활용은 배제한다.","사회문제 해결과정에서 가치판단을 배제한다.","사회복지정책을 서비스로 전환하는 과정이다."],"a":5},{"id":"25-3-27","y":2025,"g":3,"n":27,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["한국 사회복지행정 역사에 관한 설명으로 옳지 않은 것은?"],"c":["1950년대에는 긴급구호와 생활(수용)시설에서의 보호가주를 이루었다.","1970년 ｢사회복지사업법｣제정으로 사회복지시설 운영에관한 법적 근거가 마련되었다.","1997년 ｢사회복지사업법｣개정을 통해 사회복지시설 평가가 법제화되었다.","1998년 사회복지공동모금회가 설립되었다.","2008년 노인장기요양보험제도 도입으로 민간기관의 서비스 제공이 금지되었다."],"a":5},{"id":"25-3-28","y":2025,"g":3,"n":28,"t":"조직이론·조직구조","f":"옳은 것 모두 고르기","s":["사회복지조직 이론에 관한 설명으로 옳은 것을 모두 고른것은?","ㄱ. 과학적 관리론: 직무에 관한 과학적 연구와 분석","ㄴ. 관료제이론: 표준 운영 절차를 통한 합리성과 전문성 추구","ㄷ. 인간관계론: 조직 내 인간을 심리적, 사회적 욕구를 가진 전인격적 존재로 파악","ㄹ. 상황이론: 조직의 상황에 관계없이 효율성을 극대화할 수 있는 이상적 방법 추구"],"c":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"25-3-29","y":2025,"g":3,"n":29,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["신공공관리(New Public Management)에 관한 설명으로 옳지 않은 것은?"],"c":["공공부문 조직운영에 시장원리를 적용한다.","조직규모 확장과 중앙집권화를 지향한다.","행정 효율성과 고객에 대한 대응성을 중시한다.","규제완화와 조직원 참여를 중시한다.","시민과 고객을 중심으로 서비스의 질적 수준 제고에 중점을 둔다."],"a":2},{"id":"25-3-30","y":2025,"g":3,"n":30,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["민간 비영리조직의 특성에 관한 설명으로 옳지 않은 것은?"],"c":["이윤이 발생하면 구성원에게 균등하게 배당한다.","시장과 정부 실패를 보완할 수 있다.","최소한의 조직 구조와 운영 공식성을 갖는다.","지방자치단체 보조금을 받을 수 있다.","비영리조직 회원은 자발적으로 가입한다."],"a":1},{"id":"25-3-31","y":2025,"g":3,"n":31,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["조직 분권화의 특성에 관한 설명으로 옳지 않은 것은?"],"c":["최고관리자의 업무와 책임을 감소시킬 수 있다.","직원들의 자발적 협조를 유도할 수 있다.","부서 간 협조가 늘어날 수 있다.","위기와 갈등을 신속하게 해결할 수 있다.","하위부서 재량권을 강화하는 효과가 있다."],"a":4},{"id":"25-3-32","y":2025,"g":3,"n":32,"t":"조직이론·조직구조","f":"사례·제시문 판단","s":["다음에서 설명하는 조직구조는?","○ 특정 사업이나 활동수행을 위해 기존 부서에서 인력을 파견하여 구성함","○ 조직구성원의 역량을 최대한 활용할 수 있음","○ 임시적으로 활동하고 과업이 종료되면 해체됨"],"c":["라인-스탭(line-staff)","태스크포스(task force)","감사(audit)조직","거버넌스(governance)조직","위계(hierarchy)조직"],"a":2},{"id":"25-3-33","y":2025,"g":3,"n":33,"t":"리더십·동기부여·의사결정","f":"옳은 것 고르기","s":["허츠버그(F. Herzberg)의 동기-위생이론에 따른 동기유발요인에 해당하는 것은?"],"c":["성취에 대한 인정(recognition)","기술적 감독(technical supervision)","급여(salary)","근로조건(working condition)","인간관계(interpersonal relations)"],"a":1},{"id":"25-3-34","y":2025,"g":3,"n":34,"t":"리더십·동기부여·의사결정","f":"옳은 것 고르기","s":["블레이크와 무톤(R. Blake & J. Mouton)의 관리격자(Managerial Grid) 리더십유형 분류에 관한 설명으로 옳은것은?"],"c":["효과성과 효율성에 대한 관심을 교차하여 유형화하였다.","이상적 유형은 컨트리클럽형(1.9)이다.","팀형(9.9)은 과업성과보다는 구성원의 사기와 공동체의식을 중시한다.","중도형(5.5)은 인간적 요소와 조직성과 간의 타협과 균형을 추구한다.","무기력형(1.1)은 인간적 요소에 최대의 관심을 갖는다."],"a":4},{"id":"25-3-35","y":2025,"g":3,"n":35,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"옳은 것 고르기","s":["인적자원관리체계에 관한 설명으로 옳은 것은?"],"c":["직무설계-직무 내용, 수행방법, 직무간의 관계 등 설정","직무분석-일의 종류, 난이도, 책임수준이 유사한 직급으로 묶음","직무평가-평가대상 직무에 종사하는 직원들 평가","직무기술서-직무수행자 자격요건 기술","직무명세서 -직무 성격, 내용, 수행방법 등 기술"],"a":1},{"id":"25-3-36","y":2025,"g":3,"n":36,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"옳지 않은 것","s":["사회복지조직에서 수행되는 슈퍼비전에 관한 설명으로 옳지않은 것은?"],"c":["조직구성원 훈련 및 개발에 유용한 도구이다.","교육적 기능은 직원의 정신적, 심리적 부담을 완화한다.","행정적 기능은 효율적으로 일하는 구조와 자원을 제공한다.","슈퍼바이저는 관리자, 중재자, 멘토 역할을 한다.","슈퍼비전 구성요소는 슈퍼바이지, 슈퍼바이저, 클라이언트, 조직 등이다."],"a":2},{"id":"25-3-37","y":2025,"g":3,"n":37,"t":"재정관리·예산·회계·모금","f":"옳지 않은 것","s":["예산 유형에 관한 설명으로 옳지 않은 것은?"],"c":["품목별 예산은 수입과 지출목록마다 예상되는 금액을 명시한다.","영기준 예산은 전년도 예산을 고려하지 않고 편성한다.","기획예산제도(PPBS)는 장기적 기획과 단기적 예산 편성을 프로그램 작성을 통해 결합한다.","프로그램 예산은 사업 목적보다 지출 품목을 강조한다.","성과주의 예산은 '단위원가×업무량 =예산액'으로 편성한다."],"a":4},{"id":"25-3-38","y":2025,"g":3,"n":38,"t":"재정관리·예산·회계·모금","f":"옳지 않은 것","s":["사회복지조직의 재무ㆍ회계에 관한 설명으로 옳지 않은 것은?"],"c":["보건복지부는 ｢국가재정법｣을 적용한다.","사회복지시설은 ｢사회복지법인 및 사회복지시설 재무ㆍ회계규칙｣을 적용한다.","사회복지법인 회계는 법인회계, 시설회계, 수익사업회계로 구분한다.","법인회계와 수익사업회계는 필요시 복식부기도 할 수 있다.","사회복지법인 대표이사는 관ㆍ항ㆍ목간 예산을 전용할수 없다."],"a":5},{"id":"25-3-39","y":2025,"g":3,"n":39,"t":"조직운영·법인·이사회","f":"순서 나열","s":["사회복지시설 예산 편성 및 결정 절차를 순서대로 나열한것은?","ㄱ. 시설운영위원회 보고　　　ㄴ. 예산 공고","ㄷ. 예산 편성　　　　　　　　ㄹ. 이사회 의결","ㅁ. 지방자치단체 제출"],"c":["ㄱ - ㅁ - ㄹ - ㄴ – ㄷ","ㄴ - ㄷ - ㄱ - ㄹ – ㅁ","ㄷ - ㄱ - ㄹ - ㅁ – ㄴ","ㄷ - ㄱ - ㅁ - ㄹ – ㄴ","ㅁ - ㄱ - ㄹ - ㄷ - ㄴ"],"a":3},{"id":"25-3-40","y":2025,"g":3,"n":40,"t":"기획·프로그램 기획·평가","f":"사례·제시문 판단","s":["패러슈라만 등(A. Parasuraman, V. A. Zeithaml & L. L.Berry)의 서비스 질 구성 차원 중 다음에 해당하는 것은?","○ 직원의 지식수준과 정중함, 신뢰와 확신을 심어줄 수 있는 능력","○ 긍정적 의사소통기법을 사용, 제품과 서비스를 정확히 설명"],"c":["즉응성(responsiveness)","확신성(assurance)","신뢰성(reliability)","유형성(tangible)","공감성(empathy)"],"a":2},{"id":"25-3-41","y":2025,"g":3,"n":41,"t":"행정 개념·역사·환경","f":"사례·제시문 판단","s":["다음에서 설명하는 사회복지 전달체계 구축 원칙은?","○ 지역사회통합돌봄(커뮤니티 케어)","○ 원스탑서비스 제공","○ 서비스 단편성과 비연속성 문제를 해결"],"c":["책임성","접근성","지속성","통합성","적절성"],"a":4},{"id":"25-3-42","y":2025,"g":3,"n":42,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["사회복지 전달체계에 관한 설명으로 옳지 않은 것은?"],"c":["공공 전달체계, 민간 전달체계, 공공과 민간 혼합 전달체계로 구분한다.","집행체계는 수급자와 대면 관계를 통해 서비스를 제공한다.","행정복지센터, 공단, 사회복지법인은 공공 전달체계이다.","사회복지서비스 공급자와 소비자를 연결하는 조직적ㆍ체계적 장치이다.","우리나라 사회복지서비스는 공공과 민간의 혼합 전달체계로 제공된다."],"a":3},{"id":"25-3-43","y":2025,"g":3,"n":43,"t":"기획·프로그램 기획·평가","f":"옳지 않은 것","s":["기획에 활용되는 기법에 관한 설명으로 옳지 않은 것은?"],"c":["간트차트(Gantt Chart)는 사업을 계획할 때 쉽고 간단하게 작성할 수 있다.","간트차트(Gantt Chart)는 일정계획 변경을 유연하게 수용하기 어렵다.","프로그램평가검토기법(PERT)은 업무를 체계적으로 수행하는 데 도움이 된다.","프로그램평가검토기법(PERT)은 일정변경 등 유동적인 상황을 대처하는 데 어렵다.","총괄진행표(Flow Chart)는 프로그램 제공과정을 시작부터 종료까지 한눈에 볼 수 있다."],"a":4},{"id":"25-3-44","y":2025,"g":3,"n":44,"t":"마케팅·홍보·정보관리","f":"옳지 않은 것","s":["사회복지조직에서 정보관리가 중요하게 된 이유에 관한 설명으로 옳지 않은 것은?"],"c":["사회복지조직의 책임성을 강화할 수 있기 때문이다.","사회복지조직에서 정보관리가 최우선이기 때문이다.","업무수행을 위한 적절한 정보체계를 구축할 수 있기 때문이다.","종사자의 전문성을 강화할 수 있기 때문이다.","사회복지조직의 효과성을 높이기 때문이다."],"a":2},{"id":"25-3-45","y":2025,"g":3,"n":45,"t":"기획·프로그램 기획·평가","f":"옳은 것 고르기","s":["쓰레기통 모형(Garbage can Model)에 관한 설명으로 옳은것은?"],"c":["문제 진단과 의사결정 과정이 체계적이고 논리적으로 이루어진다.","결정자의 행동보다는 객관적인 상황적 조건에 더 많은주의를 기울인다.","가장 합리적인 대안을 선택하는 모형이다.","합리성과 비합리성을 절충한 모형이다.","조직화된 무질서 속에서 우연히 의사결정이 이루어진다."],"a":5},{"id":"25-3-46","y":2025,"g":3,"n":46,"t":"마케팅·홍보·정보관리","f":"옳은 것 고르기","s":["비영리조직 마케팅에 관한 설명으로 옳은 것은?"],"c":["고객 욕구충족보다는 판매에 집중한다.","이윤을 남기는 것이 최우선 목표이다.","비영리조직의 책임성과 효과성이 강조되면서 중요성이커졌다.","후원자에게만 초점이 맞춰져 있다.","비영리조직 마케팅 목적은 프로그램을 알리는 것이지 재정확충은 아니다."],"a":3},{"id":"25-3-47","y":2025,"g":3,"n":47,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["사회복지조직 책임성에 관한 설명으로 옳지 않은 것은?"],"c":["획일적 기준으로 책임성을 규명하기 어렵다.","사회복지 공급주체가 다양해지면서 책임성 요구가 늘어나고 있다.","사회복지시설 민간위탁으로 책임성 요구가 커졌다.","｢사회복지사업법｣개정으로 사회복지시설 평가는 법으로제도화되었다.","책임성 요구가 증가하면서 사회복지서비스에 대한 질적평가는 제외되었다."],"a":5},{"id":"25-3-48","y":2025,"g":3,"n":48,"t":"행정 개념·역사·환경","f":"옳은 것 고르기","s":["최근 사회복지행정환경 변화에 관한 설명으로 옳은 것은?"],"c":["기업경영 방식 활용이 늘어나고 있다.","국가가 직접 제공하는 서비스가 늘어나고 있다.","성과(outcome) 중심 평가에서 산출(output) 중심 평가로전환되고 있다.","사회복지행정의 이론적 준거틀이 필요 없게 되었다.","사회복지서비스가 다양화되면서 전문가 활용이 감소하고있다."],"a":1},{"id":"25-3-49","y":2025,"g":3,"n":49,"t":"기획·프로그램 기획·평가","f":"옳은 것 모두 고르기","s":["프로그램평가에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 비용-편익분석은 효율성 평가이다.","ㄴ. 비용-효과분석은 효과성 평가이다.","ㄷ. 프로그램 종결 후 실시하는 성과평가는 총괄평가이다.","ㄹ. 효과발생의 인과 경로를 밝히는 것은 형성평가이다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"25-3-50","y":2025,"g":3,"n":50,"t":"마케팅·홍보·정보관리","f":"옳은 것 고르기","s":["사회복지마케팅전략에 관한 설명으로 옳은 것은?"],"c":["생산과 소비의 동시성을 고려한다.","세분화(segmentation)는 시장을 임의로 구분한다.","클라이언트 집단은 마케팅전략의 대상이 될 수 없다.","시장조사를 하지 않는다.","영리마케팅에 비하여 상품의 내구성을 고려한 전략을 수립한다."],"a":1},{"id":"26-3-26","y":2026,"g":3,"n":26,"t":"리더십·동기부여·의사결정","f":"옳지 않은 것","s":["브룸(V. H. Vroom)의 기대이론에 관한 설명으로 옳지 않은 것은?"],"c":["제도와 절차를 강조한다.","노력과 성과 연계를 강조한다.","과업 수행을 위한 인지를 강조한다.","성과와 결과 연계를 강조한다.","결과와 가치 연계를 강조한다."],"a":1},{"id":"26-3-27","y":2026,"g":3,"n":27,"t":"조직이론·조직구조","f":"사례·제시문 판단","s":["다음 사례에서 적용하고 있는 이론은?","A지역 사회복지관 관장은 「의료·요양 등 지역돌봄의 통합지원에 관한 법률」시행에 대응하며 관련 사업을 진행하려고 하였으나, 직원들이 해당 법률에 대한 지식 부족으로 자신감을 갖지 못하자 리더십을 발휘하며 사업을 진행하려고 한다."],"c":["하우스(R. J. House)의 경로-목적이론","베버(M. Weber)의 관료제이론","테일러(F. W. Taylor)의 과학적 관리론","매슬로우(A. H. Maslow)의 욕구위계이론","맥그리거(D. McGregor)의 XY이론"],"a":1},{"id":"26-3-28","y":2026,"g":3,"n":28,"t":"행정 개념·역사·환경","f":"순서 나열","s":["한국 사회복지전달체계의 변화 과정을 순서대로 나열한 것은?","ㄱ. 사회복지사무소 시범사업 시작","ㄴ. 사회서비스 전자바우처 도입","ㄷ. 지역사회 통합돌봄(커뮤니티 케어) 선도사업 시작","ㄹ. 희망복지지원단 구축"],"c":["ㄱ - ㄴ - ㄷ - ㄹ","ㄱ - ㄴ - ㄹ - ㄷ","ㄱ - ㄹ - ㄴ - ㄷ","ㄴ - ㄱ - ㄷ - ㄹ","ㄴ - ㄱ - ㄹ - ㄷ"],"a":2},{"id":"26-3-29","y":2026,"g":3,"n":29,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["사회복지행정의 특징이 아닌 것은?"],"c":["사회복지정책을 서비스로 전환하는 과정이다.","지역사회 내 다양한 이해관계 조정의 역할이 있다.","지역 네트워크, 통합사례관리 등을 위한 조직 관리가 포함된다.","공익성, 공평성, 접근성 등의 가치를 추구한다.","정책과 클라이언트, 종사자 간 조직 목표에 대한 합의점을 찾기가 용이하다."],"a":5},{"id":"26-3-30","y":2026,"g":3,"n":30,"t":"조직운영·법인·이사회","f":"옳은 것 고르기","s":["서브퀄(SERVQUAL)의 내용으로 옳은 것은?"],"c":["즉응성: 기관, 장비 등이 질서정연하고 위생적임","공감성: 신속히 대응해서 즉시 서비스를 제공함","확신성: 시설과 작업 환경이 깨끗함","신뢰성: 서비스를 약속한 대로 정확하게 실행함","유형성: 고객 욕구에 관심을 갖고 이를 반영한 서비스를제공함"],"a":4},{"id":"26-3-31","y":2026,"g":3,"n":31,"t":"행정 개념·역사·환경","f":"옳은 것 고르기","s":["한국 사회복지행정의 역사에 관한 설명으로 옳은 것은?"],"c":["2000년에 국민기초생활보장제도와 장기요양보험제도가","2012년에 시ㆍ군ㆍ구 희망복지지원단이 구축되기 시작하였다.","2015년에 사회복지통합관리망(행복e음)이 개통되었다.","2020년에 지역사회보장협의체가 구성되었다.","2024년에 장애등급제가 폐지되었다."],"a":2},{"id":"26-3-32","y":2026,"g":3,"n":32,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"사례·제시문 판단","s":["다음에서 설명하고 있는 사회복지조직 인적자원관리에 해당하는 것은?","○ 조직 외부에서 잠재적 역량을 가진 사람을 찾는 과정","○ 조직 내부에서 역량이 있는 사람을 찾는 과정","○ 업무능력, 인성, 헌신 등을 고려하여 역량이 있는 사람을 찾는 과정"],"c":["직원의 이직관리","조직 오리엔테이션","교육과 훈련","직원 모집과 채용","경제적 보상"],"a":4},{"id":"26-3-33","y":2026,"g":3,"n":33,"t":"조직이론·조직구조","f":"옳지 않은 것","s":["과학적 관리론과 인간관계이론에 관한 설명으로 옳지 않은 것은?"],"c":["두 이론 모두 조직을 폐쇄체계로 설명한다.","인간관계이론은 조직의 생산성 향상이 아닌 직원 만족과보상을 가장 중요한 목표로 한다.","과학적 관리론은 업무의 표준화 및 분업화 등을 통해 직무능률을 높이고자 한다.","인간관계이론은 호손연구, 욕구계층 이론, XY 이론 등과관련된다.","과학적 관리론은 경제적 지원과 같은 동기부여 방식을활용한다."],"a":2},{"id":"26-3-34","y":2026,"g":3,"n":34,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"옳은 것 모두 고르기","s":["직원의 성과평가에 관한 내용으로 옳은 것을 모두 고른 것은?","ㄱ. 사회복지대상자 수급이력 통합","ㄴ. 인적자원개발을 위한 방향과 내용 확보","ㄷ. 직무수행이 조직 전략에 부합하는 지를 파악","ㄹ. 임금, 승진, 전환배치, 해고 등을 위한 정보 획득"],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"26-3-35","y":2026,"g":3,"n":35,"t":"마케팅·홍보·정보관리","f":"옳지 않은 것","s":["사회복지전달체계 구축의 원칙으로 옳지 않은 것은?"],"c":["통합성: 문제해결을 위한 서비스들을 원스톱 방식으로제공한다.","접근성: 서비스 이용자의 비용 부담은 고려하지 않는다.","포괄성: 복합적인 욕구들이 빠짐없이 충족될 수 있도록한다.","적절성: 서비스의 양과 질, 제공 기간이 적정하도록 한다.","연계성: 필요로 하는 서비스들이 파편화 되지 않도록 한다."],"a":2},{"id":"26-3-36","y":2026,"g":3,"n":36,"t":"기획·프로그램 기획·평가","f":"옳은 것 모두 고르기","s":["총체적 품질관리(TQM)에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 품질은 조직의 일차적인 목적이다.","ㄴ. 품질을 결정하는 것은 직원 모두이다.","ㄷ. 조직 내에서 변화는 지속적으로 이루어져야 한다.","ㄹ. 서비스의 질은 서비스 제공 이후 고려해야 한다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":2},{"id":"26-3-37","y":2026,"g":3,"n":37,"t":"리더십·동기부여·의사결정","f":"옳은 것 고르기","s":["사회복지사의 능력을 향상시키기 위한 수퍼바이저의 역할에 해당되지 않는 것은?"],"c":["비생산적인 부서를 해체ㆍ축소하여 신속한 조직 의사결정 촉진","조직의 자원을 효율적으로 이용할 수 있도록 작업 환경구축","필요한 지식과 기술을 제공하여 업무 능력 개선","심리적 안정과 동기부여를 제공하여 업무 만족감 증진","서비스를 효과적, 효율적으로 제공할 수 있도록 지원"],"a":1},{"id":"26-3-38","y":2026,"g":3,"n":38,"t":"기획·프로그램 기획·평가","f":"옳은 것 고르기","s":["기획에 관한 설명으로 옳은 것은?"],"c":["목표관리이론(MBO) 방식은 임계경로를 찾아 프로그램소요시간을 단축할 수 있도록 한다.","프로그램 평가기법(PERT)은 기간을 가로축, 과업을 세로축에 표기하여 시간별 과업을 제시한다.","간트도표(Gantt Chart)는 시간과는 무관한 여러가지 과업 진행을 나타낸다.","방침관리기획(PDCA)은 과정별 수행 상황 점검보다 결과를 중시한다.","논리모델은 투입-활동-산출-성과의 내용을 도식화하여보여준다."],"a":5},{"id":"26-3-39","y":2026,"g":3,"n":39,"t":"조직이론·조직구조","f":"옳은 것 고르기","s":["조직이론에 관한 설명으로 옳은 것은?"],"c":["관료제이론: 수평적 권한 구조의 특성을 가정한다.","목표관리이론(MBO): 목표는 장기적인 관점에서만 수립되어야 한다고 본다.","상황이론: 조직은 외부 환경의 영향을 받지 않고 내부적요인을 통해 발전할 수 있다고 본다.","체계이론: 유기적으로 상호작용하는 다양한 하위 체계로구성된다고 본다.","X이론: 조직관리에서 적절한 동기부여와 자율적 운영이중요하다고 본다."],"a":4},{"id":"26-3-40","y":2026,"g":3,"n":40,"t":"마케팅·홍보·정보관리","f":"옳은 것 모두 고르기","s":["마케팅 믹스를 설명하는 4P의 개념을 모두 고른 것은?","ㄱ. 계획(Plan)　　　　　　　　ㄴ. 가격(Price)","ㄷ. 문제(Problem)　　　　　　　ㄹ. 프로젝트(Project)","ㅁ. 성과(Performance)　　　　　ㅂ. 장소(Place)","ㅅ. 제품(Product)　　　　　　　ㅇ. 촉진(Promotion)"],"c":["ㄱ, ㅁ, ㅅ, ㅇ","ㄱ, ㅂ, ㅅ, ㅇ","ㄴ, ㄷ, ㅁ, ㅅ","ㄴ, ㄹ, ㅂ, ㅇ","ㄴ, ㅂ, ㅅ, ㅇ"],"a":5},{"id":"26-3-41","y":2026,"g":3,"n":41,"t":"조직운영·법인·이사회","f":"옳은 것 고르기","s":["사회복지법인의 예산집행에 관한 설명으로 옳은 것은?"],"c":["예산총계주의원칙을 따르지 않는다.","회계연도 개시 후 신규 지출 사유가 발생한 경우 법인이사회의 의결없이 집행한다.","추가경정예산은 확정된 날로부터 7일 이내에 시장ㆍ군수ㆍ구청장에게 제출한다.","법인 산하 시설의 예산집행은 시설 운영위원회의 보고없이 법인 이사회에서 의결한다.","준예산은 법인 이사회의 의결을 거쳐서 보건복지부에 제출한다."],"a":3},{"id":"26-3-42","y":2026,"g":3,"n":42,"t":"조직이론·조직구조","f":"빈칸 채우기","s":["조직구조 유형에 관한 설명이다. ( )에 들어갈 내용으로 옳은 것은?","( ㄱ ): 기존의 기능 조직과 프로젝트 조직을 결합하며 구성원의 능력을 최대한 활용하고자 하며, 두 조직의 장점을 살리기 위하여 설계된 유형이다.","( ㄴ ): 기존 조직이 수행하기 어려운 일들을 정해진 기일 동안만 해결하기 위해 임시 편성된 유형이다."],"c":["ㄱ: 매트릭스(matrix) 조직, ㄴ: 네트워크(network) 조직","ㄱ: 테스크포스(task force) 조직, ㄴ: 네트워크(network)조직","ㄱ: 위원회 조직, ㄴ: 매트릭스(matrix) 조직","ㄱ: 네트워크(network) 조직, ㄴ: 테스크포스(task force)조직","ㄱ: 매트릭스(matrix) 조직, ㄴ: 테스크포스(task force)조직"],"a":5},{"id":"26-3-43","y":2026,"g":3,"n":43,"t":"조직이론·조직구조","f":"옳지 않은 것","s":["조직구조의 특성 중 복잡성(complexity)에 관한 내용으로 옳지 않은 것은?"],"c":["조직 활동의 분화 정도를 의미한다.","수평적, 수직적 분화의 정도가 높을수록 복잡성이 높아진다.","조직부서가 지역으로 분산될수록 복잡성은 낮아진다.","수평적 분화는 동일한 위계 수준에서 과업이 분화되는형태이다.","수직적 분화는 조직의 계층 수와 관련이 높다."],"a":3},{"id":"26-3-44","y":2026,"g":3,"n":44,"t":"조직운영·법인·이사회","f":"옳지 않은 것","s":["사회복지시설 평가에 관한 내용으로 옳지 않은 것은?"],"c":["우수기관에 대해서는 인센티브가 부여된다.","시설 및 환경, 재정 및 조직 운영, 이용자의 권리 등의평가영역이 있다.","자체평가, 현장평가 등으로 진행된다.","｢사회복지사업법｣에 근거하여 4년 주기로 평가가 이루어진다.","운영의 효율화 및 서비스 질을 높이는 데 목적이 있다."],"a":4},{"id":"26-3-45","y":2026,"g":3,"n":45,"t":"행정 개념·역사·환경","f":"옳지 않은 것","s":["한국 사회복지행정 환경의 변화에 관한 설명으로 옳지 않은 것은?","다."],"c":["디지털 기반, 증거 기반 복지행정 역량이 강조되고 있다.","지역사회 생활권 중심의 생애주기별 돌봄정책이 확대되고 있다.","지역사회 통합돌봄(커뮤니티 케어) 시행에 따라 사회서비스가 대폭 축소되고 있다.","민관협력에 의한 통합사례관리의 중요성이 강조되고 있","서비스 이용자의 욕구별 통합서비스 제공을 위한 연계와협업이 확대되고 있다."],"a":3},{"id":"26-3-46","y":2026,"g":3,"n":46,"t":"리더십·동기부여·의사결정","f":"옳지 않은 것","s":["사회복지조직에서의 리더십과 수퍼비전의 공통점에 해당하지 않는 것은?"],"c":["수퍼바이저는 리더의 역할을 수행할 수 있다.","동료 간 수행이 가능하다.","교육 훈련의 기능이 있다.","직무수행 과정에서 이루어진다.","위계서열이 없는 조직에서만 수행된다."],"a":5},{"id":"26-3-47","y":2026,"g":3,"n":47,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"옳은 것 고르기","s":["비영리 사회복지조직에 관한 설명으로 옳은 것은?"],"c":["수입을 회원 또는 조직원들에게 배당한다.","조세감면의 혜택을 받을 수도 있다.","수익사업을 운영할 수 없다.","직원의 이익을 위해 조직되고 운영된다.","후원금으로만 운영된다."],"a":2},{"id":"26-3-48","y":2026,"g":3,"n":48,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"옳지 않은 것","s":["직무명세서와 직무기술서에 관한 설명으로 옳지 않은 것은?"],"c":["직무명세서와 직무기술서는 직무분석 이전에 작성한다.","직무기술서에는 작업수행을 표준화한 내용이 포함된다.","직무기술서에는 직무명칭, 직무장비, 직무환경에 관한 내용이 포함된다.","직무기술서에는 작업조건, 직무내용과 수행방법 등이 포함된다.","직무명세서와 직무기술서는 직원 신규채용 이전에 작성한다."],"a":1},{"id":"26-3-49","y":2026,"g":3,"n":49,"t":"마케팅·홍보·정보관리","f":"옳지 않은 것","s":["사회복지조직 마케팅의 필요성이 아닌 것은?"],"c":["효과성과 효율성을 달성할 책임성","고객만족을 이끌어내는 대상자 관리","대량소비와 이윤추구","잠재적 후원자 개발 및 재정 확보","서비스 개발을 위한 외부 환경분석"],"a":3},{"id":"26-3-50","y":2026,"g":3,"n":50,"t":"인사·직무·인적자원관리(슈퍼비전·소진·자원봉사)","f":"사례·제시문 판단","s":["다음 사례에서 적용하고 있는 이론은?","A 사회복지법인의 산하시설 B 기관장은 직원들의 직무만족을 높이고 이직률을 낮추기 위해 급여인상, 승진 등과 같은 보상이 진행될 때 형평성 확보를 강조하고 직원들이 이러한 과정을 어떻게 느끼고 있는지를 검토한다."],"c":["마틴(L. L. Martin)의 TQM이론","민츠버그(H. D. Mintzberg)의 조직구성이론","아담스(J. S. Adams)의 공정성이론","로이드(R. Lloyd)의 윤리경영이론","아덜퍼(C. P. Alderfer)의 ERG이론"],"a":3}],"data/q_cm.json":[{"id":"17-2-51","y":2017,"g":2,"n":51,"t":"지역사회복지 이론","f":"사례·제시문 판단","s":["다음 설명과 관련된 지역사회복지 이론은?","○ 다양한 집단과 조직이 이익을 표출함으로써 정책과정에 영향을 미칠 수 있다.","○ 지역사회복지정책은 이익집단들 간의 갈등과 타협의 산물로 간주된다.","○ 지역사회복지정책 결정은 이익집단들의 상대적 영향력 정도에 따라 달라진다."],"c":["구조기능론","교환이론","상호작용론","역할이론","다원주의이론"],"a":5},{"id":"17-2-52","y":2017,"g":2,"n":52,"t":"지역사회 개념·유형·기능","f":"옳지 않은 것","s":["지역사회기능의 비교 척도로 옳지 않은 것은?"],"c":["사회성: 지역사회의 사회적 분화 정도","서비스의 일치성: 지역사회 내 서비스 영역이 동일지역내에서 일치하는 정도","심리적 동일시: 지역주민들이 자기 지역을 중요한 준거집단으로 생각하는 정도","자치성: 지역사회가 타 지역에 의존하지 않는 정도","수평적 유형: 상이한 조직들의 구조적ㆍ기능적 관련 정도"],"a":1},{"id":"17-2-53","y":2017,"g":2,"n":53,"t":"지역사회 개념·유형·기능","f":"옳지 않은 것","s":["지역사회 개념에 관한 설명으로 옳지 않은 것은?"],"c":["지리적 지역사회는 일정한 지리적 공간을 공유하는 사람들의 집단을 의미한다.","기능적 지역사회는 구성원 공동의 이익과 이해관계를 같이하는 공동체를 의미한다.","지역사회는 사회적 상호작용과 연대성을 기초로 한다.","지역사회는 이익사회에서 공동사회로 발전한다.","가상공동체는 새로운 형태의 지역사회로 등장하고 있다."],"a":4},{"id":"17-2-54","y":2017,"g":2,"n":54,"t":"실천과정·욕구사정","f":"사례·제시문 판단","s":["다음 사례를 해결하기 위한 지역사회복지실천의 원칙은?","A사회복지사는 공동 사업 수행을 위해 특별추진회를 구성하였다. 그러나 주민들이 자유롭게 의견을 제시할 수 있는 기회를 제공하지 못한 채 사업추진을 진행하였다."],"c":["기관들 간의 역할 분담","효과적인 의사소통 개발과 유지","인간 욕구의 가변성 수용","집중과 분산 간의 균형","전문가의 역할 강화"],"a":2},{"id":"17-2-55","y":2017,"g":2,"n":55,"t":"지역사회복지 이론","f":"사례·제시문 판단","s":["다음 사례를 설명할 수 있는 지역사회복지 이론은?","사회복지관은 생존차원에서 외부 재정지원을 필요로 하지만 재정지원자의 요구를 무시하기 어렵다. 이런 상황에서 A사회복지관은 기관운영 재원을 마련하기 위해 다양한 후원기관을 발굴하였고, 이를 통해 직원들은 사업운영의 자율성이 확대되는 것을 경험하였다."],"c":["생태학이론","사회구성론","기능주의이론","권력의존이론","사회체계이론"],"a":4},{"id":"17-2-56","y":2017,"g":2,"n":56,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳지 않은 것","s":["우리나라 사회복지관에 관한 설명으로 옳지 않은 것은?"],"c":["사회복지관 사업이 지방이양사업으로 선정되어 재정지원방법이 변경되었다.","사회복지관 5대 사업이 사례관리기능, 서비스제공기능,지역조직화기능 등 3대 기능으로 재편되었다.","사회복지관 운영은 사회보장기본법에 근거한다.","사회복지관 평가제도가 실시되고 있다.","사회복지관의 운영원칙으로 지역성, 전문성, 책임성 등이있다."],"a":3},{"id":"17-2-57","y":2017,"g":2,"n":57,"t":"지역사회복지 역사·정책동향","f":"사례·제시문 판단","s":["영국의 지역사회보호 역사 중 다음의 특성 모두와 관련 있는 것은?","○ 사회서비스 부서 창설 제안","○ 대인사회서비스","○ 지역사회를 사회서비스 제공자로 인식","○ 서비스의 협력 및 통합"],"c":["시봄(Seebohm)보고서","하버트(Harbert)보고서","바클레이(Barclay)보고서","그리피스(Griffiths)보고서","베버리지(Beveridge)보고서"],"a":1},{"id":"17-2-58","y":2017,"g":2,"n":58,"t":"지역사회복지 역사·정책동향","f":"옳은 것 고르기","s":["조선시대 흉년으로 인한 이재민과 빈민을 구제한 국가기관은?"],"c":["향약","활인서","진휼청","기로소","동서대비원"],"a":3},{"id":"17-2-59","y":2017,"g":2,"n":59,"t":"실천모델(로스만·웨일과 갬블·테일러와 로버츠)","f":"사례·제시문 판단","s":["다음에서 설명하는 웨일과 갬블(Weil &Gamble)의 지역사회복지실천모델은?","○ 목표는 프로그램의 방향 또는 자원을 최대한 끌어 낼 수 있는 조직 기반","○ 변화의 표적체계는 선출된 공무원, 재단, 정부기관","○ 일차적 구성원은 특정 이슈에 이해관계가 있는 조직","○ 사회복지사의 역할은 중재자, 협상가, 대변인"],"c":["연합","정치적 권력강화","근린지역사회조직","기능적인 지역사회조직","프로그램의 개발과 조정"],"a":1},{"id":"17-2-60","y":2017,"g":2,"n":60,"t":"실천과정·욕구사정","f":"사례·제시문 판단","s":["다음에서 설명하는 지역사회의 욕구사정방법은?","○ 지역사회집단의 이해관계를 가장 잘 대표할 수 있는 참여자들을 선택한다.","○ 선택된 사람들은 한 곳에 모여 특정 문제에 대한 의견을 집단으로 토론한다.","○ 의사소통은 개방형 질문으로 진행한다."],"c":["델파이(Delphi) 기법","지역사회포럼(Community Forum)","민속학적(Ethnographic) 기법","명목집단(Nominal Group) 기법","초점집단(Focus Group) 기법"],"a":5},{"id":"17-2-61","y":2017,"g":2,"n":61,"t":"지역사회복지 역사·정책동향","f":"옳지 않은 것","s":["지역사회복지 운동에 해당하지 않는 것은?"],"c":["지역사회의 변화를 주도하는 조직운동","노동자 계층의 소득수준을 높이는 민중운동","지역사회복지의 확산과 발전을 위한 생활운동","복지권리의식과 시민의식을 배양하는 사회권 확립운동","지역사회 관련조직 간의 유기적인 협력이 이루어지는 연대운동"],"a":2},{"id":"17-2-62","y":2017,"g":2,"n":62,"t":"실천모델(로스만·웨일과 갬블·테일러와 로버츠)","f":"옳은 것 고르기","s":["로스만(J. Rothman)의 지역사회복지 실천모델 중 지역사회개발모델에 관한 설명으로 옳은 것은?"],"c":["사회복지사의 역할은 분석전문가이다.","수급자 역할의 개념을 소비자로 본다.","변화전술과 기법은 합의와 집단토의이다.","수급자 체계의 범위는 약물중독과 같은 특정 집단이다.","제도의 변화를 목표로 한다."],"a":3},{"id":"17-2-63","y":2017,"g":2,"n":63,"t":"실천기술·사회복지사 역할","f":"사례·제시문 판단","s":["지역사회복지실천에서 다음의 모든 활동과 관계되는 사회복지전담공무원의 역할은?","○ 잠재적 수급권자 파악","○ 자산조사 및 수급자 욕구조사","○ 서비스 및 시설입소 의뢰","○ 취업정보 제공 및 알선"],"c":["자문가","옹호자","조력자","상담가","자원연결자"],"a":5},{"id":"17-2-64","y":2017,"g":2,"n":64,"t":"지역사회복지 역사·정책동향","f":"옳은 것 모두 고르기","s":["지방자치가 지역사회복지에 미친 긍정적 영향을 모두 고른 것은?","ㄱ. 지역사회복지에 대한 주민의 주체적 참여기회 제공","ㄴ. 주민욕구 맞춤형 복지 프로그램 제공","ㄷ. 지방행정부서의 역할 강화","ㄹ. 비정부조직(NGO)의 자원 활용"],"c":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"17-2-65","y":2017,"g":2,"n":65,"t":"실천과정·욕구사정","f":"사례·제시문 판단","s":["지역사회복지실천 과정 중 다음 활동을 해야 하는 단계는?","○ 참여자 적응 촉진하기","○ 참여자 간 저항과 갈등 관리하기"],"c":["실행단계","자원계획단계","목적ㆍ목표설정단계","문제분석단계","평가단계"],"a":1},{"id":"17-2-66","y":2017,"g":2,"n":66,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳지 않은 것","s":["지역사회보장계획에 관한 설명으로 옳지 않은 것은"],"c":["사회보장급여의 사각지대 발굴 및 지원 방안을 모색한다.","지역사회보장 수요를 측정하고, 목표 및 추진전략을 수립한다.","주택, 고용, 문화를 제외한 보건과 의료영역에 초점을 둔다.","시ㆍ도 및 시ㆍ군ㆍ구에서 계획을 수립한다.","지역사회보장서비스의 수급조정과 안정적 공급을 도모한다."],"a":3},{"id":"17-2-67","y":2017,"g":2,"n":67,"t":"실천기술·사회복지사 역할","f":"옳지 않은 것","s":["사회복지사가 활용하는 조직화 기술에 해당하지 않는 것은?"],"c":["회의 기술","협상 기술","지역문제 이슈설정 기술","지역사회 지도자 발굴 기술","주민통제 기술"],"a":5},{"id":"17-2-68","y":2017,"g":2,"n":68,"t":"실천과정·욕구사정","f":"옳은 것 모두 고르기","s":["지역사회복지실천 과정에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 실행과정 점검단계(monitoring)에서는 실행과 결과를 추적함으로써 프로그램의 진척도를 파악한다.","ㄴ. 목적·목표설정단계에서는 갠트 차트(Gantt chart)를 활용하기도 한다.","ㄷ. 평가단계에서는 결과평가만 실시한다.","ㄹ. 욕구조사단계에서는 주요 정보제공자 인터뷰, 지역사회포럼 개최, 사회지표 등을 활용할 수 있다."],"c":["ㄱ, ㄴ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ"],"a":4},{"id":"17-2-69","y":2017,"g":2,"n":69,"t":"실천기술·사회복지사 역할","f":"옳지 않은 것","s":["지역사회복지 실천에서 사회복지사의 기술과 역할 간 연결로 옳지 않은 것은?"],"c":["네트워킹 기술 - 촉진자","연계 기술 - 옹호자","참여 기술 - 교육가","임파워먼트 기술 - 자원연결자","자원동원 기술 - 모금가"],"a":2},{"id":"17-2-70","y":2017,"g":2,"n":70,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳은 것 모두 고르기","s":["사회적 경제의 주체에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 마을기업은 지역공동체 이익을 추구하고 지역자원을 활용한다.","ㄴ. 사회적 기업은 사회적 목적을 추구하며, 영업활동을 하는 기업은 아니다.","ㄷ. 협동조합은 조합원의 권익 향상과 지역사회 공헌을 목적으로 한다.","ㄹ. 지역자활센터는 수급자와 차상위계층의 자활을 촉진하며, 사회복지법인만이 신청할 수 있다."],"c":["ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1},{"id":"17-2-71","y":2017,"g":2,"n":71,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳지 않은 것","s":["지역사회보장협의체에 관한 내용으로 옳지 않은 것은?"],"c":["네트워크 원리에 따른 운영","민간사회복지기관에 대한 감사 및 평가","수요자 중심의 지역사회보장서비스 제공기반 마련","지역사회 공동체 기능 회복과 사회자본 확대 지향","「사회보장급여의 이용ㆍ제공 및 수급권자 발굴에 관한법률」로 시행"],"a":2},{"id":"17-2-72","y":2017,"g":2,"n":72,"t":"지역사회복지 역사·정책동향","f":"옳지 않은 것","s":["최근 지역사회복지 동향으로 옳지 않은 것은?"],"c":["사회적 경제의 대두","통합사례관리의 강화","‘읍면동 복지허브화’ 사업 실시","5년 단위 지역사회복지계획 수립","「협동조합기본법」 시행으로 실천주체의 다양화"],"a":4},{"id":"17-2-73","y":2017,"g":2,"n":73,"t":"지역사회복지 이론","f":"옳지 않은 것","s":["사회자본이론 내용에 관한 설명으로 옳지 않은 것은?"],"c":["사회적 교환관계에 내재된 자본이다.","수평적 관계에서 형성된다.","자본의 총량은 고정적이다.","구성원 일부가 아닌 모두에게 공유된다.","호혜적 문화를 기초로 형성된다."],"a":3},{"id":"17-2-74","y":2017,"g":2,"n":74,"t":"실천기술·사회복지사 역할","f":"옳은 것 모두 고르기","s":["옹호(advocacy) 기술의 특성 중 옳은 것을 모두 고른 것은?","ㄱ. 사회정의를 지키고 유지하는 목적","ㄴ. 조직 구성원의 경제적 자립 강조","ㄷ. 표적 집단에 대한 강력한 영향력이나 압력 행사","ㄹ. 정당한 처우나 서비스를 받지 못하는 경우에 활용"],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"17-2-75","y":2017,"g":2,"n":75,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳은 것 고르기","s":["지역사회복지 추진기관에 관한 설명으로 옳은 것은?"],"c":["빈곤아동의 통합사례관리를 하는 드림스타트 사업은 민간영역의 사업이다.","희망복지지원단은 지역주민 맞춤형 통합서비스체계 구축을 목적으로 지역사회가 보유한 자원과 서비스를 총괄적으로 조정한다.","사회복지공동모금회의 지정기탁사업은 개별 사회복지 기관이나 시설에서 공모사업에 신청함으로써 배분된다.","지역사회아동의 돌봄서비스를 제공하는 지역아동센터는보호프로그램만 제공한다.","지역주민 맞춤형 가족지원서비스를 제공하는 건강가정지원센터는 읍ㆍ면ㆍ동에 설치되어 있다."],"a":2},{"id":"18-2-51","y":2018,"g":2,"n":51,"t":"지역사회 개념·유형·기능","f":"옳지 않은 것","s":["지역사회(community)에 관한 설명으로 옳지 않은 것은?"],"c":["기능적 지역사회는 이념, 사회계층, 직업유형 등을 중심으로 이루어진다.","지리적 지역사회는 이웃, 마을, 도시 등을 예로 들 수 있다.","던햄(A. Dunham)은 지역사회를 인구크기, 경제적 기반,행정구역, 사회적 특수성으로 유형화했다.","퇴니스(F. Tonnies)는 지역사회를 공동사회와 이익사회로 구분했다.","길버트와 스펙트(N. Gilbert &Specht)는 지역사회의 사회통합기능이 현대의 사회복지제도로 정착되었다고 했다."],"a":5},{"id":"18-2-52","y":2018,"g":2,"n":52,"t":"지역사회복지 역사·정책동향","f":"옳지 않은 것","s":["지역사회복지 관련 개념에 대한 설명으로 옳지 않은 것은?"],"c":["지역사회조직(community organization)은 전통적인 전문사회복지실천방법 중 하나이다.","지역사회개발(community development)은 지역사회 문제를 해결하기 위해 전문가에 의한 주도적 개입을 강조한다.","지역사회보호(community care)는 가정 또는 그와 유사한 지역사회 내의 환경에서 서비스를 제공하는 사회적 돌봄의 형태이다.","지역사회복지실천(community practice)은 지역사회를 대상으로 하는 사회복지실천을 포괄적으로 일컫는 개념이다.","재가보호(domiciliary care)는 대상자의 가정에서 서비스를 받는 것을 의미한다."],"a":2},{"id":"18-2-53","y":2018,"g":2,"n":53,"t":"지역사회복지 역사·정책동향","f":"옳지 않은 것","s":["우리나라 지역사회복지의 역사적 흐름에 관한 설명으로 옳지 않은 것은?"],"c":["1950년대 외국원조기관은 구호 및 생활보호 등에 기여하였다.","1970년대 사회복지관 국고보조금 지침이 마련되었다.","1980년대 민주화 운동으로 전개된 지역사회 생활권 보장을 위한 활동은 사회행동모델에서 비롯되었다.","1990년대 재가복지서비스의 확대가 이루어졌다.","2000년대 도입된 지역사회서비스투자사업의 사회서비스이용권 비용 지급ㆍ정산은 사회보장 정보원이 담당한다."],"a":2},{"id":"18-2-54","y":2018,"g":2,"n":54,"t":"지역사회복지 역사·정책동향","f":"옳은 것 고르기","s":["미국 지역사회복지의 역사적 특징으로 옳은 것은?"],"c":["대공황 이전에는 공공이 지역사회복지실천의 주요 전달체계를 담당하였다.","케네디와 존슨 행정부의 ‘빈곤과의 전쟁’은 사회복지의지방정부 역할과 책임을 강조하였다.","1970년대 인종차별 금지와 반전(反戰)운동은 지역사회조직사업을 촉진하였다.","1990년대 ‘복지개혁(Welfare Reform)'은 풀뿌리 지역사회조직활동을 강조하였다.","오바마 행정부는 연방정부 중심의 지역사회복지 프로그램 평가에 주안점을 두었다."],"a":3},{"id":"18-2-55","y":2018,"g":2,"n":55,"t":"지역사회복지 역사·정책동향","f":"옳은 것 모두 고르기","s":["영국의 그리피스 보고서(Griffiths Report, 1988)에서 강조하고 있는 지역사회보호에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 지역사회보호를 위한 권한과 재정을 지방정부에 이양할 것을 주장하였다.","ㄴ. 지역사회보호를 위한 지방정부의 서비스 공급자 역할을 강조하였다.","ㄷ. 서비스의 적절성 확보를 위한 케어 매니지먼트(care management)를 강조하였다.","ㄹ. 지역사회보호 실천주체 다양화를 추구하였다."],"c":["ㄱ,ㄴ","ㄱ,ㄹ","ㄴ,ㄷ","ㄱ,ㄷ,ㄹ","ㄴ,ㄷ,ㄹ"],"a":4},{"id":"18-2-56","y":2018,"g":2,"n":56,"t":"지역사회복지 역사·정책동향","f":"옳지 않은 것","s":["다음을 설명하는 지역사회복지 이론과 관계없는 것은?","독거노인과 지역대학생 1:1 관계망 프로그램을 통한 지역사회 노인 자살률 감소 및 노인 문제 관심도 향상"],"c":["진화","참여","호혜성","네트워크","교환"],"a":1},{"id":"18-2-57","y":2018,"g":2,"n":57,"t":"지역사회복지 이론","f":"사례·제시문 판단","s":["다음은 도농복합지역 A시의 최근 10년간 사회지표 분석결과이다. 이를 설명하는 이론은?","원도심 지역은 공동화가 이루어지면서 노인가구 및 1인 가구 증가율이 급상승한 반면, 농촌지역은 공공기관 이전으로 인구의 평균연령이 낮아져 A시가 계층화되고 있는 것으로 나타났다."],"c":["생태체계이론","사회연결망이론","사회구성론","사회교환이론","다원주의이론"],"a":1},{"id":"18-2-58","y":2018,"g":2,"n":58,"t":"실천모델(로스만·웨일과 갬블·테일러와 로버츠)","f":"옳은 것 모두 고르기","s":["웨일과 갬블(M. Weil &D. Gamble)의 지역사회복지실천모델에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 사회운동모델: 성취목표는 특정 대상집단 또는 이슈 관련 사회정의를 위한 행동이다.","ㄴ. 근린지역사회조직모델: 사회복지사의 역할은 정보전달자, 관리자 등이다.","ㄷ. 사회계획모델: 관심영역은 특정 욕구를 가진 대상자를 위한 서비스 개발이다.","ㄹ. 정치·사회행동모델: 일차적 구성원은 선출된 공무원, 사회복지기관 등이다."],"c":["ㄱ","ㄱ,ㄴ","ㄴ,ㄷ","ㄷ,ㄹ","ㄱ,ㄷ,ㄹ"],"a":1},{"id":"18-2-59","y":2018,"g":2,"n":59,"t":"실천모델(로스만·웨일과 갬블·테일러와 로버츠)","f":"옳지 않은 것","s":["로스만(J. Rothman)의 지역사회개발모델에 관한 설명으로 옳지 않은 것은?"],"c":["지역사회 주민의 광범위한 참여를 전제한다.","조력자, 촉매자, 조정자로서의 사회복지사 역할을 강조한다.","과업의 성취보다는 과정중심 목표에 중점을 둔다.","변화의 매개체로 과업지향적인 소집단을 활용한다.","변화전략은 표적대상에 대한 조치를 취할 수 있도록 주민을 동원하는 것이다."],"a":5},{"id":"18-2-60","y":2018,"g":2,"n":60,"t":"실천모델(로스만·웨일과 갬블·테일러와 로버츠)","f":"사례·제시문 판단","s":["다음 설명에 해당하는 테일러와 로버츠(S. Taylor &R. Roverts)의 지역사회복지실천모델은?","- 갈등이론과 다원주의 사회에서의 다양한 이익 집단의 경쟁원리에 기초한다.","- 시민의 참여를 보장하고 극대화하는데 중요한 목적이 있다.","- 전문가들은 교육자, 자원개발자, 운동가의 역할을 한다."],"c":["프로그램 개발 및 조정","계획","지역사회연계","지역사회개발","정치적 권력강화"],"a":5},{"id":"18-2-61","y":2018,"g":2,"n":61,"t":"실천기술·사회복지사 역할","f":"옳지 않은 것","s":["다음 상황에 해당하는 사회복지사의 실천기술 내용이 아닌 것은?","마을 축제 개최를 위해 사회복지사는 지역주민을 조직화하며 주민 스스로 계획, 홍보 및 진행을 하게 하였다."],"c":["주민의 자발적 참여 유도","주민 역량 강화","지역사회 특성 반영","취약계층 권리 대변","주민들 갈등 시 중재"],"a":4},{"id":"18-2-62","y":2018,"g":2,"n":62,"t":"실천기술·사회복지사 역할","f":"사례·제시문 판단","s":["밑줄 친 사회복지사의 핵심 역할로 옳은 것은?","A지역은 공장지대에 위치해 있어 학교의 대기오염도가 매우 높게 나타났다. 그래서 사회복지사는 <u>학생들의 건강권 확보를 위한 조례 제정 입법활동을 하였다.<\/u>"],"c":["계획가","옹호자","치료자","교육자","행정가"],"a":2},{"id":"18-2-63","y":2018,"g":2,"n":63,"t":"실천과정·욕구사정","f":"사례·제시문 판단","s":["다음 기관의 사회복지사가 자원개발을 위해 활용한 기술은?","최근 개관한 사회복지관은 바자회를 개최하는 과정에서 지역의 다양한 후원단체를 발굴하고, 자원봉사자를 모집하였다."],"c":["근본적인 제도의 변화 추구","지역사회 실정에 맞는 교육 진행","기관의 신뢰성 형성ㆍ유지를 위한 노력","주민들의 지도력 강화 지원","정치적 지지 기반의 구축"],"a":3},{"id":"18-2-64","y":2018,"g":2,"n":64,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"사례·제시문 판단","s":["다음 사회복지전담공무원의 핵심 역할은?","A씨는 최근 건강이 나빠져서 일을 할 수 없게 되자 주민센터(행정복지센터)를 찾아갔다. 사회복지전담공무원은 지원 가능한 급여와 서비스 등을 알려주고, A씨는 이를 이용하였다."],"c":["조직가","교육자","옹호자","협상가","자원연결자"],"a":5},{"id":"18-2-65","y":2018,"g":2,"n":65,"t":"실천과정·욕구사정","f":"사례·제시문 판단","s":["지역사회복지실천에서 이루어지는 초기 욕구사정에 관한 설","명으로 옳지 않은 것은?"],"c":["욕구의 상대적 중요성을 확인하는 목적이 있다.","지역사회복지 실천을 위한 성과평가의 의미를 갖는다.","욕구사정에 대한 다양한 방법론을 이해해야 한다.","문제확인과 해결의 우선순위에 주안점을 둔다.","욕구사정의 초점은 서비스 및 접근가능성이 포함된다."],"a":2},{"id":"18-2-66","y":2018,"g":2,"n":66,"t":"실천과정·욕구사정","f":"사례·제시문 판단","s":["다음 설명하는 욕구사정 자료수집 방법으로 옳은 것은?","- 욕구의 배경이나 결정과정보다 욕구내용 결정에 초점을 둔다.","- 모든 참여자가 직접 만나서 욕구에 대한 우선순위를 결정한다.","- 욕구순위에 대한 합의의 과정이 반복시행을 거쳐 이루어질 수 있다."],"c":["초점집단기법","텔파이기법","지역사회포럼","명목집단기법","민속학적 조사방법"],"a":4},{"id":"18-2-67","y":2018,"g":2,"n":67,"t":"실천과정·욕구사정","f":"옳지 않은 것","s":["지역사회복지 실천 과정과 실행내용의 연결로 옳지 않은 것은?"],"c":["문제와 표적 집단의 이해: 지역사회 상황 확인과 인구집단에 대한 이해","지역사회 문제 분석: 인과관계에 근거한 개입가설의 개발","개입전략 개발: 개입목적과 목표의 설정","지역사회 개입: 프로그램 기획과 실행","평가: 효율성 및 효과성 평가"],"a":2},{"id":"18-2-68","y":2018,"g":2,"n":68,"t":"지역사회복지 역사·정책동향","f":"옳지 않은 것","s":["지역사회 복지기관에 관한 설명으로 옳지 않은 것은?"],"c":["지역자활센터에서는 조건부수급자만을 대상으로 자활의욕 고취를 위한 사업을 추진한다.","사회복지관은 경제적 지원, 일상생활 지원 등의 지역사회보호 사업을 수행한다.","자원봉사센터는 자원봉사를 필요로 하는 기관과 단체에자원봉사자를 공급한다.","자활기업은 저소득층의 탈빈곤을 위한 자활사업을 운영한다.","사회복지공동모금회는 취약한 사회복지현장의 역량강화를 위해 주제를 정하여 사업을 배분 하기도 한다."],"a":1},{"id":"18-2-69","y":2018,"g":2,"n":69,"t":"지역사회복지 역사·정책동향","f":"사례·제시문 판단","s":["다음 사업을 모두 수행하는 지역사회 복지기관은?","- 주민복지증진사업, 주민조직화 사업","- 사례 발굴 및 개입","- 아동·청소년 사회교육, 문화복지사업"],"c":["사회복지관","지역사회보장협의체","지역자활센터","지역아동센터","자원봉사센터"],"a":1},{"id":"18-2-70","y":2018,"g":2,"n":70,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳지 않은 것","s":["지역사회복지 영역에서 사회적경제에 관한 설명으로 옳지 않은 것은?"],"c":["사회적 가치 실현을 중요시한다.","사회적기업은 사회적 일자리 창출을 목적으로 한다.","사회적기업은 이윤창출이 제한된다.","마을기업은 지역공동체에 기반하여 활동한다.","협동조합은 조합원 자격자 5인 이상으로 설립한다."],"a":3},{"id":"18-2-71","y":2018,"g":2,"n":71,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳지 않은 것","s":["지역사회보장계획에 관한 설명으로 옳지 않은 것은?"],"c":["지역사회보장서비스의 수급조정과 안정적 공급을 위해필요하다.","시ㆍ군ㆍ구 및 시ㆍ도는 4년마다 지역사회보장계획을 수립해야 한다.","시ㆍ군ㆍ구 지역사회보장계획은 시ㆍ군ㆍ구 의회의 심의와 지역사회보장협의체의 보고를 거쳐야 한다.","「사회보장급여의 이용ㆍ제공 및 수급권자 발굴에 관한법률」에 근거한다.","시ㆍ군ㆍ구 지역사회보장계획은 시행연도의 전년도 9월30일까지 시ㆍ도지사에게 제출되어야 한다."],"a":3},{"id":"18-2-72","y":2018,"g":2,"n":72,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳지 않은 것","s":["지역사회보장협의체에 관한 설명으로 옳지 않은 것은?"],"c":["사회보장 관련 서비스 제공 기관과의 연계ㆍ협력을 강화할 목적으로 운영된다.","공공과 민간의 적극적이고 자발적인 참여가 전제되어야한다.","2015년 지역사회복지협의체가 지역사회보장협의체로 명칭이 변경되었다.","실무협의체는 시ㆍ군ㆍ구의 사회보장급여 제공에 관한사항을 심의ㆍ자문한다.","사회보장 관련 기관ㆍ법인ㆍ단체ㆍ시설 간 연계와 협력강화를 위해 실무분과를 운영한다."],"a":4},{"id":"18-2-73","y":2018,"g":2,"n":73,"t":"실천과정·욕구사정","f":"옳은 것 고르기","s":["아른스테인(S. Arnstein)의 주민참여 수준 8단계 중 주민들이 특정계획에 관해서 우월한 결정권을 행사하고 집행단계에서도 강력한 권한을 행사하는 단계는?"],"c":["조작(manipulation)","주민회유(placation)","협동관계(partnership)","권한위임(delegated power)","주민통제(citizen control)"],"a":4},{"id":"18-2-74","y":2018,"g":2,"n":74,"t":"현장·제도(사회복지관·협의체·보장계획·사회적경제 등)","f":"옳은 것 모두 고르기","s":["우리나라 지역사회복지 환경변화와 과제에 관한 다음 설명 중 옳은 것을 모두 고른 것은?","ㄱ. 지방자치단체는 지역별 특성에 맞는 사회적 기업 지원시책을 수립·시행해야 한다.","ㄴ. 탈시설 경향에 따라 지역사회 중심의 복지체계 구축이 중요해지고 있다.","ㄷ. 읍면동 복지허브화로 지역사회복지 네트워크가 약화되었다."],"c":["ㄱ","ㄴ","ㄱ,ㄴ","ㄴ,ㄷ","ㄱ,ㄴ,ㄷ"],"a":3},{"id":"18-2-75","y":2018,"g":2,"n":75,"t":"지역사회복지 역사·정책동향","f":"옳은 것 고르기","s":["최근 우리나라의 지역사회복지 동향에 관한 내용으로 옳은 것은?"],"c":["중앙정부 중심의 지역사회복지서비스 전달체계 구축","복지재정 분권화로 인한 지역간 사회복지 불균형","다양한 서비스 공급 주체의 참여 축소","서비스 이용자의 권리 제한","지역사회 복지네트워크 중요성 감소"],"a":2},{"id":"19-2-51","y":2019,"g":2,"n":51,"t":"지역사회 개념·유형·기능","f":"옳은 것 고르기","s":["힐러리(G. A. Hillery)가 제시한 지역사회의 기본요소로 옳게 묶인 것은?"],"c":["지역주민, 사회계층, 전통적 가치체계","사회적 상호작용, 공동의 유대감, 지리적 영역의 공유","경제, 종교, 교육, 보건과 사회복지","역사적 유산의 공유, 지역 거주, 공동생활양식","사회적 유사성, 공동체 의식, 전통과 관습"],"a":2},{"id":"19-2-52","y":2019,"g":2,"n":52,"t":"지역사회복지 역사·정책동향","f":"순서 나열","s":["영
