족에 해당한다.","근로자의 소득으로 생계의 전부를 유지하고 있던 유족으로서 학업으로 주민등록을 달리하였거나 동거하지 않았던 사람은 유족에 해당되지 않는다.","유족보상연금 수급 권리는 배우자ㆍ자녀ㆍ부모ㆍ손자녀ㆍ조부모 및 형제자매의 순서로 한다."],"a":4},{"id":"23-3-70","y":2023,"g":3,"n":70,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 고르기","s":["정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률상 정신질환자의 보호의무자가 될 수 있는 사람은?"],"c":["후견인","파산선고를 받고 복권되지 아니한 사람","해당 정신질환자를 상대로 소송 중인 사람","행방불명자","미성년자"],"a":1},{"id":"23-3-71","y":2023,"g":3,"n":71,"t":"가족·여성 관련법(한부모·다문화·가정폭력·성폭력 등)","f":"사례·제시문 판단","s":["다음이 설명하는 한부모가족지원법상의 한부모가족복지시설은?","배우자(사실혼 관계에 있는 사람을 포함한다)가 있으나 배우자의 물리적·정신적 학대로 아동의 건전한 양육이나 모의 건강에 지장을 초래할 우려가 있을 경우 일시적 또는 일정 기간 동안 모와 아동 또는 모에게 주거와 생계를 지원하는 시설"],"c":["일시지원복지시설","부자가족복지시설","모자가족복지시설","한부모가족복지상담소","미혼모자가족복지시설"],"a":1},{"id":"23-3-72","y":2023,"g":3,"n":72,"t":"국민건강보험법·노인장기요양보험법","f":"옳지 않은 것","s":["의족 파손에 따른 요양급여 청구사건 대법원 판례(2012두20991)의 내용으로 옳지 않은 것은?","(개요) 의족을 착용하고 아파트 경비원으로 근무하던 갑이 제설작업 중 넘어져 의족이 파손되는 등의 재해를 입고 요양급여를 신청하였으나, 근로복지공단이 '의족 파손'은 요양급여 기준에 해당하지 않는다는 이유로 요양불승인처분을 한 사안에 대하여 요양불승인처분 취소"],"c":["업무상 재해로 인한 부상의 대상인 신체를 반드시 생래적 신체에 한정할 필요는 없다.","의족 파손을 업무상 재해로 보지 않을 경우 장애인 근로자에 대한 보상과 재활에 상당한 공백을 초래한다.","신체 탈부착 여부를 기준으로 요양급여 대상을 가르는것이 합리적이라 할 수 없다.","의족 파손을 업무상 재해에서 제외한다면, 사업자들로하여금 의족 착용 장애인들의 고용을 소극적으로 만들 우려가 있다.","업무상의 사유로 근로자가 장착한 의족이 파손된 경우는｢산업재해보상보험법｣상 요양급여의 대상인 근로자의 부상에 포함되지 않는다."],"a":5},{"id":"23-3-73","y":2023,"g":3,"n":73,"t":"국민건강보험법·노인장기요양보험법","f":"사례·제시문 판단","s":["다음의 역할을 하는 노인장기요양보험법상 기구는?","- 장기요양요원의 권리 침해에 관한 상담 및 지원","- 장기요양요원의 역량강화를 위한 교육지원","- 장기요양요원에 대한 건강검진 등 건강관리를 위한 사업"],"c":["장기요양위원회","등급판정위원회","장기요양심사위원회","장기요양요원지원센터","공표심의위원회"],"a":4},{"id":"23-3-74","y":2023,"g":3,"n":74,"t":"사회복지사업법","f":"사례·제시문 판단","s":["다음과 같은 역할을 하는 사회복지시설은?","- 아동의 안전한 보호","- 안전하고 균형 있는 급식 및 간식의 제공","- 등·하교 전후, 야간 또는 긴급상황 발생 시 돌봄서비스 제공","- 체험활동 등 교육·문화·예술·체육 프로그램의 연계·제공","- 돌봄 상담, 관련 정보의 제공 및 서비스의 연계"],"c":["장애인 지역사회재활시설","다함께돌봄센터","아동보호전문기관","지역장애아동지원센터","노인공동생활가정"],"a":2},{"id":"23-3-75","y":2023,"g":3,"n":75,"t":"아동복지법·영유아보육법·청소년복지지원법","f":"옳은 것 모두 고르기","s":["아동복지법상 보호가 필요한 아동을 발견하고 양육환경을 개선할 수 있도록 지원하기 위하여 이용할 수 있는 자료와 정보에 해당하는 것을 모두 고른 것은?","ㄱ. 「국민건강보험법」제41조제1항 각 호에 따른 요양급여 실시 기록","ㄴ. 「국민건강보험법」제52조에 따른 영유아건강검진 실시 기록","ㄷ. 「초·중등교육법」제25조에 따른 학교생활기록 정보","ㄹ. 「전기사업법」제14조에 따른 단전 가구정보"],"c":["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"24-3-51","y":2024,"g":3,"n":51,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"빈칸 채우기","s":["헌법 제10조의 일부이다. ( )에 들어갈 내용으로 옳은 것은?","모든 국민은 인간으로서의 존엄과 가치를 가지며, (　　)을 추구할 권리를 가진다."],"c":["자유권","생존권","인간다운 생활","행복","인권"],"a":4},{"id":"24-3-52","y":2024,"g":3,"n":52,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 고르기","s":["법률의 제정 연도가 가장 최근인 것은?"],"c":["아동복지법","노인복지법","장애인복지법","한부모가족지원법","다문화가족지원법"],"a":5},{"id":"24-3-53","y":2024,"g":3,"n":53,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 고르기","s":["우리나라 사회복지법의 법원에 관한 설명으로 옳은 것은?"],"c":["관습법은 사회복지법의 법원이 될 수 없다.","법률은 정부의 의결을 거쳐 제정ㆍ공포된 법을 말한다.","지방자치단체의 조례는 성문법원이다.","명령은 행정기관이 제정한 법규로 국회의 의결을 거쳐야한다.","일반적으로 승인된 국제법규는 사회복지법의 법원에 포함되지 않는다."],"a":3},{"id":"24-3-54","y":2024,"g":3,"n":54,"t":"사회복지사업법","f":"옳은 것 모두 고르기","s":["사회복지사업법상 사회복지사업 관련 법률을 모두 고른 것은?","ㄱ. 아동복지법　　　　　　　ㄴ. 장애인복지법","ㄷ. 국민기초생활 보장법　　ㄹ. 기초연금법"],"c":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"24-3-55","y":2024,"g":3,"n":55,"t":"사회복지사업법","f":"옳지 않은 것","s":["사회복지사업법상 사회복지법인(이하 '법인'으로 한다)에 관한 설명으로 옳지 않은 것은?"],"c":["정관에는 회의에 관한 사항이 포함되어야 한다.","법인은 사회복지사업의 운영에 필요한 재산을 소유하여야 한다.","감사 중에 결원이 생겼을 때 3개월 이내에 보충하여야한다.","법인은 임원을 임면하는 경우에 지체 없이 시ㆍ도지사에게 보고하여야 한다.","법인이 목적사업 외의 사업을 하였을 때 설립허가가 취소될 수 있다."],"a":3},{"id":"24-3-56","y":2024,"g":3,"n":56,"t":"사회복지사업법","f":"옳지 않은 것","s":["사회복지사업법상 사회복지시설(이하 '시설'이라 한다)에 관한 설명으로 옳지 않은 것은?"],"c":["사회복지관은 직업 및 취업 알선이 필요한 지역주민에게사회복지서비스를 우선 제공하여야 한다.","지방자치단체는 시설의 책임보험 가입에 드는 비용의 전부를 보조할 수 없다.","국가는 시설을 운영할 수 있다.","시설 종사자의 근무환경 개선에 관한 사항은 운영위원회에서 심의한다.","회계부정이 발견되었을 때 보건복지부장관은 시설의 폐쇄를 명할 수 있다."],"a":2},{"id":"24-3-57","y":2024,"g":3,"n":57,"t":"사회복지사업법","f":"옳은 것 고르기","s":["사회복지사업법의 내용으로 옳은 것은?"],"c":["사회복지서비스는 현금과 현물로 제공하는 것을 원칙으로 한다.","국가는 사회복지 자원봉사활동을 지원ㆍ육성하기 위하여자원봉사활동의 홍보 및 교육을 실시하여야 한다.","사회복지에 관한 조사ㆍ연구 및 정책 건의를 위하여 한국사회복지사협회를 둔다.","사회복지사 자격증을 다른 사람에게 빌려주거나 빌린 사람은 10년 이하의 징역 또는 1억원 이하의 벌금에 처한다.","시ㆍ도지사는 사회복지에 관한 전문지식과 기술을 가진사람에게 사회복지사 자격증을 발급할 수 있다."],"a":2},{"id":"24-3-58","y":2024,"g":3,"n":58,"t":"사회보장기본법·사회보장급여법","f":"옳지 않은 것","s":["사회보장기본법상 사회보장에 관한 국민의 권리에 대한 설명으로 옳지 않은 것을 모두 고른 것은?","ㄱ. 지방자치단체는 최저보장수준과 최저임금을 매년 공표하여야 한다.","ㄴ. 사회보장수급권은 구두로 통지하며 포기할 수 있다.","ㄷ. 사회보장수급권이 제한되는 경우에는 제한하는 목적에 필요한 최소한의 범위에 그쳐야 한다.","ㄹ. 사회보장수급권을 포기하는 것이 다른 사람에게 피해를 주게 되는 경우 사회보장수급권을 포기할 수 없다."],"c":["ㄱ, ㄴ","ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1},{"id":"24-3-59","y":2024,"g":3,"n":59,"t":"사회보장기본법·사회보장급여법","f":"옳은 것 고르기","s":["사회보장기본법상 사회보장제도의 운영에 관한 설명으로 옳은 것은?"],"c":["사회보험은 국가와 지방자치단체의 책임으로 시행한다.","국가는 사회보장 관계 법령에서 정하는 바에 따라 사회보장에 관한 상담에 응하여야 한다.","일정 소득 수준 이하의 국민에 대한 사회서비스에 드는비용은 수익자 부담을 원칙으로 한다.","통계청장은 제출된 사회보장통계를 종합하여 사회보장위원회에 제출하여야 한다.","지방자치단체의 장은 사회보장제도를 신설할 경우 보건복지부장관과 합의하여야 한다."],"a":2},{"id":"24-3-60","y":2024,"g":3,"n":60,"t":"사회보장기본법·사회보장급여법","f":"옳지 않은 것","s":["사회보장기본법의 내용으로 옳지 않은 것은?"],"c":["사회보장위원회의 위원 임기는 3년으로 한다.","국가와 지방자치단체는 평생사회안전망을 구축하여야 한다.","사회보장 기본계획에는 사회보장 관련 기금 운용방안이포함되어야 한다.","사회보장제도를 운영하는 자는 불법행위의 책임이 있는자에 대하여 구상권을 행사할 수 있다.","사회보장에 관한 다른 법률을 개정하는 경우에는 이 법에 부합되도록 하여야 한다."],"a":1},{"id":"24-3-61","y":2024,"g":3,"n":61,"t":"사회보장기본법·사회보장급여법","f":"옳지 않은 것","s":["사회보장급여의 이용ㆍ제공 및 수급권자 발굴에 관한 법률의 내용으로 옳지 않은 것은?"],"c":["보장기관은 지역의 사회보장 수준이 균등하게 실현될 수있도록 노력하여야 한다.","｢청소년 기본법｣에 따른 청소년상담사는 지원대상자의사회보장급여를 신청할 수 있다.","보장기관의 장은 위기가구를 발굴하기 위하여 노력하여야 한다.","정부는 한국사회보장정보원의 설립ㆍ운영에 필요한 비용을 출연할 수 없다.","특별자치시 지역사회보장계획은 사회보장급여 담당 인력의 양성 및 전문성 제고 방안을 포함하여야 한다."],"a":4},{"id":"24-3-62","y":2024,"g":3,"n":62,"t":"사회보장기본법·사회보장급여법","f":"옳은 것 고르기","s":["사회보장급여의 이용ㆍ제공 및 수급권자 발굴에 관한 법률상 지원대상자의 발굴에 관한 설명으로 옳은 것은?"],"c":["“지원대상자”란 사회보장급여를 제공받을 권리를 가진사람을 말한다.","사회복지시설의 장은 사회보장급여의 제공을 직권으로신청할 수 있다.","국민건강보험공단 이사장은 보험료를 7개월 이상 체납한사람의 가구정보를 사회보장정보시스템을 통하여 처리할 수 있다.","시ㆍ도지사는 지원대상자에 대한 발굴조사를 1년마다 정기적으로 실시하여야 한다.","보장기관의 장은 지원대상자를 발굴하기 위하여 사회보장급여의 제공규모에 대한 정보의 제공과 홍보에 노력하여야 한다."],"a":5},{"id":"24-3-63","y":2024,"g":3,"n":63,"t":"국민기초생활보장법","f":"옳은 것 고르기","s":["국민기초생활 보장법상 급여의 종류와 방법에 관한 설명으로 옳은 것은?"],"c":["생계급여는 물품으로는 지급할 수 없다.","생계급여는 수급자에게 주거 안정에 필요한 임차료, 수선유지비, 그 밖의 수급품을 지급하는 것으로 한다.","장제급여는 자활급여를 받는 수급자가 사망한 경우 장제조치를 하는 것으로 한다.","자활급여는 관련 비영리법인에 위탁하여 실시할 수 있다.","교육급여는 보건복지부장관의 소관으로 한다."],"a":4},{"id":"24-3-64","y":2024,"g":3,"n":64,"t":"국민기초생활보장법","f":"옳지 않은 것","s":["국민기초생활 보장법상 지역자활센터의 사업이 아닌 것은?"],"c":["자활을 위한 사업자금 융자","자활을 위한 정보제공, 상담, 직업교육 및 취업알선","생업을 위한 자금융자 알선","자활기업의 설립ㆍ운영 지원","자영창업 지원 및 기술ㆍ경영 지도"],"a":1},{"id":"24-3-65","y":2024,"g":3,"n":65,"t":"의료급여법·긴급복지지원법·기초연금법","f":"옳은 것 고르기","s":["의료급여법의 내용으로 옳은 것은?"],"c":["시ㆍ도지사는 의료급여증을 발급하여야 한다.","급여비용의 재원을 충당하기 위하여 보건복지부에 의료급여기금을 설치한다.","보건복지부에 두는 의료급여심의위원회는 의료급여의 수가에 관한 사항을 심의한다.","시ㆍ도지사는 상환받은 대지급금을 의료급여기금에 납입하여야 한다.","수급권자가 의료급여를 거부한 경우 시ㆍ도지사는 의료급여를 중지해야 한다."],"a":3},{"id":"24-3-66","y":2024,"g":3,"n":66,"t":"의료급여법·긴급복지지원법·기초연금법","f":"옳은 것 모두 고르기","s":["기초연금법의 내용으로 옳은 것을 모두 고른 것은?","ㄱ. 본인과 그 배우자가 모두 기초연금 수급권자인 경우에는 각각의 기초연금액에서 기초연금액의 100분의 20에 해당하는 금액을 감액한다.","ㄴ. 기초연금 수급권자의 권리는 3년간 행사하지 아니하면 시효의 완성으로 소멸한다.","ㄷ. 기초연금 수급자가 대통령령으로 정하는 바에 따라 사망한 것으로 추정되는 경우 수급권을 상실한다."],"c":["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":1},{"id":"24-3-67","y":2024,"g":3,"n":67,"t":"국민건강보험법·노인장기요양보험법","f":"옳지 않은 것","s":["국민건강보험법의 내용으로 옳지 않은 것은?"],"c":["｢의료급여법｣에 따라 의료급여를 받는 사람은 건강보험의 가입자가 될 수 없다.","보건복지부장관은 국민건강보험종합계획에 따라 연도별시행계획에 따른 추진실적을 매년 평가하여야 한다.","건강보험 가입자는 국내에 거주하지 아니하게 된 날에그 자격을 잃는다.","건강보험정책에 관한 사항을 심의ㆍ의결하기 위하여 보건복지부장관 소속으로 건강보험정책심의위원회를 둔다.","건강보험 지역가입자는 직장가입자와 그 피부양자를 제외한 가입자를 말한다."],"a":3},{"id":"24-3-68","y":2024,"g":3,"n":68,"t":"국민건강보험법·노인장기요양보험법","f":"옳지 않은 것","s":["노인장기요양보험법의 내용으로 옳지 않은 것은?"],"c":["“노인등”이란 65세 이상의 노인 또는 65세 미만의 자로서 치매ㆍ뇌혈관성질환 등 대통령령으로 정하는 노인성 질병을 가진 자를 말한다.","장기요양급여는 노인등이 가족과 함께 생활하면서 가정에서 장기요양을 받는 재가급여를 우선적으로 제공하여야 한다.","장기요양보험사업은 보건복지부장관이 관장한다.","장기요양급여를 받고 있는 수급자는 장기요양등급의 내용을 변경하여 장기요양급여를 받고자 하는 경우 국민건강보험공단에 변경신청을 하여야 한다.","재가급여에는 방문요양, 방문목욕, 특별현금급여가 포함된다."],"a":5},{"id":"24-3-69","y":2024,"g":3,"n":69,"t":"국민연금법","f":"옳은 것 고르기","s":["국민연금법의 내용으로 옳은 것은?"],"c":["가입자의 가입 종류가 변동되면 그 가입자의 가입기간은각 종류별 가입기간을 합산한 기간으로 한다.","국민연금사업은 기획재정부장관이 맡아 주관한다.","“수급권자”란 이 법에 따른 급여를 받을 권리를 말한다.","국내에 거주하는 국민으로서 18세 이상 65세 미만인 자는 국민연금 가입 대상이 된다.","｢국민연금법｣을 적용할 때 배우자에는 사실상의 혼인관계에 있는 자는 포함되지 않는다."],"a":1},{"id":"24-3-70","y":2024,"g":3,"n":70,"t":"고용보험법·산업재해보상보험법","f":"옳은 것 고르기","s":["고용보험법의 내용으로 옳은 것은?"],"c":["“실업의 인정”이란 근로의 의사와 능력이 있음에도 불구하고 취업하지 못한 상태에 있는 것을 말한다.","“일용근로자”란 3개월 미만 동안 고용되는 사람을 말한다.","지방자치단체는 매년 보험사업에 드는 비용의 일부를 일반회계에서 부담하여야 한다.","고용보험기금은 고용노동부장관이 관리ㆍ운용한다.","실업급여를 받을 권리는 양도 또는 압류하거나 담보로제공할 수 있다."],"a":4},{"id":"24-3-71","y":2024,"g":3,"n":71,"t":"고용보험법·산업재해보상보험법","f":"옳은 것 모두 고르기","s":["고용보험법상 실업급여의 종류로 취업촉진 수당에 해당하는 것을 모두 고른 것은?","ㄱ. 이주비　　　　　　　　　　ㄴ. 광역 구직활동비","ㄷ. 직업능력개발 수당　　　　ㄹ. 조기재취업 수당"],"c":["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"24-3-72","y":2024,"g":3,"n":72,"t":"노인복지법·장애인복지법·장애인연금법","f":"옳은 것 고르기","s":["노인복지법의 내용으로 옳은 것은?"],"c":["노인복지주택에 입소할 수 있는 자는 65세 이상의 노인으로 한다.","국가는 지역 간의 연계체계를 구축하고 노인학대를 예방하기 위하여 중앙노인보호전문기관을 설치ㆍ운영하여야 한다.","노인취업알선기관은 지역사회 등에서 노인에 의한 재화의 생산ㆍ판매 등을 직접 담당하는 기관이다.","노인요양공동생활가정은 노인들에게 일상생활에 필요한편의를 제공함을 목적으로 하는 노인주거복지시설이다.","지역노인보호전문기관은 시ㆍ군ㆍ구에 둔다."],"a":2},{"id":"24-3-73","y":2024,"g":3,"n":73,"t":"아동복지법·영유아보육법·청소년복지지원법","f":"옳지 않은 것","s":["아동복지법의 내용으로 옳지 않은 것은?"],"c":["지방자치단체는 아동이 항상 이용할 수 있는 아동전용시설을 설치하도록 노력하여야 한다.","시ㆍ도지사 또는 시장ㆍ군수ㆍ구청장은 보호조치 중인보호대상아동의 양육상황을 분기별로 점검하여야 한다.","아동정책조정위원회 위원장은 국무총리가 된다.","아동위원은 명예직으로 하되, 아동위원에 대하여는 수당을 지급할 수 있다.","보건복지부장관은 아동정책의 효율적인 추진을 위하여 5년마다 아동정책기본계획을 수립하여야 한다."],"a":2},{"id":"24-3-74","y":2024,"g":3,"n":74,"t":"가족·여성 관련법(한부모·다문화·가정폭력·성폭력 등)","f":"옳은 것 고르기","s":["한부모가족지원법의 내용으로 옳은 것은?"],"c":["여성가족부장관은 5년마다 한부모가족에 대한 실태조사를 실시하고 그 결과를 공표하여야 한다.","“청소년 한부모”란 18세 이하의 모 또는 부를 말한다.","교육부장관은 청소년 한부모가 학업을 계속할 수 있도록여성가족부장관에게 협조를 요청하여야 한다.","“모” 또는 “부”에는 아동인 자녀를 양육하는 미혼자(사실혼 관계에 있는 자는 제외한다)도 해당된다.","한부모가족에 대한 국민의 이해와 관심을 제고하기 위하여 매년 9월 7일을 한부모가족의 날로 한다."],"a":4},{"id":"24-3-75","y":2024,"g":3,"n":75,"t":"모금회법·자원봉사활동기본법·사회적경제관련법","f":"옳지 않은 것","s":["사회복지공동모금회법상 사회복지공동모금회(이하 '모금회'라 한다)에 관한 설명으로 옳지 않은 것은?"],"c":["모금회는 사회복지사업을 지원하기 위하여 연중 기부금품을 모집할 수 있다.","지방자치단체는 모금회에 기부금품 모집에 필요한 비용을 보조할 수 있다.","배분분과실행위원회는 20명 이상의 위원으로 구성된다.","모금회는 정관을 작성하여 보건복지부장관의 허가를 받아 등기함으로써 설립된다.","모금회는 매년 8월 31일까지 다음 회계연도의 공동모금재원 배분기준을 정하여 공고하여야 한다."],"a":4},{"id":"25-3-51","y":2025,"g":3,"n":51,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 고르기","s":["법률의 제정 연도가 가장 빠른 것은?"],"c":["산업재해보상보험법","국민기초생활 보장법","고용보험법","국민연금법","국민건강보험법"],"a":1},{"id":"25-3-52","y":2025,"g":3,"n":52,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 고르기","s":["우리나라 사회복지법 체계와 법원에 관한 설명으로 옳은 것은?"],"c":["성문법원의 종류로 관습법, 판례법, 조리가 있다.","시행령과 시행규칙은 국회의 의결을 거쳐 제정, 공포된법원이다.","시행령보다 시행규칙이 상위 법규범이다.","대통령은 법률에서 구체적으로 위임받은 사항과 법률을집행하기 위하여 필요한 사항에 관하여 대통령령을 발할수 있다.","정부는 법률안을 제출할 수 없다."],"a":4},{"id":"25-3-53","y":2025,"g":3,"n":53,"t":"노인복지법·장애인복지법·장애인연금법","f":"옳은 것 모두 고르기","s":["우리나라 사회복지관련법의 입법 변천사에 관한 설명으로옳은 것을 모두 고른 것은?","ㄱ. 1981년 노인복지법이 제정되었다.","ㄴ. 2007년 노인장기요양보험법이 제정되었다.","ㄷ. 1961년 제정된 아동복리법은 1989년 아동복지법으로 개정되었다.","ㄹ. 1981년 제정된 심신장애자복지법은 1989년 장애인복지법으로 개정되었다."],"c":["ㄱ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"25-3-54","y":2025,"g":3,"n":54,"t":"사회보장기본법·사회보장급여법","f":"옳지 않은 것","s":["사회보장기본법상 사회보장수급권의 보호와 포기에 관한 설명으로 옳지 않은 것은?"],"c":["사회보장수급권은 다른 사람에게 양도할 수 없다.","사회보장수급권은 담보로 제공할 수 없다.","사회보장수급권은 정당한 권한이 있는 기관에 서면으로통지하여 포기할 수 있다.","사회보장수급권의 포기는 취소할 수 없다.","사회보장수급권을 포기하는 것이 다른 사람에게 피해를주는 경우에는 이를 포기할 수 없다."],"a":4},{"id":"25-3-55","y":2025,"g":3,"n":55,"t":"사회보장기본법·사회보장급여법","f":"옳은 것 고르기","s":["사회보장기본법과 사회보장급여의 이용ㆍ제공 및 수급권자발굴에 관한 법률에 명시되어 있는 사회보장 관련 계획에관한 설명으로 옳은 것은?"],"c":["사회보장 기본계획은 7년 주기로 수립된다.","보건복지부장관은 관계 중앙행정기관의 장과 협의하여사회보장 기본계획을 수립하여야 한다.","사회보장 기본계획은 사회보장위원회의 심의사항이 아니다.","지방자치단체의 장은 지역사회보장계획을 5년마다 수립해야 한다.","시ㆍ도 지역사회보장협의체와 시ㆍ군ㆍ구의 사회보장위원회는 지역사회보장계획을 심의ㆍ의결한다."],"a":2},{"id":"25-3-56","y":2025,"g":3,"n":56,"t":"사회보장기본법·사회보장급여법","f":"빈칸 채우기","s":["사회보장기본법상 용어의 정의에 관한 설명이다. ㄱ, ㄴ에들어갈 용어로 옳은 것은?","( ㄱ ): 국민에게 발생하는 사회적 위험을 보험의 방식으로 대처함으로써 국민의 건강과 소득을 보장하는 제도","( ㄴ ): 국가와 지방자치단체의 책임 하에 생활 유지 능력이 없거나 생활이 어려운 국민의 최저생활을 보장하고 자립을 지원하는 제도"],"c":["ㄱ: 사회보험, ㄴ: 사회서비스","ㄱ: 사회보험, ㄴ: 공공부조","ㄱ: 공공부조, ㄴ: 사회보장","ㄱ: 사회보장, ㄴ: 사회서비스","ㄱ: 사회서비스, ㄴ: 공공부조"],"a":2},{"id":"25-3-57","y":2025,"g":3,"n":57,"t":"사회보장기본법·사회보장급여법","f":"옳지 않은 것","s":["사회보장기본법상 사회보장위원회에 관한 설명으로 옳지 않은 것은?"],"c":["사회보장에 관한 주요시책을 심의ㆍ조정하기 위해 국무총리 소속으로 두고 있다.","실무위원회를 두며 실무위원회에 분야별 전문위원회를둘 수 있다.","위원은 30명 이내로 구성한다.","위원의 임기는 4년이다.","관계 중앙행정기관의 장과 지방자치단체의 장은 위원회의 심의ㆍ조정 사항을 반영하여 사회보장제도를 운영해야 한다."],"a":4},{"id":"25-3-58","y":2025,"g":3,"n":58,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳지 않은 것","s":["조례와 규칙에 관한 설명으로 옳지 않은 것은?"],"c":["조례는 지방의회의 의결을 거쳐 제정한다.","규칙은 지방자치단체의 장이 제정한 법규범이다.","지방자치단체는 법령의 범위에서 그 사무에 관하여 조례를 제정할 수 있다.","시ㆍ군 및 자치구의 규칙은 시ㆍ도의 규칙보다 상위 법규범이다.","조례는 규칙보다 상위 법규범이다."],"a":4},{"id":"25-3-59","y":2025,"g":3,"n":59,"t":"사회보장기본법·사회보장급여법","f":"옳지 않은 것","s":["사회보장기본법상 사회보장 비용의 부담에 관한 설명으로옳지 않은 것은?"],"c":["사회보장 비용의 부담은 국가, 지방자치단체 및 민간부문 간에 합리적으로 조정되어야 한다.","공공부조에 드는 비용은 지방자치단체가 전부 부담한다.","부담 능력이 있는 국민에 대한 사회서비스에 드는 비용은 그 수익자가 부담함을 원칙으로 한다.","사회보험에 드는 비용은 사용자, 피용자 및 자영업자가부담함을 원칙으로 한다.","사회보험에 드는 비용의 일부를 관계 법령에서 정하는바에 따라 국가가 부담할 수 있다."],"a":2},{"id":"25-3-60","y":2025,"g":3,"n":60,"t":"사회복지사업법","f":"옳지 않은 것","s":["사회복지사업법상 사회복지사에 관한 설명으로 옳지 않은것은?"],"c":["피성년후견인 또는 피한정후견인은 사회복지사가 될 수없다.","보건복지부장관은 사회복지사가 거짓이나 그 밖의 부정한 방법으로 자격을 취득한 경우 사회복지사 자격을 취소하여야 한다.","보건복지부장관은 사회복지사가 자격정지 처분 기간에자격증을 사용하여 자격 관련 업무를 수행한 경우 그 자격을 취소하거나 1년의 범위에서 정지시킬 수 있다.","보건복지부장관은 자격이 취소된 사람에게는 그 취소된날부터 2년 이내에 자격증을 재교부하지 못한다.","사회복지법인에 종사하는 사회복지사는 정기적으로 인권에 관한 내용이 포함된 보수교육을 받아야 한다."],"a":1},{"id":"25-3-61","y":2025,"g":3,"n":61,"t":"사회복지사업법","f":"옳은 것 모두 고르기","s":["사회복지사업법상 사회복지법인 설립허가를 반드시 취소하여야 하는 경우를 모두 고른 것은?","ㄱ. 설립허가 조건을 위반하였을 때","ㄴ. 목적 달성이 불가능하게 되었을 때","ㄷ. 거짓이나 그 밖의 부정한 방법으로 설립허가를 받았을 때","ㄹ. 법인 설립 후 기본재산을 출연하지 아니한 때"],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"a":5},{"id":"25-3-62","y":2025,"g":3,"n":62,"t":"사회복지사업법","f":"옳은 것 고르기","s":["사회복지사업법상 사회복지시설(이하 '시설'이라고 한다)에관한 설명으로 옳은 것은?"],"c":["사회복지관은 사회복지서비스를 직업 및 취업 알선이 필요한 사람에게 우선 제공할 수 없다.","시설의 장은 시설의 운영에 관한 사항을 의결하기 위하여 시설에 운영위원회를 두어야 한다.","국가 또는 지방자치단체 외의 자가 시설을 설치ㆍ운영하려는 경우에는 시장ㆍ군수ㆍ구청장에게 신고하여야 한다.","대통령령으로 정하는 경우를 제외하고, 각 시설의 수용인원은 200명을 초과할 수 없다.","시설의 장은 비상근 겸직할 수 있다."],"a":3},{"id":"25-3-63","y":2025,"g":3,"n":63,"t":"아동복지법·영유아보육법·청소년복지지원법","f":"옳지 않은 것","s":["아동복지법령상 아동보호전문기관의 업무가 아닌 것은?"],"c":["아동학대 신고접수, 현장조사 및 응급보호","피해아동, 피해아동의 가족 및 아동학대행위자를 위한상담ㆍ치료 및 교육","아동학대예방 교육 및 홍보","피해아동 및 피해아동 가정의 기능 회복 서비스 제공","피해아동 가정의 사후관리"],"a":1},{"id":"25-3-64","y":2025,"g":3,"n":64,"t":"노인복지법·장애인복지법·장애인연금법","f":"옳은 것 모두 고르기","s":["노인복지법상 금지행위에 해당하는 것을 모두 고른 것은?","ㄱ. 노인에게 성적 수치심을 주는 성폭행·성희롱 등의 행위","ㄴ. 노인에게 구걸을 하게 하거나 노인을 이용하여 구걸하는 행위","ㄷ. 노인을 위하여 증여 또는 급여된 금품을 그 목적 외의 용도에 사용하는 행위"],"c":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":5},{"id":"25-3-65","y":2025,"g":3,"n":65,"t":"노인복지법·장애인복지법·장애인연금법","f":"옳은 것 고르기","s":["장애인복지법의 내용으로 옳은 것은?"],"c":["보건복지부장관 소속하에 장애인정책조정위원회를 둔다.","장애실태조사는 5년마다 실시하여야 한다.","재외동포 및 외국인은 장애인 등록을 할 수 없다.","장애인의 날은 매년 5월 20일이다.","｢장애인연금법｣상의 중증장애인에게는 장애수당을 지급하지 아니한다."],"a":5},{"id":"25-3-66","y":2025,"g":3,"n":66,"t":"가족·여성 관련법(한부모·다문화·가정폭력·성폭력 등)","f":"옳은 것 고르기","s":["한부모가족지원법의 내용으로 옳은 것은?"],"c":["보건복지부장관은 한부모가족 지원을 위하여 한부모가족정책에 관한 기본계획을 5년마다 수립하여야 한다.","청소년 한부모란 25세 이하의 모 또는 부를 말한다.","아동이란 18세 미만의 자를 말하되, 병역 면제인 자가취학 중인 경우에는 22세 미만을 말한다.","혼인 관계에 있지 아니한 자로서 출산 전 임신부는 출산지원시설을 이용할 때에도 이 법에 따른 지원대상자가될 수 없다.","이 법에 따른 복지 급여는 생계비, 아동수당, 아동교육비, 아동양육비이다."],"a":3},{"id":"25-3-67","y":2025,"g":3,"n":67,"t":"가족·여성 관련법(한부모·다문화·가정폭력·성폭력 등)","f":"옳지 않은 것","s":["가정폭력방지 및 피해자보호 등에 관한 법률의 내용으로 옳지 않은 것은?"],"c":["피해자란 가정폭력으로 인하여 직접적으로 피해를 입은자를 말한다.","사회복지법인과 그 밖의 비영리법인은 시장ㆍ군수ㆍ구청장의 인가를 받아 보호시설을 설치ㆍ운영할 수 있다.","국가나 지방자치단체는 피해자나 피해자가 동반한 가정구성원이 아동인 경우 주소지 외의 지역에서 취학할 필요가 있을 때에는 그 취학이 원활히 이루어지도록 지원하여야 한다.","유치원의 장, 어린이집의 원장, 초ㆍ중등학교의 장은 가정폭력의 예방과 방지를 위하여 필요한 교육을 실시하고, 그 결과를 여성가족부장관에게 제출하여야 한다.","단기보호시설은 피해자등을 6개월의 범위에서 보호하는시설이다."],"a":4},{"id":"25-3-68","y":2025,"g":3,"n":68,"t":"국민기초생활보장법","f":"옳은 것 고르기","s":["국민기초생활 보장법상 국내에 체류하고 있는 외국인에 대한 특례를 적용할 수 없는 자는?"],"c":["대한민국 국민과 혼인하여 본인 또는 배우자가 임신 중인 자","대한민국 국적의 미성년 자녀를 양육하고 있는 자","배우자의 대한민국 국적인 직계존속과 생계를 같이하고있는 자","배우자의 대한민국 국적인 직계존속과 주거를 같이하고있는 자","대한민국 국적의 성인 장애인과 함께 생활하고 있는 자"],"a":5},{"id":"25-3-69","y":2025,"g":3,"n":69,"t":"국민기초생활보장법","f":"옳지 않은 것","s":["국민기초생활 보장법상 자활지원사업 수행기관에게 요구되는 개인정보보호에 관한 설명으로 옳지 않은 것은?"],"c":["보건복지부장관은 수행기관의 통합정보전산망 사용 요청에 대하여 특별한 사정이 없는 한 모든 정보를 제공하여야 한다.","수행기관은 보건복지부장관에게 통합정보전산망 사용을요청하는 경우 보안교육 등 자활지원사업 참여자의 개인정보에 대한 보호대책을 마련하여야 한다.","수행기관은 통합정보전산망을 이용하고자 하는 경우 사전에 정보주체의 동의를 받아야 한다.","사회보장급여 수급이력 등 개인정보는 수행기관에서 자활지원사업을 담당하는 자 중 해당 기관의 장으로부터개인정보 취급승인을 받은 자만 취급할 수 있다.","자활지원사업 업무에 종사하였던 자는 자활지원사업 업무 수행과 관련하여 알게 된 개인ㆍ법인의 정보를 다른용도로 사용해서는 아니 된다."],"a":1},{"id":"25-3-70","y":2025,"g":3,"n":70,"t":"의료급여법·긴급복지지원법·기초연금법","f":"옳지 않은 것","s":["기초연금법상 기초연금 수급권을 상실하게 되는 경우가 아닌 것을 모두 고른 것은?","ㄱ. 사망한 때","ㄴ. 국적을 상실한 때","ㄷ. 장기요양등급판정을 받은 때","ㄹ. 국외로 이주한 때"],"c":["ㄴ","ㄷ","ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ"],"a":2},{"id":"25-3-71","y":2025,"g":3,"n":71,"t":"의료급여법·긴급복지지원법·기초연금법","f":"옳은 것 고르기","s":["의료급여법의 내용으로 옳은 것은?"],"c":["｢입양특례법｣에 따라 국내에 입양된 아동은 25세까지 수급권자로 특례 적용된다.","수급권자가 업무 또는 공무로 생긴 질병ㆍ부상ㆍ재해로다른 법령에 따른 급여나 보상을 받게 되는 경우에는 이법에 따른 의료급여를 하지 아니한다.","의료급여에 관한 업무는 수급권자의 출생지를 관할하는시장ㆍ군수ㆍ구청장이 한다.","｢지역보건법｣에 따라 설치된 보건소는 의료급여기관이될 수 없다.","시장ㆍ군수ㆍ구청장은 수급권자가 정당한 이유 없이 의료급여기관의 진료에 관한 지시에 따르지 아니한 경우에도 의료급여를 제한해서는 아니 된다."],"a":2},{"id":"25-3-72","y":2025,"g":3,"n":72,"t":"국민건강보험법·노인장기요양보험법","f":"옳지 않은 것","s":["국민건강보험법상 국민건강보험공단에 관한 설명으로 옳지않은 것은?"],"c":["요양급여 외에 임신ㆍ출산 진료비, 장제비, 상병수당, 그밖의 급여를 실시할 수 있다.","가입자와 피부양자에 대하여 질병의 조기 발견과 그에따른 요양급여를 하기 위하여 건강검진을 실시한다.","회계연도마다 예산안을 독자적으로 편성하고 지출할 수있다.","고의 또는 중대한 과실로 인한 범죄행위에 그 원인이 있는 경우 보험급여를 하지 아니한다.","보험료등의 납부의무자가 납부기한까지 보험료등을 내지아니하면 그 납부기한이 지난 날부터 매 1일이 경과할때마다 연체금을 징수한다."],"a":3},{"id":"25-3-73","y":2025,"g":3,"n":73,"t":"고용보험법·산업재해보상보험법","f":"옳지 않은 것","s":["산업재해보상보험법상 보험급여의 종류가 아닌 것은?"],"c":["요양급여","휴업급여","예방ㆍ재활급여","상병보상연금","직업재활급여"],"a":3},{"id":"25-3-74","y":2025,"g":3,"n":74,"t":"고용보험법·산업재해보상보험법","f":"옳은 것 모두 고르기","s":["고용보험법상 명시되어 있는 고용보험사업을 모두 고른 것은?","ㄱ. 고용안정·직업능력개발 사업　　　ㄴ. 실업급여","ㄷ. 육아휴직 급여　　　　　　　　　　ㄹ. 자활급여"],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"a":4},{"id":"25-3-75","y":2025,"g":3,"n":75,"t":"국민건강보험법·노인장기요양보험법","f":"옳지 않은 것","s":["노인장기요양보험법상 장기요양인정에 관한 설명으로 옳지않은 것은?","인정하는 경우 등급판정기준에 따라 수급자로 판정한다.","전자문제집 CBT 앱(구글플레이) : [다운로드]"],"c":["장기요양기관은 수급자를 대리하여 장기요양인정을 신청한다.","대통령령으로 정하는 경우를 제외하고, 장기요양인정을신청하는 자는 국민건강보험공단에 장기요양인정신청서에 의사 또는 한의사가 발급하는 소견서를 첨부하여 제출하여야 한다.","국민건강보험공단은 장기요양인정 신청서를 접수한 때소속 직원으로 하여금 신청인의 심신상태, 신청인에게필요한 장기요양급여의 종류 및 내용 등에 대하여 조사하게 하여야 한다.","등급판정위원회는 신청인이 신청자격요건을 충족하고 6개월 이상 동안 혼자서 일상생활을 수행하기 어렵다고","국민건강보험공단은 등급판정위원회가 장기요양인정 및등급판정의 심의를 완료한 경우 지체없이 장기요양인정서를 작성하여 수급자에게 송부하여야 한다."],"a":1},{"id":"26-3-51","y":2026,"g":3,"n":51,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 고르기","s":["법률의 제정 연도가 가장 최근인 것은?"],"c":["｢국민건강보험법｣","｢다문화가족지원법｣","｢노인 일자리 및 사회활동 지원에 관한 법률｣","｢사회보장기본법｣","｢긴급복지지원법｣"],"a":3},{"id":"26-3-52","y":2026,"g":3,"n":52,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳지 않은 것","s":["전자의 법률이 후자의 법률로 개정된 것이 아닌 것은?"],"c":["｢아동복리법｣- ｢아동복지법｣","｢국민복지연금법｣- ｢국민연금법｣","｢심신장애자복지법｣- ｢장애인복지법｣","｢정신보건법｣- ｢정신건강증진 및 정신질환자 복지서비스지원에 관한 법률｣","｢기초연금법｣- ｢장애인연금법｣"],"a":5},{"id":"26-3-53","y":2026,"g":3,"n":53,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳지 않은 것","s":["헌법 규정에서 사회권적 기본권의 내용으로 옳지 않은 것은?"],"c":["모든 국민은 보건에 관하여 국가의 보호를 받는다.","국가는 사회보장ㆍ사회복지의 증진에 노력할 의무를 진다.","모든 국민은 양심의 자유를 가진다.","모든 국민은 인간다운 생활을 할 권리를 가진다.","국가는 노인과 청소년의 복지향상을 위한 정책을 실시할의무를 진다."],"a":3},{"id":"26-3-54","y":2026,"g":3,"n":54,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 고르기","s":["헌법 규정에서 법률의 제정에 관한 내용으로 옳은 것은?"],"c":["입법권은 국회와 행정부에 속한다.","법률은 특별한 규정이 없는 한 공포한 날로부터 7일을경과함으로써 효력을 발생한다.","정부는 법률안을 제출할 수 없다.","대통령은 법률안을 수정하여 재의를 요구할 수 있다.","국회에서 의결된 법률안은 정부에 이송되어 15일 이내에대통령이 공포한다."],"a":5},{"id":"26-3-55","y":2026,"g":3,"n":55,"t":"사회보장기본법·사회보장급여법","f":"옳은 것 고르기","s":["사회보장기본법에 관한 내용으로 옳은 것은?"],"c":["보건복지부장관은 중장기 사회보장 재정추계를 적어도 3년마다 실시하고 이를 공표하여야 한다.","보건복지부장관은 사회보장에 관한 기본계획을 3년마다수립하여야 한다.","국가는 최저보장수준과 최저임금을 2년마다 공표하여야한다.","지방자치단체가 사회보장제도를 신설할 경우 기획예산처장관과 협의하여야 한다.","사회보장위원회의 사무국은 국무총리실에 둔다."],"a":1},{"id":"26-3-56","y":2026,"g":3,"n":56,"t":"사회보장기본법·사회보장급여법","f":"옳지 않은 것","s":["사회보장급여의 이용ㆍ제공 및 수급권자 발굴에 관한 법률에서 직무상 지원대상자 발견 시 신고의무를 지는 자가 아닌 것은?"],"c":["｢영유아보육법｣제10조에 따른 어린이집의 원장","｢유아교육법｣제20조에 따른 교직원","｢초ㆍ중등교육법｣제19조에 따른 교직원","｢고등교육법｣제14조에 따른 교직원","｢학원의 설립ㆍ운영 및 과외교습에 관한 법률｣제6조에따른 학원의 운영자"],"a":4},{"id":"26-3-57","y":2026,"g":3,"n":57,"t":"사회보장기본법·사회보장급여법","f":"옳은 것 고르기","s":["사회보장급여의 이용ㆍ제공 및 수급권자 발굴에 관한 법률상 지역사회보장협의체의 심의 ㆍ자문 사항에 포함되지 않는 것은?"],"c":["시ㆍ군ㆍ구의 지역사회보장계획 수립ㆍ시행 및 평가에관한 사항","시ㆍ군ㆍ구의 지역사회보장조사 및 지역사회보장지표에관한 사항","읍ㆍ면ㆍ동 단위 지역사회보장협의체의 구성 및 운영에관한 사항","시ㆍ군ㆍ구의 사회보장 추진에 관한 사항","국가와 지방자치단체의 역할 및 비용 부담에 관한 사항"],"a":5},{"id":"26-3-58","y":2026,"g":3,"n":58,"t":"사회보장기본법·사회보장급여법","f":"옳은 것 고르기","s":["사회보장기본법에 관한 내용에 포함되지 않는 것은?"],"c":["사회보장 기본계획의 수립","시ㆍ도사회보장위원회의 설치","사회보장제도의 평가","사회보장 행정데이터 분석센터의 설치","사회보장지출통계의 관리"],"a":2},{"id":"26-3-59","y":2026,"g":3,"n":59,"t":"사회복지사업법","f":"옳지 않은 것","s":["사회복지사업법상 사회복지시설(이하 '시설'이라 한다)에 관한 설명으로 옳지 않은 것은?"],"c":["사회복지관은 지역의 다문화가족에게 서비스를 우선 제공하여야 한다.","시장ㆍ군수ㆍ구청장은 시설에 대하여 정기 및 수시 안전점검을 실시하여야 한다.","국가는 시설을 설치ㆍ운영할 수 있다.","시설의 운영자는 시설을 폐지하려는 경우에는 시장ㆍ군수ㆍ구청장에게 신고하여야 한다.","보건복지부장관은 시설의 회계부정이 발견되었을 때 그시설의 폐쇄를 명할 수 있다."],"a":2},{"id":"26-3-60","y":2026,"g":3,"n":60,"t":"사회복지사업법","f":"옳은 것 고르기","s":["사회복지사업법상 사회복지법인(이하 '법인'이라 한다)에 관한 설명으로 옳은 것은?"],"c":["이사는 법인이 설치한 사회복지시설의 장을 겸할 수 없다.","해산한 법인의 남은 재산은 유사한 목적을 가진 다른 법인에 귀속된다.","법인을 설립하려는 자는 시ㆍ도지사의 인가를 받아야 한다.","법인의 정관에는 자산 및 회계에 관한 사항이 포함되어야 한다.","법인의 이사와 감사의 임기는 3년으로 한다."],"a":4},{"id":"26-3-61","y":2026,"g":3,"n":61,"t":"사회복지사업법","f":"옳은 것 고르기","s":["사회복지사업법에 관한 내용으로 옳은 것은?"],"c":["사회복지사업 관련 법률에는 ｢스토킹방지 및 피해자보호등에 관한 법률｣이 포함된다.","사회복지를 필요로 하는 사람은 누구든지 자신의 의사와상관없이 서비스를 신청하고 제공받을 수 있다.","사회복지서비스는 현물과 현금으로 제공되는 것을 원칙으로 한다.","사회복지사업을 하는 자는 주민의 복지 욕구를 조사할수 없다.","사회복지서비스를 제공하는 자는 사회복지서비스를 이용하는 사람의 선택권을 보장하지 않아도 된다."],"a":1},{"id":"26-3-62","y":2026,"g":3,"n":62,"t":"국민기초생활보장법","f":"빈칸 채우기","s":["국민기초생활보장법에 관한 내용이다. ( )에 들어갈 내용이 옳은 것은?","○ 보건복지부장관 또는 소관 중앙행정기관의 장은 급여의 종류별 수급자 선정기준 및 ( ㄱ )수준을 결정하여야 한다.","○ 소득인정액은 개별가구의 ( ㄴ )과 재산의 ( ㄷ )을 합산한 금액이다."],"c":["ㄱ: 적정, ㄴ: 소득환산액, ㄷ: 소득평가액","ㄱ: 최저보장, ㄴ: 소득평가액, ㄷ: 소득환산액","ㄱ: 최적, ㄴ: 경상소득, ㄷ: 소득평가액","ㄱ: 최소, ㄴ: 재산소득, ㄷ: 경상소득","ㄱ: 최저보장, ㄴ: 가처분소득, ㄷ: 소득환산액"],"a":2},{"id":"26-3-63","y":2026,"g":3,"n":63,"t":"의료급여법·긴급복지지원법·기초연금법","f":"옳은 것 모두 고르기","s":["긴급복지지원법상 “위기상황”에 해당하는 것을 모두 고른 것은?","ㄱ. 가정폭력을 당하여 가구구성원과 함께 원만한 가정생활을 하기 곤란하거나 가구구성원으로부터 성폭력을 당한 경우","ㄴ. 화재 또는 자연재해 등으로 인하여 거주하는 주택 또는 건물에서 생활하기 곤란하게 된 경우","ㄷ. 주소득자 또는 부소득자의 휴업, 폐업 또는 사업장의 화재 등으로 인하여 실질적인 영업이 곤란하게 된 경우","ㄹ. 주소득자 또는 부소득자의 실직으로 소득을 상실한 경우"],"c":["ㄱ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"26-3-64","y":2026,"g":3,"n":64,"t":"의료급여법·긴급복지지원법·기초연금법","f":"옳지 않은 것","s":["의료급여법에 관한 내용으로 옳지 않은 것은?"],"c":["시장ㆍ군수ㆍ구청장은 수급권자가 의료급여를 거부한 경우라도 의료급여를 중지하여서는 안 된다.","｢재해구호법｣에 따른 이재민으로서 보건복지부장관이 의료급여가 필요하다고 인정한 사람은 수급권자에 포함된다.","“의료급여기관”이란 수급권자에 대한 진료ㆍ조제 또는투약 등을 담당하는 의료기관 및 약국 등을 말한다.","시장ㆍ군수ㆍ구청장은 수급권자에 대하여 질병의 조기발견과 그에 따른 의료급여를 하기 위하여 건강검진을 할 수 있다.","시장ㆍ군수ㆍ구청장은 수급권자에 대한 의료급여가 필요없게 된 경우 의료급여를 중지하여야 한다."],"a":1},{"id":"26-3-65","y":2026,"g":3,"n":65,"t":"국민연금법","f":"옳은 것 고르기","s":["기초연금법에 관한 내용으로 옳은 것은?"],"c":["보건복지부장관은 선정기준액을 정하는 경우 65세 이상인 사람 중 기초연금 수급자가 100분의 90 수준이 되도록 한다.","국민연금기금은 기초연금 지급을 위한 재원으로 사용할수 있다.","본인과 그 배우자가 모두 기초연금 수급권자인 경우에는각각의 기초연금액에서 기초연금액의 100분의 20에 해당하는 금액을 감액한다.","기초연금 수급자의 국외 체류기간이 30일 이상 지속되는경우 기초연금의 지급이 정지된다.","기초연금으로 지급받은 금품은 압류될 수 있다."],"a":3},{"id":"26-3-66","y":2026,"g":3,"n":66,"t":"국민연금법","f":"옳지 않은 것","s":["국민연금법상 국민연금 가입기간에 관한 설명으로 옳지 않은 것은?"],"c":["국민연금 가입기간은 월 단위로 계산한다.","가입자의 자격을 상실한 후 다시 그 자격을 취득한 자에대하여는 전후의 가입기간을 합산한다.","가입자의 가입 종류가 변동되면 그 가입자의 가입기간은각 종류별 가입기간을 합산한 기간으로 한다.","출산에 대한 가입기간 추가 산입은 둘째 자녀부터 12개월을 적용한다.","실업에 대한 가입기간 추가 산입은 1년을 초과할 수 없다."],"a":4},{"id":"26-3-67","y":2026,"g":3,"n":67,"t":"국민건강보험법·노인장기요양보험법","f":"빈칸 채우기","s":["국민건강보험법에 관한 내용이다. ( )에 들어갈 내용이 옳은 것은?","○ 건강보험의 보험자는 ( ㄱ )으로 한다.","○ 요양급여의 적정성을 평가하기 위하여 ( ㄴ )을 설립한다."],"c":["ㄱ: 건강보험심사평가원, ㄴ: 한국보건사회연구원","ㄱ: 국민건강보험공단, ㄴ: 한국사회보장정보원","ㄱ: 요양기관(의료기관), ㄴ: 건강보험심사평가원","ㄱ: 건강보험심사평가원, ㄴ: 국민건강보험공단","ㄱ: 국민건강보험공단, ㄴ: 건강보험심사평가원"],"a":5},{"id":"26-3-68","y":2026,"g":3,"n":68,"t":"국민건강보험법·노인장기요양보험법","f":"옳은 것 고르기","s":["노인장기요양보험법상 장기요양급여에 관한 설명으로 옳은 것은?"],"c":["단기보호는 시설급여이다.","특별현금급여에는 가족요양비, 특례요양비, 요양병원간병비가 포함된다.","주ㆍ야간보호는 시설급여이다.","방문간호는 시설급여이다.","부양가족이 있으면 장기요양급여는 지급되지 않는다."],"a":2},{"id":"26-3-69","y":2026,"g":3,"n":69,"t":"고용보험법·산업재해보상보험법","f":"옳은 것 모두 고르기","s":["고용보험법상 고용보험기금의 용도에 해당하는 것을 모두 고른 것은?","ㄱ. 보험료의 반환","ㄴ. 일시 차입금의 상환금과 이자","ㄷ. 「고용보험법」과 「고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률」에 따른 업무를 대행하거나 위탁받은 자에 대한 출연금"],"c":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":5},{"id":"26-3-70","y":2026,"g":3,"n":70,"t":"아동복지법·영유아보육법·청소년복지지원법","f":"옳지 않은 것","s":["아동복지법에 관한 내용으로 옳지 않은 것은?"],"c":["“보호자”란 친권자, 후견인, 아동을 보호ㆍ양육ㆍ교육하거나 그러한 의무가 있는 자 또는 업무ㆍ고용 등의 관계로 사실상 아동을 보호ㆍ감독하는 자를 말한다.","특별시ㆍ광역시ㆍ도ㆍ특별자치도에 아동위원을 두고 아동위원에 대하여는 수당이 지급될 수 있다.","아동권리보장원의 업무에는 ｢국내입양에 관한 특별법｣및｢국제입양에 관한 법률｣에 따른 입양체계의 구축 및 운영을 위한 업무가 포함되어 있다.","보호대상아동이 보호조치를 연장할 의사가 있는 경우 해당 아동이 25세에 달할 때까지 보호기간이 연장된다.","국가 또는 지방자치단체는 아동복지시설을 설치할 수 있다."],"a":2},{"id":"26-3-71","y":2026,"g":3,"n":71,"t":"사회보장기본법·사회보장급여법","f":"옳은 것 고르기","s":["각 위원회 중 그 소속이 다른 것은?"],"c":["｢다문화가족지원법｣에 따른 다문화가족정책위원회","｢사회보장기본법｣에 따른 사회보장위원회","｢장애인복지법｣에 따른 장애인정책조정위원회","｢자원봉사활동 기본법｣에 따른 자원봉사진흥위원회","｢아동복지법｣에 따른 아동정책조정위원회"],"a":4},{"id":"26-3-72","y":2026,"g":3,"n":72,"t":"노인복지법·장애인복지법·장애인연금법","f":"빈칸 채우기","s":["장애인복지법의 기본이념에 관한 규정이다. ( )에 들어갈 내용으로 옳은 것은?","장애인복지의 기본이념은 장애인의 완전한 ( ㄱ )와 ( ㄴ )을 통하여 사회통합을 이루는 데에 있다."],"c":["ㄱ: 권익보호, ㄴ: 자립","ㄱ: 권리강화, ㄴ: 형평","ㄱ: 차별금지, ㄴ: 상생","ㄱ: 사회참여, ㄴ: 평등","ㄱ: 사회복지, ㄴ: 재활"],"a":4},{"id":"26-3-73","y":2026,"g":3,"n":73,"t":"노인복지법·장애인복지법·장애인연금법","f":"옳지 않은 것","s":["노인복지법에 관한 내용으로 옳지 않은 것은?"],"c":["국가는 노인을 지역봉사지도원으로 위촉할 수 있다.","“부양의무자”라 함은 배우자(사실상의 혼인관계에 있는자를 포함한다)와 직계존비속 및 그 배우자(사실상의 혼인관계에 있는 자를 포함한다)를 말한다.","노인복지관은 노인여가복지시설이다.","보건복지부장관은 독거노인종합지원센터를 설치ㆍ운영할수 있다.","노인의 복지를 담당하게 하기 위하여 특별자치도와 시ㆍ군ㆍ구(자치구를 말한다)에 노인복지상담원을 둔다."],"a":2},{"id":"26-3-74","y":2026,"g":3,"n":74,"t":"사회복지법 총론(법원·헌법·법률 제정연도)","f":"옳은 것 고르기","s":["각 법률에서 지정된 날이 옳게 연결된 것은?"],"c":["｢아동복지법｣에 따른 아동학대예방의 날 - 매년 6월 15일","｢노인복지법｣에 따른 노인학대예방의 날 - 매년 11월19일","｢장애인복지법｣에 따른 장애인의 날 - 매년 4월 20일","｢정신건강증진 및 정신질환자 복지서비스 지원에 관한법률｣에 따른 정신건강의 날 - 매년 5월 10일","｢한부모가족지원법｣에 따른 한부모가족의 날 - 매년 10월 10일"],"a":3},{"id":"26-3-75","y":2026,"g":3,"n":75,"t":"모금회법·자원봉사활동기본법·사회적경제관련법","f":"옳은 것 고르기","s":["사회복지공동모금회법에 관한 내용으로 옳은 것은?"],"c":["사회복지공동모금회(이하 '모금회'라 한다)는 집중모금을하려면 그 모집일부터 15일 전에 그 내용을 보건복지부장관에게 보고하여야 한다.","국가나 지방자치단체는 모금회의 관리ㆍ운영에 필요한비용을 보조할 수 없다.","모금회는 정관을 작성하여 보건복지부장관의 허가를 받아 등기함으로써 설립된다.","모금회의 배분분과실행위원회 위원의 임기는 2년이고,연임할 수 없다.","모금회는 매년 6월 30일까지 다음 회계연도의 공동모금재원 배분기준을 정하여 공고하여야 한다."],"a":1}],"data/q_po.json":[{"id":"17-3-1","y":2017,"g":3,"n":1,"t":"소득보장·공공부조·빈곤·불평등","f":"옳지 않은 것","s":["사회안전망에 관한 설명으로 옳지 않은 것은?"],"c":["이차적 사회안전망은 빈곤계층의 기본적 욕구를 충족시켜주기 위한 목적으로 운영된다.","일차적 사회안전망과 이차적 사회안전망은 각자의 목표에따라 엄격하게 구분하여 운영된다.","일차적 사회안전망은 개인의 노력과 능력으로 확보하게되는 안전망이다.","이차적 사회안전망은 주로 공공부조제도로 구성되어 있다.","일차적 사회안전망은 주로 사회보험제도로 구성되어 있다."],"a":2},{"id":"17-3-2","y":2017,"g":3,"n":2,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["현금급여와 현물급여의 장단점에 관한 설명으로 옳지 않은 것은?"],"c":["현금급여는 복지상품이나 서비스의 선택권을 보장할 수있다.","현금급여는 사회복지기관 관리운영비의 절감과 행정적 편의를 가져다줄 수 있다.","현물급여는 현금급여에 비해 오남용의 위험이 크다.","현물급여는 정책의 목표효율성을 높일 수 있다.","현물급여는 개인들의 복지욕구와 괴리가 나타날 수 있다."],"a":3},{"id":"17-3-3","y":2017,"g":3,"n":3,"t":"복지국가 발달사·유형·이론","f":"옳지 않은 것","s":["1942년 베버리지보고서에서 구상한 복지국가 모형의 특징이 아닌 것은?"],"c":["빈곤계층을 대상으로 하는 선별적 복지를 강조한다.","정액부담과 정액급여의 원리를 바탕으로 한다.","베버리지는 결핍(궁핍), 질병, 무지, 불결, 나태를 5대 악으로 규정한다.","정액부담의 원칙은 보험료의 징수와 관련한 행정비용을절감할 수 있는 효과가 있다.","노령, 장애, 실업, 질병 등과 같은 사회적 위험들을 하나의 국민보험에서 통합적으로 운영한다."],"a":1},{"id":"17-3-4","y":2017,"g":3,"n":4,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳지 않은 것","s":["우리나라 산업재해보상보험제도의 특징이 아닌 것은?"],"c":["보험료는 업종별로 상이한 보험료율을 적용하고 있다.","보험료는 개별 사업장의 산재사고실적에 따라 보험료를증감한다.","당연적용사업장 중 미가입 사업장에서 발생한 산재사고에대해서는 보상받을 수 없다.","보험료는 개산보험료와 확정보험료로 구성되어 있다.","산업재해보상보험에서는 근로자의 과실 여부에 상관없이산재사고에 대한 보상이 이루어진다."],"a":3},{"id":"17-3-5","y":2017,"g":3,"n":5,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳지 않은 것","s":["국민연금 보험료 부과체계상 소득상한선과 소득하한선에 관한 설명으로 옳지 않은 것은?"],"c":["소득하한선은 일정수준 이하의 저소득계층을 제도의 적용으로부터 제외시키는 기능을 한다.","소득하한선을 높게 설정할 경우 국민연금 가입자 규모가감소할 수 있다.","소득상한선을 낮게 유지할 경우 고소득계층의 부담은 그만큼 더 커지게 된다.","소득상한선은 국민연금 가입자들 상호간 연금급여의 편차를 일정수준에서 제한하는 기능을 하게 된다.","소득상한선은 그 이상의 소득에 대해서는 더 이상 보험료가 부과되지 않는 소득의 경계선을 의미한다."],"a":3},{"id":"17-3-6","y":2017,"g":3,"n":6,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 고르기","s":["국민기초생활보장제도의 특징으로 옳은 것은?"],"c":["대상 가구당 행정관리비용이 사회보험보다 저렴하다.","재원은 기금에 의존한다.","재원부담을 하는 자와 수급자가 동일하다.","대상 선정에서 부양의무자 존재 여부는 고려되지 않는다.","선정기준으로 기준 중위소득을 활용한다."],"a":5},{"id":"17-3-7","y":2017,"g":3,"n":7,"t":"복지국가 발달사·유형·이론","f":"옳지 않은 것","s":["에스핑-엔더슨(G. Esping-Andersen)의 복지국가 유형 중 조합주의 복지국가 모형의 특징이 아닌 것은?"],"c":["사회보험 가입자들의 직장 이동성을 활성화할 수 있다.","산업재해와 같은 동일한 위험에 대해서 다수의 운영주체가 존재한다.","제도의 적용대상은 임금근로계층을 원칙으로 한다.","사회복지제도들은 위험별로 구분하여 각각 독립적인 제도로 운영된다.","조합단위의 제도로 인하여 위험분산의 효과가 상대적으로낮게 발생한다."],"a":1},{"id":"17-3-8","y":2017,"g":3,"n":8,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["존 롤스(J. Rawls)의 사회정의를 구성하는 요소가 아닌 것은?"],"c":["무지의 베일","원초적 상황","차등의 원칙","획일적 평등사회","최소극대화의 원칙"],"a":4},{"id":"17-3-9","y":2017,"g":3,"n":9,"t":"사회서비스·기타 분야(노인·아동·장애·주거·교육)","f":"옳지 않은 것","s":["후기산업사회의 특징이 아닌 것은?"],"c":["노인부양비의 감소","인간 욕구의 다변화","가족해체 현상의 증가","세계화에 따른 경쟁의 심화","아동 및 노인에 대한 가정 내 돌봄 여력 감소"],"a":1},{"id":"17-3-10","y":2017,"g":3,"n":10,"t":"재원·재정·조세·소득재분배","f":"옳지 않은 것","s":["최근 20년간 우리나라 사회복지정책의 환경변화에 관한 설명으로 옳지 않은 것은?"],"c":["전 인구 중 노인의 비율이 높아졌다.","고용안정성에 대한 정책적 대응의 필요성이 높아졌다.","다양한 문화적 배경의 사회구성원이 증가하였다.","저출산 현상이 주요 사회문제로 등장하게 되었다.","높은 수준의 경제성장이 지속됨에 따라 복지 재원마련이용이해졌다."],"a":5},{"id":"17-3-11","y":2017,"g":3,"n":11,"t":"소득보장·공공부조·빈곤·불평등","f":"옳지 않은 것","s":["소득빈곤 및 소득불평등의 측정에 관한 설명으로 옳지 않은 것은?"],"c":["지니계수는 그 값이 클수록 더 불평등한 수준을 의미한다.","상대적 빈곤은 소득불평등과 관계가 있다.","소득빈곤의 측정만으로 삶의 다양한 문제를 모두 포착하기는 어렵다.","소득불평등 수준이 같은 국가라도 계층이동성의 수준이상이할 수 있다.","로렌츠 곡선에서 수직선은 모든 개인이 동일한 수준의소득을 가지고 있다는 것을 의미한다."],"a":5},{"id":"17-3-12","y":2017,"g":3,"n":12,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 모두 고르기","s":["공공부조에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 신청과정을 거치지 않는다.","ㄴ. 자산조사를 거쳐 대상을 선정한다.","ㄷ. 중앙정부가 단독으로 공공부조의 책임을 지는 것은 세계적 현상이다.","ㄹ. 사회보장제도 중 공공부조는 투입 재원 대비 소득재분배 효과가 가장 낮다."],"c":["ㄱ","ㄴ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":2},{"id":"17-3-13","y":2017,"g":3,"n":13,"t":"소득보장·공공부조·빈곤·불평등","f":"옳지 않은 것","s":["우리나라의 사회복지정책 중 대상을 빈곤층으로 한정하는 정책이 아닌 것은?"],"c":["보육급여","생계급여","주거급여","의료급여","교육급여"],"a":1},{"id":"17-3-14","y":2017,"g":3,"n":14,"t":"재원·재정·조세·소득재분배","f":"옳지 않은 것","s":["공적 연금 재정관리 방식의 특징이 아닌 것은?"],"c":["적립방식은 가입자들 각자가 보험료를 납부하여 축적한적립기금으로 자신들의 노후를 보장하는 방식이다.","부과방식은 매년도 연금재정의 수입총액과 지출총액이균형을 유지할 수 있도록 운영하는 방식이다.","적립방식의 연금제도에서 수지상등의 원칙은 고려하지않는다.","부과방식의 연금제도는 도입 당시의 노인세대에게도 일정한 연금을 제공할 수 있다.","적립방식의 연금제도는 저축 기능을 토대로 운영된다."],"a":3},{"id":"17-3-15","y":2017,"g":3,"n":15,"t":"정책과정·결정모형·분석·평가","f":"옳지 않은 것","s":["정책평가에 관한 설명으로 옳지 않은 것은?"],"c":["정책평가는 정책효과성 제고에 기여할 수 있다.","평가지표 선택에서 정책 목표보다 측정 용이성을 우선한다.","정책평가는 정책 활동의 책임성을 높인다.","산출과 영향에 대한 평가방법으로 양적ㆍ질적 평가를 병행할 수 있다.","평가결과의 활용도를 높이는 기제를 마련하는 것이 바람직하다."],"a":2},{"id":"17-3-16","y":2017,"g":3,"n":16,"t":"정책 개념·가치·이념","f":"옳은 것 모두 고르기","s":["사회복지정책의 대안을 개발할 때, 활용할 수 있는 방법을 모두 고른 것은?","ㄱ. 과거의 정책을 검토한다.","ㄴ. 해외 정책사례를 검토한다.","ㄷ. 사회과학적 지식을 활용한다.","ㄹ. 직관적 방법을 활용한다."],"c":["ㄱ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"17-3-17","y":2017,"g":3,"n":17,"t":"정책 개념·가치·이념","f":"옳은 것 고르기","s":["최근 10년간 우리나라 사회복지정책의 변화에 관한 설명으로 옳은 것은?"],"c":["고용불안정의 심화로 사회보험제도의 기반이 견고해지고있다.","사회복지정책의 총 지출이 감소하는 추세에 있다.","근로빈곤층 지원제도가 약화되고 있다.","지방자치단체의 자체적인 복지사업이 증가하는 추세에있다.","복지정책 대상의 초점이 극빈층으로 변화하고 있다."],"a":4},{"id":"17-3-18","y":2017,"g":3,"n":18,"t":"정책 개념·가치·이념","f":"옳은 것 모두 고르기","s":["사회복지정책과 경제정책의 관계에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 경제정책은 사회복지정책에 영향을 준다.","ㄴ. 사회복지정책은 경제에 영향을 준다.","ㄷ. 경제정책과 사회복지정책은 서로 상쇄적인 역할을 할 수 있다.","ㄹ. 자본주의 경제체제 유지를 위하여 사회복지정책이 필요하다고 설명하기도 한다."],"c":["ㄱ","ㄱ, ㄷ","ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"17-3-19","y":2017,"g":3,"n":19,"t":"재원·재정·조세·소득재분배","f":"옳지 않은 것","s":["소득재분배에 관한 설명으로 옳지 않은 것은?"],"c":["소득재분배는 세대 내 재분배와 세대 간 재분배로 구분할 수 있다.","소득재분배는 시장의 기능에 따라 1차적으로 소득이 분배되는 것이다.","정부가 조세정책과 사회복지정책 등을 통해 실현한다.","개인의 자발적 기부와 같이 민간에 의해 이루어질 수도있다.","시간적 소득재분배는 한 개인이 안정된 근로생활 시기에서 불안정한 소득시기로 소득을 이전하는 것을 의미한다."],"a":2},{"id":"17-3-20","y":2017,"g":3,"n":20,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 모두 고르기","s":["국민연금의 연금보험료와 연금급여액에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 저소득층에게 유리하게 설계되어 있다.","ㄴ. 기본연금액의 균등부분에서 소득재분배기능이 나타난다.","ㄷ. 2008년 이후 급여수준을 결정하는 비례상수는 매년 0.5%씩 감소한다.","ㄹ. 연금액은 지급사유에 따라 기본연금액과 부양가족연금액을 기초로 산정한다."],"c":["ㄱ, ㄴ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"17-3-21","y":2017,"g":3,"n":21,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 모두 고르기","s":["노인장기요양보험의 급여에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 시설급여 제공기관에는 노인의료복지시설인 노인전문요양병원이 포함된다.","ㄴ. 노인장기요양보험에서는 재가급여를 시설급여에 우선한다.","ㄷ. 재가급여에는 방문요양, 방문목욕 등이 있다.","ㄹ. 특별현금급여에는 가족요양비 등이 있다."],"c":["ㄱ, ㄹ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"17-3-22","y":2017,"g":3,"n":22,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 모두 고르기","s":["국민건강보험료 경감대상자를 모두 고른 것은?","ㄱ. 휴직자","ㄴ. 60세인 자","ㄷ. 장애인복지법에 따라 등록한 장애인","ㄹ. 섬·벽지·농어촌 등 대통령령이 정하는 지역에 거주하는 자"],"c":["ㄱ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"17-3-23","y":2017,"g":3,"n":23,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 고르기","s":["우리나라의 산업재해보상보험에 관한 설명으로 옳은 것은?"],"c":["장해급여는 등급에 따라 연금이나 일시금으로 지급된다.","업무와 재해 사이의 인과관계와 상관없이 보상한다.","산업재해보상보험 급여수급권은 퇴직하면 소멸한다.","산업재해보상보험은 보건복지부장관이 관장한다.","각종 민간 사회단체는 산업재해보상보험의 임의적용사업장으로 분류된다."],"a":1},{"id":"17-3-24","y":2017,"g":3,"n":24,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳지 않은 것","s":["우리나라 자영업자의 고용보험에 관한 설명으로 옳지 않은 것은?(관련 규정 개정전 문제로 기존 정답은 4번 이었으며 여기서는 4번을 누르면 정답 처리 됩니다. 자세한 내용은 해설을 참고 하세요.)"],"c":["본인의 희망에 따라 가입이 가능하다.","구직급여를 받기 위해서는 재취업을 위해 적극적으로 노력하여야 한다.","자영업자도 직업능력개발훈련을 받을 수 있다.","구직급여는 90일∼240일까지 받을 수 있다.","보험료를 체납한 사람에게는 실업급여를 지급하지 아니할 수 있다."],"a":4},{"id":"17-3-25","y":2017,"g":3,"n":25,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["사회투자전략에 관한 설명으로 옳지 않은 것은?"],"c":["아동 세대에게 교육기회를 제공하여 미래의 근로능력을향상시킨다.","사회정책과 경제정책을 통합적으로 실시하여 사회적 목표를 추구한다.","사회투자모형에서 인적자원에 대한 투자는 결과의 평등을 지향한다.","인적자본의 근본적 육성을 통해 사회참여 촉진을 목표로한다.","경제활동 참여를 활성화한다."],"a":3},{"id":"18-3-1","y":2018,"g":3,"n":1,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["사회복지정책이 추구하는 목표와 추진 방법을 연결한 것으로 옳지 않은 것은?"],"c":["형평 - 실업급여","적절성 - 최저임금","기회의 평등 - 여성고용할당","적극적 자유 - 최저생활 보장","결과의 평등 - 드림스타트(Dream Start)"],"a":5},{"id":"18-3-2","y":2018,"g":3,"n":2,"t":"복지국가 발달사·유형·이론","f":"옳은 것 모두 고르기","s":["복지국가의 형성과 발달에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 독일의 재해보험법(1884)에서 재정은 노사가 반반씩 부담하였다.","ㄴ. 영국의 국민보험법(1911)은 건강보험과 실업보험으로 구성되었다.","ㄷ. 미국은 대공황을 경험하면서 총공급관리에 초점을 둔 국가정책을 도입하였다.","ㄹ. 스웨덴은 노동계급과 농민 간 적농동맹(red-green alliance)을 통해 복지국가 발전의 기틀을 마련하였다."],"c":["ㄱ,ㄴ","ㄱ,ㄹ","ㄴ,ㄷ","ㄴ,ㄹ","ㄷ,ㄹ"],"a":4},{"id":"18-3-3","y":2018,"g":3,"n":3,"t":"복지국가 발달사·유형·이론","f":"옳지 않은 것","s":["사회복지정책의 발달이론에 관한 설명으로 옳지 않은 것은?"],"c":["확산이론: 한 국가의 제도나 기술 혁신이 인근 국가에 영향을 준다.","음모이론: 사회복지정책에 대해 사회 안정과 질서 유지를위한 하나의 수단으로 보았다.","독점자본이론: 경제발전이 상당 수준에 이르면 사회복지발전정도가 유사하게 나타난다.","이익집단이론: 현대사회에서 귀속적 차이 등에 따른 집단들 간의 정치적 행위가 커지고 있다.","사회양심이론: 인도주의에 입각한 사회적 의무감이 사회복지정책을 확대할 수 있다."],"a":3},{"id":"18-3-4","y":2018,"g":3,"n":4,"t":"복지국가 발달사·유형·이론","f":"옳은 것 고르기","s":["복지국가의 유형화에 관한 설명으로 옳은 것은?"],"c":["조지와 월딩(V. George &P. Wilding)의 소극적 집합주의(reluctant collectivism): 자본주의 시장체계의 약점을 보완하기 위해 국가 개입 인정","윌렌스키와 르보(H. Wilensky &C. Lebeaux)의 제도적 모형(institutional model): 가족이나 시장 등 정상적인 통로가 적절히 기능하지 못할 때에만 보충적ㆍ임시적 기능 수행","미쉬라(R. Mishra)의 분화적 복지국가(differentiatedwelfare state): 경제집단의 상호의존성을 인식하여 사회적 협력형태로 제도화 추구","티트머스(R. Titmuss)의 산업성취수행 모형(industrialachievement performance model): 시장밖에서 욕구 원칙에 입각하여 보편적 서비스 제공","퍼니스와 틸톤(N. Furniss &T. Tilton)의 적극적 국가(positive state): 사회보험과 사회부조 실시를 위해 국가 개입 인정"],"a":1},{"id":"18-3-5","y":2018,"g":3,"n":5,"t":"복지국가 발달사·유형·이론","f":"옳지 않은 것","s":["에스핑 엔더슨(G. Esping-Andersen)의 복지국가 유형에 관한 설명으로 옳지 않은 것은?"],"c":["자유주의 복지국가는 시장의 효율성을 중시한다.","자유주의 복지국가는 저소득층에 초점을 맞춘다.","보수주의 복지국가는 개인책임과 자조의 원리를 강조한다.","보수주의 복지국가는 사회적 지위에 따라 사회보험 혜택의 차이가 있다.","사회민주주의 복지국가는 보편주의적 개입을 통해 가족과시장을 대체하는 특성을 갖고 있다."],"a":3},{"id":"18-3-6","y":2018,"g":3,"n":6,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 모두 고르기","s":["빈곤에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 사회적 배제는 빈곤·박탈과 관련된 사회문제를 나타내는 새로운 접근법이다.","ㄴ. 빈곤율(poverty rate)은 빈곤선 이하의 사람들 간의 소득분포 상태를 파악할 수 있는 방법이다.","ㄷ. 국민기초생활보장제도에서 생계급여 선정기준은 기준 평균소득 30% 이하의 가구이다.","ㄹ. 상대적 빈곤은 박탈지표방식과 소득·지출을 이용한 상대적 추정방식으로 측정할 수 있다."],"c":["ㄱ,ㄷ","ㄱ,ㄹ","ㄴ,ㄷ","ㄷ,ㄹ","ㄴ,ㄷ,ㄹ"],"a":2},{"id":"18-3-7","y":2018,"g":3,"n":7,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 모두 고르기","s":["소득불평등에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 10분위 분배율은 그 비율이 낮을수록 소득분배가 평등하다.","ㄴ. 지니계수가 0.3에서 0.4로 상승했다면 소득불평등이 완화될 것이다.","ㄷ. 5분위 배율은 상위 20%의 소득을 하위 20%의 소득으로 나눈 비율이다.","ㄹ. 로렌츠 곡선(Lorenz curve)이 45°선과 일치하면 소득분포가 완전히 균등하다."],"c":["ㄱ,ㄴ","ㄴ,ㄷ","ㄷ,ㄹ","ㄱ,ㄴ,ㄷ","ㄱ,ㄴ,ㄹ"],"a":3},{"id":"18-3-8","y":2018,"g":3,"n":8,"t":"복지국가 발달사·유형·이론","f":"옳지 않은 것","s":["서구 복지국가의 위기 이후 나타난 흐름에 관한 설명으로 옳지 않은 것은?"],"c":["공공서비스의 시장화","노동시장의 유연화정책","계층 간 소득 불평등 완화","복지의 투자ㆍ생산적 성격 강조","경제 활성화를 위한 법인세 인하"],"a":3},{"id":"18-3-9","y":2018,"g":3,"n":9,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["사회복지급여의 하나인 증서(voucher)에 관한 설명으로 옳지 않은 것은?"],"c":["현금급여에 비해 목표달성에 효과적이다.","현물급여에 비해 소비자의 선택권이 낮다.","현물급여에 비해 공급자 간 경쟁을 유도하는데 유리하다.","공급자가 소비자를 자의적으로 선택하는 현상이 발생할수 있다","현물급여에 비해 서비스에 대한 충분한 정보접근이 이루어져야 한다."],"a":2},{"id":"18-3-10","y":2018,"g":3,"n":10,"t":"재원·재정·조세·소득재분배","f":"옳은 것 고르기","s":["조세와 사회보험료 부과에 관한 설명으로 옳은 것은?"],"c":["사회보험료는 소득세에 비해 역진적이다.","사회보험료에는 조세와 같은 인적공제가 없어 저소득층에게 유리하다.","조세와 달리 소득상한선이 있는 사회보험료는 고소득층에게 불리하다.","조세와 달리 사회보험료는 국가의 반대급부가 특정화되어 있지 않다.","조세와 달리 사회보험료는 추정된 부담능력(assumedcapacity)을 고려한다."],"a":1},{"id":"18-3-11","y":2018,"g":3,"n":11,"t":"소득보장·공공부조·빈곤·불평등","f":"옳지 않은 것","s":["인구학적 기준에 따른 사회수당에 관한 설명으로 옳지 않은 것은?"],"c":["운영효율성이 높다.","사회통합에 기여할 수 있다.","낙인문제가 발생하지 않는다.","사회적 적절성 가치 실현 정도가 높다.","공공부조에 비해 근로동기 감소효과가 적다."],"a":4},{"id":"18-3-12","y":2018,"g":3,"n":12,"t":"재원·재정·조세·소득재분배","f":"옳지 않은 것","s":["사회복지 재원 중 이용료에 관한 설명으로 옳지 않은 것은?"],"c":["정부의 재정 부담을 완화하는 효과가 있다.","정액의 이용료는 소득재분배에 역진적이다.","서비스 이용자의 도덕적 해이를 방지할 수 있다.","저소득층의 서비스 접근성을 향상시킬 수 있다.","이용자의 권리의식을 높여 서비스 질을 향상시킬 수 있다."],"a":4},{"id":"18-3-13","y":2018,"g":3,"n":13,"t":"재원·재정·조세·소득재분배","f":"옳은 것 모두 고르기","s":["소득재분배 유형과 관련된 제도를 연결한 것 중 옳은 것을 모두 고른 것은?","ㄱ. 수직적 재분배 - 공공부조","ㄴ. 세대 내 재분배 - 개인연금","ㄷ. 수평적 재분배 - 아동수당","ㄹ. 세대 간 재분배 - 장기요양보험"],"c":["ㄹ","ㄱ,ㄷ","ㄴ,ㄹ","ㄱ,ㄴ,ㄷ","ㄱ,ㄴ,ㄷ,ㄹ"],"a":5},{"id":"18-3-14","y":2018,"g":3,"n":14,"t":"재원·재정·조세·소득재분배","f":"옳은 것 모두 고르기","s":["우리나라 중앙정부의 지방정부 재정지원방식에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 일반보조금(general grant)은 지역 간 재정격차를 해소하려는 데 목적이 있다.","ㄴ. 범주적 보조금(categorical grant)은 복지서비스의 전국적 통일성과 평등한 수준을 유지하는 데 적합하다.","ㄷ. 범주적 보조금(categorical grant)의 매칭 펀드는 지방정부의 재정운영을 어렵게 만들 수 있다."],"c":["ㄴ","ㄱ,ㄴ","ㄱ,ㄷ","ㄴ,ㄷ","ㄱ,ㄴ,ㄷ"],"a":5},{"id":"18-3-15","y":2018,"g":3,"n":15,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["사회복지정책의 특성에 관한 설명으로 옳지 않은 것은?"],"c":["가치판단적 특성을 가진다.","국민의 최저생활을 보장한다.","개인의 자립성을 증진시킨다.","능력에 비례한 배분을 원칙으로 한다.","경제의 자동안정장치(built-in-stabilizer) 기능을 수행한다."],"a":4},{"id":"18-3-16","y":2018,"g":3,"n":16,"t":"정책과정·결정모형·분석·평가","f":"옳지 않은 것","s":["정책결정 이론모형에 관한 설명으로 옳지 않은 것은?"],"c":["합리모형 : 인간의 이성과 합리성을 전제로 최선의 정책대안을 찾을 수 있다고 가정한다.","혼합모형 : 조직화된 무정부 상태 속에서 정책이 우연히결정된다고 가정한다.","최적모형 : 체계론적 시각에서 정책성과를 최적화하려는정책결정 모형이다.","만족모형 : 사람은 자신의 제한된 능력과 환경적 제약으로 모든 대안이 초래할 결과를 완전히 예측할 수는 없다.","점증모형 : 과거의 정책을 약간 수정한 정책결정이 이루어지고, 여론의 반응에 따라 정책수정을 반복한다."],"a":2},{"id":"18-3-17","y":2018,"g":3,"n":17,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 고르기","s":["사회보험과 비교할 때 공공부조가 갖는 장점은?"],"c":["높은 비용효과성","근로동기의 강화","재정 예측의 용이성","수평적 재분배의 효과","높은 수급률(take-up rate)"],"a":1},{"id":"18-3-18","y":2018,"g":3,"n":18,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 고르기","s":["우리나라의 국민기초생활보장제도에 관한 설명으로 옳은 것은?"],"c":["의료급여는 국가가 진료비를 지원하는 공공부조제도로서본인부담금이 없다.","희망키움통장과 내일키움통장은 자산형성지원사업이다.","증위소득은 가구 경상소득 증간값에 전년도 대비 가구소득 증가율을 곱하여 산정한다.","노숙인은 의료급여 2종 수급권자의 대상에 포함된다.","생계급여, 의료급여, 주거급여, 교육급여는 부양의무자기준이 적용된다."],"a":2},{"id":"18-3-19","y":2018,"g":3,"n":19,"t":"재원·재정·조세·소득재분배","f":"옳은 것 고르기","s":["우리나라의 근로장려세제에 관한 설명으로 옳은 것은?"],"c":["조세환급제도의 일종에 해당한다.","급여신청 접수는 행정복지센터에서 담당한다.","자격기준은 근로소득, 부양부모, 재산, 부채이다.","근로기준법 개정을 근거로 2006년부터 시행되었다.","신청방식은 신청주의와 직권주의가 혼용되고 있다."],"a":1},{"id":"18-3-20","y":2018,"g":3,"n":20,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳지 않은 것","s":["우리나라의 국민건강보험제도에 관한 설명으로 옳지 않은 것은? (문제 오류로 실제 시험에서는 3, 5번이 정답처리 되었습니다. 여기서는 3번을 누르면 정답 처리 됩니다.)"],"c":["본인부담상한액은 가입자의 소득수준 등에 따라 정한다.","월별 보험료의 총체납횟수가 6회 이상일 경우 급여가 제한될 수 있다.","외래의 본인부담금은 의료기관 및 질병의 종류에 따라달라진다.","직종조합, 지역조합 등이 통합되어 운영되고 있다.","진료비 지불방식 중 포괄수가제(diagnosis relatedgroups)를 2002년 7개 질병군에 한해 시행 하였다."],"a":3},{"id":"18-3-21","y":2018,"g":3,"n":21,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 고르기","s":["우리나라의 국민연금제도에 관한 설명으로 옳은 것은?"],"c":["실업기간 중에는 가입기간을 추가로 산입할 수 없다.","출산크레딧은 3명 이상의 자녀가 있을 때부터 가능하다.","농ㆍ어업인에 대해 연금보험료를 국가가 보조할 수 없다.","노령연금 수급권자가 소득활동을 하면 최대 3년 동안 연금액이 감액된다.","군복무자에게는 노령연금수급권 취득 시 6개월을 가입기간에 추가로 산입한다."],"a":5},{"id":"18-3-22","y":2018,"g":3,"n":22,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 고르기","s":["우리나라의 노인장기요양보험제도에 관한 설명으로 옳은 것은?"],"c":["단기보호는 시설급여에 해당한다.","가족에게 요양을 받을 때 지원되는 현금급여가 있다.","보험료는 건강보험료와 분리하여 징수한다.","장기요양인정의 유효기간은 3개월 이상으로 한다.","보험료율은 보건복지부령으로 정한다."],"a":2},{"id":"18-3-23","y":2018,"g":3,"n":23,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 모두 고르기","s":["산업재해보상보험제도의 도입에 관한 이론을 모두 고른 것은?","ㄱ. 배상책임이론","ㄴ. 사회적 타협이론","ㄷ. 산업위험이론","ㄹ. 사회비용최소화이론"],"c":["ㄱ,ㄷ","ㄴ,ㄹ","ㄱ,ㄴ,ㄹ","ㄱ,ㄷ,ㄹ","ㄴ,ㄷ,ㄹ"],"a":5},{"id":"18-3-24","y":2018,"g":3,"n":24,"t":"사회서비스·기타 분야(노인·아동·장애·주거·교육)","f":"옳은 것 고르기","s":["안토넨과 시필라(A. Antonnen &T. Sipila)의 사회서비스 제공체제 모형과 해당 국가의 연결이 옳은 것은?"],"c":["보충주의 모형 - 스페인","공공서비스 모형 - 독일","가족주의 모형 - 스웨덴","합리주의 모형 - 핀란드","자산조사ㆍ시장의존 모형 - 미국"],"a":5},{"id":"18-3-25","y":2018,"g":3,"n":25,"t":"복지국가 발달사·유형·이론","f":"옳은 것 고르기","s":["영국의 신빈민법(1834)과 우리나라의 현재 국민기초생활보장제도에서 공통으로 나타나는 원칙은?"],"c":["비례급여의 원칙","원외구제의 원칙","임금보조의 원칙","열등처우의 원칙","비부양의무의 원칙"],"a":4},{"id":"19-3-1","y":2019,"g":3,"n":1,"t":"전달체계·민간부문","f":"옳은 것 고르기","s":["우리나라 사회보장제도 운영주체의 책임에 관한 원칙으로 옳은 것은?"],"c":["사회보험은 국가의 책임으로 시행한다.","공공부조는 지방자치단체가 전적으로 책임지고 시행한다.","사회서비스는 지방자치단체만의 책임으로 시행한다.","국가는 사회보장에 관하여 민간단체의 참여를 제한한다.","사회보험에 드는 비용은 국가가 전담한다."],"a":1},{"id":"19-3-2","y":2019,"g":3,"n":2,"t":"정책 개념·가치·이념","f":"옳은 것 고르기","s":["우리나라 사회복지제도 중에서 보편주의 범주에 포함되는 것은?"],"c":["의료급여","생계급여","주거급여","실업급여","기초연금"],"a":4},{"id":"19-3-3","y":2019,"g":3,"n":3,"t":"전달체계·민간부문","f":"옳지 않은 것","s":["민간의 사회복지에 대한 우리나라 사회복지정책의 내용이 아닌 것은?"],"c":["국가와 지방자치단체는 국가 및 지방자치단체의 사회복지사업과 민간부문의 사회복지 증진활동이 원활하게 연계될 수 있도록 노력하여야 한다.","국가와 지방자치단체는 사회복지를 필요로 하는 사람의인권이 충분히 존중되는 방식으로 사회복지서비스를 제공하여야 한다.","보건복지부장관은 사회복지시설에서 제공하는 사회복지서비스의 최저기준을 마련하여야 한다.","국가나 지방자치단체가 설치한 사회복지시설은 사회복지법인이나 비영리법인에 위탁하여 운영하게 할 수 있다.","국가나 지방자치단체는 사회복지법인에 우선하여 사회복지시설을 설치ㆍ운영할 수 없다."],"a":5},{"id":"19-3-4","y":2019,"g":3,"n":4,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["반집합주의가 선호하는 가치 영역이 아닌 것은?"],"c":["개인","시장","평등","가족","경쟁"],"a":3},{"id":"19-3-5","y":2019,"g":3,"n":5,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 모두 고르기","s":["우리나라 산업재해보상보험제도에서 업무상 재해의 인정 기준을 모두 고른 것은?","ㄱ. 출퇴근 재해　　　　　ㄴ. 업무상 질병","ㄷ. 업무상 사고　　　　　ㄹ. 장애등급"],"c":["ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":2},{"id":"19-3-6","y":2019,"g":3,"n":6,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["평등에 관한 설명으로 옳지 않은 것은?"],"c":["보험료 수준에 따라 급여를 차등하는 것은 비례적 평등으로 볼 수 있다.","드림스타트(Dream Start) 사업은 기회의 평등을 반영하는것으로 볼 수 있다.","공공부조의 급여는 산술적 평등을, 열등처우의 원칙은 비례적 평등을 반영하는 것이다.","모든 사람에게 동등한 의료서비스를 제공하는 영국의 국민보건서비스(NHS)는 결과의 평등을 반영하는 것으로 볼 수 있다.","비례적 평등은 결과의 평등이다."],"a":5},{"id":"19-3-7","y":2019,"g":3,"n":7,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 고르기","s":["우리나라의 사회보장급여 중에서 공공부조에 해당되는 것은?"],"c":["장애연금","장해연금","장애인연금","상병보상연금","노령연금"],"a":3},{"id":"19-3-8","y":2019,"g":3,"n":8,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳지 않은 것","s":["국민연금의 가입기간 추가 산입에 관한 내용으로 옳지 않은 것은?"],"c":["병역법 에 따라 현역병으로 병역의무를 수행한 경우 가입기간을 추가 산입한다.","가입기간의 추가 산입에 따른 비용은 국가와 사용자가 2분의 1씩 부담한다.","자녀가 두 명인 경우 12개월을 추가 산입한다.","고용보험법 에 따른 구직급여를 받는 경우 구직급여를 받는 기간을 가입기간에 추가 산입한다.","사용자가 근로자의 임금에서 기여금을 공제하고 연금보험료를 내지 아니한 경우에는 그 내지 아니한 기간의 2분의 1에 해당하는 기간을 근로자의 가입기간으로 산입하되, 1개월 미만의 기간은 1개월로 한다."],"a":2},{"id":"19-3-9","y":2019,"g":3,"n":9,"t":"사회서비스·기타 분야(노인·아동·장애·주거·교육)","f":"옳지 않은 것","s":["사회복지서비스와 다른 공공서비스들과의 차별성을 설명한 것으로 옳지 않은 것은?"],"c":["사회복지서비스는 주로 이차분배에 관여한다.","사회복지서비스는 사람들의 욕구를 직접적으로 충족하려는 경향이 있다.","사회복지서비스는 개별적 욕구를 충족시키고자 한다.","사회복지서비스에서의 교환은 쌍방적이며, 급여에 대한대가를 반드시 지불해야 하는 이전(移轉)관계이다.","사회복지서비스는 사람들의 욕구를 주로 공식적 기구나제도를 통해 충족한다."],"a":4},{"id":"19-3-10","y":2019,"g":3,"n":10,"t":"사회서비스·기타 분야(노인·아동·장애·주거·교육)","f":"옳지 않은 것","s":["우리나라 아동복지정책의 내용이 아닌 것은?"],"c":["국가와 지방자치단체는 건전한 요보호아동의 국외입양을활성화하며, 아동이 입양 후의 가정생활에 원만하게 적응할 수 있도록 하여야 한다.","시ㆍ도지사 또는 시장ㆍ군수ㆍ구청장은 그 관할 구역에서 보호대상아동을 발견한 때에는 아동의최상의 이익을 위하여 보호조치를 하여야 한다.","교육부장관은 아동학대의 조기 발견과 신속한 보호조치를 위하여 장기결석 학생의 정보를 보건복지부장관과 공유하여야 한다.","영유아에 대한 보육의 내용 및 범위를 정하여 국가와 지방자치단체는 보육을 무상으로 한다.","국가 및 지방자치단체는 빈곤아동의 안전ㆍ건강 및 복지증진을 위하여 빈곤아동과 그 보호자 및 가정을 지원하기 위한 정책을 수립ㆍ시행하여야 한다."],"a":1},{"id":"19-3-11","y":2019,"g":3,"n":11,"t":"복지국가 발달사·유형·이론","f":"옳지 않은 것","s":["복지국가의 이론적 기초가 되는 케인즈(J. M. Keynes) 경제이론에 관한 설명으로 옳지 않은 것은?"],"c":["고용이 증가하면 소득이 증가하고, 소득이 증가하면 유효수요가 증가한다.","유효수요가 감소하면 경기불황을 가져오고, 소득이 감소한다.","저축이 증가하면 투자가 감소하고, 고용의 감소로 이어진다.","유효수요가 증가하면 경기호황을 가져와 투자의 증가로이어진다.","소득이 증가하면 저축이 감소하고, 투자의 감소로 이어진다."],"a":5},{"id":"19-3-12","y":2019,"g":3,"n":12,"t":"정책과정·결정모형·분석·평가","f":"옳은 것 모두 고르기","s":["킹돈(J. Kingdon)의 쓰레기통 모형에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 정책결정은 조직화된 상태 속에서 나타나는 몇 가지 흐름에 의하여 체계적으로 이루어진다.","ㄴ. 정치의 흐름, 문제의 흐름, 정책대안의 흐름이 각각 따로 존재하며, 그 과정의 참여자도 다르다.","ㄷ. 정책의 흐름 속에 떠다니던 정책대안이 연결되어 정책결정의 기회를 맞는다.","ㄹ. 정치의 흐름 및 문제의 흐름 각각에 의하여 또는 이들의 결합에 의하여 정책아젠다가 결정된다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"19-3-13","y":2019,"g":3,"n":13,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["사회적 기업에 관한 설명으로 옳지 않은 것은?"],"c":["사회적 목적 달성을 위하여 시장에서 영리활동을 하는조직이다.","사회적 기업에는 자활공동체, 협동조합, 사회적 회사 등이 있다.","사회적기업육성법 에 따라 사회적 기업을 인증한다.","사회적 기업은 사회복지사업법 에 따른 사회복지시설이다.","사회적 취약계층에 대한 일자리 창출 방안의 하나이다."],"a":4},{"id":"19-3-14","y":2019,"g":3,"n":14,"t":"사회서비스·기타 분야(노인·아동·장애·주거·교육)","f":"옳은 것 고르기","s":["사회서비스에 관한 설명으로 옳은 것은?"],"c":["사회복지기관의 운영을 지원하는 서비스이다.","이윤추구를 일차적 목적으로 한다.","사회적 욕구 충족에 초점을 둔다.","사회서비스 대상자의 노동시장 참여를 강조하지 않는다.","사회서비스의 수요자보다 공급자 지원을 증가시켰다."],"a":3},{"id":"19-3-15","y":2019,"g":3,"n":15,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["사회적 연대(social solidarity)에 관한 설명으로 옳지 않은 것은?"],"c":["개인과 사회 간 이해의 대립현상이 발생할 경우 개인은전체를 위하여 희생하여야 한다.","사회문제의 해결과정에서 조직 구성원 간 이타적 정신을필요로 한다.","특정한 사회적 위험으로 피해를 입은 소수를 위하여 다수가 그 비용을 공동으로 부담한다.","사회문제에 대한 집단적 대처수단으로서 상부상조의 정신을 바탕으로 한다.","공동체에 대한 개인의 연대 참여는 당사자의 자유의지에달려 있다."],"a":1},{"id":"19-3-16","y":2019,"g":3,"n":16,"t":"정책과정·결정모형·분석·평가","f":"옳은 것 모두 고르기","s":["사회복지정책 평가가 필요한 이유를 모두 고른 것은?","ㄱ. 문제해결을 위한 정책결정에 필요한 정보를 얻기 위함","ㄴ. 기존 정책의 개선에 필요한 정보를 얻기 위함","ㄷ. 정책의 정당성 근거를 확보하기 위함","ㄹ. 정책평가는 사회복지정책 이론의 형성에 기여함"],"c":["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"19-3-17","y":2019,"g":3,"n":17,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 고르기","s":["사회보험과 민영보험에 관한 설명으로 옳은 것은?"],"c":["사회보험급여는 철저한 보험수리원칙에 따라 납부한 보험료에 비례한다.","민영보험의 보험료는 평균적인 위험에 비례하여 결정된다.","사회보험은 가입자의 개별 위험에 따라 보험료가 책정된다.","사회보험의 보험료와 급여는 개별적 공평성과 사회적 적절성을 반영한다.","민영보험의 재정운영방식으로 적립방식과 부과방식이 있다."],"a":4},{"id":"19-3-18","y":2019,"g":3,"n":18,"t":"재원·재정·조세·소득재분배","f":"옳지 않은 것","s":["사회보험과 공공부조의 차이에 관한 설명으로 옳지 않은 것을 모두 고른 것은?","| | | 사회보험 | 공공부조 |","|---|---|---|---|","| ㄱ | 재원 | 사회보험료 | 조세 |","| ㄴ | 대상자 범주 | 보편주의 | 선별주의 |","| ㄷ | 권리성 | 추상적이고 약함 | 구체적이고 강함 |","| ㄹ | 수급자격 | 기여금 | 자산조사 |","| ㅁ | 특징 | 사후적 | 사전적 |"],"c":["ㄱ, ㄴ","ㄷ, ㅁ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄷ, ㄹ, ㅁ"],"a":2},{"id":"19-3-19","y":2019,"g":3,"n":19,"t":"소득보장·공공부조·빈곤·불평등","f":"옳지 않은 것","s":["빈곤 또는 불평등의 측정에 관한 설명으로 옳지 않은 것은?"],"c":["로렌츠곡선은 가로축에는 소득이 낮은 인구로부터 가장높은 순으로 비율을 누적하여 표시하고, 세로축에는 각 인구의 소득수준을 누적한 비율을 표시한 후 그 대응점을 나타낸 곡선이다.","지니계수가 1에 가까울수록 평등한 상태를 의미한다.","10분위 분배율에서는 수치가 클수록 평등한 상태를 의미한다.","5분위 분배율에서는 수치가 작을수록 평등한 상태를 의미한다.","빈곤율은 빈곤인구가 전체 인구에서 차지하는 비율로 정의된다."],"a":2},{"id":"19-3-20","y":2019,"g":3,"n":20,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 고르기","s":["국민기초생활보장제도에 관한 설명으로 옳은 것은? (문제 오류로 실제 시험에서는 모두 정답처리 되었습니다. 여기서는 1번을 누르면 정답 처리 됩니다.)"],"c":["차상위계층이란 소득인정액이 기준 중위소득의 100분의50 이하인 사람이다.","생계급여 수급권자의 선정기준은 기준 중위소득의 100분의 40 이상으로 한다.","주거급여는 보건복지부가 주관한다.","교육급여 수급권자의 선정기준은 기준 중위소득의 100분의 30 이상으로 한다.","생계급여는 타인의 가정에 위탁하여 실시할 수 없다."],"a":1},{"id":"19-3-21","y":2019,"g":3,"n":21,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["재분배와 파레토(Pareto) 효율에 관한 설명으로 옳지 않은 것은?"],"c":["파레토 개선이란 다른 사람들의 효용을 감소시키지 않으면서 어떤 사람들의 효용을 증가시키는 것이다.","파레토 효율의 정의상 소득재분배는 매우 효율적이다.","재분배를 통하여 빈곤층의 소득이 늘어나도 개인의 효용은 증가할 수 있다.","파레토 개선의 예로 민간의 자선활동을 들 수 있다.","파레토 효율은 완전경쟁시장에서 개인의 자발적인 선택을 전제로 한다."],"a":2},{"id":"19-3-22","y":2019,"g":3,"n":22,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳지 않은 것","s":["노인장기요양보험의 급여를 제공하는 장기요양기관이 아닌 것은?"],"c":["노인요양시설","주ㆍ야간보호시설","노인요양병원","단기보호시설","노인요양공동생활가정"],"a":3},{"id":"19-3-23","y":2019,"g":3,"n":23,"t":"사회서비스·기타 분야(노인·아동·장애·주거·교육)","f":"옳은 것 모두 고르기","s":["우리나라 비정규직 노동자에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 비정규직 고용은 노동자의 인적자본 형성 기회를 줄인다.","ㄴ. 정규직과 비정규직 노동자의 사회보험 가입률에는 차이가 없다.","ㄷ. 비정규직의 증가원인에는 기업 규제완화를 통한 노동의 유연성 증가가 포함된다."],"c":["ㄱ","ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":3},{"id":"19-3-24","y":2019,"g":3,"n":24,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 모두 고르기","s":["확정급여식 연금과 확정기여식 연금에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 확정급여식 연금의 재정은 완전적립방식에서 부과방식까지 다양하게 운용될 수 있다.","ㄴ. 확정기여식 연금의 급여액은 기본적으로 적립한 기여금과 기여금의 투자수익에 의해서 결정된다.","ㄷ. 확정급여식 연금제도에서는 투자위험에 대해서 개인이 전적으로 책임진다.","ㄹ. 확정기여식 연금제도에서는 물가상승, 경기침체 등의 위험을 사회 전체적으로 분산 대응하는 장점이 있다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1},{"id":"19-3-25","y":2019,"g":3,"n":25,"t":"정책 개념·가치·이념","f":"옳은 것 모두 고르기","s":["국가가 시장에 개입하는 근거로 옳은 것을 모두 고른 것은?","ㄱ. 긍정적 외부효과　　　　ㄴ. 부정적 외부효과","ㄷ. 비대칭적 정보　　　　　ㄹ. 역선택"],"c":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"20-3-1","y":2020,"g":3,"n":1,"t":"복지국가 발달사·유형·이론","f":"옳은 것 고르기","s":["사회복지역사에 관한 내용 중 연결이 옳은 것은?"],"c":["엘리자베스 구빈법(1601) - 열등처우의 원칙","길버트법(1782) - 원외구제 허용","비스마르크 3대 사회보험 - 질병보험, 실업보험, 노령폐질보험","미국 사회보장법(1935) - 보편적 의료보험제도 도입","베버리지 보고서(1942) - 소득비례방식의 사회보험 도입"],"a":2},{"id":"20-3-2","y":2020,"g":3,"n":2,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 고르기","s":["빈곤과 불평등 측정에 관한 설명으로 옳은 것은?"],"c":["완전 평등 사회에서 로렌츠 곡선은 45° 각도의 직선과 거리가 가장 멀어진다.","지니계수의 최대값은 1, 최소값은 -1이다.","빈곤갭은 빈곤선 이하에 속하는 인구가 전체인구에서 차지하는 비율을 의미한다.","빈곤율은 빈곤선과 실제소득과의 격차를 반영한다.","센(Sen) 지수는 빈곤집단 내의 불평등 정도를 반영한다."],"a":5},{"id":"20-3-3","y":2020,"g":3,"n":3,"t":"정책 개념·가치·이념","f":"옳은 것 고르기","s":["사회복지의 가치 중 ‘자유’에 관한 설명으로 옳은 것은?"],"c":["자유지상주의 관점에서는 적극적 자유를 옹호한다.","소극적 자유 보장을 위해서는 국가의 역할이 많을수록 좋다.","적극적 자유의 관점에서 자유의 침해는 개인에게 필요한자원이나 기회를 박탈당한 것을 의미한다.","적극적 자유의 관점에서는 임차인의 주거 안정을 위해 임대인의 자유를 제약할 수 없다.","개인의 행동에 대한 외적 강제가 없는 상태는 적극적 자유의 핵심이다."],"a":3},{"id":"20-3-4","y":2020,"g":3,"n":4,"t":"복지국가 발달사·유형·이론","f":"옳지 않은 것","s":["사회복지 발달이론에 관한 설명으로 옳지 않은 것은?"],"c":["사회양심이론 - 사회복지는 이타주의가 제도화된 것임","수렴이론 - 산업화를 이룬 나라들은 사회복지제도를 도입하게 됨","시민권론 - 마샬(T. H. Marshall)은 사회권(Social Right)을 복지권(Welfare Right)이라 함","권력자원론 - 사회복지정책은 권력 엘리트의 산물임","구조기능주의론 - 사회복지는 산업화, 도시화에 따른 사회문제에 대한 적응의 결과임"],"a":4},{"id":"20-3-5","y":2020,"g":3,"n":5,"t":"소득보장·공공부조·빈곤·불평등","f":"옳지 않은 것","s":["빈곤의 개념에 관한 설명으로 옳지 않은 것은?"],"c":["절대적 빈곤은 육체적 효율성을 유지하기 위한 최소한의생활필수품을 소비하지 못하는 상태이다.","최저생계비를 계측하여 빈곤선을 설정하는 방식은 절대적빈곤개념을 적용한 것이다.","국민기초생활보장제도는 절대적 빈곤개념을 적용하고 있다.","상대적 빈곤은 한 사회의 평균적인 생활수준과 비교하여빈곤을 규정한다.","중위소득을 활용하여 상대적 빈곤선을 설정할 수 있다."],"a":3},{"id":"20-3-6","y":2020,"g":3,"n":6,"t":"소득보장·공공부조·빈곤·불평등","f":"옳지 않은 것","s":["최근 논의되는 사회복지정책 이슈들에 관한 설명으로 옳지 않은 것은?","는 ‘기본소득’ 도입의 필요성과 관련되어 있다."],"c":["생태주의 관점에서는 복지국가의 ‘성장’ 패러다임을 옹호한다.","4차 산업혁명, 일자리 감소, 소득 양극화 심화 등의 이슈","민달팽이유니온, 복지국가청년네트워크 등은 청년 세대운동 조직이 출현한 사례에 해당한다.","‘마을만들기’ 사업은 주민참여형 복지라고 할 수 있다.","‘커뮤니티 케어’는 탈시설화와 관련되어 있다."],"a":1},{"id":"20-3-7","y":2020,"g":3,"n":7,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["사회적 배제의 개념적 특성에 관한 설명으로 옳지 않은 것은?"],"c":["개인과 집단의 다차원적 불이익에 초점을 두고, 다층적대책을 촉구한다.","특정 집단이 경험하는 배제는 정태적 사건이 아니라 동태적 과정으로 본다.","사회적 배제 개념은 열등처우의 원칙으로부터 등장하였다.","소득의 결핍 그 자체보다 다양한 배제 행위가 발생하는과정에 초점을 둔다.","사회적 관계망으로부터의 단절과 차별 문제를 제기한다."],"a":3},{"id":"20-3-8","y":2020,"g":3,"n":8,"t":"재원·재정·조세·소득재분배","f":"옳지 않은 것","s":["사회복지 재원에 관한 설명으로 옳지 않은 것은?"],"c":["일반세 중 재산세의 계층 간 소득재분배 효과가 가장 크다.","목적세는 사용목적이 정해져 있어 재원 안정성이 높다.","이용료는 저소득층의 서비스 이용을 저해할 수 있다.","고용주가 부담하는 사회보험료는 수직적 소득재분배 성격을 지닌다.","기업이 직원들에게 제공하는 기업복지는 소득역진적 성격이 강하다."],"a":1},{"id":"20-3-9","y":2020,"g":3,"n":9,"t":"복지국가 발달사·유형·이론","f":"순서 나열","s":["복지혼합(Welfare-Mix)의 유형 중 서비스 이용자의 선택권이 작은 것에서 큰 순서로 나열한 것은?"],"c":["세제혜택 - 계약 - 증서","세제혜택 - 증서 - 계약","증서 - 계약 - 세제혜택","계약 - 증서 - 세제혜택","계약 - 세제혜택 - 증서"],"a":4},{"id":"20-3-10","y":2020,"g":3,"n":10,"t":"재원·재정·조세·소득재분배","f":"순서 나열","s":["이용료(본인부담금) 부과 방식에 따른 소득재분배 효과가 작은 것에서 큰 순서로 나열한 것은?"],"c":["정액제 - 정률제 - 연동제(Sliding Scale)","정률제 - 연동제(Sliding Scale) - 정액제","정률제 - 정액제 - 연동제(Sliding Scale)","연동제(Sliding Scale) - 정액제 - 정률제","연동제(Sliding Scale) - 정률제 - 정액제"],"a":1},{"id":"20-3-11","y":2020,"g":3,"n":11,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 모두 고르기","s":["실업보험을 민간 시장에서 제공할 때 발생할 수 있는 문제점을 모두 고른 것은?","ㄱ. 역의 선택(Adverse Selection)이 나타난다.","ㄴ. 가입자의 도덕적 해이가 발생할 가능성이 크다.","ㄷ. 위험발생이 상호의존적이기 때문에 보험료율 계산이 어렵다.","ㄹ. 무임승차자 문제가 발생한다."],"c":["ㄹ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"20-3-12","y":2020,"g":3,"n":12,"t":"사회서비스·기타 분야(노인·아동·장애·주거·교육)","f":"옳은 것 모두 고르기","s":["베버리지(W. Beveridge)가 사회보장 프로그램의 성공을 위해 제시한 전제조건을 모두 고른 것은?","ㄱ. 아동(가족)수당　　　　　　　　ㄴ. 완전고용","ㄷ. 포괄적 의료 및 재활서비스　　ㄹ. 최저임금"],"c":["ㄹ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"20-3-13","y":2020,"g":3,"n":13,"t":"사회서비스·기타 분야(노인·아동·장애·주거·교육)","f":"옳은 것 고르기","s":["우리나라 사회복지정책의 대상 선정에 관한 설명으로 옳은 것은?"],"c":["소득이나 자산을 조사하여 대상을 선정하는 것은 보편주의 원칙에 부합한다.","아동수당은 인구학적 기준을 적용한 제도이다.","장애수당은 전문가의 진단을 고려하지 않는다.","긴급복지지원제도는 보편주의 원칙에 부합한다.","기초연금의 대상 선정기준에는 부양의무자 유무가 포함된다."],"a":2},{"id":"20-3-14","y":2020,"g":3,"n":14,"t":"재원·재정·조세·소득재분배","f":"옳은 것 모두 고르기","s":["사회보험료와 조세에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 정률의 사회보험료는 소득세에 비해 역진적이다.","ㄴ. 사회보험료는 조세에 비해 징수에 대한 저항이 적다.","ㄷ. 소득세와 사회보험료 모두 소득이 높은 사람이 더 많이 부담한다.","ㄹ. 조세는 지불능력(Capacity to Pay)과 관련되어 있다."],"c":["ㄱ, ㄴ","ㄱ. ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"20-3-15","y":2020,"g":3,"n":15,"t":"정책과정·결정모형·분석·평가","f":"옳은 것 고르기","s":["사회복지정책을 분석하는 접근방법에 관한 설명으로 옳은 것은?"],"c":["산물분석은 특정 정책이 실행된 이후 그 결과를 분석ㆍ평가하는 데 관심을 둔다.","산물분석은 정책이 형성되는 사회정치적 맥락을 고찰한다.","성과분석은 정책결정이라는 정책활동의 결과물에 대한내용을 분석하는 것이다.","과정분석은 정책 기획과정(Planning Process)을 거쳐 이끌어 낸 여러 정책대안을 분석한다.","과정분석은 정책사정(Policy Assessment)이 어떻게 이루어지는지를 이해하기 위한 목적에서 이루어진다."],"a":5},{"id":"20-3-16","y":2020,"g":3,"n":16,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳지 않은 것","s":["산업재해보상보험제도에 관한 설명으로 옳지 않은 것은?","단 소속 기관에 업무상질병판정위원회를 둔다."],"c":["근로복지공단은 보험급여를 결정하고 지급한다.","업무상의 재해란 업무상의 사유에 따른 근로자의 부상ㆍ질병ㆍ장해 또는 사망을 말한다.","직장 내 괴롭힘, 고객의 폭언 등으로 인한 업무상 정신적 스트레스가 원인이 되어 발생한 질병은 업무상 재해로 인정되지 않는다.","업무상 질병의 인정 여부를 심의하기 위하여 근로복지공","국민건강보험공단이 보험료를 징수한다."],"a":3},{"id":"20-3-17","y":2020,"g":3,"n":17,"t":"전달체계·민간부문","f":"옳지 않은 것","s":["민영화에 관한 설명으로 옳지 않은 것은?"],"c":["1980년대 등장한 신자유주의와 관련이 있다.","정부가 공급하는 재화와 서비스 비용을 절감하기 위해도입되었다.","소비자 선호와 소비자 선택을 중시한다.","경쟁을 유발시켜 서비스 품질을 향상시키고자 한다.","상업화를 통해 취약계층의 서비스 접근성이 높아진다."],"a":5},{"id":"20-3-18","y":2020,"g":3,"n":18,"t":"소득보장·공공부조·빈곤·불평등","f":"옳지 않은 것","s":["국민기초생활보장제도에 관한 설명으로 옳지 않은 것은?"],"c":["국민기초생활보장제도는 보충성의 원칙에 기반하고 있다.","「북한이탈주민의 보호 및 정착지원에 관한 법률」상의북한이탈주민과 그 가족은 의료급여 2종 수급권자에 속한다.","급여는 개별가구 단위로 실시하되, 특히 필요하다고 인정하는 경우에는 개인 단위로 실시할 수 있다.","수급권자와 그 친족, 그 밖의 관계인은 관할 시장ㆍ군수ㆍ구청장에게 수급권자에 대한 급여를 신청할 수 있다.","생계급여는 수급자의 소득인정액 등을 고려하여 차등지급할 수 있다."],"a":2},{"id":"20-3-19","y":2020,"g":3,"n":19,"t":"소득보장·공공부조·빈곤·불평등","f":"옳지 않은 것","s":["공공부조, 사회보험, 사회수당의 특성에 관한 설명으로 옳지 않은 것은?"],"c":["공공부조는 다른 두 제도에 비해 권리성이 약하다.","사회수당은 수평적 재분배 효과가 있다.","사회보험의 급여조건은 보험료 기여조건과 함께 사회적위험에 직면해야 하는 조건이 부가된다.","사회수당은 기여 여부와 무관하게 지급된다.","운영효율성은 세 제도 중 공공부조가 가장 높다."],"a":5},{"id":"20-3-20","y":2020,"g":3,"n":20,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳지 않은 것","s":["국민건강보험제도에 관한 설명으로 옳지 않은 것은?"],"c":["사립학교교원의 보험료는 가입자 본인, 사용자, 국가가분담한다.","직장가입자의 보수월액은 직장가입자가 지급받는 보수를기준으로 하여 산정한다.","직장가입자의 보험료율은 건강보험정책심의위원회에서심의ㆍ의결한다.","부가급여로 임신ㆍ출산 진료비, 장제비, 상병수당을 지급하고 있다.","국민건강보험공단의 회계연도는 정부의 회계연도에 따른다."],"a":4},{"id":"20-3-21","y":2020,"g":3,"n":21,"t":"재원·재정·조세·소득재분배","f":"옳지 않은 것","s":["우리나라의 근로장려세제에 관한 설명으로 옳지 않은 것은?"],"c":["근로장려금 신청 접수는 보건복지부에서 담당한다.","근로능력이 있는 빈곤층에 대해 근로의욕을 고취한다.","미국의 EITC를 모델로 하였다.","근로장려금은 근로소득 외에 재산보유상태 등을 반영하여 지급한다.","근로빈곤층에게 실질적 혜택을 제공하여 빈곤탈출을 지원한다."],"a":1},{"id":"20-3-22","y":2020,"g":3,"n":22,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 고르기","s":["고용보험제도에 관한 설명으로 옳은 것은?"],"c":["실업급여를 받을 권리는 양도 또는 압류하거나 담보로제공할 수 없다.","구직급여의 급여일수는 대기기간을 포함하여 산정한다.","육아휴직 시작일로부터 3개월까지는 월 통상임금의 100분의 50에 해당하는 금액을 지급한다.","자영업자인 피보험자의 실업급여에는 구직급여, 연장급여, 조기재취업 수당이 포함된다.","65세 이후에 자영업을 개시한 사람에게도 구직급여를 적용한다."],"a":1},{"id":"20-3-23","y":2020,"g":3,"n":23,"t":"소득보장·공공부조·빈곤·불평등","f":"사례·제시문 판단","s":["국민기초생활보장 대상 가구의 월 생계급여액은? (단, 다음에 제시된 2019년 기준으로 계산한다.)","- 전세주택에 거주하는 부부(45세, 42세)와 두 자녀(15세, 12세)로 구성된 가구로 소득인정액은 월 100만원으로 평가됨(부양의무자는 없음)","- 2019년 가구 규모별 기준 중위소득은 다음과 같이 가정함","1인 : 1,700,000원, 2인 : 2,900,000원, 3인 : 3,700,000원, 4인 : 4,600,000원"],"c":["0원","380,000원","700,000원","1,380,000원","3,600,000원"],"a":2},{"id":"20-3-24","y":2020,"g":3,"n":24,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 고르기","s":["노인장기요양보험제도에 관한 설명으로 옳은 것은?"],"c":["장기요양보험사업의 보험자는 보건복지부장관이다.","등급판정에 따른 장기요양인정의 유효기간은 최소 6개월이상으로서 대통령령으로 정한다.","통합 징수한 장기요양보험료와 건강보험료를 각각의 독립회계로 관리하여야 한다.","재가 급여비용은 수급자가 해당 장기요양급여비용의 100분의 20을 부담한다.","수급자는 시설급여와 특별현금급여를 중복하여 받을 수있다."],"a":3},{"id":"20-3-25","y":2020,"g":3,"n":25,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 고르기","s":["기초연금제도에 관한 설명으로 옳은 것은?"],"c":["65세 이상 모든 고령자에게 제공하는 사회수당이다.","무기여방식의 노후 소득보장제도이다.","기초연금액의 산정 시 국민연금급여액을 고려하지 않는다.","기초연금액은 가구유형, 소득과 상관없이 동일하다.","기초연금의 수급권자가 사망하면 유족급여를 지급한다."],"a":2},{"id":"21-3-1","y":2021,"g":3,"n":1,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["사회복지정책의 원칙과 기능에 관한 설명으로 옳지 않은 것은?"],"c":["능력에 비례한 배분을 원칙으로 한다.","소득을 재분배하는 기능을 한다.","경제의 자동안정화 기능을 한다.","국민의 최저생활을 보장하는 기능을 한다.","사회통합과 정치적 안정화 기능을 한다."],"a":1},{"id":"21-3-2","y":2021,"g":3,"n":2,"t":"정책 개념·가치·이념","f":"사례·제시문 판단","s":["다음 설명에 해당하는 것은?","비경합적이고 비배제적인 성격을 지니고 있기 때문에 구성원이 각각 생산에 기여했는지 여부에 관계없이 모든 구성원이 활용할 수 있는 재화를 말한다."],"c":["비대칭적 정보","공공재","외부효과","도덕적 해이","역선택"],"a":2},{"id":"21-3-3","y":2021,"g":3,"n":3,"t":"복지국가 발달사·유형·이론","f":"옳지 않은 것","s":["사회복지정책 발달이론에 관한 설명으로 옳지 않은 것은?"],"c":["사회양심론은 인도주의에 기초하고 있다.","음모이론은 사회복지정책을 사회안정과 질서유지를 위한통제수단으로 보는 이론이다.","확산이론은 한 지역의 사회복지정책이 다른 지역으로 전파되어 나간다는 이론이다.","시민권론은 참정권, 공민권, 사회권 순으로 발전했다고 설명한다.","산업화이론은 사회복지정책발달은 그 사회의 산업화 정도에 따라 결정된다고 보는 이론이다."],"a":4},{"id":"21-3-4","y":2021,"g":3,"n":4,"t":"복지국가 발달사·유형·이론","f":"옳지 않은 것","s":["신빈민법(New Poor Law)에 관한 설명으로 옳지 않은 것은?"],"c":["1832년 왕립위원회(Royal Commission)의 조사를 토대로1834년에 제정되었다.","국가의 도움을 받는 사람의 처우는 스스로 벌어서 생활하는 최하위 노동자의 생활수준보다높지 않아야 한다는 원칙을 내용으로 하고 있다.","원외구제를 인정하였다.","구빈행정체계를 통일시키고자 하였다.","빈민을 가치 있는 빈민과 가치 없는 빈민으로 분류하였다."],"a":3},{"id":"21-3-5","y":2021,"g":3,"n":5,"t":"복지국가 발달사·유형·이론","f":"옳은 것 모두 고르기","s":["에스핑-앤더슨(Esping-Andersen)의 복지국가 유형에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 복지국가 유형을 탈상품화, 계층화 등을 기준으로 분류하였다.","ㄴ. 자유주의복지국가는 자산조사에 의한 공공부조의 비중이 큰 국가이다.","ㄷ. 보수주의복지국가는 사회보험에 의존하지 않는다.","ㄹ. 사회민주주의복지국가는 보편적 원칙과 사회권을 통한 탈상품화 효과가 크다."],"c":["ㄱ, ㄴ","ㄱ, ㄹ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"21-3-6","y":2021,"g":3,"n":6,"t":"사회서비스·기타 분야(노인·아동·장애·주거·교육)","f":"옳지 않은 것","s":["새로운 사회적 위험(new social risk)에 관한 설명이 아닌 것은?"],"c":["여성들의 유급노동시장으로의 참여 증가로 일과 가정의양립 문제가 확산되고 있다.","노인인구 증가로 인한 복지비용 증가와 노인 돌봄이 중요한 문제로 대두되고 있다.","노동시장의 불안정으로 근로빈곤층이 증가하고 있다.","국가 간의 노동인구 이동이 줄어들고 있다.","새로운 사회적 위험으로 인한 수요증가에 필요한 복지재정의 부족현상이 심화되고 있다."],"a":4},{"id":"21-3-7","y":2021,"g":3,"n":7,"t":"정책 개념·가치·이념","f":"옳은 것 고르기","s":["사회복지정책의 가치에 관한 설명으로 옳은 것은?"],"c":["비례적 평등은 개인의 능력, 업적, 공헌에 따라 사회적 자원을 분배하는 것을 의미한다.","적극적 자유는 타인의 간섭 혹은 의지로부터의 자유를 의미한다.","결과의 평등을 달성하기 위해 부자들의 소득을 재분배하더라도 소극적 자유를 침해하지 않는다.","결과가 평등하다면 과정의 불평등은 상관없다는 것이 기회의 평등이다.","기회의 평등은 적극적인 평등의 개념이다."],"a":1},{"id":"21-3-8","y":2021,"g":3,"n":8,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 고르기","s":["빈곤의 기준을 정하는 방법에 관한 설명으로 옳은 것은?"],"c":["전(全)물량 방식은 식료품비를 계산하고 엥겔수의 역을 곱해서 빈곤선을 기준으로 측정하는 방식이다.","기초생활보장제도의 수급자 선정기준은 상대적 빈곤 개념을 반영하고 있다.","라이덴 방식은 상대적 빈곤 측정방식이다.","반물량 방식은 소득분배 분포 상에서 하위 10%나 20%를빈곤한 사람들로 간주한다.","중위소득 또는 평균소득을 근거로 빈곤선을 측정하는 것은 절대적 빈곤 측정방식이다."],"a":2},{"id":"21-3-9","y":2021,"g":3,"n":9,"t":"전달체계·민간부문","f":"옳지 않은 것","s":["길버트(N. Gilbert)와 스펙트(H. Specht) 등의 사회복지정책 분석에 관한 설명으로 옳지 않은 것은?"],"c":["과정분석은 정책형성에 영향을 미치는 사회정치적ㆍ기술적ㆍ방법적 변수를 중심으로 분석하는 접근방법이다.","산물분석은 정책선택에 관련된 여러 가지 쟁점을 분석하는 접근방법이다.","성과분석은 실행된 정책이 낳은 결과를 기술하고 분석하는 접근방법이다.","산물분석은 할당, 급여, 전달체계, 재정 차원으로 구분하여 분석한다.","과정분석은 연구자의 주관을 배제해야 한다."],"a":5},{"id":"21-3-10","y":2021,"g":3,"n":10,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳지 않은 것","s":["사회보험제도의 급여와 급여형태에 관한 설명으로 옳지 않은 것은?"],"c":["고용보험법상 구직급여는 현물급여이다.","산업재해보상보험법상 요양급여는 현물급여이다.","노인장기요양보험법상 재가급여는 현물급여이다.","국민연금법상 노령연금은 현금급여이다.","국민건강보험법상 장애인 보조기기에 대한 보험급여는현금급여이다."],"a":1},{"id":"21-3-11","y":2021,"g":3,"n":11,"t":"정책 개념·가치·이념","f":"옳은 것 모두 고르기","s":["선별주의에 근거한 제도에 해당하는 것을 모두 고른 것은?","ㄱ. 장애인연금　　　　ㄴ. 아동수당","ㄷ. 기초연금　　　　　ㄹ. 의료급여"],"c":["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"21-3-12","y":2021,"g":3,"n":12,"t":"전달체계·민간부문","f":"옳은 것 모두 고르기","s":["사회복지전달체계에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 공급자와 수요자가 가격기구를 매개로 상호작용하는 것을 원칙으로 한다.","ㄴ. 공급자와 수요자를 이어주는 매개체 역할을 한다.","ㄷ. 클라이언트에게 사회복지서비스를 제공하기 위한 조직 및 인력이다.","ㄹ. 공급자들을 공간적으로 분산배치하면 전달체계에 대한 접근성을 높일 수 있다."],"c":["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":5},{"id":"21-3-13","y":2021,"g":3,"n":13,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["사회복지정책의 수급조건에 해당하지 않는 것은?"],"c":["연령","자산조사","기여 여부","진단평가","최종 학력"],"a":5},{"id":"21-3-14","y":2021,"g":3,"n":14,"t":"재원·재정·조세·소득재분배","f":"옳은 것 고르기","s":["사회복지정책의 재정에 관한 설명으로 옳은 것은?"],"c":["한국의 사회복지정책 재원은 주로 민간 기부금에 의존한다.","사회복지재정이 수행하는 기능 가운데 하나는 소득재분배이다.","조세가 역진적일수록 소득재분배의 기능이 크다.","한국의 조세부담률은 OECD 회원국가의 평균보다 높다.","사회복지재원으로서 이용료는 연동제보다 정액제일 때소득재분배 효과가 크다."],"a":2},{"id":"21-3-15","y":2021,"g":3,"n":15,"t":"정책 개념·가치·이념","f":"옳은 것 고르기","s":["사회복지전달체계에서 제공되는 재화나 서비스의 속성 등에 관한 설명으로 옳은 것은?"],"c":["사회복지 재화나 서비스는 단일한 전달체계에서 독점적으로 제공하는 것이 바람직하다.","공공재적인 성격이 강한 재화나 서비스는 민간에서 제공하는 것이 바람직하다.","사회복지의 재화나 서비스는 정보의 불완전성으로 인해소비자들의 합리적 선택에 차이가 난다.","공공부문의 전달체계는 경쟁체제가 이루어지기 때문에효율적이다.","사회복지 재화나 서비스는 수급자들에 의한 오용과 남용의 문제가 발생하지 않는다."],"a":3},{"id":"21-3-16","y":2021,"g":3,"n":16,"t":"소득보장·공공부조·빈곤·불평등","f":"옳지 않은 것","s":["자활지원사업에 관한 설명으로 옳지 않은 것은?"],"c":["자활급여는 근로능력이 있는 국민기초생활보장 수급자의자활을 위한 각종 지원을 제공하는 급여이다.","자활기업은 조합 또는「부가가치세법」상의 사업자로 한다.","자활기관협의체의 구성 및 운영 등에 필요한 사항은 보건복지부령으로 정한다.","자산형성지원으로 형성된 자산은 수급자의 소득환산액산정 시 이를 포함한다.","지역자활센터는 참여자의 자활의욕 고취를 위한 교육을행한다."],"a":4},{"id":"21-3-17","y":2021,"g":3,"n":17,"t":"사회서비스·기타 분야(노인·아동·장애·주거·교육)","f":"옳은 것 모두 고르기","s":["아동학대의 예방 및 방지에 관한 설명으로 옳은 것을 모두 고른 것은?(문제 오류로 가답안 발표시 4번이 답안으로 발표되었으나, 확정답안 발표시 전항 정답 처리 되었습니다. 여기서는 가답안인 4번을 누르면 정답 처리 됩니다.)","ㄱ. 아동학대를 예방하고 수시로 신고를 받을 수 있도록 아동보호전문기관은 긴급전화(1391)를 설치하여야 한다.","ㄴ. 아동학대의 예방과 방지에 관한 관심을 높이기 위하여 아동학대 예방의 날을 지정하였다.","ㄷ. 지역아동보호전문기관은 아동학대 신고접수, 현장조사 및 응급보호 등의 역할을 한다.","ㄹ. 아동보호전문기관의 장은 피해아동의 가족에게 상담, 교육 및 의료적·심리적 치료 등의 필요한 지원을 제공하여야 한다."],"c":["ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"21-3-18","y":2021,"g":3,"n":18,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["긴급복지지원제도에 관한 설명으로 옳지 않은 것은?"],"c":["주소득자가 사망, 가출, 행방불명, 구금시설에 수용되는등의 사유로 소득을 상실한 경우 긴급지원대상자가 될 수 있다.","긴급지원은 위기상황에 처한 사람에게 일시적으로 신속하게 지원하는 것을 기본원칙으로 한다.","긴급지원의 종류에는 금전 또는 현물 등의 직접지원과민간기관ㆍ단체와의 연계 등의 지원이 있다.","사회복지사업법에 따른 사회복지시설의 종사자는 긴급지원을 요청할 수 있다.","국민기초생활 보장법에 따른 지원을 받고 있는 경우에긴급복지지원법을 우선 적용한다."],"a":5},{"id":"21-3-19","y":2021,"g":3,"n":19,"t":"정책과정·결정모형·분석·평가","f":"옳지 않은 것","s":["사회복지운동에 관한 설명으로 옳지 않은 것은?"],"c":["민간이 사회복지정책의 방향ㆍ내용에 대해 특정한 견해를 가지고 이를 관철시키기 위한 실천이다.","여러 사회복지정책 실천 중의 하나라고 할 수 있다.","사회복지시설 종사자는 사회복지운동의 주체가 될 수 없다.","사회복지운동을 통해 특정 사회복지정책이 선거정치의의제가 되도록 촉구할 수 있다.","1990년대 국민최저선확보운동, 사회복지입법청원운동 등이 사회복지운동의 예이다."],"a":3},{"id":"21-3-20","y":2021,"g":3,"n":20,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳지 않은 것","s":["사회보험제도에 관한 설명으로 옳지 않은 것은?","거하여 결정된다."],"c":["사회보험제도는 위험의 분산이라는 보험기술을 사용한다.","사회보험 급여를 받을 권리 여부는 자산조사 결과에 근","한국의 사회보험제도는 의무가입 원칙을 적용한다.","사회보험은 위험이전과 위험의 광범위한 공동분담에 기초하고 있다.","사회보험은 피보험자의 욕구에 기초하지 않고 사전에 결정된 급여를 제공한다."],"a":2},{"id":"21-3-21","y":2021,"g":3,"n":21,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 모두 고르기","s":["연금제도의 적립방식과 부과방식에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 적립방식은 부과방식에 비해 세대 내 소득재분배 효과가 크다.","ㄴ. 부과방식은 적립방식에 비해 자본축적 효과가 크다.","ㄷ. 부과방식은 적립방식에 비해 기금확보가 더 용이하다."],"c":["ㄱ","ㄴ","ㄷ","ㄱ, ㄴ","ㄱ, ㄷ"],"a":1},{"id":"21-3-22","y":2021,"g":3,"n":22,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 고르기","s":["고용보험제도에 관한 설명으로 옳은 것은?"],"c":["고용보험료는 고용보험위원회에서 부과ㆍ징수한다.","고용보험의 가입대상은 모든 국민과 국내에 거주하는 외국인이다.","고용보험 구직급여는 30일 동안의 구직기간에는 지급되지 않는다.","보험가입자는 사업주와 근로자 모두 포함한다.","고용보험의 재원은 사용자가 단독으로 부담한다."],"a":4},{"id":"21-3-23","y":2021,"g":3,"n":23,"t":"재원·재정·조세·소득재분배","f":"옳은 것 모두 고르기","s":["소득재분배에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 조세를 재원으로 하는 공공부조제도에서 일반적으로 나타난다.","ㄴ. 사회적 취약계층을 대상으로 하는 사회복지서비스는 수직적 재분배 효과가 있다.","ㄷ. 위험 미발생집단에서 위험 발생집단으로 소득이 이전되는 것은 수평적 소득재분배에 해당한다.","ㄹ. 재원조달 측면에서 부조방식이 보험방식보다 재분배 효과가 크다."],"c":["ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"21-3-24","y":2021,"g":3,"n":24,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 고르기","s":["국민건강보험제도에 관한 설명으로 옳은 것은?"],"c":["본인의 의사에 따라 임의가입할 수 있다.","조합방식 의료보험제도가 통합방식으로 전환되어 국민건강보험제도로 변경되었다.","건강보험료는 수직적 소득재분배 기능을 하지 않는다.","국민건강보험의 보험자는 보건복지부이다.","직장가입자의 보험료는 평균보수월액에 보험료율을 곱하여 얻은 금액이다."],"a":2},{"id":"21-3-25","y":2021,"g":3,"n":25,"t":"정책과정·결정모형·분석·평가","f":"옳은 것 고르기","s":["사회복지정책 평가유형에 관한 설명으로 옳은 것은?"],"c":["과정평가는 정책집행 후에 평가하는 활동을 말한다.","결과평가는 정책집행 중간의 평가로 전략 설계의 수정보완을 하지 못한다.","총괄평가는 정책이 집행되고 난 후 정책이 사회에 미친영향을 평가하는 것이다.","효율성평가는 정책집행의 결과에 따라 정책의 목적이 달성되었는지를 평가하는 것이다.","효과성평가는 정책의 효과를 투입된 자원과 대비하는 평가이다."],"a":3},{"id":"22-3-1","y":2022,"g":3,"n":1,"t":"정책 개념·가치·이념","f":"옳은 것 고르기","s":["조지와 윌딩(V. George &P. Wilding, 1976; 1994)의 사회복지모형에서 복지국가의 확대를 가장 지지하는 이념은?"],"c":["신우파","반집합주의","마르크스주의","페이비언 사회주의","녹색주의"],"a":4},{"id":"22-3-2","y":2022,"g":3,"n":2,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["사회복지정책의 가치에 관한 설명으로 옳지 않은 것은?"],"c":["소극적 자유는 자신이 원하는 것을 할 수 있는 자유를 강조한다.","평등을 추구하는 사회복지정책은 선택의 자유를 제한한다는 비판이 있다.","형평성이 신빈민법의 열등처우원칙에 적용되었다.","적절성은 일정한 수준의 신체적⋅정신적 복리를 제공하는것을 의미한다.","기회의 평등의 예로 사회적으로 취약한 아동을 위한 적극적 교육 지원을 들 수 있다."],"a":1},{"id":"22-3-3","y":2022,"g":3,"n":3,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 고르기","s":["국민연금의 연금크레딧제도 중 가장 최근에 시행된 것은?"],"c":["실업크레딧","고용크레딧","양육크레딧","군복무크레딧","출산크레딧"],"a":1},{"id":"22-3-4","y":2022,"g":3,"n":4,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 모두 고르기","s":["진료비 지불방식 중 행위별수가제와 포괄수가제에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 행위별수가제는 의료기관의 과잉진료를 유도할 수 있다.","ㄴ. 행위별수가제에서는 의료진의 진료행위에 대한 자율성이 확보된다.","ㄷ. 포괄수가제는 주로 발생빈도가 높은 질병군에 적용한다.","ㄹ. 포괄수가제를 적용함으로써 환자의 본인부담금이 감소할 수 있다."],"c":["ㄱ","ㄱ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"22-3-5","y":2022,"g":3,"n":5,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳지 않은 것","s":["우리나라의 노인장기요양보험에 관한 설명으로 옳지 않은 것은?"],"c":["가족의 부담을 덜어줌으로써 국민의 삶의 질을 향상하는것을 목적으로 한다.","노인장기요양보험기금과 국민건강보험기금은 통합하여 관리한다.","노인장기요양보험료는 국민건강보험료와 통합하여 징수한다.","65세 이상의 노인은 소득수준과 상관없이 적용대상자이다.","재가급여를 시설급여에 우선하여 제공하여야 한다."],"a":2},{"id":"22-3-6","y":2022,"g":3,"n":6,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 모두 고르기","s":["우리나라의 고용보험에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 직업능력개발 훈련을 실시하는 사업주를 지원할 수 있다.","ㄴ. 예술인은 고용보험 가입대상이 아니다.","ㄷ. 실업 신고를 한 이후에 질병·부상 또는 출산으로 취업이 불가능하며 구직활동을 할 수 없는 경우 상병급여를 지급할 수 있다.","ㄹ. 고용안정 및 직업능력개발사업의 보험료는 사업주와 근로자가 공동으로 부담한다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":2},{"id":"22-3-7","y":2022,"g":3,"n":7,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳지 않은 것","s":["사회보험과 민영보험의 차이점에 관한 설명으로 옳지 않은 것은?"],"c":["사회보험은 현금급여를 원칙으로 하고, 민영보험은 현물급여를 원칙으로 한다.","사회보험은 대부분 국가 또는 공법인이 운영하지만 민영보험은 사기업이 운영한다.","사회보험은 강제로 가입되지만 민영보험은 임의로 가입한다.","사회보험은 국가가 주로 독점하지만 민영보험은 사기업들이 경쟁한다.","사회보험은 사회적 적절성을 강조하지만 민영보험은 개별형평성을 강조한다."],"a":1},{"id":"22-3-8","y":2022,"g":3,"n":8,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳지 않은 것","s":["우리나라의 의료급여에 관한 설명으로 옳지 않은 것은?"],"c":["의료급여 수급권자는 1종과 2종으로 구분한다.","의료급여기금에는 지방자치단체의 출연금도 포함된다.","의료급여 수급권자의 1촌 직계혈족 및 그 배우자는 원칙적으로 부양의무가 있다.","국민기초생활보장제도 수급자 중 보장시설에서 급여를 받는 자는 2종수급자로 구분된다.","｢약사법｣에 따라 개설등록된 약국은 의료급여를 실시하는의료기관이다."],"a":4},{"id":"22-3-9","y":2022,"g":3,"n":9,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳지 않은 것","s":["우리나라 산업재해보상보험의 급여가 아닌 것은?"],"c":["요양급여","상병수당","유족급여","장례비","직업재활급여"],"a":2},{"id":"22-3-10","y":2022,"g":3,"n":10,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 고르기","s":["우리나라의 국민기초생활보장제도에 관한 설명으로 옳은 것은?"],"c":["의료급여 선정기준은 기준 중위소득의 100분의 50 이상으로 한다.","교육급여 선정기준은 기준 중위소득의 100분의 40 이상으로 한다.","“수급권자”란 ｢국민기초생활 보장법｣에 따른 급여를 받는 사람을 말한다.","국민기초생활보장제도에서의 “보장기관”은 사회복지서비스를 제공하는 사회복지기관을 말한다.","사회복지 전담공무원은 수급권자의 동의를 받아 수급권자에 대한 급여를 직권으로 신청할 수 있다."],"a":5},{"id":"22-3-11","y":2022,"g":3,"n":11,"t":"복지국가 발달사·유형·이론","f":"옳지 않은 것","s":["에스핑-앤더슨(G. Esping-Andersen)의 세 가지 복지체제에 관한 설명으로 옳지 않은 것은?"],"c":["보수주의 복지체제 국가는 가족의 중요성을 강조한다.","자유주의 복지체제 국가에서 탈상품화 정도가 가장 높다.","사회민주주의 복지체제 국가는 보편주의를 강조한다.","보수주의 복지체제 국가의 예로 독일, 프랑스, 이탈리아가 있다.","자유주의 복지체제 국가의 사회보장급여는 잔여적 특성이 강하다."],"a":2},{"id":"22-3-12","y":2022,"g":3,"n":12,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["사회복지 재화나 서비스를 국가가 제공해야 하는 이유가 아닌 것은?"],"c":["사회복지의 공공재적 성격","전염병에 대한 치료의 긍정적 외부효과 발생","질병의 위험에 대한 보험방식의 역선택 문제 해결","경제성장의 낙수효과 발생","의료서비스에 대한 정보의 비대칭 문제 해결"],"a":4},{"id":"22-3-13","y":2022,"g":3,"n":13,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 고르기","s":["우리나라 사회복지제도의 급여자격 조건에 관한 설명으로 옳은 것은?"],"c":["국민연금은 소득수준 하위 70%를 기준으로 급여자격이부여되므로 자산조사 방식이 적용된다.","노인장기요양보험제도는 요양등급을 판정하여 급여를 제공하므로 진단적 구분이 적용된다.","아동수당은 전체 아동이 적용대상이 아니므로 선별주의제도이다.","국민기초생활보장제도는 부양의무자 조건을 완화하였으므로 보편주의 제도이다.","장애인연금은 모든 장애인에게 지급하는 보편주의 제도이다."],"a":2},{"id":"22-3-14","y":2022,"g":3,"n":14,"t":"복지국가 발달사·유형·이론","f":"옳은 것 모두 고르기","s":["사회복지 역사에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 길버트법은 작업장 노동의 비인도적인 문제에 대응하여 원외구제를 실시하였다.","ㄴ. 신빈민법은 특권적 지주계급을 위한 법으로 구빈업무를 전국적으로 통일하였다.","ㄷ. 미국의 사회보장법(1935)은 연방정부의 책임을 축소하고 지방정부의 책임을 확대하였다.","ㄹ. 비스마르크는 독일제국의 사회통합을 위해 사회보험을 도입하였다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄷ","ㄷ, ㄹ"],"a":3},{"id":"22-3-15","y":2022,"g":3,"n":15,"t":"전달체계·민간부문","f":"옳은 것 모두 고르기","s":["우리나라의 건강보험제도를 할당, 급여, 전달체계, 재정의 영역으로 구분한 것이다. 내용 연결이 옳은 것을 모두 고른 것은?","ㄱ. 할당 - 기여조건","ㄴ. 급여 - 현금급여, 현물급여","ㄷ. 전달체계 - 민간전달체계, 공공전달체계","ㄹ. 재정 - 보험료, 국고보조금, 이용료"],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"22-3-16","y":2022,"g":3,"n":16,"t":"소득보장·공공부조·빈곤·불평등","f":"옳지 않은 것","s":["우리나라의 사회보장기본법에 근거한 사회보장제도가 아닌 것은?"],"c":["고용보험","국민연금","최저임금제","국민기초생활보장","보육서비스"],"a":3},{"id":"22-3-17","y":2022,"g":3,"n":17,"t":"재원·재정·조세·소득재분배","f":"옳지 않은 것","s":["기업복지의 장점에 해당하지 않는 것은?"],"c":["조세방식보다 재분배효과가 크다.","노사관계의 안정화 기능을 수행한다.","근로의욕을 고취하여 생산성이 향상하는 효과가 있다.","기업에 대한 사회적 이미지를 제고하는 기능이 있다.","기업의 입장에서 임금을 높여주는 것보다 조세부담의 측면에 유리하다."],"a":1},{"id":"22-3-18","y":2022,"g":3,"n":18,"t":"전달체계·민간부문","f":"옳은 것 고르기","s":["사회복지 전달체계에서 민간 영리기관이 사회서비스를 전달하는 사례는?"],"c":["지역자활센터가 사회적기업을 창업하는 사례","지방자치단체가 장애인복지관을 설치하고 민간위탁하는사례","광역지방자치단체가 사회서비스원을 설치하는 사례","사회복지법인이 지역아동센터를 운영하는 사례","개인 사업자가 노인요양시설을 운영하는 사례"],"a":5},{"id":"22-3-19","y":2022,"g":3,"n":19,"t":"정책과정·결정모형·분석·평가","f":"옳은 것 모두 고르기","s":["정책결정이론 모형에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 합리모형은 인간의 이성과 합리성을 믿고 주어진 상황에서 목표 달성을 극대화하는 최선의 정책대안을 찾아낼 수 있다고 본다.","ㄴ. 점증모형은 조직화된 무정부상태 속에서 점진적으로 질서를 찾아가는 과정을 정책결정과정으로 설명한다.","ㄷ. 쓰레기통모형은 문제의 흐름, 정책대안의 흐름, 정치의 흐름이 우연히 결합하여 정책의 창이 열릴 때 정책이 결정된다고 본다.","ㄹ. 혼합모형은 합리모형과 최적모형을 혼합하여 최선의 정책결정에 도달하는 정책결정모형이다."],"c":["ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1},{"id":"22-3-20","y":2022,"g":3,"n":20,"t":"소득보장·공공부조·빈곤·불평등","f":"옳지 않은 것","s":["빈곤의 개념에 관한 설명으로 옳지 않은 것은?"],"c":["상대적 빈곤은 한 사회의 평균적인 생활수준을 기준으로정한다.","절대적 빈곤은 최소한의 생필품을 구입하는데 필요한 비용으로 정한다.","반물량 방식은 모든 항목의 생계비를 계산하지 않고 엥겔계수를 활용하여 생계비를 추정한다.","중위소득의 50%를 빈곤선으로 책정할 경우, 사회구성원99명을 소득액 순으로 나열하여 이 중 50번째 사람의 소득 50%를 빈곤선으로 한다.","상대적 박탈은 인간의 기본적 욕구의 기준을 생물학적요인에만 초점을 둔다."],"a":5},{"id":"22-3-21","y":2022,"g":3,"n":21,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 모두 고르기","s":["소득불평등과 빈곤 측정에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 로렌츠곡선의 가로축은 소득을 기준으로 하위에서 상위 순서로 모든 인구의 누적분포를 표시한다.","ㄴ. 지니계수는 불평등도가 증가할수록 수치가 커져 가장 불평등한 상태는 1이다.","ㄷ. 빈곤율은 모든 빈곤층의 소득을 빈곤선 수준으로 끌어올리는 데에 필요한 총소득으로 빈곤의 심도를 나타낸다.","ㄹ. 5분위 배율에서는 수치가 작을수록 평등한 상태를 나타낸다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ"],"a":4},{"id":"22-3-22","y":2022,"g":3,"n":22,"t":"정책 개념·가치·이념","f":"옳은 것 고르기","s":["사회복지 급여 형태에 관한 설명으로 옳은 것은?"],"c":["현금급여는 사회적 통제를 강조한다.","현물급여는 자기결정권을 강조한다.","바우처는 공급자에게 보조금을 직접 지원한다.","기회를 제공하는 프로그램의 예로 장애인의무고용제를들 수 있다.","소비자 선택권은 현금급여, 바우처, 현물급여 순서로 높아진다."],"a":4},{"id":"22-3-23","y":2022,"g":3,"n":23,"t":"복지국가 발달사·유형·이론","f":"옳지 않은 것","s":["사회복지정책의 발달이론에 관한 설명으로 옳지 않은 것은?"],"c":["산업화론 - 농경사회에서 산업사회로 변화하면서 사회문제가 발생하였고, 그 대책으로 사회복지정책이 발달하였다.","권력자원론 - 복지국가 발전의 중요 변수들은 노동조합의 중앙집중화 정도, 노동자 정당의 영향력 등이다.","수렴이론 - 사회적 양심과 이타주의의 확대에 따라 모든국가는 복지국가로 수렴한다.","시민권론 - 마샬(T. H. Marshall)에 따르면 시민권은 공민권, 참정권, 사회권 순서로 발전하였고, 사회복지정책은 사회권이 발달한 결과이다.","국가중심적 이론 - 적극적 행위자로서 국가를 강조하고사회복지정책의 발전을 국가 관료제의 영향으로 설명한다."],"a":3},{"id":"22-3-24","y":2022,"g":3,"n":24,"t":"재원·재정·조세·소득재분배","f":"옳은 것 고르기","s":["소득재분배에 관한 설명으로 옳은 것은?"],"c":["소득재분배는 1차적으로 시장을 통해서 발생한다.","세대 내 재분배에서는 한 세대에서 다음 세대로 소득이이전된다.","수직적 재분배의 예로 공공부조제도를 들 수 있다.","수평적 재분배는 누진적 재분배의 효과가 가장 크다.","세대 간 재분배는 적립방식을 통해 운영된다."],"a":3},{"id":"22-3-25","y":2022,"g":3,"n":25,"t":"정책 개념·가치·이념","f":"옳은 것 고르기","s":["사회투자전략에 관한 설명으로 옳은 것은?"],"c":["인적자원에 대한 투자는 결과의 평등을 목적으로 한다.","사회적 약자 집단에 대한 현금이전을 중시한다.","현재 아동세대에 대한 선제적 투자를 중시한다.","사회정책과 경제정책을 분리한 전략이다.","소득재분배와 소비 지원을 강조한다."],"a":3},{"id":"23-3-1","y":2023,"g":3,"n":1,"t":"복지국가 발달사·유형·이론","f":"옳은 것 고르기","s":["1942년 베버리지 보고서에서 규정한 5대 악에 해당되지 않는 것은?"],"c":["무지","질병","산업재해","나태","결핍(궁핍)"],"a":3},{"id":"23-3-2","y":2023,"g":3,"n":2,"t":"정책과정·결정모형·분석·평가","f":"옳지 않은 것","s":["사회복지정책 평가가 갖는 특징으로 옳지 않은 것은?"],"c":["정치적이다.","실용적이다.","종합학문적이다.","기술적이다.","가치중립적이다."],"a":5},{"id":"23-3-3","y":2023,"g":3,"n":3,"t":"정책 개념·가치·이념","f":"옳은 것 고르기","s":["롤스(J. Rawls)의 정의론(공정으로서의 정의)에 관한 설명으로 옳은 것은?"],"c":["제1원칙은 기본적 자유에 대한 동등한 권리이다.","기회의 균등보다는 결과의 평등이 더 중요하다.","사회경제적 불평등은 어떠한 경우라도 허용될 수 없다.","최대다수의 최대행복을 추구한다.","정당한 소유와 합법적인 이전은 정의로운 결과를 가져온다."],"a":1},{"id":"23-3-4","y":2023,"g":3,"n":4,"t":"전달체계·민간부문","f":"옳은 것 모두 고르기","s":["다음 중 사회복지정책이 필요한 이유를 모두 고른 것은?","ㄱ. 국민의 생존권 보장　　　　ㄴ. 사회통합의 증진","ㄷ. 개인의 자립성 증진　　　　ㄹ. 능력에 따른 분배"],"c":["ㄱ, ㄴ","ㄴ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ"],"a":4},{"id":"23-3-5","y":2023,"g":3,"n":5,"t":"복지국가 발달사·유형·이론","f":"옳은 것 고르기","s":["사회복지정책의 발달이론 중 의회민주주의의 정착과 노동자계급의 조직화된 힘을 강조하는 이론은?"],"c":["산업화론","권력자원이론","확산이론","사회양심이론","국가중심이론"],"a":2},{"id":"23-3-6","y":2023,"g":3,"n":6,"t":"복지국가 발달사·유형·이론","f":"옳지 않은 것","s":["영국 구빈제도의 역사에 관한 설명으로 옳지 않은 것은?"],"c":["1601년 엘리자베스 빈민법은 빈민을 노동능력 있는 빈민,노동능력 없는 빈민, 빈곤 아동으로 분류하였다.","1662년 정주법은 부랑자들의 자유로운 이동을 금지하였다.","1782년 길버트법은 원외구제를 허용하였다.","1795년 스핀햄랜드법은 열등처우의 원칙을 명문화하였다.","1834년 신빈민법은 노동능력이 있는 빈민에 대한 원외구제를 폐지하였다."],"a":4},{"id":"23-3-7","y":2023,"g":3,"n":7,"t":"정책 개념·가치·이념","f":"사례·제시문 판단","s":["조지(V. George)와 윌딩(P. Wilding)이 제시한 이념 중 소극적 집합주의에 관한 설명으로 옳은 것은?","를 고착화시키는 역할을 한다."],"c":["시장에 대한 국가개입을 최소화하고 개인의 소극적 자유를 극대화하는 것이 바람직하다.","개인의 적극적 자유를 보장하기 위해서는 철저한 계획경제와 생산수단의 국유화가 필요하다.","환경과 생태의 관점에서 자본주의의 성장과 복지국가의확대는 지속가능하지 않다.","복지국가는 노동의 성(gender) 분업과 자본주의 가부장제","시장의 약점을 보완하고 불평등과 빈곤에 대응하기 위하여 실용적인 국가개입이 필요하다."],"a":5},{"id":"23-3-8","y":2023,"g":3,"n":8,"t":"복지국가 발달사·유형·이론","f":"옳지 않은 것","s":["에스핑-안데르센(G. Esping-Andersen)의 복지국가 유형에 관한 설명으로 옳지 않은 것은?"],"c":["탈상품화 정도, 계층화 정도 등에 따라 복지국가를 3가지유형으로 분류하였다.","탈상품화는 돌봄이나 서비스 부담을 가족에게 의존하지않는 정도를 의미한다.","사회민주주의 복지국가는 탈상품화 정도가 높고 보편적사회서비스를 제공한다.","보수주의 복지국가에서 사회보험은 직업집단 등에 따라분절적으로 운영된다.","자유주의 복지국가는 공공부조의 역할이 크고 탈상품화정도는 낮다."],"a":2},{"id":"23-3-9","y":2023,"g":3,"n":9,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 고르기","s":["우리나라 의료보장제도(국민건강보험, 의료급여)에서 시행하고 있는 것 중 의료비 절감효과와 관련이 가장 적은 것은?"],"c":["포괄수가제","의료급여 사례관리제도","건강보험급여 심사평가제도","행위별 수가제","본인일부부담금"],"a":4},{"id":"23-3-10","y":2023,"g":3,"n":10,"t":"재원·재정·조세·소득재분배","f":"옳지 않은 것","s":["조세특례제한법상의 '총급여액 등'을 기준으로 근로장려금 산정방식을 다음과 같이 설계하였다고 가정할 때, 총급여액 등에 따른 근로장려금 계산 결과로 옳지 않은 것은?","- 총급여액 등 1,000만원 미만: 근로장려금 = 총급여액 등 × 100분의 20","- 총급여액 등 1,000만원 이상 1,200만원 미만: 근로장려금 200만원","- 총급여액 등 1,200만원 이상 3,200만원 미만: 근로장려금 = 200만원 - (총급여액 등 - 1,200만원) × 100분의 10","※ 재산, 가구원 수, 부양아동 수, 소득의 종류 등 다른 조건은 일체 고려하지 않음"],"c":["총급여액 등이 500만원 일 때, 근로장려금 100만원","총급여액 등이 1,100만원 일 때, 근로장려금 200만원","총급여액 등이 1,800만원 일 때, 근로장려금 150만원","총급여액 등이 2,200만원 일 때, 근로장려금 100만원","총급여액 등이 2,700만원 일 때, 근로장려금 50만원"],"a":3},{"id":"23-3-11","y":2023,"g":3,"n":11,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 모두 고르기","s":["최근 10년간 국민기초생활보장제도의 변화에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 수급자격 중 부양의무자 기준은 완화되었다.","ㄴ. 기준중위소득은 2015년 이후 지속적으로 인상되었다.","ㄷ. 교육급여가 신설되었다.","ㄹ. 근로능력평가 방식이 변화되었다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄹ","ㄱ, ㄴ, ㄹ"],"a":5},{"id":"23-3-12","y":2023,"g":3,"n":12,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 고르기","s":["사회보험과 비교하여 공공부조제도의 장점으로 옳은 것은?"],"c":["대상효율성이 높다.","가입률이 높다.","수급자에 대한 낙인을 예방할 수 있다.","행정비용이 발생하지 않는다.","수평적 재분배 효과가 크다."],"a":1},{"id":"23-3-13","y":2023,"g":3,"n":13,"t":"사회서비스·기타 분야(노인·아동·장애·주거·교육)","f":"옳은 것 고르기","s":["우리나라가 시행하고 있는 취약계층 취업지원 제도에 관한 설명으로 옳은 것은?"],"c":["노인 일자리사업의 총괄 운영기관은 대한노인회이다.","장애인고용의무제도는 모든 사업체에 적용된다.","맞춤형 취업지원서비스로 취업성공패키지가 운영되고 있다.","모든 국민기초생활보장 수급자는 반드시 자활사업에 참여해야 한다.","고령자를 채용하지 않는 기업은 정부에 부담금을 납부해야 한다."],"a":3},{"id":"23-3-14","y":2023,"g":3,"n":14,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 고르기","s":["우리나라 고용보험과 산업재해보상보험에 관한 설명으로 옳은 것은?"],"c":["소득활동 중 발생할 수 있는 소득상실 위험에 대한 사회안전망이라는 공통점을 가지고 있다.","구직급여는 구직활동 여부와 관계없이 지급된다.","고용형태 및 근로시간에 관계없이 모든 근로자는 두 보험의 적용을 받는다.","장해급여는 산업재해를 입은 모든 근로자에게 지급된다.","두 보험의 가입자 보험료율은 동일하다."],"a":1},{"id":"23-3-15","y":2023,"g":3,"n":15,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 모두 고르기","s":["다음 중 상대적 빈곤선을 설정(측정)하는 방식으로 옳은 것을 모두 고른 것은?","ㄱ. 중위소득의 일정 비율","ㄴ. 라이덴(Leyden) 방식","ㄷ. 반물량 방식","ㄹ. 라운트리(Rowntree) 방식","ㅁ. 타운센드(Townsend) 방식"],"c":["ㄱ, ㄴ","ㄱ, ㅁ","ㄴ, ㅁ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ"],"a":2},{"id":"23-3-16","y":2023,"g":3,"n":16,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳지 않은 것","s":["우리나라 사회보험의 운영 원리에 관한 설명으로 옳지 않은 것은?"],"c":["수익자 부담 원칙을 전제로 하고 있다.","사회보험은 수평적 또는 수직적 재분배 기능이 있다.","가입자의 보험료율은 사회보험 종류별로 다르다.","사회보험급여는 피보험자와 보험자 간 계약에 의해 규정된 법적 권리이다.","모든 사회보험 업무가 통합되어 1개 기관에서 운영된다."],"a":5},{"id":"23-3-17","y":2023,"g":3,"n":17,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 모두 고르기","s":["우리나라 사회보험방식의 공적연금에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 국민연금과 특수직역연금으로 구분하며 운영되고 있다.","ㄴ. 국민연금이 가장 먼저 시행되었다.","ㄷ. 2022년 12월말 기준 공적연금 수급개시연령은 동일하다.","ㄹ. 가입자의 노령(퇴직), 장애(재해), 사망으로 인한 소득중단 시 급여를 지급한다."],"c":["ㄱ, ㄴ","ㄱ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":2},{"id":"23-3-18","y":2023,"g":3,"n":18,"t":"전달체계·민간부문","f":"옳지 않은 것","s":["길버트(N. Gilbert)와 테렐(P. Terrell)이 주장한 사회복지전달체계 재구조화 전략으로 옳지 않은 것은?"],"c":["수급자 수요 강화","기관들의 동일 장소 배치","사례별 협력","관료적 구조로부터의 전문가 이탈","시민 참여"],"a":1},{"id":"23-3-19","y":2023,"g":3,"n":19,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["사회복지정책의 주체 및 그 역할에 관한 설명으로 옳지 않은 것은?"],"c":["긍정적 외부효과가 큰 영역은 민간부문이 담당하는 것이바람직하다.","사회복지정책의 주체는 국가, 지방자치단체, 공공복지기관 등 다양하다.","공공재적 성격이 강한 재화나 서비스는 공공부문이 개입하는 것이 바람직하다.","정보의 비대칭성이 강한 영역은 정부가 개입하는 것이바람직하다.","민간복지기관은 정부 및 공공기관에 의하여 권한을 위임받은 경우 사회복지정책의 주체가 될 수 있다."],"a":1},{"id":"23-3-20","y":2023,"g":3,"n":20,"t":"정책과정·결정모형·분석·평가","f":"옳은 것 고르기","s":["사회복지정책분석에서 산물(product) 분석의 한계에 관한 설명으로 옳은 것은?"],"c":["정해진 틀에 따라 사회복지정책 내용을 분석함으로써 적용된 사회적 가치를 평가하기 쉽다.","사회복지정책의 방향성을 제시하기가 용이하다.","현행 사회복지정책에서 배제되고 차별받는 사람들의 욕구를 파악하기 쉽다.","산물분석 결과는 기존의 사회주류적 입장을 대변할 가능성이 높다.","사회복지정책의 구체적인 대안을 담아내기 쉽다."],"a":4},{"id":"23-3-21","y":2023,"g":3,"n":21,"t":"전달체계·민간부문","f":"옳은 것 고르기","s":["길버트(N. Gilbert)와 테렐(P. Terrell)이 제시한 사회적 효과성에 관한 설명으로 옳은 것은?"],"c":["수급자격을 얻기 위해 개인의 특수한 욕구가 선별적인세밀한 조사에 노출될 수밖에 없다.","사람들이 사회의 평등한 구성원으로 어느 정도나 대우받는가에 따라 판단하는 것이다.","시민권은 수급권을 얻을 수 있는 자격이 안 된다.","급여를 신청할 때 까다로운 행정절차가 반드시 필요하다.","사회적 효과성은 단기적 비용절감을 목표로 한다."],"a":2},{"id":"23-3-22","y":2023,"g":3,"n":22,"t":"정책과정·결정모형·분석·평가","f":"옳은 것 모두 고르기","s":["정책결정 모형 중 드로어(Y. Dror)가 제시한 최적모형에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 합리모형과 점증모형의 단순혼합이 아닌 정책성과를 최적화하려는 데 초점을 둔다.","ㄴ. 합리적 요소와 초합리적 요소를 다 고려하는 질적 모형이다.","ㄷ. 초합리성의 구체적인 달성 방법에 대한 명확한 설명이 제시되었다.","ㄹ. 정책결정을 체계론적 시각에서 파악한다.","ㅁ. 정책결정 과정에서 실현가능성이 낮다는 비판이 있다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄹ, ㅁ","ㄱ, ㄷ, ㄹ, ㅁ","ㄴ, ㄷ, ㄹ, ㅁ"],"a":3},{"id":"23-3-23","y":2023,"g":3,"n":23,"t":"소득보장·공공부조·빈곤·불평등","f":"옳지 않은 것","s":["사회복지정책 급여의 적절성에 관한 설명으로 옳지 않은 것은?"],"c":["인간다운 생활을 할 수 있는 수준의 급여를 제공하는 것을 말한다.","기초연금 지급액 인상은 적절성 수준을 높여줄 수 있다.","급여를 받는 사람의 삶의 질에 대한 관심의 표현이다.","일정한 수준의 물질적, 정신적 복지를 제공해야 한다는것과 관련된다.","적절성에 대한 기준은 시간과 환경에 따라 변하지
