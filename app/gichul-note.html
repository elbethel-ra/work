,"a":2},{"id":"20-1-45","y":2020,"g":1,"n":45,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳지 않은 것","s":["설문지 작성에 관한 내용으로 옳지 않은 것은?"],"c":["개연성 질문(contingency questions)은 사고의 흐름에따라 배치한다.","고정반응(response set)을 예방하기 위해 유사질문들은분리하여 배치한다.","민감한 주제나 주관식 질문은 설문지의 뒷부분에 배치한다.","명목측정을 위한 질문은 단일차원성의 원칙을 지켜 내용을 구성한다.","신뢰도 측정을 위한 질문들은 가능한 한 서로 가깝게배치한다."],"a":5},{"id":"20-1-46","y":2020,"g":1,"n":46,"t":"측정(척도·신뢰도·타당도)","f":"사례·제시문 판단","s":["다음에서 설명하고 있는 타당도는?","측정되는 개념이 속한 이론 체계 내에서 다른 개념들과 논리적으로 어느 정도 관련성을 갖고 있는 지를 경험적으로 검증하는 가장 수준이 높은 타당도"],"c":["액면 타당도(face validity)","기준 타당도(criterion validity)","동시 타당도(concurrent validity)","구성 타당도(construct validity)","예측 타당도(predictive validity)"],"a":4},{"id":"20-1-47","y":2020,"g":1,"n":47,"t":"표집(표본추출)","f":"옳지 않은 것","s":["확률표집에 관한 설명으로 옳지 않은 것은?"],"c":["무작위추출방식으로 표본을 추출한다.","의식적이거나 무의식적인 편향(bias)을 방지할 수 있다.","모집단의 규모와 특성을 알 때 사용할 수 있다.","표본오차를 추정할 수 있다.","질적 연구에서 주로 사용한다."],"a":5},{"id":"20-1-48","y":2020,"g":1,"n":48,"t":"변수·가설·연구과정·과학철학","f":"사례·제시문 판단","s":["다음 연구주제를 검증하기 위하여 변수를 구성할 때 변수명(측정 방법), 해당 변수의 종류와 분석가능한 통계수치의 연결이 옳은 것은?","학업중단 청소년의 아르바이트 경험이 삶의 만족에 미치는 영향은 또래집단의 지지정도에 따라 차이가 있을 것이다."],"c":["아르바이트 경험(유무) - 독립변수, 산술평균","아르바이트 경험(종류) - 독립변수, 최빈값","아르바이트 경험(개월 수) - 조절변수, 중간값","또래집단의 지지(5점 척도) - 독립변수, 산술평균","삶의 만족(5점 척도) - 매개변수, 산술평균"],"a":2},{"id":"20-1-49","y":2020,"g":1,"n":49,"t":"측정(척도·신뢰도·타당도)","f":"옳지 않은 것","s":["측정 시 나타날 수 있는 체계적 오류에 관한 설명으로 옳지 않은 것은?"],"c":["코딩 왜곡은 체계적 오류를 발생시킨다.","익명의 응답은 체계적 오류를 최소화한다.","편견 없는 단어는 체계적 오류를 최소화한다.","척도구성 과정의 실수는 체계적 오류를 발생시킨다.","비관여적 관찰은 체계적 오류를 최소화한다."],"a":1},{"id":"20-1-50","y":2020,"g":1,"n":50,"t":"질적연구방법","f":"옳은 것 모두 고르기","s":["질적연구방법과 적절한 연구 주제가 바르게 연결된 것을 모두 고른 것은?","ㄱ. 현상학 - 늙어간다는 것이 어떤 의미인지를 이해할 수 있다.","ㄴ. 참여행동연구 - 이혼 가족이 경험한 가족해체 사례를 심층적으로 이해할 수 있다.","ㄷ. 근거이론 - 지속적 비교 기법을 통해 노인의 재취업경험을 이론화 할 수 있다.","ㄹ. 생애사 - 위안부 피해자 할머니 삶의 중요한 사건을 이해할 수 있다."],"c":["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"21-1-26","y":2021,"g":1,"n":26,"t":"변수·가설·연구과정·과학철학","f":"옳지 않은 것","s":["사회과학의 특성에 관한 설명으로 옳지 않은 것은?"],"c":["자연과학에 비해 인과관계에 대한 명확한 결론을 내리기어렵다.","끊임없이 변화하는 사회현상을 규명한다.","관찰대상물과 관찰자가 분명히 구분된다.","인간의 행위를 연구대상으로 한다.","사회문화적 특성의 영향을 받는다."],"a":3},{"id":"21-1-27","y":2021,"g":1,"n":27,"t":"변수·가설·연구과정·과학철학","f":"옳은 것 모두 고르기","s":["사회과학과 사회복지학에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 사회복지학은 사회문제에 대처하기 위한 학문이다.","ㄴ. 사회과학은 사회복지의 실천적 지식의 제공 및 이론적 발전에 기여할 수 있다.","ㄷ. 사회복지학은 응용 과학이 아닌 순수 과학에 속한다.","ㄹ. 사회복지학은 사회과학에 의해 발전된 개념들을 활용할 수 있다."],"c":["ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ"],"a":4},{"id":"21-1-28","y":2021,"g":1,"n":28,"t":"질적연구방법","f":"옳지 않은 것","s":["양적조사와 질적조사의 비교로 옳지 않은 것은?"],"c":["질적조사에 비하여 양적조사의 표본크기가 상대적으로크다.","질적조사에 비하여 양적조사에서는 귀납법을 주로 사용한다.","양적조사에 비하여 질적조사는 사회 현상의 주관적 의미에 관심을 갖는다.","양적조사는 가설검증을 지향하고 질적조사는 탐색, 발견을 지향한다.","양적조사에 비하여 질적조사는 조사결과의 일반화가 어렵다."],"a":2},{"id":"21-1-29","y":2021,"g":1,"n":29,"t":"연구설계(실험·조사유형)","f":"옳은 것 고르기","s":["사회복지조사를 위한 수행단계로 옳은 것은?"],"c":["문제설정→가설설정 →조사설계→자료수집→자료분석 →보고서작성","문제설정→가설설정 →자료수집→자료분석→조사설계 →보고서작성","가설설정→문제설정 →자료수집→조사설계→자료분석 →보고서작성","가설설정→문제설정 →자료수집→자료분석→조사설계 →보고서작성","가설설정→문제설정 →조사설계→자료수집→자료분석 →보고서작성"],"a":1},{"id":"21-1-30","y":2021,"g":1,"n":30,"t":"변수·가설·연구과정·과학철학","f":"빈칸 채우기","s":["다음 ( )에 알맞은 내용으로 옳은 것은?","- 독립변수 앞에서 독립변수에 영향을 주는 변수를 ( ㄱ )라고 한다.","- 독립변수의 결과인 동시에 종속변수의 원인이 되는 변수를 ( ㄴ )라고 한다.","- 다른 변수에 의존하지만 다른 변수에 영향을 미칠 수 없는 변수를 ( ㄷ )라고 한다.","- 독립변수와 종속변수 모두에 영향을 미치는 제3의 변수를 ( ㄹ )라고 한다."],"c":["ㄱ: 외생변수, ㄴ: 더미변수, ㄷ: 종속변수, ㄹ: 조절변수","ㄱ: 외생변수, ㄴ: 매개변수, ㄷ: 종속변수, ㄹ: 더미변수","ㄱ: 선행변수, ㄴ: 조절변수, ㄷ: 종속변수, ㄹ: 외생변수","ㄱ: 선행변수, ㄴ: 매개변수, ㄷ: 외생변수, ㄹ: 조절변수","ㄱ: 선행변수, ㄴ: 매개변수, ㄷ: 종속변수, ㄹ: 외생변수"],"a":5},{"id":"21-1-31","y":2021,"g":1,"n":31,"t":"연구설계(실험·조사유형)","f":"순서 나열","s":["다음 ( )에 알맞은 조사유형을 모두 나열한 것은?","일정한 시간간격을 두고 연구대상을 표본추출하여 반복적으로 조사하는 방법에는 (　　), (　　), 동년배 조사 등이 있다."],"c":["패널조사, 경향조사","패널조사, 문헌조사","전수조사, 경향조사","전수조사, 표본조사","문헌조사, 전문가조사"],"a":1},{"id":"21-1-32","y":2021,"g":1,"n":32,"t":"연구설계(실험·조사유형)","f":"빈칸 채우기","s":["다음 ( )에 알맞은 내용으로 옳은 것은?","- 내적타당도를 높이기 위해서는 ( ㄱ ) 이외의 다른 변수가 ( ㄴ )에 개입할 조건을 통제하여야 한다.","- 외적타당도를 높이기 위해서는 ( ㄷ )으로 연구대상을 선정하거나 표본크기를 ( ㄹ ) 하여야 한다."],"c":["ㄱ: 원인변수, ㄴ: 결과변수, ㄷ: 확률표집방법, ㄹ: 크게","ㄱ: 원인변수, ㄴ: 결과변수, ㄷ: 무작위할당, ㄹ: 작게","ㄱ: 원인변수, ㄴ: 결과변수, ㄷ: 확률표집방법, ㄹ: 작게","ㄱ: 결과변수, ㄴ: 원인변수, ㄷ: 확률표집방법, ㄹ: 크게","ㄱ: 결과변수, ㄴ: 원인변수, ㄷ: 무작위할당, ㄹ: 작게"],"a":1},{"id":"21-1-33","y":2021,"g":1,"n":33,"t":"측정(척도·신뢰도·타당도)","f":"옳지 않은 것","s":["측정에 관한 설명으로 옳지 않은 것은?"],"c":["일정한 규칙에 따라 측정대상에 값을 부여하는 과정이다.","이론적 모델과 사건이나 현상을 연결하는 방법이다.","사건이나 현상을 세분화하고 통계적 분석에 활용할 수있는 정보를 제공한다.","측정도구의 신뢰도를 높이기 위해서는 설문문항 수가 적을수록 좋다.","측정의 수준에 따라 명목, 서열, 등간, 비율의 4가지 유형으로 분류한다."],"a":4},{"id":"21-1-34","y":2021,"g":1,"n":34,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 모두 고르기","s":["척도에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 명목척도는 응답범주의 서열이 없는 척도이다.","ㄴ. 비율척도의 대표적인 유형은 리커트 척도이다.","ㄷ. 비율척도는 절대 0점이 존재하는 척도이다.","ㄹ. 서열척도는 변수의 속성에 따라 일정한 범주로 분류한다."],"c":["ㄱ, ㄴ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ"],"a":5},{"id":"21-1-35","y":2021,"g":1,"n":35,"t":"측정(척도·신뢰도·타당도)","f":"사례·제시문 판단","s":["다음 사례에서 측정하고자 하는 타당도로 옳은 것은?","연구자는 새로 개발한 우울척도 A의 타당도를 확인하기 위하여 자아존중감 척도 B와의 상관계수를 산출하였다. 그 결과, A와 B의 상관관계가 매우 낮은 것을 확인하였다."],"c":["동시타당도(concurrent validity)","판별타당도(discriminant validity)","내용타당도(content validity)","수렴타당도(convergent validity)","예측타당도(predictive validity)"],"a":2},{"id":"21-1-36","y":2021,"g":1,"n":36,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 모두 고르기","s":["신뢰도를 측정하는 방법으로 옳은 것을 모두 고른 것은?","ㄱ. 재검사법　　　　ㄴ. 대안법","ㄷ. 반분법　　　　　ㄹ. 내적일관성분석법"],"c":["ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"21-1-37","y":2021,"g":1,"n":37,"t":"측정(척도·신뢰도·타당도)","f":"사례·제시문 판단","s":["다음이 설명하는 척도로 옳은 것은?","- 사회복지사에 대해 느끼는 감정에 대해 해당 점수에 체크하시오.","","1점　2점　3점　4점　5점　6점　7점","1. 친절한 |-----|-----|-----|-----|-----|-----| 불친절한","2. 행복한 |-----|-----|-----|-----|-----|-----| 불행한"],"c":["리커트척도(Likert scale)","거트만척도(Guttman scale)","보가더스척도(Borgadus scale)","어의적 분화척도(Semantic differential scale)","써스톤척도(Thurstone scale)"],"a":4},{"id":"21-1-38","y":2021,"g":1,"n":38,"t":"표집(표본추출)","f":"옳지 않은 것","s":["표본크기에 관한 설명으로 옳지 않은 것은?"],"c":["표본의 크기가 클수록 시간과 비용이 많이 든다.","신뢰수준을 높이려면 표본의 크기도 커져야 한다.","표본의 크기가 증가하면 표본오차(sampling error)도 커진다.","모집단이 이질적인 경우에는 표본의 크기를 늘려야 한다.","같은 표본추출방법을 사용한다면 표본의 크기가 클수록대표성은 커진다."],"a":3},{"id":"21-1-39","y":2021,"g":1,"n":39,"t":"표집(표본추출)","f":"옳지 않은 것","s":["질적조사에서 일반적으로 사용되는 표본추출방법으로 옳지 않은 것은?"],"c":["이론적(theoretical) 표본추출","집락(cluster) 표본추출","눈덩이(snowball) 표본추출","극단적 사례(extreme case) 표본추출","최대변이(maximum variation) 표본추출"],"a":2},{"id":"21-1-40","y":2021,"g":1,"n":40,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳지 않은 것","s":["내용분석(content analysis)에 관한 설명으로 옳지 않은 것을 모두 고른 것은?","ㄱ. 기존자료에 의존하기 때문에 연구의 범위가 무제한적이다.","ㄴ. 선정편향(selection bias)이 발생할 수 있다.","ㄷ. 연구대상자의 반응성을 배제할 수 있다.","ㄹ. 기존자료를 활용하는 질적조사이기 때문에 가설검증은 필요하지 않다."],"c":["ㄴ","ㄱ, ㄴ","ㄱ, ㄹ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ"],"a":3},{"id":"21-1-41","y":2021,"g":1,"n":41,"t":"연구설계(실험·조사유형)","f":"옳은 것 모두 고르기","s":["외부사건(history)을 통제할 수 있는 실험설계를 모두 고른 것은?","ㄱ. 솔로몬 4집단 설계 (Solomon four-group design)","ㄴ. 단일집단 사전사후검사 설계 (one-group pretest-posttest design)","ㄷ. 단일집단 사후검사 설계 (one-group posttest-only design)","ㄹ. 통제집단 사후검사 설계 (posttest-only control group design)"],"c":["ㄹ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":2},{"id":"21-1-42","y":2021,"g":1,"n":42,"t":"단일사례(개별)연구설계","f":"사례·제시문 판단","s":["단일사례설계방법에 관한 설명으로 옳은 것은?","위한 설계이다."],"c":["ABCD설계는 여러 개의 개입효과를 개별적으로 증명하기","AB설계는 외부요인을 충분히 통제할 수 있기 때문에 여러 유형의 문제에 적용가능하다.","복수기초선설계는 기초선 단계 이후 여러 개의 다른 개입방법을 순차적으로 적용한다.","ABAB설계는 외부요인을 통제할 수 있어 개입의 효과를확인할 수 있다.","평균비교는 기초선이 불안정할 때 기초선의 변화의 폭과기울기까지 고려하여 결과를 분석하는 방법이다."],"a":4},{"id":"21-1-43","y":2021,"g":1,"n":43,"t":"연구설계(실험·조사유형)","f":"옳은 것 고르기","s":["외적타당도를 저해하는 요인으로 옳은 것은?"],"c":["실험대상의 탈락","외부사건(history)","통계적 회귀","개입의 확산 또는 모방","연구 참여자의 반응성"],"a":5},{"id":"21-1-44","y":2021,"g":1,"n":44,"t":"질적연구방법","f":"사례·제시문 판단","s":["다음에서 설명하는 근거이론의 분석방법은?","수집된 자료에서 나타난 범주들 간의 관계를 파악하기 위해 범주들을 특정한 구조적 틀에 맞추어 연결하는 과정이다. 중심현상을 설명하는 전략들, 전략을 형성하는 맥락과 중재조건, 그리고 전략을 수행한 결과를 설정하며 찾아내는 과정이다."],"c":["조건 매트릭스","개방코딩","축코딩","괄호치기","선택코딩"],"a":3},{"id":"21-1-45","y":2021,"g":1,"n":45,"t":"표집(표본추출)","f":"사례·제시문 판단","s":["다음 사례에서 설명하는 표본추출방법은?","사회복지사들의 감정노동 정도를 조사하기 위하여 설문조사를 실시하였다. 표본은 전국사회복지관에 근무하는 사회복지사를 대상으로 연령(30세 미만, 30세 이상 50세 미만, 50세 이상)을 고려하여 연령 집단별 각각 100명씩 총 300명을 임의 추출하였다."],"c":["비례 층화 표본추출","할당 표본추출","체계적 표본추출","눈덩이 표본추출","집락 표본추출"],"a":2},{"id":"21-1-46","y":2021,"g":1,"n":46,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 모두 고르기","s":["질적조사의 엄격성(rigor)을 높이는 방법으로 옳은 것을 모두 고른 것은?","ㄱ. 장기간 관찰","ㄴ. 표준화된 척도의 사용","ㄷ. 부정적 사례(negative cases)분석","ㄹ. 다각화(triangulation)"],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"21-1-47","y":2021,"g":1,"n":47,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳지 않은 것","s":["초점집단(focus group) 조사에 관한 설명으로 옳지 않은 것은?"],"c":["집단을 활용한 자료수집방법이다.","익명의 전문가들을 패널로 활용한다.","욕구조사에서 활용된다.","직접적인 자료수집 방법이다.","연구자의 개입에 의해 편향이 발생할 수 있다."],"a":2},{"id":"21-1-48","y":2021,"g":1,"n":48,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳은 것 고르기","s":["설문지 작성 방법에 관한 설명으로 옳은 것은?"],"c":["개방형 질문은 미리 유형화된 응답범주들을 제시해놓은질문 유형이다.","행렬식(matrix) 질문은 한 주제의 응답에 따라 부가질문을 연결해서 사용하는 질문이다.","많은 정보가 필요할 경우 이중질문을 사용한다.","신뢰도 측정을 위해 짝(pair)으로 된 문항들은 이어서 배치한다.","다항선택식(multiple choice) 질문은 응답범주들 중에서하나 또는 그 이상을 선택하도록 하는 질문이다."],"a":5},{"id":"21-1-49","y":2021,"g":1,"n":49,"t":"연구설계(실험·조사유형)","f":"옳지 않은 것","s":["실험설계의 유형에 관한 설명으로 옳지 않은 것은?"],"c":["다중 시계열 설계(multiple time-series design)는 통제집단을 설정하지 않는다.","단일집단 사전사후검사 설계(one-grouppretest-posttest design)는 검사효과를 통제하기 어렵다.","통제집단 사후검사 설계(posttest-only control groupdesign)는 사전검사의 영향을 배제할 수 있다.","시계열 설계(time-series design)는 검사효과와 외부사건을 통제하기 어렵다.","정태적 집단 비교설계(static group design)는 두 집단의본래의 차이를 확인하기 어렵다."],"a":1},{"id":"21-1-50","y":2021,"g":1,"n":50,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳은 것 모두 고르기","s":["서베이(survey) 조사에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 전화조사는 무작위 표본추출이 가능하다.","ㄴ. 우편조사는 심층규명이 쉽다.","ㄷ. 배포조사는 응답 환경을 통제하기 쉽다.","ㄹ. 면접조사는 우편조사에 비해 비용이 많이 든다."],"c":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":2},{"id":"22-1-26","y":2022,"g":1,"n":26,"t":"질적연구방법","f":"옳지 않은 것","s":["다음 중 질적 연구와 가장 거리가 먼 것은?"],"c":["문화기술지(ethnography)연구","심층사례연구","사회지표조사","근거이론연구","내러티브(narrative)연구"],"a":3},{"id":"22-1-27","y":2022,"g":1,"n":27,"t":"변수·가설·연구과정·과학철학","f":"옳은 것 고르기","s":["과학철학에 관한 설명으로 옳은 것은?"],"c":["논리적 실증주의에 가장 큰 영향을 미친 사람은 영국의철학자 흄(D. Hume)이다.","상대론적인 입장에서는 경험에 의한 지식의 객관성을 추구한다.","쿤(T. Kuhn)에 의하면 과학은 기존의 이론과 상충되는현상을 관찰하는 데서 출발하여 기존의 이론에 엄격한 검증을 행한다.","반증주의는 누적적인 진보를 부정하면서 역사적 사실들과 더 잘 부합하는 새로운 패러다임을 제시하였다.","논리적 경험주의는 과학의 이론들이 확률적으로 검증되는 관찰에 의해서만 정당화될 수 있다고 주장한다."],"a":5},{"id":"22-1-28","y":2022,"g":1,"n":28,"t":"변수·가설·연구과정·과학철학","f":"옳지 않은 것","s":["실증주의의 특징과 가장 거리가 먼 것은?"],"c":["이론의 재검증","객관적 조사","사회현상의 주관적 의미에 대한 해석","보편적이고 적용가능한 통계적 분석도구","연구결과의 일반화"],"a":3},{"id":"22-1-29","y":2022,"g":1,"n":29,"t":"질적연구방법","f":"옳지 않은 것","s":["평가연구에 관한 설명으로 옳지 않은 것은?"],"c":["보고서의 형식은 의뢰기관의 요청에 따를 수 있다.","목표달성에 대한 해석이 다양한 이해관계에 영향을 받을수 있다.","질적 연구방법을 적용할 수 있다.","프로그램의 실행과정도 평가할 수 있다.","과학적 객관성을 저해하더라도 의뢰기관의 요구를 수용하여 평가결과를 조정할 수 있다."],"a":5},{"id":"22-1-30","y":2022,"g":1,"n":30,"t":"연구설계(실험·조사유형)","f":"옳은 것 모두 고르기","s":["사회복지조사에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 사회복지관련 이론 개발에 사용된다.","ㄴ. 여론조사나 인구센서스 조사는 전형적인 탐색 목적의 조사연구이다.","ㄷ. 연구의 전 과정에서 결정주의적 성향을 지양해야 한다.","ㄹ. 조사범위에 따라 횡단연구와 종단연구로 나뉘어진다."],"c":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1},{"id":"22-1-31","y":2022,"g":1,"n":31,"t":"연구설계(실험·조사유형)","f":"사례·제시문 판단","s":["다음에서 설명하는 조사 유형에 해당하는 것은?","- 둘 이상의 시점에서 조사가 이루어진다.","- 동일대상 반복측정을 원칙으로 하지 않는다."],"c":["추세연구, 횡단연구","패널연구, 추세연구","횡단연구, 동년배(cohort)연구","추세연구, 동년배연구","패널연구, 동년배연구"],"a":4},{"id":"22-1-32","y":2022,"g":1,"n":32,"t":"변수·가설·연구과정·과학철학","f":"순서 나열","s":["17개 시ㆍ도의 69개 사회복지기관에서 근무하는 사회복지사 396명을 대상으로 근무기관의 규모별 직무만족도를 설문조사할 때 독립변수와 종속변수의 관찰단위를 순서대로 옳게 짝지은 것은?"],"c":["개인 - 개인","기관 - 개인","지역사회 - 개인","지역사회 - 기관","개인 - 지역사회"],"a":1},{"id":"22-1-33","y":2022,"g":1,"n":33,"t":"변수·가설·연구과정·과학철학","f":"사례·제시문 판단","s":["다음 사례에서 부모의 재산은 어떤 변수인가?","한 연구에서 부모의 학력이 자녀의 대학 진학률에 영향을 미치는 것으로 나타났다. 그러나 부모의 재산이 비슷한 조사 대상에 한정하여 다시 분석해 본 결과, 부모의 학력과 자녀의 대학 진학률 사이에는 통계적으로 유의미한 관계가 없는 것으로 나타났다."],"c":["독립변수","종속변수","조절변수","억제변수","통제변수"],"a":5},{"id":"22-1-34","y":2022,"g":1,"n":34,"t":"변수·가설·연구과정·과학철학","f":"옳은 것 고르기","s":["양적 조사방법에 관한 설명으로 옳은 것은?"],"c":["자료수집을 완료한 후 가설을 설정해야 한다.","자료수집 방법은 조사 설계에 포함할 수 없다.","연구가설은 독립변수와 종속변수는 관계가 없다고 설정한다.","개념적 정의는 측정가능성을 전제로 하지 않는다.","사회과학에서 이론은 직접검증을 원칙으로 한다."],"a":4},{"id":"22-1-35","y":2022,"g":1,"n":35,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 고르기","s":["측정수준이 서로 다른 변수로 묶인 것은?"],"c":["연령, 백신 접종률","학년, 이수과목의 수","섭씨(℃), 화씨(℉)","강우량, 산불발생 건 수","거주지역, 혈액형"],"a":2},{"id":"22-1-36","y":2022,"g":1,"n":36,"t":"측정(척도·신뢰도·타당도)","f":"옳지 않은 것","s":["척도 유형에 관한 설명으로 옳지 않은 것은?"],"c":["리커트척도(Likert scale)는 문항 간 내적 일관성이 중요하다.","거트만척도(Guttman scale)는 누적 척도이다.","서스톤척도(Thurstone scale)의 장점은 개발의 용이성이다.","보가더스척도(Borgadus scale)는 사회집단 간의 심리적거리감을 측정하는 데 적절하다.","의미분화척도(semantic differential scale)의 문항은 한쌍의 대조되는 형용사를 사용한다."],"a":3},{"id":"22-1-37","y":2022,"g":1,"n":37,"t":"측정(척도·신뢰도·타당도)","f":"옳지 않은 것","s":["측정에 관한 설명으로 옳지 않은 것은?"],"c":["측정은 연구대상에 대해 일정한 규칙에 따라 숫자나 기호를 부여하는 과정이다.","지표는 개념 속에 내재된 속성들이 표출되어 나타난 결과를 말한다.","측정의 체계적 오류는 타당도와 관련이 없다.","리커트척도는 각 항목의 단순합산을 통해 서열성을 산출한다.","조작적 정의는 실질적으로 측정하게 되는 연구대상의 세부적 속성이다."],"a":3},{"id":"22-1-38","y":2022,"g":1,"n":38,"t":"측정(척도·신뢰도·타당도)","f":"옳지 않은 것","s":["척도의 타당도를 평가하는 기준이 아닌 것은?","도"],"c":["하나의 개념을 측정하는 개별 항목들 간의 일관성","이론적으로 관련성이 없는 두 개념을 측정한 두 척도 간의 상관관계","어떤 척도와 기준이 되는 척도 간의 상관관계","개념 안에 포함된 포괄적인 의미를 척도가 포함하는 정","개별 항목들이 연구자가 의도한 개념을 구성하는 요인으로 모이는 정도"],"a":1},{"id":"22-1-39","y":2022,"g":1,"n":39,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 고르기","s":["신뢰도를 높이는 방법에 관한 설명으로 옳은 것은?"],"c":["측정 항목 수를 가능한 줄여야 한다.","유사한 질문을 2회 이상 하지 않는다.","측정자에게 측정도구에 대한 교육을 사후에 실시한다.","측정자들이 측정방식을 대상자에 맞게 유연하게 바꾸어야 한다.","조사대상자가 알지 못하는 내용에 대해서는 측정하지 않는 것이 좋다."],"a":5},{"id":"22-1-40","y":2022,"g":1,"n":40,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 모두 고르기","s":["신뢰도에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 재검사법, 반분법은 신뢰도를 평가하는 방법이다.","ㄴ. 신뢰도는 타당도의 필요충분조건이다.","ㄷ. 측정할 때마다 실제보다 5g 더 높게 측정되는 저울은 신뢰도가 있다."],"c":["ㄱ","ㄴ","ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":4},{"id":"22-1-41","y":2022,"g":1,"n":41,"t":"표집(표본추출)","f":"옳지 않은 것","s":["다른 조건이 같다면, 확률표집에서 표집오차(sampling error)에 관한 설명으로 옳지 않은 것은?"],"c":["표준오차(standard error)가 커지면 표집오차도 커진다.","신뢰수준(confidence level)을 높이면 표집오차가 감소한다.","표본의 수가 증가하면 표집오차가 감소한다.","이질적인 모집단 보다 동질적인 모집단에서 추출한 표본의 표집오차가 작다.","층화를 통해 단순무작위추출의 표집오차를 줄일 수 있다."],"a":2},{"id":"22-1-42","y":2022,"g":1,"n":42,"t":"표집(표본추출)","f":"사례·제시문 판단","s":["다음 사례의 표집에 관한 설명으로 옳은 것은?","400명의 명단에서 80명의 표본을 선정하는 경우, 그 명단에서 최초의 다섯 사람 중에서 무작위로 한 사람을 뽑는다. 그 후 표집간격 만큼을 더한 번호에 해당하는 사람을 표본으로 선택한다."],"c":["단순무작위 표집이다.","표집틀이 있어야 한다.","모집단의 배열에 일정한 주기성을 가지고 있어야 한다.","비확률표집법을 사용하였다.","모집단에 대한 대표성이 부족하다."],"a":2},{"id":"22-1-43","y":2022,"g":1,"n":43,"t":"표집(표본추출)","f":"사례·제시문 판단","s":["표집에 관한 설명으로 옳은 것은?","부터 표본으로 추출될 확률을 알 수 있다."],"c":["할당표집(quota sampling)은 무작위 표집을 전제로 한다.","유의표집(purposive sampling)은 확률표집이다.","눈덩이표집(snowball sampling)은 모집단의 규모를 알아야만 사용할 수 있다.","단순무작위표집(simple random sampling)은 모집단으로","임의표집(convenience sampling)은 모집단의 대표성이높은 표본을 추출한다."],"a":4},{"id":"22-1-44","y":2022,"g":1,"n":44,"t":"통계·자료분석","f":"옳지 않은 것","s":["통계적 가설검증에 관한 설명으로 옳지 않은 것은?"],"c":["영가설을 기각하면 연구가설이 잠정적으로 채택된다.","영가설은 연구가설과 대조되는 가설이다.","통계치에 대한 확률(p)이 유의수준(α)보다 낮으면 영가설이 기각된다.","연구가설은 표본의 통계치에 대한 가정이다.","연구가설은 경험적으로 검증이 가능하여야 한다."],"a":4},{"id":"22-1-45","y":2022,"g":1,"n":45,"t":"표집(표본추출)","f":"옳은 것 모두 고르기","s":["다음에서 설문조사 결과를 해석할 때 유의해야 할 사항을 모두 고른 것은?","ㄱ. 표집방법이 확률표집인가 비확률표집인가?","ㄴ. 표본의 크기는 모집단을 대표하기에 적절한가?","ㄷ. 설문조사는 언제 이루어졌는가?","ㄹ. 측정도구가 신뢰할 만한 것인가?"],"c":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"22-1-46","y":2022,"g":1,"n":46,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳은 것 고르기","s":["자료수집방법에 관한 설명으로 옳은 것은?"],"c":["질문의 유형과 형태를 결정할 때 조사대상자의 응답능력을 고려할 필요가 있다.","설문문항 작성 시 이중질문(double-barreled question)을 넣어야 한다.","비참여관찰법은 연구자가 관찰대상과 상호작용을 유지하는 것이 중요하다.","설문지에서 질문 순서는 무작위 배치를 원칙으로 한다.","우편조사는 프로빙(probing) 기술이 중요하다."],"a":1},{"id":"22-1-47","y":2022,"g":1,"n":47,"t":"표집(표본추출)","f":"사례·제시문 판단","s":["다음 조사에서 연구대상을 배정한 방법은?","사회복지사협회에서 회보 발송 여부에 따라 회비 납부율에 차이가 있는지 알아보고자 한다. 이를 위해 전체 회원을 연령과 성별로 구성된 할당행렬의 각 칸에 배치하고, 절반에게는 회보를 보내고 나머지 절반은 회보를 보내지 않았다."],"c":["무작위표집(random sampling)","할당표집(quota sampling)","매칭(matching)","소시오매트릭스(sociomatrix)","다중특질-다중방법(MultiTrait-MultiMethod)"],"a":3},{"id":"22-1-48","y":2022,"g":1,"n":48,"t":"연구설계(실험·조사유형)","f":"옳지 않은 것","s":["순수실험설계에서 인과성 검증에 관한 설명으로 옳지 않은 것은?"],"c":["사회복지 프로그램의 실행 여부가 독립변수로 설정될 수있다.","사전조사에서 실험집단과 통제집단의 종속변수 측정치는통계적으로 유의미한 차이가 없어야 한다.","사전조사와 사후조사에서 통제집단의 종속변수 측정치는통계적으로 유의미한 차이가 있어야 한다.","실험집단과 통제집단의 동질성 확보가 필요하다.","실험집단과 통제집단의 차이는 독립변수의 개입 유무이다."],"a":3},{"id":"22-1-49","y":2022,"g":1,"n":49,"t":"연구설계(실험·조사유형)","f":"옳지 않은 것","s":["다음과 같은 절차로 진행된 유사(준)실험설계의 특징으로 옳지 않은 것은?","- 우울예방 프로그램에 참여할 하나의 집단을 모집함","- 우울검사를 일정한 간격으로 여러 차례 실시함","- 우울예방 프로그램을 진행함","- 우울검사를 동일한 측정도구를 이용해 일정한 간격으로 여러 차례 실시함"],"c":["통제집단을 두기 어려울 때 사용할 수 있다.","검사효과가 발생할 수 없다.","정태적 집단비교설계(static-group comparison design)보다 내적 타당도가 높다.","개입효과는 사전검사와 사후검사 측정치의 평균을 비교해서 측정할 수 있다.","사전검사와 개입의 상호작용효과가 발생할 수 있다."],"a":2},{"id":"22-1-50","y":2022,"g":1,"n":50,"t":"질적연구방법","f":"옳은 것 고르기","s":["근거이론의 분석방법에서 축코딩(axial coding)에 관한 설명으로 옳은 것은?"],"c":["추상화시킨 구절에 번호를 부여한다.","개념으로 도출된 내용을 가지고 하위범주를 만든다.","발견된 범주의 속성과 차원을 고려하여 유형화를 시도한다.","이론개발을 위해 핵심범주를 중심으로 다른 범주와의 통합과 정교화를 만드는 과정을 진행한다.","발견된 범주를 가지고 중심현상을 중심으로 인과적 조건을 만든다."],"a":5},{"id":"23-1-26","y":2023,"g":1,"n":26,"t":"연구윤리·보고서·평가","f":"옳지 않은 것","s":["사회조사과정에서 준수해야 할 연구윤리로 옳지 않은 것은?"],"c":["참여자의 익명성과 비밀을 보장한다.","참여자가 원할 경우 언제든지 참여를 중단할 수 있음을사전에 고지한다.","일반적으로 연구의 공익적 가치가 연구윤리보다 우선해야 한다.","참여자가 연구에 참여하여 얻을 수 있는 혜택은 사전에고지한다.","참여자의 연구 참여는 자발적이어야 한다."],"a":3},{"id":"23-1-27","y":2023,"g":1,"n":27,"t":"변수·가설·연구과정·과학철학","f":"옳지 않은 것","s":["사회과학의 패러다임에 관한 설명으로 옳지 않은 것은?"],"c":["실증주의는 연구결과를 해석할 때 정치적 가치나 이데올로기의 영향을 적극적으로 고려한다.","해석주의는 삶에 관한 심층적이고 주관적인 이해를 얻고자 한다.","비판주의는 사회변화를 목적으로 사회의 본질적이고 구조적 측면의 파악에 주목한다.","후기실증주의는 객관적인 지식에 대한 직접적 확증은 불가능하다고 본다.","포스트모더니즘은 객관적 실재와 진리의 보편적 기준을거부한다."],"a":1},{"id":"23-1-28","y":2023,"g":1,"n":28,"t":"연구설계(실험·조사유형)","f":"옳은 것 고르기","s":["종단연구(longitudinal study)에 관한 설명으로 옳은 것은?"],"c":["베이비붐세대를 시간변화에 따라 연구하는 것은 추이연구(trend study)이다.","일정기간 센서스 자료를 비교하여 전국 인구의 성장을추적하는 것은 동류집단연구(cohort study)이다.","매번 동일한 집단을 관찰하는 연구는 패널연구(panelstudy)이다.","시간에 따른 변화를 가장 정확하게 알려주는 것은 동류집단연구(cohort study)이다.","일반 모집단의 변화를 시간변화에 따라 연구하는 것은동류집단연구(cohort study)이다."],"a":3},{"id":"23-1-29","y":2023,"g":1,"n":29,"t":"통계·자료분석","f":"옳은 것 모두 고르기","s":["영가설에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 연구가설에 대한 반증가설이 영가설이다.","ㄴ. 영가설은 변수 간에 관계가 없음을 뜻한다.","ㄷ. 대안가설을 검증하며 채택하는 가설이다.","ㄹ. 변수간의 관계가 우연이 아님을 증명한다."],"c":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":1},{"id":"23-1-30","y":2023,"g":1,"n":30,"t":"변수·가설·연구과정·과학철학","f":"옳지 않은 것","s":["사회조사의 목적에 관한 설명으로 옳지 않은 것은?"],"c":["지난 해 발생한 데이트폭력사건의 빈도와 유형을 자세히보고하는 것은 기술적 연구이다.","외상후스트레스로 퇴역한 군인을 위한 서비스개발의 가능성을 파악하기 위한 초기면접은 설명적 연구이다.","사회복지협의회가 매년 실시하는 사회복지기관 통계조사는 기술적 연구이다.","지방도시에 비해 대도시의 아동학대비율이 높은 이유를보고하는 것은 설명적 연구이다.","지역사회대상 설문조사를 통해 사회복지서비스의 만족도를 조사하는 것은 기술적 연구이다."],"a":2},{"id":"23-1-31","y":2023,"g":1,"n":31,"t":"측정(척도·신뢰도·타당도)","f":"빈칸 채우기","s":["다음 연구과제의 변수들을 측정할 때 ㄱ~ㄹ의 척도유형을 바르게 짝지은 것은?","장애인의 성별( ㄱ )과 임금수준의 관계를 정확하게 파악하기 위해서는 장애유형( ㄴ ), 거주지역( ㄷ ), 직업종류( ㄹ )와 같은 변수들의 영향력을 적절히 통제해야 한다."],"c":["ㄱ: 명목, ㄴ: 명목, ㄷ: 명목, ㄹ: 명목","ㄱ: 명목, ㄴ: 서열, ㄷ: 서열, ㄹ: 명목","ㄱ: 명목, ㄴ: 서열, ㄷ: 명목, ㄹ: 비율","ㄱ: 명목, ㄴ: 등간, ㄷ: 명목, ㄹ: 명목","ㄱ: 명목, ㄴ: 등간, ㄷ: 서열, ㄹ: 비율"],"a":1},{"id":"23-1-32","y":2023,"g":1,"n":32,"t":"연구설계(실험·조사유형)","f":"옳은 것 고르기","s":["조사설계의 내적 타당도와 외적 타당도에 관한 설명으로 옳은 것은?"],"c":["어떤 변수가 다른 변수의 원인임을 정확하게 기술하는것이 외적 타당도이다.","연구결과를 연구조건을 넘어서는 상황이나 모집단으로일반화하는 정도가 내적 타당도이다.","내적 타당도는 외적 타당도의 필요조건이지만 충분조건은 아니다.","실험대상의 탈락이나 우연한 사건은 외적 타당도 저해요인이다.","외적 타당도가 낮은 경우 내적 타당도 역시 낮다."],"a":3},{"id":"23-1-33","y":2023,"g":1,"n":33,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳지 않은 것","s":["피면접자를 직접 대면하는 면접조사가 우편설문에 비해 갖는 장점이 아닌 것은?"],"c":["응답자의 익명성 보장 수준이 높다.","보충적 자료 수집이 가능하다.","대리 응답의 방지가 가능하다.","높은 응답률을 기대할 수 있다.","조사 내용에 대한 심층적 이해가 가능하다."],"a":1},{"id":"23-1-34","y":2023,"g":1,"n":34,"t":"측정(척도·신뢰도·타당도)","f":"옳지 않은 것","s":["다음 변수의 측정 수준에 따른 분석 방법이 옳지 않은 것은?","ㄱ. 출신지역: 도시, 도농복합, 농어촌, 기타","ㄴ. 교육수준: 무학, 초등학교 졸업, 중학교 졸업, 고등학교 졸업, 대졸 이상","ㄷ. 가출경험: 유, 무","ㄹ. 연간기부금액: (　　　)만원","ㅁ. 연령: 10대, 20대, 30대, 40대, 50대, 60대 이상"],"c":["ㄱ: 최빈값","ㄴ: 중위수","ㄷ: 백분율","ㄹ: 범위","ㅁ: 산술평균"],"a":5},{"id":"23-1-35","y":2023,"g":1,"n":35,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳지 않은 것","s":["델파이조사에 관한 설명으로 옳지 않은 것은?"],"c":["전문가 패널을 대상으로 견해를 파악한다.","되풀이 되는 조사 과정을 통해 합의를 도출한다.","반대 의견에 대한 패널 참가자들의 감정적 충돌을 줄일수 있다.","패널 참가자의 익명성 보장에 어려움이 있다.","조사 자료의 정리에 연구자의 편향이 발생할 수 있다."],"a":4},{"id":"23-1-36","y":2023,"g":1,"n":36,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳은 것 고르기","s":["관찰을 통한 자료 수집에 관한 설명으로 옳은 것은?"],"c":["피관찰자에 의해 자료가 생성된다.","비언어적 상황의 자료 수집이 용이하다.","자료 수집 상황에 대한 통제가 용이하다.","내면적 의식의 파악이 용이하다.","수집된 자료를 객관화하는 최적의 방법이다."],"a":2},{"id":"23-1-37","y":2023,"g":1,"n":37,"t":"질적연구방법","f":"사례·제시문 판단","s":["다음의 연구에서 활용한 질적 연구방법에 관한 설명으로 옳","은 것은?","A사회복지사는 가정 밖 청소년들의 범죄피해와 정신건강의 문제를 당사자의 관점에서 이해하고 주체적으로 해결하기 위해 연구를 시작하였다. 연구에 참여한 가정 밖 청소년들은 A사회복지사와 함께 범죄피해와 정신건강과 관련된 사회 구조적인 문제를 해결하기 위한 다양한 방안들을 스스로 만들고 수행하였다."],"c":["개방코딩-축코딩-선택코딩의 방법을 활용한다.","범죄피해와 정신건강을 설명하는 이론 개발에 초점을 둔다.","단일사례에 대한 깊이 있는 분석에 초점을 둔다.","관찰대상의 개인적 설화(narrative)를 만드는 것에 초점을둔다.","사회변화와 임파워먼트에 초점을 둔다."],"a":5},{"id":"23-1-38","y":2023,"g":1,"n":38,"t":"연구설계(실험·조사유형)","f":"사례·제시문 판단","s":["다음의 연구에서 활용한 연구설계에 관한 설명으로 옳은 것은?","청소년의 자원봉사의식 향상 프로그램의 효과성을 검증하기 위하여 청소년 200명을 무작위로 두 개의 집단으로 나눈 후 A측정도구를 활용하여 사전 검사를 실시하였다. 하나의 집단에만 프로그램을 실시한 후 두 개의 집단 모두를 대상으로 A측정도구를 활용하여 사후 검사를 실시하였다."],"c":["테스트 효과의 발생 가능성이 낮다.","집단 간 동질성의 확인 가능성이 낮다.","사전 검사와 프로그램의 상호작용 효과의 통제가 가능하다.","자연적 성숙에 따른 효과의 통제가 가능하다.","실험집단의 개입 효과가 통제집단으로 전이된다."],"a":4},{"id":"23-1-39","y":2023,"g":1,"n":39,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 고르기","s":["연구의 외적 타당도를 저해하는 상황으로 옳은 것은?"],"c":["연구대상의 건강 상태가 시간 경과에 따라 회복되는 상황","자아존중감을 동일한 측정도구로 사전-사후 검사하는 상황","사회적 지지를 다른 측정도구로 사전-사후 검사하는 상황","실험집단과 통제집단 간 연령 분포의 차이가 크게 발생하는 상황","자발적 참여자만을 대상으로 연구표본을 구성하게 되는상황"],"a":5},{"id":"23-1-40","y":2023,"g":1,"n":40,"t":"단일사례(개별)연구설계","f":"옳은 것 모두 고르기","s":["단일사례설계에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. BA설계는 개입의 긴급성이 있는 상황에 적합하다.","ㄴ. ABAC설계는 선행 효과의 통제가 가능하다.","ㄷ. ABAB설계는 AB설계에 비해 외부사건의 영향력에 대한 통제력이 크다.","ㄹ. 복수기초선디자인은 AB설계에 비해 외부사건의 영향력에 대한 통제력이 크다."],"c":["ㄱ, ㄴ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ"],"a":5},{"id":"23-1-41","y":2023,"g":1,"n":41,"t":"단일사례(개별)연구설계","f":"옳지 않은 것","s":["단일사례설계의 결과 분석 방법에 관한 설명으로 옳지 않은 것은?"],"c":["시각적 분석은 변화의 수준, 파동, 경향을 고려해야 한다.","통계적 분석을 할 때 기초선이 불안정한 경우 평균비교가 적합하다.","평균비교에서는 평균과 표준편차를 함께 고려해야 한다.","경향선 분석에서는 기초선의 측정값을 두 영역으로 나누어 경향선을 구한다.","임상적 분석은 결과 판단에 주관적 요소의 개입 가능성이 크다."],"a":2},{"id":"23-1-42","y":2023,"g":1,"n":42,"t":"측정(척도·신뢰도·타당도)","f":"옳지 않은 것","s":["측정의 오류에 관한 설명으로 옳지 않은 것은?"],"c":["연구자의 의도가 포함된 질문은 체계적 오류를 발생시킨다.","사회적으로 바람직한 응답은 체계적 오류를 발생시킨다.","측정의 오류는 연구의 타당도를 낮춘다.","타당도가 낮은 척도의 사용은 무작위 오류를 발생시킨다.","측정의 다각화는 측정의 오류를 줄여 객관성을 높인다."],"a":4},{"id":"23-1-43","y":2023,"g":1,"n":43,"t":"변수·가설·연구과정·과학철학","f":"옳은 것 모두 고르기","s":["변수의 조작적 정의에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 개념적 정의를 실제로 관찰할 수 있는 수준으로 전환시키는 것이다.","ㄴ. 조작적 정의를 하면 개념의 의미가 다양하고 풍부해진다.","ㄷ. 조작적 정의를 통해 개념이 더욱 추상화된다.","ㄹ. 조작적 정의가 없이도 가설 검증이 가능하다."],"c":["ㄱ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ"],"a":1},{"id":"23-1-44","y":2023,"g":1,"n":44,"t":"표집(표본추출)","f":"옳지 않은 것","s":["표집오차(sampling error)에 관한 설명으로 옳지 않은 것은?"],"c":["신뢰수준을 높이면 표집오차는 감소한다.","모집단의 모수와 표본의 통계치 간의 차이이다.","표본의 크기가 커지면 표집오차는 커진다.","모집단의 동질성에 영향을 받는다.","표본으로 추출될 기회가 동등하면 표집오차는 감소한다."],"a":3},{"id":"23-1-45","y":2023,"g":1,"n":45,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 모두 고르기","s":["｢마을만들기 사업 참여경험에 관한 연구｣의 엄격성을 높이는 방법으로 옳은 것을 모두 고른 것은?","ㄱ. 삼각측정(triangulation)　　ㄴ. 예외사례 표본추출","ㄷ. 장기적 관찰　　　　　　　　ㄹ. 연구윤리 강화"],"c":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"23-1-46","y":2023,"g":1,"n":46,"t":"표집(표본추출)","f":"옳은 것 고르기","s":["표본추출에 관한 설명으로 옳은 것은?"],"c":["모집단을 가장 잘 대표하는 표본추출방법은 유의표집이다.","모집단이 이질적인 경우에는 표본의 크기를 줄여야 한다.","전수조사에서는 모수와 통계치의 구분이 필요하다.","표집오류를 줄이기 위해 층화표집방법(stratifiedsampling)을 사용할 수 있다.","체계적표집방법(systematic sampling)은 모집단에서 유의표집을 실시한 후 일정한 표본추출 간격으로 표본을 선정한다."],"a":4},{"id":"23-1-47","y":2023,"g":1,"n":47,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 고르기","s":["척도에 관한 설명으로 옳은 것은?"],"c":["리커트(Likert)척도는 개별문항의 중요도를 차등화한다.","보가더스(Bogardus)의 사회적 거리척도는 누적척도이다.","평정(rating)척도는 문항의 적절성 평가가 용이하다.","거트만(Guttman)척도는 다차원적 내용을 분석할 때 사용된다.","의미차별(semantic differential)척도는 느낌이나 감정을나타내는 한 쌍의 유사한 형용사를 사용한다."],"a":2},{"id":"23-1-48","y":2023,"g":1,"n":48,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 모두 고르기","s":["타당도에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 특정 개념에 포함되어 있는 의미를 포괄하는 정도는 내용타당도(content validity)이다.","ㄴ. 개발된 측정도구의 측정값을 현재 사용되고 있는 측정도구와 비교하는 것은 동시타당도(concurrent validity)이다.","ㄷ. 예측타당도(predict validity)의 하위타당도는 기준관련타당도(criterion-related validity)와 동시타당도이다.","ㄹ. 측정하려는 개념이 포함된 이론체계 안에서 다른 변수와 관련된 방식에 기초한 타당도는 구성타당도(construct validity)이다."],"c":["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"23-1-49","y":2023,"g":1,"n":49,"t":"측정(척도·신뢰도·타당도)","f":"옳지 않은 것","s":["신뢰도를 측정하는 방법으로 옳지 않은 것은?"],"c":["동일한 상황에서 동일한 측정도구로 동일한 대상을 다시측정하는 방법","측정도구를 반으로 나누어 두 개의 독립된 척도로 구성한 후 동일한 대상을 측정하는 방법","상관관계가 높은 문항들을 범주화하여 하위요인을 구성하는 방법","동질성이 있는 두 개의 측정도구를 동일한 대상에게 측정하는 방법","전체 척도와 척도의 개별항목이 얼마나 상호연관성이 있는지 분석하는 방법"],"a":3},{"id":"23-1-50","y":2023,"g":1,"n":50,"t":"표집(표본추출)","f":"옳지 않은 것","s":["할당표집방법에 관한 설명으로 옳지 않은 것은?"],"c":["모집단의 주요 특성에 대한 정보를 활용한다.","모집단을 구성하는 주요 변수별로 표본을 할당한 후 확률표집을 실시한다.","지역주민 조사에서 전체주민의 연령대별 구성 비율에 따라 표본을 선정한다.","표본추출 시 할당틀을 만들어 사용한다.","우발적표집보다 표본의 대표성이 높다."],"a":2},{"id":"24-1-26","y":2024,"g":1,"n":26,"t":"변수·가설·연구과정·과학철학","f":"옳지 않은 것","s":["과학철학에 관한 설명으로 옳지 않은 것은?"],"c":["쿤(T. Kuhn)은 과학적 혁명에서 패러다임 전환을 제시하였다.","쿤(T. Kuhn)은 당대의 지배적 패러다임에서 벗어나지 않는 것을 정상과학이라고 지칭하였다.","포퍼(K. Popper)는 쿤의 과학적 인식에 내재된 문제점을극복하기 위하여 반증주의를 제시하였다.","포퍼(K. Popper)의 반증주의는 연역법에 의존한다.","포퍼(K. Popper)는 이론이란 증명되는 것이 아니라 반증되는 것이라고 하였다."],"a":3},{"id":"24-1-27","y":2024,"g":1,"n":27,"t":"연구윤리·보고서·평가","f":"옳지 않은 것","s":["과학적 탐구에서 제기되는 윤리적 문제에 관한 설명으로 옳지 않은 것은?"],"c":["어떤 경우라도 연구참여자 속이기는 허용되지 않는다.","고지된 동의는 조사대상자의 판단능력을 고려하여야 한다.","연구자는 기대했던 연구결과와 다르더라도 그 결과를 사실대로 보고해야 한다.","사회복지조사에서는 비밀유지가 엄격히 지켜질 수 없는상황이 발생할 수 있다.","연구자는 개인정보 유출 등으로 인해 연구참여자에게 피해를 주지 않도록 신중을 기해야 한다."],"a":1},{"id":"24-1-28","y":2024,"g":1,"n":28,"t":"변수·가설·연구과정·과학철학","f":"옳은 것 모두 고르기","s":["과학적 지식의 특성에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 경험적으로 검증 가능하여야 한다.","ㄴ. 연구결과는 잠정적이며 수정될 수 있다.","ㄷ. 연구자의 주관적 가치 판단이 연구과정이나 결론에 작용하지 않도록 객관성을 추구한다.","ㄹ. 같은 절차를 다른 대상에 반복적으로 적용하여 같은 결과가 나오는지 검토할 수 있다."],"c":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"24-1-29","y":2024,"g":1,"n":29,"t":"연구설계(실험·조사유형)","f":"사례·제시문 판단","s":["다음에서 설명하는 조사유형을 바르게 짝지은 것은?","ㄱ. 동일한 표본을 대상으로 시간을 달리하여 추적 관찰하는 연구","ㄴ. 일정연령이나 일정연령 범위 내 사람들의 집단이 조사대상인 종단연구"],"c":["ㄱ: 경향조사, ㄴ: 코호트(cohort)조사","ㄱ: 경향조사, ㄴ: 패널조사","ㄱ: 코호트(cohort)조사, ㄴ: 경향조사","ㄱ: 패널조사, ㄴ: 경향조사","ㄱ: 패널조사, ㄴ: 코호트(cohort)조사"],"a":5},{"id":"24-1-30","y":2024,"g":1,"n":30,"t":"변수·가설·연구과정·과학철학","f":"옳은 것 모두 고르기","s":["분석단위에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 이혼, 폭력, 범죄 등과 같은 분석단위는 사회적 가공물(social artifacts)에 해당한다.","ㄴ. 생태학적 오류는 집단에 대한 조사를 기초로 하여 개인을 분석단위로 주장하는 오류이다.","ㄷ. 환원주의는 특정 분석단위 또는 변수가 다른 분석단위 또는 변수에 비해 관련성이 높다고 설명하는 경향이 있다."],"c":["ㄴ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":5},{"id":"24-1-31","y":2024,"g":1,"n":31,"t":"변수·가설·연구과정·과학철학","f":"옳지 않은 것","s":["변수에 관한 설명으로 옳지 않은 것은?"],"c":["매개변수(mediating variable)는 독립변수의 영향을 받아종속변수에 영향을 미치는 변수이다.","통제변수(control variable)는 독립변수와 종속변수의 관계에 영향을 줄 수 있기 때문에 통제대상이 되는 변수이다.","독립변수는 결과변수이고 종속변수는 설명변수이다.","조절변수(moderating variable)는 독립변수와 종속변수간의 관계의 강도에 영향을 미칠 수 있다.","변수들 간의 관계는 그 속성에 따라 직선이 아닌 곡선의형태로도 나타날 수 있다."],"a":3},{"id":"24-1-32","y":2024,"g":1,"n":32,"t":"통계·자료분석","f":"옳은 것 고르기","s":["영가설(null hypothesis)과 연구가설(research hypothesis)에 관한 설명으로 옳은 것은?"],"c":["연구가설은 연구의 개념적 틀 혹은 연구모형으로부터 도출될 수 있다.","연구가설은 그 자체를 직접 검정할 수 있다.","영가설은 연구가설의 검정 결과에 따라 채택되거나 기각된다.","연구가설은 수집된 자료에서 나타난 차이나 관계가 표본추출에서 오는 우연에 의한 것으로 진술된다.","연구가설은 영가설에 대한 반증의 목적으로 설정된다."],"a":1},{"id":"24-1-33","y":2024,"g":1,"n":33,"t":"연구설계(실험·조사유형)","f":"옳은 것 고르기","s":["인과관계 추론에 관한 설명으로 옳은 것은?"],"c":["독립변수들 사이의 상관관계는 인과관계 추론의 일차적조건이다.","독립변수와 종속변수 간의 관계는 두 변수 모두의 원인이 되는 제3의 변수로 설명되어서는 안된다.","종속변수가 독립변수를 시간적으로 앞서야 한다.","횡단적 연구는 종단적 연구에 비해 인과관계 추론에 더적합하다.","독립변수의 변화는 종속변수의 변화와 관련성이 없어야한다."],"a":2},{"id":"24-1-34","y":2024,"g":1,"n":34,"t":"측정(척도·신뢰도·타당도)","f":"사례·제시문 판단","s":["척도의 종류가 올바르게 짝지어진 것은?","ㄱ. 종교 - 기독교, 불교, 천주교, 기타","ㄴ. 교육연수 - 정규 학교 교육을 받은 기간(년)","ㄷ. 학점 - A, B, C, D, F"],"c":["ㄱ: 명목척도, ㄴ: 서열척도, ㄷ: 비율척도","ㄱ: 명목척도, ㄴ: 비율척도, ㄷ: 서열척도","ㄱ: 비율척도, ㄴ: 등간척도, ㄷ: 서열척도","ㄱ: 서열척도, ㄴ: 등간척도, ㄷ: 비율척도","ㄱ: 서열척도, ㄴ: 비율척도, ㄷ: 명목척도"],"a":2},{"id":"24-1-35","y":2024,"g":1,"n":35,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 고르기","s":["측정의 수준이 서로 다른 변수로 묶인 것은?"],"c":["대학 전공, 아르바이트 경험 유무","복지비 지출 증가율, 월평균 소득(만원)","온도(℃), 지능지수(IQ)","생활수준(상, 중, 하), 혈액형","성별, 현재 흡연여부"],"a":4},{"id":"24-1-36","y":2024,"g":1,"n":36,"t":"측정(척도·신뢰도·타당도)","f":"옳지 않은 것","s":["측정에 관한 설명으로 옳지 않은 것은?"],"c":["측정은 연구대상의 속성에 대하여 일정한 규칙에 따라숫자나 기호를 부여하는 과정이다.","사회과학에서는 개념을 측정하기 위해 특질 자체를 측정하기 보다는 특질을 나타내는 지표를 사용하여 간접적으로 측정하는 경우가 많다.","보가더스(Bogardus)의 사회적 거리척도는 등간척도의 한종류이다.","리커트(Likert) 척도는 각 문항의 점수를 합산하여 전체적인 경향이나 특성을 측정하는 방법이다.","측정항목의 수를 많게 하면 신뢰도가 높아지는 경향이있다."],"a":3},{"id":"24-1-37","y":2024,"g":1,"n":37,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 모두 고르기","s":["내적일관성 방법에 근거하여 신뢰도를 측정하는 방법으로 옳은 것을 모두 고른 것은?","ㄱ. 검사-재검사법　　　　ㄴ. 조사자간 신뢰도","ㄷ. 알파계수　　　　　　　ㄹ. 대안법"],"c":["ㄱ","ㄷ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":2},{"id":"24-1-38","y":2024,"g":1,"n":38,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 고르기","s":["신뢰도와 타당도에 관한 설명으로 옳은 것은?"],"c":["타당도가 있다면 어느 정도 신뢰도가 있다고 볼 수 있다.","신뢰도가 높을 경우 타당도도 높다고 할 수 있다.","요인분석법은 신뢰도를 측정하는 방법이다.","신뢰도는 측정하려고 의도된 개념을 얼마나 정확하게 측정하는가를 나타내는 것이다.","주어진 척도가 측정하고자 하는 내용을 담고 있다고 일련의 전문가가 판단할 때 판별타당도가 있다고 한다."],"a":1},{"id":"24-1-39","y":2024,"g":1,"n":39,"t":"표집(표본추출)","f":"사례·제시문 판단","s":["다음 사례에 해당하는 표집용어와 관련한 내용으로 옳은 것은?","A종합사회복지관을 이용하는 노인들을 대상으로 노인맞춤돌봄서비스에 관한 설문조사를 위하여 노인이용자명단에서 300명을 무작위 표본추출 하였다."],"c":["모집단: 표본추출된 300명","표집방법: 할당표집","관찰단위: 집단","표집틀: 노인 이용자명단","분석단위: 집단"],"a":4},{"id":"24-1-40","y":2024,"g":1,"n":40,"t":"표집(표본추출)","f":"옳지 않은 것","s":["표집에 관한 설명으로 옳지 않은 것은?","에서 많이 사용된다."],"c":["의도적표집(purposive sampling)은 비확률표집이다.","할당표집(quota sampling)은 동일추출확률에 근거한다.","눈덩이표집(snowball sampling)은 질적연구나 현장연구","집락표집(cluster sampling)은 모집단에 대한 표집틀이갖추어지지 않더라도 사용가능하다.","체계적표집(systematic sampling)은 주기성(periodicity)이 문제가 될 수 있다."],"a":2},{"id":"24-1-41","y":2024,"g":1,"n":41,"t":"표집(표본추출)","f":"옳지 않은 것","s":["표집오차(sampling error)에 관한 설명으로 옳지 않은 것은?"],"c":["표본의 선정과정에서 발생하는 오차이다.","표집방법에 따라 달라질 수 있다.","동일한 조건이라면 표본크기가 클수록 감소한다.","모집단의 크기와 표본크기의 차이를 말한다.","동일한 조건이라면 이질적 집단보다 동질적 집단에서 추출한 표본의 표집오차가 작다."],"a":4},{"id":"24-1-42","y":2024,"g":1,"n":42,"t":"표집(표본추출)","f":"옳지 않은 것","s":["질적연구에서 일반적으로 사용되는 표집방법이 아닌 것은?"],"c":["판단(judgemental) 표집","체계적(systematic) 표집","결정적 사례(critical case) 표집","극단적 사례(extreme case) 표집","최대변이(maximum variation) 표집"],"a":2},{"id":"24-1-43","y":2024,"g":1,"n":43,"t":"연구설계(실험·조사유형)","f":"옳지 않은 것","s":["다음 사례에 관한 설명으로 옳지 않은 것은?","다문화교육이 청소년들의 다문화수용성에 미치는 영향을 알아보기 위해 청소년 100명을 무작위로 두 집단으로 나누었다. 교육 실시 전 두 집단의 다문화수용성을 측정하고, 한 집단에만 다문화 교육을 실시한 후 다시 두 집단 모두 다문화수용성을 측정하였다."],"c":["전형적인 실험설계이다.","교육에 참여한 집단이 실험집단이다.","외적 요인의 통제를 시도하지 않았다.","내적 타당도의 저해요인이 발생할 수 있다.","두 집단 간의 사전, 사후 측정치를 비교하여 효과를 판단할 수 있다."],"a":3},{"id":"24-1-44","y":2024,"g":1,"n":44,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳지 않은 것","s":["내용분석에 관한 설명으로 옳지 않은 것은?"],"c":["반응적(reactive) 연구방법이다.","서베이(survey) 조사에서 사용하는 표본 추출방법을 사용할 수 있다.","연구과정에서 실수를 하더라도 재조사가 가능하다.","숨은 내용(latent content)의 분석이 가능하다.","양적분석과 질적분석 모두 적용 가능하다."],"a":1},{"id":"24-1-45","y":2024,"g":1,"n":45,"t":"단일사례(개별)연구설계","f":"옳지 않은 것","s":["단일사례연구에 관한 설명으로 옳지 않은 것은?"],"c":["복수의 각기 다른 개입방법을 연속적으로 도입할 수 없다.","시계열설계의 논리를 개별사례에 적용한 것이다.","윤리적인 문제가 발생할 수 있다.","실천과정과 조사연구과정이 통합될 수 있다.","다중기초선 설계의 적용이 가능하다."],"a":1},{"id":"24-1-46","y":2024,"g":1,"n":46,"t":"질적연구방법","f":"옳은 것 고르기","s":["질적연구에 관한 설명으로 옳은 것은?"],"c":["변수중심의 분석이 이루어진다.","논리실증주의적 관점을 견지한다.","인간행동의 규칙성과 보편성을 중시한다.","모집단을 대표할 수 있는 표본을 추출한다.","관찰로부터 이론을 도출하는 귀납적 방법을 활용한다."],"a":5},{"id":"24-1-47","y":2024,"g":1,"n":47,"t":"연구설계(실험·조사유형)","f":"사례·제시문 판단","s":["다음에서 설명하는 설계에 해당하는 것은?","심리상담 프로그램이 시설입소노인의 정서적 안정감에 미치는 영향을 알아보기 위해 사전조사 없이 A요양원의 노인들을 대상으로 프로그램을 실시하였다. 프로그램 종료 후, 인구사회학적 배경이 유사한 B요양원 노인들을 비교집단으로 하여 두 집단의 정서적 안정감을 측정하였다."],"c":["비동일 통제집단 설계","정태적 집단비교 설계","다중시계열 설계","통제집단 사후검사 설계","플라시보 통제집단 설계"],"a":2},{"id":"24-1-48","y":2024,"g":1,"n":48,"t":"자료수집(설문·면접·관찰·내용분석)","f":"사례·제시문 판단","s":["질문 내용 및 방법의 표준화 정도가 낮은 자료수집 유형끼리 바르게 묶인 것은?","ㄱ. 스케줄-구조화 면접","ㄴ. 설문지를 이용한 면접조사","ㄷ. 심층면접","ㄹ. 비구조화 면접"],"c":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ"],"a":5},{"id":"24-1-49","y":2024,"g":1,"n":49,"t":"통계·자료분석","f":"옳은 것 고르기","s":["내적 타당도 저해 요인 중 통계적 회귀에 관한 설명으로 옳은 것은?"],"c":["프로그램의 개입 후 측정치가 기초선으로 돌아가려는 경향","프로그램 개입의 효과가 완전한 선형관계로 나타나는 경향","프로그램의 개입과 관계없이 사후검사 측정치가 평균값에 근접하려는 경향","프로그램 개입 전부터 이미 이질적인 두 집단이 사후조사 결과에서도 차이가 나타나는 경향","프로그램의 개입 전후에 각각 다른 측정도구로 측정함으로써 차이가 나타나는 경향"],"a":3},{"id":"24-1-50","y":2024,"g":1,"n":50,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳은 것 고르기","s":["완전참여자(complete participant)에 관한 설명으로 옳은 것은?"],"c":["연구대상이 관찰된다는 사실을 알기에 자연적인 상태에서의 관찰이 불가능하다.","관찰대상과 상호작용 없이 연구대상을 관찰할 수 있다.","관찰대상의 승인을 받고 관찰대상과 어울리면서도 객관성을 유지할 수 있다.","관찰대상의 승인을 받지 않고 관찰한다는 점에서 연구윤리문제가 제기될 수 있다.","관찰 상황을 인위적으로 통제한 상황에서 관찰을 진행할수 있다."],"a":4},{"id":"25-1-26","y":2025,"g":1,"n":26,"t":"연구설계(실험·조사유형)","f":"옳지 않은 것","s":["사회복지실천을 위한 조사연구의 필요성으로 옳지 않은 것은?"],"c":["문제해결을 위한 사회복지 개입방법의 타당성을 검증할수 있다.","사회복지 서비스를 위한 지식과 기술을 제공할 수 있다.","문제의 원인을 설명함으로써 사회복지사의 직관에 의한실천지식을 강화할 수 있다.","프로그램의 지속여부를 결정하는 객관적 근거를 제공할수 있다.","클라이언트의 욕구를 파악하여 문제해결의 방향을 제시할 수 있다."],"a":3},{"id":"25-1-27","y":2025,"g":1,"n":27,"t":"연구설계(실험·조사유형)","f":"옳은 것 고르기","s":["사회복지 조사연구에서 과학적 연구방법으로 옳은 것은?"],"c":["기술(description)연구에서 문제발생의 원인을 설명하고자 하였다.","연구결과의 일반화를 위해 모집단의 속성이 반영된 충분한 표본을 조사하였다.","가설 검증 결과가 연구자의 기대와 달라서 가설을 연구결과에 맞추어 수정하였다.","연구자의 주관적 판단에 입각하여 연구결과를 해석하였다.","조사를 통해 검증된 인과관계에 입각하여 문제의 발생을단정적 결정론으로 예측하였다."],"a":2},{"id":"25-1-28","y":2025,"g":1,"n":28,"t":"연구설계(실험·조사유형)","f":"사례·제시문 판단","s":["“여성가족부는 2022년 전국가정폭력실태조사 결과를 이전에실시한 동일한 조사내용과 비교하여 보고하였다. 2025년 조사에서도 전국의 가구 중 일부를 선정하여 동일한 조사항목에서 어떠한 변화가 있는지를 보고할 것이다.” 이에 관한조사유형에 해당하는 것으로 모두 묶인 것은?","ㄱ. 종단조사　　　ㄴ. 표본조사","ㄷ. 패널조사　　　ㄹ. 경향조사"],"c":["ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"25-1-29","y":2025,"g":1,"n":29,"t":"변수·가설·연구과정·과학철학","f":"순서 나열","s":["사회복지조사 과정을 순서대로 나열한 것은?","ㄱ. 표집방법을 수립하였다.","ㄴ. 연구문제의 잠정적 결론으로 가설을 설정하였다.","ㄷ. 연구가 필요한 주제를 선정하였다.","ㄹ. 검증된 측정도구로 자료를 수집하였다.","ㅁ. 자료를 분석하고 가설의 지지여부를 결정하였다."],"c":["ㄱ → ㄴ → ㅁ → ㄷ → ㄹ","ㄴ → ㄱ → ㄷ → ㄹ → ㅁ","ㄴ → ㄷ → ㄱ → ㅁ → ㄹ","ㄷ → ㄱ → ㄹ → ㅁ → ㄴ","ㄷ → ㄴ → ㄱ → ㄹ → ㅁ"],"a":5},{"id":"25-1-30","y":2025,"g":1,"n":30,"t":"통계·자료분석","f":"옳은 것 고르기","s":["통계적 가설검증에 관한 설명으로 옳은 것은?"],"c":["가설의 지지여부는 연구가설을 직접 검증하여 반증한다.","신뢰수준을 95%에서 99%로 높이면 제1종 오류의 가능성이 높아진다.","연구가설은 두 변수 간의 관계가 오류에 의해 발생하였음을 가정한다.","유의확률(p)이 설정한 유의수준(α)보다 낮으면 영가설을기각한다.","신뢰수준을 낮추면 제2종 오류의 가능성은 높아진다."],"a":4},{"id":"25-1-31","y":2025,"g":1,"n":31,"t":"변수·가설·연구과정·과학철학","f":"사례·제시문 판단","s":["다음 가설에 포함된 변수에 관한 설명으로 옳은 것은?","사회복지사가 느끼는 업무부담에 따른 소진정도는 동료와의 친밀도에 따라 달라질 것이다."],"c":["소진정도: 통제변수","업무부담: 매개변수","소진정도: 독립변수","업무부담: 종속변수","동료와의 친밀도: 조절변수"],"a":5},{"id":"25-1-32","y":2025,"g":1,"n":32,"t":"측정(척도·신뢰도·타당도)","f":"사례·제시문 판단","s":["다음의 사례에서 확인하고 있는 타당도로 옳은 것은?","A사회복지사는 종합사회복지관 이용만족에 관한 측정도구의 타당도를 확인하고자 한다. 이를 위해 전문가들을 대상으로 프로그램, 사회복지사의 전문성 등의 요소가 측정문항에 충분히 포함되어 있는지에 대한 의견을 확인하였다."],"c":["내용타당도","판별타당도","예측타당도","동시타당도","수렴타당도"],"a":1},{"id":"25-1-33","y":2025,"g":1,"n":33,"t":"측정(척도·신뢰도·타당도)","f":"사례·제시문 판단","s":["○○고등학교에서는 전교생을 대상으로 취약 청소년 집단(A, B, C)에 대한 사회적 거리감을 조사하고자 한다. 아래에서 제시되는 척도로 옳은 것은?","※ 각 대상에 관한 귀하의 생각에 해당 되는 칸에 \"○\"표 하십시오.","","| 문 항 | A집단 청소년 | B집단 청소년 | C집단 청소년 |","|---|---|---|---|","| 1. 친밀한 동아리 구성원으로 받아들임 | | | |","| 2. 같은 학교의 구성원으로 받아들임 | | | |","| 3. 일시적인 방문객으로 받아들임 | | | |"],"c":["리커트 척도(Likert scale)","어의적 분화 척도(semantic differential scale)","보가더스 척도(Bogardus scale)","소시오매트릭스(sociomatrix)","서스톤 척도(Thurstone scale)"],"a":3},{"id":"25-1-34","y":2025,"g":1,"n":34,"t":"측정(척도·신뢰도·타당도)","f":"옳지 않은 것","s":["측정도구의 타당도와 신뢰도에 관한 설명으로 옳지 않은 것은?"],"c":["신뢰도는 측정값의 일관성 정도를 의미한다.","타당도는 측정하고자 하는 바를 반영하는 정도를 의미한다.","측정항목의 수가 적어지면 신뢰도가 낮아지는 경향이 있다.","신뢰도는 타당도의 필요충분조건이 된다.","타당도가 높으면 신뢰도는 높은 경우가 많다."],"a":4},{"id":"25-1-35","y":2025,"g":1,"n":35,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 고르기","s":["측정의 개념적 정의와 조작적 정의에 관한 설명으로 옳은것은?"],"c":["조작적 정의는 개념적 정의에 비해 주관적 해석의 수준이 낮다.","조작적 정의는 양적 조사에 비해 질적 조사에서 더욱 중요하다.","측정하고자 하는 개념의 의미는 조작적 정의를 통해 확장된다.","'조작적 정의 → 개념적 정의 → 측정'의 순서로 이루어진다.","개념적 정의를 통해 변수를 직접 측정할 수 있다."],"a":1},{"id":"25-1-36","y":2025,"g":1,"n":36,"t":"표집(표본추출)","f":"옳지 않은 것","s":["표본 연구에 관한 설명으로 옳지 않은 것은?","다."],"c":["표본 연구는 전수 연구에 비해 시간과 비용 측면에서 효율적이다.","모집단이 큰 경우에는 표본 연구가 적합하다.","표본 연구는 전수 연구에 비해 비표본오차가 크다.","전수 연구에서 모수와 통계치의 구분은 필요하지 않다.","확률표집은 비확률표집에 비해 정확한 표집틀이 필요하"],"a":3},{"id":"25-1-37","y":2025,"g":1,"n":37,"t":"통계·자료분석","f":"옳은 것 모두 고르기","s":["다음의 변수 중 산술평균의 산출이 적합한 변수를 모두 고른 것은?","ㄱ. 만원 단위로 측정한 청소년의 월평균 용돈","ㄴ. 상중하 등급으로 평가한 국어 교과목의 성적","ㄷ. 연 단위로 측정한 청소년의 총 재학 기간","ㄹ. 가출 횟수로 측정한 청소년의 가출 경험"],"c":["ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"25-1-38","y":2025,"g":1,"n":38,"t":"표집(표본추출)","f":"사례·제시문 판단","s":["다음의 연구에서 활용한 표집방법에 관한 설명으로 옳은 것은?","노인복지관 만족도 조사를 위해 지역 내 전체 노인복지관별 등록자명단에서 등록인원 수에 비례해서 난수표를 활용하여 표본을 선정하였다."],"c":["최종적인 표본 선정은 비확률표집 방법을 활용하여 이루어진다.","군집표집에 의한 조사에 비해 표집오차를 줄일 수 있다.","표집단계에서의 편향성을 해결하기 위해 분석단계에서가중치를 활용한다.","표집틀의 부재로 상위군집에서 하위군집으로 이동하여최종 표본을 추출한다.","표본의 집단별 분포를 미리 정하고 할당된 수만큼의 표본을 임의로 선정한다."],"a":2},{"id":"25-1-39","y":2025,"g":1,"n":39,"t":"표집(표본추출)","f":"옳은 것 고르기","s":["표본의 크기에 관한 설명으로 옳은 것은?"],"c":["추정치가 모수에 근접할 확률은 표본의 크기에 반비례한다.","모집단 내 편차가 클수록 표본의 크기를 늘려야 한다.","조사비용과 시간의 한계는 표본의 크기와 관련이 없다.","표본의 크기와 표본오차는 비례한다.","통계분석방법은 표본의 크기와 관련이 없다."],"a":2},{"id":"25-1-40","y":2025,"g":1,"n":40,"t":"연구설계(실험·조사유형)","f":"사례·제시문 판단","s":["다음에서 활용된 조사설계로 옳은 것은?","부모를 대상으로 한 아동학대 예방 프로그램의 효과성을 평가하기 위해 연구 참여자의 아동양육 태도 등을 여러 차례 측정하였다. 프로그램 개입 이후에도 여러 차례 측정하며 프로그램 개입 전후비교를 실시하였다."],"c":["비동일비교집단 설계(nonequivalent comparison groupdesign)","분리표본 사전사후검사 설계(separate-samplepretest-posttest design)","솔로몬 4집단 설계(Solomon four-group design)","단순시계열 설계(simple time-series design)","단일집단 사전사후검사 설계(one-grouppretest-posttest design)"],"a":4},{"id":"25-1-41","y":2025,"g":1,"n":41,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳은 것 고르기","s":["온라인 설문에 관한 설명으로 옳은 것은?"],"c":["표적집단 확인이 대면면접에 비해 제한적이다.","인터넷 접근에 상관없이 표집을 광범위하게 할 수 있다.","대면설문보다 비용은 저렴하지만 시간이 더 많이 소요된다.","복잡하거나 문항수가 많은 경우에 적합하다.","동일인의 중복응답에 대한 통제가 용이하다."],"a":1},{"id":"25-1-42","y":2025,"g":1,"n":42,"t":"연구설계(실험·조사유형)","f":"옳지 않은 것","s":["실험설계에서의 내적타당도 저해요인으로 옳지 않은 것은?"],"c":["실험집단과 통제집단의 참여자간 프로그램 내용에 대해소통하면서 상호작용이 이루어졌다.","프로그램 진행과정에서 일부 대상자가 참여를 중단하였다.","사전검사 결과 학교 부적응 학생들이 실험집단에 과도하게 모인 것이 확인되었다.","사전검사와 사후검사 척도가 동일하기 때문에 참여자의학습효과가 발생하였다.","일부 참여자들이 프로그램에 참여하고 있다는 것을 의식해서 평소와는 다르게 행동하였다."],"a":5},{"id":"25-1-43","y":2025,"g":1,"n":43,"t":"연구설계(실험·조사유형)","f":"옳지 않은 것","s":["솔로몬 4집단 설계에 관한 설명으로 옳지 않은 것은?"],"c":["사회복지 현장에서 실제 활용하기에 용이하다.","외부사건을 통제할 수 있다.","내적타당도가 매우 높은 설계 유형이다.","통제집단 사전사후검사 설계와 통제집단 사후검사 설계를 병행하는 방식이다.","순수실험설계 유형이다."],"a":1},{"id":"25-1-44","y":2025,"g":1,"n":44,"t":"연구설계(실험·조사유형)","f":"사례·제시문 판단","s":["다음의 조사설계에 관한 설명으로 옳은 것은?","A기관에서는 사회복지프로그램의 효과성을 측정하기 위한 조사설계를 진행하였다. 이를 위해 참여자를 실험집단과 통제집단에 무작위로 배정하여 종속변수의 변화를 측정하였다."],"c":["인과적 추론 정도가 무작위 배정을 하지 않은 실험설계보다 낮다.","외생변수 통제, 독립변수 조작, 종속변수의 비교 등에 한계가 있을 때 주로 활용한다.","개입 전에 두 집단의 동질성을 가정할 수 없다.","정태적 집단비교 설계(static-group comparison design)에 해당된다.","전실험설계(pre-experimental design)보다 내적타당도가높다."],"a":5},{"id":"25-1-45","y":2025,"g":1,"n":45,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳지 않은 것","s":["델파이기법에 관한 설명으로 옳지 않은 것은?"],"c":["참여자의 다양한 아이디어를 수집할 수 있다.","기명으로 진행되기 때문에 참여자들의 책임성을 높일 수있다.","결과 도출을 위해 반복해서 진행할 수 있다.","비대면을 원칙으로 한다.","전문가들의 합의점을 찾는데 목표를 둔다."],"a":2},{"id":"25-1-46","y":2025,"g":1,"n":46,"t":"변수·가설·연구과정·과학철학","f":"옳지 않은 것","s":["양적 연구 방법에 관한 설명으로 옳지 않은 것은?"],"c":["논리실증주의에 기반한다.","주관적이며 직관적인 관점에서 접근한다.","구조화된 조사표에 대한 활용 빈도가 높다.","변인에 대한 통제와 측정이 가능하다.","질적연구보다 일반화의 가능성이 높다."],"a":2},{"id":"25-1-47","y":2025,"g":1,"n":47,"t":"단일사례(개별)연구설계","f":"옳은 것 모두 고르기","s":["사회복지실천현장에서 단일사례설계에 관한 설명으로 옳은것을 모두 고른 것은?","ㄱ. AB설계는 기초선 단계(A)와 개입 단계(B)로 구성된다.","ㄴ. 복수기초선설계는 AB설계를 다양한 대상이나 상황 등에 적용하여 동일한 효과를 보이는지 확인하는 설계방법이다.","ㄷ. 사례가 집단일 경우 개별 구성원의 정보들은 평균이나 전체 빈도 등으로 요약되어 단일사례로 취급될 수 있다.","ㄹ. 외적타당도가 높아 일반화의 가능성이 높다."],"c":["ㄱ","ㄴ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"25-1-48","y":2025,"g":1,"n":48,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳은 것 고르기","s":["자료수집방법에 관한 설명으로 옳은 것은?"],"c":["관찰법은 참여자가 면접에 비협조적인 경우에도 활용가능하다.","우편조사법은 대면면접법에 비해 조사자의 편견을 배제하기 힘들다.","전화면접법은 대면면접법에 비해 익명성 보장이 어렵다.","대면면접법은 복잡한 질문의 사용을 배제해야 한다.","대면면접법 중 반구조화된 면접은 질문의 순서, 질문 문항 등을 명확하게 제시해야 한다."],"a":1},{"id":"25-1-49","y":2025,"g":1,"n":49,"t":"질적연구방법","f":"옳은 것 고르기","s":["다음의 사회복지 연구방법에서 성격이 다른 것은?"],"c":["근거이론(grounded theory) 연구","참여행동(participatory action) 연구","서베이(survey) 연구","민속학적(ethnographic) 연구","현상학적(phenomenological) 연구"],"a":3},{"id":"25-1-50","y":2025,"g":1,"n":50,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳지 않은 것","s":["내용분석과 내러티브 탐구에 관한 비교로 옳지 않은 것은?","전자문제집 CBT 앱(구글플레이) : [다운로드]"],"c":["내용분석은 2차적 자료를 분석하고, 내러티브 탐구는 1차적 자료를 분석한다.","모두 비관여적 혹은 비반응성 연구이다.","내용분석에 비해 내러티브 탐구는 과정중심적으로 접근할 수 있다.","내용분석은 내러티브 탐구에 비해 보다 많은 사례를 분석할 수 있다.","모두 자료를 해석하고 구조화하는데 연구자의 객관성 유지가 필요하다."],"a":2},{"id":"26-1-26","y":2026,"g":1,"n":26,"t":"변수·가설·연구과정·과학철학","f":"옳은 것 모두 고르기","s":["과학적 연구의 특성으로 옳은 것을 모두 고른 것은?","ㄱ. 객관적이어야 한다.","ㄴ. 체계적이고 논리적이어야 한다.","ㄷ. 반증가능성에 대하여 개방적이어야 한다.","ㄹ. 연구과정이 투명하게 제시되어야 한다."],"c":["ㄷ","ㄱ, ㄴ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"26-1-27","y":2026,"g":1,"n":27,"t":"변수·가설·연구과정·과학철학","f":"옳지 않은 것","s":["조사방법의 배경이 되는 다양한 패러다임과 그 특성의 연결이 옳지 않은 것은?"],"c":["실증주의 – 진리는 객관적으로 탐구 가능하다.","후기실증주의 – 진리는 연구자의 경험과 특성에 따라 다르게 구성된다.","포스트모더니즘 – 절대적 진리는 존재하지 않는다.","사회구성주의 – 실재는 타인과의 상호작용을 통해 구성된다.","비판이론 – 사회적 현상은 이데올로기(ideology)와 분리될 수 없다."],"a":2},{"id":"26-1-28","y":2026,"g":1,"n":28,"t":"표집(표본추출)","f":"사례·제시문 판단","s":["다음에 해당하는 조사의 유형에 관한 설명으로 옳은 것은?","다문화가정 자녀들이 성장함에 따라 그들의 문화적 정체성이 어떻게 변화하는지를 분석하고자 한다. 2026년 현재 연령이 10대인 자녀들을 모집단으로 하고, 이 중 500명을 표본추출하여 설문조사하였고, 향후 5년마다 동일 모집단에서 같은 크기로 표본추출하여 동일 설문지로 조사할 예정이다."],"c":["코호트(cohort)의 특성에 관하여 시간에 따른 변화를 분석할 수 있다.","일반적으로 횡단연구에 비하여 비용을 절약할 수 있다.","조사대상이 되는 모집단은 조사 시점에 따라 달라진다.","동일인을 응답자로 선정하여 반복 조사하는 것이다.","횡단연구로서의 구조적 장점이 드러나는 연구이다."],"a":1},{"id":"26-1-29","y":2026,"g":1,"n":29,"t":"질적연구방법","f":"옳지 않은 것","s":["양적연구와 질적연구에 관한 설명으로 옳지 않은 것은?"],"c":["질적연구는 연구과정이 경직되지 않아 유연하게 진행된다.","양적연구는 표본의 크기가 대규모일 가능성이 높다.","양적연구는 주로 비구조화된 질문을 사용한다.","질적연구는 자료분석을 통하여 패턴과 의미를 모색한다.","질적연구는 관찰과 면접을 통해 자료수집을 한다."],"a":3},{"id":"26-1-30","y":2026,"g":1,"n":30,"t":"변수·가설·연구과정·과학철학","f":"옳지 않은 것","s":["연구의 분석단위로서 사회적 가공물(social artifacts)에 해당하지 않는 것은?"],"c":["결혼식","유권자 집단","민요","교통사고","요리책"],"a":2},{"id":"26-1-31","y":2026,"g":1,"n":31,"t":"변수·가설·연구과정·과학철학","f":"옳지 않은 것","s":["가설 검증에 관한 설명으로 옳지 않은 것은?"],"c":["통계적 검증력(1-β)이란 영가설이 참일 때 기각될 수 있는 확률을 말한다.","대립가설은 영가설이 기각될 때 채택되는 가설이다.","영가설은 연구가설에 대한 반증의 목적으로 설정된다.","신뢰수준을 높이면 1종 오류는 줄어든다.","연구가설은 영가설을 통해 간접적으로 검증된다."],"a":1},{"id":"26-1-32","y":2026,"g":1,"n":32,"t":"측정(척도·신뢰도·타당도)","f":"옳지 않은 것","s":["측정에 관한 설명으로 옳지 않은 것은?"],"c":["일정한 규칙에 따라 측정대상의 속성에 수치를 부여하는과정이다.","사건이나 현상을 세분화하고 통계적 분석에 활용할 수있는 정보를 제공한다.","측정의 수준에 따라 명목, 서열, 등간, 비율의 4가지 유형으로 분류한다.","측정의 다각화를 통해 측정의 오류를 줄일 수 있다.","타당도가 낮은 측정도구의 사용은 무작위 오차를 발생시킨다."],"a":5},{"id":"26-1-33","y":2026,"g":1,"n":33,"t":"측정(척도·신뢰도·타당도)","f":"옳지 않은 것","s":["조작적 정의에 관한 설명으로 옳지 않은 것은?"],"c":["개념적 정의를 실제 관찰 가능한 속성으로 전환시키는과정이다.","조작적 정의를 통해 측정하고자 하는 개념의 주관적 해석의 수준을 낮춘다.","개념적 정의와 실제 측정의 중간 과정에 해당한다.","측정하고자 하는 개념의 의미는 조작적 정의를 통해 다양해진다.","실질적으로 측정하게 되는 연구개념의 세부적 속성이다."],"a":4},{"id":"26-1-34","y":2026,"g":1,"n":34,"t":"측정(척도·신뢰도·타당도)","f":"빈칸 채우기","s":["다음 사례에 나타난 ( ㄱ )~( ㄷ )의 척도유형을 옳게 짝지은 것은?","연구자 A는 사회복지직 종사자들의 임금수준( ㄱ )이 성별( ㄴ )과 교육수준( ㄷ )에 따라 어떻게 다른지를 알아보고자 하였다. 이를 위해 임금수준은 직전 3개월 평균 급여로, 성별은 남여에게 각각 1과 2를 부여하고, 교육수준은 무학, 초등학교 졸업, 중학교 졸업, 고등학교 졸업, 대학교 졸업 이상으로 각각 1~5를 부여한 후 분석에 활용하였다."],"c":["ㄱ: 등간, ㄴ: 명목, ㄷ: 서열","ㄱ: 비율, ㄴ: 서열, ㄷ: 서열","ㄱ: 비율, ㄴ: 명목, ㄷ: 서열","ㄱ: 등간, ㄴ: 명목, ㄷ: 등간","ㄱ: 비율, ㄴ: 명목, ㄷ: 등간"],"a":3},{"id":"26-1-35","y":2026,"g":1,"n":35,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 모두 고르기","s":["척도에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 보가더스(Bogardus)의 사회적 거리척도는 누적척도이다.","ㄴ. 거트만(Guttman)척도는 각 문항을 서열적으로 구성한다.","ㄷ. 의미차별(semantic differential)척도는 느낌이나 감정을 나타내는 한 쌍의 유사의미 형용사를 사용한다.","ㄹ. 리커트(Likert)척도는 척도나 지수 개발에 용이하다."],"c":["ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"26-1-36","y":2026,"g":1,"n":36,"t":"측정(척도·신뢰도·타당도)","f":"옳지 않은 것","s":["측정도구의 신뢰도와 타당도에 관한 설명으로 옳지 않은 것은?"],"c":["타당도는 측정하려고 의도된 개념을 얼마나 정확하게 측정하는가를 나타내는 것이다.","측정도구의 신뢰도가 높아지면 타당도도 높아진다.","검사-재검사 방법은 신뢰도를 측정하는 방법이다.","다른 조건이 동일하다면, 동일 개념에 대한 측정도구의문항 수가 많아질수록 신뢰도는 높아지는 경향이 있다.","요인분석법은 타당도를 측정하는 방법이다."],"a":2},{"id":"26-1-37","y":2026,"g":1,"n":37,"t":"측정(척도·신뢰도·타당도)","f":"사례·제시문 판단","s":["다음에 나타난 타당도로 옳은 것은?","연구자 A는 한국 청소년의 진로직업역량을 측정하는 문항들에 대해 탐색적 요인분석을 수행하였다. 그 결과, 모든 문항들이 총 3개의 하위 요인에 구분 배치된 것으로 나타났다. 이후 문항 간 상관분석 결과, 서로 다른 요인에 배치된 문항 간 상관은 낮게 나타났다."],"c":["판별타당도(discriminant validity)","예측타당도(predictive validity)","동시타당도(concurrent validity)","내용타당도(content validity)","기준관련타당도(criterion-related validity)"],"a":1},{"id":"26-1-38","y":2026,"g":1,"n":38,"t":"표집(표본추출)","f":"옳지 않은 것","s":["표본크기에 관한 설명으로 옳지 않은 것은?"],"c":["질적조사에 비하여 양적조사의 표본크기가 상대적으로크다.","표본의 크기가 커지면 표집오차(sampling error)는 감소한다.","모수와 통계치의 유사성은 표본크기와 무관하다.","동일한 표집오차를 가정한다면, 분석에 투입된 변수가많아질수록 표본크기는 커져야 한다.","다른 조건이 동일할 때, 신뢰수준을 95%에서 99%로 높이려면 표본크기를 늘려야 한다."],"a":3},{"id":"26-1-39","y":2026,"g":1,"n":39,"t":"표집(표본추출)","f":"옳은 것 고르기","s":["표집에 관한 설명으로 옳은 것은?"],"c":["할당표집(quota sampling)은 확률표집이다.","단순무작위표집(simple random sampling)은 모집단으로부터 표본으로 추출될 확률을 사전에 알 수 있다.","체계적표집(systematic sampling)은 비확률표집이다.","눈덩이표집(snowball sampling)은 무작위 표집을 전제로한다.","임의표집(convenience sampling)은 모집단의 대표성이높은 표본을 추출한다."],"a":2},{"id":"26-1-40","y":2026,"g":1,"n":40,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳은 것 모두 고르기","s":["우편설문법과 대면면접법에 관한 비교설명으로 옳은 것을 모두 고른 것은?","ㄱ. 대면면접법은 우편설문법에 비해 비용이 절감된다.","ㄴ. 우편설문법은 대면면접법에 비해 응답률이 낮다.","ㄷ. 대면면접법은 우편설문법에 비해 응답의 결측치를 최소화할 수 있다.","ㄹ. 우편설문법은 대면면접법에 비해 익명성이 보장된다."],"c":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"26-1-41","y":2026,"g":1,"n":41,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳지 않은 것","s":["설문지 작성에 관한 설명으로 옳지 않은 것은?"],"c":["고정반응이 나타나도록 배열한다.","가치중립적인 용어를 사용하여야 한다.","응답항목은 포괄성과 상호배타성이 있도록 구성해야 한다.","이중(double-barreled)질문과 유도질문은 피하는 것이좋다.","응답자의 이해능력과 응답능력을 고려하여야 한다."],"a":1},{"id":"26-1-42","y":2026,"g":1,"n":42,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳지 않은 것","s":["다음 사례에서 설명하는 조사방법의 특징으로 옳지 않은 것은?","아동학대에 관하여 지난 10년 동안 A신문과 B신문에서 보도한 자료를 내용분석하여 연구를 진행하였다."],"c":["신문 보도자료 속에 숨어있는 잠재적 내용도 분석에 포함될 수 있다.","양적인 분석방법을 사용할 수 있다.","코딩(coding) 작업은 조사과정에 해당하지 않는다.","비관여적 연구조사로 연구대상에게 영향을 미치지 않는다.","분석단위로는 기록단위와 맥락단위가 있다."],"a":3},{"id":"26-1-43","y":2026,"g":1,"n":43,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳은 것 고르기","s":["초점집단면접과 델파이기법에 관한 설명으로 옳은 것은?"],"c":["델파이기법은 패널의 후광효과를 방지하기 어렵다.","초점집단면접은 익명의 전문가들을 패널로 활용한다.","델파이기법은 한 번의 설문조사를 통해 합의를 도출한다.","초점집단면접은 참여자의 수가 많아 조사결과를 일반화하기 용이하다.","델파이기법은 판단의 합의를 얻기 위해서 극단적인 의견이 제외되는 문제가 있다."],"a":5},{"id":"26-1-44","y":2026,"g":1,"n":44,"t":"연구설계(실험·조사유형)","f":"사례·제시문 판단","s":["다음에서 설명하는 조사설계로 옳은 것은?","자아존중감 증진 프로그램의 효과를 평가하기 위해 A 시설과 B 시설을 선정하였다. 두 시설에 거주하는 아동들을 대상으로 자아존중감 사전검사를 실시한 다음 A 시설에 거주하는 아동들을 대상으로 자아존중감 증진 프로그램을 실시하였다. 그 후 사전검사에 참여한 아동들을 대상으로 사후검사를 실시하였다."],"c":["통제집단 사전사후검사 설계","솔로몬 4집단 설계","비동일 통제집단 설계","정태적 집단비교 설계","복수시계열 설계"],"a":3},{"id":"26-1-45","y":2026,"g":1,"n":45,"t":"연구설계(실험·조사유형)","f":"옳은 것 고르기","s":["조사설계의 내적타당도와 외적타당도에 관한 설명으로 옳은 것은?"],"c":["내적타당도가 높으면 외적타당도 또한 높다.","내적타당도는 실험결과를 다른 대상자에게 일반화시킬수 있는 정도를 말한다.","외적타당도는 종속변수에서 나타나는 변화가 독립변수에의한 것임을 확신할 수 있는 정도를 말한다.","연구대상의 대표성이 낮은 경우 외적타당도를 저해할 수있다.","우연한 외부사건이나 실험도중 탈락은 외적타당도 저해요인이다."],"a":4},{"id":"26-1-46","y":2026,"g":1,"n":46,"t":"연구설계(실험·조사유형)","f":"옳지 않은 것","s":["실험설계의 유형에 관한 설명으로 옳지 않은 것은?"],"c":["통제집단 사후검사 설계는 실험집단과 통제집단의 사전동질성 여부를 확인할 방법이 없다.","요인 설계는 독립변수가 2개 이상일 때 적용하는 설계이다.","솔로몬 4집단 설계는 통제집단 사전사후검사 설계와 통제집단 사후검사 설계를 결합한 설계이다.","시계열 설계는 검사(testing) 효과를 통제하기 어렵다.","정태적 집단비교 설계는 내적 타당도와 외적 타당도가높다."],"a":5},{"id":"26-1-47","y":2026,"g":1,"n":47,"t":"단일사례(개별)연구설계","f":"옳지 않은 것","s":["단일사례설계에 관한 설명으로 옳지 않은 것은?","야 하는 사례에 적합하다."],"c":["측정을 위한 비관여적 관찰도 가능하다.","평균비교는 기초선이 불안정할 때 기초선의 변화의 폭과기울기까지 고려하여 결과를 분석하는 방법이다.","BAB설계는 기초선을 설정할 시간적 여유가 없이 개입해","변화의 파동, 경향, 수준 등을 검토하여 개입의 효과성을평가한다.","복수기초선설계는 여러 대상이나 상황에 적용하여 개입의 효과를 측정한다."],"a":2},{"id":"26-1-48","y":2026,"g":1,"n":48,"t":"질적연구방법","f":"옳지 않은 것","s":["질적연구에 관한 설명으로 옳지 않은 것은?"],"c":["연구자 자신이 자료수집 도구가 된다.","자료에 근거하여 이론을 생성하는 연구도 가능하다.","자연주의는 질적연구의 오랜 전통이다.","참여적 관찰의 경우 연구자의 편향성이 통제된다.","연구참여자와의 라포르(rapport) 형성이 필요할 수 있다."],"a":4},{"id":"26-1-49","y":2026,"g":1,"n":49,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 모두 고르기","s":["타당도에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 하나의 척도가 그것이 측정하고자 하는 개념과 연관된 통상적 합의와 일치하는 정도는 구성타당도(construct validity)이다.","ㄴ. 개발된 측정도구의 측정값을 현재 사용되고 있는 측정도구와 비교하는 것은 동시타당도(concurrent validity)이다.","ㄷ. 측정하려는 개념이 포함된 이론체계 안에서 다른 변수와 관련된 방식에 기초한 타당도는 내용타당도(content validity)이다.","ㄹ. 기준관련타당도(criterion-related validity)는 기준변수의 발생 시점에 따라 동시 타당도와 예측타당도(predictive validity)로 나뉜다."],"c":["ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"26-1-50","y":2026,"g":1,"n":50,"t":"질적연구방법","f":"옳지 않은 것","s":["문화기술지(ethnography)에 관한 설명으로 옳지 않은 것은?"],"c":["특정집단이 공유하고 있는 생활양식의 의미를 이해하기위한 것이다.","세부 유형으로 비판적문화기술지를 포함한다.","내부자적(emic) 관점과 외부자적(etic) 관점이 필요하다.","개방코딩, 축코딩, 선택코딩으로 인과조건을 발견한다.","문화인류학과 관계가 깊다."],"a":4}],"data/q_sk.json":[{"id":"17-2-26","y":2017,"g":2,"n":26,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["정신역동모델에 관한 설명으로 옳지 않은 것은?"],"c":["심리적 결정론에 근거한다.","발달단계상의 고착과 퇴행을 고려한다.","성장의지가 높은 클라이언트에게 효과적이다.","통찰보다는 치료적 처방제공에 초점을 둔다.","원초아와 초자아 사이에 발생하는 불안과 긴장 해소를위해 방어기제를 사용한다."],"a":4},{"id":"17-2-27","y":2017,"g":2,"n":27,"t":"가족 대상 실천(가족치료모델)","f":"옳은 것 고르기","s":["가족에 관한 설명으로 옳은 것은?"],"c":["정서적 기능보다 가계 계승과 같은 제도적 기능이 중시되는 방향으로 변화하고 있다.","부모-자녀 관계는 밀착된 경계를 가진 관계일수록 기능적이다.","가족문제는 단선적 인과론으로 설명하는 것이 효과적이다.","가족항상성은 가족규칙을 활성화하여 지속적인 관계를유지하도록 한다.","가족생활주기가 변해도 역할분담은 고정되어 있는 것이적응적이다."],"a":4},{"id":"17-2-28","y":2017,"g":2,"n":28,"t":"집단 대상 실천(집단사회사업)","f":"옳지 않은 것","s":["집단프로그램 유형별 지도자의 역할로 옳지 않은 것은?"],"c":["한부모가족 자조모임 - 감정이입적 이해와 상호원조의촉진자","중간관리자 역량강화프로그램 - 집단토의를 위한 구조제공자","에니어그램을 통한 자기인식향상프로그램 - 통찰력 발달의 촉진자","우울증 인지행동집단치료프로그램 - 무력감 극복을 위한옹호자","중도입국자녀들의 한국사회적응프로그램 - 프로그램 디렉터"],"a":4},{"id":"17-2-29","y":2017,"g":2,"n":29,"t":"가족 대상 실천(가족치료모델)","f":"옳은 것 모두 고르기","s":["보웬(M. Bowen)의 다세대체계이론에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 자아분화수준이 낮은 부모는 미분화에서 오는 자신들의 불안이나 갈등을 삼각관계를 통해 회피하려 한다.","ㄴ. 나-입장취하기(I-position)는 타인을 비난하는 대신 자신이 생각하고 느낀 바를 말하며 탈삼각화를 촉진한다.","ㄷ. 가족조각으로 가족에 대한 인식을 시각적으로 표현하고 이해하도록 돕는다.","ㄹ. 가계도를 작성하고 해석하면서 가족의 정서적 과정을 가족과 함께 이야기한다."],"c":["ㄱ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"17-2-30","y":2017,"g":2,"n":30,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["해결중심모델에 관한 설명으로 옳은 것은?"],"c":["규범적이다.","과거를 지향한다.","병리적인 것에 초점을 둔다.","문제의 원인규명에 초점을 둔다.","변화는 항상 일어나며 불가피하다."],"a":5},{"id":"17-2-31","y":2017,"g":2,"n":31,"t":"면접·의사소통·사정·기록","f":"옳은 것 고르기","s":["가정폭력 가해자를 대상으로 다음의 훈련을 실시하였다. 평가 시 ‘암시적 행동에 대한 개별측정척도’를 활용하지 않는 것은?"],"c":["폭력을 유발하는 단서를 식별하는 훈련","긴장고조 상황에서 타임아웃 하는 훈련","분노를 피하는 자기대화훈련","시각적 현상화훈련","사회기술훈련"],"a":5},{"id":"17-2-32","y":2017,"g":2,"n":32,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["인지행동모델에 관한 설명으로 옳지 않은 것은?"],"c":["인간행동은 의지에 의해 결정된다.","인간행동은 전 생애에 걸쳐 학습된다.","주관적인 경험의 독특성을 인정하지 않는다.","구조화된 접근을 강조한다.","지적 능력을 가진 클라이언트에게 적용이 보다 용이하다."],"a":3},{"id":"17-2-33","y":2017,"g":2,"n":33,"t":"면접·의사소통·사정·기록","f":"옳은 것 고르기","s":["가족사정방법에 관한 설명으로 옳은 것은?"],"c":["가계도로 가족과 환경과의 접촉에서 발생하는 정보를 수집하고 정리한다.","생태도로 세대 간 반복되는 유형을 파악한다.","사회적 관계망표로 사회적 관계에서의 지지 유형과 정도를 파악한다.","가족지도로 가족생활주기를 파악한다.","PIE 척도로 종단적 생활사건을 한 눈에 파악한다."],"a":3},{"id":"17-2-34","y":2017,"g":2,"n":34,"t":"면접·의사소통·사정·기록","f":"옳은 것 고르기","s":["좋은 기록의 특징으로 옳은 것은?"],"c":["서비스의 결정과 실행에 초점을 둔다.","상황묘사와 사회복지사의 견해를 구분하지 않는다.","비밀보장을 위해 정보를 쉽게 분류할 수 없게 한다.","모든 문제나 상황을 가능한 자세하고 풍부하게 기술한다.","클라이언트의 관점은 배제하고 전문적 견해를 강조한다."],"a":1},{"id":"17-2-35","y":2017,"g":2,"n":35,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["사회복지실천모델에서 사용하는 기술에 관한 설명으로 옳은 것은?"],"c":["예외질문 - 문제가 해결된 미래에 대해 상상하도록 함으로써 변화의 목표를 찾아낸다.","명료화 - 저항이나 전이에 대한 이해를 반복, 심화, 확장하여 통합한다.","행동조성 - 목표행동을 세분화하여 연속적, 단계적으로강화하는 것이다.","유형 역동성 고찰 - 상황을 드러내고, 그에 따른 감정을표현함으로써 감정전환을 도모한다.","체계적 탈(둔)감법 - 특정 행동에 대한 불안을 유발하는행동을 하도록 지시하는 것이다."],"a":3},{"id":"17-2-36","y":2017,"g":2,"n":36,"t":"가족 대상 실천(가족치료모델)","f":"옳지 않은 것","s":["사티어(V. Satir)의 의사소통 가족치료 모델에 관한 설명으로 옳지 않은 것은?"],"c":["자아존중감 향상을 목적으로 한다.","개인의 내적 과정을 이끌어내기 위해 빙산기법을 활용한다.","효과적인 의사소통을 위해 솔직하게 표현하고 타인의 생각과 감정을 수용한다.","회유형 의사소통은 기능적 의사소통이다.","정서적 경험과 가족체계에 대한 이중적 초점을 강조한다."],"a":4},{"id":"17-2-37","y":2017,"g":2,"n":37,"t":"면접·의사소통·사정·기록","f":"옳지 않은 것","s":["클라이언트의 인식에 기초한 질적 평가의 목적이 아닌 것","은?"],"c":["긍정적 피드백으로 사회복지사의 소진 예방","의도된 성과 외에 부가적인 성과 확인","기여요인과 방해요인에 대한 피드백","변화의 일반적인 요인 외에 특수한 요인을 발견하고 실천에 통합","클라이언트의 시각에서 프로그램 의미 도출"],"a":1},{"id":"17-2-38","y":2017,"g":2,"n":38,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 모두 고르기","s":["사회복지실천모델에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 권한부여모델에서는 클라이언트를 파트너로 인식한다.","ㄴ. 진단주의와 기능주의의 논쟁 통합이 문제해결모델에서 이루어졌다.","ㄷ. 클라이언트중심모델에서는 과거의 경험보다 현재의 경험을 강조한다.","ㄹ. 위기개입모델에서는 사건에 대한 주관적인 인식보다 사건자체를 중요시한다."],"c":["ㄱ","ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"17-2-39","y":2017,"g":2,"n":39,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 모두 고르기","s":["행동수정모델의 개입기술에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 처벌받는 행동은 발생빈도가 줄어든다.","ㄴ. 간헐적으로 강화된 행동은 소거하기 어렵다.","ㄷ. 긍정적인 강화는 행동의 발생빈도와 정도를 증가시킨다.","ㄹ. 부적 처벌은 체벌을 제시함으로써 행동의 발생 가능성을 감소시킨다."],"c":["ㄹ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"17-2-40","y":2017,"g":2,"n":40,"t":"집단 대상 실천(집단사회사업)","f":"옳지 않은 것","s":["집단프로그램 참여자에 대한 사전면접의 중요성에 관한 설명으로 옳지 않은 것은?"],"c":["관계형성을 하고 개별적인 관심사를 찾아낼 수 있다.","추가정보를 얻어서 개입의 방향을 조정할 수 있다.","참여자에 대한 사전지식으로 집단 내 행동의 의미를 빨리 파악할 수 있게 한다.","참여자들이 집단 내에서 좀 더 쉽게 개방적이 되도록 돕는다.","패턴화된 집단행동을 확인하고 성장을 지원할 수 있다."],"a":5},{"id":"17-2-41","y":2017,"g":2,"n":41,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["과제중심모델에 관한 설명으로 옳지 않은 것은?"],"c":["단기간의 종합적인 개입모델이다.","클라이언트가 동의한 과제를 중심으로 개입한다.","경험적 자료보다는 발달이론을 중심으로 개입한다.","계약한 구체적인 문제해결에 초점을 두고 접근한다.","클라이언트의 문제는 자원 혹은 기술의 부족으로 이해한다."],"a":3},{"id":"17-2-42","y":2017,"g":2,"n":42,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 모두 고르기","s":["사회복지실천기술의 예시가 옳은 것을 모두 고른 것은?","ㄱ. 격려기술-계약기간 동안 업무를 잘 해내셨군요. 이번에도 잘 감당할 수 있을 것이라 믿어요.","ㄴ. 재보증기술 - 염려하지 마세요. 상황은 좋아질 거예요.","ㄷ. 환기기술 - 힘드셨을 것 같네요. 그 때 기분이 어떠셨나요?","ㄹ. 직면기술 - 잠시 무엇을 했는지 한 번 살펴봅시다. 지난 번 하겠다고 한 것과는 반대의 일을 하고 있네요."],"c":["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"17-2-43","y":2017,"g":2,"n":43,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["자살유가족지지집단 참여자의 자기개방수준이 낮아 효과적인 개입이 이루어지지 않고 있다. 간접적 자기노출을 활용하는 기법은?"],"c":["무기명 질문목록카드로 도출된 문제에 대해 토론한다.","이야기막대를 잡은 사람의 자기표현을 독려하고 다른 구성원들은 이에 집중하도록 한다.","감정목록표로 자신의 감정과 유사한 표현을 활용하여 구체적으로 어려움을 표현하도록 한다.","위기카드를 활용하여 반복되는 문제상황의 재발을 방지한다.","재구성하기 기법으로 현 상황에 대한 다른 해석을 촉진한다."],"a":1},{"id":"17-2-44","y":2017,"g":2,"n":44,"t":"집단 대상 실천(집단사회사업)","f":"옳지 않은 것","s":["집단 구성단계에서 유의할 점으로 옳지 않은 것은?"],"c":["인구학적 특성, 문제 유형간의 동질성과 이질성의 균형을 고려한다.","의사결정의 역효과 예방을 위해 구성원들의 집단의사결정방법을 확인한다.","응집력과 신뢰감을 발달시킬 만큼 충분한 회기로 계획한다.","회합의 빈도구성은 구성원들의 욕구나 문제를 다루기에적절해야 한다.","집단크기는 목적을 달성할 만큼 작고 경험의 다양성을제공할 만큼 크게 구성하는 것이 좋다."],"a":2},{"id":"17-2-45","y":2017,"g":2,"n":45,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"사례·제시문 판단","s":["다음 사례에서 사회복지사가 사용하고 있는 기술은?","딸이 말을 하면 엄마가 나서서 설명하며 대변하는 일이 반복될 때, 사회복지사가 딸을 보면서 \"엄마가 대변인이시네요. 이것에 대해서 딸이 설명해보겠어요?\"라고 하면서 딸이 직접 말할 수 있도록 한다."],"c":["추적하기","경계만들기","치료적 삼각관계","대처질문","재명명"],"a":2},{"id":"17-2-46","y":2017,"g":2,"n":46,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["다음 사례를 구조적 가족치료모델로 개입할 때 활용할 수 있는 기법이 아닌 것은?","초등학교 2학년 아이를 키우며 직장을 다니고 있는 한부모 A씨는 아이가 자신의 말을 잘 듣지 않고 무시하는 문제를 호소하고 있는데, 아이의 행동문제가 점점 심각해지고 있다. 아이는 A씨가 올 때까지 외조모가 돌봐주고 있으며 외조모는 종종 A씨의 훈육과 반대되는 방향으로 아이를 대하며, 아이 앞에서 A씨의 훈육방법을 야단친다."],"c":["하위체계간 경계 만들기","과제주기","가족 재구조화","실연","외현화"],"a":5},{"id":"17-2-47","y":2017,"g":2,"n":47,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["사회복지실천모델의 특성과 해당 모델의 연결이 옳지 않은 것은?"],"c":["단기개입을 강조 - 위기개입모델","클라이언트의 자기결정권을 강조 - 과제중심모델","환경에 대한 개입을 강조 - 생태체계모델","클라이언트의 강점을 강조 - 인지행동모델","클라이언트와의 협력적 관계를 강조 - 클라이언트중심모델"],"a":4},{"id":"17-2-48","y":2017,"g":2,"n":48,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 모두 고르기","s":["역설적 개입에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 가족이 변화에 대한 저항이 클 때 사용할 수 있다.","ㄴ. 문제와 관련된 가족의 행동체계를 정확히 파악하며 증상처방기법을 활용한다.","ㄷ. 원가족 분석을 중시하는 개입방법이다.","ㄹ. 치료적 이중구속을 활용하며 문제를 해결하는 것이다."],"c":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"17-2-49","y":2017,"g":2,"n":49,"t":"집단 대상 실천(집단사회사업)","f":"옳지 않은 것","s":["집단유형별 특성에 관한 설명으로 옳지 않은 것은?"],"c":["치료집단은 자기노출정도가 높아서 비밀보장이 중요하다.","과업집단은 구성원의 발달과업 완수를 위해 조직구조의영향을 최소화한다.","자발적 형성집단은 구성원들이 설정한 목적을 보호하는것이 중요하다.","자조집단에서 사회복지사의 역할은 공유된 문제에 대한지지를 하는 것이다.","비자발적 집단에서는 협상 불가능영역이 있음을 분명히한다."],"a":2},{"id":"17-2-50","y":2017,"g":2,"n":50,"t":"면접·의사소통·사정·기록","f":"사례·제시문 판단","s":["집단의 종결단계에서 사회복지사의 역할에 관한 설명으로 옳은 것은?","다."],"c":["계획된 목표달성여부에 집중하며 의도하지 않는 결과는확인하지 않는다.","참여자간 서열화 투쟁이 시작되므로 책임을 설정한 계약을 재확인 시킨다.","집단의 목적에 따른 집단구성과 구성원의 목적 성취를원조한다.","종결에 대한 양가감정을 이해하고 이를 반영하여 다룬","도움을 많이 받은 사람은 종결의 어려움을 덜 느끼므로그렇지 않은 사람에게 집중한다."],"a":4},{"id":"18-2-26","y":2018,"g":2,"n":26,"t":"가족 대상 실천(가족치료모델)","f":"사례·제시문 판단","s":["다음의 사례에 나타난 가족 의사소통 내용은?","아버지는 아들에게 \"가족회의에서는 자신의 의견을 소신 있게 밝힐 줄 알아야 한다.\"라고 평소에 강조한다. 그런데 막상 가족회의에서 아들이 자신의 의견을 말하면, \"너는 아직 머리니 가만히 있어!\"라고 하면서 면박을 준다."],"c":["구두점","이중구속","피드백","역설적 지시","이중질문"],"a":2},{"id":"18-2-27","y":2018,"g":2,"n":27,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 모두 고르기","s":["사회복지 전문직의 가치체계를 모두 고른 것은?","ㄱ. 사회적 형평성의 원리","ㄴ. 개인의 복지에 대한 사회와 개인 공동의 책임","ㄷ. 개인의 존엄성과 독특성에 대한 존중","ㄹ. 자기결정의 원리"],"c":["ㄱ,ㄴ","ㄷ,ㄹ","ㄱ,ㄷ,ㄹ","ㄴ,ㄷ,ㄹ","ㄱ,ㄴ,ㄷ,ㄹ"],"a":5},{"id":"18-2-28","y":2018,"g":2,"n":28,"t":"면접·의사소통·사정·기록","f":"옳은 것 모두 고르기","s":["사회복지실천 기록의 목적에 해당하는 것을 모두 고른 것은?","ㄱ. 개인적 보관 및 활용","ㄴ. 지도감독 및 교육 활성화","ㄷ. 책임성의 확보","ㄹ. 정보제공","ㅁ. 클라이언트에 대한 이해 증진"],"c":["ㄴ,ㄹ","ㄱ,ㄷ,ㅁ","ㄱ,ㄴ,ㄷ,ㄹ","ㄴ,ㄷ,ㄹ,ㅁ","ㄱ,ㄴ,ㄷ,ㄹ,ㅁ"],"a":4},{"id":"18-2-29","y":2018,"g":2,"n":29,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"사례·제시문 판단","s":["다음의 사례에서 사용한 행동주의모델 전략은?","아이가 버릇없이 굴 때마다 어머니는 아이를 달래주거나 야단을 쳤다. 그래도 아이의 행동이 변화되지 않자, 어머니는 생각을 바꿔 아이를 달래주지도, 야단치지도 않았다. 그 결과, 아이의 버릇없는 행동이 감소되었다."],"c":["멈춤","소거","사회기술훈련","행동형성(shaping)","대리적 조건 형성"],"a":2},{"id":"18-2-30","y":2018,"g":2,"n":30,"t":"가족 대상 실천(가족치료모델)","f":"옳지 않은 것","s":["가족체계의 순환적 인과성에 관한 설명으로 옳지 않은 것은?"],"c":["가족체계 내 문제가 세대 간 전이를 통해 나타남을 의미한다.","가족구성원이 많을 때 더욱 복잡한 양상을 띤다.","상호 영향을 주고받는 과정에서 나타나는 현상이다.","가족의 문제가 유지되는 상호작용 과정을 파악하여 문제를 해결한다.","증상을 표출하는 성원 또는 다른 성원의 변화를 통해 가족 문제를 해결한다."],"a":1},{"id":"18-2-31","y":2018,"g":2,"n":31,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"순서 나열","s":["실천지식의 구성수준을 추상성에서 구체성의 방향으로 순서대로 나열한 것은?"],"c":["패러다임 - 관점 - 이론 - 모델 - 실천지혜","패러다임 - 이론 - 관점 - 모델 - 실천지혜","관점 - 패러다임 - 이론 - 모델 - 실천지혜","실천지혜 - 모델 - 이론 - 관점 - 패러다임","실천지혜 - 이론 - 모델 - 관점 - 패러다임"],"a":1},{"id":"18-2-32","y":2018,"g":2,"n":32,"t":"가족 대상 실천(가족치료모델)","f":"옳지 않은 것","s":["사티어(V. Satir)의 의사소통유형과 그 내용의 연결이 옳지 않은 것은?"],"c":["아첨형: 자신 무시, 타인 존중, 상황 존중","일치형: 자신 존중, 타인 존중, 상황 존중","비난형: 자신 존중, 타인 무시, 상황 존중","산만형: 자신 무시, 타인 무시, 상황 무시","초이성형: 자신 존중, 타인 무시, 상황 무시"],"a":5},{"id":"18-2-33","y":2018,"g":2,"n":33,"t":"가족 대상 실천(가족치료모델)","f":"옳지 않은 것","s":["가족조각 기법에 관한 설명으로 옳지 않은 것은?"],"c":["가족의 상호작용 양상을 공간 속에 배치하는 방법이다.","가족 내 숨겨져 표현되지 못했던 감정이나 가족규칙 등이 노출될 수 있다.","조각 후, 사회복지사는 현재의 조각이 어떻게 변화되기바라는지를 다시 조각으로 표현하게 한다.","조각을 하는 동안 서로 웃거나 이야기하지 않는다.","가족을 조각한 사람은 객관성을 유지하기 위해 조각에서제외되는 것이 일반적이다."],"a":5},{"id":"18-2-34","y":2018,"g":2,"n":34,"t":"가족 대상 실천(가족치료모델)","f":"옳지 않은 것","s":["현대사회 가족의 변화에 해당하지 않는 것은?"],"c":["규모의 축소","권력구조의 불평등 심화","생활주기의 변화","기능의 축소","형태의 다양화"],"a":2},{"id":"18-2-35","y":2018,"g":2,"n":35,"t":"집단 대상 실천(집단사회사업)","f":"옳은 것 고르기","s":["집단과정을 촉진하기 위한 사회복지사의 실천 활동으로 옳은 것은?"],"c":["원만한 관계 유지를 위해 추상적이고 우회적인 피드백제공","집단 성원의 전달하는 메시지 사이에 불일치가 있을 경우, 이를 확인","집단 성원의 긍정적 변화를 위해 그의 단점을 중심으로피드백 제공","자신의 경험, 감정, 생각 등을 집단 성원에서 지속적으로상세하게 노출","다차원적인 내용의 여러 가지 피드백을 한 번에 제공"],"a":2},{"id":"18-2-36","y":2018,"g":2,"n":36,"t":"면접·의사소통·사정·기록","f":"옳지 않은 것","s":["알코올 중독 노숙인의 자활을 위해 다차원적으로 개입한 후, 단일사례설계를 활용하여 사업의 성과를 평가하려고 한다. 이때 성과지표로 사용 가능한 자료가 아닌 것은?"],"c":["밤사이 숙소 밖에 버려진 술병의 수","직업훈련 참여 시간","직업훈련의 성격","스스로 측정한 자활의지","단주 모임에 나간 횟수"],"a":3},{"id":"18-2-37","y":2018,"g":2,"n":37,"t":"집단 대상 실천(집단사회사업)","f":"사례·제시문 판단","s":["다음의 집단사회복지사의 활동이 주로 나타나는 단계는?","- 집단 성원의 불안감, 저항감을 감소시키기 위해 노력","- 집단 성원 간 공통점을 찾아 연결시킴","- 집단의 목적을 집단 성원 모두가 공유하게 함"],"c":["준비 단계","초기 단계","중간 단계","종결 단계","사후관리 단계"],"a":2},{"id":"18-2-38","y":2018,"g":2,"n":38,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"사례·제시문 판단","s":["대중 앞에서 발표할 때 만성적 긴장과 불안을 호소하는 클라이언트의 문제를 해결하기 위한 다음의 실천활동에 포함되지 않은 기법은?","사회복지사는 대중 앞에서 발표를 잘 하는 사람의 동영상을 클라이언트에게 여러차례 보여주었다. 이후 사회복지사 앞에서 간단한 발표를 반복적으로 연습하게 한 후, 2~3명 앞에서 발표하게 하였다. 발표에 앞서 사회복지사는 20초 복식호흡과 함께 평화로운 하늘의 구름을 연상하도록 지시하였다. 그 후, 그룹의 크기를 조금씩 키워가면서 발표하도록 하였고, 나중에는 200여명 앞에서 발표를 하도록 하였다. 이 때도 복식호흡과 심상훈련을 하게 하였다."],"c":["시연","모델링","이완훈련","정적 강화","체계적 둔감화"],"a":4},{"id":"18-2-39","y":2018,"g":2,"n":39,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"사례·제시문 판단","s":["다음과 같은 목표설정을 주로 하는 사회복지실천모델은?","- 작고 구체적이며 행동적일 것","- 클라이언트가 중요하다고 생각하는 것","- 클라이언트가 갖지 않은 것보다 갖고 있는 것에 초점을 둠","- 긍정적이며 과정의 형태로 정의","- 목표를 문제해결의 시작으로 간주"],"c":["인지행동모델","해결중심모델","클라이언트중심모델","심리사회모델","행동수정모델"],"a":2},{"id":"18-2-40","y":2018,"g":2,"n":40,"t":"면접·의사소통·사정·기록","f":"옳지 않은 것","s":["형성평가에 관한 설명으로 옳지 않은 것은?"],"c":["프로그램의 최종 목표 달성 여부를 효과성과 효율성 측면에서 평가한다.","개입이 이루어지는 동안 발생하는 자료를 수집하여 환류하는 것을 중시한다.","현재와 미래에 관련된 프로그램 수행상의 문제해결이나결정을 내리기 위해 실시한다.","프로그램의 전달체계, 기관의 운영상황, 클라이언트의 욕구 등을 염두에 두고 시행한다.","서비스이용자의 욕구를 반영하여 사회복지사가 기대했던진전이 이루어지고 있는지를 사정한다."],"a":1},{"id":"18-2-41","y":2018,"g":2,"n":41,"t":"집단 대상 실천(집단사회사업)","f":"옳지 않은 것","s":["집단 사정을 위한 활동으로 옳지 않은 것은?"],"c":["개별성원에 대해서는 기능적 행동과 비기능적 행동을 파악하여 개인별 프로파일을 작성","소시오그램을 활용하여 집단 성원 간 결탁, 수용, 거부등을 파악","의의차별척도(semantic differential scale)를 활용하여집단의 전반적 상호작용 양상을 평가","상호작용차트를 활용하여 일정시간 동안 집단 성원 간발생한 특정행동의 빈도를 측정","집단에서 허용되지 않는 감정표현이나 이야기 주제, 그리고 집단활동에 대한 성원의 태도 등을 통해 집단의 규범을 확인"],"a":3},{"id":"18-2-42","y":2018,"g":2,"n":42,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 모두 고르기","s":["인지행동모델의 특성을 모두 고른 것은?","ㄱ. 객관적 경험의 일반화","ㄴ. 사건을 이해하는 신념체계가 감정에 영향을 주는지 파악","ㄷ. 문제에 대한 통제력이 자신에게 있다고 전제","ㄹ. 질문을 통해 자기발견과 타당화의 과정을 거침"],"c":["ㄱ,ㄹ","ㄴ,ㄹ","ㄱ,ㄴ,ㄷ","ㄴ,ㄷ,ㄹ","ㄱ,ㄴ,ㄷ,ㄹ,"],"a":4},{"id":"18-2-43","y":2018,"g":2,"n":43,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"사례·제시문 판단","s":["다음의 사례에서 사용한 사회복지실천기술은?","클라이언트: \"아버지께 화내서 너무 죄송해요. 왜냐하면 아버지께서 당뇨를 앓고 계시거든요. 더구나 당뇨관리가 제대로 안되어 다리 절단의 위기에 처해있는데도 술을 계속 드실 때에는 화를 내게 돼요. 나는 왜 우리가 잘 지내지 못하는지 모르겠어요.\"","사회복지사: \"아버지를 걱정하고 관계가 향상되길 바라지만 때때로 아버지와 함께 하는 것이 매우 어려운 것 같군요.\""],"c":["재명명(reframing)","탐색(probing)","환언(paraphrasing)","지시(direction)","해석(interpretation)"],"a":3},{"id":"18-2-44","y":2018,"g":2,"n":44,"t":"집단 대상 실천(집단사회사업)","f":"옳지 않은 것","s":["집단사회사업의 장점에 관한 설명으로 옳지 않은 것은?"],"c":["타인에게 도움을 줄 수 있는 기회를 통해 이타성이 향상된다.","집단 내에서 서로 공통된 문제를 확인함으로써 자신의문제를 일반화할 수 있다.","타인의 행동을 관찰하는 과정에서 자신의 잘못된 생각을고쳐 나갈 수 있는 치료적 효과를 가진다.","구성과 자신의 문제를 분석하고 역전이를 통해 해결하는보편성을 경험한다.","집단 내에서 역기능적인 경험을 재현함으로써 이를 통해성장의 기회를 가진다."],"a":4},{"id":"18-2-45","y":2018,"g":2,"n":45,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"사례·제시문 판단","s":["다음의 설명에 해당하는 사회복지실천모델은?","- 의미있는 선택을 할 수 있게 자아효능감을 증진하고 자신의 강점을 찾도록 돕는다.","- 클라이언트를 잠재력 있는 인간이며, 문제해결을 위한 자원으로 인식한다.","- 클라이언트 자신의 삶과 상황에 대해 더 많은 통제력을 갖도록 돕는다."],"c":["해결중심모델","심리사회모델","임파워먼트모델","과제중심모델","위기모델"],"a":3},{"id":"18-2-46","y":2018,"g":2,"n":46,"t":"집단 대상 실천(집단사회사업)","f":"옳지 않은 것","s":["집단사회복지실천에 관한 설명으로 옳지 않은 것은?"],"c":["집단이 개방적일 경우, 발달단계를 예측하는 것이 용이하다.","하위집단의 발생은 필연적이기 때문에 전체집단에 부정적 영향을 주는지 파악하는 것이 필요하다.","집단의 규범은 집단 내부를 통제하기 때문에 외적 통제의 수준을 감소시킨다.","집단 내 공동지도자의 참여는 집단지도자의 역전이를 막을 수 있다.","자기애적 성향을 가진 성원의 경우 집단에 적절한 행동과 사고를 할 수 있도록 돕는다."],"a":1},{"id":"18-2-47","y":2018,"g":2,"n":47,"t":"면접·의사소통·사정·기록","f":"옳은 것 모두 고르기","s":["자살을 생각하는 클라이언트의 문제에 개입할 때 적절한 내용을 모두 고른 것은?","ㄱ. 자살 관련 계획을 직접적으로 묻는 것은 자살을 구체화할 수 있어 피한다.","ㄴ. 자살을 생각하는 클라이언트가 보여주는 단서에 민감할 필요가 있다.","ㄷ. 자살 시도 경험을 확인해본다.","ㄹ. 우울증 가능성이 있을 경우 정신건강 관련 기관에 의뢰한다."],"c":["ㄱ,ㄴ","ㄱ,ㄹ","ㄴ,ㄷ","ㄴ,ㄷ,ㄹ","ㄱ,ㄴ,ㄷ,ㄹ"],"a":4},{"id":"18-2-48","y":2018,"g":2,"n":48,"t":"집단 대상 실천(집단사회사업)","f":"옳지 않은 것","s":["집단역학(group dynamics)의 구성요소가 아닌 것은?"],"c":["긴장과 갈등","가치와 규범","집단목적","의사소통유형","지식 및 정보습득"],"a":5},{"id":"18-2-49","y":2018,"g":2,"n":49,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["과제중심모델의 개입과정 중 중기(실행)단계에서 해야 할 과업이 아닌 것은?"],"c":["표적문제의 변화 과정 확인","실질적 장애물의 규명과 해결","표적문제에 대한 초점화된 집중","표적문제의 설정","과제 계획과 이행"],"a":4},{"id":"18-2-50","y":2018,"g":2,"n":50,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["개인대상 사회복지실천기술에 관한 내용의 연결이 옳지 않은 것은?"],"c":["재보증: 클라이언트의 불안감이나 불확실한 감정을 줄이고 편안한 감정을 가질 수 있도록 돕는 기법","명료화: 클라이언트가 말한 내용을 사회복지사가 잘 이해했는지 확인하는 기법","환기: 클라이언트의 부정적 감정이 문제해결에 방해가될 경우 감정의 강도를 약화시키는 기법","인정: 클라이언트가 어떤 행동을 하거나 중단한 이후 이에 대해 긍정적으로 평가해주는 기법","도전: 클라이언트가 부여하는 의미를 수정해서 클라이언트의 시각을 변화시키는 기법"],"a":5},{"id":"19-2-26","y":2019,"g":2,"n":26,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 모두 고르기","s":["정신역동모델의 개념과 개입기술에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 해석의 목적은 통찰력 향상에 있다.","ㄴ. 훈습은 모순이나 불일치를 직시하도록 원조하는 단회성기법이다.","ㄷ. 전이는 반복적이며 퇴행하는 특징을 갖는다.","ㄹ. 자유연상을 시행하는 경우 주제와 관련 없는 내용은 억제시킨다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":2},{"id":"19-2-27","y":2019,"g":2,"n":27,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["음주문제와 가정불화로 직장에 적응하지 못해 의뢰된 클라이언트에게 심리사회모델을 적용할 때 그 개입기법으로 적절하지 않은 것은?"],"c":["음주와 관련된 감정을 표출하도록 한다.","문제해결을 위해 직접 충고한다.","클라이언트의 인지오류와 신념체계를 탐색한다.","직장 상사와의 갈등이 현재에 미친 영향을 파악한다.","유년기 문제와 현재 행동의 인과관계를 지각하도록 한다."],"a":3},{"id":"19-2-28","y":2019,"g":2,"n":28,"t":"면접·의사소통·사정·기록","f":"옳은 것 모두 고르기","s":["가족사정도구에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 생태도는 진행과정과 종결과정에서도 활용한다.","ㄴ. 생활력표를 활용하며 현재의 기능수행에 영향을 미치는 발달단계상 생활경험을 이해한다.","ㄷ. 소시오그램은 가족 구성원의 사회적 활동을 측정하는 도구이다.","ㄹ. 가족조각은 가족역동을 시각적으로 표현하여 구성원의 인식을 파악하는 도구이다."],"c":["ㄱ, ㄷ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"19-2-29","y":2019,"g":2,"n":29,"t":"집단 대상 실천(집단사회사업)","f":"옳지 않은 것","s":["집단사회복지실천에서 집단구성과 구조에 관한 설명으로 옳지 않은 것은?"],"c":["일반적으로 사회적 목표모델보다 치료모델의 집단 규모가 더 작다.","아동집단은 성인집단에 비해 모임 시간은 더 짧게 빈도는 더 자주 설정한다.","집단구성원의 동질성이 강할수록 성원 간 방어와 저항도더 많이 발생한다.","물리적 공간을 결정할 때 좌석배치까지 고려한다.","개방형집단이 폐쇄형집단에 비해 위기상황에 처한 사람들에게 더 융통성 있는 참여기회를 제공한다."],"a":3},{"id":"19-2-30","y":2019,"g":2,"n":30,"t":"집단 대상 실천(집단사회사업)","f":"옳지 않은 것","s":["집단의 종결단계에서 집중적으로 수행해야 하는 과업으로 적절하지 않은 것은?"],"c":["집단 의존성 감소","의뢰의 필요성 검토","변화노력의 일반화","구성원 간 피드백 교환","집단 성원 간 공통점과 차이점 파악"],"a":5},{"id":"19-2-31","y":2019,"g":2,"n":31,"t":"집단 대상 실천(집단사회사업)","f":"옳은 것 고르기","s":["집단사회복지실천기술에 관한 설명으로 옳은 것은?"],"c":["집단과정의 명료화기술은 성원들이 어떻게 상호작용하고있는지를 인식하도록 돕는 기술이다.","사회복지사와의 의사소통을 집단성원들 간 의사소통보다중시해야 한다.","사회복지사는 특정한 집단과정에 선택적으로 반응해서는안 된다.","직면은 집단 초반에 구성원의 참여를 촉진하는 기술이다.","집단의 목표는 집단과정을 통해 성취하면 되므로 처음부터 설명할 필요는 없다."],"a":1},{"id":"19-2-32","y":2019,"g":2,"n":32,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["인지행동모델의 개입기법에 관한 설명으로 옳지 않은 것은?"],"c":["행동형성은 강화원리를 따른다.","모델링은 관찰학습과정을 통해 이루어진다.","경험적 학습에는 인지불일치원리가 적용된다.","타임아웃은 정적강화원리를 이용한 것이다.","체계적 탈감법은 고전적 조건화에 근거한다."],"a":4},{"id":"19-2-33","y":2019,"g":2,"n":33,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 모두 고르기","s":["사회복지실천모델에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 임파워먼트모델에서는 클라이언트를 일방적 수혜자로 인식하지 않는다.","ㄴ. 과제중심모델은 펄만(H. Perlman)의 문제해결 요소의 영향을 받았다.","ㄷ. 위기개입모델에서는 클라이언트의 과거를 탐색하는 데 우선순위를 두지 않는다.","ㄹ. 클라이언트중심모델에서는 사회복지사의 권위적인 역할이 강조된다."],"c":["ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"19-2-34","y":2019,"g":2,"n":34,"t":"가족 대상 실천(가족치료모델)","f":"사례·제시문 판단","s":["다음 대화에서 사회복지사 B가 클라이언트 A에게 사용한 기법에 해당하는 것은?","A: \"저는 조그마한 어려움이 있어도 쉽게 좌절하는 사람이에요.\"","B: \"좌절감이 당신으로 하여금 새로운 일을 하는 것을 방해하네요.\""],"c":["문제의 외현화","재보증","코칭(coaching)","가족지도","체험기법"],"a":1},{"id":"19-2-35","y":2019,"g":2,"n":35,"t":"가족 대상 실천(가족치료모델)","f":"옳은 것 모두 고르기","s":["가족사회복지실천의 개념에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 1차 수준 사이버네틱스(cybernetics) - 전문가가 가족 내부의 의사소통과 제어과정을 객관적으로 발견한다.","ㄴ. 환류고리(feedback loop) - 가족규범이 유지되거나 변화되는 과정을 설명한다.","ㄷ. 가족의사소통 - 내용기능이 관계기능보다 더 중요하다.","ㄹ. 가족규칙 - 암묵적인 규칙은 역기능적이므로 제거되어야 한다."],"c":["ㄱ","ㄱ, ㄴ","ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":2},{"id":"19-2-36","y":2019,"g":2,"n":36,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["해결중심모델에 관한 설명으로 옳지 않은 것은?"],"c":["클라이언트 지향적 모델이다.","임시대응적 기법이라는 비판이 있다.","메시지 작성과 전달, 과제를 활용한다.","사회복지사와 클라이언트 간 협력적 관계를 중시한다.","문제가 해결된 상태를 가정하는 대처질문을 활용할 수있다."],"a":5},{"id":"19-2-37","y":2019,"g":2,"n":37,"t":"집단 대상 실천(집단사회사업)","f":"옳은 것 모두 고르기","s":["집단사회복지실천에서 하위집단에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 집단 초기단계에 나타나 집단응집력을 촉진한다.","ㄴ. 정서적 유대감을 갖게 된 집단구성원 간에 형성된다.","ㄷ. 적게는 한 명에서 많게는 다수로 구성된다.","ㄹ. 소시오메트리를 통해 측정 가능하다."],"c":["ㄱ, ㄴ","ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":2},{"id":"19-2-38","y":2019,"g":2,"n":38,"t":"가족 대상 실천(가족치료모델)","f":"옳지 않은 것","s":["전략적 가족치료의 치료적 이중구속에 관한 설명으로 옳지 않은 것은?"],"c":["증상을 이용한다.","빙산기법을 이용한다.","지시적 기법을 이용한다.","역설적 기법을 이용한다.","치료자의 지시를 따르지 않아도 문제가 해결될 수 있다."],"a":2},{"id":"19-2-39","y":2019,"g":2,"n":39,"t":"집단 대상 실천(집단사회사업)","f":"옳은 것 모두 고르기","s":["집단회기를 마무리하는 방식으로 옳은 것을 모두 고른 것은?","ㄱ. 회기에 대한 사회복지사의 관찰과 생각을 전달한다.","ㄴ. 회기 중 제기된 이슈를 다 마무리하지 않고 회기를 마쳐도 된다.","ㄷ. 회기에서 다룬 내용을 집단 밖에서 어떻게 적용할지에 대한 계획을 묻는다.","ㄹ. 다음 회기에 다루기 원하는 주제나 문제를 질문한다."],"c":["ㄱ, ㄷ","ㄱ, ㄹ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"19-2-40","y":2019,"g":2,"n":40,"t":"가족 대상 실천(가족치료모델)","f":"옳지 않은 것","s":["가족에 관한 설명으로 옳지 않은 것은?"],"c":["사회 변화에 따라 가족의 구조와 기능도 변화한다.","위기 시 가족은 역기능적 행동을 보일 수도 있지만 가족탄력성을 보일 수도 있다.","가족은 생활주기를 따라 단계적으로 발달하고 변화한다.","가족은 가족항상성을 통해 다른 가족과 구별되는 정체성을 갖는다.","가족은 권력구조를 갖고 있지 않은 애정공동체이다."],"a":5},{"id":"19-2-41","y":2019,"g":2,"n":41,"t":"집단 대상 실천(집단사회사업)","f":"옳지 않은 것","s":["집단을 활용한 사회복지실천의 치료적 효과 요인으로 옳지 않은 것은?"],"c":["고유성","이타성 향상","실존적 요인","재경험의 기회 제공","희망고취"],"a":1},{"id":"19-2-42","y":2019,"g":2,"n":42,"t":"면접·의사소통·사정·기록","f":"사례·제시문 판단","s":["다음 사례에 해당되는 단일사례설계 평가유형은?","대인관계 문제로 어려움을 겪던 재훈이와 수지는 사회성 측정 후 사회기술훈련에 의뢰되었다. 재훈이는 곧바로 사회기술훈련을 시작하며 사회성의 변화추이를 측정해 오고 있으며, 수지는 3주간 시간차를 두고 사회기술훈련을 시작하면서 변화추이를 관찰하였다."],"c":["AB 설계","ABAB 설계","BAB 설계","다중(복수)기초선 설계","다중(복수)요소 설계"],"a":4},{"id":"19-2-43","y":2019,"g":2,"n":43,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["구조적 가족치료의 모델로 개입하기에 적절하지 않은 것은?"],"c":["아픈 어머니, 철없는 아버지 대신 동생에게 부모 역할을하며 자신에게 소홀한 맏딸의 문제","비난형 아버지와 감정표현을 통제하는 어머니의 영향으로 자기감정을 억압하는 아들의 문제","할머니와 어머니의 양육방식이 달라서 혼란스러운 자녀의 문제","부부불화로 아들에게 화풀이를 하자 반항행동이 증가한아들의 문제","밀착된 아내와 딸이 남편을 밀어내어 소외감을 느끼는남편의 문제"],"a":2},{"id":"19-2-44","y":2019,"g":2,"n":44,"t":"가족 대상 실천(가족치료모델)","f":"옳은 것 모두 고르기","s":["가족 실천기술과 예시의 연결로 옳은 것을 모두 고른 것은?","ㄱ. 합류 - 사회복지사가 가족의 말투나 몸짓을 따라한다.","ㄴ. 관계성 질문 - \"어머니가 여기 계신다고 가정하고 제가 어머니께 당신의 문제가 해결되면 무엇이 달라지겠냐고 묻는다면 어머니는 뭐라고 말씀하실까요?\"","ㄷ. 경계 만들기 - 부모와 딸의 갈등상황에서 딸에게 부모의 '과도한 통제'를 '관심과 염려'의 의미로 인식하게 한다.","ㄹ. 균형 깨뜨리기 - 지배적인 남편과 온순한 아내 사이에서 사회복지사는 아내의편을 들어 자기주장을 할 수 있게 한다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"19-2-45","y":2019,"g":2,"n":45,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["인지행동모델에 관한 설명으로 옳은 것은?"],"c":["탈이론적이다.","비구조화된 접근을 강조한다.","주관적 경험과 인식을 중시한다.","클라이언트가 수동적으로 참여한다.","클라이언트의 무의식적 언행에 초점을 맞춘다."],"a":3},{"id":"19-2-46","y":2019,"g":2,"n":46,"t":"가족 대상 실천(가족치료모델)","f":"사례·제시문 판단","s":["다음 사례에서 세대 간 반복되는 문제를 해결하기에 가장 적절한 기법은?","이혼 이후 대인기피와 우울증세를 보이는 클라이언트의 가계도를 통해 원가족을 살펴보니 이혼과 우울증이 되풀이되고 있다. 클라이언트는 어머니와 밀착적이면서 갈등적이고, 딸과도 지나치게 밀착되어있다."],"c":["기적질문과 척도질문","지시와 역설","문제의 내재화","실연","분화촉진"],"a":5},{"id":"19-2-47","y":2019,"g":2,"n":47,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["철수는 무단결석과 친구를 괴롭히는 문제로 담임선생님에 의해 학교사회복지사에게 의뢰 되었다. 철수와의 상담을 과제중심모델로 진행할 때 그 개입방법에 해당하지 않는 것은?"],"c":["철수의 성격유형과 심리역동을 탐색한다.","지역사회에서 지원할 수 있는 방법을 확인한다.","담임선생님이 제시한 문제를 확인한다.","철수의 노력으로 해결 가능한 문제를 선정한다.","제시된 문제가 철수의 욕구와 일치하지 않은 경우 조정한다."],"a":1},{"id":"19-2-48","y":2019,"g":2,"n":48,"t":"집단 대상 실천(집단사회사업)","f":"옳은 것 모두 고르기","s":["집단사정이 개별성원-전체집단-집단외부환경 차원에서 수행될 때 ‘전체집단’ 사정에 해당하는 것을 모두 고른 것은?","ㄱ. 집단을 인가하고 지원하는 기관의 목표","ㄴ. 하위집단 형성","ㄷ. 집단구성원의 변화와 성장","ㄹ. 집단 내 상호작용 방식"],"c":["ㄱ","ㄴ","ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"19-2-49","y":2019,"g":2,"n":49,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["위기개입모델에 관한 설명으로 옳지 않은 것은?"],"c":["다른 모델에 비해 상대적으로 단기 서비스를 제공한다.","위기개입의 표적문제는 구체적이어야 한다.","위기에 대한 반응보다 위기사건 자체 해결에 일차적 목표를 둔다.","절망하고 있는 클라이언트에게 희망을 고취시키는 것이중요하다.","위기에 개입하는 사회복지사는 적극적이고 직접적인 역할을 수행한다."],"a":3},{"id":"19-2-50","y":2019,"g":2,"n":50,"t":"면접·의사소통·사정·기록","f":"순서 나열","s":["다음을 문제중심기록의 S-O-A-P 순서대로 배치한 것은?","ㄱ. 질문에만 겨우 답하고 눈물을 보
