 헌신과 의무입니다."},"19-2-14":{"x":"전문적 원조관계는 목적이 있고 일정 기간 이어지는 시간제한적 관계입니다.\n\n사회복지사가 우월한 지위에 있지 않고, 사회복지사의 욕구 충족이 목적이 아니며, 책임은 사회복지사가 더 크게 지고, 클라이언트의 변화를 통제하는 것이 아닙니다."},"19-2-15":{"x":"문제의 해결자가 클라이언트이고, 법률에 의한 제한 외에는 최대한 존중해야 하는 원칙은 클라이언트의 자기결정권입니다."},"19-2-16":{"x":"학대의 내용과 정도, 정서 상태와 욕구를 파악하는 면접은 정보수집면접입니다."},"19-2-17":{"x":"클라이언트의 언행의 의미와 관계에 대한 가설을 제시해 새로운 시각을 갖게 하는 기술은 해석입니다."},"19-2-18":{"x":"문제와 욕구를 확인하고 기관의 정책과 서비스에 부합하는지 판단하는 과정은 접수입니다."},"19-2-19":{"x":"의뢰할 때는 클라이언트를 정서적으로 지지하고(ㄱ), 기관과 서비스 정보를 제공하며(ㄴ), 의뢰 후 서비스를 제대로 받는지 확인합니다(ㄹ).\n\n의뢰에는 반드시 클라이언트의 동의가 필요합니다(ㄷ은 틀림)."},"19-2-20":{"x":"클라이언트가 제시한 문제를 욕구 중심으로 바꾸어 진술하는 것은 문제형성입니다."},"19-2-21":{"x":"가족과 환경의 상호작용을 보여주는 것은 생태도입니다. 가계도는 가족의 구조와 관계, 세대 간 반복 유형을 보여줍니다. 1번이 틀렸습니다."},"19-2-22":{"x":"종결 시 클라이언트의 부정적 감정(상실감 등)도 충분히 다루어야 합니다. 다루지 않는다는 설명이 틀렸습니다."},"19-2-23":{"x":"사례관리는 통합적 방법을 활용하는 것으로, 전통적 사회복지방법론과 전혀 다른 방법이 아닙니다. 4번이 틀렸습니다."},"19-2-24":{"x":"사정 단계에서는 문제 목록을 함께 작성하고(ㄱ), 욕구와 자원을 확인합니다(ㄴ).\n\n계획된 서비스의 전달과정 추적(ㄷ)은 점검(모니터링) 단계의 활동입니다."},"19-2-25":{"x":"서비스의 최종 효과성 검토는 평가 단계의 활동입니다. 점검은 서비스 실행과 산출, 목표 달성 정도, 욕구 변화를 진행 중에 확인하는 것입니다."},"20-2-1":{"x":"생태도는 클라이언트와 환경 체계 간의 자원 교환, 에너지 흐름, 스트레스 체계를 보여줍니다. 생애 동안 발생한 문제의 발전 과정은 가계도나 생활력도표와 같은 도구로 파악합니다."},"20-2-2":{"x":"인권존중, 사회적 약자 옹호, 지역사회 문제 참여는 윤리강령의 '사회에 대한 윤리기준'에 해당합니다."},"20-2-3":{"x":"자선조직협회는 빈민 지원의 중복과 누락을 방지하기 위해 시작되었습니다.\n\n산업화를 원인으로 보고 사회개혁을 추구한 것, 빈민 지역에서 함께 생활한 것은 인보관운동입니다. 자선조직협회는 개별사회사업에 영향을 주었고, 집단과 지역사회복지의 태동에는 인보관운동이 영향을 주었습니다."},"20-2-4":{"x":"1차 현장은 사회복지 본래의 목적을 위해 설립된 기관이고, 이용시설은 이용자가 생활하지 않고 시설을 이용하는 곳입니다. 노인복지관과 지역아동센터가 해당합니다."},"20-2-5":{"x":"미시체계는 개인이 일상에서 직접 경험하는 실제적인 환경입니다.\n\n2번은 외체계, 3번과 4번은 부정확한 체계 이름이거나 거시체계에 대한 설명이고, 5번은 중간체계에 대한 설명입니다."},"20-2-6":{"x":"공식 정답은 3번(ㄴ - ㄹ - ㄷ - ㄱ)입니다. 돌고프 등의 윤리적 의사결정은 관련 사람과 제도의 확인, 목표 명확화, 개입 방안 검토와 선택, 평가의 순서로 이해하면 됩니다.\n\n보기 구성상 평가(ㄷ)와 선택(ㄱ)의 순서가 매끄럽지 않아 혼동하기 쉬우므로, 이 문항은 정답표 기준으로 암기하는 것이 좋습니다."},"20-2-7":{"x":"통합적 방법론은 전문직이 이미 확립된 이후 전통적 방법론의 한계를 보완하기 위해 등장한 것이므로, 봉사활동에서 전문직으로 출발하게 된 계기가 아닙니다."},"20-2-8":{"x":"실천 결과의 모호성, 힘의 불균형, 클라이언트 체계의 다중성, 기관과 클라이언트에 대한 의무의 상충은 모두 사회복지사가 경험하는 윤리적 딜레마 상황입니다."},"20-2-9":{"x":"가족 간 상호작용 유형을 조정하는 것은 개입단계의 과업입니다. 접수단계에서는 기관과 사회복지사 소개, 원하는 서비스 확인, 기본 정보 확인, 저항감 완화를 합니다."},"20-2-10":{"x":"부모 면담(ㄱ), 적성검사(ㄴ), 가정방문을 통한 사실 확인(ㄷ)은 모두 자료수집 방법입니다."},"20-2-11":{"x":"종결 기준과 목표 수립은 계획 단계의 과업입니다. 종결단계에서는 사후관리 계획, 성과유지 전략, 필요시 의뢰, 종결에 대한 정서 다루기를 합니다."},"20-2-12":{"x":"사정 이후 가장 먼저 할 일은 클라이언트와 함께 다룰 문제의 우선순위를 정하는 것입니다. 여러 문제를 한꺼번에 다루지 않고 클라이언트와 합의해 순서를 정합니다."},"20-2-13":{"x":"개입단계에서는 계획된 서비스를 제공하고(ㄱ), 계획 수정이 필요하면 재사정을 합니다(ㄷ).\n\n전략과 우선순위 결정(ㄴ)은 계획단계, 과정 및 총괄평가(ㄹ)는 평가단계의 과업입니다."},"20-2-14":{"x":"사례관리의 과정은 사정 - 계획 - 연계 - 조정 - 점검 순입니다. 계획이 사정보다 먼저 온다는 설명이 틀렸습니다."},"20-2-15":{"x":"사례는 상담가, 교육자(집단 교육), 중개자(기관 연계), 정보제공자의 역할을 수행했습니다. 갈등을 중재하는 장면은 없으므로 중재자는 해당하지 않습니다."},"20-2-16":{"x":"클라이언트와 서비스 제공자 간 갈등을 조정하는 것은 개입(실행)단계의 과업입니다.\n\n목표 수립은 계획, 적격성 판별은 접수, 사례관리팀 구축은 준비, 변화·성과 측정 도구 개발은 평가 단계의 과업입니다."},"20-2-17":{"x":"클라이언트의 문제와 부적응에 초점을 맞추는 것은 병리관점입니다. 임파워먼트는 강점과 역량에 초점을 둡니다."},"20-2-18":{"x":"핀커스와 미나한의 행동체계는 변화를 위해 사회복지사가 함께 일하는 사람들입니다.\n\n이웃과 가족은 행동체계, 비자발적 클라이언트는 클라이언트체계(또는 의뢰-응답은 콤튼과 갤러웨이의 6체계), 변화가 필요한 사람은 표적체계, 전문가 육성 교육체계는 6체계의 전문체계에 해당합니다."},"20-2-19":{"x":"통합적 방법은 다양한 클라이언트 체계와 수준에 접근할 수 있습니다.\n\n사례관리 이전에 등장했고, 고도의 전문화가 아니라 일반주의 실천이며, 복잡한 문제에 더 적합합니다. 다양한 유형의 클라이언트를 통합한다는 의미는 아닙니다."},"20-2-20":{"x":"클라이언트를 개별화하려면 경청, 관찰, 자기인식, 감정 포착 능력이 필요합니다. 질환을 진단하는 능력은 의료인의 역할입니다."},"20-2-21":{"x":"전문적 관계의 목적은 클라이언트와 함께 설정합니다. 전문가가 설정한 목적 달성을 위해 형성된다는 설명이 틀렸습니다."},"20-2-22":{"x":"경청과 수용(ㄱ), 활용 가능한 자원 탐색 지원(ㄴ), 잠재력 개발 환경 조성(ㄷ)은 자기결정을 돕는 역량입니다.\n\n클라이언트에게 필요한 것을 결정하고 관철시키는 것(ㄹ)은 자기결정을 해치는 행동입니다."},"20-2-23":{"x":"'어제 자녀와 대화를 나누셨나요?'는 예/아니오로 답하는 폐쇄형 질문입니다."},"20-2-24":{"x":"면접은 목적을 가진 활동으로, 목적을 지향합니다. 목적보다 과정에만 집중한다는 설명이 틀렸습니다."},"20-2-25":{"x":"혼란스럽고 갈등이 되는 느낌을 가려내어 분명히 해주는 기술은 명료화입니다."},"21-2-1":{"x":"한국 사회복지실천의 역사 순서는 대학의 사회복지 인력 양성교육 시작(1947) → 사회복지사업법에 따른 사회복지사 명칭 사용(1983) → 사회복지전문요원 배치(1987) → 정신건강사회복지사 명칭 사용(2017)입니다."},"21-2-2":{"x":"자기규제를 통해 클라이언트를 보호하고 전문가의 행동기준과 원칙을 기술한 것은 윤리강령입니다."},"21-2-3":{"x":"인도주의, 민주주의, 개인주의, 문화 다양성은 모두 사회복지실천의 이념적 배경입니다."},"21-2-4":{"x":"임파워먼트의 대화단계에서는 파트너십 형성(ㅁ), 현재 상황의 명확화(ㅂ), 방향 설정(ㄱ)을 합니다.\n\n강점 확인과 자원 활성화는 발견단계, 기회의 확대는 발전단계입니다."},"21-2-5":{"x":"아동양육시설은 아동이 생활하는 생활시설입니다. 재가복지센터, 아동상담소, 주간보호센터, 사회복지관은 이용시설입니다."},"21-2-6":{"x":"소속기관에 대한 의무와 클라이언트에 대한 의무가 충돌하는 상황은 의무상충입니다."},"21-2-7":{"x":"윤리강령에서 동료 또는 다른 기관의 클라이언트와 관계를 맺는 문제와 긴급 상황에서 동료의 클라이언트를 맡는 문제는 '클라이언트에 대한 윤리기준'으로 처리되었습니다. 공식 정답은 2번입니다."},"21-2-8":{"x":"강점관점은 클라이언트의 성장과 변화 가능성이 크다고 봅니다. 성장과 변화가 제한적이라는 설명이 틀렸습니다."},"21-2-9":{"x":"다문화 역량은 상이한 문화를 수용하고 존중하는 것이어서, 주류문화에 대한 동화주의적 실천을 지향하는 것은 맞지 않습니다."},"21-2-10":{"x":"콤튼과 갤러웨이의 6체계에서 사회복지사 A는 변화매개체계입니다.\n\n학생 B는 클라이언트체계, 학교사회복지사 C와 경찰 D는 행동체계, 가해학생은 표적체계, 학교사회복지사협회 E는 전문체계입니다."},"21-2-11":{"x":"인권은 보편성(ㄱ), 책임이 동반되는 상호성(ㄴ), 사회적 약자를 위한 보호(ㄷ), 법이 보장하지 않아도 존엄성에 필요한 자연권적 성격(ㄹ)을 가집니다."},"21-2-12":{"x":"통합적 접근은 클라이언트의 자기결정을 존중하고 참여를 중시합니다. 최소화한다는 설명이 틀렸습니다."},"21-2-13":{"x":"사례관리는 포괄적이고 지속적인 서비스를 제공하며, 임상적 치료에 집중하지 않습니다."},"21-2-14":{"x":"옹호는 클라이언트의 권리를 대변하거나 클라이언트가 스스로 권리를 주장하도록 돕는 활동입니다. 사회복지사가 집단의 대표로 나서서 협상을 주도하는 것은 클라이언트의 주체성을 약화시켜 옹호 활동으로 보기 어렵습니다."},"21-2-15":{"x":"개방형 질문은 면접에서 권장되는 질문입니다. 모호한 질문, 유도질문, '왜'를 묻는 질문, 복합질문은 피해야 합니다."},"21-2-16":{"x":"접수단계에서는 욕구에 적합한 기관으로 의뢰(ㄷ)하고 서비스 적격 여부를 확인(ㄹ)합니다.\n\n목표 우선순위 합의(ㄱ)는 계획단계, 강점과 자원 조사(ㄴ)는 사정단계의 과업입니다."},"21-2-17":{"x":"초기 면접에서는 공감적 경청(ㄱ), 비언어적 표현 관찰(ㄴ), 가벼운 대화로 분위기 조성(ㄷ)을 합니다.\n\n침묵은 허용하고 존중해야 합니다(ㄹ은 틀림)."},"21-2-18":{"x":"PIE 분류체계는 클라이언트의 사회적 기능 수행 문제를 분류하는 도구입니다. 주변인과의 접촉 빈도와 사회적 지지는 사회적 관계망 분석표로 파악합니다."},"21-2-19":{"x":"상반된 정보를 제공하는 자료도 폐기하지 않고 비교·검토해야 합니다. 3번이 틀렸습니다."},"21-2-20":{"x":"사례관리는 단기개입이 아니라 장기적·지속적 지원이 필요한 사람들을 위해 등장했습니다. 장기보호에서 단기개입으로 전환되었다는 설명이 틀렸습니다."},"21-2-21":{"x":"클라이언트의 감정에 민감하게 공감하며 의도적이고 적절하게 반응하는 것은 통제된 정서적 관여입니다."},"21-2-22":{"x":"클라이언트의 정서적 반응을 정리하고 사후관리를 계획하는 단계는 종결입니다."},"21-2-23":{"x":"책임감을 갖고 절차상의 조건을 따르는 관계형성의 기본 요소는 헌신과 의무입니다."},"21-2-24":{"x":"여러 기관의 중복 지원을 사례회의로 조정하고 기관별 역할을 합의한 것은 조정자의 역할입니다. 중재자는 갈등을 해결하는 역할입니다."},"21-2-25":{"x":"전문적 관계는 전문가 윤리강령에 따릅니다.\n\n기관과 클라이언트의 욕구에서 출발하며, 시간 제한이 있고, 전문성에 기반한 권위가 있으며, 클라이언트의 동의가 필요합니다."},"22-2-1":{"x":"인보관운동은 빈민과 함께 지역사회에 거주하며 사회개혁을 추구했습니다. 빈민을 통제하는 사회통제적 기능은 자선조직협회와 관련됩니다."},"22-2-2":{"x":"기능주의는 '지금-이곳'에 초점을 두고 인간의 성장가능성과 의지를 중시합니다. 과거경험 중심은 진단주의입니다."},"22-2-3":{"x":"자선조직협회의 우애방문자 활동은 인도주의, 이타주의, 사회진화론에 기반했습니다. 사회개혁은 인보관운동의 이념입니다."},"22-2-4":{"x":"클라이언트의 의사를 존중하는 것은 자율성과 자유의 원칙입니다."},"22-2-5":{"x":"서비스의 효율성과 효과성 측정은 평가단계의 과업입니다."},"22-2-6":{"x":"윤리강령은 외부통제로부터 전문직을 보호하고, 윤리적 갈등 시 지침을 제공하며, 자기규제를 통해 클라이언트를 보호하고, 기본업무와 자세를 알립니다."},"22-2-7":{"x":"교정시설은 사회복지 이외의 목적으로 설립된 기관에 사회복지사가 들어가 일하는 2차 현장입니다. 양로시설, 사회복지관, 지역아동센터, 장애인 거주시설은 1차 현장입니다."},"22-2-8":{"x":"강점관점은 클라이언트의 진술을 신뢰하고 존중합니다. 회의적으로 보고 재해석해 진단에 활용하는 것은 병리관점입니다."},"22-2-9":{"x":"통합적 접근은 이론과 증거에 근거한 실천입니다. 이론이 아닌 상상력에 근거를 둔다는 설명이 틀렸습니다."},"22-2-10":{"x":"비스텍의 관계 원칙은 개별화, 의도적 감정표현, 통제된 정서적 관여, 수용, 비심판적 태도, 자기결정, 비밀보장입니다. 욕구를 범주화하는 원칙은 없습니다."},"22-2-11":{"x":"자료수집에서는 객관적 자료와 클라이언트의 주관적 인식을 모두 수집합니다.\n\n개인과 환경을 함께 보고, 검사도구도 사용할 수 있으며, 초기면접에는 구조화된 양식도 쓰고, 여러 정보원을 활용합니다."},"22-2-12":{"x":"전문적 관계는 사회복지사와 클라이언트 사이에 합의된 목적이 있습니다.\n\n사회복지사는 자신의 반응을 통제해야 하고, 권위는 사회복지사의 전문성에서 나오며, 시간 제한이 있고, 상호 이익이 아니라 클라이언트의 이익이 중심입니다."},"22-2-13":{"x":"체계의 작용은 투입 → 전환 → 산출 → 환류 순입니다."},"22-2-14":{"x":"원조관계에는 사회복지사와 클라이언트 모두에게 의무와 책임감이 요구됩니다."},"22-2-15":{"x":"면접은 목적이 있고 시간과 내용이 일정한 제한 안에서 이루어집니다. 목적이 옳아도 기간이나 내용이 제한되지 않는다는 설명이 틀렸습니다."},"22-2-16":{"x":"펄만의 4P는 사람(person), 문제(problem), 장소(place), 과정(process)입니다. 문제(ㄱ)와 장소(ㄷ)가 맞고, 프로그램(ㄴ)과 전문가(ㄹ)는 4P에 해당하지 않습니다."},"22-2-17":{"x":"경청은 클라이언트의 진술을 즉각 교정하는 것이 아니라 이해하려는 적극적 활동입니다."},"22-2-18":{"x":"세대 간 반복되는 가족 특성을 파악하는 도구는 가계도입니다."},"22-2-19":{"x":"인권은 다른 사람이 양도하거나 빼앗을 수 없는 불가양성을 가집니다. 양로시설 노인의 의사결정을 대신할 수 없다는 것은 이를 뜻합니다."},"22-2-20":{"x":"중첩형 질문은 한꺼번에 여러 질문을 해 클라이언트를 혼란스럽게 만들 수 있습니다.\n\n폐쇄형 질문은 구체적 사실 확인에 쓰고, 유도형 질문은 피해야 하며, '왜' 질문은 방어를 부를 수 있고, 개방형 질문은 자유롭게 답하게 합니다."},"22-2-21":{"x":"목표달성을 위한 서비스 제공은 개입단계의 과업입니다. 종결단계에서는 사후관리, 변화 확인, 자원 연결, 정서 처리를 합니다."},"22-2-22":{"x":"사례관리의 목적은 서비스의 통합성, 접근성, 보호의 연속성, 사회적 책임성 제고입니다."},"22-2-23":{"x":"개인이나 집단의 갈등을 파악하고 조정하는 것은 조정자·중재자의 역할입니다. 정보제공자는 필요한 정보를 제공하는 역할입니다."},"22-2-24":{"x":"역기능적 가족 규칙의 재구성은 클라이언트 가족을 직접 대상으로 하는 직접적 개입입니다. 캠페인, 협력체계 구축, 전달체계 재정립, 네트워크 형성은 간접적 개입입니다."},"22-2-25":{"x":"계약서는 사회복지사와 클라이언트가 함께 작성합니다. 클라이언트만 작성한다는 설명이 틀렸습니다."},"23-2-1":{"x":"역사 순서는 태화여자관 설립(1921) → 밀포드 회의(1929) → 사회복지사업법에 따른 사회복지사 명칭 사용(1983) → 사회복지전문요원 배치(1987)입니다."},"23-2-2":{"x":"양자 간의 논쟁에 개입해 중립을 지키며 상호합의를 이끌어내는 역할은 중재자입니다. 조정자는 서비스와 자원을 조율합니다."},"23-2-3":{"x":"자신의 가치, 신념, 편견이 실천에 미치는 영향을 이해하는 것은 자기인식입니다."},"23-2-4":{"x":"'왜'라는 질문은 방어적 태도를 유발할 수 있어 피하는 것이 좋습니다.\n\n자유로운 대답에는 개방형 질문이 적합하고, 유도질문과 이중·삼중 질문은 피해야 하며, 사적 질문에 거짓으로 답하는 것은 적절하지 않습니다."},"23-2-5":{"x":"생태도는 중앙에 가족 또는 클라이언트체계를 원으로 그리고(ㄱ), 그 안에 클라이언트나 동거가족을 그리며(ㄴ), 바깥에 상호작용하는 외부체계를 작은 원으로 그립니다(ㄷ).\n\n자원의 양과 관계의 속성은 선의 종류와 굵기로 표시하므로 ㄹ은 틀렸습니다."},"23-2-6":{"x":"클라이언트의 억압된 감정을 표출하게 해 해소시키는 기술은 환기입니다."},"23-2-7":{"x":"감정을 잘 관찰하고 경청하며 언어와 비언어적 표현을 모두 파악하는 자질은 민감성입니다."},"23-2-8":{"x":"빈민지역에 거주하며 집합적이고 개혁적인 해결을 강조한 것은 인보관운동입니다. 자선조직협회는 개인의 문제로 접근했습니다. 3번이 틀렸습니다."},"23-2-9":{"x":"개인주의는 개별화(ㄱ), 개인의 권리와 의무 강조(ㄴ), 최소한의 수혜자격 원칙(ㄷ)에 영향을 주었습니다. 사회적 책임 중시(ㄹ)는 민주주의와 사회개혁의 영향입니다."},"23-2-10":{"x":"부모와 자녀의 관계증진을 위한 소집단프로그램은 미시·중시 수준의 실천입니다. 조례, 제도 개선, 예산 촉구, 정책 토론회는 거시 수준입니다."},"23-2-11":{"x":"대화, 발견, 발전의 단계와 클라이언트 집단의 주도적 사회제도 개선은 임파워먼트모델의 특징입니다."},"23-2-12":{"x":"통합적 접근은 서비스 영역별 분화와 전문화에 반대하고 공통의 틀로 다양한 문제에 접근합니다. 5번이 틀렸습니다."},"23-2-13":{"x":"노인보호전문기관은 학대 신고 접수와 상담을 하는 이용기관이며, 생활시설이 아닙니다."},"23-2-14":{"x":"전문가체계는 사회복지사협회처럼 전문직 단체나 교육기관을 말합니다."},"23-2-15":{"x":"전문적 관계는 클라이언트의 욕구 해결을 위한 것이고, 사회복지사의 이익과 욕구 충족을 위한 일방적 관계가 아닙니다."},"23-2-16":{"x":"비스텍의 의도적 감정표현은 클라이언트가 부정적 감정을 포함한 자신의 감정을 자유롭게 표현하도록 지지하는 원칙입니다.\n\n2번은 수용, 3번은 자기결정, 4번은 통제된 정서적 관여, 5번은 사회복지사의 자기노출에 해당합니다."},"23-2-17":{"x":"변화하는 욕구에 반응하며 서비스를 중단 없이 장기적으로 제공하는 것은 서비스의 지속성입니다."},"23-2-18":{"x":"법원의 정보공개 명령에 따라 클라이언트 정보를 제공하는 것은 비밀보장의 예외로 허용됩니다.\n\n개선 가능성과 관계없이 관계를 형성해야 하고, 감정에 이입되지 않도록 통제해야 하며, 클라이언트의 의견을 지시로 수정하게 해서는 안 되고, 개별화된 서비스를 제공해야 합니다."},"23-2-19":{"x":"클라이언트의 진술(ㄱ), 사회복지사의 직접 경험(ㄴ), 검사 결과(ㄷ), 중요한 타인으로부터의 정보(ㄹ)는 모두 자료수집의 출처입니다."},"23-2-20":{"x":"레비의 가치 중 결과우선가치(사람에 관한 가치 중 결과)는 동등한 사회 참여 기회 제공 같은 사회가 지향해야 할 결과입니다.\n\n자기결정권 존중, 비심판적 태도, 개별성 인정은 수단우선가치이고, 인간 존엄성에 대한 믿음은 사람우선가치입니다."},"23-2-21":{"x":"일반화는 클라이언트가 혼자만 겪는 문제가 아님을 인식하게 하는 기법입니다(ㄹ).\n\nㄱ은 재보증이 아니라 재명명(재구성)에 대한 설명이고, 모델링은 시범이나 간접 관찰 등으로도 시행할 수 있으며(ㄴ은 틀림), ㄷ은 격려가 아니라 직면에 대한 설명입니다."},"23-2-22":{"x":"사례관리는 서비스 공급 주체가 중앙정부에서 지방정부와 지역사회로 이동하는 흐름에서 필요성이 커졌습니다. 지방정부에서 중앙정부로 변화했다는 설명이 틀렸습니다."},"23-2-23":{"x":"프로그램 개발은 클라이언트가 아닌 환경을 대상으로 하는 간접적 개입입니다. 의사소통 교육, 부모교육, 가족상담, 사회기술훈련은 클라이언트를 직접 대상으로 하는 직접적 개입입니다."},"23-2-24":{"x":"계획 수정 여부 논의, 욕구 변화 검토, 목표달성 정도와 서비스 제공 확인은 사례관리의 점검 단계 활동입니다."},"23-2-25":{"x":"재정 후원자를 연결해준 것은 자원을 연결하는 중개자의 역할입니다. 협상가는 이해관계가 다른 당사자 간에 합의를 이끌어내는 역할입니다."},"24-2-1":{"x":"사회진화론은 적자생존 논리로 빈민 구제를 제한하고 통제하려는 관점이어서 사회통제적 성격과 관련성이 가장 높습니다."},"24-2-2":{"x":"기능주의는 개인의 의지(ㄱ), 전문가와 클라이언트의 원조관계(ㄷ), 기관의 기능(ㄹ)을 강조했습니다. 심리 내적 진단(ㄴ)은 진단주의의 강조점입니다."},"24-2-3":{"x":"서비스 결정 시 클라이언트의 의사를 존중하는 윤리적 쟁점은 자기결정권입니다."},"24-2-4":{"x":"보편성은 모든 인간이 인권을 가진다는 의미입니다. 자기의 인권은 자기만 소유한다는 의미는 불가양성에 가깝습니다. 4번이 틀렸습니다."},"24-2-5":{"x":"학대 피해 아동을 원가정과 쉼터 중 어디에서 지낼지 결정할 때는 생명과 안전을 최우선으로 고려해 피해를 최소로 하는 선택을 해야 하므로 최소 손실의 원칙이 적용됩니다."},"24-2-6":{"x":"외원단체는 시설 중심의 구호사업을 주로 했습니다. 지역사회 중심의 사회복지가 발전하는 계기를 만들었다는 설명이 틀렸습니다."},"24-2-7":{"x":"밀포드 회의의 공통요소에는 규범에서 벗어난 행동에 관한 지식, 인간관계 규범의 활용, 클라이언트 사회력의 중요성, 지역사회자원 활용 등이 있었고, 개별사회사업을 기본으로 했습니다. 집단사회사업의 철학적 배경 이해는 포함되지 않았습니다."},"24-2-8":{"x":"아동보호치료시설은 아동이 입소해 생활하는 생활시설입니다. 이용시설이라는 설명이 틀렸습니다."},"24-2-9":{"x":"강점관점은 개입의 핵심이 개인, 가족, 지역사회의 참여라고 봅니다(ㄱ).\n\n클라이언트의 능력이 전문가의 지식보다 우선되며(ㄴ은 틀림), 진술을 재해석하여 진단에 활용하는 것은 병리관점이고(ㄷ은 틀림), 어린 시절의 원인 사건에 치료의 초점을 두는 것도 정신분석의 접근입니다(ㄹ은 틀림)."},"24-2-10":{"x":"전문적 원조관계는 클라이언트의 문제와 욕구가 중심이 됩니다.\n\n시간 제한이 있고, 전문가의 권위는 전문성에 기반해 필요하며, 전문가는 자신의 감정을 통제해야 하고, 클라이언트가 지시에 무조건 따르는 관계는 아닙니다."},"24-2-11":{"x":"사례에서 변화를 일으키려는 대상인 시어머니(E)는 표적체계입니다.\n\n결혼이민자 A는 클라이언트체계, 변호사 B는 행동체계가 아닌 정보 제공자로서의 이웃, 사회복지사 C는 변화매개체계, 남편 D는 행동체계에 가깝습니다."},"24-2-12":{"x":"임파워먼트 모델은 클라이언트의 적극적인 참여를 강조합니다.\n\n병리관점이 아닌 강점관점이고, 환경 변화도 추구하며, 클라이언트를 통제하지 않고, 진단보다 협력과 역량 강화를 우선합니다."},"24-2-13":{"x":"통합적 접근은 개별·집단·지역사회 방법을 하나로 합친 것이 아니라 공통의 틀로 접근하는 것입니다. 지역사회조직으로 통합했다는 설명이 틀렸습니다."},"24-2-14":{"x":"헌신과 의무는 일관성을 포함하고(ㄱ), 책임감과 관련되며(ㄴ), 관계의 목적 달성에 필요합니다(ㄷ).\n\n클라이언트도 헌신과 의무가 있습니다(ㄹ은 틀림)."},"24-2-15":{"x":"이해 충돌에 대한 대처는 윤리강령 중 '사회복지사의 기본적 윤리기준' 영역에 속합니다. 서비스 종결, 기록·정보 관리, 직업적 경계 유지, 정보에 입각한 동의는 클라이언트에 대한 윤리기준입니다."},"24-2-16":{"x":"전문가의 권위는 전문성에 기반한 원조관계의 특성이지 장애요인이 아닙니다. 변화에 대한 저항, 부정적 전이, 역전이, 불신은 장애요인입니다."},"24-2-17":{"x":"수용은 있는 그대로 받아들이는 것이지, 사회규범에서 벗어난 행동까지 허용하는 것은 아닙니다. 3번이 틀렸습니다."},"24-2-18":{"x":"사정은 초기단계에서만 하는 것이 아니라 실천 전 과정에서 지속적으로 이루어집니다."},"24-2-19":{"x":"독거노인의 식사지원을 위해 무료급식소를 연계하는 것은 중개자의 역할입니다.\n\n체계적인 개입계획 수립은 기획가, 입장 대변은 옹호자, 중복지원 조정은 조정자, 부모와 자녀 사이의 합의는 중재자의 역할입니다."},"24-2-20":{"x":"다른 사람의 바람직한 행동을 보고 모방하게 해 행동 변화를 가져오는 기술은 모델링입니다."},"24-2-21":{"x":"사례관리는 서비스의 연속성과 통합성을 추구하므로 분절성은 원칙에 해당하지 않습니다."},"24-2-22":{"x":"자료수집 출처에는 클라이언트의 이야기, 비언어적 행동, 직접적 상호작용 경험, 주변인(담임교사, 어머니)의 정보가 있습니다. 사례에서는 상호작용을 직접 관찰하는 장면이 없으므로 3번이 아닙니다."},"24-2-23":{"x":"경청은 클라이언트의 이야기에 적절히 반응하는 적극적 활동입니다. 반응하지 않아야 한다는 설명이 틀렸습니다."},"24-2-24":{"x":"개입 목표 설정은 계획수립단계의 과업입니다. 효과 점검, 동료 검토, 효과의 유지와 강화, 평가 후 계획 수정은 개입이나 평가·종결 단계의 과업입니다."},"24-2-25":{"x":"갈등을 겪는 부부의 과거력·개인력·가족력 파악은 정보수집면접(ㄱ), 자존감 향상을 위한 심리적 지지는 치료면접(ㄷ)입니다.\n\n환경 변화를 목적으로 중요한 사람과 면접하는 것은 사정면접이 아니라 계획(환경 개입) 면접에 가깝습니다(ㄴ은 틀림)."},"25-2-1":{"x":"임파워먼트 모델은 클라이언트를 권리를 가진 소비자이자 파트너로 보고 협력과 참여를 중시합니다. 사회복지사를 치료자, 클라이언트를 수동적 수혜자로 보는 것은 병리관점입니다."},"25-2-2":{"x":"사례관리의 사정 영역은 클라이언트의 욕구와 문제, 그에 대한 클라이언트의 능력, 지원체계의 능력과 활용 장애를 모두 포함합니다."},"25-2-3":{"x":"핀커스와 미나한은 개인과 환경 간 불균형이 생길 때 문제를 극대화하는 것이 아니라 문제해결 능력과 대처능력을 향상시키는 것을 목적으로 보았습니다."},"25-2-4":{"x":"발견단계의 자원역량 사정(ㄴ)이 옳습니다.\n\n성공의 확인은 발달단계, 파트너십 형성은 대화단계, 강점의 확인은 발견단계 과업입니다."},"25-2-5":{"x":"역사 순서는 사회진단 출간(1917) → 밀포드 회의(1929) → 기능주의와 진단주의의 갈등(1930년대) → 통합적 방법론 등장(1970년대)입니다."},"25-2-6":{"x":"개인의 적응 욕구와 환경의 요구 사이의 조화와 균형 정도는 적합성입니다."},"25-2-7":{"x":"지역아동센터는 사회복지 본래 목적의 1차 현장이며 이용시설입니다.\n\n행정복지센터는 이용기관, 노인요양공동생활가정은 생활시설, 아동보호전문기관은 이용기관 중 1차 현장, 지역자활센터는 1차 현장입니다."},"25-2-8":{"x":"인도주의와 박애사상은 빈민에 대한 인도적 서비스 제공(ㄱ)과 봉사 정신(ㄷ)에 영향을 주었습니다. 수혜자격 축소(ㄴ)는 사회진화론의 영향입니다."},"25-2-9":{"x":"클라이언트가 자신에 대해 미처 알지 못한 것을 깨닫도록 설명해 주는 기술은 관찰이 아니라 해석입니다."},"25-2-10":{"x":"관계 형성을 위해 사회복지사가 자신의 생각이나 경험을 공유하는 기술은 자기노출입니다."},"25-2-11":{"x":"수용(ㄱ)은 클라이언트를 있는 그대로 인정하는 것이고, 비심판적 태도(ㄴ)는 비난하지 않는 것입니다.\n\n클라이언트가 감정을 자유롭게 표현하게 하는 것은 의도적 감정표현이고(ㄷ), 감정에 민감하게 이해하며 반응하는 것은 통제된 정서적 관여입니다(ㄹ). 설명이 서로 바뀌었습니다."},"25-2-12":{"x":"인간 존엄성 존중은 '기본적 윤리기준'에 속합니다. 서비스 종결, 자기결정권 존중, 권익옹호, 기록·정보 관리는 클라이언트에 대한 윤리기준입니다."},"25-2-13":{"x":"협상가는 갈등 당사자들 사이에서 합의를 이끌어내기 위해 타협하는 역할입니다.\n\n2번은 옹호자·사회행동가, 3번은 조정자, 4번은 옹호자·조력자의 일부, 5번은 사회행동가의 설명이어서 모두 역할이 잘못 연결되었습니다."},"25-2-14":{"x":"구속과 인신매매로부터의 보호는 평등권이 아니라 신체의 자유와 관련된 자유권에 해당합니다. 5번이 틀렸습니다."},"25-2-15":{"x":"통합적 접근은 전통적 방법이 지나치게 분화되어 서비스가 파편화되고(ㄱ), 공통기반이 없어 정체성 확립이 어렵고(ㄴ), 전문화 중심 교육으로 분야 간 이동이 어려워진(ㄹ) 데서 등장했습니다.\n\nㄷ은 틀렸습니다. 전통적 방법은 복잡한 문제에 포괄적으로 개입하지 못하고 특정 방법에 한정되었습니다."},"25-2-16":{"x":"학교사회복지사협회는 사회복지사를 지원하는 전문가 단체이므로 전문가체계입니다.\n\n징계위원회는 의뢰-응답체계에 가깝고, 사회복지사 A는 변화매개체계, 담임교사는 행동체계, 가해자 학생은 클라이언트체계에 해당합니다."},"25-2-17":{"x":"클라이언트의 입장에서 이해하고, 반영 등으로 이해하고 있음을 표현하는 것은 공감입니다."},"25-2-18":{"x":"클라이언트가 혼자만 겪는 문제가 아님을 인식하게 해 소외감을 줄이는 기술은 일반화입니다."},"25-2-19":{"x":"환경조정은 아동학대, 부모 사망, 집을 잃은 경우처럼 클라이언트의 환경을 직접 바꾸어야 하는 상황에서 하는 개입입니다. 직장에서 예방교육 프로그램을 제공하는 것은 환경조정이 필요한 위기 상황이 아니라 예방 활동입니다."},"25-2-20":{"x":"점검은 서비스가 계획대로 제공되고 있는지 확인하는 과정입니다.\n\n인테이크는 접수·적격성 판정, 사정은 욕구와 자원 정보수집, 서비스 계획은 목표와 계획 수립, 평가는 결과와 성과 확인입니다."},"25-2-21":{"x":"목표설정은 계획단계의 과업입니다. 접수단계에서는 문제 확인, 관계형성, 서비스 동의, 의뢰 등을 합니다."},"25-2-22":{"x":"서비스 제공 여부를 판단하는 것은 접수단계의 과업입니다. 사정은 문제와 욕구, 자원과 강점을 이해해 계획의 근거를 마련하는 과정입니다."},"25-2-23":{"x":"사례관리는 탈시설화로 지역사회 중심의 서비스 제공이 요구되면서 등장했습니다. 시설 중심의 통합적 서비스 제공에 대한 요구가 증가했다는 설명이 틀렸습니다."},"25-2-24":{"x":"가족상담은 클라이언트와 가족을 직접 대상으로 하는 직접실천기술입니다. 연계, 옹호, 점검, 조정은 간접실천기술에 가깝습니다."},"25-2-25":{"x":"세대 간 반복되는 정서적 유형은 가계도로 파악합니다. 생태도는 환경과의 관계와 자원 교환, 스트레스 체계를 보여줍니다."},"26-2-1":{"x":"사회복지실천은 클라이언트의 문제해결 능력을 높이는 것이 목적이며, 무조건적인 원조를 제공하는 것이 아닙니다. 4번이 틀렸습니다."},"26-2-2":{"x":"다원주의는 임파워먼트 논의에(ㄱ), 인도주의는 봉사정신에(ㄴ), 민주주의는 자기결정권 강조에(ㄷ) 영향을 주었고, 사회진화론은 사회통제적 성격이 강합니다(ㄹ). 모두 옳습니다."},"26-2-3":{"x":"인보관운동은 빈곤을 산업화로 인한 착취의 결과로 보았고(ㄱ), 집단사회사업에 영향을 주었습니다(ㄷ).\n\n연구와 조사를 통한 사회제도 개혁은 인보관운동의 활동이고(ㄴ은 틀림), 빈민과 함께 생활하며 환경을 개선한 것도 인보관운동입니다(ㄹ은 틀림). 사회진화론에 근거한 것은 자선조직협회입니다(ㅁ은 틀림)."},"26-2-4":{"x":"그린우드가 제시한 전문직 속성은 체계적 이론, 전문적 권위, 사회적 승인(인가), 윤리강령, 전문직 문화입니다. 네 개 모두 해당합니다."},"26-2-5":{"x":"차별 금지는 사람을 대하는 방법이 아니라 사회가 지향해야 할 결과에 관한 가치(결과우선 가치)로 분류됩니다. 수단우선 가치의 예로 보기 어렵습니다."},"26-2-6":{"x":"직업적 경계 유지는 '클라이언트에 대한 윤리기준'에 속합니다. 인간 존엄성 존중, 사회정의 실현, 품위와 자질 유지, 이해 충돌에 대한 대처는 기본적 윤리기준입니다."},"26-2-7":{"x":"윤리적 원칙 심사표의 우선순위는 생명보호 → 평등과 불평등 → 자율성과 자유 → 최소 손실 → 삶의 질 → 사생활과 비밀보장 → 진실성과 정보개방입니다. 보기에서는 평등 → 자율성 → 최소 손실 → 삶의 질 순입니다."},"26-2-8":{"x":"가치는 실천의 방향성(ㄱ), 감정적·정서적 측면(ㄴ), 사회 구성원이 정한 바람직함의 기준(ㄷ)입니다.\n\n좋음(goodness)은 가치에, 옳음(rightness)은 윤리에 대응합니다(ㄹ은 반대로 서술)."},"26-2-9":{"x":"쪽방상담소와 장애인직업재활시설은 모두 이용시설입니다.\n\n학대피해노인전용쉼터, 가정위탁지원센터(이용), 성폭력피해자보호시설, 아동양육시설, 자립지원공동생활시설은 생활시설이 섞여 있습니다."},"26-2-10":{"x":"재가노인복지시설은 이용시설이고, 청소년자립지원관은 생활시설입니다(ㄴ).\n\n기업사회복지와 교정복지는 2차 현장으로 분류되지만 정답표에서는 ㄱ이 제외되었습니다. 한국사회복지협의회와 공동모금회는 민간기관이며, 직접실천 현장이 모두 1차 현장은 아닙니다."},"26-2-11":{"x":"강점관점은 클라이언트를 선택과 결정의 주체로 보고 가능성에 초점을 둡니다. 전문가의 판단을 중심으로 문제를 해결한다는 설명은 병리관점입니다."},"26-2-12":{"x":"순환적 인과성(ㄱ)과 홀론(ㄴ)에 대한 설명이 옳습니다.\n\n환경과 정보, 에너지를 자유롭게 교환하는 체계는 개방체계이고(ㄷ은 틀림), 전환활동의 결과가 체계 밖으로 나오는 것은 투입이 아니라 산출입니다(ㄹ은 틀림)."},"26-2-13":{"x":"역량강화는 클라이언트의 능력과 영향을 강조하고(ㄱ), 협력관계를 형성하며(ㄴ), 참여를 중시합니다(ㄹ). 병리학적 관점이 아니라 강점관점에 기반합니다(ㄷ은 틀림)."},"26-2-14":{"x":"통합적 접근은 일반주의 실천에서 활용하는 접근입니다. 일반주의 접근을 지양한다는 설명이 틀렸습니다."},"26-2-15":{"x":"클라이언트가 변화의 대상인 경우에는 클라이언트체계가 표적체계가 됩니다. 행동체계가 되는 것이 아닙니다. 3번이 틀렸습니다."},"26-2-16":{"x":"클라이언트의 감정에 민감하게 반응하되 사회복지사의 감정은 목적의식과 자기인식으로 조절하는 것은 통제된 정서적 관여입니다."},"26-2-17":{"x":"클라이언트가 과거 다른 관계의 경험과 감정을 현재의 사회복지사에게 투사하는 것은 전이입니다. 역전이는 사회복지사가 클라이언트에게 보이는 반응입니다."},"26-2-18":{"x":"펄만은 전문적 관계에서 사회복지사가 자신의 감정과 반응을 통제해야 한다고 보았습니다. 통제하지 않는다는 설명이 틀렸습니다."},"26-2-19":{"x":"클라이언트가 말한 감정을 되짚어 표현하는 면담기술은 반영입니다."},"26-2-20":{"x":"프로그램 수행 중 문제점을 발견하고 수정·보완해 질을 개선하는 평가는 형성평가입니다. 총괄평가는 프로그램 종료 후 결과와 효과를 평가합니다."},"26-2-21":{"x":"클라이언트의 부정적 감정을 표출시켜 강도를 약화시키는 기술은 일반화가 아니라 환기입니다. 일반화는 혼자만의 문제가 아님을 인식하게 하는 기술입니다."},"26-2-22":{"x":"계약에는 개입방법과 기술, 사회복지사와 클라이언트의 역할, 개입기간과 빈도, 구체적 서비스 목표가 포함됩니다. 다섯 개 모두 옳습니다."},"26-2-23":{"x":"개입 전에 수집·정리된 자료를 분석해 문제를 확인하고 욕구, 자원, 강점을 이해하는 단계는 사정입니다."},"26-2-24":{"x":"클라이언트의 이익을 대변하고 필요한 서비스를 받을 권리를 보호하는 사례관리자의 역할은 옹호자입니다."},"26-2-25":{"x":"대규모 시설의 관료주의 부작용을 해소하고 지역사회 복귀를 돕는 흐름은 탈시설화입니다."}},"data/e_rs.json":{"17-1-26":{"x":"명단에서 무작위로 첫 번째 요소를 뽑고 이후 일정한 간격(10번째)마다 추출하는 방식은 체계적 표집(계통표집)입니다."},"17-1-27":{"x":"항상 2.5kg씩 더 무겁게 나오는 것은 일관된 측정이므로 신뢰도는 높지만, 실제 몸무게를 정확히 재지 못하므로 타당도는 낮습니다."},"17-1-28":{"x":"프로그램 평가에서 프로그램은 독립변수이고, 종속변수는 프로그램의 효과(결과)입니다. 1번이 틀렸습니다."},"17-1-29":{"x":"유의수준(α)을 낮추면 1종 오류(참인 영가설을 기각)가 줄어듭니다. 늘어난다는 서술이 틀렸습니다.\n\n신뢰수준을 높이면 1종 오류가 줄고, 유의확률이 유의수준보다 낮으면 영가설을 기각합니다. 2종 오류가 늘면 검정력(1-β)은 감소합니다."},"17-1-30":{"x":"질적연구는 연구자 해석이 개입되므로 일반적으로 신뢰도가 낮고 타당도(깊이)가 높습니다. 신뢰도가 더 높다는 설명이 틀렸습니다."},"17-1-31":{"x":"이 연구는 17개 시·도의 자료를 분석했으므로 분석단위는 개인이 아니라 집합단위(시·도)입니다. 3번이 틀렸습니다.\n\n청년실업률은 독립변수, 범죄율은 종속변수(비율척도)이며, 6년 동안 반복 수집한 양적 종단연구입니다."},"17-1-32":{"x":"무작위로 50명을 나누어 요가를 실시하고 사후에만 측정했으므로 통제집단 사후검사설계(순수실험설계)입니다. 유사실험설계가 아닙니다. 4번이 틀렸습니다."},"17-1-33":{"x":"개념화는 개념을 정의해 명제를 만들고, 조작화는 개념을 변수로 바꾸어 가설을 세우는 과정입니다. 같은 구성은 '조작화 : 변수 : 가설'입니다."},"17-1-34":{"x":"부정적 사례 분석은 연구자의 가설이나 해석과 맞지 않는 사례를 찾아 해석을 정교화하는 방법입니다. 동료가 감시하는 장치(동료 검토)가 아닙니다. 5번이 틀렸습니다."},"17-1-35":{"x":"내적 타당도 저해요인은 역사(ㄱ), 성숙(ㄴ), 중도탈락(ㄹ)입니다. 표본의 대표성은 외적 타당도에 관한 것입니다."},"17-1-36":{"x":"일반적으로 전화조사는 면접조사보다 면접시간이 짧습니다. 2번이 틀렸습니다."},"17-1-37":{"x":"새 도구의 결과를 이미 검증된 도구의 결과와 같은 시점에 비교해 확인하는 것은 동시 타당도입니다."},"17-1-38":{"x":"신뢰수준이 높을수록 오차의 허용 범위(신뢰구간)는 넓어지므로 표본오차가 감소한다는 설명은 틀렸습니다.\n\n표본 수가 늘수록 표본오차는 감소하고, 비비례층화표집도 확률표집입니다."},"17-1-39":{"x":"편향이 체계적 오류를 만듭니다. 체계적 오류는 타당도를, 무작위 오류는 신뢰도를 저해합니다. 표준화된 도구는 체계적 오류를 줄일 수 있습니다."},"17-1-40":{"x":"델파이 기법은 일반인이 아니라 전문가 집단의 의견을 반복적으로 수렴하는 방법입니다. 5번이 틀렸습니다."},"17-1-41":{"x":"기초선이 불안정할 때 변화의 폭과 기울기를 고려해 분석하는 방법은 경향선 접근입니다."},"17-1-42":{"x":"가설이 반드시 방향성을 가져야 하는 것은 아닙니다. 방향이 없는 양방향(비방향) 가설도 가능합니다."},"17-1-43":{"x":"비동일통제집단설계는 무작위 배정 없이 이미 존재하는 집단을 실험집단과 통제집단으로 사용합니다. 임의적으로 나눈다는 설명이 틀렸습니다."},"17-1-44":{"x":"동일한 표본을 반복 조사하는 종단조사는 패널조사입니다. 추세조사는 매번 다른 표본을 뽑는 방식입니다."},"17-1-45":{"x":"지역(집합) 수준의 결과로 개인 수준의 결론을 이끄는 것은 생태학적 오류입니다."},"17-1-46":{"x":"2차 자료분석은 이미 수집된 자료를 이용하므로 비관여적 방법입니다(ㄱ).\n\n연구자의 영향은 거의 없고, 통계기법으로 결측값을 대체할 수 있으며, 신뢰도와 타당도 문제가 발생할 수 있습니다."},"17-1-47":{"x":"과학적 지식은 새로운 증거에 따라 수정될 수 있는 잠정적 지식입니다. 잠정적이지 않은 지식을 추구한다는 설명이 틀렸습니다."},"17-1-48":{"x":"IQ와 온도(섭씨)는 절대영점이 없는 등간척도입니다.\n\n성별과 인종·종교는 명목척도, 석차는 서열척도, 5점 척도 만족도는 등간척도로 보는 것이 일반적입니다."},"17-1-49":{"x":"관찰 전에 동의를 구해야 하고(ㄱ), 문제점과 실패도 보고해야 합니다(ㄷ).\n\n사회적 이익이 비용을 초과해야만 한다는 조건은 없고(ㄴ), 비밀성과 익명성은 서로 다른 개념입니다(ㄹ)."},"17-1-50":{"x":"과도한 일반화는 소수의 사건이나 경험으로 전체의 규칙성을 일반화하는 오류입니다.\n\n1번은 선별적 관찰, 3번은 부정확한 관찰, 4번은 자아개입, 5번은 꾸며진 지식에 해당합니다."},"18-1-26":{"x":"포스트모더니즘은 객관적 실재라는 개념을 신뢰하지 않고 다양한 해석을 강조합니다. 2번이 틀렸습니다."},"18-1-27":{"x":"독립변수가 많아질수록 집단 수가 급격히 늘어 요인설계를 활용하기 어려워집니다. 3번이 틀렸습니다."},"18-1-28":{"x":"가설은 검증 가능해야 하고(ㄱ), 변수 간의 관계를 가정하는 문장이며(ㄴ), 영가설은 영향이 없다고 가정합니다(ㄹ).\n\nㄷ은 반대입니다. 모든 변수는 개념이지만, 모든 개념이 변수는 아닙니다."},"18-1-29":{"x":"새로운 통계분석기법의 개발은 통계학자의 일이고, 사회복지사가 과학적 조사를 활용하는 일반 상황은 아닙니다."},"18-1-30":{"x":"쿤은 과학이 지식의 누적으로 점진적으로 발전하는 것이 아니라, 패러다임 전환(과학혁명)을 통해 비연속적으로 발전한다고 보았습니다. 2번이 틀렸습니다."},"18-1-31":{"x":"연구문제는 연구자의 관심을 담고(ㄱ), 잠정적 결과를 예측할 수 있으며(ㄴ), 모든 조사에 있고(ㄷ), 다른 연구자가 참여할 수 있으며(ㄹ), 변수 간 관계를 반드시 예측할 필요는 없습니다(ㅁ). 모두 옳습니다."},"18-1-32":{"x":"연구의 공익적 가치가 연구윤리보다 우선하는 것은 아닙니다. 연구윤리는 공익을 이유로도 훼손할 수 없습니다. 4번이 틀렸습니다."},"18-1-33":{"x":"연령은 비율척도이지만 명목·서열·등간척도로 바꾸어 분석할 수도 있습니다.\n\n표준화된 지능점수는 등간척도이고, 소득을 비율척도로 물으면 오히려 응답률이 낮아집니다. 등간척도에는 절대영점이 없으며, 서열척도를 비율척도로 변환할 수 없습니다."},"18-1-34":{"x":"표준오차가 클수록 표본 통계치가 불안정해 검정통계값이 작아지므로, 통계적으로 유의할 가능성은 낮아집니다. 4번이 틀렸습니다."},"18-1-35":{"x":"개념화는 추상적 개념을 정의하는 단계이고, 조작화는 이를 측정 가능하게 구체화하는 단계입니다. 경험적 구체화 정도는 조작화가 더 높습니다. 5번이 틀렸습니다."},"18-1-36":{"x":"근무지역 동은 명목측정(ㄱ), 이수한 교육 시간(분)은 비율측정(ㄴ), 평가등급(A~D)은 서열측정(ㄷ)입니다."},"18-1-37":{"x":"이론적 포화와 범주 통합, 이야기 서술은 근거이론 코딩의 마지막 단계인 선택코딩입니다. 개방코딩 → 축코딩 → 선택코딩 순입니다."},"18-1-38":{"x":"항상 30분 빠른 시계는 일관되게 틀리므로 신뢰도는 높고 타당도는 낮습니다.\n\n신뢰도가 높아도 타당도가 높다고 할 수 없고, 반복 측정의 일관성은 신뢰도입니다. 복수양식법은 신뢰도 검사 방법입니다."},"18-1-39":{"x":"측정 항목이 적절한 내용을 담고 있는지는 타당도(ㄹ)와 관련되며, 구성타당도(ㅂ)와 체계적 오류(ㄱ)가 이에 해당합니다.\n\n무작위적 오류, 신뢰도, 이분절기법은 신뢰도와 관련된 개념입니다."},"18-1-40":{"x":"신뢰도 측정을 위해 짝으로 된 문항들은 서로 떨어지게 배치해야 응답자가 앞의 답을 의식하지 않습니다.\n\n개방형 질문은 뒤쪽에 두고, 이중질문은 피하며, 수반형 질문이 많으면 응답이 어려워집니다. 문항은 응답자의 특성에 맞게 작성합니다."},"18-1-41":{"x":"우편설문은 대인면접에 비해 같은 표집 조건에서 비용이 적게 듭니다.\n\n질문 과정의 유연성, 높은 응답률, 응답환경 통제, 심층 규명은 모두 대인면접이 우수한 점입니다."},"18-1-42":{"x":"관찰법은 서베이에 비해 자료의 계량화가 어렵습니다. 4번이 틀렸습니다."},"18-1-43":{"x":"범주항목은 신문기사 자료에서 도출되고(ㄱ), 단어를 기록단위로 하면 주제보다 자료 양이 많으며(ㄴ), 맥락단위는 기록단위보다 큰 단위입니다(ㄷ).\n\n내용분석은 양적 분석(빈도 분석 등)도 가능해서 ㄹ은 틀렸습니다."},"18-1-44":{"x":"네트워크 구조분석에는 노드 사이의 관계를 나타내는 관계형 변수를 주로 사용합니다.\n\n초점집단조사에서는 집단역학도 분석대상이 되고, 델파이기법은 대면 상호작용이 없는 전문가 대상 기법입니다. 네트워크분석은 조직 간 전달체계 분석에 적절합니다."},"18-1-45":{"x":"패널조건화는 반복 조사에 응하면서 응답자가 달라져 결과의 정확성을 해칠 수 있는 현상입니다. 정확성이 높아진다는 설명이 틀렸습니다."},"18-1-46":{"x":"선정편향은 표본의 대표성, 집단의 동질성, 내적·외적 타당도에 영향을 줍니다. 측정의 정확성(측정도구의 타당도)과는 관계가 적습니다."},"18-1-47":{"x":"99% 신뢰수준은 유의수준 1%(ㄱ)이고, 신뢰수준을 높이면 1종 오류를 줄일 수 있습니다(ㄴ). 95% 신뢰수준은 100번 중 5번 정도 오차가 허용된다는 뜻이고(ㄷ), 신뢰구간 안에 모수가 있다고 99% 확신할 수 있습니다(ㄹ). 모두 옳습니다."},"18-1-48":{"x":"모집단 비율에 맞춰 조사 대상자를 할당하는 비확률표집은 할당표집입니다. 층화표집은 비례 추출이지만 확률표집입니다."},"18-1-49":{"x":"혼합연구에서 질적 결과와 양적 결과가 반드시 일치해야 하는 것은 아닙니다. 서로 보완하거나 다른 결과가 나올 수도 있습니다."},"18-1-50":{"x":"단일사례설계는 여러 개의 연구대상이나 여러 개입 방법도 사용할 수 있습니다(다중기초선설계, ABAB 등). 2번이 틀렸습니다."},"19-1-26":{"x":"사회적 행동을 행위자의 입장에서 이해하려는 것은 해석주의 관점입니다. 실증주의는 객관적 관찰과 법칙을 강조합니다."},"19-1-27":{"x":"인과관계의 요건은 시간적 선행(ㄱ)과 공변성(ㄴ)이고, 허위적 관계가 아니어야 합니다. ㄷ은 틀렸습니다."},"19-1-28":{"x":"내적타당도가 높다고 외적타당도가 높아지지는 않습니다. 통제를 강화할수록 일반화 가능성이 낮아지기도 합니다. 3번이 틀렸습니다."},"19-1-29":{"x":"제목에서 독립변수(근무지역), 종속변수(직업만족도), 분석단위(사회복지사)와 독립변수의 측정수준(명목)은 알 수 있지만, 통제변수는 알 수 없습니다."},"19-1-30":{"x":"평가자들이 문항의 강도를 11점으로 분류하고, 중위수를 가중치로 사용하는 척도는 서스톤 척도입니다."},"19-1-31":{"x":"심층면접은 질적조사의 주요 자료수집 방법입니다.\n\n연구자가 도구가 되어 직접 참여하고, 가설 설정과 표준화된 도구는 필수가 아닙니다. 라포 형성이 필요한 것은 참여관찰자이고, 완전관찰자는 대상과 상호작용하지 않습니다."},"19-1-32":{"x":"신뢰도는 측정의 일관성 또는 안정성입니다.\n\n2번은 타당도, 3번은 여러 방법 중 하나이지 가장 널리 쓰이는 것은 크론바하 알파이고, 사회적 바람직성 편향은 타당도를 낮추는 요인입니다. 문항 수가 많을수록 신뢰도는 높아집니다."},"19-1-33":{"x":"여성의 노동참여율과 출산율의 관계는 변수 간 관계를 경험적으로 검증할 수 있는 가설입니다.\n\n나머지는 모든 사회, 바람직함 같은 가치 판단이나 검증이 어려운 포괄적 진술입니다. 2번은 사실 진술로 가설이 아닙니다."},"19-1-34":{"x":"사전·사후검사를 하되 무작위로 배정되지 않은 두 집단(A학교 실험, B학교 비교)을 비교하는 설계는 비동일 통제집단 설계입니다."},"19-1-35":{"x":"신문사설은 모집단 목록(표집틀)을 만들 수 있어서 무작위, 층화, 체계적, 군집표집을 모두 사용할 수 있습니다."},"19-1-36":{"x":"질적조사는 일반화 가능성이 양적조사보다 낮습니다. 4번이 틀렸습니다."},"19-1-37":{"x":"O₁ X O₂는 단일집단 사전사후검사설계입니다. 통제집단을 확보하기 어려울 때 사용할 수 있는 전실험설계입니다.\n\n내적타당도가 약하고, 검사효과를 통제하지 못하며, 순수실험설계가 아니고, 일반화도 어렵습니다."},"19-1-38":{"x":"종속변수에 영향을 줄 수 있지만 연구가 다루지 않는 부모의 사회경제적 지위는 외생변수입니다."},"19-1-39":{"x":"솔로몬설계는 실험설계(양적연구)입니다. 근거이론, 문화기술지, 내러티브, 현상학은 질적연구입니다."},"19-1-40":{"x":"치료집단과 일반인 집단이라는 준거집단을 구별하는지로 타당도를 확인하는 것은 기준타당도 중 판별(집단구별) 방식입니다. 기준타당도에 해당합니다."},"19-1-41":{"x":"다중기초선설계는 개입의 철회 없이, 개입 시점을 달리하는 방식으로 내적타당도를 확보합니다. 철회를 사용한다는 설명이 틀렸습니다(철회는 ABAB 설계)."},"19-1-42":{"x":"조사 과정은 선행연구 고찰 → 가설 설정 → 설문지 작성 → 표본 추출 및 자료수집 순입니다."},"19-1-43":{"x":"지역사회보장계획 수립을 위해 정책공약 내용분석(ㄱ), 주민 서베이(ㄴ), 전문가 초점집단면접(ㄷ), 담당자 심층면접(ㄹ)을 모두 활용할 수 있습니다."},"19-1-44":{"x":"할당표집은 모집단 전체가 아니라 미리 정한 할당틀(집단별 비율)에 맞추어 표본을 선정합니다. 전체 모집단에서 직접 추출한다는 설명이 틀렸습니다."},"19-1-45":{"x":"동일확률선정법으로 뽑아도 표집오차가 있어 모집단을 완벽하게 대표하지는 못합니다. 4번이 틀렸습니다."},"19-1-46":{"x":"변수는 직접 관찰할 수 있는 것만 측정하는 것이 아닙니다. 직접 관찰이 어려운 개념도 지표를 통해 측정합니다. 1번이 틀렸습니다."},"19-1-47":{"x":"실험설계에서도 개입 전에 종속변수를 사전 측정할 수 있습니다(사전검사). 2번이 틀렸습니다."},"19-1-48":{"x":"시험점수(0~100점)는 0점이 '아무것도 없음'을 뜻하지 않아 절대영점이 없습니다. 따라서 비율등급이 아니라 등간등급으로 보는 것이 일반적입니다. 4번의 연결이 틀렸습니다.\n\n명목(여부)은 백분율, 서열(학점)은 최빈치, 등간(온도)은 중위수, 명목(성별·흡연)은 교차분석이 가능합니다."},"19-1-49":{"x":"표본추출 과정은 모집단 확정 → 표집틀 선정 → 표본추출방법 결정 → 표본크기 결정 → 표본추출 순입니다."},"19-1-50":{"x":"측정도구 개발에는 조작화가 필요하고(ㄱ), 리커트 척도는 서열척도 구성이며(ㄷ), 수능은 대학 학업능력을 예비적으로 파악하는 도구입니다(ㄹ).\n\n문화적 편견은 무작위 오류가 아니라 체계적 오류를 만듭니다(ㄴ은 틀림)."},"20-1-26":{"x":"조사설계에는 자료수집 방법, 모집단과 표집방법, 분석 방법, 변수의 정의와 측정방법이 포함됩니다. 연구문제의 의의와 조사의 필요성은 조사설계가 아니라 연구계획서의 서론에 해당합니다."},"20-1-27":{"x":"영가설은 변수 간 관계가 없거나 있어 보이는 관계가 우연이라고 주장하는 가설입니다.\n\n변수 간 관계가 존재한다는 가설은 연구가설입니다. 영가설은 검증되어 확정되는 것이 아니라 기각 여부를 판단하며, 조사자가 입증하고 싶은 것은 연구가설입니다."},"20-1-28":{"x":"내용분석법은 이미 만들어진 기록물을 분석하는 간접(2차) 자료 방법이어서, 신문·책·일기를 직접 수집한다는 설명은 틀렸습니다."},"20-1-29":{"x":"가정폭력(독립변수)이 우울증(종속변수)에 미치는 영향이 사회적 네트워크 수준(조절변수)에 따라 달라진다고 했으므로, 매개변수는 존재하지 않습니다."},"20-1-30":{"x":"후기실증주의는 지식의 본질을 잠정적이고 확률적으로 봅니다.\n\n실증주의의 수정·보완이며, 관찰은 이론에 의존한다고 보고, 과학이 혁명적으로 변한다는 것은 쿤의 입장입니다."},"20-1-31":{"x":"연구참여자에게 위험이나 고통을 미리 알리고 사전 동의를 구하는 것이 연구윤리에 부합합니다.\n\n신분을 숨기는 것, 동의 없는 신분 공개, 이익·위험을 알리지 않는 것, 성적평가와 연계한 참여 유도는 모두 윤리 위반입니다."},"20-1-32":{"x":"선행연구와 자료가 부족한 상황에서 현상을 파악하려는 연구는 탐색적 연구입니다."},"20-1-33":{"x":"무작위 배정과 사후검사만 하는 이 설계는 통제집단 사후검사설계(순수실험설계)입니다. 통제집단을 확보하기 어려울 때 쓰는 설계가 아니라, 통제집단이 있는 설계입니다. 3번이 틀렸습니다."},"20-1-34":{"x":"일정 기간의 변화에 대해 가장 포괄적인 자료를 제공하는 것은 동일한 대상을 반복 조사하는 패널연구입니다. 동년배집단연구가 아닙니다. 2번이 틀렸습니다."},"20-1-35":{"x":"가설은 이론적 배경을 가져야 하고(ㄱ), 변수 간 관계를 가정한 문장입니다(ㄴ).\n\n연구문제를 바탕으로 가설이 구성되며(ㄷ은 반대), 가설은 명확하고 검증 가능해야 하므로 개방적으로 구성하지 않습니다(ㄹ)."},"20-1-36":{"x":"개입 후 상당한 시간이 지나서 변화가 나타난 경우는 다른 요인의 영향일 수 있어서, 개입의 효과라고 판단하기 어렵습니다. 5번이 틀렸습니다."},"20-1-37":{"x":"우연한 사건(역사요인)은 내적타당도를 해치고(ㄱ), 사전점수가 매우 높은 집단을 선정하면 통계적 회귀 때문에 내적타당도가 저해됩니다(ㄴ).\n\n내적타당도가 높다고 일반화 가능성이 높은 것은 아닙니다(ㄷ)."},"20-1-38":{"x":"혼합연구방법의 설계유형은 흔히 수렴(병합)설계, 설명적 순차설계, 탐색적 순차설계, 내재(삽입)설계 등으로 분류합니다. 실험을 독립된 유형으로 보는 설명이 틀렸습니다."},"20-1-39":{"x":"질적연구는 연구자와 맥락에 크게 의존하므로 다른 연구자가 똑같이 재연하기 어렵습니다. 4번이 틀렸습니다."},"20-1-40":{"x":"내용분석은 과거 자료를 분석할 수 있어 역사적 분석과 시계열 분석이 용이합니다. 어려움이 있다는 설명이 틀렸습니다."},"20-1-41":{"x":"신뢰도는 일관성으로 표현됩니다.\n\n문항 수가 적을수록 신뢰도는 낮아지는 경향이 있고, 검사-재검사는 신뢰도 측정 방법이며, 편향은 체계적 오류와 관련됩니다. 신뢰도가 높아도 타당도가 높다고 할 수 없습니다."},"20-1-42":{"x":"재학생 500명을 대상으로 한 조사에서 비용이 가장 적고 절차가 간편한 방법은 온라인조사입니다."},"20-1-43":{"x":"조사자가 목적에 맞는 대상을 판단해 선정하는 방식은 의도적(판단) 표집입니다. 사례관리담당자의 추천으로 욕구를 잘 표현하는 노인을 선정한 것이 그 예입니다."},"20-1-44":{"x":"장애 유형은 명목변수, 등록 후 개월 수와 등록 연령(나이)은 비율변수, 건강 정도(상·중·하)는 서열변수입니다."},"20-1-45":{"x":"신뢰도를 측정하기 위한 문항들은 응답이 서로 영향을 주지 않도록 가능한 한 떨어뜨려 배치해야 합니다. 가깝게 배치한다는 설명이 틀렸습니다."},"20-1-46":{"x":"이론 체계 안에서 다른 개념과의 논리적 관련성을 경험적으로 검증하는 가장 수준 높은 타당도는 구성 타당도입니다."},"20-1-47":{"x":"확률표집은 양적연구에서 주로 사용합니다. 질적연구는 의도적 표집 등 비확률표집을 주로 사용합니다."},"20-1-48":{"x":"아르바이트 경험의 종류(명목변수)는 독립변수이며, 명목변수에는 최빈값을 쓸 수 있습니다.\n\n유무는 명목변수이므로 산술평균을 쓸 수 없고, 또래집단의 지지는 조절변수, 삶의 만족은 종속변수입니다."},"20-1-49":{"x":"코딩 과정의 실수는 일정한 방향이 없는 무작위 오류에 가깝습니다. 체계적 오류를 발생시킨다는 설명이 틀렸습니다."},"20-1-50":{"x":"현상학은 경험의 의미를 이해하고(ㄱ), 근거이론은 지속적 비교로 이론을 만들며(ㄷ), 생애사는 한 사람의 삶의 사건을 이해하는 방법입니다(ㄹ).\n\n참여행동연구는 연구 참여자와 함께 문제를 해결하는 연구이며, 이혼 가족 사례의 심층 이해에는 사례연구가 적합합니다(ㄴ은 틀림)."},"21-1-26":{"x":"사회과학은 자연과학과 달리 관찰자와 관찰 대상이 분명히 구분되지 않는 경우가 많습니다. 연구자도 사회의 구성원이기 때문입니다. 3번이 틀렸습니다."},"21-1-27":{"x":"사회복지학은 사회문제에 대처하기 위한 학문이고(ㄱ), 사회과학이 실천적 지식과 이론 발전에 기여하며(ㄴ), 사회과학의 개념을 활용합니다(ㄹ).\n\n사회복지학은 순수과학이 아니라 응용과학입니다(ㄷ은 틀림)."},"21-1-28":{"x":"양적조사는 이론에서 가설을 이끄는 연역법을, 질적조사는 자료에서 이론을 이끄는 귀납법을 주로 사용합니다. 2번이 반대로 서술했습니다."},"21-1-29":{"x":"사회복지조사의 수행 단계는 문제설정 → 가설설정 → 조사설계 → 자료수집 → 자료분석 → 보고서 작성입니다."},"21-1-30":{"x":"독립변수에 영향을 주는 변수는 선행변수, 독립변수의 결과이자 종속변수의 원인은 매개변수, 영향을 미치지 못하고 의존하기만 하는 변수는 종속변수, 독립·종속변수 모두에 영향을 주는 제3의 변수는 외생변수입니다."},"21-1-31":{"x":"일정한 시간간격을 두고 반복 조사하는 종단조사에는 패널조사, 경향(추세)조사, 동년배조사가 있습니다."},"21-1-32":{"x":"내적타당도는 원인변수 이외의 변수가 결과변수에 개입하지 않도록 통제해 높이고, 외적타당도는 확률표집으로 대상을 선정하고 표본 크기를 크게 해서 높입니다."},"21-1-33":{"x":"측정도구의 신뢰도를 높이려면 문항 수를 늘리는 것이 일반적입니다. 문항 수가 적을수록 좋다는 설명이 틀렸습니다."},"21-1-34":{"x":"명목척도는 서열이 없고(ㄱ), 비율척도는 절대영점이 있으며(ㄷ), 서열척도는 속성에 따라 범주로 분류하되 순서가 있습니다(ㄹ).\n\n리커트 척도는 대표적으로 서열(또는 등간으로 취급) 척도이고 비율척도가 아닙니다(ㄴ은 틀림)."},"21-1-35":{"x":"새 우울척도와 자아존중감 척도처럼 이론적으로 관련이 없는 개념의 척도와 상관이 낮은 것을 확인해 타당도를 검증하는 방법은 판별타당도입니다."},"21-1-36":{"x":"재검사법, 대안법(복수양식법), 반분법, 내적일관성분석법은 모두 신뢰도 측정 방법입니다."},"21-1-37":{"x":"양극단의 형용사 쌍(친절한-불친절한) 사이에서 평가하게 하는 척도는 어의적 분화(의미분화)척도입니다."},"21-1-38":{"x":"표본 크기가 커질수록 표본오차는 작아집니다. 커진다는 설명이 틀렸습니다."},"21-1-39":{"x":"집락표본추출은 확률표집으로 주로 양적연구에서 사용합니다. 질적연구에서는 이론적, 눈덩이, 극단적 사례, 최대변이 표집 등을 사용합니다."},"21-1-40":{"x":"내용분석은 기존 자료에 의존하지만 연구 범위가 무제한은 아닙니다(ㄱ은 틀림). 질적 조사라고 해서 가설검증이 필요 없는 것도 아닙니다(ㄹ은 틀림).\n\n선정편향이 생길 수 있고(ㄴ), 연구대상자의 반응성을 배제할 수 있습니다(ㄷ)."},"21-1-41":{"x":"통제집단이 있는 솔로몬 4집단 설계(ㄱ)와 통제집단 사후검사 설계(ㄹ)는 외부사건(역사요인)을 통제할 수 있습니다.\n\n단일집단 설계(ㄴ, ㄷ)는 통제집단이 없어 통제할 수 없습니다."},"21-1-42":{"x":"ABAB설계는 개입을 철회했다가 다시 도입해 외부요인을 통제하고 개입의 효과를 확인합니다.\n\nABCD설계는 개입효과를 개별적으로 증명하기 어렵고, AB설계는 외부요인 통제가 약하며, 복수기초선설계는 개입 시점을 달리하는 설계입니다. 5번은 경향선 접근에 대한 설명입니다."},"21-1-43":{"x":"연구참여자가 관찰받는 것을 의식해 보이는 반응성은 외적타당도를 저해하는 요인입니다.\n\n실험대상의 탈락, 외부사건, 통계적 회귀, 개입의 확산·모방은 내적타당도 저해요인입니다."},"21-1-44":{"x":"자료에서 나타난 범주들 간 관계를 중심현상, 맥락, 중재조건, 전략, 결과의 틀로 연결하는 과정은 축코딩입니다."},"21-1-45":{"x":"연령 집단별로 같은 인원(100명)씩 할당해 임의 추출하는 방식은 할당 표본추출입니다.\n\n비례 층화는 모집단 비율에 맞춰 추출하고 확률표집이지만, 이 사례는 집단별 인원이 같고 비확률적으로 추출합니다."},"21-1-46":{"x":"질적조사의 엄격성은 장기간 관찰(ㄱ), 부정적 사례 분석(ㄷ), 다각화(삼각검증, ㄹ)로 높일 수 있습니다.\n\n표준화된 척도의 사용(ㄴ)은 양적조사의 방법입니다."},"21-1-47":{"x":"익명의 전문가를 패널로 활용하는 것은 델파이 기법입니다. 초점집단 조사는 소수의 참여자가 모여 토의하는 방법입니다. 2번이 틀렸습니다."},"21-1-48":{"x":"다항선택식 질문은 응답범주 중 하나 또는 그 이상을 선택하게 하는 질문입니다.\n\n1번은 폐쇄형 질문, 2번은 수반형(개연성) 질문, 3번의 이중질문은 피해야 하며, 4번은 짝 문항을 떨어뜨려 배치합니다."},"21-1-49":{"x":"다중(복수) 시계열 설계는 통제집단을 설정해 시계열 측정을 하는 설계입니다. 통제집단을 설정하지 않는다는 설명이 틀렸습니다."},"21-1-50":{"x":"전화조사는 전화번호부 등으로 무작위 표본추출이 가능하고(ㄱ), 면접조사는 우편조사에 비해 비용이 많이 듭니다(ㄹ).\n\n우편조사는 심층 규명이 어렵고(ㄴ), 배포조사는 응답 환경을 통제하기 어렵습니다(ㄷ)."},"22-1-26":{"x":"사회지표조사는 통계적 지표를 사용하는 양적 조사입니다. 문화기술지, 심층사례연구, 근거이론, 내러티브는 질적 연구입니다."},"22-1-27":{"x":"논리적 경험주의는 이론이 관찰에 의해 확률적으로 검증된다고 봅니다.\n\n논리실증주의는 비엔나학파가 주도했고, 상대론은 경험에 의한 객관성을 추구하지 않으며, 쿤은 정상과학에서 기존 이론을 검증하지 않고 변칙 사례가 쌓일 때 패러다임이 전환된다고 보았습니다. 누적 진보를 부정하는 것은 쿤입니다."},"22-1-28":{"x":"사회현상의 주관적 의미를 해석하는 것은 해석주의의 특징이고, 실증주의의 특징이 아닙니다."},"22-1-29":{"x":"평가연구는 과학적 객관성을 유지해야 합니다. 의뢰기관의 요구를 이유로 평가결과를 조정하는 것은 연구윤리에 어긋납니다."},"22-1-30":{"x":"조사는 이론 개발에 사용되고(ㄱ), 연구 전 과정에서 결정주의적 성향을 지양해야 합니다(ㄷ).\n\n여론조사와 인구센서스는 탐색이 아니라 기술 목적이고(ㄴ), 횡단연구와 종단연구는 조사 시점(시간 차원)에 따른 구분입니다(ㄹ)."},"22-1-31":{"x":"둘 이상의 시점에서 조사하되 동일 대상의 반복 측정을 원칙으로 하지 않는 연구는 추세연구와 동년배(코호트)연구입니다. 패널연구는 동일 대상을 반복 측정합니다."},"22-1-32":{"x":"근무기관 규모별 직무만족도를 사회복지사 396명(개인)에게 설문하므로 독립변수와 종속변수의 관찰단위는 모두 개인입니다."},"22-1-33":{"x":"부모의 재산이 비슷한 대상으로 한정해 분석한 것은 부모의 재산을 통제한 것이므로 통제변수입니다."},"22-1-34":{"x":"개념적 정의는 추상적 수준의 정의로 측정가능성을 전제로 하지 않습니다. 측정가능성은 조작적 정의에서 필요합니다.\n\n가설은 자료수집 전에 설정하고, 자료수집 방법은 조사설계에 포함되며, 연구가설은 변수 간 관계가 있다고 설정합니다."},"22-1-35":{"x":"학년은 서열척도, 이수과목 수는 비율척도로 측정수준이 다릅니다.\n\n연령과 접종률은 비율, 섭씨와 화씨는 등간, 강우량과 건수는 비율, 거주지역과 혈액형은 명목입니다."},"22-1-36":{"x":"서스톤척도는 평가자 집단을 구성해 문항을 평가하는 과정이 복잡하여 개발이 어렵다는 단점이 있습니다. 개발의 용이성이 장점이라는 설명이 틀렸습니다."},"22-1-37":{"x":"체계적 오류는 측정의 타당도와 관련이 있습니다. 관련이 없다는 설명이 틀렸습니다. 무작위 오류가 신뢰도와 관련됩니다."},"22-1-38":{"x":"하나의 개념을 측정하는 항목들 간의 일관성은 신뢰도(내적일관성)를 평가하는 기준입니다. 나머지는 판별, 기준, 내용, 구성 타당도 기준입니다."},"22-1-39":{"x":"조사대상자가 알지 못하는 내용은 측정하지 않는 것이 좋습니다. 모르는 내용을 측정하면 무작위 응답이 늘어 신뢰도가 떨어집니다.\n\n항목 수는 늘리고, 유사 질문을 반복해 일관성을 확인하며, 측정자 교육은 사전에 하고, 측정방식은 표준화해야 합니다."},"22-1-40":{"x":"재검사법과 반분법은 신뢰도 평가 방법입니다(ㄱ). 항상 5g 높게 측정되는 저울은 일관되므로 신뢰도가 있습니다(ㄷ).\n\n신뢰도는 타당도의 필요조건이지만 충분조건은 아닙니다(ㄴ은 틀림)."},"22-1-41":{"x":"신뢰수준을 높이면 오차 허용 범위가 넓어져 표집오차(허용오차)가 커집니다. 감소한다는 설명이 틀렸습니다."},"22-1-42":{"x":"체계적 표집은 표집틀(명단)이 있어야 합니다.\n\n단순무작위표집과 다르고 확률표집이며, 모집단 배열에 주기성이 있으면 오히려 대표성에 문제가 생길 수 있습니다."},"22-1-43":{"x":"단순무작위표집은 모집단의 모든 요소가 뽑힐 확률을 알 수 있습니다.\n\n할당표집과 유의표집은 비확률표집이고, 눈덩이표집은 모집단 규모를 모를 때 사용하며, 임의(편의)표집은 대표성이 낮습니다."},"22-1-44":{"x":"연구가설은 모집단의 모수(변수 간 관계)에 대한 가정이지, 표본의 통계치에 대한 가정이 아닙니다. 4번이 틀렸습니다."},"22-1-45":{"x":"표집방법(ㄱ), 표본 크기(ㄴ), 조사 시점(ㄷ), 측정도구의 신뢰도(ㄹ)는 모두 설문조사 결과를 해석할 때 유의할 사항입니다."},"22-1-46":{"x":"질문의 유형과 형태는 조사대상자의 응답능력을 고려해 정해야 합니다.\n\n이중질문은 피해야 하고, 비참여관찰은 상호작용을 최소화하며, 질문 순서는 논리적으로 배치하고, 프로빙은 면접조사의 기술입니다."},"22-1-47":{"x":"전체 회원을 연령과 성별 칸에 배치하고 각 칸에서 절반씩 나누는 방법은 매칭(짝짓기)입니다."},"22-1-48":{"x":"순수실험설계에서 통제집단은 개입이 없으므로 사전·사후 측정치에 유의한 차이가 없어야 합니다. 차이가 있어야 한다는 설명이 틀렸습니다."},"22-1-49":{"x":"반복 측정을 하는 단일집단 시계열 설계에서는 검사효과가 발생할 수 있습니다. 발생할 수 없다는 설명이 틀렸습니다."},"22-1-50":{"x":"축코딩은 범주 간 관계를 중심현상, 인과적 조건, 맥락, 중재조건, 작용·상호작용 전략, 결과의 틀로 연결하는 과정입니다.\n\n1번은 개방코딩 초기, 2번은 개방코딩, 3번은 범주의 속성·차원 분석, 4번은 선택코딩입니다."},"23-1-26":{"x":"연구의 공익적 가치가 연구윤리보다 우선하는 것은 아닙니다. 3번이 틀렸습니다."},"23-1-27":{"x":"실증주의는 연구 결과를 해석할 때 정치적 가치나 이데올로기를 배제하고 객관성을 추구합니다. 적극적으로 고려한다는 설명이 틀렸습니다."},"23-1-28":{"x":"매번 동일한 집단을 관찰하는 종단연구는 패널연구입니다.\n\n베이비붐세대 연구는 동류집단연구, 센서스 비교는 추이연구, 가장 정확한 것은 패널연구, 일반 모집단의 변화 연구는 추이연구입니다."},"23-1-29":{"x":"영가설은 연구가설과 대립되는 가설로(ㄱ) 변수 간 관계가 없음을 뜻합니다(ㄴ).\n\n영가설을 기각해야 대안(연구)가설이 채택되며, 관계가 우연이 아님은 영가설 기각으로 확인합니다."},"23-1-30":{"x":"초기면접으로 서비스 개발의 가능성을 파악하는 것은 설명적 연구가 아니라 탐색적 연구입니다."},"23-1-31":{"x":"성별, 장애유형, 거주지역, 직업종류는 모두 범주로 구분되는 명목척도입니다."},"23-1-32":{"x":"내적 타당도는 외적 타당도의 필요조건이지만 충분조건은 아닙니다. 내적 타당도가 있어야 외적 타당도가 의미가 있지만, 내적 타당도가 높다고 외적 타당도가 높아지는 것은 아닙니다.\n\n인과관계 기술은 내적 타당도이고, 일반화는 외적 타당도이며, 탈락·우연한 사건은 내적 타당도 저해요인입니다."},"23-1-33":{"x":"면접조사는 응답자의 신원이 드러나므로 익명성 보장 수준이 우편설문보다 낮습니다. 1번이 틀렸습니다."},"23-1-34":{"x":"연령을 10대, 20대처럼 구간으로 나눈 변수는 서열척도이므로 산술평균을 구할 수 없습니다. 5번이 틀렸습니다."},"23-1-35":{"x":"델파이 조사는 패널의 익명성을 보장해 감정적 충돌을 줄이는 것이 장점입니다. 익명성 보장이 어렵다는 설명이 틀렸습니다."},"23-1-36":{"x":"관찰법은 표정, 몸짓 같은 비언어적 상황의 자료를 수집하기 쉽습니다.\n\n자료는 관찰자가 생성하고, 상황 통제가 어렵고, 내면적 의식은 파악하기 어려우며, 관찰이 객관화에 최적인 방법은 아닙니다."},"23-1-37":{"x":"당사자와 연구자가 함께 문제를 정의하고 해결 방안을 만들어 수행하는 것은 참여행동연구이며, 사회변화와 임파워먼트에 초점을 둡니다.\n\n개방·축·선택코딩은 근거이론, 이론 개발은 근거이론, 단일사례 분석은 사례연구, 개인적 설화는 내러티브 연구입니다."},"23-1-38":{"x":"무작위 배정과 사전·사후검사가 있는 통제집단 사전사후검사설계에서는 통제집단도 같은 시간이 흘러 자연적 성숙의 영향을 같이 받으므로, 성숙효과를 통제할 수 있습니다.\n\n사전검사를 하므로 테스트 효과가 발생할 수 있고, 사전검사로 집단 간 동질성을 확인할 수 있으며, 사전검사와 프로그램의 상호작용 효과는 통제되지 않습니다."},"23-1-39":{"x":"자발적 참여자만으로 표본을 구성하면 모집단을 대표하지 못해 일반화가 어려워져 외적 타당도가 저해됩니다.\n\n1번은 성숙, 2번은 검사효과, 3번은 도구효과, 4번은 선택편향으로 모두 내적 타당도 저해요인입니다."},"23-1-40":{"x":"BA설계는 개입이 시급해 기초선을 오래 못 잡을 때 적합합니다(ㄱ). ABAB설계는 개입을 철회·재도입해 AB설계보다 외부사건 통제력이 큽니다(ㄷ). 복수기초선디자인도 AB설계보다 외부사건 통제력이 큽니다(ㄹ).\n\nABAC설계는 앞선 개입의 이월(선행) 효과를 통제하지 못합니다(ㄴ은 틀림)."},"23-1-41":{"x":"기초선이 불안정한 경우에는 평균비교가 적합하지 않고, 경향선 분석이 적합합니다. 2번이 틀렸습니다."},"23-1-42":{"x":"타당도가 낮은 척도의 사용은 일관되게 다른 것을 재는 체계적 오류와 관련됩니다. 무작위 오류를 발생시킨다는 설명이 틀렸습니다."},"23-1-43":{"x":"조작적 정의는 개념적 정의를 실제 관찰·측정 가능한 수준으로 전환하는 것입니다(ㄱ).\n\n개념의 의미는 오히려 좁아지고 구체화되며(ㄴ, ㄷ은 틀림), 가설 검증에는 조작적 정의가 필요합니다(ㄹ은 틀림)."},"23-1-44":{"x":"표본의 크기가 커지면 표집오차는 작아집니다. 3번이 틀렸습니다.\n\n참고로 1번(신뢰수준을 높이면 표집오차가 감소한다)은 이 시험에서 옳은 것으로 처리되었지만, 엄밀히는 신뢰수준을 높이면 오차 허용 범위가 넓어진다고 보기도 하는 보기입니다. 22년 1교시 41번 등 다른 문항과 해석이 다르니 정답표에 따라 학습하세요."},"23-1-45":{"x":"삼각측정(ㄱ), 예외사례 표본추출(ㄴ), 장기적 관찰(ㄷ), 연구윤리 강화(ㄹ)는 모두 질적연구의 엄격성을 높이는 방법으로 처리됩니다."},"23-1-46":{"x":"표집오류를 줄이기 위해 층화표집을 사용할 수 있습니다.\n\n가장 잘 대표하는 방법은 무작위 확률표집이고, 이질적인 모집단은 표본 크기를 늘려야 하며, 전수조사에는 통계치가 없고 모수만 있습니다. 체계적표집은 무작위로 시작점을 정합니다."},"23-1-47":{"x":"보가더스의 사회적 거리척도는 누적척도입니다.\n\n리커트는 문항별 중요도를 동일하게 보고, 평정척도는 적절성 평가가 어렵고, 거트만척도는 단일차원을 분석하며, 의미차별척도는 서로 대조되는 형용사 쌍을 사용합니다."},"23-1-48":{"x":"내용타당도(ㄱ), 동시타당도(ㄴ), 구성타당도(ㄹ)에 대한 설명이 옳습니다.\n\n동시타당도는 기준(관련)타당도의 하위 유형이며, 예측타당도와 동시타당도가 기준관련타당도의 하위 타당도입니다. ㄷ의 서술은 틀렸습니다."},"23-1-49":{"x":"상관관계가 높은 문항을 범주화해 하위요인을 만드는 요인분석은 타당도를 검증하는 방법입니다. 신뢰도 측정 방법이 아닙니다."},"23-1-50":{"x":"할당표집은 할당 후 확률표집이 아니라 비확률표집을 사용합니다. 2번이 틀렸습니다."},"24-1-26":{"x":"포퍼의 반증주의는 쿤의 과학관의 문제를 극복하려고 나온 것이 아닙니다. 포퍼가 먼저 반증주의를 제시했고, 쿤이 이를 비판하며 패러다임 이론을 전개했습니다. 3번이 틀렸습니다."},"24-1-27":{"x":"연구참여자를 속이는 것은 원칙적으로 금지되지만, 연구의 중요성이 크고 대안이 없으며 사후 설명(디브리핑)을 하는 등 일정한 조건에서는 허용될 수 있습니다. '어떤 경우라도 허용되지 않는다'는 설명이 틀렸습니다."},"24-1-28":{"x":"과학적 지식은 경험적으로 검증 가능하고(ㄱ), 잠정적이며 수정될 수 있고(ㄴ), 객관성을 추구하며(ㄷ), 반복해서 재현할 수 있어야 합니다(ㄹ)."},"24-1-29":{"x":"동일한 표본을 시간을 달리해 추적 관찰하는 것은 패널조사, 일정 연령 집단을 대상으로 하는 종단연구는 코호트조사입니다."},"24-1-30":{"x":"이혼·폭력·범죄는 사회적 가공물이고(ㄱ), 생태학적 오류는 집단 조사를 근거로 개인에 대한 결론을 내리는 오류이며(ㄴ), 환원주의는 특정 분석단위나 변수로 설명하려는 경향입니다(ㄷ). 모두 옳습니다."},"24-1-31":{"x":"독립변수는 원인(설명)변수이고, 종속변수는 결과변수입니다. 3번은 반대로 서술했습니다."},"24-1-32":{"x":"연구가설은 연구의 개념적 틀이나 연구모형에서 도출됩니다.\n\n연구가설은 직접 검정하지 않고 영가설을 검정하며, 영가설은 우연에 의한 차이로 진술되고, 영가설이 연구가설의 반증을 위해 설정됩니다."},"24-1-33":{"x":"인과관계를 추론하려면 독립변수와 종속변수의 관계가 제3의 변수로 설명되지 않아야 합니다(허위관계 배제).\n\n원인이 결과보다 시간적으로 앞서야 하고, 두 변수가 함께 변해야 하며, 종단연구가 횡단연구보다 인과 추론에 더 적합합니다."},"24-1-34":{"x":"종교는 명목척도, 교육연수는 절대영점이 있는 비율척도, 학점(A~F)은 서열척도입니다."},"24-1-35":{"x":"생활수준(상·중·하)은 서열척도이고, 혈액형은 명목척도입니다. 측정수준이 서로 다릅니다.\n\n나머지는 같은 수준입니다. 전공과 유무는 명목, 증가율과 소득은 비율, 온도와 IQ는 등간, 성별과 흡연여부는 명목입니다."},"24-1-36":{"x":"보가더스의 사회적 거리척도는 누적척도(서열 수준)입니다. 등간척도의 한 종류라는 설명이 틀렸습니다."},"24-1-37":{"x":"내적일관성에 근거한 신뢰도 측정 방법은 알파계수(크론바하 알파)입니다.\n\n검사-재검사법과 대안법은 안정성·동등성, 조사자간 신뢰도는 측정자 간 일치도입니다."},"24-1-38":{"x":"타당도가 있다면 측정이 정확하다는 뜻이므로 어느 정도 신뢰도도 있다고 볼 수 있습니다.\n\n신뢰도가 높다고 타당도가 높은 것은 아니고, 요인분석은 타당도 검증 방법입니다. 의도한 개념을 정확히 측정하는 정도는 타당도이고, 전문가 판단으로 내용을 담았는지 보는 것은 내용타당도입니다."},"24-1-39":{"x":"표집틀은 표본을 뽑는 대상 명단이므로 노인 이용자 명단입니다.\n\n모집단은 복지관을 이용하는 노인 전체이고, 표집방법은 무작위(확률)이며, 관찰단위와 분석단위는 개인입니다."},"24-1-40":{"x":"할당표집은 비확률표집으로, 동일한 추출확률에 근거하지 않습니다. 2번이 틀렸습니다."},"24-1-41":{"x":"표집오차는 모집단의 모수와 표본 통계치의 차이입니다. 모집단의 크기와 표본 크기의 차이가 아닙니다. 4번이 틀렸습니다."},"24-1-42":{"x":"체계적 표집은 확률표집으로 양적연구에서 쓰는 방법입니다. 질적연구에서는 판단·결정적 사례·극단적 사례·최대변이 표집 등을 씁니다."},"24-1-43":{"x":"이 설계는 무작위 배정을 통해 외적 요인을 통제하려고 한 통제집단 사전사후검사설계입니다. 외적 요인의 통제를 시도하지 않았다는 설명이 틀렸습니다."},"24-1-44":{"x":"내용분석은 이미 만들어진 자료를 분석하는 비반응적 방법입니다. 반응적 연구방법이라는 설명이 틀렸습니다."},"24-1-45":{"x":"단일사례연구에서는 ABCD설계처럼 서로 다른 개입방법을 연속해서 도입할 수 있습니다. 1번이 틀렸습니다."},"24-1-46":{"x":"질적연구는 관찰에서 이론을 이끌어내는 귀납적 방법을 활용합니다.\n\n변수중심 분석, 논리실증주의, 규칙성과 보편성, 대표성 있는 표본은 양적연구의 특성입니다."},"24-1-47":{"x":"사전조사 없이 프로그램 실시 집단(A)과 이미 존재하는 비교집단(B)을 사후에 비교하는 설계는 정태적 집단비교 설계입니다."},"24-1-48":{"x":"질문 내용과 방법의 표준화 정도가 낮은 유형은 심층면접(ㄷ)과 비구조화 면접(ㄹ)입니다.\n\n스케줄-구조화 면접과 설문지를 이용한 면접은 표준화 정도가 높습니다."},"24-1-49":{"x":"통계적 회귀는 프로그램 개입과 관계없이 극단적인 점수가 사후검사에서 평균에 가까워지는 경향입니다."},"24-1-50":{"x":"완전참여자는 연구대상의 승인 없이 신분을 숨기고 집단의 일원으로 관찰하므로 연구윤리 문제가 제기될 수 있습니다.\n\n관찰되는 사실을 알면 자연스러운 관찰이 어렵고 상호작용 없는 관찰은 완전관찰자입니다. 승인을 받고 객관성을 유지하는 것은 참여관찰자, 인위적 통제는 실험에 가깝습니다."},"25-1-26":{"x":"조사연구는 객관적 근거로 실천을 개선하는 것이지, 사회복지사의 직관에 의한 실천지식을 강화하는 것이 아닙니다. 3번이 틀렸습니다."},"25-1-27":{"x":"연구결과를 일반화하려면 모집단의 속성이 반영된 충분한 표본을 조사해야 합니다.\n\n기술연구는 원인을 설명하는 것이 아니라 현상을 기술하고, 기대와 다르다고 가설을 결과에 맞춰 수정하면 안 되며, 주관적 판단이 아닌 객관적 해석이 필요하고, 결정론으로 단정하지 않습니다."},"25-1-28":{"x":"전국 가구 중 일부를 표본으로 선정하는 표본조사(ㄴ)이고, 시간 간격을 두고 반복하는 종단조사(ㄱ)이며, 매번 다른 표본을 뽑아 같은 항목의 변화를 보는 경향(추세)조사(ㄹ)입니다.\n\n동일한 사람을 추적하는 패널조사(ㄷ)는 아닙니다."},"25-1-29":{"x":"조사 과정은 주제 선정(ㄷ) → 가설 설정(ㄴ) → 표집방법 수립(ㄱ) → 자료 수집(ㄹ) → 분석과 가설 지지 여부 결정(ㅁ) 순입니다."},"25-1-30":{"x":"유의확률(p)이 유의수준(α)보다 낮으면 영가설을 기각합니다.\n\n연구가설이 아니라 영가설을 검증하며, 신뢰수준을 높이면 1종 오류 가능성은 줄고, 연구가설은 관계가 오류가 아니라 존재함을 가정합니다. 신뢰수준(1-α)을 낮추면 α가 커져 1종 오류가 늘고 2종 오류는 줄어듭니다."},"25-1-31":{"x":"업무부담은 독립변수, 소진정도는 종속변수이고, 이 관계가 동료와의 친밀도에 따라 달라지므로 동료와의 친밀도는 조절변수입니다."},"25-1-32":{"x":"전문가에게 측정문항이 개념의 요소를 충분히 포함하는지 판단하게 한 것은 내용타당도입니다."},"25-1-33":{"x":"문항이 친밀한 관계부터 일시적 방문까지 거리감의 정도를 누적적으로 나타내므로 보가더스(사회적 거리) 척도입니다."},"25-1-34":{"x":"신뢰도는 타당도의 필요조건이지만 충분조건은 아닙니다. 필요충분조건이라는 설명이 틀렸습니다."},"25-1-35":{"x":"조작적 정의는 구체적으로 측정 방법을 정하므로 개념적 정의보다 주관적 해석의 수준이 낮습니다.\n\n조작적 정의는 양적조사에서 더 중요하고, 개념의 의미를 확장하기보다 좁히며, 순서는 개념적 정의 → 조작적 정의 → 측정이고, 변수는 조작적 정의를 통해 측정합니다."},"25-1-36":{"x":"전수조사는 조사 대상이 많아 관리가 어려워 비표본오차가 더 클 수 있습니다. 표본연구가 전수연구보다 비표본오차가 크다는 설명이 틀렸습니다."},"25-1-37":{"x":"산술평균은 등간 또는 비율척도에서 쓸 수 있습니다. 용돈(만원), 재학 기간(연), 가출 횟수는 비율척도입니다. 상중하 등급은 서열척도여서 부적합합니다."},"25-1-38":{"x":"등록인원 수에 비례해 난수표로 표본을 뽑는 방법은 비례층화(확률)표집입니다. 군집표집보다 표집오차를 줄일 수 있습니다."},"25-1-39":{"x":"모집단 내 편차(이질성)가 클수록 표본의 크기를 늘려야 합니다.\n\n표본이 클수록 추정치가 모수에 근접할 확률은 커지고, 비용과 시간은 표본 크기에 영향을 주며, 표본 크기와 표본오차는 반비례하고, 통계분석방법은 표본 크기와 관련이 있습니다."},"25-1-40":{"x":"하나의 집단을 대상으로 개입 전후에 여러 차례 반복 측정하는 설계는 단순시계열 설계입니다."},"25-1-41":{"x":"온라인 설문은 표적집단 확인이 대면면접에 비해 제한적입니다.\n\n인터넷 접근이 어려운 대상은 제외되고, 비용과 시간이 모두 적게 들며, 복잡하거나 문항이 많은 조사에는 부적합하고, 중복응답 통제가 어렵습니다."},"25-1-42":{"x":"참여자가 프로그램 참여를 의식해 행동이 달라지는 것은 반응성(호손효과)으로 외적 타당도를 저해하는 요인입니다.\n\n집단 간 상호작용(개입의 확산), 탈락, 선택 편향, 검사(학습)효과는 모두 내적 타당도 저해요인입니다."},"25-1-43":{"x":"솔로몬 4집단 설계는 집단이 4개라 현장에서 실제로 활용하기 어렵습니다. 활용하기 용이하다는 설명이 틀렸습니다."},"25-1-44":{"x":"무작위 배정으로 실험집단과 통제집단을 나누는 순수실험설계는 전실험설계보다 내적타당도가 높습니다.\n\n인과적 추론 정도가 가장 높고, 집단의 동질성을 가정할 수 있으며, 정태적 집단비교설계는 무작위 배정이 없습니다."},"25-1-45":{"x":"델파이기법은 익명성을 보장하는 방식이어서, 기명으로 진행한다는 설명이 틀렸습니다."},"25-1-46":{"x":"양적연구는 객관적·논리적 관점에서 접근합니다. 주관적이고 직관적인 관점은 질적연구의 특성입니다."},"25-1-47":{"x":"AB설계는 기초선(A)과 개입(B)으로 구성되고(ㄱ), 복수기초선설계는 AB설계를 여러 대상이나 상황에 적용해 확인합니다(ㄴ). 집단 자료도 평균이나 빈도로 요약해 단일사례로 취급할 수 있습니다(ㄷ).\n\n단일사례설계는 일반적으로 외적타당도가 낮아 일반화가 어렵습니다(ㄹ은 틀림)."},"25-1-48":{"x":"관찰법은 참여자가 면접에 비협조적인 경우에도 행동을 직접 관찰해 자료를 수집할 수 있습니다.\n\n우편조사는 조사자의 편견이 개입하기 어렵고, 전화면접이 대면면접보다 익명성을 보장하기 쉬우며, 대면면접은 복잡한 질문도 가능하고, 반구조화 면접은 질문 순서와 문항이 유연합니다."},"25-1-49":{"x":"서베이 연구는 양적연구이고, 근거이론·참여행동·민속학적(문화기술지)·현상학적 연구는 질적연구입니다."},"25-1-50":{"x":"내용분석은 비관여적이고 비반응적인 연구이지만, 내러티브 탐구는 연구자가 참여자와 상호작용하는 관여적 연구입니다. 2번이 틀렸습니다."},"26-1-26":{"x":"객관성(ㄱ), 체계성·논리성(ㄴ), 반증가능성에 대한 개방성(ㄷ), 연구과정의 투명성(ㄹ)은 모두 과학적 연구의 특성입니다."},"26-1-27":{"x":"진리가 연구자의 경험과 특성에 따라 다르게 구성된다고 보는 것은 구성주의의 입장입니다. 후기실증주의는 객관적 진리가 존재하지만 완벽하게 알 수 없다고 봅니다. 2번이 틀렸습니다."},"26-1-28":{"x":"2026년 현재 10대인 같은 집단(코호트)을 대상으로 시간이 지남에 따른 변화를 분석하는 코호트 연구입니다.\n\n매번 같은 모집단에서 새로 표본을 뽑으므로 동일인 반복 조사가 아니며, 횡단연구보다 비용이 더 많이 들고, 종단연구에 해당합니다."},"26-1-29":{"x":"비구조화된 질문을 주로 쓰는 것은 질적연구입니다. 양적연구는 구조화된 질문을 사용합니다."},"26-1-30":{"x":"유권자 집단은 사회집단입니다. 결혼식, 민요, 교통사고, 요리책은 사회적 가공물에 해당합니다."},"26-1-31":{"x":"검정력(1-β)은 영가설이 거짓일 때 이를 올바르게 기각할 확률입니다. 영가설이 참일 때 기각될 확률은 1종 오류(유의수준)입니다."},"26-1-32":{"x":"타당도가 낮은 도구는 일관되게 다른 것을 재는 체계적 오차를 발생시킵니다. 무작위 오차는 신뢰도와 관련됩니다."},"26-1-33":{"x":"조작적 정의는 개념의 의미를 구체화하고 좁힙니다. 의미가 다양해진다는 설명이 틀렸습니다."},"26-1-34":{"x":"임금수준은 비율척도, 성별은 명목척도(1·2는 단순 부호), 교육수준은 서열척도입니다."},"26-1-35":{"x":"보가더스 척도는 누적척도(ㄱ), 거트만 척도는 문항을 서열적(누적적)으로 구성하며(ㄴ), 리커트 척도는 척도·지수 개발이 용이합니다(ㄹ).\n\n의미차별척도는 유사한 형용사가 아니라 서로 반대되는 한 쌍의 형용사를 씁니다(ㄷ은 틀림)."},"26-1-36":{"x":"신뢰도가 높아도 타당도가 높아지는 것은 아닙니다. 2번이 틀렸습니다."},"26-1-37":{"x":"문항들이 3개 요인으로 구분되고, 서로 다른 요인의 문항 간 상관이 낮은 것을 확인한 것은 판별타당도입니다."},"26-1-38":{"x":"표본 크기가 커질수록 모수와 통계치가 더 비슷해집니다. 표본크기와 무관하다는 설명이 틀렸습니다."},"26-1-39":{"x":"단순무작위표집은 모집단 요소가 표본으로 추출될 확률을 사전에 알 수 있습니다.\n\n할당표집은 비확률표집, 체계적표집은 확률표집, 눈덩이표집은 비확률표집, 임의표집은 대표성이 낮습니다."},"26-1-40":{"x":"우편설문법은 대면면접법에 비해 응답률이 낮고(ㄴ), 대면면접은 결측치를 줄일 수 있으며(ㄷ), 우편설문은 익명성이 더 보장됩니다(ㄹ).\n\n대면면접법은 우편설문보다 비용이 더 듭니다(ㄱ은 틀림)."},"26-1-41":{"x":"설문지는 고정반응(응답 습관)이 나타나지 않도록 배열해야 합니다. 고정반응이 나타나도록 배열한다는 설명이 틀렸습니다."},"26-1-42":{"x":"코딩은 내용분석의 핵심 조사과정입니다. 조사과정에 해당하지 않는다는 설명이 틀렸습니다."},"26-1-43":{"x":"델파이기법은 의견을 수렴하는 과정에서 극단적인 의견이 제외되는 문제가 있습니다.\n\n델파이는 익명이라 후광효과를 줄이고, 여러 번 반복해 합의를 도출합니다. 초점집단면접은 익명의 패널이 아니고, 참여자 수가 적어 일반화가 어렵습니다."},"26-1-44":{"x":"두 시설을 선정해 사전검사를 하고 한 곳에만 개입한 뒤 사후검사를 하는, 무작위 배정이 없는 설계는 비동일 통제집단 설계입니다."},"26-1-45":{"x":"연구대상의 대표성이 낮으면 연구결과의 일반화가 어려워 외적타당도를 저해합니다.\n\n내적타당도가 높다고 외적타당도가 높지는 않고, 1·2번의 정의가 서로 바뀌어 있으며, 우연한 외부사건과 탈락은 내적타당도 저해요인입니다."},"26-1-46":{"x":"정태적 집단비교 설계는 무작위 배정과 사전검사가 없어 내적타당도도 낮고, 외적타당도도 낮은 전실험설계입니다. 5번이 틀렸습니다."},"26-1-47":{"x":"기초선이 불안정할 때 변화의 폭과 기울기를 고려해 분석하는 방법은 경향선 접근입니다. 평균비교가 아닙니다. 2번이 틀렸습니다."},"26-1-48":{"x":"참여관찰에서는 연구자가 대상에 몰입해 오히려 편향이 개입될 수 있습니다. 편향성이 통제된다는 설명이 틀렸습니다."},"26-1-49":{"x":"개발한 도구의 측정값을 현재 쓰는 도구와 비교하는 것은 동시타당도(ㄴ)이고, 기준관련타당도는 기준변수의 발생 시점에 따라 동시타당도와 예측타당도로 나뉩니다(ㄹ).\n\nㄱ의 통상적 합의와 일치하는 정도는 내용(액면)타당도에 가깝고, ㄷ의 이론체계 안에서의 관련성은 구성타당도입니다."},"26-1-50":{"x":"개방코딩, 축코딩, 선택코딩은 근거이론의 분석방법입니다. 문화기술지가 아닙니다. 4번이 틀렸습니다."}},"data/e_sk.json":{"17-2-26":{"x":"정신역동모델은 치료적 처방 제공보다 통찰을 통한 이해와 변화에 초점을 둡니다. 4번이 틀렸습니다."},"17-2-27":{"x":"가족항상성은 가족규칙을 활성화해 균형과 지속적인 관계를 유지하게 합니다.\n\n가족은 제도적 기능보다 정서적 기능이 중시되고, 밀착된 경계는 기능적이지 않으며, 가족문제는 순환적 인과로 설명하고, 생활주기가 변하면 역할분담도 변해야 합니다."},"17-2-28":{"x":"인지행동 집단치료의 지도자는 인지 재구성을 돕는 교육자·코치의 역할을 합니다. 무력감 극복을 위한 옹호자 역할은 맞지 않습니다."},"17-2-29":{"x":"보웬의 이론에서 자아분화 수준이 낮은 부모는 삼각관계로 불안을 회피하며(ㄱ), 나-입장취하기는 탈삼각화를 촉진하고(ㄴ), 가계도를 통해 정서적 과정을 이야기합니다(ㄹ).\n\n가족조각(ㄷ)은 사티어의 경험적 기법입니다."},"17-2-30":{"x":"해결중심모델은 변화는 항상 일어나며 불가피하다고 봅니다.\n\n비규범적이고, 현재와 미래를 지향하며, 병리나 문제의 원인 규명이 아니라 해결과 강점에 초점을 둡니다."},"17-2-31":{"x":"사회기술훈련은 외현적(관찰 가능한) 행동을 측정합니다. 단서 식별, 타임아웃, 자기대화, 시각적 현상화는 내면의 암시적 행동을 훈련하므로 암시적 행동에 대한 개별측정척도를 활용합니다."},"17-2-32":{"x":"인지행동모델은 개인의 주관적 경험과 인지의 독특성을 인정합니다. 인정하지 않는다는 설명이 틀렸습니다."},"17-2-33":{"x":"사회적 관계망표는 사회적 관계에서의 지지 유형과 정도를 파악하는 도구입니다.\n\n가계도는 세대 간 반복 유형, 생태도는 환경과의 접촉, 가족지도는 가족 구조와 경계, 생활력도표는 종단적 생활사건을 파악합니다."},"17-2-34":{"x":"좋은 기록은 서비스의 결정과 실행에 초점을 둡니다.\n\n상황묘사와 사회복지사의 견해를 구분하고, 정보를 쉽게 찾을 수 있게 정리하며, 필요한 내용을 간결하게 쓰고, 클라이언트의 관점을 포함해야 합니다."},"17-2-35":{"x":"행동조성은 목표행동을 세분화해 단계적으로 강화하는 기법입니다.\n\n예외질문은 문제가 없던 때를 묻는 질문이고, 체계적 둔감법은 불안을 단계적으로 감소시키는 것이며, 다른 보기의 설명도 기법과 맞지 않습니다."},"17-2-36":{"x":"사티어의 회유형은 자신을 무시하고 타인과 상황만 존중하는 역기능적 의사소통입니다. 기능적 의사소통은 일치형입니다."},"17-2-37":{"x":"클라이언트의 인식에 기초한 질적 평가는 부가적 성과 확인, 기여·방해요인 피드백, 특수 요인 발견, 클라이언트 시각의 의미 도출이 목적입니다. 사회복지사의 소진 예방은 목적이 아닙니다."},"17-2-38":{"x":"권한부여모델은 클라이언트를 파트너로 보고(ㄱ), 문제해결모델은 진단주의와 기능주의의 통합이며(ㄴ), 클라이언트중심모델은 현재 경험을 강조합니다(ㄷ).\n\n위기개입모델은 사건 자체보다 사건에 대한 주관적 인식과 반응을 중시합니다(ㄹ은 틀림)."},"17-2-39":{"x":"처벌받는 행동은 발생빈도가 줄고(ㄱ), 간헐적으로 강화된 행동은 소거하기 어려우며(ㄴ), 긍정적 강화는 행동을 증가시킵니다(ㄷ).\n\n부적 처벌은 긍정적 자극을 제거해 행동을 감소시키는 것이고, 체벌 제시는 정적 처벌입니다(ㄹ은 틀림)."},"17-2-40":{"x":"패턴화된 집단행동의 확인과 성장 지원은 집단 진행 중에 하는 일입니다. 사전면접의 중요성으로 보기 어렵습니다."},"17-2-41":{"x":"과제중심모델은 발달이론이 아니라 경험적 자료와 검증된 방법을 중심으로 합니다. 3번이 틀렸습니다."},"17-2-42":{"x":"격려(ㄱ), 재보증(ㄴ), 환기(ㄷ), 직면(ㄹ) 기술의 예시가 모두 알맞습니다."},"17-2-43":{"x":"무기명 질문목록카드로 도출된 문제를 토론하는 것은 자기 노출 부담을 줄이는 간접적 자기노출 기법입니다."},"17-2-44":{"x":"집단 구성단계에서는 구성원들의 의사결정 방식을 확인하기보다 구성과 크기, 회기, 빈도 등을 계획합니다. 집단의사결정방법 확인은 집단이 진행되며 다루는 사항입니다. 2번이 틀렸습니다."},"17-2-45":{"x":"엄마가 딸을 대변하는 것을 멈추고 딸이 직접 말하게 하는 것은 하위체계 사이에 경계를 세우는 경계만들기입니다."},"17-2-46":{"x":"구조적 가족치료의 기법에는 경계만들기, 과제주기, 가족 재구조화, 실연 등이 있습니다. 외현화는 이야기치료의 기법입니다."},"17-2-47":{"x":"클라이언트의 강점을 강조하는 모델은 강점관점·해결중심모델 등입니다. 인지행동모델은 인지와 행동의 수정에 초점을 둡니다."},"17-2-48":{"x":"역설적 개입은 가족의 변화 저항이 클 때 사용하고(ㄱ), 증상처방기법을 활용하며(ㄴ), 치료적 이중구속을 이용합니다(ㄹ).\n\n원가족 분석을 중시하는 것은 보웬의 다세대 모델입니다(ㄷ은 틀림)."},"17-2-49":{"x":"과업집단은 조직의 목적과 구조에 따라 운영됩니다. 구성원의 발달과업 완수를 위해 조직구조의 영향을 최소화한다는 설명이 틀렸습니다."},"17-2-50":{"x":"종결단계에서는 종결에 대한 양가감정을 이해하고 반영하며 다루어야 합니다.\n\n의도하지 않은 결과도 확인하고, 서열화 투쟁은 중간단계의 특성이며, 구성과 목적 성취 원조는 초기·중간단계의 일입니다. 종결에 어려움을 느끼는 모든 구성원을 살펴야 합니다."},"18-2-26":{"x":"말로는 의견을 밝히라고 하면서 실제로는 면박을 주는 모순된 두 메시지는 이중구속입니다."},"18-2-27":{"x":"사회적 형평성, 개인의 복지에 대한 사회와 개인의 공동 책임, 개인의 존엄성과 독특성 존중, 자기결정의 원리는 모두 사회복지 전문직의 가치체계입니다."},"18-2-28":{"x":"기록의 목적은 지도감독과 교육 활성화, 책임성 확보, 정보 제공, 클라이언트에 대한 이해 증진입니다. 개인적 보관·활용은 목적이 아닙니다."},"18-2-29":{"x":"강화를 중단해 행동이 감소하게 하는 전략은 소거입니다. 달래거나 야단치는 관심이 오히려 강화였으므로 이를 제거했습니다."},"18-2-30":{"x":"세대 간 전이는 보웬의 다세대 이론의 개념이며, 순환적 인과성의 설명이 아닙니다. 순환적 인과성은 구성원들이 서로 영향을 주고받는 과정입니다."},"18-2-31":{"x":"실천지식은 추상성에서 구체성의 순서로 패러다임 - 관점 - 이론 - 모델 - 실천지혜입니다."},"18-2-32":{"x":"사티어의 초이성형은 자신과 타인을 무시하고 상황만 존중하는 유형입니다. 5번이 틀렸습니다."},"18-2-33":{"x":"가족조각은 조각을 만드는 사람도 조각에 포함됩니다. 제외되는 것이 일반적이라는 설명이 틀렸습니다."},"18-2-34":{"x":"현대사회에서는 가족의 권력구조가 평등해지는 방향으로 변화합니다. 불평등이 심화된다는 설명이 틀렸습니다."},"18-2-35":{"x":"집단 성원의 메시지 사이에 불일치가 있을 때 이를 확인해 주는 것은 집단과정을 촉진하는 활동입니다.\n\n피드백은 구체적이고 긍정적·건설적이어야 하며, 사회복지사는 자기노출을 지속적으로 하지 않고, 피드백은 한 번에 하나씩 해야 합니다."},"18-2-36":{"x":"직업훈련의 성격은 질적 정보이고 반복 측정하기 어려워 성과지표로 쓰기 적합하지 않습니다."},"18-2-37":{"x":"불안감과 저항감 감소, 공통점 연결, 목적 공유는 집단 초기단계의 활동입니다."},"18-2-38":{"x":"동영상 관찰은 모델링, 반복 연습은 시연, 복식호흡과 심상은 이완훈련, 단계적으로 규모를 키우는 것은 체계적 둔감화입니다. 정적 강화는 포함되지 않았습니다."},"18-2-39":{"x":"작고 구체적이며, 갖고 있는 것에 초점을 두고, 긍정적이고 문제해결의 시작으로 보는 목표설정은 해결중심모델의 특성입니다."},"18-2-40":{"x":"프로그램의 최종 목표 달성 여부를 효과성과 효율성 측면에서 평가하는 것은 총괄평가입니다. 형성평가는 진행 중에 자료를 환류해 개선하는 평가입니다."},"18-2-41":{"x":"의미차별척도는 성원이나 대상에 대한 개별 태도와 느낌을 평가하는 데 쓰입니다. 집단의 전반적 상호작용 양상을 평가하는 도구는 상호작용차트, 소시오그램 등입니다. 3번이 틀렸습니다."},"18-2-42":{"x":"인지행동모델은 신념체계가 감정에 영향을 주는지 파악하고(ㄴ), 문제에 대한 통제력이 자신에게 있다고 보며(ㄷ), 질문으로 자기발견과 타당화를 거칩니다(ㄹ).\n\n객관적 경험의 일반화(ㄱ)가 아니라 주관적 경험과 인식을 중시합니다."},"18-2-43":{"x":"클라이언트가 말한 내용을 사회복지사가 다른 말로 바꾸어 되돌려 주는 기술은 환언입니다. 재명명은 의미를 새롭게 바꾸는 기술입니다."},"18-2-44":{"x":"집단사회사업의 장점에는 이타성 향상, 문제의 일반화(보편성), 관찰학습, 가족 경험의 교정적 재현이 있습니다. 역전이를 통해 문제를 해결하는 보편성이라는 설명은 틀렸습니다."},"18-2-45":{"x":"자아효능감 증진, 강점 발견, 클라이언트를 자원으로 인식, 삶에 대한 통제력 강화는 임파워먼트모델의 특징입니다."},"18-2-46":{"x":"개방집단은 구성원이 계속 바뀌므로 발달단계를 예측하기 어렵습니다. 1번이 틀렸습니다."},"18-2-47":{"x":"자살을 생각하는 클라이언트에게는 단서에 민감해야 하고(ㄴ), 시도 경험을 확인하며(ㄷ), 필요하면 정신건강 기관에 의뢰합니다(ㄹ).\n\n자살 계획은 직접 묻는 것이 필요합니다(ㄱ은 틀림)."},"18-2-48":{"x":"집단역학의 구성요소에는 긴장과 갈등, 가치와 규범, 집단목적, 의사소통유형 등이 있습니다. 지식 및 정보습득은 구성요소가 아닙니다."},"18-2-49":{"x":"표적문제의 설정은 과제중심모델의 초기 단계에서 합니다. 중기(실행)단계에서는 과제 계획과 이행, 장애물 해결, 변화 확인 등을 합니다."},"18-2-50":{"x":"클라이언트가 부여하는 의미를 수정해 시각을 변화시키는 기법은 재명명(재구성)입니다. 도전은 모순이나 불일치를 직시하게 하는 기법입니다."},"19-2-26":{"x":"해석의 목적은 통찰력 향상이고(ㄱ), 전이는 반복적이며 퇴행적인 특징을 갖습니다(ㄷ).\n\n훈습은 반복적·점진적 과정이지 단회성 기법이 아니고(ㄴ), 자유연상에서는 떠오르는 내용을 모두 말하게 하며 억제시키지 않습니다(ㄹ)."},"19-2-27":{"x":"클라이언트의 인지오류와 신념체계를 탐색하는 것은 인지행동모델의 개입입니다. 심리사회모델은 감정 표출, 직접 지지·충고, 현재 상황과 과거의 연결, 유년기와 현재 행동의 관계 인식을 활용합니다."},"19-2-28":{"x":"생태도는 진행과 종결 과정에서도 활용하고(ㄱ), 생활력표는 발달단계의 생활경험을 이해하며(ㄴ), 가족조각은 가족역동을 시각화해 인식을 파악합니다(ㄹ).\n\n소시오그램은 성원 간 선호와 관계를 나타내는 도구입니다(ㄷ은 틀림)."},"19-2-29":{"x":"집단 구성원의 이질성이 클수록 방어와 저항이 늘 수 있습니다. 동질성이 강할수록 저항이 많다는 설명이 틀렸습니다."},"19-2-30":{"x":"집단 성원 간 공통점과 차이점 파악은 집단 초기단계의 과업입니다. 종결단계에서는 의존성 감소, 의뢰 검토, 변화의 일반화, 피드백 교환을 합니다."},"19-2-31":{"x":"집단과정의 명료화는 성원들이 어떻게 상호작용하는지 인식하도록 돕는 기술입니다.\n\n성원 간 의사소통을 더 중시해야 하고, 사회복지사는 집단과정에 선택적으로 반응할 수 있으며, 직면은 신뢰가 쌓인 뒤 사용하고, 목표는 처음부터 설명해야 합니다."},"19-2-32":{"x":"타임아웃은 강화받을 기회를 일시적으로 없애는 부적 처벌(정적강화 제거)입니다. 정적강화원리를 이용한다는 설명이 틀렸습니다."},"19-2-33":{"x":"임파워먼트모델은 클라이언트를 일방적 수혜자로 보지 않고(ㄱ), 과제중심모델은 펄만의 문제해결모델의 영향을 받았으며(ㄴ), 위기개입모델은 과거 탐색을 우선하지 않습니다(ㄷ).\n\n클라이언트중심모델은 사회복지사의 권위가 아니라 공감과 수용을 강조합니다(ㄹ은 틀림)."},"19-2-34":{"x":"좌절감을 클라이언트와 분리된 대상처럼 말하는 것은 문제의 외현화 기법입니다."},"19-2-35":{"x":"1차 수준 사이버네틱스는 전문가가 가족 체계를 객관적으로 관찰하는 관점이고(ㄱ), 환류고리는 가족규범이 유지되거나 변화되는 과정을 설명합니다(ㄴ).\n\n가족의사소통에서는 관계기능이 내용기능보다 중요하고(ㄷ은 틀림), 암묵적 규칙이 모두 역기능적인 것은 아닙니다(ㄹ은 틀림)."},"19-2-36":{"x":"문제가 해결된 상태를 가정하는 질문은 기적질문이고, 대처질문은 어려움 속에서도 견뎌온 방법을 묻는 질문입니다. 5번이 틀렸습니다."},"19-2-37":{"x":"하위집단은 정서적 유대감을 가진 성원 사이에서 형성되고(ㄴ), 소시오메트리로 측정할 수 있습니다(ㄹ).\n\n하위집단은 초기단계에 응집력을 촉진하기보다 오히려 전체 집단의 응집을 방해할 수 있고(ㄱ), 최소 2명으로 구성됩니다(ㄷ)."},"19-2-38":{"x":"빙산기법은 사티어의 경험적 가족치료 기법입니다. 전략적 가족치료의 치료적 이중구속은 증상, 지시, 역설 기법을 활용합니다."},"19-2-39":{"x":"집단회기를 마무리할 때는 사회복지사의 관찰 전달(ㄱ), 이슈를 다 마무리하지 못해도 마칠 수 있다는 점(ㄴ), 집단 밖 적용 계획 묻기(ㄷ), 다음 회기 주제 묻기(ㄹ)를 할 수 있습니다."},"19-2-40":{"x":"가족은 권력구조를 가지며 구성원 간 위계와 힘의 균형이 존재합니다. 권력구조가 없다는 설명이 틀렸습니다."},"19-2-41":{"x":"얄롬이 말한 집단의 치료적 효과 요인은 보편성(고유성이 아님), 이타성, 실존적 요인, 교정적 재경험, 희망고취 등입니다."},"19-2-42":{"x":"두 사람이 서로 다른 시점에 개입을 시작하며 변화를 관찰하는 설계는 다중(복수)기초선 설계입니다."},"19-2-43":{"x":"비난형, 감정표현의 통제는 사티어의 의사소통 모델의 관점입니다. 구조적 가족치료는 경계, 위계, 하위체계, 연합과 삼각관계를 다룹니다."},"19-2-44":{"x":"합류(ㄱ), 관계성 질문(ㄴ), 균형 깨뜨리기(ㄹ)의 예시가 맞습니다.\n\n과도한 통제를 관심과 염려로 의미를 바꾸는 것은 경계 만들기가 아니라 재구성(재명명)입니다(ㄷ은 틀림)."},"19-2-45":{"x":"인지행동모델은 개인의 주관적 경험과 인식을 중시합니다.\n\n구조화된 접근을 하고, 이론적 근거가 있으며, 클라이언트가 능동적으로 참여하고, 무의식이 아닌 인지에 초점을 둡니다."},"19-2-46":{"x":"세대 간 반복되는 문제를 다루는 기법은 보웬 모델의 분화촉진입니다. 가계도로 원가족의 반복 패턴을 살피고 자아분화를 높입니다."},"19-2-47":{"x":"성격유형과 심리역동 탐색은 정신역동모델의 접근입니다. 과제중심모델은 현재 문제 확인, 해결 가능한 문제 선정, 자원 확인, 욕구와의 조정 등을 합니다."},"19-2-48":{"x":"전체집단 사정은 하위집단 형성(ㄴ)과 집단 내 상호작용 방식(ㄹ) 등을 봅니다.\n\n기관의 목표는 집단 외부환경, 성원의 변화와 성장은 개별성원 사정에 해당합니다."},"19-2-49":{"x":"위기개입은 사건 자체의 해결보다 위기에 대한 개인의 반응과 대처를 일차적으로 다룹니다. 3번이 틀렸습니다."},"19-2-50":{"x":"SOAP는 주관적 정보(S: 클라이언트의 말, ㄴ), 객관적 정보(O: 관찰, ㄱ), 사정(A: 판단, ㄹ), 계획(P, ㄷ) 순입니다."},"20-2-26":{"x":"사례회의, 세미나 참석, 동료 자문, 초점집단면접은 모두 실천 지식과 기술을 습득하는 방법입니다."},"20-2-27":{"x":"중간단계에는 개별상담으로 내적 변화 파악(ㄱ), 참여 촉진을 위한 목적 상기(ㄴ), 하위집단 의사소통 평가(ㄷ)를 합니다.\n\n의존성 감소를 위한 모임주기 조절(ㄹ)은 종결단계의 과업입니다."},"20-2-28":{"x":"성원 주도성이 높은 순서는 자조집단 - 성장집단 - 교육집단 - 치료집단입니다."},"20-2-29":{"x":"소시오그램은 성원 간 선택과 관계를 표현해 하위집단 유무를 알 수 있게 합니다.\n\n소시오메트리는 호감 정도를 조사하는 방법, 상호작용차트는 상호작용 빈도 기록, 목적달성척도는 목적 달성 정도, 의의차별척도는 대상에 대한 태도 측정입니다."},"20-2-30":{"x":"사회기술훈련에는 코칭, 과제제시, 모델링, 자기옹호 등이 활용됩니다."},"20-2-31":{"x":"공동과업의 성공적 수행이 일차 목표인 집단은 과업집단입니다. 성장집단은 자기표출과 성원 간 상호작용을 통해 개인의 성장을 돕습니다. 4번이 틀렸습니다."},"20-2-32":{"x":"기초선(A) 후 정서지원프로그램(B)을 하고, 일정 기간 뒤 다른 개입인 명상프로그램(C)을 진행했으므로 ABAC설계입니다."},"20-2-33":{"x":"사회복지사의 자기노출은 클라이언트가 자신의 경험을 더 편하게 표현하도록 촉진하기 위해 신중히 사용합니다. 자신의 문제 확인이나 역전이 활용을 위한 것이 아닙니다."},"20-2-34":{"x":"초기면접 준비에서는 목적을 잠정적으로 설정하고 자문을 구하며 환경을 준비하되, 모든 질문을 사전에 확정하면 클라이언트의 이야기에 유연하게 대응하기 어렵습니다. 2번이 틀렸습니다."},"20-2-35":{"x":"1인 가구도 원가족의 생활주기(ㄱ), 스트레스와 레질리언스(ㄴ), 구조적 관점에서 본 미분화된 경계(ㄷ), 역사적 관점에서 본 미해결된 과거 관계의 잔재(ㄹ)를 가족사정에서 살필 수 있습니다."},"20-2-36":{"x":"사회복지사가 경제적 지원(양육비이행지원서비스)과 전화 차단을 지원한 것은 가족을 위한 가족 옹호입니다."},"20-2-37":{"x":"공식 정답표는 5번(ㄱ~ㄹ 모두 옳음)입니다. 가족은 사회변화에 민감한 체계이고(ㄱ), 가족의 현재 모습은 세대 간 전승의 결과이며(ㄷ), 기능적인 가족은 응집성·적응성·문제해결력이 높습니다(ㄹ).\n\nㄴ은 일반적으로는 정서적 기능이 상대적으로 강조되는 흐름으로 설명되어 논란의 여지가 있으니, 이 문항은 정답표 기준으로 암기하세요."},"20-2-38":{"x":"서비스를 거부하는 클라이언트에게는 먼저 합류(joining)로 관계를 맺고 가족의 방식에 맞춰 접근할 방법을 탐색하는 것이 우선입니다."},"20-2-39":{"x":"사례에서 노인의 의사소통 유형은 알 수 없습니다. 비난형 의사소통 유형이라는 분석은 근거가 없어 적절하지 않습니다."},"20-2-40":{"x":"가계도는 세대 반복 패턴(ㄱ), 객관적 정보(ㄴ), 가족기능 불균형의 기여 요인(ㄷ), 중요 사건과 가족의 역할(ㄹ)을 분석할 수 있습니다."},"20-2-41":{"x":"치료를 거부하는 당사자 대신 동기화된 가족이 변화하면 체계 전체가 영향을 받는다는 순환적 인과성을 고려한 개입입니다."},"20-2-42":{"x":"클라이언트를 문제중심으로 보지 않고 자원과 대처능력을 활용하게 해 자립을 돕는 모델은 역량강화모델입니다."},"20-2-43":{"x":"지지하기는 격려와 안심, 공감으로 클라이언트를 돕는 기법입니다. 현재나 최근 사건을 고찰하게 해 현실적 해결방법을 찾는 것은 '현재 사건에 대한 고찰'입니다. 2번이 틀렸습니다."},"20-2-44":{"x":"선택적 사고는 자신의 관점을 지지하는 자료만 취하고 나머지를 무시하는 인지적 왜곡입니다.\n\n과잉일반화는 한두 사건으로 결론을 확대하는 것, 임의적 추론은 증거 없이 결론을 내리는 것, 개인화는 일을 자기 탓으로 돌리는 것, 과장과 축소는 의미를 부풀리거나 줄이는 것입니다."},"20-2-45":{"x":"해결중심모델은 기적질문, 예외질문, 척도질문, 대처질문 등 다양한 질문기법으로 클라이언트와 대화합니다."},"20-2-46":{"x":"청소년의 정체성 위기, 결혼, 출산, 은퇴처럼 생애주기에 따라 예측 가능하게 오는 위기는 발달적 위기입니다."},"20-2-47":{"x":"문제중심기록은 문제의 목록을 작성하고 개입계획까지 포함합니다. 개입계획을 제외한다는 설명이 틀렸습니다."},"20-2-48":{"x":"정신역동모델은 자유연상, 훈습, 직면, 해석의 기술을 사용합니다.\n\n처방보다 통찰에 초점을 두고, 미래의지보다 과거와 무의식을 강조하며, 기능주의가 아닌 진단주의의 기초가 되었습니다."},"20-2-49":{"x":"성폭력 피해로 극단적 선택 가능성이 있는 상황에서 안전 확보를 위해 지지체계를 구성한 것은 위기개입모델입니다."},"20-2-50":{"x":"집단 규칙은 사회복지사가 일방적으로 제공하기보다 성원과 함께 정하도록 하는 것이 바람직합니다. 4번이 틀렸습니다."},"21-2-26":{"x":"원가족과의 해결되지 않은 갈등을 집단 안에서 탐색하고 행동패턴을 수정할 기회를 갖는 것은 교정적 재경험(재경험의 기회 제공)입니다."},"21-2-27":{"x":"이론과 실천 준거틀의 적절한 활용은 과학적 기반이고, 가치관, 감정이입적 의사소통, 진실성, 융통성은 예술적 기반입니다. 1번이 틀렸습니다."},"21-2-28":{"x":"자조집단은 비슷한 문제를 가진 사람들이 스스로 모여 운영합니다. 전문가가 의도적으로 구성하는 것은 아닙니다."},"21-2-29":{"x":"하위집단은 집단에서 필연적으로 생기며, 무조건 막는 것이 아니라 집단에 미치는 영향을 파악해 다루어야 합니다. 1번이 틀렸습니다."},"21-2-30":{"x":"역량강화모델은 클라이언트를 문제의 전문가로 인정하고(ㄱ), 협력적 파트너십을 강조하며(ㄴ), 개입의 주체로 보아 자기결정권을 보호합니다(ㄷ).\n\n문제의 원인이 아니라 강점과 자원에 초점을 둡니다(ㄹ은 틀림)."},"21-2-31":{"x":"클라이언트의 부정적 자기평가를 '자녀와 더 좋은 관계를 가지고 싶다는 뜻'으로 새롭게 해석해 주는 것은 재명명입니다."},"21-2-32":{"x":"과제중심모델에서는 사회복지사도 적극적으로 개입해 과제를 계획하고 이행을 돕습니다. 적극적으로 개입하지 않는다는 설명이 틀렸습니다."},"21-2-33":{"x":"과제중심모델, 위기개입모델, 해결중심모델은 단기개입이 특징입니다. 정신역동모델은 장기적 접근을 하는 편입니다."},"21-2-34":{"x":"해결중심모델은 과거 탐색이나 문제의 원인보다 해결 방안과 미래를 강조합니다. 과거를 깊이 탐색한다는 설명이 틀렸습니다."},"21-2-35":{"x":"위기개입모델은 위기 이전의 기능 수준으로 회복하도록 돕는 것을 목표로 합니다.\n\n단기적이고 구체적인 목표를 세우고, 사회복지사는 적극적·지시적 역할을 하며, 과거 탐색보다 현재의 위기에 초점을 둡니다."},"21-2-36":{"x":"정신역동에서 무의식적 갈등과 불안을 표현하게 해 통찰을 돕고(ㄴ), 훈습으로 문제를 이해하는 능력을 기릅니다(ㄹ).\n\n전이는 이용할 수 있고(ㄱ은 틀림), 해석은 라포가 형성된 후에 제공해야 합니다(ㄷ은 틀림)."},"21-2-37":{"x":"관계성 질문은 '남편이 여기 있다면 어떻게 말할까요'처럼 중요한 타인의 관점에서 묻는 질문입니다.\n\n1번은 대처질문, 3번은 예외질문, 4번은 변화를 묻는 질문, 5번은 예외질문입니다. 보기의 이름과 예시가 서로 뒤섞여 있습니다."},"21-2-38":{"x":"인지행동모델은 무의식적 행동이 아니라 인지와 행동에 초점을 둡니다. 2번이 틀렸습니다."},"21-2-39":{"x":"부부가 여기서 직접 서로 말해 보게 하는 것은 구조적 가족치료의 실연(enactment) 기법입니다."},"21-2-40":{"x":"어느 시점의 인간관계와 감정을 동작과 공간으로 표현하는 비언어적 기법은 가족조각입니다."},"21-2-41":{"x":"집단 초기에는 불안감과 저항이 높고(ㄱ), 오리엔테이션이 필요합니다(ㄴ).\n\n초기에는 사회복지사에게 의존하는 경향이 있고(ㄷ은 틀림), 갈등과 차이점의 적극적 표현은 중간단계에 나타납니다(ㄹ은 틀림)."},"21-2-42":{"x":"집단응집력을 높이려면 자부심 고취, 다른 관점의 인정, 활발한 상호작용, 보상과 자원 제공이 필요합니다. 이질적 집단 구성은 응집력 향상 요인이 아닙니다."},"21-2-43":{"x":"기록은 전문적 활동의 입증 자료(ㄱ)이고, 프로그램 보고와 기금 조성 근거(ㄷ)로 쓰이며, 클라이언트와 정보를 공유하는 도구(ㄹ)가 될 수 있습니다.\n\n다른 전문직과도 필요한 정보를 공유합니다(ㄴ은 틀림)."},"21-2-44":{"x":"가계도로는 삼각관계(ㄱ), 지배적 주제와 가족구조의 변화(ㄴ), 반복되는 사건의 연결성(ㄹ)을 분석할 수 있습니다.\n\n지역사회의 안정성과 쾌적성은 생태도나 환경 사정으로 파악합니다(ㄷ은 틀림)."},"21-2-45":{"x":"가족과 함께 문제의 우선순위를 정하고(ㄱ), 낮은 자세로 정보를 얻으며(ㄴ), 합류로 관계를 형성하고(ㄷ), 문제가 가족 모두에게 영향을 줄 때 가족단위 개입을 고려합니다(ㄹ). 모두 옳습니다."},"21-2-46":{"x":"가족의 변화 속도가 빠르다고 지적하며 천천히 변화하라고 하는 전략적 가족치료 기법은 제지입니다."},"21-2-47":{"x":"집단이 커질수록 구성원의 참여의식은 줄어들고, 통제와 개입도 어려워집니다. 1번이 틀렸습니다."},"21-2-48":{"x":"가족체계는 성장과 발전을 추구하면서도 지나친 변화를 제어하고 안정성을 유지하려 합니다(항상성).\n\n순환적 인과관계는 원인 제공자를 찾는 것이 아니고, 동귀결성은 다른 원인이 같은 결과에 이를 수 있다는 개념이며, 가족 내부에도 하위체계가 있고, 2차 사이버네틱스에서 사회복지사를 가족과 분리하지 않습니다."},"21-2-49":{"x":"직면은 집단성원이 인식하지 못한 부분을 보게 하고(ㄴ), 말과 행동의 불일치를 밝히며(ㄷ), 행동을 구체적으로 지적하고 영향을 설명합니다(ㄹ).\n\n시작단계에서 가장 많이 쓰는 기법이 아닙니다(ㄱ은 틀림). 신뢰가 쌓인 뒤 사용합니다."},"21-2-50":{"x":"일치형 의사소통이 치료의 목표이고(ㄱ), 의사소통 유형은 자존감과 연관되며(ㄴ), 역기능적 유형에서는 언어적 메시지와 비언어적 메시지가 불일치합니다(ㄹ).\n\n가족생활주기와 역기능적 의사소통의 연관은 사티어 모델의 설명이 아닙니다(ㄷ은 틀림)."},"22-2-26":{"x":"사회복지실천은 심리학, 사회학 등 인접 학문의 지식을 활용합니다. 타 학문과 배타적 관계에 있다는 설명이 틀렸습니다."},"22-2-27":{"x":"지지집단은 비슷한 처지의 사람들이 동병상련의 경험으로 서로 지지하며 해결책을 찾는 것이 목적입니다.\n\n자기인식 증진은 성장집단, 병리적 행동 치료는 치료집단, 기술과 정보 제공은 교육집단의 목적입니다."},"22-2-28":{"x":"집단 초기에는 목표 설정(ㄱ), 사회복지사 소개와 신뢰감 형성(ㄴ), 유사성을 토대로 한 응집력 형성(ㄷ)이 필요합니다.\n\n집단 의존성을 줄이는 것(ㄹ)은 종결단계의 과업입니다."},"22-2-29":{"x":"저항을 무시하면 문제가 커질 수 있습니다. 저항의 이유를 이해하고 다루어야 합니다. 3번이 틀렸습니다."},"22-2-30":{"x":"소시오그램은 소시오메트리 질문으로 성원 간 선택과 거부, 호감을 파악해 도식화한 것입니다.\n\n호감도 질문은 피하는 것이 아니고, 주제 발견이 목적이 아니며, 문장이 아니라 그림으로 표현하고, 상반된 입장 중 선택하는 방식이 아닙니다."},"22-2-31":{"x":"구성원 간 신뢰가 높을수록(ㄱ), 소속감이 있을수록(ㄷ) 응집력이 높고, 응집력이 높은 집단이 더 생산적인 작업에 유리합니다(ㄹ).\n\n응집력이 높으면 자기노출이 촉진됩니다(ㄴ은 틀림)."},"22-2-32":{"x":"집단목표는 구체적으로 수립해야 합니다.\n\n상황에 따라 수정할 수 있고, 집단 크기와 기간은 목표를 고려하며, 구성원의 목표와 관련이 있고, 의도적인 노력이 필요합니다."},"22-2-33":{"x":"직접적 영향은 사회복지사가 클라이언트에게 제안, 설득, 충고로 영향을 주는 기법입니다. 주변인에게 영향력을 행사해 환경을 변화시키는 것은 환경조정(간접적 개입)입니다. 2번이 틀렸습니다."},"22-2-34":{"x":"내적 의사소통의 명료화(ㄱ), 모델링(ㄴ), 기록과제(ㄷ), 자기지시(ㄹ)는 모두 인지행동모델의 개입방법입니다."},"22-2-35":{"x":"과제중심모델에서는 과제수행 도중에도 달성 정도를 점검하고 필요하면 조정합니다. 최종평가 시에만 결정한다는 설명이 틀렸습니다."},"22-2-36":{"x":"변화의 불가피성, 작은 변화가 큰 변화로, 모든 문제에 예외가 있고, 클라이언트가 자기 삶의 전문가라는 전제는 해결중심모델입니다."},"22-2-37":{"x":"위기개입은 단기적이며, 위기 이전의 기능 수준으로 회복하는 것을 목표로 합니다.\n\n사례의 우울은 발달적 위기가 아닌 상황적 위기이고, 장기교육이나 근본적 재조직은 위기개입이 아니며, 자살 생각이 있는 클라이언트에게는 적극 개입해야 합니다."},"22-2-38":{"x":"실용성에 관한 논박은 그 생각이 문제해결에 얼마나 도움이 되는지 묻는 방식입니다. 경험적 논박은 근거나 가능성을, 논리적 논박은 논리적 근거를 묻습니다."},"22-2-39":{"x":"비자발적으로 의뢰된 클라이언트에게는 원치 않는 의뢰 과정에서 생긴 억눌린 감정을 표현할 기회를 주는 것이 초기 접근으로 적절합니다."},"22-2-40":{"x":"사회기술훈련에는 정적 강화(ㄱ), 역할 연습(ㄴ), 과제를 통한 연습(ㄹ)이 쓰입니다. 직면(ㄷ)은 행동주의 기법이 아닙니다."},"22-2-41":{"x":"위기개입모델은 병리적 반응이나 영구적 손상의 치료보다 위기 이전의 기능 회복과 위기 대처에 초점을 둡니다. 5번이 틀렸습니다."},"22-2-42":{"x":"가족이 처한 상황을 구성원의 인식과 언어체계로 표현하며 스스로 해결 단서를 찾게 하는 것은 이야기치료·해결중심 접근의 설명으로, 체계론적 관점의 기술이 아닙니다."},"22-2-43":{"x":"생태도는 가족과 환경 체계 간의 자원과 관계를 보는 도구입니다. 회복탄력성과 문제해결능력을 확인하는 데는 적합하지 않습니다."},"22-2-44":{"x":"회유형은 자신을 무시하고 타인과 상황을 떠받듭니다.\n\n일치형은 자신, 타인, 상황을 모두 존중하고, 산만형은 자신, 타인, 상황을 모두 무시하며, 초이성형은 상황만 중시하고, 비난형은 타인을 무시하고 자신과 상황을 중시합니다."},"22-2-45":{"x":"지적 측면과 정서적 측면의 구분, 친밀하면서도 독립성을 유지하는 능력, 세대 간 전수는 보웬의 자아분화입니다."},"22-2-46":{"x":"탈삼각화는 보웬의 다세대 모델의 기법입니다. 구조적 모델은 합류, 실연, 가족지도, 경계선 만들기 등을 사용합니다."},"22-2-47":{"x":"'싸우지 않을 때는 어떠세요?'는 예외질문의 예입니다. 관계성질문은 중요한 타인의 관점에서 묻는 질문입니다. 1번이 틀렸습니다."},"22-2-48":{"x":"전략적 가족치료는 문제를 보는 시각을 바꾸고 새로운 의미를 발견하는 재명명기법을 사용합니다.\n\n구조의 재구조화와 위계 재배치는 구조적 모델이고, 증상처방과 고된 체험은 지시적으로 사용하며, 원인 제거보다 문제 유지 패턴의 변화에 초점을 둡니다."},"22-2-49":{"x":"날짜와 기본사항을 적고 개입 내용과 변화를 시간 순서로 요점만 기록하는 방식은 요약기록입니다."},"22-2-50":{"x":"기초선(A) 후 전화상담(B)과 집단활동(C)을 차례로 진행했으므로 ABC설계입니다."},"23-2-26":{"x":"실천지혜는 현장 경험을 통해 축적된 암묵적 지식입니다. 실천 활동의 원칙과 방식을 구조화한 것은 모델에 가깝습니다. 3번이 틀렸습니다."},"23-2-27":{"x":"위기 발달은 취약단계가 먼저 있고 촉발요인이 발생한 뒤 위기 상태로 진행됩니다. 4번이 순서를 거꾸로 서술했습니다."},"23-2-28":{"x":"해결중심모델은 탈이론적이고 비규범적이며 클라이언트의 견해를 존중합니다."},"23-2-29":{"x":"시험 날 미역국을 먹어서 떨어질 것이라는 생각은 마술적 사고입니다. 과잉일반화는 한두 사건으로 모든 경우를 일반화하는 것입니다."},"23-2-30":{"x":"클라이언트의 강점과 자원을 문제해결의 주요 요소로 보는 것은 해결중심모델·강점관점입니다. 인지행동모델은 사고의 오류를 교정합니다."},"23-2-31":{"x":"소거는 강화를 중단해 행동을 줄이는 것으로, 부적 처벌의 원리가 아닙니다."},"23-2-32":{"x":"클라이언트중심모델은 성장 과정을 돕고(ㄴ), 임파워먼트모델은 삶의 통제력을 높이며(ㄷ), 과제중심모델은 클라이언트가 인식한 문제와 욕구를 반영합니다(ㄹ).\n\n위기개입모델은 사건 자체보다 사건에 대한 주관적 인식과 반응을 중시합니다(ㄱ은 틀림)."},"23-2-33":{"x":"관계성 질문은 중요한 타인의 관점에서 묻는 질문입니다. 재혼한 아버지의 생각을 묻는 예가 해당합니다.\n\n2번은 척도질문, 3번은 예외질문, 4번은 대처질문, 5번은 변화에 관한 질문입니다."},"23-2-34":{"x":"다른 방법을 시도해 보자고 제안하고 설득하는 것은 심리사회모델의 직접적 영향주기입니다."},"23-2-35":{"x":"직면(ㄱ), 해석(ㄴ), 전이분석(ㄷ)에 대한 설명이 옳습니다.\n\n저항이나 전이에 대한 이해를 심화·확장하며 통합하는 것은 명료화가 아니라 훈습입니다(ㄹ은 틀림)."},"23-2-36":{"x":"면접 중 주제를 전환하거나 한 주제를 마무리할 때 사용하는 기술은 요약입니다."},"23-2-37":{"x":"가족문제의 원인은 단선적이 아니라 순환적 관점으로 파악합니다. 4번이 틀렸습니다."},"23-2-38":{"x":"아버지와 자녀의 지나친 밀착과 어머니의 소외를 다루며, 역할과 거리를 조정하는 것은 구조적 가족치료의 경계선 만들기입니다."},"23-2-39":{"x":"학대와 알코올 문제가 겹친 상황에서는 알코올 중독 문제에 먼저 관여하는 것이 우선입니다. 문제가 가족 문제를 악화시키고 있기 때문입니다."},"23-2-40":{"x":"하위체계의 경계가 희미한 경우에는 감정의 합일(밀착) 현상이 증가합니다.\n\n경직된 경계는 의사소통이 감소하고 고립되는 특성이며, 희미한 경계는 지나친 간섭이 증가하고 독립적 행동이 어렵습니다."},"23-2-41":{"x":"가족사정은 가족체계의 기능 발견(ㄱ), 상호작용 유형에 맞는 방법 탐색(ㄴ)이 목적이고, 사정과 개입은 상호작용적·순환적입니다(ㄷ). 사정은 제시 문제, 생태학적, 세대 간, 가족 내부 사정으로 이루어집니다(ㄹ)."},"23-2-42":{"x":"외현화는 이야기치료의 기법이고, 자기대상은 코헛의 개념입니다. 경험적 모델은 사티어의 자아존중감과 의사소통, 가족조각 등입니다. 3번의 연결이 틀렸습니다."},"23-2-43":{"x":"정화효과는 억눌린 감정을 표출해 얻는 효과입니다. 다양한 성원들로부터 새로운 행동을 학습하는 것은 모델링과 대리학습의 이점입니다. 3번의 연결이 맞지 않습니다."},"23-2-44":{"x":"집단 준비·계획 단계에서는 참여 자격, 공동지도자 참여 여부, 성원 모집방식과 절차, 회기별 주제를 모두 고려합니다."},"23-2-45":{"x":"델파이조사는 전문가의 의견을 모아 합의에 이르는 조사방법으로, 집단의 성과를 평가하는 방법으로 쓰지 않습니다."},"23-2-46":{"x":"사회기술훈련의 단계는 시연(ㄷ) → 역할극(ㄱ) → 평가(ㄹ) → 적응(ㄴ) 순입니다."},"23-2-47":{"x":"집단 초기에는 신뢰감을 갖고 참여할 수 있는 분위기를 조성하는 것이 중요합니다(ㄱ).\n\n구체적 피드백, 의도적 자기노출, 직면은 신뢰가 쌓인 뒤 중간단계에서 활용합니다."},"23-2-48":{"x":"인본주의이론에 근거하는 모델은 상호작용모델이나 성장집단 등이고, 사회목표모델은 민주주의와 사회변화, 시민의식 향상에 근거합니다. 3번이 해당하지 않습니다."},"23-2-49":{"x":"면담 전개 과정을 시간 순서로 상세히 기술하며, 교육·훈련·자문과 사회복지사 자신의 행동 분석에 활용되는 기록은 과정기록입니다."},"23-2-50":{"x":"두 대상이 서로 다른 시점에 개입을 시작하며 변화를 관찰하는 설계는 다중기초선설계입니다."},"24-2-26":{"x":"사회복지사에게는 인간행동과 발달(ㄱ), 인간관계와 상호작용(ㄴ), 사회복지정책과 서비스(ㄷ), 사회복지사 자신에 관한 지식(ㄹ)이 모두 필요합니다."},"24-2-27":{"x":"구조화된 개입, 개입의 책임성, 자기결정권, 환경에 대한 개입은 과제중심모델의 특성입니다."},"24-2-28":{"x":"해결중심모델은 없는 것보다 있는 것에 초점을 두는 목표를 세웁니다. 4번이 틀렸습니다. 작고 구체적이고 클라이언트에게 중요한 것을 목표로 하며, 목표를 종료보다는 시작으로 봅니다."},"24-2-29":{"x":"위기상황에 대한 초기사정은 위기개입모델의 초기단계 활동입니다. 중간단계에서는 자원과 지지체계 발굴, 과제 수행, 자료 보충, 과거 경험 탐색 등을 합니다."},"24-2-30":{"x":"유형-역동에 관한 고찰은 심리사회모델의 기법입니다. 과제중심모델의 기법이 아닙니다."},"24-2-31":{"x":"홀리스가 심리사회모델을 체계화했고(ㄱ), 간접적 개입기법으로 환경조정을 사용합니다(ㄹ).\n\n직접적 영향주기는 언제나 사용할 수 있는 기법이 아니고(ㄴ), 환기는 클라이언트의 억눌린 감정을 표출시키는 것입니다(ㄷ)."},"24-2-32":{"x":"내적 의사소통의 명료화는 클라이언트가 스스로 자신에 대해 독백하고 사고하는 과정입니다.\n\n행동시연은 실제 상황 전에 연습하는 것, 역설적 의도는 문제행동을 오히려 하게 하는 것, 이완훈련은 긴장을 푸는 것, 체계적 둔감법은 덜 위협적인 상황부터 단계적으로 제시하는 것입니다."},"24-2-33":{"x":"행동주의모델은 인간을 병리적 관점이 아니라 학습의 결과로 이해합니다. 병리적 관점에서 본다는 설명이 틀렸습니다."},"24-2-34":{"x":"정신역동모델의 개입과정은 관계형성(ㄷ) → 동일시를 위한 자아구축(ㄱ) → 독립된 자아정체감 형성 원조(ㄹ) → 자기이해 원조(ㄴ) 순입니다."},"24-2-35":{"x":"비자발적 클라이언트와 공감하려면 원치 않는 면담의 어려움을 이해하고(ㄱ), 도울 수 있음을 알려주며(ㄷ), 저항을 온화하게 수용합니다(ㄹ).\n\n사회복지사의 가치관에 맞추어 평가하는 것은 부적절합니다(ㄴ은 틀림)."},"24-2-36":{"x":"경직된 경계는 가족이 외부와 단절되고 폐쇄적인 상태입니다. 다수의 복지서비스를 이용하는 것은 경직된 경계가 아니라 투과성이 있는 경계에 가깝습니다. 2번이 틀렸습니다."},"24-2-37":{"x":"초이성형은 상황만 중시하고 자신과 타인을 무시하며 논리와 자료로 말하는 유형입니다. 연구를 인용하며 침착하게 말하는 장면이 해당합니다.\n\n나머지는 유형이 서로 뒤섞여 있습니다."},"24-2-38":{"x":"경험적 가족치료의 목표는 자아존중감 향상과 정서 경험입니다. 미분화에서 벗어나는 것은 보웬 모델의 목표입니다. 3번이 틀렸습니다."},"24-2-39":{"x":"삼각관계는 두 사람의 불안이 제3자를 끌어들이는 과정입니다. 아동이 부모와의 갈등을 피하려고 경찰에 신고하는 것은 삼각관계의 예로 보기 어렵습니다."},"24-2-40":{"x":"단독으로 생계를 유지하는 1인 가구도 가구의 범위에 속합니다. 속하지 않는다는 설명이 틀렸습니다."},"24-2-41":{"x":"대칭적·보완적 관계, 메타 의사소통, 가족이 문제행동을 유지하도록 하는 지시(증상처방)는 전략적 가족치료의 특징입니다."},"24-2-42":{"x":"사회적 목표모델은 집단을 통해 민주시민의 역량을 개발하고 사회변화를 이루는 데 초점을 둡니다.\n\n치료모델은 개인의 치료, 상호작용모델은 성원 간 상호원조와 상호작용에 초점을 둡니다."},"24-2-43":{"x":"집단 사정에는 사회복지사의 관찰, 외부 전문가 보고, 표준화된 사정도구, 성원의 자기관찰이 모두 활용됩니다."},"24-2-44":{"x":"폐쇄형 집단은 구성원이 고정되어 집단 규범이 안정적입니다.\n\n개방형은 중도 가입이 쉽고, 응집력과 역할 안정성은 폐쇄형이 높으며, 개방형이 발달단계 예측이 어렵습니다."},"24-2-45":{"x":"성원 사후관리는 종결 이후 활동입니다. 중간단계에서는 상호작용 향상, 목표 달성 원조, 응집력 향상, 적극적 참여 촉진을 합니다."},"24-2-46":{"x":"종결단계에서는 변화의 유지(ㄱ), 종결 감정 토론 격려(ㄷ), 의존성 감소(ㄹ)가 필요합니다. 개별 목표 설정(ㄴ)은 초기단계의 역할입니다."},"24-2-47":{"x":"역기능적 집단은 문제 해결 노력이 부족하고 소통이 원활하지 않습니다."},"24-2-48":{"x":"집단에서의 모방행동은 다른 사람의 바람직한 행동을 보고 배우는 것입니다. 기존 행동을 고수한다는 설명이 틀렸습니다."},"24-2-49":{"x":"클라이언트에 관한 사후지도 결과는 종결 이후의 기록이어서 개입단계 기록에 포함되지 않습니다."},"24-2-50":{"x":"개입 전 기초선, 개입, 개입 중단의 ABA설계입니다. 통제집단을 활용하지 않는 단일사례설계이므로 2번이 틀렸습니다."},"25-2-26":{"x":"실천지혜는 현장 경험을 통해 형성된 암묵적 지식입니다. 실천 활동을 조작화하고 구조화한 것이 아닙니다. 3번이 틀렸습니다."},"25-2-27":{"x":"훈습은 전이와 저항에 대한 분석과 해석을 반복해 경험적 확신을 갖게 하는 과정입니다.\n\n전이는 과거 인물에게 느낀 감정을 현재 인물에게 옮기는 것이고, 직면은 우회가 아니라 직접 알리는 것이며, 해석은 통찰을 높이고, 자유연상은 선택하지 않고 떠오르는 대로 말하는 것입니다."},"25-2-28":{"x":"자주 사용하는 행동 패턴을 인식하도록 묻는 것은 유형-역동성 고찰입니다."},"25-2-29":{"x":"면접을 잘 마쳤는데도 근거 없이 떨어질 것이라고 결론짓는 것은 임의적 추론입니다."},"25-2-30":{"x":"클라이언트중심모델의 주요 개념은 실현화 경향, 자아실현 욕구, 조건부 가치, 긍정적 관심입니다. 인지적 개입은 인지행동모델의 방법입니다."},"25-2-31":{"x":"과제중심모델은 특정 이론보다 경험적 자료를 통해 개입의 기초를 마련합니다.\n\n신념체계 변화는 인지행동, 신념이 정서와 행동에 영향을 준다는 가정도 인지행동, 무력에서 힘을 가진 상태로의 이동은 임파워먼트, 변화의 불가피성은 해결중심모델입니다."},"25-2-32":{"x":"해결중심모델은 증상 감소가 아니라 클라이언트가 원하는 변화를 목표로 합니다. 개입의 목적을 증상 감소에 둔다는 설명이 틀렸습니다."},"25-2-33":{"x":"동기강화모델의 원리는 공감 표현, 불일치감 인식, 저항과 함께하기, 자기효능감 지지입니다. 내적 의사소통 명료화는 인지행동모델의 기법입니다."},"25-2-34":{"x":"임파워먼트모델에서는 강점 사정(ㄱ), 자원 확보(ㄴ), 촉진적 개입(ㄷ)을 합니다. 합류는 구조적 가족치료의 기법입니다(ㄹ은 틀림)."},"25-2-35":{"x":"골란의 위기발달 단계는 위험사건 → 취약단계 → 촉발요인 → 위기단계 → 재통합입니다."},"25-2-36":{"x":"환류하기는 욕구를 재확인하고 서비스 계획이나 개입전략을 수정하는 과정입니다.\n\n개입 중 점검은 모니터링, 목표 달성도 측정은 평가, 자원 동원은 연계, 주변체계에 문제를 알리고 옹호하는 것은 옹호 활동입니다."},"25-2-37":{"x":"전략적 가족치료는 문제의 원인을 찾기보다 문제를 유지시키는 상호작용 패턴을 바꾸는 데 초점을 둡니다. 원인을 찾도록 돕는다는 설명이 틀렸습니다."},"25-2-38":{"x":"미누친의 구조적 가족치료의 대표 기법은 합류하기, 균형 깨뜨리기, 실연입니다.\n\n가족그림, 탈삼각화, 과제부여, 역설적 지시, 순환적 질문은 다른 모델의 기법입니다."},"25-2-39":{"x":"갈등을 일으키는 행동을 오히려 정해진 시간에 하도록 지시하는 것은 역설적 지시(증상처방)입니다."},"25-2-40":{"x":"자아분화 수준이 낮은 성원이 가족투사의 대상이 되고(ㄱ), 가계도로 정서적 과정을 이해하며(ㄴ), 치료자는 삼각관계에 휘말리지 않도록 중립적으로 개입합니다(ㄷ).\n\n자아분화 수준이 낮으면 자율성이 줄고 정서 반응에 지배됩니다(ㄹ은 틀림)."},"25-2-41":{"x":"문제의 외현화는 이야기치료의 기법입니다. 경험적 가족치료는 자아존중감 향상, 일치형 의사소통, 개인의 성장에 초점을 둡니다. 5번이 틀렸습니다."},"25-2-42":{"x":"가족규칙은 허용되는 행동을 결정해 가족의 항상성을 공고히 합니다.\n\n부적 환류는 일탈을 줄여 안정을 유지하고, 가족은 상위체계의 영향을 받으며, 경직된 경계는 지나친 분리를, 밀착은 독립성 결여를 뜻합니다. 부모 하위체계가 권위를 갖는 것은 구조적 가족치료의 관점이지만 이 문항의 정답은 1번입니다."},"25-2-43":{"x":"기능적인 가족은 가족규칙을 융통성 있게 적용하고(ㄱ), 밀착된 가족은 경계가 지나치게 투과적이라 체계 간 구분이 어렵습니다(ㄷ).\n\n밀착된 관계는 균형이 아니라 분화의 어려움을 낳고(ㄴ), 기능적 가족은 역할을 융통성 있게 조정합니다(ㄹ)."},"25-2-44":{"x":"개방형 집단은 구성원이 계속 바뀌어서 집단문화가 천천히 형성됩니다. 빠르게 형성된다는 설명이 틀렸습니다."},"25-2-45":{"x":"자조집단은 동병상련의 경험에 기반합니다(ㄱ).\n\n사회복지사의 역할은 변화매개인이 아니라 지지와 자문이고, 공동지도자를 두지 않으며, 노아방주의 원칙은 이질적 구성을 하는 집단에 쓰는 개념입니다."},"25-2-46":{"x":"집단의 치료적 효과에는 정보 습득, 보편성, 이타심, 정화가 모두 포함됩니다."},"25-2-47":{"x":"상호작용차트는 성원의 집단참여 수준과 상호작용 빈도를 분석하는 도구입니다.\n\n소시오메트리와 소시오그램은 성원 간 선호와 관계, 사회적 관계망표는 지지체계, 의의차별척도는 대상에 대한 태도를 평가합니다."},"25-2-48":{"x":"종결단계에서는 학습한 내용의 활용 계획을 세우고(ㄴ), 측정도구로 성원 개인별 변화를 평가합니다(ㄹ).\n\n자기노출 기회와 공통 관심사를 찾는 토론은 초기·중간 단계의 활동입니다."},"25-2-49":{"x":"단일사례설계도 여러 표적행동을 동시에 측정할 수 있습니다. 불가능하다는 설명이 틀렸습니다."},"25-2-50":{"x":"서비스 신청에 필요한 정보는 민감하더라도 필요한 범위에서 기록해야 합니다. 무조건 제외한다는 설명이 틀렸습니다."},"26-2-26":{"x":"문제분석, 개입계획, 개입방법 등 구체적 방법을 제시하는 실천지식은 모델입니다."},"26-2-27":{"x":"직면은 불일치를 알려주어 자기성찰을 돕는 기법이지, 즉각적인 행동 변화가 일어난다고 볼 수는 없습니다. 1번이 틀렸습니다."},"26-2-28":{"x":"꿈분석은 꿈에 나타난 무의식의 미해결 과제를 분석해 통찰을 얻게 하는 기술입니다.\n\n자유연상은 떠오르는 대로 말하게 하는 것이고, 훈습은 반복해서 이해를 깊게 하는 것이며, 해석은 의미를 설명해 통찰을 돕는 것입니다."},"26-2-29":{"x":"위기 상황에서 사건을 객관적으로 이해하도록 돕고(ㄴ), 새로운 사회적 지지와 활동 참여를 지지하는(ㄹ) 것은 개입단계의 과제입니다.\n\n자살 생각 확인(ㄱ)과 가족자원 파악(ㄷ)은 사정단계의 과제입니다."},"26-2-30":{"x":"상담 전 변화에 관한 질문은 상담 예약 이후 생긴 변화를 묻는 해결중심 질문입니다.\n\n1번은 기적질문, 2번은 척도질문, 3번은 예외질문, 5번은 척도질문의 예입니다."},"26-2-31":{"x":"과제이행을 위한 계획은 과제중심모델의 중기(실행)단계 과업입니다. 초기에는 표적문제 탐색과 우선순위, 계약, 초기 과제 결정을 합니다."},"26-2-32":{"x":"모델링은 다른 사람의 행동을 관찰하며 학습하게 하는 기법입니다.\n\n경험적 학습은 직접 경험으로 인지 불일치를 활용하고, 체계적 둔감화는 불안 반응을 단계적으로 줄이며, 인지재구조화는 왜곡된 사고를 바꾸는 기법입니다."},"26-2-33":{"x":"인지행동모델은 단기적이고 시간제한적인 개입을 합니다. 시간을 제한하지 않는다는 설명이 틀렸습니다."},"26-2-34":{"x":"탐색-기술-환기는 클라이언트의 감정을 표출하게 하는 기법입니다. 사회복지사의 감정을 표출하는 것이 아닙니다."},"26-2-35":{"x":"과제중심모델은 클라이언트가 해결하려는 문제를 중시하고(ㄱ), 임파워먼트모델은 잠재력 발휘와 자원연계를 강조하며(ㄷ), 위기개입모델은 단기 집중 개입입니다(ㄹ).\n\n클라이언트중심모델은 과거보다 현재 경험을 다룹니다(ㄴ은 틀림)."},"26-2-36":{"x":"틀린 연결은 ㄱ, ㄴ, ㄷ입니다. 전략적 모델의 목표는 문제 유지 순환의 변화, 다세대 모델의 기법은 탈삼각화와 가계도, 경험적 모델은 성장과 자아존중감 향상이 목표입니다.\n\n구조적 모델의 구조 재구성과 합류(ㄹ)는 옳습니다."},"26-2-37":{"x":"가족의 기존 의사소통과 행동양식을 따라가며 권장하는 구조적 가족치료 기법은 추적입니다."},"26-2-38":{"x":"삼각관계에 포함된 자녀는 부모의 긴장을 완화하려다 자아분화 수준이 낮아집니다. 높아진다는 설명이 틀렸습니다."},"26-2-39":{"x":"TV에 나온 의사의 말을 인용하며 논리적으로 훈계하는 아빠는 초이성형입니다."},"26-2-40":{"x":"구조적 모델의 사정도구는 가족지도입니다. 생태도는 환경과의 관계를 보는 일반적인 도구여서, 구조적 모델과의 연결이 맞지 않습니다."},"26-2-41":{"x":"일반체계이론, 가족생태학, 의사소통이론, 사회구성주의는 모두 가족개입 모델에 영향을 준 이론입니다."},"26-2-42":{"x":"밀란모델의 긍정적 의미부여는 가족응집력을 높이고 치료에 대한 저항을 줄입니다.\n\n가장기법은 사티어의 과정이 아니고 전략적 기법이 아니며, 예외질문은 해결중심의 질문이고, 지시적 기법은 저항을 활용하며, 변화가 빠르다고 지지하는 것은 제지입니다."},"26-2-43":{"x":"집단 내 의사소통은 초기에는 사회복지사 중심이지만, 개입(중간)단계부터는 성원 간 직접 의사소통으로 발전하는 것이 바람직합니다. 5번이 반대로 서술했습니다."},"26-2-44":{"x":"재강화, 조건화, 직접적 과정으로 증상 완화를 목표로 하는 집단은 행동적 집단입니다."},"26-2-45":{"x":"자기노출 수준은 집단발달단계에 따라 적절히 조절해야 합니다. 무관하다는 설명이 틀렸습니다."},"26-2-46":{"x":"집단목표는 토론으로 수정할 수 있고(ㄱ), 개인목표와 양립해야 하며(ㄴ), 구체적·측정가능·현실적·시간제한적이어야 하고(ㄷ), 표현되지 않은 욕구도 고려합니다(ㄹ)."},"26-2-47":{"x":"초기단계에서는 불안감을 줄이고(ㄴ), 중간단계에서는 성원 간 공통점과 차이점을 파악합니다(ㄷ).\n\n소시오메트리 작성은 사정 도구로 집단 진행 중에 활용하고(ㄱ), 집단리더에 대한 저항은 초기·중간의 현상입니다(ㄹ)."},"26-2-48":{"x":"폐쇄집단은 역할과 규범이 안정적이고(ㄴ), 이질적인 성원은 집단의 자산이 될 수 있습니다(ㄹ).\n\n집단응집력은 폐쇄집단이 더 강하고(ㄱ은 틀림), 아동집단의 규모는 성인집단보다 작은 것이 좋습니다(ㄷ은 틀림)."},"26-2-49":{"x":"문제중심기록은 주관적 정보, 객관적 정보, 사정(견해와 해석), 계획으로 구성됩니다. 문제해결에 활용 가능한 자원 정보가 별도 항목은 아닙니다."},"26-2-50":{"x":"단일사례설계의 가장 기본적인 유형은 AB설계입니다. ABAB설계가 가장 기본이라는 설명이 틀렸습니다."}},"data/groups.json":{"hb|생애주기별 발달(태아~노년기)":[["인간발달의 개념·원리",["26-1-1","25-1-2","24-1-2","23-1-1","22-1-1","22-1-2","22-1-3","21-1-2","20-1-1","20-1-2","19-1-3","18-1-1","17-1-3","17-1-25"]],["인간발달이론·인간행동과 사회복지실천",["26-1-2","25-1-1","25-1-3","24-1-1","23-1-3","21-1-1","19-1-1","19-1-2","17-1-1"]],["태내기·태아기",["26-1-18","24-1-22","22-1-18","21-1-16","20-1-18","19-1-17","18-1-22","17-1-17","17-1-22"]],["신생아기·영아기(반사·애착)",["26-1-19","26-1-20","25-1-18","24-1-17","23-1-9","23-1-21","21-1-17","20-1-19","19-1-18","18-1-21","18-1-23"]],["유아기(3~6세)",["26-1-21","25-1-19","24-1-19","23-1-11","22-1-19","21-1-18","20-1-21","19-1-19","17-1-23"]],["아동기(7~12세)",["25-1-20","24-1-24","23-1-23","21-1-19","20-1-20","19-1-20"]],["청소년기(13~19세)",["25-1-21","24-1-18","23-1-22","21-1-20","20-1-22","19-1-21","18-1-14"]],["청년기",["26-1-23","25-1-22","24-1-20","22-1-22","21-1-21","19-1-22"]],["중년기",["25-1-23","24-1-23","23-1-10","22-1-23","21-1-22","20-1-24","19-1-23","18-1-24"]],["노년기",["26-1-24","25-1-24","23-1-20","21-1-23","20-1-23"]],["죽음과 상실(퀴블러 로스)",["21-1-15","19-1-24","17-1-24"]],["생애주기별 발달과업·특징 종합",["26-1-25","25-1-25","24-1-21","23-1-24","22-1-25","21-1-25","19-1-25","18-1
