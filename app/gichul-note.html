다.","공감과 지지를 얻기 위해 동질성이 높은 성원으로 구성한다."],"a":4},{"id":"20-2-32","y":2020,"g":2,"n":32,"t":"면접·의사소통·사정·기록","f":"사례·제시문 판단","s":["다음 사례에 해당하는 단일사례설계의 유형은?","노인복지관 사회복지사가 어르신들의 우울감 개선 프로그램을 계획하였다. 프로그램 시작전에 참여하는 어르신들의 심리검사를 행하였고, 2주간의 정서지원프로그램 실시 후 변화를 측정하였다. 1주일 후에는 같은 어르신들을 대상으로 2주간의 명상프로그램을 진행하며 우울감을 개선하고자 하였다."],"c":["AB","BAB","ABA","ABAB","ABAC"],"a":5},{"id":"20-2-33","y":2020,"g":2,"n":33,"t":"가족 대상 실천(가족치료모델)","f":"옳은 것 고르기","s":["가정폭력 피해경험이 있는 사회복지사가 자기노출을 고려하는 목적으로 옳은 것은?"],"c":["역전이를 활용하기 위해","클라이언트의 표현을 촉진하기 위해","자신과 비슷한 경험인지 알아보기 위해","클라이언트의 자기합리화를 돕기 위해","사회복지사가 자신의 문제를 극복했는지 확인하기 위해"],"a":2},{"id":"20-2-34","y":2020,"g":2,"n":34,"t":"면접·의사소통·사정·기록","f":"옳지 않은 것","s":["초기면접을 위한 준비로 적절하지 않은 것은?"],"c":["면접 목적을 잠정적으로 설정한다.","모든 질문을 사전에 확정해 놓는다.","슈퍼바이저나 동료에게 미리 조언을 구한다.","클라이언트 특성을 고려하여 시설환경에 대한 준비를 한다.","의뢰서에 있는 클라이언트의 문제와 관련한 전문 지식을보완한다."],"a":2},{"id":"20-2-35","y":2020,"g":2,"n":35,"t":"가족 대상 실천(가족치료모델)","f":"옳은 것 모두 고르기","s":["1인 가구의 가족사정에 관한 내용으로 옳은 것을 모두 고른 것은?","ㄱ. 원가족 생활주기 파악","ㄴ. 원가족 스트레스와 레질리언스 탐색","ㄷ. 구조적 관점으로 미분화된 경계 파악","ㄹ. 역사적 관점으로 미해결된 과거관계의 잔재 확인"],"c":["ㄹ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"20-2-36","y":2020,"g":2,"n":36,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"사례·제시문 판단","s":["다음 사례에서 사회복지사의 개입방법에 관한 설명으로 옳은 것은?","가정폭력으로 이혼한 영미씨의 전 남편은 딸의 안전을 확인해야 양육비를 주겠다며 딸의 휴대폰 번호도 못 바꾸게 하였다. 영미씨는 아버지의 언어폭력으로 인한 고통을 호소하는 딸에게 전화를 계속하며 받도록 하였다. 사회복지사는 이에 대한 사정평가 후, 경제적 어려움에 대한 불안감이 가정폭력을 사실상 지속시킨다고 판단하여 양육비이행지원서비스를 받을 수 있도록 지원하고 아버지의 전화를 차단하도록 하였다."],"c":["가족 옹호","가족 재구성","재정의하기","탈삼각화기법","균형 깨트리기"],"a":1},{"id":"20-2-37","y":2020,"g":2,"n":37,"t":"가족 대상 실천(가족치료모델)","f":"옳은 것 모두 고르기","s":["가족의 특성에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 사회변화에 민감한 체계이다.","ㄴ. 현대 가족은 점차 정서적 기능이 약화되고 있다.","ㄷ. 가족의 현재 모습은 세대 간 전승된 통합과 조정의 결과물이다.","ㄹ. 기능적인 가족은 응집성과 적응성, 문제해결력이 높은 가족이다."],"c":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"20-2-38","y":2020,"g":2,"n":38,"t":"가족 대상 실천(가족치료모델)","f":"사례·제시문 판단","s":["다음 사례에서 사회복지사가 우선적으로 계획할 내용으로 적절한 것은?","은옥씨는 심각한 호흡기 질환을 앓고 있으며, 28세 아들은 고교 졸업 후 게임에만 몰두하며 집에만 있다. 아들은 쓰레기를 건드리지도 못하게 하며 집은 쓰레기로 넘쳐나고, 이는 은옥씨의 건강에 치명적인 위협이 되고 있다. 은옥씨는 과거 자신의 잘못과 아들에 대한 죄책감을 호소하고 있으나, 서비스를 거부하며 특히 아들에 대한 접근을 막고 있다."],"c":["치료적 삼각관계 형성하기","가족하위체계 간의 경계 만들기","가족의 기능적 분화수준 향상시키기","가족과 합류(joining)할 수 있는 방법 탐색하기","역설적 개입으로 치료자의 지시에 저항하도록 하기"],"a":4},{"id":"20-2-39","y":2020,"g":2,"n":39,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["노인학대가 의심된다는 이웃의 신고로 노인보호전문기관에서 상황을 파악하고자 하였다. 어르신은 사회복지사의 개입을 거부하며 방어적이다. 이 상황에 관한 분석으로 적절하지 않은 것은?"],"c":["비난형 의사소통 유형이다.","스스로 해결하고자 하는 의지의 표명이다.","현재의 상태를 유지하려고 하는 항상성이 있다.","독립과 자립을 강조하는 사회문화적 영향으로 도움에 거부적이다.","일방적 신고를 당해서 외부인에 대한 불신과 배신감을느끼고 있다."],"a":1},{"id":"20-2-40","y":2020,"g":2,"n":40,"t":"가족 대상 실천(가족치료모델)","f":"옳은 것 모두 고르기","s":["가계도 분석에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 세대를 통해 반복되는 패턴 분석","ㄴ. 가족구성원에 대한 객관적 정보 파악","ㄷ. 가족기능의 불균형과 그것에 기여하는 요인 분석","ㄹ. 가족구성원별 인생의 중요사건과 이에 대한 다른 가족구성원의 역할 분석"],"c":["ㄹ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"20-2-41","y":2020,"g":2,"n":41,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["알코올 중독자 당사자는 치료에 거부적이다. 우선적으로 동기화되어 있는 가족들을 알코올 중독자 가족모임이나 자녀모임에 참여하도록 하였다. 이 때 사회복지사가 개입 시 고려한 내용으로 옳은 것은?"],"c":["가족항상성","가족모델링","가족재구조화","다세대간 연합","순환적 인과성"],"a":5},{"id":"20-2-42","y":2020,"g":2,"n":42,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["클라이언트를 문제중심으로 보지 않고, 필요한 자원을 활용하거나 문제에 대처할 수 있도록 지지하여 자립을 가능하게 하는 실천모델은?"],"c":["과제중심모델","심리사회모델","역량강화모델","위기개입모델","인지행동모델"],"a":3},{"id":"20-2-43","y":2020,"g":2,"n":43,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["심리사회모델의 기법에 관한 설명으로 옳지 않은 것은?"],"c":["발달적 성찰 : 현재 클라이언트 성격이나 기능에 영향을미친 가족의 기원이나 초기 경험을 탐색한다.","지지하기 : 클라이언트의 현재 또는 최근 사건을 고찰하게 하여 현실적인 해결방법을 찾는다.","탐색-기술-환기 : 클라이언트의 상황에 관한 사실을 드러내고 감정의 표현을 통해 감정의 전환을 제공한다.","수용 : 온정과 친절한 태도로 클라이언트의 감정이나 주관적인 상태에 감정이입을 하며 공감한다.","직접적 영향 : 사회복지사와 클라이언트 간의 신뢰관계를 바탕으로 클라이언트에게 제안과 설득을 제공한다."],"a":2},{"id":"20-2-44","y":2020,"g":2,"n":44,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["인지적 왜곡이나 오류의 유형에 관한 설명으로 옳은 것은?"],"c":["과잉일반화는 정반대의 증거나 증거가 없음에도 불구하고 어떤 결론을 내리는 것이다.","임의적 추론은 상반된 사고의 경향성을 보이는 것이다.","개인화는 하나 또는 별개의 사건들을 가지고 결론을 내린 후 비논리적으로 확장하는 것이다.","선택적 사고는 상황에 대한 자신의 관점을 지지하기 위해 특정 자료들을 걸러내거나 무시하는 것이다.","과장과 축소는 하나의 사건 혹은 별개의 사건들의 결론을 주관적으로 내리는 것이다."],"a":4},{"id":"20-2-45","y":2020,"g":2,"n":45,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["해결중심모델에 관한 설명으로 옳은 것은?"],"c":["클라이언트의 문제의 원인을 심리내부에서 찾는다.","의료모델을 기초로 문제 중심의 접근을 지향한다.","다양한 질문기법들을 활용하여 클라이언트와 대화한다.","클라이언트의 준거들, 인식, 강점보다 문제 자체에 초점을 둔다.","신속한 문제해결을 위해 행동변화를 위한 새로운 전략을가르친다."],"a":3},{"id":"20-2-46","y":2020,"g":2,"n":46,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["청소년의 정체성 위기, 결혼, 자녀의 출산, 중년기의 직업 변화, 은퇴 등 개인의 생애주기에 따른 위기는?"],"c":["실존적 위기","상황적 위기","발달적 위기","부정적 위기","환경적 위기"],"a":3},{"id":"20-2-47","y":2020,"g":2,"n":47,"t":"면접·의사소통·사정·기록","f":"옳지 않은 것","s":["문제중심기록의 특성으로 옳지 않은 것은?"],"c":["현상의 복잡성을 단순화시키고 부분화를 강조하는 단점이 있다.","문제유형의 파악이 용이하며 책무성이 명확해진다.","클라이언트의 주관적 진술과 사회복지사의 관찰과 같은객관적 자료를 구분한다.","클라이언트의 문제 상황을 진단하고 개입계획을 제외한문제의 목록을 작성한다.","슈퍼바이저, 조사연구자, 외부자문가 등이 함께 검토하는데 용이하다."],"a":4},{"id":"20-2-48","y":2020,"g":2,"n":48,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["정신역동모델에 관한 설명으로 옳은 것은?"],"c":["통찰보다는 치료적 처방에 초점을 둔다.","무의식적 충동과 미래 의지를 강조한다.","사회구성주의적 관점의 영향을 받았다.","기능주의 학파의 이론적 기초가 되었다.","자유연상, 훈습, 직면의 기술을 사용한다."],"a":5},{"id":"20-2-49","y":2020,"g":2,"n":49,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"사례·제시문 판단","s":["다음 사례에 적용한 실천모델은?","성폭력 피해 대학생 A씨는 심적 고통을 받고 있으며 서비스 제공자와의 만남도 거부하고 있다. 이에 사회복지사는 A씨가 절망감에 극단적인 선택을 할 가능성이 높다고 생각하며 안전 확보를 위한 지지체계를 구성하였다."],"c":["과제중심모델","심리사회모델","해결중심모델","위기개입모델","역량강화모델"],"a":4},{"id":"20-2-50","y":2020,"g":2,"n":50,"t":"집단 대상 실천(집단사회사업)","f":"옳지 않은 것","s":["집단을 대상으로 한 실천의 내용으로 옳지 않은 것은?"],"c":["성원간의 갈등이 심하여 조기종결을 하였다.","집단과정을 촉진하기 위해 공동지도자를 두었다.","적정규모를 유지하기 위해 신규 회원을 받았다.","집단규칙은 사회복지사가 제공하였다.","개별성원의 의도적인 집단 경험을 유도하였다."],"a":4},{"id":"21-2-26","y":2021,"g":2,"n":26,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"사례·제시문 판단","s":["다음에서 설명하는 집단의 치료적 효과는?","집단 내 상호작용 과정에서 그동안 해결되지 않은 원가족과의 갈등에 대해 탐색하고 행동패턴을 수정할 기회를 갖게 된다."],"c":["정화","일반화","희망증진","이타성 향상","재경험의 기회 제공"],"a":5},{"id":"21-2-27","y":2021,"g":2,"n":27,"t":"면접·의사소통·사정·기록","f":"옳지 않은 것","s":["사회복지실천기술의 전문적 기반에 관한 설명으로 옳지 않은 것은?"],"c":["이론과 실천의 준거틀을 적절하게 이용하는 것은 예술적기반에 해당된다.","연구자료를 수집하고 분석하는 것은 과학적 기반에 해당된다.","사회복지 전문가로서 가지는 가치관은 예술적 기반에 해당된다.","감정이입적 의사소통, 진실성, 융통성은 예술적 기반에해당된다.","사회복지사에게는 과학성과 예술성의 상호보완적이고 통합적인 실천역량이 요구된다."],"a":1},{"id":"21-2-28","y":2021,"g":2,"n":28,"t":"집단 대상 실천(집단사회사업)","f":"옳지 않은 것","s":["집단유형별 특성에 관한 설명으로 옳지 않은 것은?"],"c":["지지집단은 유사한 문제와 욕구를 가진 사람들로 구성하여 유대가 빨리 형성된다.","성장집단은 집단 참여자의 자기인식을 증가시켜 개인의잠재력을 최대화하는 데 초점을 둔다.","치료집단은 성원의 병리적 행동과 외상 후 상실된 기능을 회복하는 데 초점을 둔다.","교육집단은 지도자가 집단 성원의 문제와 욕구를 해결하기 위해 필요한 기술과 정보를 제공한다.","자조집단에서는 전문가가 의도적으로 집단을 구성하여정서적 지지와 문제 해결을 지원한다."],"a":5},{"id":"21-2-29","y":2021,"g":2,"n":29,"t":"집단 대상 실천(집단사회사업)","f":"옳지 않은 것","s":["집단역동에 관한 설명으로 옳지 않은 것은?"],"c":["하위집단은 집단에 부정적인 영향을 미치기 때문에 사회복지사가 개입하여 만들어지지 않도록 한다.","집단성원 간 직접적 의사소통을 격려하여 집단역동을 발달시킨다.","집단응집력이 강할 경우, 집단성원들 사이에 상호 의존하려는 경향이 강해진다.","개별성원의 목적과 집단 전체의 목적의 일치 여부에 따라 집단역동은 달라진다.","긴장과 갈등을 적절하고 건설적인 방법으로 해결할 때집단은 더욱 성장할 수 있다."],"a":1},{"id":"21-2-30","y":2021,"g":2,"n":30,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 모두 고르기","s":["역량강화모델(empowerment model)에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 클라이언트를 자신 문제의 전문가로 인정한다.","ㄴ. 사회복지사와 클라이언트 간의 상호 협력적 파트너십을 강조한다.","ㄷ. 클라이언트를 개입의 객체가 아닌 주체로 보기 때문에 자기결정권이 잘 보호될 수 있다.","ㄹ. 클라이언트가 가진 문제의 원인에 초점을 두고 개입한다."],"c":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":3},{"id":"21-2-31","y":2021,"g":2,"n":31,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"사례·제시문 판단","s":["다음 예시에서 사회복지사가 활용한 실천기술은?","- 클라이언트: \"저는 정말 나쁜 엄마예요. 저는 피곤하기도 하지만 성질이 나빠서 항상 아이들한테 소리를 지르고......\"","- 사회복지사: \"선생님이 자녀에게 어떻게 하는지를 저에게 이야기할 수 있다는 사실은 자녀들과 더 좋은 관계를 가지고 싶다는 뜻이지요.\""],"c":["명료화하기","초점화하기","재명명하기","재보증하기","해석하기"],"a":3},{"id":"21-2-32","y":2021,"g":2,"n":32,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["과제중심모델에 관한 설명으로 옳지 않은 것은?"],"c":["개입 초기에 빠른 사정을 한다.","구조화된 접근을 한다.","다양한 이론과 모델을 절충적으로 활용한다.","조사에 근거한 경험적 자료를 중심으로 진행한다.","사회복지사는 적극적으로 개입하지 않고 클라이언트가주체적인 역할을 하도록 한다."],"a":5},{"id":"21-2-33","y":2021,"g":2,"n":33,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 모두 고르기","s":["단기개입을 특징으로 하는 사회복지실천모델을 모두 고른 것은?","ㄱ. 과제중심모델　　　　ㄴ. 위기개입모델","ㄷ. 해결중심모델　　　　ㄹ. 정신역동모델"],"c":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"21-2-34","y":2021,"g":2,"n":34,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["해결중심모델에 관한 설명으로 옳지 않은 것은?"],"c":["사회복지사는 클라이언트를 변화시키는 전문가가 아니라변화에 도움을 주는 자문가 역할을 한다.","문제의 원인과 발전과정에 관심을 두기보다 문제해결 방안을 모색하는 것이 더 효과적이라고 본다.","모든 사람은 강점과 자원, 능력을 가지고 있다고 가정한다.","클라이언트의 견해를 존중한다.","클라이언트의 과거에 관해 깊이 탐색하여 현재와 미래에적응하도록 돕는데 관심을 둔다."],"a":5},{"id":"21-2-35","y":2021,"g":2,"n":35,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["위기개입모델의 개입 원칙에 관한 설명으로 옳은 것은?"],"c":["장기적인 개입방법을 사용한다.","개입목표는 가능한 한 포괄적으로 설정한다.","사회복지사는 비지시적인 역할을 수행한다.","위기 이전의 기능수준으로 회복하도록 돕는다.","문제의 원인에 대한 이해를 위해 클라이언트의 과거 탐색에 초점을 둔다."],"a":4},{"id":"21-2-36","y":2021,"g":2,"n":36,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 모두 고르기","s":["정신역동모델의 개념과 개입기법에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 전이는 정신역동 치료에 방해가 되므로 이를 이용해서는 안 된다.","ㄴ. 무의식적 갈등이나 불안을 표현하도록 하며 자신의 문제에 대해 이해하고 통찰할 수 있도록 한다.","ㄷ. 클라이언트와 라포가 형성되기 전에 해석을 제공하는 것이 관계형성에 도움이 된다.","ㄹ. 훈습을 통해 클라이언트의 불안은 최소화되고 적합한 방법으로 자신의 문제를 이해할 수 있는 능력을 기르게 된다."],"c":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":2},{"id":"21-2-37","y":2021,"g":2,"n":37,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["해결중심모델에서 사용하는 질문 기법과 이에 관한 예로 옳은 것은?"],"c":["예외질문: 그 어려운 상황 속에서도 견딜 수 있었던 것은 무엇이라 생각합니까?","관계성 질문: 남편이 여기 있다면 당신이 어떻게 하는것이 문제 해결에 도움이 된다고 할까요?","기적질문: 잠이 안 와서 힘들다고 하셨는데, 잠을 잘 잤다고 느낄 때는 언제인가요?","대처질문: 지난 1주일간 어떤 변화가 있었나요?","척도질문: 문제가 발생하지 않았던 때는 언제인가요?"],"a":2},{"id":"21-2-38","y":2021,"g":2,"n":38,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["인지행동모델에 관한 설명으로 옳지 않은 것은?"],"c":["구조화된 접근을 한다.","클라이언트의 무의식적 행동에 관심을 둔다.","교육적 접근을 강조한다.","클라이언트의 주관적인 경험, 문제 및 관련 상황에 대한인식을 중시한다.","클라이언트와 사회복지사의 협조적인 노력을 중시하고,클라이언트의 능동적인 참여를 권장한다."],"a":2},{"id":"21-2-39","y":2021,"g":2,"n":39,"t":"가족 대상 실천(가족치료모델)","f":"옳은 것 고르기","s":["아무리해도 말이 안 통한다고 하는 부부에게 “여기서 직접 한 번 서로 말씀해 보도록 하겠습니까?” 라고 하는 것은 어떤 기법을 활용한 것인가?"],"c":["실연","추적하기","빙산치료","치료 삼각관계","경계선 만들기"],"a":1},{"id":"21-2-40","y":2021,"g":2,"n":40,"t":"면접·의사소통·사정·기록","f":"옳은 것 고르기","s":["어느 시점에서의 인간관계, 타인에 대한 느낌과 감정을 동작과 공간을 사용하여 표현하는 비언어적 기법은?"],"c":["연합","은유","외현화","가족조각","원가족 도표"],"a":4},{"id":"21-2-41","y":2021,"g":2,"n":41,"t":"집단 대상 실천(집단사회사업)","f":"옳은 것 모두 고르기","s":["집단 초기단계에 나타나는 특성으로 옳은 것을 모두 고른 것은?","ㄱ. 집단성원의 불안감과 저항이 높다.","ㄴ. 집단에 대한 오리엔테이션이 필요하다.","ㄷ. 사회복지사보다는 다른 집단성원과 대화하려고 시도한다.","ㄹ. 문제해결과정에서 나타나는 갈등과 차이점을 적극적으로 표현한다."],"c":["ㄹ","ㄱ, ㄴ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ"],"a":2},{"id":"21-2-42","y":2021,"g":2,"n":42,"t":"집단 대상 실천(집단사회사업)","f":"옳지 않은 것","s":["집단응집력을 향상하는 요인이 아닌 것은?"],"c":["이질적 집단으로 구성","집단에 대한 자부심 고취","집단성원간의 다른 인식과 관점의 인정","집단성원간 공개적이고 활발한 상호작용","집단의 참여를 통해 얻게 되는 보상, 자원 제공"],"a":1},{"id":"21-2-43","y":2021,"g":2,"n":43,"t":"면접·의사소통·사정·기록","f":"옳은 것 모두 고르기","s":["기록의 목적과 용도에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 사회복지사의 전문적 활동을 입증하는 자료로 활용한다.","ㄴ. 기관 내에서만 활용하고 다른 전문직과는 공유하지 않는다.","ㄷ. 기관의 프로그램 수행 자료로 보고하며 기금을 조성하는 근거로 활용한다.","ㄹ. 클라이언트와 정보를 공유하고 의사소통하는 도구로 활용한다."],"c":["ㄷ","ㄱ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"21-2-44","y":2021,"g":2,"n":44,"t":"가족 대상 실천(가족치료모델)","f":"옳은 것 모두 고르기","s":["가계도를 통한 분석 내용으로 옳은 것을 모두 고른 것은?","ㄱ. 가족 내 삼각관계","ㄴ. 지배적인 주제와 가족구조의 변화","ㄷ. 가족이 위치한 지역사회의 안정성과 쾌적성","ㄹ. 가족 내 반복적으로 나타나고 있는 사건의 연결성"],"c":["ㄴ","ㄱ, ㄴ","ㄱ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"21-2-45","y":2021,"g":2,"n":45,"t":"가족 대상 실천(가족치료모델)","f":"옳은 것 모두 고르기","s":["가족대상 사회복지실천의 과정에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 가족과 함께 문제의 우선순위를 설정한다.","ㄴ. 사회복지사는 한 단계 낮은 자세를 취하며 가족의 정보를 얻는다.","ㄷ. 가족과의 관계형성을 위해 가족이 있는 곳으로 합류할 필요가 있다.","ㄹ. 문제가 가족 모두에게 영향을 미치고 있고 가족구성원이 그 문제의 발생과 유지에 영향을 주고 있을 경우 가족단위의 개입을 고려한다."],"c":["ㄹ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"21-2-46","y":2021,"g":2,"n":46,"t":"가족 대상 실천(가족치료모델)","f":"옳은 것 고르기","s":["가족의 문제가 개선될 때 체계의 항상성 균형이 위험하다고 판단되어 사용하는 전략으로, 변화의 속도가 빠르다고 지적하며 조금 천천히 변화하라고 하는 기법은?"],"c":["시련","제지","재정의","재구조화","가족옹호"],"a":2},{"id":"21-2-47","y":2021,"g":2,"n":47,"t":"집단 대상 실천(집단사회사업)","f":"옳지 않은 것","s":["집단구성에 관한 설명으로 옳지 않은 것은?"],"c":["집단이 커질수록 구성원의 참여의식이 증가하고 통제와개입이 쉽다.","집단상담을 위해 가능하면 원형으로 서로 잘 볼 수 있는공간을 만들 수 있는 장소가 바람직하다.","집단성원의 유사함은 집단소속감을 증가시킨다.","개방집단은 새로운 정보와 자원의 유입을 허용한다.","비구조화된 집단에서는 집단성원의 자발성이 더욱 요구된다."],"a":1},{"id":"21-2-48","y":2021,"g":2,"n":48,"t":"가족 대상 실천(가족치료모델)","f":"옳은 것 고르기","s":["가족대상 사회복지실천에 관한 설명으로 옳은 것은?"],"c":["누가 가족문제를 일으키는 원인제공자인지 확인하기 위해 순환적 인과관계를 적용한다.","동귀결성을 적용하여 어떤 결과에 어떤 하나의 원인이작용하였는지를 밝힌다.","가족은 사회환경의 하위체계이나 그 내부는 하위체계가없는 체계다.","가족체계는 성장과 발전을 추구하면서도 지나친 변화는제어하며 일정한 안정성을 유지하고자 한다.","일차적 사이버네틱스에서 가족은 스스로 창조하고 독립된 실제이며 사회복지사를 가족과 완전히 분리된 사람으로 보지 않는다."],"a":4},{"id":"21-2-49","y":2021,"g":2,"n":49,"t":"집단 대상 실천(집단사회사업)","f":"옳은 것 모두 고르기","s":["집단과정을 촉진하기 위한 직면하기에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 시작단계에서 가장 많이 쓰는 기법이다.","ㄴ. 집단성원이 아직 인식하지 못했던 부분을 볼 수 있도록 한다.","ㄷ. 말과 행동의 불일치를 밝히고 이를 해결할 수 있도록 원조한다.","ㄹ. 행동을 구체적으로 지적하고 집단에 미치는 영향을 설명한다."],"c":["ㄱ, ㄴ","ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"21-2-50","y":2021,"g":2,"n":50,"t":"면접·의사소통·사정·기록","f":"옳은 것 모두 고르기","s":["사티어(V. Satir)의 의사소통 유형에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 일치형 의사소통 유형이 치료의 목표다.","ㄴ. 의사소통 유형은 자존감과 연관하며 설명한다.","ㄷ. 가족생활주기는 역기능적 의사소통 유형에 영향을 미친다.","ㄹ. 역기능적 의사소통 유형에서 공통적으로 발견되는 것은 언어적 메시지와 비언어적 메시지의 불일치다."],"c":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ"],"a":4},{"id":"22-2-26","y":2022,"g":2,"n":26,"t":"면접·의사소통·사정·기록","f":"옳지 않은 것","s":["사회복지실천에 관한 설명으로 옳지 않은 것은?"],"c":["과학성과 예술성을 통합적으로 활용한다.","사회복지의 관점과 이론을 토대로 한다.","심리학, 사회학 등 타 학문과 배타적 관계에 있다.","클라이언트의 특성을 반영한다.","사회복지 가치와 윤리를 반영한다."],"a":3},{"id":"22-2-27","y":2022,"g":2,"n":27,"t":"집단 대상 실천(집단사회사업)","f":"옳은 것 고르기","s":["지지집단의 주요 목적으로 옳은 것은?"],"c":["구성원의 자기인식 증진","클라이언트의 병리적 행동 치료","구성원에게 기술과 정보 제공","사회적응 지원","동병상련의 경험으로 해결책 모색"],"a":5},{"id":"22-2-28","y":2022,"g":2,"n":28,"t":"집단 대상 실천(집단사회사업)","f":"옳은 것 모두 고르기","s":["집단 초기단계에서 사회복지사의 역할을 모두 고른 것은?","ㄱ. 집단과 구성원의 목표를 설정한다.","ㄴ. 지도자인 사회복지사를 소개하며 신뢰감을 형성한다.","ㄷ. 구성원 간 유사성을 토대로 응집력을 형성한다.","ㄹ. 구성원이 집단에 의존하는 정도를 감소시킨다."],"c":["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"22-2-29","y":2022,"g":2,"n":29,"t":"집단 대상 실천(집단사회사업)","f":"옳지 않은 것","s":["집단활동 중 발생하는 저항에 관한 설명으로 옳지 않은 것은?"],"c":["구성원이 피하고 싶은 주제가 논의될 때 일어날 수 있다.","사회복지사가 제안한 과업의 실행방법을 모를 때 발생할수 있다.","목표 달성을 위해서는 저항 이유를 무시해야 한다.","효과적으로 해결하면 집단활동이 촉진될 수 있다.","다른 구성원의 의견을 통해 해결방안을 찾을 수 있다."],"a":3},{"id":"22-2-30","y":2022,"g":2,"n":30,"t":"집단 대상 실천(집단사회사업)","f":"옳은 것 고르기","s":["집단 사정을 위한 소시오그램에 관한 설명으로 옳은 것은?"],"c":["구성원 간 호감도 질문은 하위집단을 형성하므로 피한다.","구성원 모두가 관심을 갖는 주제를 발견하는데 목적이있다.","소시오메트리 질문을 활용하여 정보를 파악한다.","구성원 간 상호작용을 문장으로 표현한다.","특정 구성원에 대한 상반된 입장 중 하나를 선택하는 것이다."],"a":3},{"id":"22-2-31","y":2022,"g":2,"n":31,"t":"집단 대상 실천(집단사회사업)","f":"옳은 것 모두 고르기","s":["집단 응집력에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 구성원 간 신뢰감이 높을수록 응집력이 높다.","ㄴ. 응집력이 높은 집단에서는 자기노출을 억제한다.","ㄷ. 구성원이 소속감을 가지면 응집력이 강화된다.","ㄹ. 응집력이 높은 집단이 낮은 집단보다 생산적인 작업에 더 유리하다."],"c":["ㄱ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"22-2-32","y":2022,"g":2,"n":32,"t":"집단 대상 실천(집단사회사업)","f":"옳은 것 고르기","s":["집단목표에 관한 설명으로 옳은 것은?"],"c":["목표는 구체적으로 수립한다.","한 번 정한 목표는 혼란 방지를 위해 수정하지 않는다.","집단 크기나 기간을 정할 때 목표는 고려하지 않는다.","집단목표는 구성원의 목표와 관련 없다.","목표는 집단과정에서 자연스럽게 형성되므로 의도적인노력은 필요 없다."],"a":1},{"id":"22-2-33","y":2022,"g":2,"n":33,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["심리사회모델의 개입기법에 관한 설명으로 옳지 않은 것은?"],"c":["직접적 개입과 간접적 개입으로 구분된다.","직접적 영향은 주변인에게 영향력을 행사하여 환경을 변화시키는 기법이다.","탐색-기술(묘사)-환기는 자기 상황과 감정을 말로 표현하게 함으로써 감정전환을 도모하는 기법이다.","지지는 이해, 격려, 확신감을 표현하는 기법이다.","유형의 역동 성찰은 성격, 행동, 감정의 주요 경향에 관한 자기이해를 돕는다."],"a":2},{"id":"22-2-34","y":2022,"g":2,"n":34,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 모두 고르기","s":["인지행동모델의 개입방법에 해당되는 것을 모두 고른 것은?","ㄱ. 내적 의사소통의 명료화　　　ㄴ. 모델링","ㄷ. 기록과제　　　　　　　　　　ㄹ. 자기지시"],"c":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"22-2-35","y":2022,"g":2,"n":35,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["과제중심모델에서 과제에 관한 설명으로 옳지 않은 것은?"],"c":["사회복지사보다 클라이언트가 제시하는 문제나 욕구를고려하여 선정한다.","조작적 과제는 일반적 과제에 비해 구체적이다.","과거보다 현재에 초점을 둔다.","과제 수는 가급적 3개를 넘지 않게 한다.","과제달성 정도는 최종평가 시 결정되므로 과제수행 도중에는 점검하지 않는다."],"a":5},{"id":"22-2-36","y":2022,"g":2,"n":36,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"사례·제시문 판단","s":["다음 전제에 해당되는 사회복지실천모델은?","- 삶에서 변화는 불가피하며 작은 변화가 더 큰 변화로 이어진다.","- 모든 문제에는 예외가 존재한다.","- 클라이언트는 자기 삶의 주체이며, 자신에게 중요한 사람과 일에 대해 가장 잘 아는 전문가이다."],"c":["클라이언트중심모델","해결중심모델","문제해결모델","정신역동모델","동기상담모델"],"a":2},{"id":"22-2-37","y":2022,"g":2,"n":37,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"사례·제시문 판단","s":["다음 사례에 대한 위기개입으로 옳은 것은?","20대인 A씨는 최근 코로나19에 감염되어 실직한 이후 경제적 어려움과 신체적 후유증으로 인해 일상을 유지하기 힘들 정도로 우울감을 경험하며 때때로 자살까지 생각하곤 한다."],"c":["A씨의 문제를 발달적 위기로 사정한다.","코로나19 감염 이전 기능수준으로 회복하는 것을 목표로잡는다.","적절한 감정표현행동을 습득하도록 장기교육 프로그램을실시한다.","A씨 스스로 도움을 요청할 때까지 개입을 유보한다.","보다 긍정적인 인생관을 갖도록 삶의 태도를 근본적으로재조직한다."],"a":2},{"id":"22-2-38","y":2022,"g":2,"n":38,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["인지행동모델에서 비합리적인 사고에 대해 '실용성에 관한 논박기법'을 사용한 질문은?"],"c":["그 생각이 옳다는 것을 어떻게 아세요?","지금 느끼는 감정을 명확하게 설명할 수 있으세요?","그 일이 실제로 일어날 가능성이 얼마나 될까요?","그 생각이 문제해결에 얼마나 도움이 될까요?","그 생각의 논리적 근거는 무엇입니까?"],"a":4},{"id":"22-2-39","y":2022,"g":2,"n":39,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"사례·제시문 판단","s":["다음 사례에 대한 초기 접근으로 옳은 것은?","같은 반 친구를 때린 중학생 B는 학교폭력대책심의위원회의 결정에 따라 사회복지사가 진행하는 학교폭력가해자 프로그램에 의뢰되었다. 그러나 B는 억울함을 호소하며 비협조적인 태도를 보이고 있다."],"c":["클라이언트보다 의뢰자의 견해에 초점을 맞춰 개입한다.","비협조적 태도는 저항에서 비롯된 것으로 그 원인까지탐색할 필요는 없다.","원치 않는 의뢰과정에서 생긴 억눌린 감정을 표현할 수있는 기회를 제공한다.","비협조적 태도를 바꾸려고 시간을 소모하지 말고 곧바로개입한다.","비밀보장원칙이나 학교에 보고해야 할 사항에 대해 설명하지 않는다."],"a":3},{"id":"22-2-40","y":2022,"g":2,"n":40,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 모두 고르기","s":["사회기술훈련에서 사용되는 행동주의모델기법을 모두 고른 것은?","ㄱ. 정적 강화　　　　　ㄴ. 역할 연습","ㄷ. 직면　　　　　　　　ㄹ. 과제를 통한 연습"],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"22-2-41","y":2022,"g":2,"n":41,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["사회복지실천모델에 관한 설명으로 옳지 않은 것은?"],"c":["행동수정모델은 선행요인, 행동, 강화요소에 의해 인간행동을 예측하고 통제할 수 있다고 본다.","심리사회모델은 상황 속 인간을 고려하되 환경보다 개인의 내적변화를 중시한다.","인지행동모델은 왜곡된 사고에 의한 정서적 문제의 개입에 효과적이다.","과제중심모델은 여러 모델들을 절충적으로 활용하며 개입의 책임성을 강조한다.","위기개입모델은 위기에 의한 병리적 반응과 영구적 손상의 치료에 초점을 둔다."],"a":5},{"id":"22-2-42","y":2022,"g":2,"n":42,"t":"가족 대상 실천(가족치료모델)","f":"옳지 않은 것","s":["가족에 관한 체계론적 관점의 기술로 옳지 않은 것은?"],"c":["가족은 하위체계이면서 상위체계이다.","가족 규칙은 가족 항상성에 영향을 준다.","가족 내 하위체계의 경계유형은 투과성 정도에 따라 나뉠 수 있다.","가족문제의 원인을 구성원 간 상호작용에서 찾는 것을순환적 인과관계라고 한다.","가족이 처한 상황을 구성원의 인식과 언어체계로 표현하면서 가족 스스로 문제해결의 단서를 찾도록 한다."],"a":5},{"id":"22-2-43","y":2022,"g":2,"n":43,"t":"가족 대상 실천(가족치료모델)","f":"옳지 않은 것","s":["자녀양육의 어려움을 호소하는 가족의 사정도구에 관한 설명으로 옳지 않은 것은?"],"c":["가계도를 활용하여 구성원 간 관계를 파악한다.","생태도를 통해 회복탄력성과 문제해결능력을 확인한다.","양육태도척도를 활용하여 문제가 되는 부분을 탐색한다.","자녀 입장의 가족조각으로 자녀가 인식하는 가족관계를탐색한다.","생활력표를 활용하여 현재 어려움에 영향을 주는 발달단계 상의 경험을 이해한다."],"a":2},{"id":"22-2-44","y":2022,"g":2,"n":44,"t":"면접·의사소통·사정·기록","f":"옳은 것 고르기","s":["사티어(V. Satir)의 의사소통유형에 관한 설명으로 옳은 것은?"],"c":["회유형은 자신을 무시하고 타인을 떠받든다.","일치형은 자신을 보호하기 위해 타인을 비난한다.","산만형은 자신과 타인을 무시하고 상황을 중요시한다.","초이성형은 자신과 상황을 중시하고 상대를 과소평가한다.","비난형은 자기 생각을 관철시키려고 어려운 말로 장황하게 설명한다."],"a":1},{"id":"22-2-45","y":2022,"g":2,"n":45,"t":"가족 대상 실천(가족치료모델)","f":"사례·제시문 판단","s":["보웬(M. Bowen)이 제시한 개념 중 다음 설명에 해당하는 것은?","- 여러 세대에 거쳐 전수될 수 있다.","- 정신내적 개념이면서 대인관계적 개념이다.","- 정신내적 개념은 자신의 지적 측면과 정서적 측면의 구분을 의미한다.","- 대인관계적 개념은 타인과 친밀하면서도 독립성을 유지하는 능력을 말한다."],"c":["가족투사","삼각관계","자아분화","핵가족 정서","다세대 전수"],"a":3},{"id":"22-2-46","y":2022,"g":2,"n":46,"t":"가족 대상 실천(가족치료모델)","f":"옳지 않은 것","s":["다음 사례에 대해 미누친(S. Minuchin)의 구조적 모델을 적용한 개입방법이 아닌 것은?","자녀교육 문제로 시어머니와 대립하는 며느리가 가족상담을 요청했다. 며느리는 남편이 모든 것을 어머니한테 맞추라고 한다며 섭섭함을 토로했다."],"c":["가족을 이해하고 수용하면서 합류한다.","가족문제를 더 정확히 이해하기 위해 실연을 요청한다.","가족지도를 통해 가족구조와 가족역동을 이해하도록 돕는다.","남편이 시어머니의 영향권에서 벗어나도록 탈삼각화를진행한다.","부부가 함께 부모역할을 수행하도록 하위체계의 경계를명확하게 한다."],"a":4},{"id":"22-2-47","y":2022,"g":2,"n":47,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["해결중심모델의 질문기법 예시로 옳지 않은 것은?"],"c":["관계성질문: 두 분이 싸우지 않을 때는 어떠세요?","예외질문: 매일 싸운다고 하셨는데, 안 싸운 날은 없었나요?","대처질문: 자녀에게 잔소리하는 횟수를 어떻게 줄일 수있었나요?","첫 상담 이전의 변화에 대한 질문: 상담신청 후 지금까지 어떤 변화가 있었나요?","기적질문: 밤새 기적이 일어나서 문제가 다 해결됐는데,자느라고 기적이 일어난 걸 몰라요. 아침에 뭘 보면 기적이 일어났다는 걸 알 수 있을까요?"],"a":1},{"id":"22-2-48","y":2022,"g":2,"n":48,"t":"가족 대상 실천(가족치료모델)","f":"옳은 것 고르기","s":["가족개입의 전략적 모델에 관한 설명으로 옳은 것은?"],"c":["역기능적인 구조의 재구조화를 개입목표로 한다.","증상처방이나 고된 체험기법을 비지시적으로 활용한다.","가족문제가 왜 일어났는지 파악하여 원인 제거에 필요한전략을 사용한다.","가족 내 편중된 권력으로 인해 고착된 불평등한 위계구조를 재배치한다.","문제를 보는 시각을 변화시키고 새로운 의미를 발견하는재명명기법을 사용한다."],"a":5},{"id":"22-2-49","y":2022,"g":2,"n":49,"t":"면접·의사소통·사정·기록","f":"사례·제시문 판단","s":["다음 설명에 해당하는 기록방법은?","- 날짜와 클라이언트의 기본사항을 기입하고 개입 내용과 변화를 간단히 기록함","- 시간 흐름에 따라 변화된 상황, 개입 활동, 주요 정보 등의 요점을 기록함"],"c":["과정기록","요약기록","이야기체기록","문제중심기록","최소기본기록"],"a":2},{"id":"22-2-50","y":2022,"g":2,"n":50,"t":"면접·의사소통·사정·기록","f":"사례·제시문 판단","s":["다음 사례에 해당되는 단일사례설계의 유형은?","독거노인의 우울감 해소를 위해 5주간의 전화상담(주1회)에 이어 5주간의 집단활동(주1회)을 진행했다. 참가자 5명을 대상으로 프로그램 시작 3주 전부터 매주 1회 우울증검사를 실시했고, 프로그램 시작 전, 5주 후, 10주 후에 삶의 만족도를 조사했다."],"c":["AB설계","ABC설계","ABAB설계","ABAC설계","다중(복수)기초선설계"],"a":2},{"id":"23-2-26","y":2023,"g":2,"n":26,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["사회복지실천현장의 지식 유형에 관한 설명으로 옳지 않은 것은?"],"c":["이론은 현상을 설명하기 위한 가설이나 개념의 집합체이다.","관점은 개인과 사회에 관한 주관적 인식의 차이를 보여주는 사고체계이다.","실천지혜는 실천 활동의 원칙과 방식을 구조화한 것이다.","패러다임은 역사와 사상의 흐름에 영향을 받는 추상적개념 틀이다.","모델은 실천과정에 직접적으로 필요한 기술적 적용방법을 제시한 것이다."],"a":3},{"id":"23-2-27","y":2023,"g":2,"n":27,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["위기개입모델에 관한 설명으로 옳지 않은 것은?"],"c":["클라이언트에게 실용적 정보를 제공하고 지지체계를 개발하도록 한다.","단기개입 서비스를 제공한다.","구체적이고 관찰 가능한 문제에 초점을 둔다.","위기 발달은 촉발요인이 발생한 후에 취약단계로 넘어간다.","사회복지사는 다른 개입모델에 비해 적극적이고 직접적인 역할을 수행한다."],"a":4},{"id":"23-2-28","y":2023,"g":2,"n":28,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["해결중심모델에 관한 설명으로 옳은 것은?"],"c":["클라이언트에게 대처행동을 가르치고 훈련함으로써 부적응을 해소하도록 한다.","탈이론적이고 비규범적이며 클라이언트의 견해를 존중한다.","문제의 원인을 클라이언트의 심리 내적 요인에서 찾는다.","클라이언트의 문제를 자원 혹은 기술 부족으로 본다.","문제와 관련이 있는 환경과 자원을 사정하고 개입 방안을 강조한다."],"a":2},{"id":"23-2-29","y":2023,"g":2,"n":29,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["인지적 오류(왜곡)에 관한 예로 옳지 않은 것은?"],"c":["임의적 추론: 내가 뚱뚱해서 지나가는 사람들이 나만 쳐다봐.","개인화: 그때 내가 전화만 받았다면 동생이 사고를 당하지 않았을 텐데. 나 때문이야.","이분법적 사고: 이 일을 완벽하게 하지 못하면 실패한것이야.","과잉일반화: 시험보는 날인데 아침에 미역국을 먹었으니나는 떨어질거야.","선택적 요약: 지난번 과제에 나쁜 점수를 받았어. 이건내가 꼴찌라는 것을 의미해."],"a":4},{"id":"23-2-30","y":2023,"g":2,"n":30,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["인지행동모델에 관한 설명으로 옳지 않은 것은?"],"c":["개인의 주관적 경험의 독특성을 중시한다.","클라이언트의 강점과 자원이 문제해결의 주요 요소이다.","제한된 시간 내에 특정 문제에 초점을 두고 접근한다.","과제 활용과 교육적인 접근으로 자기 치료가 가능하도록한다.","클라이언트의 적극적 참여와 협조적 태도를 중시한다."],"a":2},{"id":"23-2-31","y":2023,"g":2,"n":31,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["사회복지실천의 개입기법에 관한 설명으로 옳지 않은 것은?"],"c":["소거: 부적 처벌의 원리를 이용하여 바람직하지 않은 행동을 중단시키는 것","시연: 클라이언트가 힘들어하는 행동에 대해 실생활에서실행 전에 반복적으로 연습하는 것","행동조성: 특정 행동 수준까지 끌어올리기 위해 작은 단위의 행동으로 나누어 과제를 주는 것","체계적 둔감법: 두려움이 적은 상황부터 큰 상황까지 단계적으로 노출시켜 문제를 극복하도록 하는 것","내적 의사소통의 명료화: 클라이언트가 자신의 생각을말로 표현하고, 피드백을 통해 사고의 명료화를 돕는 것"],"a":1},{"id":"23-2-32","y":2023,"g":2,"n":32,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 모두 고르기","s":["사회복지실천모델에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 위기개입모델에서는 사건에 대한 클라이언트의 주관적인 인식보다 사건 자체를 중시한다.","ㄴ. 클라이언트중심모델에서는 현재 직면한 문제와 앞으로의 문제를 극복할 수 있도록 성장 과정을 도와준다.","ㄷ. 임파워먼트모델에서는 클라이언트가 자신의 삶을 스스로 통제할 수 있도록 원조한다.","ㄹ. 과제중심모델에서는 클라이언트가 인식한 문제에 초점을 두고, 클라이언트의 욕구를 최대한 반영한다."],"c":["ㄱ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"23-2-33","y":2023,"g":2,"n":33,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["해결중심모델에서 사용하는 질문기법과 그에 관한 예로 옳은 것은?"],"c":["관계성 질문: 재혼하신 아버지는 이 문제를 어떻게 생각하실까요?","기적질문: 처음 상담했을 때와 지금의 스트레스 수준을비교한다면 지금은 몇 점인가요?","대처질문: 어떻게 하면 그 문제가 발생하지 않을 것 같나요?","예외질문: 당신은 그 어려운 상황에서 어떻게 견딜 수있었나요?","척도질문: 처음 상담을 약속했을 때와 지금은 무엇이 어떻게 달라졌는지 말씀해 주세요."],"a":1},{"id":"23-2-34","y":2023,"g":2,"n":34,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"사례·제시문 판단","s":["다음 사례에서 활용한 심리사회모델의 개입기법은?","\"지금까지의 방법이 효과적이지 않다면 다른 방법을 시도해 보면 어떨까요? 제 생각에는 지금쯤 변화가 필요하니 가족상담에 참여해 보시면 어떨까 합니다.\""],"c":["지지하기","직접적 영향주기","탐색-기술-환기","인간-환경에 관한 고찰","유형-역동성 고찰"],"a":2},{"id":"23-2-35","y":2023,"g":2,"n":35,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 모두 고르기","s":["정신역동모델의 개입기법에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 직면: 클라이언트의 이야기와 행동 간 불일치를 보일 때 자기모순을 직시하게 한다.","ㄴ. 해석: 치료적 관계에서 나타나는 클라이언트의 특정 생각이나 행동의 의미를 설명한다.","ㄷ. 전이분석: 클라이언트가 과거의 중요한 인물에 대해 느꼈던 감정을 치료사에게 재현하는 현상을 분석하며 과거 문제를 해석하고 통찰하도록 한다.","ㄹ. 명료화: 저항이나 전이에 대한 이해를 심화·확장하며 통합적으로 이해하도록 한다."],"c":["ㄱ","ㄴ, ㄹ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"23-2-36","y":2023,"g":2,"n":36,"t":"면접·의사소통·사정·기록","f":"옳은 것 고르기","s":["클라이언트와의 면접 중에 주제를 전환하기 위한 목적으로 사용하는 실천기술은?"],"c":["반영","요약","해석","직면","초점화"],"a":2},{"id":"23-2-37","y":2023,"g":2,"n":37,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["가족개입을 위한 전제조건에 관한 설명으로 옳지 않은 것은?"],"c":["한 사람의 문제는 가족성원 모두에게 영향을 미친다.","한 가족성원의 개입노력은 가족 전체에 영향을 준다.","가족성원의 행동은 순환적 인과성의 특성을 갖는다.","가족문제의 원인은 단선적 관점으로 파악한다.","한 가족성원이 보이는 증상은 가족의 문제를 대신해서호소하는 것으로 본다."],"a":4},{"id":"23-2-38","y":2023,"g":2,"n":38,"t":"가족 대상 실천(가족치료모델)","f":"사례·제시문 판단","s":["다음 가족사례에 적용된 실천기법은?","- 클라이언트: \"저희 딸은 제 말은 안 들어요. 저희 남편이 뭐든 대신 다 해주거든요. 아이가 남편 말만 들어요. 결국 아이문제로 인해 부부싸움으로 번지거든요.\"","- 사회복지사: \"아버지가 아이를 대신해서 다 해주시는군요. 어머니는 그 사이에서 소외된다고 느끼시네요. 자녀가 스스로 할 수 있도록 아버지는 기다려주고 어머니와 함께 지켜보는 것이 어떨까요?\""],"c":["합류","역설적 지시","경계선 만들기","증상처방","가족조각"],"a":3},{"id":"23-2-39","y":2023,"g":2,"n":39,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"사례·제시문 판단","s":["다음 사례에서 사회복지사가 우선적으로 개입해야 하는 것은?","A씨는 25세로 알코올 중독진단을 받았으나 문제에 대한 본인의 인식은 부족한 상황이다. 현재 A씨는 부모와 함께 살고 있으나 몇 년전부터 대화가 단절되어 있다. A씨가 술을 마실 때면 아버지로부터 학대도 발생하고 있는 상황이다."],"c":["경직된 가족경계를 재구조화한다.","단절된 의사소통의 문제를 해결한다.","알코올 중독 문제에 관여한다.","술 문제의 원인으로 보이는 부모를 대상으로 상담한다.","부모 간 갈등으로부터 벗어나도록 자아분화를 촉진한다."],"a":3},{"id":"23-2-40","y":2023,"g":2,"n":40,"t":"가족 대상 실천(가족치료모델)","f":"옳은 것 고르기","s":["가족경계(boundary)에 관한 설명으로 옳은 것은?"],"c":["하위체계의 경계가 경직된 경우에는 지나친 간섭이 증가한다.","하위체계의 경계가 희미한 경우에는 감정의 합일현상이증가한다.","하위체계의 경계가 경직된 경우에는 가족의 보호 기능이강화된다.","하위체계의 경계가 희미한 경우에는 가족 간 의사소통이감소한다.","하위체 ·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 모두 고르기","s":["심리사회모델에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 심리사회모델을 체계화 하는데 홀리스(F. Hollis)가 공헌하였다.","ㄴ. \"직접적 영향주기\"는 언제나 사용 가능한 기법이다.","ㄷ. \"환기\"는 클라이언트의 긍정적 감정을 표출시킨다.","ㄹ. 간접적 개입기법으로 \"환경조정\"을 사용한다."],"c":["ㄱ, ㄹ","ㄴ, ㄷ","ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1},{"id":"24-2-32","y":2024,"g":2,"n":32,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["인지행동모델 개입 기법에 관한 설명으로 옳은 것은?"],"c":["행동시연: 관찰학습 과정을 통해 클라이언트가 시행착오를 거치지 않고 행동할 수 있도록 한다.","유머사용: 인지적 기법의 하나로서 비합리적인 신념에서오는 불안을 감소시키는데 유용하다.","내적 의사소통 명료화: 클라이언트 스스로 자신에 대해독백하고 사고하는 과정이다.","역설적 의도(paradoxical intention): 클라이언트의 역기능적 사고를 인식하고 이를 현실적인 사고로 대치한다.","이완훈련: 클라이언트가 가장 덜 위협적인 상황에서 가장 위협적인 상황까지 순서대로 제시한다."],"a":3},{"id":"24-2-33","y":2024,"g":2,"n":33,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["사회복지실천모델에 관한 설명으로 옳지 않은 것은?"],"c":["역량강화모델의 발견단계에서는 사정, 분석, 계획하기를수행한다.","클라이언트중심모델은 문제해결에 대한 클라이언트의 책임을 강조한다.","행동주의모델에서는 인간을 병리적인 관점에서 바라본다.","위기개입모델에서 위기는 사건 자체보다 사건에 대한 개인의 주관적 현실에 기반을 두고 있다.","해결중심모델은 사회구성주의 시각을 가진다."],"a":3},{"id":"24-2-34","y":2024,"g":2,"n":34,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"순서 나열","s":["정신역동모델 개입과정을 순서대로 옳게 나열한 것은?","ㄱ. 동일시를 위한 자아구축 단계","ㄴ. 클라이언트의 자기이해를 원조하는 단계","ㄷ. 관계형성 단계","ㄹ. 클라이언트가 독립된 자아정체감을 형성하도록 원조하는 단계"],"c":["ㄱ → ㄷ → ㄹ → ㄴ","ㄴ → ㄷ → ㄱ → ㄹ","ㄴ → ㄹ → ㄷ → ㄱ","ㄷ → ㄱ → ㄹ → ㄴ","ㄷ → ㄴ → ㄱ → ㄹ"],"a":4},{"id":"24-2-35","y":2024,"g":2,"n":35,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 모두 고르기","s":["사회복지사가 비자발적 클라이언트와 공감하는 기술로 옳은 것을 모두 고른 것은?","ㄱ. 원하지 않는 면담이 클라이언트에게 힘들다는 것을 이해한다.","ㄴ. 클라이언트의 행동을 사회복지사의 가치관에 맞추어 평가한다.","ㄷ. 클라이언트의 어려움을 사회복지사가 도울 수 있다는 것을 알려준다.","ㄹ. 클라이언트의 저항을 온화한 태도로 수용한다."],"c":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":4},{"id":"24-2-36","y":2024,"g":2,"n":36,"t":"가족 대상 실천(가족치료모델)","f":"옳지 않은 것","s":["생태체계적 관점에서 보는 가족에 관한 설명으로 옳지 않은 것은?"],"c":["항상성: 가족구성원들이 현재 상태를 유지","경직된 경계: 가족이 다수의 복지서비스를 이용","하위체계: 가족구성원들이 경계를 가지고 각자의 기능을수행","피드백: 가족이 사회환경과 환류를 주고 받으며 변화를도모","순환적 인과관계: 가족 한 사람의 행동이 다른 구성원에게 영향을 주어 가족 전체를 변화"],"a":2},{"id":"24-2-37","y":2024,"g":2,"n":37,"t":"가족 대상 실천(가족치료모델)","f":"옳은 것 고르기","s":["알코올 의존을 겪는 가장과 그 자녀의 상황에 사티어(V. Satir)의 의사소통 유형을 적용한 것으로 옳은 것은?"],"c":["회유형: 모든 것이 자녀 때문이라며 자신이 외롭다고 함","초이성형: 스트레스가 유해하다는 연구를 인용하며 술이라도 마셔서 스트레스를 풀겠다고 침착하게 말함","비난형: 어려서 고생을 많이 해서 그렇다며 벌떡 일어나방 안을 왔다갔다 함","산만형: 살기 힘들어 술을 마신다며 자신의 술 문제가자녀 학업을 방해했다고 인정함","일치형: 다른 사람들 말이 다 옳고 자신은 아무것도 아니라고 술 문제에 대한 벌을 달게 받겠다고 함"],"a":2},{"id":"24-2-38","y":2024,"g":2,"n":38,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["가족치료모델의 개입 목표에 관한 설명으로 옳지 않은 것은?"],"c":["이야기 가족치료: 문제중심 이야기에서 벗어나 새롭고건설적인 가족 이야기 작성","구조적 가족치료: 가족관계 역기능을 유발하는 가족 위계와 경계의 변화 도모","경험적 가족치료: 가족이 미분화에서 벗어나 가족체계의변화를 달성","전략적 가족치료: 의사소통과 행동 문제의 순환 고리를끊고 연쇄작용 변화","해결중심 가족치료: 문제가 일어나지 않는 예외상황을찾아서 확대"],"a":3},{"id":"24-2-39","y":2024,"g":2,"n":39,"t":"가족 대상 실천(가족치료모델)","f":"옳지 않은 것","s":["보웬(M. Bowen)의 다세대 가족치료의 기법이 적용된 사례에 관한 설명으로 옳지 않은 것은?"],"c":["자아분화: 가족의 빈곤한 상황에서도 아동 자녀가 자율적으로 생각하고 행동함","삼각관계: 아동 자녀가 부모와의 갈등을 피하기 위해 경찰에 신고함","정서적 체계: 부모의 긴장관계가 아동 자녀에게 주는 정서적 영향을 파악함","가족투사 과정: 핵가족의 부부체계가 자신들의 불안을아동 자녀에게 투영하는 과정을 검토함","다세대 전이: 가족의 관계 형성이나 정서, 증상이 여러세대에 걸쳐 전수되는 것을 파악함"],"a":2},{"id":"24-2-40","y":2024,"g":2,"n":40,"t":"가족 대상 실천(가족치료모델)","f":"옳지 않은 것","s":["사회변화에 따라 달라지는 가족에 관한 설명으로 옳지 않은 것은?"],"c":["가족 형태가 다양해지는 경향이 있다.","저출산 시대에는 무자녀 부부가 증가한다.","세대구성이 단순화되면서 확대가족의 의미가 약화된다.","단독으로 생계를 유지하는 경우는 가구의 범위에 속하지않는다.","양육, 보호, 교육, 부양 등에서 사회 이슈가 발생한다."],"a":4},{"id":"24-2-41","y":2024,"g":2,"n":41,"t":"가족 대상 실천(가족치료모델)","f":"사례·제시문 판단","s":["다음과 같은 기법을 사용하는 가족치료모델은?","- 가족구성원들 사이 힘의 우위에 따라 대칭적이거나 보완적 관계가 형성된다.","- 비언어적 의사소통이 가족의 욕구를 나타내므로 메타 의사소통이 중요하다.","- 가족이 문제행동을 유지하도록 지시함으로써 클라이언트가 통제력을 발휘한다."],"c":["전략적 가족치료모델","해결중심 가족치료모델","구조적 가족치료모델","다세대 가족치료모델","경험적 가족치료모델"],"a":1},{"id":"24-2-42","y":2024,"g":2,"n":42,"t":"집단 대상 실천(집단사회사업)","f":"옳은 것 고르기","s":["토스랜드와 리바스(R. Toseland &R. Rivas)가 분류한 집단 모델에 관한 설명으로 옳은 것은?"],"c":["치료모델은 집단의 사회적 목표를 강조한다.","상호작용모델은 개인 치료를 위한 수단으로 집단을 강조한다.","상호작용모델은 개인의 역기능 변화가 목적이다.","사회적 목표모델은 민주시민의 역량 개발에 초점을 둔다.","사회적 목표모델은 집단성원 간 투사를 활용한다 회) 조사를 실시하고 4주간(주2회) 개입의 변화를 기록한 후 개입을 멈추고 다시 4주간(주2회)의 변화를 기록하였다."],"c":["기초선을 두 번 설정한다.","통제집단을 활용한다.","개입효과성에 대한 파악이 가능하다.","표본이 하나다.","조사기간이 길어진다."],"a":2},{"id":"25-2-26","y":2025,"g":2,"n":26,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["실천지혜(practice wisdom)에 관한 설명으로 옳지 않은 것은?"],"c":["암묵적 지식과 같은 의미이다.","사회복지사의 직관에 영향을 받는다.","실천 활동을 조작화하고 구조화한 것이다.","개인의 가치체계와 경험으로부터 만들어진다.","현장에서 유용하나 공인된 지식은 아니다."],"a":3},{"id":"25-2-27","y":2025,"g":2,"n":27,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["정신역동모델의 개입기술에 관한 설명으로 옳은 것은?"],"c":["전이는 현재의 인물에게 느끼는 사랑이나 증오의 감정을과거의 인물에게 전치하는 것을 말한다.","훈습은 경험적 확신을 갖도록 전이와 저항에 대한 분석과 해석을 반복적으로 진행하는 것이다.","직면은 클라이언트의 말과 행동 사이의 불일치나 모순이있을 때에 우회적 방법으로 알리는 것이다.","해석은 클라이언트의 공감능력을 키우는 효과가 있다.","자유연상은 클라이언트가 수치스럽게 생각하거나 도움이안 되는 내용을 선택할 수 있다."],"a":2},{"id":"25-2-28","y":2025,"g":2,"n":28,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"사례·제시문 판단","s":["다음 사례에서 활용한 심리사회모델의 개입기법은?","가까워지기 어려운 사람들과 친밀감을 높이기 위해 당신이 자주 사용하는 행동 패턴이 있다고 생각하십니까?"],"c":["직접적 영향 주기","탐색-기술(묘사)-환기","지지하기","유형-역동성 고찰","발달적 고찰"],"a":4},{"id":"25-2-29","y":2025,"g":2,"n":29,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"사례·제시문 판단","s":["다음 사례에 해당하는 인지적 오류는?","입사시험 면접을 잘 마쳤음에도 불구하고 K씨는 부모님께 시험에 떨어질 것이라고 말씀드렸다."],"c":["이분법적 사고","개인화","과잉 일반화","재앙화","임의적 추론"],"a":5},{"id":"25-2-30","y":2025,"g":2,"n":30,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["클라이언트중심모델의 주요 개념으로 옳지 않은 것은?"],"c":["실현화 경향","자아실현 욕구","인지적 개입","조건부 가치","긍정적 관심"],"a":3},{"id":"25-2-31","y":2025,"g":2,"n":31,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["과제중심모델에 관한 설명으로 옳은 것은?"],"c":["개인의 신념체계의 변화를 강조한다.","특정 이론보다는 경험적 자료를 통해 개입의 기초를 마련한다.","인간의 신념이나 생각은 정서와 행동에 영향을 미친다고가정한다.","클라이언트가 무력한 상태에서 힘을 가진 상태로 이동하는 것을 목표로 한다.","변화는 항상 일어나며 불가피한 것으로 본다."],"a":2},{"id":"25-2-32","y":2025,"g":2,"n":32,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["해결중심모델의 주요 원리로 옳지 않은 것은?"],"c":["건강한 것에 초점을 둔다.","개입의 목적을 증상 감소에 둔다.","현재에 초점을 맞추며 미래지향적이다.","클라이언트와의 협력관계를 중요시한다.","탈이론적이며 비규범적이다."],"a":2},{"id":"25-2-33","y":2025, "보웬(M. Bowen)의 다세대 가족치료의 주요 개념과 기법에관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 자아분화 수준이 더 낮은 성원이 가족투사의 대상이 된다.","ㄴ. 가계도를 작성하고 해석하면서 가족의 정서적 과정을 이해한다.","ㄷ. 성공적인 치료를 위해 사회복지사는 치료적 삼각관계를 형성하며 개입한다.","ㄹ. 자아분화 수준이 낮을수록 가족원의 자율성이 증가하여 독립적으로 행동한다."],"c":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"25-2-41","y":2025,"g":2,"n":41,"t":"가족 대상 실천(가족치료모델)","f":"옳지 않은 것","s":["경험적 가족치료에 관한 설명으로 옳지 않은 것은?"],"c":["자아존중감을 높이는 것이 중요한 치료목표이다.","역기능적 의사소통 유형을 일치형으로 바꾸도록 돕는다.","가족규칙을 합리적으로 바꾸고, 자기 인생에 대한 선택권을 스스로 갖도록 한다.","역기능적인 상호작용의 개선이나 증상 제거보다 개인의성장에 더 초점을 둔다.","가족의 상호작용 유형을 확인하고 문제를 외현화한다."],"a":5},{"id":"25-2-42","y":2025,"g":2,"n":42,"t":"가족 대상 실천(가족치료모델)","f":"옳은 것 고르기","s":["체계론적 관점에서 가족에 관한 설명으로 옳은 것은?"],"c":["가족의 항상성은 어떤 행동이 허용되는가를 결정하는 가족규칙을 통해 공고해진다.","일탈행동이나 갈등상황에 대해 부적 환류를 적용하면 최초의 일탈이나 갈등을 증폭시키는 작용을 한다.","가족은 상위체계와는 독립적으로 존재하며 그 안에 다양한 하위체계를 포함한다.","경직된 경계를 가진 가족은 독립성과 자율성이 결여되어있다.","부모-자녀하위체계는 가족을 이끄는 책임을 지는 하위체계로 권위를 갖는 것이 중요하다."],"a":1},{"id":"25-2-43","y":2025,"g":2,"n":43,"t":"가족 대상 실천(가족치료모델)","f":"옳은 것 모두 고르기","s":["가족의 구조와 기능에 관한 설명으로 옳은 것을 모두 고른것은?","ㄱ. 기능적인 가족은 가족규칙을 융통성 있게 적용한다.","ㄴ. 부모와 자녀 간의 밀착된 관계는 하위체계 간 균형을 유지하게 한다.","ㄷ. 밀착된 가족은 경계의 투과성이 높아 체계 간 구분이 어렵다.","ㄹ. 기능적 가족은 가족성원에게 고정된 역할을 부여하여 혼란을 감소시킨다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":2},{"id":"25-2-44","y":2025,"g":2,"n":44,"t":"집단 대상 실천(집단사회사업)","f":"옳지 않은 것","s":["집단문화에 관한 설명으로 옳지 않은 것은?"],"c":["집단 고유의 스타일이나 독특성을 만들어낸다.","집단응집력은 집단문화 형성에 영향을 미치는 요인이다.","성원들의 가치가 혼합되면서 타 집단과 구분되는 특성이만들어진다.","다양한 성원들이 참여하는 개방형 집단에서 빠르게 형성된다.","고정관념이나 편견이 많은 성원들은 집단문화 형성에 방해가 된다."],"a":4},{"id":"25-2-45","y":2025,"g":2,"n":45,"t":"집단 대상 실천(집단사회사업)","f":"옳은 것 모두 고르기","s":["자조집단이 갖는 특징으로 옳은 것을 모두 고른 것은?","ㄱ. 동병상련의 경험에 기반을 둔다.","ㄴ. 집단사회복지사의 주요 역할은 변화매개인이다.","ㄷ. 집단 내 원활한 의사소통과 상호작용을 위해 공동지도자를 둔다.","ㄹ. 노아방주의 원칙(Noah's ark principle)에 따라 성원을 모집한다."],"c":["ㄱ","ㄴ, ㄷ","ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1},{"id":"25-2-46","y":2025,"g":2,"n":46,"t":"집단 대상 실천(집단사회사업)","f":"옳은 것 모두 고르기","s":["집단대상 실천의 치료적 효과에 해당하는 것을 모두 고른것은?","ㄱ. 정보 습득　　　　ㄴ. 보편성","ㄷ. 이타심　　　　　　ㄹ. 정화"],"c":["ㄱ","ㄴ, ㄷ","ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"25-2-47","y":2025,"g":2,"n":47,"t":"집단 대상 실천(집단사회사업)","f":"옳은 것 고르기","s":["집단 사정도구의 활용 목적으로 옳은 것은?"],"c":["소시오메트리: 개별 성원의 행동패턴 분석","소시오그램: 성원 간 상호작용 빈도 측정","사회적 관계망표: 집단성원 활동에 대한 상호 평가","상호작용차트: 성원의 집단참여 수준 분석","의의차별척도: 하위집단의 구성여부 파악"],"a":4},{"id":"25-2-48","y":2025,"g":2,"n":48,"t":"집단 대상 실천(집단사회사업)","f":"옳은 것 모두 고르기","s":["집단의 종결단계에서 수행하는 과업으로 옳은 것을 모두 고른 것은?","ㄱ. 성원 간의 이해를 돕기 위해 자기 노출의 기회를 갖는다.","ㄴ. 집단경험을 통해 학습한 내용의 활용계획을 세운다.","ㄷ. 공통의 관심사를 찾기 위해 개방적 토론 시간을 늘린다.","ㄹ. 측정도구를 통해 성원 개인별 변화를 평가한다."],"c":["ㄱ","ㄴ, ㄷ","ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"25-2-49","y":2025,"g":2,"n":49,"t":"면접·의사소통·사정·기록","f":"옳지 않은 것","s":["단일사례설계에 관한 설명으로 옳지 않은 것은?"],"c":["동시에 여러 문제의 변화를 측정하는 것이 불가능하다.","개입의 효과성을 파악하기 위해 반복측정을 한다.","기초선 자료수집은 개입 이전이나 이후에도 가능하다.","개입과정에서 개입의 강도나 방식을 바꿀 수 있다.","조사대상은 개인뿐 아니라 가족, 집단, 기관도 가능하다."],"a":1},{"id":"25-2-50","y":2025,"g":2,"n":50,"t":"면접·의사소통·사정·기록","f":"옳지 않은 것","s":["클라이언트의 개인정보 보호를 위한 기록 방법으로 옳지 않은 것은?"],"c":["정확한 정보를 기록하고, 부정확한 것으로 확인되면 삭제나 수정할 수 있다.","서비스 신청에 필요하더라도 민감한 사적 정보는 제외한다.","개인정보가 담긴 사례기록을 방치하는 것은 위법 행위이다.","클라이언트의 사생활이나 비밀스러운 내용은 일반적인용어로 바꾸어 기록한다.","전산화된 기록에 대한 접근 권한을 제한하기 위해 암호화한다."],"a":2},{"id":"26-2-26","y":2026,"g":2,"n":26,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["실천과정에서 사회복지사에게 문제분석, 개입계획, 개입방법 등 구체적인 방법을 제시하는 실천지식은?"],"c":["패러다임","관점","이론","모델","실천지혜"],"a":4},{"id":"26-2-27","y":2026,"g":2,"n":27,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["직면에 관한 설명으로 옳지 않은 것은?"],"c":["클라이언트에게 해결이 필요한 영역을 알려주어 즉각적인 행동변화가 이루어진다.","클라이언트의 행동과 진술이 불일치할 때 적용한다.","클라이언트의 이해와 자기성찰을 촉구하는 방법이다.","직면의 영향으로 클라이언트가 불안정한 상태에 빠질 수있어 원조관계에 위협을 초래할 수 있다.","직면의 필요성에 대한 충분한 근거가 있을 때 실시한다."],"a":1},{"id":"26-2-28","y":2026,"g":2,"n":28,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["정신역동모델의 개입기술에 관한 설명으로 옳은 것은?"],"c":["자유연상은 클라이언트가 의식하고 있는 감정이나 사고를 탐색한다.","초점화는 저항의 허용범위를 확장하여 통합적 이해를 가능하게 한다.","꿈분석은 무의식적인 미해결 과제를 분석하여 통찰력을갖게 한다.","훈습은 클라이언트의 이야기 중에서 핵심문제의 원인에초점을 맞춘다.","해석은 클라이언트가 호소하는 문제의 구체적인 해결방법을 다룬다."],"a":3},{"id":"26-2-29","y":2026,"g":2,"n":29,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 모두 고르기","s":["자녀양육을 전담하던 전업주부 A씨는 남편의 갑작스런 죽음으로 위기에 처하게 되어 도움을 요청하였다. 아길레라와 메식(D. Aguilera &J. Messick)의 위기개입모델을 적용하여 사회복지사가 개입단계에서 실행할 수 있는 과제를 모두 고른 것은?","ㄱ. 남편이 사망한 이후에 자살에 대해 생각한 적이 있는지 확인한다.","ㄴ. 남편과의 사별 후 자신의 삶에 대해 객관적으로 이해하도록 돕는다.","ㄷ. A씨와 가까운 곳에 살고 있는 가족자원을 파악한다.","ㄹ. 남편의 사망 이후에 관심을 가지지 못했던 학부모모임에 참석하도록 지지한다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":3},{"id":"26-2-30","y":2026,"g":2,"n":30,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"사례·제시문 판단","s":["해결중심모델에서 활용되는 질문기법의 예시로 옳은 것은?","생각하세요?"],"c":["예외질문: 문제가 모두 해결되었다고 상상했을 때, 무엇을 보면 문제가 해결되었는지 알 수 있을까요?","대처질문: 결혼만족도를 4점에서 5점으로 높이기 위해서는 무엇을 해야 할까요?","관계성 질문: 두 분이 싸우지 않을 때는 언제인가요?","상담 전 변화에 관한 질문: 상담을 예약하신 날부터 지금까지 어떤 변화가 있으셨어요?","기적질문: 이 문제가 해결될 가능성은 어느 정도 된다고"],"a":4},{"id":"26-2-31","y":2026,"g":2,"n":31,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["과제중심모델의 개입과정에서 초기단계 과업에 해당하지 않는 것은?"],"c":["표적문제의 우선순위 결정","표적문제와 상황에 대한 탐색","과제이행을 위한 계획","서비스 계약의 수립","초기 과제의 결정"],"a":3},{"id":"26-2-32","y":2026,"g":2,"n":32,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 고르기","s":["인지행동모델의 개입기법에 관한 설명으로 옳은 것은?"],"c":["모델링은 관찰학습을 통해 클라이언트가 취할 행동을 학습하게 한다.","경험적 학습은 새로운 행동을 반복적으로 연습하여 숙달되도록 한다.","체계적 둔감화는 비합리적인 신념의 당위성 검토에 초점을 맞춘다.","인지재구조화는 호흡과 마음챙김을 통해 스트레스에 대처하는 기법이다.","역설적 의도는 클라이언트의 역기능적 인식을 현실적인사고와 관념으로 대치시킨다."],"a":1},{"id":"26-2-33","y":2026,"g":2,"n":33,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["인지행동모델에 관한 설명으로 옳지 않은 것은?"],"c":["클라이언트와 사회복지사의 치료적 동맹관계가 중요하다.","소크라테스식 문답법을 활용하여 인지적 수정을 꾀한다.","인간의 비합리적인 신념이 행동과 정서 문제를 초래한다고 본다.","클라이언트가 호소하는 문제가 해결될 때까지 시간을 제한하지 않고 개입한다.","교육적 접근을 통해 재발방지역량을 강화하는데 초점을맞춘다."],"a":4},{"id":"26-2-34","y":2026,"g":2,"n":34,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳지 않은 것","s":["심리사회모델의 개입기술에 관한 설명으로 옳지 않은 것은?"],"c":["지지하기: 클라이언트의 문제해결능력에 대한 인정과 격려로 불안을 감소시킨다.","직접적 영향: 사회복지사가 클라이언트에게 필요한 조언이나 제안을 한다.","탐색-기술-환기: 클라이언트의 상황에 대한 사회복지사의 감정을 표출하여 문제인식을 돕는다.","인간-상황과의 관계 고찰: 사건에 대한 클라이언트의 인식, 사고, 감정, 외부 환경의 영향을 성찰하게 한다.","발달적 고찰: 클라이언트의 성격이나 기능에 영향을 미친 원가족에서의 초기 경험을 성찰하게 한다."],"a":3},{"id":"26-2-35","y":2026,"g":2,"n":35,"t":"개입기법·이론(인지행동·정신역동·해결중심 등)","f":"옳은 것 모두 고르기","s":["사회복지실천모델에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 과제중심모델은 클라이언트가 우선 해결하기 원하는 문제를 중요하게 다룬다.","ㄴ. 클라이언트중심모델은 클라이언트의 과거경험을 주로 다룬다.","ㄷ. 임파워먼트모델은 클라이언트의 잠재력 발휘와 자원연계를 중요시 한다.","ㄹ. 위기개입모델은 단기 집중 개입방법이다."],"c":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"26-2-36","y":2026,"g":2,"n":36,"t":"가족 대상 실천(가족치료모델)","f":"옳지 않은 것","s":["가족치료모델의 개입목표와 기법의 연결로 옳지 않은 것을 모두 고른 것은?","ㄱ. 전략적 모델 - 개인과 가족의 성장 - 역설적 기법","ㄴ. 다세대 모델 - 불안 경감과 자아분화 촉진 - 구조적 지도","ㄷ. 경험적 모델 - 증상 제거 - 동적 가족화","ㄹ. 구조적 모델 - 역기능적 가족구조의 재구조화 - 합류"],"c":["ㄱ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"a":4},{"id":"26-2-37","y":2026,"g":2,"n":37,"t":"가족 대상 실천(가족치료모델)","f":"옳은 것 고르기","s":["구조적 가족치료모델에서 가족이 기존의 의사소통과 행동양식을 지속하도록 사회복지사가 따라가며 권장하는 기법은?"],"c":["모방","추적","유지","연합","동맹"],"a":2},{"id":"26-2-38","y":2026,"g":2,"n":38,"t":"가족 대상 실천(가족치료모델)","f":"옳지 않은 것","s":["다세대 가족치료모델에 관한 설명으로 옳지 않은 것은?"],"c":["부모와 해결되지 못한 정서적 문제가 현재의 가족에 부정적 영향을 미친다.","자아분화는 정신내적인 개념인 동시에 대인관계적 개념이다.","삼각관계에 포함된 자녀는 부모의 긴장완화를 위해 자아분화 수준이 높아진다.","미성숙한 부모가 불안을 낮추기 위해 가장 취약한 자녀에게 자신의 불안을 투사하는 현상을 가족투사과정이라고 한다.","다세대전수과정은 미분화된 가족체계의 관계패턴이 세대에 걸쳐 반복되는 현상을 말한다."],"a":3},{"id":"26-2-39","y":2026,"g":2,"n":39,"t":"가족 대상 실천(가족치료모델)","f":"사례·제시문 판단","s":["다음 사례에서 가족구성원과 의사소통유형의 연결로 옳은 것은?","철수는 학교사회복지사에게 친구를 사귀는 것이 너무 어렵고, 겨우 친해진 친구와도 잘 지내지 못해 우울하다고 호소했다. 철수는 부모님이 자기한테는 관심도 없고 동생만 예뻐해서, 동생을 미워하게 됐고 친구들과 잘 지내지 못하게 됐다고 했다. 엄마는 동생이 하는 짓이 너무 예쁘다고 했다. 아빠는 TV에 나온 의사가 남을 배려하고 자기 일을 잘하는 사람이 대인관계도 좋다고 했다며 철수가 노력해야 된다고 말했다."],"c":["엄마 – 비난형","철수 – 산만형","철수 - 회유형","아빠 – 초이성형","엄마 - 일치형"],"a":4},{"id":"26-2-40","y":2026,"g":2,"n":40,"t":"가족 대상 실천(가족치료모델)","f":"옳지 않은 것","s":["가족치료모델과 가족사정도구의 연결로 옳지 않은 것은?"],"c":["구조적 모델 – 생태도","경험적 모델 - 가족조각","다세대 모델 – 가계도","전략적 모델 - 순환질문","경험적 모델 - 의사소통유형"],"a" function fetchJSON(u){if(window.__DATA&&window.__DATA[u])return Promise.resolve(window.__DATA[u]);return fetch(u).then(function(r){if(!r.ok)throw new Error(u);return r.json();});}

/* ---------- helpers ---------- */
function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs)for(var k in attrs){
    var v=attrs[k];
    if(k==='class')el.className=v;
    else if(k==='html')el.innerHTML=v;
    else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);
    else if(v===true)el.setAttribute(k,'');
    else if(v!==false&&v!=null)el.setAttribute(k,v);
  }
  for(var i=2;i<arguments.length;i++){
    var c=arguments[i];if(c==null||c===false)continue;
    el.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);
  }
  return el;
}
function pad(n){return n<10?'0'+n:''+n;}
function dayKey(t){var d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtT(ms){ms=Math.max(0,Math.ceil(ms/1000));var m=Math.floor(ms/60),s=ms%60;return pad(m)+':'+pad(s);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function toast(msg){
  var t=h('div',{class:'toast',role:'status'},msg);document.body.appendChild(t);
  setTimeout(function(){t.remove();},1800);
}
function qtitle(q){return q.s[0];}
function label(q){return q.y+'년 '+q.g+'교시 '+q.n+'번';}
function curAns(q){var e=EX[q.id];return e&&typeof e.cur==='number'?e.cur:q.a;}
function stats(){
  var r=D.r,n=0,ok=0,wrong=0;
  for(var i in r){n++;if(r[i].ok)ok++;else wrong++;}
  return {n:n,ok:ok,wrong:wrong};
}

/* ---------- home ---------- */
function filterQs(){
  return ALL.filter(function(q){
    if(S.subs.length&&S.subs.indexOf(q.k)<0)return false;
    if(S.topic&&q.t!==S.topic)return false;
    if(S.years.length&&S.years.indexOf(q.y)<0)return false;
    if(S.fmts.length&&S.fmts.indexOf(q.f)<0)return false;
    var r=D.r[q.id];
    if(S.status==='new'&&r)return false;
    if(S.status==='wrong'&&!(r&&!r.ok))return false;
    if(S.status==='bm'&&!D.bm[q.id])return false;
    return true;
  });
}
function persistSet(){D.set=S;save();}
function toggle(arr,v){var i=arr.indexOf(v);if(i<0)arr.push(v);else arr.splice(i,1);}

/* ---------- session ---------- */
function startSession(ids,mode){
  sess={ids:ids,i:0,picked:{},mode:mode,graded:{}};
  go('quiz');
}
function grade(q,pick){
  var a=curAns(q);
  if(a===0)return null;
  return pick===a;
}
function record(q,ok){
  var r=D.r[q.id]||{n:0,w:0};
  r.n++;if(!ok)r.w++;r.ok=ok;r.t=Date.now();
  D.r[q.id]=r;
  var dk=dayKey(r.t),hd=D.hist[dk]||(D.hist[dk]=[0,0]);hd[0]++;if(ok)hd[1]++;
  save();
}

/* ---------- mock exam ---------- */
var X={scope:'1',pool:'new'};
function scopeSubs(sc){
  if(sc==='all')return SUBJ;
  if(sc.slice(0,2)==='k:')return SUBJ.filter(function(s){return s.k===sc.slice(2);});
  return SUBJ.filter(function(s){return String(s.g)===sc;});
}
function scopeLabel(sc){return sc==='all'?'전체 200문항':sc.slice(0,2)==='k:'?NAMES[sc.slice(2)]+' 단과목':sc+'교시';}
function composeExam(sc,pool){
  var ids=[];
  scopeSubs(sc).forEach(function(s){
    var c=s.q.filter(function(q){return curAns(q)!==0;});
    var fresh=shuffle(c.filter(function(q){return !D.r[q.id];}));
    var seen=shuffle(c.filter(function(q){return D.r[q.id];}));
    var l=pool==='new'?fresh.concat(seen):shuffle(c);
    shuffle(l.slice(0,25)).forEach(function(q){ids.push(q.id);});
  });
  return ids;
}
function persistLive(){
  D.live={ids:ex.ids,picked:ex.picked,mark:ex.mark,i:ex.i,end:ex.end,scope:ex.scope,start:ex.start};save();
}
function startExam(sc,pool){
  var ids=composeExam(sc,pool),now=Date.now();
  ex={ids:ids,picked:{},mark:{},i:0,end:now+ids.length*60000,scope:sc,start:now,panel:false,confirm:false};
  persistLive();go('exam');
}
function resumeExam(){
  ex=Object.assign({panel:false,confirm:false},D.live);
  if(ex.end<=Date.now())submitExam();else go('exam');
}

function composeExamCount(sc){
  var n=0;scopeSubs(sc).forEach(function(s){
    var c=s.q.filter(function(q){return curAns(q)!==0;}).length;n+=Math.min(25,c);});
  return n;
}

function submitExam(){
  clearInterval(timerId);
  var by={},ok=0,ans=0,wrong=[];
  ex.ids.forEach(function(id){
    var q=BYID[id];by[q.k]=by[q.k]||[0,0];by[q.k][1]++;
    var p=ex.picked[id];
    if(p){
      ans++;var g=grade(q,p);
      if(g!==null)record(q,g);
      if(g){ok++;by[q.k][0]++;}else wrong.push(id);
    }else wrong.push(id);
  });
  var used=Math.min(Math.round((Date.now()-ex.start)/1000),ex.ids.length*60);
  var res={t:Date.now(),scope:ex.scope,n:ex.ids.length,ok:ok,ans:ans,by:by,secs:used,wrong:wrong};
  D.mock.unshift(res);D.mock=D.mock.slice(0,20);D.live=null;save();
  lastRes=res;ex=null;go('exsum');
}

/* ---------- study (frequent topics) ---------- */
function topicStats(){
  var m={};
  ALL.forEach(function(q){
    var key=q.k+'|'+q.t,o=m[key];
    if(!o)o=m[key]={k:q.k,t:q.t,n:0,y:{},att:0,ok:0,ids:[]};
    o.n++;o.y[q.y]=(o.y[q.y]||0)+1;o.ids.push(q.id);
    var r=D.r[q.id];if(r){o.att++;if(r.ok)o.ok++;}
  });
  return Object.keys(m).map(function(key){
    var o=m[key],a=0,b=0;
    YEARS.forEach(function(y){var c=o.y[y]||0;if(y>=2022)b+=c;else a+=c;});
    o.recent=b;o.early=a;o.acc=o.att?o.ok/o.att:null;
    o.prio=o.n*(1-(o.acc===null?0.5:o.acc));
    return o;
  });
}
function topicQs(o,mode){
  return o.ids.filter(function(id){
    var r=D.r[id];
    if(mode==='new')return !r;
    if(mode==='wrong')return r&&!r.ok;
    return true;
  });
}

    app.appendChild(box);

    weak.forEach(function(o){
      app.appendChild(h('button',{class:'rank',onclick:function(){
        var w=topicQs(o,'wrong');startSession(w.length?w:o.ids.slice(),o.t+(w.length?' · 오답':''));
      }},h('b',null,Math.round(o.acc*100)+'%'),h('span',null,o.t),h('small',null,NAMES[o.k]+' · '+o.ok+'/'+o.att)));
    });
  }
  /* mock history */
  if(D.mock.length){
    app.appendChild(h('div',{class:'sec'},h('div',{class:'lab'},'모의고사 점수 추이 (최근 '+Math.min(D.mock.length,8)+'회)')));
    var mh=D.mock.slice(0,8).reverse();
    var mc=h('div',{class:'chart',style:'grid-template-columns:repeat(8,1fr);height:96px'});
    for(var pi=mh.length;pi<8;pi++)mc.appendChild(h('div'));
    mh.forEach(function(m){
      var p=Math.round(m.ok/m.n*100);
      mc.appendChild(h('div',{class:'col'},h('span',null,p),
        h('div',{class:'bars',style:'height:'+Math.max(4,Math.round(p*0.66))+'px'},h('i',{style:'background:'+(p>=60?'var(--ok)':p>=40?'var(--hi)':'var(--bad)')+';flex:1'})),
        h('span',null,(new Date(m.t).getMonth()+1)+'/'+new Date(m.t).getDate())));
    });
    app.appendChild(mc);
  }
  app.appendChild(h('div',{class:'sec'},h('div',{class:'lab'},'과목별 진도')));
  SUBJ.forEach(function(s){
    var n=0,ok=0;
    s.q.forEach(function(q){var r=D.r[q.id];if(r){n++;if(r.ok)ok++;}});
    var pct=n?Math.round(ok/n*100):0;
    app.appendChild(h('div',{class:'subrow'},
      h('div',{class:'h'},h('span',null,s.g+'교시 '+NAMES[s.k]),h('span',{class:'muted num small'},n+'/'+s.q.length+' · '+(n?pct+'%':'-'))),
      h('div',{class:'pbar'},h('i',{class:n?(pct<60?'lo':pct<80?'mid':''):'',style:'width:'+(n/s.q.length*100)+'%'}))));
  });
  /* reports */
  var rep=Object.keys(D.rep).filter(function(i){return BYID[i];});
  app.appendChild(h('div',{class:'sec'},h('div',{class:'lab'},'오류 신고 '+rep.length+'건')));
  if(rep.length){
    app.appendChild(h('div',{class:'card small'},rep.map(function(i){return i;}).join(', ')));
    app.appendChild(h('button',{class:'btn ghost sm',style:'margin-top:8px',onclick:function(){
      copyText(rep.join(', '));
    }},'신고 목록 복사'));
  }else app.appendChild(h('div',{class:'muted small'},'문제 화면에서 정답·해설이 이상하면 신고 버튼을 눌러 주세요.'));
  /* backup */
  var ta=h('textarea',{id:'bk','aria-label':'기록 데이터',spellcheck:'false'});
  app.appendChild(h('div',{class:'sec'},h('label',{for:'bk'},'기록 백업 · 복원'),
    h('div',{class:'small muted'},'다른 기기로 옮기거나 브라우저 데이터를 지우기 전에 복사해 두세요.'),ta,
    h('div',{class:'row'},
      h('button',{class:'btn ghost sm',onclick:function(){
        var t=JSON.stringify({v:2,r:D.r,bm:D.bm,rep:D.rep,hist:D.hist,mock:D.mock});ta.value=t;ta.select();copyText(t);
      }},'백업 복사'),
      h('button',{class:'btn ghost sm',onclick:function(){
        try{
          var o=JSON.parse(ta.value);
          if(!o||typeof o.r!=='object')throw 0;
          D.r=o.r||{};D.bm=o.bm||{};D.rep=o.rep||{};D.hist=o.hist||{};D.mock=o.mock||[];save();toast('복원했습니다');go('rec');
        }catch(e){toast('백업 데이터 형식이 맞지 않습니다');}
      }},'붙여넣은 데이터로 복원'))));
  /* reset */
  var rs=h('div',{class:'sec'},h('div',{class:'lab'},'초기화'));
  var btn=h('button',{class:'btn ghost sm',style:'color:var(--bad)',onclick:function(){
    btn.style.display='none';
    rs.appendChild(h('div',{class:'card'},h('div',{class:'small'},'풀이 기록, 오답, 북마크, 모의고사 기록이 모두 지워집니다.'),
      h('div',{class:'row',style:'margin-top:10px'},
        h('button',{class:'btn ghost sm',onclick:function(){go('rec');}},'취소'),
        h('button',{class:'btn sm',style:'background:var(--bad);color:#2a0b09',onclick:function(){
          D={v:1,r:{},bm:{},rep:{},hist:{},mock:[],live:null,set:D.set||{}};save();toast('초기화했습니다');go('rec');
        }},'모두 지우기'))));
  }},'기록 모두 지우기');
  rs.appendChild(btn);app.appendChild(rs);
  app.appendChild(h('div',{class:'muted small',style:'margin-top:28px'},
    '기출 2017~2026년 10개년 · 문항 2,000개 · 정답은 CBT 공식 정답표 기준. 해설은 AI가 작성했으며 틀릴 수 있습니다.'));
}
function copyText(t){
  var done=function(){toast('복사했습니다');};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done,function(){toast('위 칸을 길게 눌러 직접 복사해 주세요');});
  }else toast('위 칸을 길게 눌러 직접 복사해 주세요');
}

boot();
})();
</script>
