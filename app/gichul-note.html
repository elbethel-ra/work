않는다."],"a":5},{"id":"23-3-24","y":2023,"g":3,"n":24,"t":"사회서비스·기타 분야(노인·아동·장애·주거·교육)","f":"옳은 것 모두 고르기","s":["사회복지운동에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 민간이 사회복지에 대한 특정 견해를 가지고 이를 관철시키려는 실천이다.","ㄴ. 노동운동·시민운동·여성운동 단체 등 다양한 주체들이 관심과 역량을 투여하는 사회운동의 한 분야이다.","ㄷ. 사회복지종사자들이 갖고 있는 전문성을 실현하는 중요한 통로의 하나이다.","ㄹ. 우리나라의 사회복지역사에서 정부는 사회복지운동단체의 의견을 모두 수용하였다."],"c":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"23-3-25","y":2023,"g":3,"n":25,"t":"소득보장·공공부조·빈곤·불평등","f":"옳지 않은 것","s":["우리나라에서 시행 중인 소득보장제도에 관한 설명으로 옳지 않은 것은?"],"c":["기초연금은 노인의 생활안정 지원을 목적으로 한다.","장애정도가 심하지 않은 장애인은 장애인연금을 받을 수없다.","장애수당은 장애로 인해 발생하는 추가비용을 보전하기위해 도입되었다.","만 10세 아동은 아동수당을 받을 수 있다.","저소득 한부모가족에게는 아동양육비가 지급될 수 있다."],"a":4},{"id":"24-3-1","y":2024,"g":3,"n":1,"t":"정책 개념·가치·이념","f":"옳은 것 모두 고르기","s":["사회복지의 잔여적 개념과 제도적 개념에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 잔여적 개념에 따르면 개인은 기본적으로 가족과 시장을 통해 욕구를 충족시킨다.","ㄴ. 제도적 개념에 따르면 가족과 시장에 의한 개인의 욕구 충족이 실패했을 때 국가가 잠정적·일시적으로 그 기능을 대신한다.","ㄷ. 잔여적 개념은 작은 정부를 옹호하고 시장과 민간의 역할을 중시하는 보수주의자들의 선호와 맥락을 같이한다.","ㄹ. 제도적 개념은 사회복지를 시혜나 자선으로 보지 않지만 국가에 의해 주어진 것이므로 권리성은 약하다."],"c":["ㄱ","ㄹ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"a":3},{"id":"24-3-2","y":2024,"g":3,"n":2,"t":"정책과정·결정모형·분석·평가","f":"옳지 않은 것","s":["복지다원주의 또는 복지혼합에 관한 설명으로 옳지 않은 것은?"],"c":["국가는 복지의 주된 공급자로 인정하면서도 불평등을 야기하는 시장은 복지 공급자로 수용하지 않는다.","국가를 포함한 복지제공의 주체를 재구성하는 논리로 활용된다.","비공식부문은 제도적 복지의 발달에도 불구하고 존재하는비복지 문제에 대응하는 복지주체이다.","시민사회는 사회적경제조직을 구성하여 지역사회에서 공급주체로 참여하는 역할을 한다.","복지제공의 주체로 국가 외에 다른 주체를 수용한다는 점에서 복지국가를 비판하는 논리로 쓰인다."],"a":1},{"id":"24-3-3","y":2024,"g":3,"n":3,"t":"정책 개념·가치·이념","f":"옳은 것 모두 고르기","s":["급여의 형태에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 현금급여는 선택의 자유를 보장하지만 사회적 통제가 부과된다.","ㄴ. 현물급여는 집합적 선을 추구하고 용도 외 사용을 방지하지만 관리비용이 많이 든다.","ㄷ. 서비스는 클라이언트를 위한 제반 활동을 말하며 목적 외 다른 용도로 사용할 수 없다.","ㄹ. 증서는 일정한 범위 내에서만 교환가치를 가지기 때문에 개인주의자와 집합주의자 모두 선호한다.","ㅁ. 기회는 재화와 자원을 통제할 수 있는 영향력을 의미하며 정책에 관한 의사결정권을 갖는 것을 말한다."],"c":["ㄱ, ㄹ","ㄴ, ㅁ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㅁ","ㄴ, ㄷ, ㄹ"],"a":5},{"id":"24-3-4","y":2024,"g":3,"n":4,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["사회서비스 전자바우처에 관한 설명으로 옳지 않은 것은?"],"c":["급여형태는 신용카드 또는 체크카드로 구현한 증서이다.","공급자 중심의 직접지원 또는 직접지불 방식이다.","서비스 제공자의 도덕적 해이를 방지하기 위해 도입되었다.","수요자의 선택권을 보장하기 위한 수단으로 활용되고 있다.","금융기관 시스템을 활용하여 재정흐름의 투명성이 높아졌다."],"a":2},{"id":"24-3-5","y":2024,"g":3,"n":5,"t":"정책 개념·가치·이념","f":"옳은 것 모두 고르기","s":["보편주의와 선별주의에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 보편주의는 시민권에 입각해 권리로서 복지를 제공하므로 비납세자는 사회복지 대상에서 제외한다.","ㄴ. 보편주의는 기여자와 수혜자를 구별하지 않는다.","ㄷ. 선별주의는 수급자격이 제한된 급여를 제공하기 위해 자산조사 또는 소득조사를 한다.","ㄹ. 보편주의자와 선별주의자 모두 사회적 평등성 또는 사회적 효과성을 나름대로 추구한다."],"c":["ㄷ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":5},{"id":"24-3-6","y":2024,"g":3,"n":6,"t":"재원·재정·조세·소득재분배","f":"옳은 것 고르기","s":["사회복지의 민간재원에 관한 설명으로 옳은 것은?"],"c":["사회복지의 민간재원에는 조세지출, 기부금, 기업복지, 퇴직금 등이 포함된다.","기부금 규모는 국세청이 추산한 액수보다 더 적을 것으로추정된다.","이용료는 클라이언트가 직접 지불한 것을 제외하고 사회보장기관 등의 제3자가 서비스 비용을 지불한 것을 의미한다.","기업복지는 기업이 그 피용자들에게 제공하는 임금과 임금 외 급여 또는 부가급여를 의미한다.","기업복지의 규모가 커질수록 노동자들 사이의 불평등이증가한다."],"a":5},{"id":"24-3-7","y":2024,"g":3,"n":7,"t":"재원·재정·조세·소득재분배","f":"옳은 것 고르기","s":["조세와 사회보험료에 관한 설명으로 옳은 것은?"],"c":["조세는 사회보험료에 비해 소득역진적이다.","조세와 사회보험료는 공통적으로 빈곤완화, 위험분산, 소득유지, 불평등 완화의 기능을 수행한다.","조세와 사회보험료는 공통적으로 상한선이 있어서 고소득층에 유리하다.","사회보험료를 조세로 보기는 하지만 임금으로 보지는 않는다.","개인소득세는 누진성이 강하고 일반소비세는 역진성이 강하다."],"a":5},{"id":"24-3-8","y":2024,"g":3,"n":8,"t":"전달체계·민간부문","f":"옳은 것 고르기","s":["길버트와 테렐(Gilbert &Terrell)이 주장한 전달체계의 개선전략 중 서비스에 대한 접근성 자체를 중요하게 간주하여 독자적인 서비스를 제공하려는 재구조화 전략은 무엇인가?"],"c":["중앙집중화(centralization)","사례수준 협력(case-level cooperation)","시민참여(citizen participation)","전문화된 접근구조(specialized access structure)","경쟁(competition)"],"a":4},{"id":"24-3-9","y":2024,"g":3,"n":9,"t":"복지국가 발달사·유형·이론","f":"옳은 것 모두 고르기","s":["사회복지정책의 발달을 설명하는 이론으로 옳은 것을 모두 고른 것은?","ㄱ. 시민권이론은 정치권, 공민권, 사회권의 순서로 발달한 것으로 본다.","ㄴ. 권력자원이론은 노동조합의 중앙집중화 정도, 좌파정당의 집권을 복지국가 발달의 변수로 본다.","ㄷ. 이익집단이론은 다양한 이익집단들의 정치적 활동을 통해 복지국가가 발달한 것으로 본다.","ㄹ. 국가중심이론은 국가 엘리트들과 고용주들의 의지와 능력에 의해 결정된다고 본다.","ㅁ. 수렴이론은 그 사회의 기술수준과 산업화 정도에 따라 사회복지의 발달이 수렴된다고 본다."],"c":["ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㅁ","ㄴ, ㄷ, ㄹ","ㄴ, ㄷ, ㅁ","ㄷ, ㄹ, ㅁ"],"a":4},{"id":"24-3-10","y":2024,"g":3,"n":10,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 고르기","s":["빈곤과 소득불평등의 측정에 관한 설명으로 옳은 것은?"],"c":["반물량 방식은 엥겔계수를 활용하여 빈곤선을 추정한다.","상대적 빈곤은 생존에 필요한 생활수준이 최소한의 수준에 도달하지 못한 상태를 말한다.","라이덴방식은 객관적 평가에 기초하여 빈곤선을 측정한다.","빈곤율은 빈곤층의 소득을 빈곤선 수준으로 끌어올리는데 필요한 총소득을 나타낸다.","지니계수가 1일 경우는 완전 평등한 분배상태를 의미한다."],"a":1},{"id":"24-3-11","y":2024,"g":3,"n":11,"t":"소득보장·공공부조·빈곤·불평등","f":"옳지 않은 것","s":["사회적 배제의 특성에 관한 설명으로 옳지 않은 것은?"],"c":["문제의 초점을 소득의 결핍으로 제한한다.","빈곤에 대해 다차원적으로 접근하는 개념이다.","빈곤의 역동성과 동태적 과정을 강조한다.","개인과 집단의 박탈과 불평등을 유발하는 다양한 영역을포괄한다.","사회적 관계망으로부터의 단절 문제를 제기한다."],"a":1},{"id":"24-3-12","y":2024,"g":3,"n":12,"t":"복지국가 발달사·유형·이론","f":"옳은 것 모두 고르기","s":["영국 사회복지정책의 역사에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 길버트법은 빈민의 비참한 생활과 착취를 개선하기 위해 원외구제를 허용했다.","ㄴ. 스핀햄랜드법은 빈민의 임금을 보충하기 위해 가족 수에 따라 보조금을 지급할 수 있게 했다.","ㄷ. 신빈민법은 열등처우의 원칙을 적용하였고 원내구제를 금지했다.","ㄹ. 왕립빈민법위원회의 소수파보고서는 구빈법의 폐지보다는 개혁을 주장했다.","ㅁ. 베버리지보고서를 근거로 하여 가족수당법, 국민부조법 등이 제정되었다."],"c":["ㄱ, ㄷ","ㄷ, ㅁ","ㄱ, ㄴ, ㅁ","ㄴ, ㄷ, ㄹ","ㄴ, ㄹ, ㅁ"],"a":3},{"id":"24-3-13","y":2024,"g":3,"n":13,"t":"사회서비스·기타 분야(노인·아동·장애·주거·교육)","f":"옳지 않은 것","s":["미국의 빈곤가족한시지원(TANF)에 관한 설명으로 옳지 않은 것은?"],"c":["수급기간 제한","개인 책임 강조","근로연계복지 강화","요보호아동가족부조(AFDC)와 병행","주정부의 역할과 기능 강화"],"a":4},{"id":"24-3-14","y":2024,"g":3,"n":14,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["국가가 주도적으로 사회복지를 제공해야 할 필요성으로 옳지 않은 것은?"],"c":["역선택","도덕적 해이","규모의 경제","능력에 따른 분배","정보의 비대칭"],"a":4},{"id":"24-3-15","y":2024,"g":3,"n":15,"t":"복지국가 발달사·유형·이론","f":"옳은 것 고르기","s":["에스핑-안데르센(G. Esping-Andersen)의 복지국가 유형에 관한 설명으로 옳은 것은?"],"c":["복지국가 유형을 탈상품화, 계층화 등을 기준으로 분류하였다.","보수주의 복지국가는 탈가족주의와 통합적 사회보험을강조한다.","자유주의 복지국가는 공공부조의 비중과 탈상품화 수준이 낮은 편이다.","사회민주주의 복지국가는 국가의 책임을 최소화하고 시장을 통해 문제해결을 한다.","보수주의 복지국가의 예로는 프랑스, 영국, 미국을 들 수있다."],"a":1},{"id":"24-3-16","y":2024,"g":3,"n":16,"t":"재원·재정·조세·소득재분배","f":"옳은 것 고르기","s":["소득재분배에 관한 설명으로 옳은 것은?"],"c":["수평적 재분배는 공공부조를 들 수 있다.","세대간 재분배는 부과방식 공적연금을 들 수 있다.","수직적 재분배는 아동수당을 들 수 있다.","단기적 재분배는 적립방식 공적연금을 들 수 있다.","소득재분배는 조세를 통해서만 발생한다."],"a":2},{"id":"24-3-17","y":2024,"g":3,"n":17,"t":"소득보장·공공부조·빈곤·불평등","f":"순서 나열","s":["다음에서 ㄱ, ㄴ을 순서대로 옳게 나열한 것은?","2024년 국민기초생활보장제도 수급자 선정 소득기준은 다음과 같다. 생계급여는 기준 중위소득의 ( ㄱ )% 이하, 주거급여는 기준 중위소득의 48% 이하, 의료급여는 기준 중위소득의 ( ㄴ )% 이하, 교육급여는 기준 중위소득의 50% 이하이다."],"c":["30, 30","30, 40","32, 30","32, 40","35, 40"],"a":4},{"id":"24-3-18","y":2024,"g":3,"n":18,"t":"사회서비스·기타 분야(노인·아동·장애·주거·교육)","f":"옳지 않은 것","s":["사회보장기본법상 사회서비스에 관한 설명으로 옳지 않은 것은?"],"c":["주체는 민간부문을 제외한 국가와 지방자치단체이다.","대상은 도움이 필요한 모든 국민이다.","분야는 복지, 보건, 의료, 교육, 고용, 주거, 문화, 환경등이다.","상담, 재활, 돌봄, 정보의 제공, 관련시설의 이용, 역량개발, 사회참여 지원 등을 내용으로 한다.","인간다운 생활을 보장하고 국민의 삶의 질이 향상되도록지원하는 제도이다."],"a":1},{"id":"24-3-19","y":2024,"g":3,"n":19,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 고르기","s":["우리나라 사회보험제도에 관한 설명으로 옳은 것은?(문제 오류로 가답안 발표시 4번으로 발표되었지만 확정답안 발표시 전항 정답 처리 되었습니다.)"],"c":["기여방식 공적연금은 국민연금, 특수직역연금, 기초연금으로 구분하여 운영된다.","고용보험의 고용안정 및 직업능력개발사업 보험료는 노사가 1/2씩 부담한다.","노인장기요양보험의 시설급여 제공기관에는 노인요양공동생활가정과 노인전문요양병원이 포함된다.","국민건강보험의 직장가입자 보험료는 노사가 1/2씩 부담하지만 사립학교 교직원은 국가가 20% 부담한다.","산업재해보상보험의 급여에는 상병수당과 상병보상연금이 있다."],"a":4},{"id":"24-3-20","y":2024,"g":3,"n":20,"t":"소득보장·공공부조·빈곤·불평등","f":"옳지 않은 것","s":["우리나라 공공부조제도에 관한 설명으로 옳지 않은 것은?"],"c":["긴급복지지원제도는 현금급여와 민간기관 연계 등의 지원을 제공한다.","국민기초생활보장제도 부양의무자 기준은 복지사각지대해소를 위해 단계적으로 완화되고 있다.","긴급복지지원제도는 단기 지원의 원칙, 선심사 후지원의원칙, 다른 법률 지원 우선의 원칙이 적용된다.","의료급여 수급권자에는 ｢입양특례법｣에 따라 국내 입양된 18세 미만의 아동이 포함된다.","국민기초생활보장제도 급여 신청은 신청주의와 직권주의를 병행하고 있다."],"a":3},{"id":"24-3-21","y":2024,"g":3,"n":21,"t":"소득보장·공공부조·빈곤·불평등","f":"빈칸 채우기","s":["다음에서 ㄱ, ㄴ을 합한 값은?","긴급복지지원제도의 생계급여 지원은 최대 ( ㄱ )회, 의료급여 지원은 최대 ( ㄴ )회, 주거급여는 최대 12회, 복지시설 이용은 최대 6회 지원된다."],"c":["4","6","8","10","12"],"a":3},{"id":"24-3-22","y":2024,"g":3,"n":22,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 모두 고르기","s":["사회보장의 특성에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 공공부조는 사회보험에 비해 권리성이 약하다.","ㄴ. 사회보험과 비교할 때 공공부조는 비용효과성이 높다.","ㄷ. 사회수당과 사회보험은 기여 여부를 급여 지급 요건으로 한다.","ㄹ. 사회보험과 공공부조는 방빈제도이고 사회수당은 구빈제도이다."],"c":["ㄱ","ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ"],"a":2},{"id":"24-3-23","y":2024,"g":3,"n":23,"t":"재원·재정·조세·소득재분배","f":"옳지 않은 것","s":["우리나라 근로장려세제(EITC)에 관한 설명으로 옳지 않은","것은?"],"c":["소득재분배 효과를 기대할 수 있다.","근로능력이 있는 저소득층의 근로유인을 제고한다.","소득과 재산보유상태 등을 반영하여 지급한다.","근로장려금 모형은 점증구간, 평탄구간, 점감구간으로 되어 있다.","사업자는 근로장려금을 받을 수 없다."],"a":5},{"id":"24-3-24","y":2024,"g":3,"n":24,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["사회보장 급여 중 현물급여가 아닌 것은?"],"c":["산업재해보상보험의 요양급여","고용보험의 상병급여","노인장기요양보험의 재가급여","국민기초생활보장의 의료급여","국민건강보험의 건강검진"],"a":2},{"id":"24-3-25","y":2024,"g":3,"n":25,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 모두 고르기","s":["보건복지부장관이 관장하는 사회보험제도를 모두 고른 것은?","ㄱ. 국민연금　　　　　　　　ㄴ. 국민건강보험","ㄷ. 산업재해보상보험　　　　ㄹ. 고용보험","ㅁ. 노인장기요양보험"],"c":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㅁ","ㄱ, ㄷ, ㄹ","ㄷ, ㄹ, ㅁ"],"a":3},{"id":"25-3-1","y":2025,"g":3,"n":1,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["사회복지정책의 목적으로 옳지 않은 것은?"],"c":["빈부 간 갈등 예방과 사회통합","개인의 자립과 성장","소득재분배에 의한 평등 추구","사회안전망 강화와 생존권 보장","개인의 능력에 따른 분배구조 확대"],"a":5},{"id":"25-3-2","y":2025,"g":3,"n":2,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["사회복지정책 가치인 연대에 관한 설명으로 옳지 않은 것은?"],"c":["사람들이 서로 의무감과 책임감을 느끼고 함께 하려는 상태를 의미한다.","일반적으로 동질성과 동등성을 갖지 못한 대상에 대한 배타성을 갖게 된다.","이질성과 개인화가 강조되는 상태에서 유지되는 연대를유기적 연대라고 한다.","최근 우리나라에서는 노동시장의 변화로 노동자들 간 동질성이 더욱 강화되었다.","장애인의무고용은 연대를 제도화한 것이다."],"a":4},{"id":"25-3-3","y":2025,"g":3,"n":3,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["마이클 샌델(M. Sandel)의 정의에 관한 설명으로 옳지 않은것은?"],"c":["절차적 장치로써 무지의 베일 활용","도덕에 기초하는 정치","불평등 해소방법, 연대, 시민의 미덕","시장의 도덕적 한계를 인정","시민의식, 희생, 봉사"],"a":1},{"id":"25-3-4","y":2025,"g":3,"n":4,"t":"복지국가 발달사·유형·이론","f":"순서 나열","s":["사회복지정책의 역사를 세 단계로 나눌 때 ( )에 들어갈 내용을 순서대로 나열한 것은?","| | 대상자 | 사회복지 주체 | 권리수준 |","|---|---|---|---|","| 빈민법 | 걸인, 부랑인, 구제가치가 있는 빈민 | ( ㄱ ) | 무권리, 정책당국의 재량 |","| 사회보험 | 노동자 계급 | 국가, 노동조합 | ( ㄴ ) |","| 복지국가 | ( ㄷ ) | 국가, 시민단체 | 시민권 |"],"c":["ㄱ: 노동조합 ㄴ: 계약에 입각한 권리 ㄷ: 노동자 계급","ㄱ: 국가, 노동조합 ㄴ: 시민권 ㄷ: 노동자 계급","ㄱ: 국가, 교회, 영주 ㄴ: 계약에 입각한 권리 ㄷ: 시민,개인","ㄱ: 노동조합 ㄴ: 정책 당국의 재량 ㄷ: 시민, 개인","ㄱ: 국가, 교회, 영주 ㄴ: 시민권 ㄷ: 노동자 계급"],"a":3},{"id":"25-3-5","y":2025,"g":3,"n":5,"t":"복지국가 발달사·유형·이론","f":"옳은 것 고르기","s":["제2차 세계대전 이후 서구 복지국가의 전개과정에 관한 설명으로 옳은 것은?"],"c":["노동과 자본의 극단적인 대립","대규모 재분배를 가능하게 하는 케인즈주의 경제정책","자유방임 자본주의를 옹호하는 사상 확산","공공부조 위주의 사회보장체계 구축","가족과 시장의 책임강조"],"a":2},{"id":"25-3-6","y":2025,"g":3,"n":6,"t":"정책 개념·가치·이념","f":"옳은 것 모두 고르기","s":["중상주의에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 15세기 중반부터 18세기 중반까지 유럽대륙을 지배하였던 경제사상을 지칭하는 용어이다.","ㄴ. 국가유지에 필요한 비용을 마련하기 위해 식민지 개척과 무역정책을 추진하였다.","ㄷ. 식량부족으로 인구증가 억제정책을 추진하였다.","ㄹ. 빈민들의 근면성을 위해 임금수준을 낮게 유지하고자 하였다."],"c":["ㄱ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"25-3-7","y":2025,"g":3,"n":7,"t":"재원·재정·조세·소득재분배","f":"옳은 것 고르기","s":["재분배에 관한 설명으로 옳은 것은?"],"c":["건강보험은 건강한 사람으로부터 질병을 겪는 사람에게자원을 재분배한다.","고용보험은 수직적 재분배효과가 가장 크다.","정부는 최소극대화의 원칙에 따라 불평등을 완화하기 위해 모든 대상자에게 동일한 보험료를 부과한다.","민간에서 이루어지는 자선활동에서는 파레토 개선 효과가나타나지 않는다.","사회민주주의에서는 개인의 효용관점에서 재분배를 정당화한다."],"a":1},{"id":"25-3-8","y":2025,"g":3,"n":8,"t":"소득보장·공공부조·빈곤·불평등","f":"옳지 않은 것","s":["사회적 배제에 관한 설명으로 옳지 않은 것은?"],"c":["생활수준은 소득이나 재화뿐만 아니라 개인역량의 실현을중심으로 판단되어야 한다.","사회적 배제의 범위에는 빈곤, 저학력, 열악한 주거환경등 다양한 영역을 포괄한다.","사회적 배제는 기본적으로 소득빈곤 개념의 협소성에 대한 비판으로 이해될 수 있다.","사회적 배제 개념은 빈곤에 이르는 과정보다는 빈곤이라는 결과적인 상태에 초점을 둔다.","불평등과 빈곤 개념은 소득의 차원을 넘어 다양한 차원으로 확대되어야 한다."],"a":4},{"id":"25-3-9","y":2025,"g":3,"n":9,"t":"전달체계·민간부문","f":"옳은 것 고르기","s":["길버트(N. Gilbert)가 주장한 권능부여국가(enabling state)의주요 요소에 해당하는 것은?"],"c":["사회적 지원, 노동의 재상품화, 공공기관에 의한 제공, 권리의 공유를 통한 연대","사회적 포섭, 노동의 탈상품화, 민간기관에 의한 제공, 사회권으로서의 급여","사회적 포섭, 노동의 재상품화, 민영화, 사회권으로서의급여","근로촉진, 선별적 표적화, 민영화, 사회적 의무와 연계된급여","근로촉진, 생활임금, 공적 운영, 사회적 의무와 연계된 급여"],"a":4},{"id":"25-3-10","y":2025,"g":3,"n":10,"t":"정책과정·결정모형·분석·평가","f":"사례·제시문 판단","s":["다음에서 설명하고 있는 정책결정모형은?","○ 큰 범위에서의 기본적인 결정은 합리적으로 이루어지지만, 세부적 결정은 기본적 결정을 보완·수정하며 점증적으로 이루어진다고 주장하는 정책결정모형이다.","○ 기본적 결정은 전체적인 방향을 설정하기 위해 중요한 대안을 탐색한 후에 이루어진다.","○ 두 개의 대립되는 극단의 모형들을 절충한 것에 지나지 않는다는 비판이 있다."],"c":["쓰레기통모형","점증모형","혼합모형","만족모형","최적모형"],"a":3},{"id":"25-3-11","y":2025,"g":3,"n":11,"t":"정책 개념·가치·이념","f":"순서 나열","s":["사회복지 급여형태 중 운영효율성이 가장 높은 급여와 목표효율성이 가장 높은 급여를 순서대로 짝지은 것은?","ㄱ. 현금　　ㄴ. 증서(바우처)　　ㄷ. 현물　　ㄹ. 기회"],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄷ, ㄹ","ㄹ, ㄷ"],"a":2},{"id":"25-3-12","y":2025,"g":3,"n":12,"t":"재원·재정·조세·소득재분배","f":"옳지 않은 것","s":["사회복지 공공재원에 관한 설명으로 옳지 않은 것은?"],"c":["조세는 다른 재원에 비해서 평등을 구현하는데 용이하다.","사회보험료는 소득세에 비해 상대적으로 조세저항이 약하다.","사회보험료는 조세와 비교해 상대적으로 소득재분배 효과가 약하다.","소득세 누진성이 낮을수록 재분배효과가 크다.","조세는 재원의 안정성과 지속성이 가장 강하다."],"a":4},{"id":"25-3-13","y":2025,"g":3,"n":13,"t":"전달체계·민간부문","f":"옳은 것 고르기","s":["사회복지서비스 공급주체로서 중앙정부에 관한 설명으로 옳은 것은?"],"c":["서비스 수혜자의 정책결정과정 참여가 용이하다.","지역주민의 욕구에 신속하게 대응할 수 있다.","서비스의 지속성과 안정성 확보에 유리하다.","사회통합의 저해 우려가 있고 규모의 경제 실현이 어렵다.","이용자의 다양한 선택권을 보장하는데 유리하다."],"a":3},{"id":"25-3-14","y":2025,"g":3,"n":14,"t":"전달체계·민간부문","f":"옳은 것 모두 고르기","s":["사회복지전달체계에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 사회복지서비스의 제공자들 사이 또는 공급자와 수급자 사이를 연결하기 위한 조직적, 구조적, 기능적 장치이다.","ㄴ. 사회복지전달체계의 운영주체는 크게 공공과 민간으로 나눌 수 있다.","ㄷ. 사회복지전달체계를 발전시키기 위해서는 서비스의 분열성, 불연속성, 무책임성, 비접근성을 배제해야 한다.","ㄹ. 비영리 민간사회복지기관은 공공부문과 연계하며 서비스를 제공하기도 한다."],"c":["ㄱ","ㄱ, ㄹ","ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"25-3-15","y":2025,"g":3,"n":15,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 모두 고르기","s":["현물급여를 모두 고른 것은?","ㄱ. 노인장기요양보험의 재가급여","ㄴ. 산업재해보상보험의 요양급여","ㄷ. 국민건강보험의 건강검진","ㄹ. 국민기초생활보장제도의 생계급여"],"c":["ㄱ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"25-3-16","y":2025,"g":3,"n":16,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["현재 우리나라의 사회복지제도 중 보편주의적 성격에 해당하지 않는 것은?"],"c":["아동수당","기초연금","의무교육","무상급식","건강보험"],"a":2},{"id":"25-3-17","y":2025,"g":3,"n":17,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 모두 고르기","s":["산업재해보상보험에서 업무상 재해 인정기준에 해당하는 것을 모두 고른 것은?","ㄱ. 사업주가 주관한 행사준비 중에 발생한 사고","ㄴ. 휴게시간 중 사업주의 지배관리하에 있다고 볼 수 있는 행위로 발생한 사고","ㄷ. 통상적인 경로와 방법으로 출·퇴근하는 중 발생한 사고","ㄹ. 직장 내 괴롭힘으로 인한 업무상 정신적 스트레스가 원인이 되어 발생한 질병"],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"25-3-18","y":2025,"g":3,"n":18,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 모두 고르기","s":["국민연금제도에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 국민연금공단은 관리운영과 보험료 징수를 담당한다.","ㄴ. 기본연금액의 균등부분은 연금수급 전 3년간 전체 가입자 평균소득월액의 평균액이다.","ㄷ. 기본연금액의 균등부분에서 소득재분배 효과가 나타난다.","ㄹ. 기본연금액의 소득비례부분은 전체 가입자의 기준소득월액의 평균액이다.","ㅁ. 2028년 이후 국민연금의 소득대체율은 40년 가입 기준 40%이다."],"c":["ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄹ, ㅁ","ㄴ, ㄷ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"],"a":4},{"id":"25-3-19","y":2025,"g":3,"n":19,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 고르기","s":["건강보험 진료비 지불제도에 관한 설명으로 옳은 것은?"],"c":["행위별 수가제는 질병 범주별로 구분하여 고정금액을 보수로 지불하는 방식이다.","포괄수가제는 의사가 담당하는 환자 수에 비례하여 일정금액을 지급하는 방식이다.","행위별 수가제는 행정절차가 간소하여 비용절감효과가있다.","우리나라는 포괄수가제를 일부 질병군에 적용하고 있다.","포괄수가제는 의료기관의 1년간 운영비를 포괄적으로 지불하는 제도이다."],"a":4},{"id":"25-3-20","y":2025,"g":3,"n":20,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳지 않은 것","s":["노인장기요양보험제도에 관한 설명으로 옳지 않은 것은?"],"c":["가족요양비는 신체ㆍ정신 등의 사유로 인하여 가족에게요양을 받아야 하는 자에게 지급할 수 있다.","재가급여로 분류되는 단기보호의 급여기간은 월 9일 이내를 원칙으로 하되 특별한 사유가 있는 경우 연장 가능하다.","장기요양등급판정을 받은 65세 이상 노인은 소득수준과상관없이 장기요양보험 급여를 받을 수 있다.","일반 노인장기요양보험 가입자는 재가급여를 이용할 경우 15 %의 본인부담금을 부담하여야 한다.","노인요양공동생활가정은 5인 이상 15인 이하로 운영된다."],"a":5},{"id":"25-3-21","y":2025,"g":3,"n":21,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 고르기","s":["공공부조와 사회보험의 차이에 관한 설명으로 옳은 것은?"],"c":["사회보험은 주로 보험료로 재정을 충당하며, 공공부조는조세로 충당한다.","사회보험은 사후적인 성격이 강한 반면 공공부조는 예방적인 성격이 강하다.","사회보험과 공공부조 모두 빈곤을 예방하는데 목적이 있다.","공공부조가 사회보험보다 계약적 권리성이 강하다.","사회보험은 중앙과 지방정부가, 공공부조는 정부가 위임한 관리운영기구가 운영주체이다."],"a":1},{"id":"25-3-22","y":2025,"g":3,"n":22,"t":"사회서비스·기타 분야(노인·아동·장애·주거·교육)","f":"옳은 것 고르기","s":["사회서비스에 관한 설명으로 옳은 것은?"],"c":["수급자 등 빈곤층만을 대상으로 한다.","주로 바우처 방식으로 수요자를 지원한다.","전액 국비로 지원한다.","단일 기관이 독점하여 공급한다.","주로 획일화된 서비스를 제공한다."],"a":2},{"id":"25-3-23","y":2025,"g":3,"n":23,"t":"소득보장·공공부조·빈곤·불평등","f":"옳지 않은 것","s":["최저임금제에 관한 설명으로 옳지 않은 것은?"],"c":["우리나라에서는 최저임금제가 2000년부터 실시되었다.","최저임금제는 정신장애로 근로능력이 현저히 낮은 사람에게는 적용되지 않는다.","최저임금제는 근로자에게 최저한의 생계를 유지할 수 있는 수준의 임금을 보장하기 위한 제도이다.","최저임금제는 저임금 근로자의 증가를 억제하는 장치로작용할 수 있다.","최저임금제는 사회보장 급여수준에 영향을 미칠 수 있다."],"a":1},{"id":"25-3-24","y":2025,"g":3,"n":24,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["도덕적 해이에 관한 설명으로 옳지 않은 것은?"],"c":["도덕적 해이는 보험계약이 가입자들의 행동에 영향을 미치는 현상이다.","도덕적 해이는 보험가입 집단의 크기가 클수록 약화된다.","도덕적 해이는 실업보험에서 발생할 가능성이 높다.","도덕적 해이는 건강보험 진료비 본인부담을 정당화하는논리로 사용된다.","도덕적 해이가 심각해지면 민간보험사의 보험료 상승으로 이어질 수 있다."],"a":2},{"id":"25-3-25","y":2025,"g":3,"n":25,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 고르기","s":["사회보험과 민간보험에 관한 설명으로 옳은 것은?"],"c":["사회보험은 조세를 주된 재원으로 한다.","민간보험은 사회보험보다 사회적 적절성이 중요하다.","사회보험은 개인에게 발생할 수 있는 모든 위험을 대상으로 한다.","민간보험은 물가상승에 따른 실질가치의 변동을 보장한다.","사회보험 급여는 민간보험 급여보다 법적 권리성이 강하다."],"a":5},{"id":"26-3-1","y":2026,"g":3,"n":1,"t":"정책 개념·가치·이념","f":"옳은 것 고르기","s":["윌렌스키와 르보(H. Wilensky &C. Lebeaux)가 구분한 사회복지의 개념에 관한 설명으로 옳은 것은?"],"c":["잔여적 개념은 사회문제의 원인을 사회구조로 본다.","제도적 개념은 국가의 적극적 역할을 강조한다.","제도적 개념에서 사회복지는 낙인효과가 크다.","잔여적 개념에서 사회복지는 예방과 재활이 제도화되어있다.","제도적 개념은 사회복지를 시혜나 자선으로 본다."],"a":2},{"id":"26-3-2","y":2026,"g":3,"n":2,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["신자유주의 이념이 등장한 시기의 사회경제적 배경으로 옳지 않은 것은?"],"c":["사회보장제도의 민영화로 인한 불평등의 증가","1970년대 기름값 상승에 따른 석유파동","스테그플레이션의 시작","완전고용의 종식과 함께 대량실업의 발생","경제성장의 정체로 복지국가의 재정적 위기 도래"],"a":1},{"id":"26-3-3","y":2026,"g":3,"n":3,"t":"복지국가 발달사·유형·이론","f":"옳은 것 모두 고르기","s":["사회보험제도의 발달에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 미국의 사회보장법(1935)은 대공황이라는 경제문제를 극복하기 위해 도입되었다.","ㄴ. 세계 최초로 실업에 대한 사회보험원리가 적용된 실업보험은 독일에서 도입되었다.","ㄷ. 비스마르크 사회보험은 노동자의 불만을 해소시켜 사회통합을 기하려는 의도로 도입되었다.","ㄹ. 영국의 국민보험법(1911)은 베버리지가 제안한 보편적이고 통일된 사회보험체계를 구체화한 것이다."],"c":["ㄹ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":2},{"id":"26-3-4","y":2026,"g":3,"n":4,"t":"복지국가 발달사·유형·이론","f":"옳은 것 모두 고르기","s":["사회복지정책의 발달을 설명하는 이론 중 정치적 요인을 강조한 이론을 모두 고른 것은?","ㄱ. 수렴이론　　　　　　　　ㄴ. 권력자원이론","ㄷ. 사회통제이론　　　　　　ㄹ. 이익집단이론","ㅁ. 사회양심이론"],"c":["ㄱ, ㄹ","ㄱ, ㅁ","ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄷ, ㄹ, ㅁ"],"a":4},{"id":"26-3-5","y":2026,"g":3,"n":5,"t":"복지국가 발달사·유형·이론","f":"옳지 않은 것","s":["영국 구빈제도에 관한 설명으로 옳지 않은 것은?","지급하였다."],"c":["엘리자베스구빈법(1601): 노동능력이 있는 빈민을 교정원이나 노역장에 수용하였다.","정주법(1662): 빈민의 자유로운 이동을 제한하였다.","길버트법(1782): 빈민처우의 개선을 목적으로 원외구호를마련하였다.","스핀햄랜드법(1795): 일정소득 이하의 빈민에게 보조금을","신구빈법(1834): 빈민구제에 대한 국가의 책임을 최초로제도화하였다."],"a":5},{"id":"26-3-6","y":2026,"g":3,"n":6,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["복지이념 중 '제3의 길'에 관한 설명으로 옳지 않은 것은?"],"c":["결과의 평등보다는 기회의 평등을 강조한다.","개인의 권리와 책임의 호혜성을 강조한다.","외부로부터 간섭이 없는 소극적 자유를 강조한다.","복지공급의 주체로 복지혼합을 강조한다.","복지의존의 문제를 해결하기 위해 근로연계복지를 강조한다."],"a":3},{"id":"26-3-7","y":2026,"g":3,"n":7,"t":"정책 개념·가치·이념","f":"옳은 것 모두 고르기","s":["분배정의에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 자유지상주의에서는 국가의 조세 징수를 통한 재분배는 정당한 것으로 본다.","ㄴ. 공리주의에서는 저소득층의 한계효용이 고소득층에 비해 크기 때문에 재분배는 사회 전체의 총효용을 증가시키는 것으로 본다.","ㄷ. 롤즈(J. Rawls)는 가장 혜택을 받지 못한 최소 수혜자 계층에게 유익한 결과를 가져온다면 차등적 분배는 정당하다고 본다.","ㄹ. 마르크스(K. Marx)는 공정한 분배는 생산수단의 사회화가 이루어진 이후에 가능한 것으로 본다."],"c":["ㄱ, ㄹ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":5},{"id":"26-3-8","y":2026,"g":3,"n":8,"t":"복지국가 발달사·유형·이론","f":"옳은 것 고르기","s":["에스핑-안데르센(G. Esping-Andersen)의 3가지 복지국가 유형에 관한 설명으로 옳은 것은?"],"c":["자유주의 복지국가는 탈상품화 수준이 가장 높다.","보수주의 복지국가는 탈상품화 수준이 높고 계층화 수준은 낮다.","사회민주주의 복지국가는 탈가족화 수준이 높고 계층화수준은 낮다.","자유주의 복지국가는 탈가족화 수준이 낮고 계층화 수준도 낮다.","보수주의 복지국가는 탈가족화 수준이 가장 높다."],"a":3},{"id":"26-3-9","y":2026,"g":3,"n":9,"t":"정책 개념·가치·이념","f":"옳은 것 고르기","s":["사회복지정책의 제도와 가치에 관한 설명으로 옳은 것은?"],"c":["사회보험제도는 소극적 자유를 제한하여 위험에 직면한사람들의 적극적 자유를 신장시킨다.","아픈 사람에게 더 많은 의료자원을 분배하는 것은 수량적평등에 해당한다.","우리나라 아동수당제도는 비례적 평등을 구현한 것이다.","퇴직연금제도는 세대간 연대라는 가치에 기반한 제도이다.","아동을 대상으로 한 디딤씨앗통장은 소극적 자유의 가치를 제도화한 것이다."],"a":1},{"id":"26-3-10","y":2026,"g":3,"n":10,"t":"정책 개념·가치·이념","f":"옳지 않은 것","s":["사회복지정책의 평가에 관한 설명으로 옳지 않은 것은?","였는가?"],"c":["형평성 평가: 비용과 편익이 대상자들에게 공평하게 배분되었는가?","효율성 평가: 최대산출을 위해 비용을 얼마나 최소화 하","효과성 평가: 목표를 얼마나 달성하였는가?","영향 평가: 대상자들이 얼마나 만족하였는가?","접근성 평가: 대상자들이 시간적, 지리적으로 쉽게 이용할 수 있었는가?"],"a":4},{"id":"26-3-11","y":2026,"g":3,"n":11,"t":"정책과정·결정모형·분석·평가","f":"옳은 것 고르기","s":["정책결정 모형 중 점증모형에 관한 설명으로 옳은 것은?"],"c":["조직화된 혼돈상태에서 몇 가지 흐름이 우연히 반영되어결정된다.","정책결정자는 이익을 극대화하려는 경제적 목적에 따라합리적이고 최선의 대안을 찾는다.","기존 정책, 전년도 예산에 기초하여 대안을 부분적으로수정하여 결정한다.","정책결정을 수행하는 합법적인 제도는 정부이며, 정책결정은 정부조직 간의 활동이다.","비용보다는 효과가 더 높아야 한다는 것을 전제로 정책이 결정된다."],"a":3},{"id":"26-3-12","y":2026,"g":3,"n":12,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳지 않은 것","s":["사회복지정책과 급여형태의 연결이 옳지 않은 것은?"],"c":["기초연금 – 현금","고용보험의 구직급여 - 현물","국민연금의 노령연금 – 현금","산모ㆍ신생아 건강관리 지원사업 - 바우처","노인장기요양보험의 재가급여 - 현물"],"a":2},{"id":"26-3-13","y":2026,"g":3,"n":13,"t":"재원·재정·조세·소득재분배","f":"옳은 것 모두 고르기","s":["우리나라 사회복지의 재원에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 소득세와 소비세는 개인이 부담하는 것으로 민간재원에 해당한다.","ㄴ. 사회보험료는 소득에 따라 보험료율이 증가한다.","ㄷ. 근로장려금 제도는 조세비용에 해당된다.","ㄹ. 자발적 기부는 개인, 재단 등을 통해 제공되며, 사회복지프로그램의 지속성을 보장한다."],"c":["ㄷ","ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"a":1},{"id":"26-3-14","y":2026,"g":3,"n":14,"t":"전달체계·민간부문","f":"옳지 않은 것","s":["사회복지전달체계에 관한 설명으로 옳지 않은 것은?"],"c":["국민연금제도는 지방정부와 민간의 혼합체계로 운영된다.","공적전달체계로 중앙정부와 지방정부가 있다.","사회복지전달체계가 갖춰야 할 속성으로 접근성, 통합성,연속성, 책임성이 있다.","사회복지시설의 운영을 민간에게 위탁하는 형태는 공공ㆍ민간 혼합체계의 한 종류이다.","사회복지 공급주체가 다양하게 나타나는 것을 복지다원주의라고 한다."],"a":1},{"id":"26-3-15","y":2026,"g":3,"n":15,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 모두 고르기","s":["사회복지의 급여 대상을 규정하는 기준으로 옳은 것을 모두 고른 것은?","ㄱ. 근로연계복지는 노동능력이 있는 사람이 급여 대상이 될 때 노동참여를 조건으로 지급한다.","ㄴ. 자활급여는 자산조사를 시행하며 급여를 제공한다.","ㄷ. 독립유공자에게 제공하는 급여는 사회적 기여에 대한 인정이다.","ㄹ. 부모급여는 인구학적 조건에 의해 대상자가 정해진다."],"c":["ㄱ","ㄴ, ㄷ","ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"26-3-16","y":2026,"g":3,"n":16,"t":"정책 개념·가치·이념","f":"옳은 것 모두 고르기","s":["사회복지제도 중 보편주의 성격에 해당하는 것을 모두 고른 것은?","ㄱ. 아동수당　　　　　　　　ㄴ. 의료급여","ㄷ. 의무교육　　　　　　　　ㄹ. 무상급식"],"c":["ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"26-3-17","y":2026,"g":3,"n":17,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳은 것 고르기","s":["우리나라 사회복지제도 중 사회보험에 해당하는 것은?"],"c":["긴급복지지원","기초연금","장애인연금","노인맞춤돌봄서비스","노인장기요양보험"],"a":5},{"id":"26-3-18","y":2026,"g":3,"n":18,"t":"소득보장·공공부조·빈곤·불평등","f":"옳은 것 고르기","s":["국민기초생활보장제도에 관한 설명으로 옳은 것은?"],"c":["중앙정부가 전담하여 운영한다.","재원은 조세로 충당한다.","절대빈곤선을 이용하여 대상자를 선정한다.","빈곤예방이 주 목적이다.","소득 상위 30%를 제외하고 급여의 권리를 보장한다."],"a":2},{"id":"26-3-19","y":2026,"g":3,"n":19,"t":"사회보험(연금·건강·장기요양·고용·산재)","f":"옳지 않은 것","s":["우리나라 국민연금제도에 관한 설명으로 옳지 않은 것은?"],"c":["사회보험제도이므로 강제가입이 의무이다.","고소득계층에서 저소득계층으로 수직적 소득재분배기능이 있다.","출산 및 군복무의 경우 가입기간을 추가로 인정한다.","2025년에 만60세로 퇴직한 경우 노령연금 수급자격이만65세이므로 5년간의 소득공백이 발생한다.","일정소득수준 이상이 되면 더 이상 보험료 상승이 발생하지 않는다."],"a":4},{"id":"26-3-20","y":2026,"g":3,"n":20, 혁해야한다는 기본개념을 가졌다.","인보관운동은 빈곤의 원인을 산업화의 결과로 보았다."],"a":4},{"id":"17-2-2","y":2017,"g":2,"n":2,"t":"실천현장·전달체계","f":"옳은 것 고르기","s":["생활시설에 해당하는 것은?"],"c":["아동보호치료시설","아동보호전문기관","영유아보육시설","지역아동센터","가정위탁지원센터"],"a":1},{"id":"17-2-3","y":2017,"g":2,"n":3,"t":"가치와 윤리","f":"옳지 않은 것","s":["우리나라 사회복지사 윤리강령의 내용에 해당하지 않는 것은?"],"c":["사회복지사는 사회환경을 개선하고 사회정의를 증진시키기 위한 사회정책의 수립ㆍ발전ㆍ입법ㆍ집행을 요구하고 옹호해야 한다.","클라이언트를 대상으로 연구하는 사회복지사는 저들의 권리를 보장하기 위해 자발적이고 고지된 동의를 얻어야 한다.","사회복지사는 클라이언트의 지불능력에 상관없이 서비스를 제공해야 하며 이를 이유로 차별대우를 해서는 안 된다.","사회복지사는 어떠한 상황에서도 클라이언트와 부적절한성적 관계를 가져서는 안 된다.","사회복지사는 기관의 부당한 정책이나 요구에 대하여 전문직의 가치와 지식을 근거로 이에 대응하고 즉시 시ㆍ군ㆍ구에 보고해야 한다."],"a":5},{"id":"17-2-4","y":2017,"g":2,"n":4,"t":"실천 개념·역사·발달과정","f":"옳지 않은 것","s":["사회복지실천 전문직으로의 발전과정에서 플렉스너(A. Flexner)의 비판에 대한 반응에 해당하지 않는 것은?"],"c":["리치몬드(M. Richmond)가 사회진단(Social diagnosis)을출간하였다.","밀포드(Milford)회의에서 개별사회사업 방법론을 기본으로하는 사회복지실천의 공통요소가 정리되어 발표되었다.","미국사회복지사협회(American Association of SocialWorkers)가 설립되었다.","의사인 카보트(R. Cabot)가 매사추세츠병원에 의료사회복지사를 정식으로 채용하였다.","사회복지사들이 치료자로서의 역할을 강조하면서 위상을높이고자 하였다."],"a":4},{"id":"17-2-5","y":2017,"g":2,"n":5,"t":"실천현장·전달체계","f":"옳은 것 고르기","s":["사회복지실천현장 중 보건복지부가 주무부처인 시설은?"],"c":["청소년쉼터","자립지원시설","청소년상담복지센터","다문화가족지원센터","건강가정지원센터"],"a":2},{"id":"17-2-6","y":2017,"g":2,"n":6,"t":"가치와 윤리","f":"옳은 것 고르기","s":["레비(C. Levy)가 제시한 사회복지전문직의 가치 중 수단에 관한 가치에 해당하는 것은?"],"c":["소속의 욕구","건설적 변화에 대한 능력과 열망","자기결정권 존중","상호책임성","인간의 공통된 욕구"],"a":3},{"id":"17-2-7","y":2017,"g":2,"n":7,"t":"실천모델·이론적 관점","f":"옳지 않은 것","s":["강점관점에 관한 설명으로 옳지 않은 것은?"],"c":["개인을 진단에 따른 증상을 가진 자로 규정한다.","개입의 초점이 가능성에 있다.","외상과 학대 경험은 클라이언트에게 도전과 기회의 원천이 될 수 있다.","모든 환경 속에는 활용 가능한 자원이 있다.","사회복지사와 클라이언트의 협동 작업이 이루어질 때 클라이언트에게 최선의 도움이 주어질 수 있다."],"a":1},{"id":"17-2-8","y":2017,"g":2,"n":8,"t":"실천 개념·역사·발달과정","f":"옳은 것 모두 고르기","s":["법정 국가자격을 모두 고른 것은?","ㄱ. 사회복지사　　　　　ㄴ. 의료사회복지사","ㄷ. 학교사회복지사　　　ㄹ. 정신보건사회복지사"],"c":["ㄱ","ㄱ, ㄴ","ㄱ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":3},{"id":"17-2-9","y":2017,"g":2,"n":9,"t":"실천모델·이론적 관점","f":"옳지 않은 것","s":["통합적 맞는 개입전략 개발"],"a":5},{"id":"17-2-16","y":2017,"g":2,"n":16,"t":"관계 형성·면접·의사소통","f":"옳은 것 모두 고르기","s":["면접과정에서의 질문으로 적절한 것을 모두 고른 것은?","ㄱ. 부인은 남편의 행동에 대해 어떻게 대응하셨나요?","ㄴ. 그 민감한 상황에서 왜 그런 말을 하셨지요?","ㄷ. 이번처럼 갈등이 심각한 적은 몇 번 정도 되나요?","ㄹ. 그때 아내의 반응은 어땠나요? 죄책감이 들지는 않았나요"],"c":["ㄹ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":2},{"id":"17-2-17","y":2017,"g":2,"n":17,"t":"실천모델·이론적 관점","f":"옳은 것 모두 고르기","s":["역량강화(empowerment) 실천 활동으로 옳은 것을 모두 고른 것은?","ㄱ. 클라이언트와 협력","ㄴ. 생태체계적 관점 적용","ㄷ. 사회변화를 위한 행동에 참여","ㄹ. 억압받는 집단에 대한 역사적 관점 이해"],"c":["ㄹ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"17-2-18","y":2017,"g":2,"n":18,"t":"사례관리","f":"옳지 않은 것","s":["사례관리에 관한 설명으로 옳지 않은 것은?"],"c":["클라이언트 중심적 서비스이다.","종결이 어려운 장기적 욕구를 갖는 대상자에게 적절하다.","상담이나 조언, 치료 등의 임상적 개입을 할 수 있다.","한 기관 내에서의 팀 협력 및 지역사회 타 전문 분야와의 협력이 중요하다.","공공부문의 역할을 확대하기 위한 목적에서 시작되었다."],"a":5},{"id":"17-2-19","y":2017,"g":2,"n":19,"t":"관계 형성·면접·의사소통","f":"옳지 않은 것","s":["직면(confrontation) 기법에 관한 설명으로 옳지 않은 것은?"],"c":["클라이언트의 말과 행동 간에 모순이 있으나 클라이언트가 이를 부인하고 인정하기를 거부하는 경우에 사용될 수 있다.","클라이언트가 극심한 정서적 긴장 상태에 있을 때는 사용하지 않는 것이 좋다.","클라이언트에게 방어적 반응을 불러일으킬 수 있다.","클라이언트가 자신의 결정이나 행동이 실제로 합리적임에도 이에 대한 확신을 갖지 못하고 주저할 때 사용된다.","클라이언트와의 신뢰관계가 충분히 형성된 뒤에 사용하는 것이 유용하다."],"a":4},{"id":"17-2-20","y":2017,"g":2,"n":20,"t":"실천과정(접수~종결·평가·기록)","f":"순서 나열","s":["사례관리 과정을 순서대로 바르게 나열한 것은?"],"c":["아웃리치 → 사정 → 점검 → 계획 → 재사정","아웃리치 → 사정 → 계획 → 재사정 → 점검","사정 → 아웃리치 → 계획 → 재사정 → 점검","사정 → 아웃리치 → 재사정 → 계획 → 점검","아웃리치 → 사정 → 계획 → 점검 → 재사정"],"a":5},{"id":"17-2-21","y":2017,"g":2,"n":21,"t":"실천모델·이론적 관점","f":"옳지 않은 것","s":["문제에 대한 관점이나 인식을 변화시켜 새로운 이해를 촉진하는 개입 기법이 아닌 것은?"],"c":["모델링","직면","재명명","일반화","재보증"],"a":1},{"id":"17-2-22","y":2017,"g":2,"n":22,"t":"사회복지사 역할·기술","f":"옳은 것 고르기","s":["표적문제(target problem) 선정 시 고려할 사항으로 옳은 것은?"],"c":["표적문제는 가능한 많이 선정하는 것이 좋다.","사회복지사와 클라이언트 중 어느 한 쪽에서 문제로 인식하는 것은 모두 표적문제로 선정한다.","표적문제의 우선순위를 정할 때 사회복지사의 전문적 판단을 중심으로 한다.","표적문제를 선정할 때 사회복지사 자신의 지식과 기술을고려한다.","표적문제는 전문적 용어로 기술되는 것이 바람직하다."],"a":4},{"id":"17-2-23","y":2017,"g":2,"n":23,"t":"사정·사정도구","f":"옳지 않은 것","s":["자료수집에 관한 설명으로 옳지 않은 것은?"],"c":["자료수집은 실천의 전 과정에 걸쳐 이루어지는 지속적인과정이다.","접수단계에서의 자료수집은 클라이언트 문제와 기관의서비스 간 부합 여부를 판단하는데 필요한 정도면 충분하다.","클라이언트와 사회복지사의 상호작용 유형은 클라이언트와 제3자의 상호작용 유형을 짐작할 수 있게 한다.","클라이언트의 언어적 표현과 비언어적 행동이 일치하지않을 경우 언어적 표현에 더 주의를 기울여야 한다.","수집된 자료는 클라이언트를 둘러싼 주변 체계에 대한정보도 포함해야 한다."],"a":4},{"id":"17-2-24","y":2017,"g":2,"n":24,"t":"사례관리","f":"옳은 것 모두 고르기","s":["사례관리자의 역할로 옳은 것을 모두 고른 것은?","ㄱ. 사례관리자는 기관 정책상 클라이언트에게 서비스를 제공해 주기 어려울 때 다른 기관에 의뢰한다.","ㄴ. 사례관리자는 기관의 정책이 클라이언트에게 불리하다고 판단될 때 기관의 정책에 도전하는 옹호 역할을 수행한다.","ㄷ. 복합적인 욕구를 갖는 클라이언트를 위해 다양한 서비스를 조정·연계한다.","ㄹ. 클라이언트의 자기결정이 중요하므로 사례관리자는 어떠한 상황에서도 클라이언트를 대신하여 행동해서는 안 된다."],"c":["ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"17-2-25","y":2017,"g":2,"n":25,"t":"관계 형성·면접·의사소통","f":"옳은 것 모두 고르기","s":["양가감정(ambivalence)에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 변화를 원하는 것과 원하지 않는 마음이 공존하는 것을 의미한다.","ㄴ. 클라이언트가 양가감정을 갖는 것은 자연스러운 현상이다.","ㄷ. 클라이언트의 양가감정을 수용하면 클라이언트의 저항감이 강화된다.","ㄹ. 양가감정은 초기 접촉단계가 아닌 중간단계에서부터 다루어져야 한다."],"c":["ㄱ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ"],"a":2},{"id":"18-2-1","y":2018,"g":2,"n":1,"t":"실천 개념·역사·발달과정","f":"옳은 것 고르기","s":["사회복지실천의 전문화 과정에서 기능주의와 진단주의에 관한 설명으로 옳은 것은?"],"c":["기능주의의 대표적인 학자는 메리 리치몬드(M.Richmond)이다.","기능주의는 과거의 심리사회적 문제가 현재의 기능에 영향을 미친다는 관점을 갖는다.","기능주의는 인간의 성장가능성과 자유의지를 강조한다.","진단주의는 시간 제한적이고 과제중심적인 단기개입을 선호한다.","진단주의는 기관의 기능과 서비스를 최대한 활용하여 문제를 해결하는 것을 선호한다."],"a":3},{"id":"18-2-2","y":2018,"g":2,"n":2,"t":"실천 개념·역사·발달과정","f":"옳지 않은 것","s":["한국사회복지사 윤리강령에서의 동료에 대한 윤리기준으로 옳지 않은 것은?"],"c":["슈퍼바이저는 사회복지사의 개인적 문제가 클라이언트에게 부정적 영향을 미칠 경우 그를 직접 치료하여 해결해야 한다.","사회복지사가 전문적인 판단과 실천이 미흡하여 문제를야기했을 때에는, 적절한 조치를 취해 클라이언트의 이익을 보호해야 한다.","슈퍼바이저는 전문직 기준에 의해 공정히 책임을 수행하며, 사회복지사ㆍ수련생 및 실습생에 대한 평가는 저들과 공유해야 한다.","사회복지사는 사회복지 전문직의 이익과 권익을 증진시키기 위해 동료와 협력해야 한다.","슈퍼바이저는 개인적인 이익의 추구를 위해 자신의 지위를 이용해서는 안 된다."],"a":1},{"id":"18-2-3","y":2018,"g":2,"n":3,"t":"관계 형성·면접·의사소통","f":"옳지 않은 것","s":["민주주의(democracy)가 사회복지실천에 미친 영향으로 옳지 않은 것은?"],"c":["서비스 제공자와 소비자의 동등한 관계 강조","최소한의 수혜자격 강조","빈곤에 대한 사회적 책임 중시","대상자의 서비스 선택권 강조","서비스 이용자의 정책결정 참여"],"a":2},{"id":"18-2-4","y":2018,"g":2,"n":4,"t":"사회복지사 역할·기술","f":"옳은 것 모두 고르기","s":["사회복지사의 역할에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 중개자(broker): 가족이 없는 중증장애인에게 주거시설을 소개해주는 것","ㄴ. 중재자(mediator): 갈등으로 이혼위기에 처한 부부관계에 개입하며 상호 만족스러운 합의점을 도출하는 것","ㄷ. 옹호자(advocate): 장애학생의 교육권 확보를 위해 학교당국에 편의시설을 요구하는 것","ㄹ. 조력자(enabler): 알코올중독자가 자신의 문제를 깨닫고 금주방법을 찾도록 도와주는 것"],"c":["ㄱ,ㄴ","ㄱ,ㄴ,ㄷ","ㄱ,ㄷ,ㄹ","ㄴ,ㄷ,ㄹ","ㄱ,ㄴ,ㄷ,ㄹ"],"a":5},{"id":"18-2-5","y":2018,"g":2,"n":5,"t":"관계 형성·면접·의사소통","f":"옳은 것 고르기","s":["사회복지사가 면접기술을 활용할 때 주의할 점으로 옳은 것은?"],"c":["클라이언트로부터 사적 질문을 받을 경우 간단히 답하고초점을 돌리는 것이 좋다.","한 번에 다양한 정보를 얻기 위해서는 중첩형 질문을 적극적으로 활용해야 한다.","클라이언트의 침묵은 저항이므로 힘들더라도 대화를 지속하도록 촉구해야 한다.","클라이언트가 받아들이기 어려운 경우에도 자기탐색을 위해 해석을 반복한다.","바람직한 결정을 이끌어내기 위해 원하는 방향으로 유도질문을 하는 것이 중요하다."],"a":1},{"id":"18-2-6","y":2018,"g":2,"n":6,"t":"실천 개념·역사·발달과정","f":"옳지 않은 것","s":["통합적 방법의 특징으로 옳지 않은 것은?"],"c":["실천의 유용한 이론적 틀로서 생태체계적 관점에 기초한다.","개인과 체계 간의 상호작용에 초점을 둔다.","사회복지사는 미시적 수준에서부터 거시적 수준의 실천까지 다양한 체계에 개입한다.","인간에 초점을 두거나 환경에 초점을 두는 2궤도 접근이다.","일반주의(generalist) 실천에서 활용하는 접근방법이다."],"a":4},{"id":"18-2-7","y":2018,"g":2,"n":7,"t":"실천과정(접수~종결·평가·기록)","f":"옳은 것 고르기","s":["접수를 위한 초기면접지(intake sheet)에 포함되지 않는 내용은?"],"c":["동거 중인 가족관계","개입방법과 비용","타 기관으로부터의 의뢰 이유","이전의 서비스를 받은 경험","기관에 오게 된 주요 문제"],"a":2},{"id":"18-2-8","y":2018,"g":2,"n":8,"t":"사례관리","f":"옳지 않은 것","s":["사례관리자의 간접적 개입으로 옳지 않은 것은?"],"c":["장애인 인식개선을 위한 지역사회 홍보활동을 한다.","가정폭력 피해여성을 위한 모금활동을 한다.","청소년 유해환경을 줄이기 위한 프로그램을 개발한다.","사각지대 발굴을 위해 이웃주민을 조직한다.","예비부모를 대상으로 가족교육을 실시한다."],"a":5},{"id":"18-2-9","y":2018,"g":2,"n":9,"t":"실천 개념·역사·발달과정","f":"옳지 않은 것","s":["표적문제의 우선순위 결정에서 고려해야 할 사항으로 옳지 않은 것은?"],"c":["긴급성","변화가능성","측정가능성","해결가능성","클라이언트의 선택"],"a":3},{"id":"18-2-10","y":2018,"g":2,"n":10,"t":"실천 개념·역사·발달과정","f":"옳지 않은 것","s":["사회복지 전문직에 관한 설명으로 옳지 않은 것은?","시하였다."],"c":["서구에서 전문직 교육과정이 시작된 것은 19세기 후반이다.","실천의 가치와 지식은 방법(methods)을 통해 현장에서구현된다.","한국 사회복지사의 자격 및 처우에 관한 사항은 사회복지사업법에 근거한다.","플렉스너(A. Fl 2-11","y":2023,"g":2,"n":11,"t":"실천모델·이론적 관점","f":"사례·제시문 판단","s":["다음에서 설명하고 있는 사회복지실천모델은?","- 비장애인이 대부분인 사회에서 장애인 클라이언트의 취약한 권리에 주목하였다.","- 사회복지사와 클라이언트 집단은 장애인의 권익을 옹호하는데 협력하였다.","- 대화, 발견, 발전의 단계를 통해 클라이언트 집단은 주도적으로 불평등한 사회제도를 개선하였다."],"c":["의료모델","임파워먼트모델","사례관리모델","생활모델","문제해결모델"],"a":2},{"id":"23-2-12","y":2023,"g":2,"n":12,"t":"실천 개념·역사·발달과정","f":"옳지 않은 것","s":["통합적 접근의 특징에 관한 내용으로 옳지 않은 것은?"],"c":["생태체계 관점에서 인간과 환경 체계를 고려한다.","미시 수준에서 거시 수준에 이르는 다차원적 접근을 한다.","개입에 적합한 이론과 방법을 폭넓게 활용한다.","다양하고 복합적인 원인으로 발생하는 문제를 해결하기위한 접근이다.","서비스 영역별로 분화되고 전문화된 접근이다."],"a":5},{"id":"23-2-13","y":2023,"g":2,"n":13,"t":"실천현장·전달체계","f":"옳지 않은 것","s":["사회복지 실천현장과 분류의 연결로 옳지 않은 것은?"],"c":["사회복지관 - 1차 현장","종합병원 - 2차 현장","발달장애인지원센터 - 이용시설","노인보호전문기관 - 생활시설","사회복지공동모금회 - 비영리기관"],"a":4},{"id":"23-2-14","y":2023,"g":2,"n":14,"t":"사회복지사 역할·기술","f":"옳은 것 고르기","s":["콤튼과 갤러웨이(B. Compton &B. Galaway)의 사회복지실천 구성체계 중 '사회복지사협회'가 해당되는 체계는?"],"c":["변화매개체계","클라이언트체계","표적체계","행동체계","전문가체계"],"a":5},{"id":"23-2-15","y":2023,"g":2,"n":15,"t":"관계 형성·면접·의사소통","f":"옳지 않은 것","s":["사회복지실천의 전문적 관계에 관한 설명으로 옳지 않은 것은?"],"c":["사회복지사와 클라이언트가 합의하여 목적을 설정한다.","사회복지사는 소속된 기관의 특성에 영향을 받는다.","사회복지사의 이익과 욕구 충족을 위한 일방적 관계이다.","사회복지사는 전문성에 바탕을 둔 권위를 가진다.","계약에 의해 이루어지는 시간제한적인 특징을 갖는다."],"a":3},{"id":"23-2-16","y":2023,"g":2,"n":16,"t":"관계 형성·면접·의사소통","f":"옳은 것 고르기","s":["비스텍(F. Biestek)의 관계의 원칙 중 '의도적 감정표현'에 해당하는 것은?"],"c":["클라이언트의 부정적 감정을 자유롭게 표현할 수 있도록지지한다.","클라이언트의 감정이나 태도를 있는 그대로 받아들이고존중한다.","목적달성을 위한 방안들의 장ㆍ단점을 설명하고 클라이언트가 스스로 선택하도록 한다.","공감을 받고 싶어 하는 클라이언트의 욕구에 따라 클라이언트에게 공감하는 반응을 표현한다.","사회복지사 자신의 생각과 느낌, 개인적인 경험을 이야기 한다."],"a":1},{"id":"23-2-17","y":2023,"g":2,"n":17,"t":"사례관리","f":"사례·제시문 판단","s":["다음에서 설명하고 있는 사례관리 개입 원칙은?","- 변화하는 클라이언트 욕구에 반응하며 장기적으로 서비스를 제공해야 한다.","- 클라이언트에게 필요한 서비스를 중단하지 않고 제공해야 한다."],"c":["서비스의 체계성","서비스의 접근성","서비스의 개별화","서비스의 연계성","서비스의 지속성"],"a":5},{"id":"23-2-18","y":2023,"g":2,"n":18,"t":"관계 형성·면접·의사소통","f":"옳은 것 고르기","s":["원조관계에서 사회복지사의 태도에 관한 내용으로 옳은 것은?"],"c":["개선의 여지가 있다고 판단된 경우에 한해서 클라이언트와 전문적 관계를 형성하였다.","클라이언트의 감정에 이입되어 면담을 지속할 수 없었다.","자신의 생각과 다른 클라이언트의 의견은 관계형성을 위해 즉시 수정하도록 지시하였다.","법정으로부터 정보공개 명령을 받고 관련된 클라이언트정보를 제공하였다.","클라이언트 특성이나 상황이 일반적인 경우와 다르지만획일화된 서비스를 그대로 제공하였다."],"a":4},{"id":"23-2-19","y":2023,"g":2,"n":19,"t":"실천 개념·역사·발달과정","f":"옳은 것 모두 고르기","s":["자료 수집을 위한 자료 출처에 해당하는 것을 모두 고른 것은?","ㄱ. 문제, 사건, 기분, 생각 등에 관한 클라이언트 진술","ㄴ. 클라이언트와 직접 상호작용한 사회복지사의 경험","ㄷ. 심리검사, 지능검사, 적성검사 등의 검사 결과","ㄹ. 친구, 이웃 등 클라이언트의 중요한 타인으로부터 수집한 정보"],"c":["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"23-2-20","y":2023,"g":2,"n":20,"t":"가치와 윤리","f":"옳은 것 고르기","s":["레비(C. Levy)가 제시한 사회복지전문직의 가치 중 결과우선가치에 해당하는 것은?"],"c":["자기 결정권 존중","인간 존엄성에 대한 믿음","비심판적 태도","동등한 사회 참여 기회 제공","개별성에 대한 인정"],"a":4},{"id":"23-2-21","y":2023,"g":2,"n":21,"t":"관계 형성·면접·의사소통","f":"옳은 것 모두 고르기","s":["사회복지실천 개입기술에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 재보증은 어떤 문제에 대해 클라이언트가 부여하는 의미를 수정해 줌으로써 클라이언트의 시각을 긍정적인 방향으로 변화시키려는 전략이다.","ㄴ. 모델링은 실제 다른 사람의 행동을 직접 관찰함으로써만 시행 가능하다.","ㄷ. 격려기법은 주로 클라이언트 행동이 변화에 장애가 되거나 타인에게 위협이 될 때, 이를 인식하도록 하기 위한 목적으로 사용한다.","ㄹ. 일반화란 클라이언트 혼자만이 겪는 문제가 아니라는 것을 인식하게 하는 기법이다."],"c":["ㄱ","ㄹ","ㄱ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"a":2},{"id":"23-2-22","y":2023,"g":2,"n":22,"t":"사례관리","f":"옳지 않은 것","s":["사례관리 등장 배경에 관한 설명으로 옳지 않은 것은?"],"c":["탈 시설화로 인해 많은 정신 장애인이 지역사회 내에서생활하게 되었다.","지역사회 내 서비스 간 조정이 필요하게 되었다.","복지비용 절감에 관심이 커지면서 저비용 고효율을 지향하게 되었다.","인구ㆍ사회적 변화에 따라 다양하고, 복합적이며 만성적인 욕구를 가진 클라이언트가 증가하였다.","사회복지서비스 공급주체가 지방정부에서 중앙정부로 변화하였다."],"a":5},{"id":"23-2-23","y":2023,"g":2,"n":23,"t":"실천과정(접수~종결·평가·기록)","f":"옳은 것 고르기","s":["사회복지실천의 간접적 개입에 해당하는 것은?"],"c":["의사소통 교육","프로그램 개발","부모교육","가족상담","사회기술훈련"],"a":2},{"id":"23-2-24","y":2023,"g":2,"n":24,"t":"실천과정(접수~종결·평가·기록)","f":"사례·제시문 판단","s":["다음에서 설명하고 있는 사례관리 과정은?","- 계획 수정 여부 논의","- 클라이언트 욕구변화 검토","- 서비스 계획의 목표달성 정도 파악","- 서비스가 효과적으로 제공되고 있는지 확인"],"c":["점검","계획","사후관리","아웃리치","사정"],"a":1},{"id":"23-2-25","y":2023,"g":2,"n":25,"t":"사회복지사 역할·기술","f":"옳지 않은 것","s":["사례관리자 역할과 그 예의 연결로 옳지 않은 것은?"],"c":["조정자(coordinator): 사례회의를 통해 독거노인지원서비스가 중복 제공되지 않도록 하였다.","옹호자(advocate): 사례회의에서 장애아동의 입장을 대변하였다.","협상가(negotiator): 사례회의를 통해 생활 형편이 어려운 가정의 아동에게 재정 후원자를 연결해주었다.","평가자(evaluator): 사례 종결 여부를 결정하기 위해 목표 달성 여부를 확인하였다.","기획가(planner): 욕구사정을 통해 클라이언트에게 필요한 자원을 설계하고 체계적인 개입 계획을 세웠다."],"a":3},{"id":"24-2-1","y":2024,"g":2,"n":1,"t":"실천 개념·역사·발달과정","f":"옳은 것 고르기","s":["사회복지실천의 사회통제적 측면과 관련성이 가장 높은 이념은?"],"c":["인도주의","민주주의","박애사상","사회진화론","다양화"],"a":4},{"id":"24-2-2","y":2024,"g":2,"n":2,"t":"실천 개념·역사·발달과정","f":"옳은 것 모두 고르기","s":["기능주의(functionalism)에서 강조한 내용으로 옳은 것을 모두 고른 것은?","ㄱ. 개인의 의지","ㄴ. 개인에 대한 심리 내적 진단","ㄷ. 전문가와 클라이언트 사이의 원조관계","ㄹ. 기관의 기능"],"c":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"24-2-3","y":2024,"g":2,"n":3,"t":"가치와 윤리","f":"옳은 것 고르기","s":["특정 문제에 대해 어떠한 서비스를 제공할 것인가 결정할 때, 클라이언트의 의사를 존중해 주는 것을 의미하는 윤리적 쟁점은?"],"c":["비밀보장","진실성 고수와 알 권리","제한된 자원의 공정한 분배","전문적 관계 유지","클라이언트의 자기결정권"],"a":5},{"id":"24-2-4","y":2024,"g":2,"n":4,"t":"실천 개념·역사·발달과정","f":"옳지 않은 것","s":["인권에 관한 설명으로 옳지 않은 것은?"],"c":["천부성은 인간이 세상에 태어나면서부터 존엄성을 가지고태어났다는 의미이다.","자유권은 시민적, 정치적 권리이다.","평화권은 국가들 간의 연대와 단결의 권리이다.","보편성은 자기의 인권은 자기만이 소유할 수 있다는 의미이다.","평등권은 경제적, 사회적, 문화적 권리이다."],"a":4},{"id":"24-2-5","y":2024,"g":2,"n":5,"t":"가치와 윤리","f":"사례·제시문 판단","s":["로웬버그와 돌고프(F. Loewenberg &R. Dolgoff)의 윤리적 원칙 중 다음 사례에서 아동학대전담공무원이 결정을 할 때 최우선적으로 고려해야 할 원칙은?","아동학대가 발생한 가정의 학대피해아동을 원가정에서 생활하도록 할 것인가 또는 학대피해아동쉼터에서 생활하도록 할 것인가에 대해 1차 결정을 해야 한다."],"c":["평등과 불평등의 원칙","최소 손실의 원칙","사회정의 실현의 원칙","진실성과 정보 개방의 원칙","사생활보호와 비밀보장의 원칙"],"a":2},{"id":"24-2-6","y":2024,"g":2,"n":6,"t":"실천 개념·역사·발달과정","f":"옳지 않은 것","s":["1960년대와 1970년대 외원단체 활동이 우리나라 사회복지발달에 미친 영향으로 옳지 않은 것은?","기를 만들었다."],"c":["사회복지가 종교와 밀접한 관련 하에 전개되도록 하였다.","전문 사회복지의 시작을 촉발하였다.","시설 중심보다 지역사회 중심의 사회복지가 발전하는 계","사회복지가 거시적인 사회정책보다는 미시적인 사회사업위주로 발전하게 하였다.","사람들이 사회복지를 구호사업 또는 자선사업과 같은 것으로 인식하게 하였다."],"a":3},{"id":"24-2-7","y":2024,"g":2,"n":7,"t":"실천 개념·역사·발달과정","f":"옳지 않은 것","s":["1929년 밀포드(Milford) 회의에서 발표한 사회복지사가 갖추어야 할 기본적인 지식 및 방법론에 관한 공통요소에 해당하지 않는 것은?"],"c":["사회에서 받아들여지는 규범적 행동에서 벗어난 행동에관한 지식","인간관계 규범의 활용도","클라이언트 사회력(social history)의 중요성","사회치료(social treatment)에 지역사회자원 활용","집단사회사업의 목적, 윤리, 의무를 결정하는 철학적 배경이해"],"a":5},{"id":"24-2-8","y":2024,"g":2,"n":8,"t":"실천현장·전달체계","f":"옳지 않은 것","s":["사회복지실천현장 분류의 예로 옳지 않은 것은?"],"c":["1차 현장: 노인복지관","이용시설: 아동보호치료시설","생활시설: 장애인거주시설","2차 현장: 교정시설","생활시설: 노인요양원"],"a":2},{"id":"24-2-9","y":2024,"g":2,"n":9,"t":"실천모델·이론적 관점","f":"옳은 것 모두 고르기","s":["강점관점에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 개입의 핵심은 개인과 가족, 지역사회의 참여이다.","ㄴ. 클라이언트의 능력보다 전문가의 지식이 우선시 된다.","ㄷ. 사회복지사는 클라이언트의 진술을 긍정적으로 재해석하며 활용한다.","ㄹ. 현재 강점을 갖게 된 어린 시절의 원인 사건에 치료의 초점을 맞춘다."],"c":["ㄱ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1},{"id":"24-2-10","y":2024,"g":2,"n":10,"t":"관계 형성·면접·의사소통","f":"옳은 것 고르기","s":["전문적 원조관계에 관한 설명으로 옳은 것은?"],"c":["클라이언트의 문제와 욕구가 중심이 된다.","시간적 제한을 두지 않는 관계이다.","전문가의 권위는 부정적 작용을 한다.","전문가가 자신과 원조 방법에 대해 통제해서는 안 된다.","클라이언트는 전문가의 지시에 무조건 따라야 한다."],"a":1},{"id":"24-2-11","y":2024,"g":2,"n":11,"t":"실천모델·이론적 관점","f":"사례·제시문 판단","s":["핀커스와 미나한(A. Pincus &A. Minahan)의 4체계 모델을 다음 사례에 적용할 때 대상과 체계의 연결로 옳은 것은?","가족센터의 교육 강좌를 수강 중인 결혼이민자 A는 최근 결석이 잦아졌다. A의 이웃에 살며 자매처럼 친하게 지내는 변호사 B에게서 A의 근황을 전해들은 가족센터 소속의 사회복지사 C는 A와 연락 후 가정방문을 하여 A와 남편 D, 시어머니 E를 만나 이야기를 나누었다. C는 가족센터를 이용하면 '바람이 난다'라고 여긴 E가 A를 통제하고 있는 것을 알게 되었다. 또한 D는 A를 지지하고 싶지만 E의 눈치를 보느라 소극적으로 행동하는 것도 파악하였다. A의 도움 요청을 받은 C는 우선 E의 변화를 통해 상황을 개선해보고자 한다."],"c":["결혼이민자(A): 행동체계","변호사(B): 전문가체계","사회복지사(C): 의뢰-응답체계","남편(D): 변화매개체계","시어머니(E): 표적체계"],"a":5},{"id":"24-2-12","y":2024,"g":2,"n":12,"t":"실천모델·이론적 관점","f":"옳은 것 고르기","s":["임파워먼트 모델에 관한 설명으로 옳은 것은?"],"c":["병리적 관점에 기초를 둔다.","어떤 경우에도 환경의 변화를 추구하지 않는다.","클라이언트의 적극적인 참여를 강조한다.","전문성을 기반으로 사회복지사는 클라이언트를 통제한다.","클라이언트에 대한 정확한 진단을 최우선으로 한다."],"a":3},{"id":"24-2-13","y":2024,"g":2,"n":13,"t":"실천 개념·역사·발달과정","f":"옳지 않은 것","s":["통합적 접근 방법에 관한 설명으로 옳지 않은 것은?"],"c":["클라이언트의 참여와 개별성을 강조한다.","광범위하고 포괄적으로 문제를 규정한다.","클라이언트의 잠재력에 대해 미래지향적 관점을 갖는다.","전통적 접근 방법인 개별사회사업과 집단사회사업을 지역사회조직으로 통합하였다.","사회복지실천 과정에서 공통적으로 적용 가능한 개념이나 질 원칙","ㄷ. 최소 손실 원칙　　　　　　ㄹ. 자율성과 자유 원칙"],"c":["ㄱ - ㄷ - ㄴ - ㄹ","ㄱ - ㄹ - ㄷ - ㄴ","ㄴ - ㄹ - ㄱ - ㄷ","ㄷ - ㄱ - ㄹ - ㄴ","ㄹ - ㄴ - ㄷ - ㄱ"],"a":2},{"id":"26-2-8","y":2026,"g":2,"n":8,"t":"가치와 윤리","f":"옳은 것 모두 고르기","s":["가치와 윤리에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 가치는 사회복지실천을 어떻게 실행하는가 하는 방향성과 관련 있다.","ㄴ. 가치는 사회복지실천의 감정적, 정서적 측면으로 볼 수 있다.","ㄷ. 가치는 사회 구성원에 의해 결정된 바람직함의 기준이다.","ㄹ. 좋음(goodness)은 윤리에 대응하고, 옳음(rightness)은 가치에 대응한다."],"c":["ㄷ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ"],"a":4},{"id":"26-2-9","y":2026,"g":2,"n":9,"t":"실천현장·전달체계","f":"옳은 것 고르기","s":["사회복지 실천현장 중 이용시설로만 구성된 것은?"],"c":["학대피해노인전용쉼터, 지역자활센터","가정위탁지원센터, 자립지원공동생활시설","쪽방상담소, 장애인직업재활시설","성폭력피해자보호시설, 사회복지관","아동양육시설, 지역아동센터"],"a":3},{"id":"26-2-10","y":2026,"g":2,"n":10,"t":"실천현장·전달체계","f":"옳은 것 모두 고르기","s":["사회복지실천현장에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 기업사회복지와 교정복지는 2차 사회복지실천 현장으로 분류 가능하다.","ㄴ. 재가노인복지시설은 이용시설이고, 청소년자립지원관은 생활시설이다.","ㄷ. 공공 사회복지실천현장으로는 한국사회복지협의회, 사회복지공동모금회가 있다.","ㄹ. 직접실천을 하는 현장은 모두 1차 현장이다."],"c":["ㄴ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄷ, ㄹ"],"a":2},{"id":"26-2-11","y":2026,"g":2,"n":11,"t":"실천모델·이론적 관점","f":"옳지 않은 것","s":["강점관점에 관한 설명으로 옳지 않은 것은?"],"c":["전문가의 판단을 중심으로 문제를 해결한다.","어떤 환경이든 자원은 존재한다고 본다.","모든 클라이언트는 강점이 있다고 본다.","클라이언트를 선택과 결정의 주체로 본다.","개입의 초점은 가능성에 있다."],"a":1},{"id":"26-2-12","y":2026,"g":2,"n":12,"t":"실천모델·이론적 관점","f":"옳은 것 모두 고르기","s":["체계이론에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 순환적 인과성에 따르면, 인간 행동은 상대에 대한 반응으로 이해할 수 있다.","ㄴ. 특정 체계가 상위체계이면서 동시에 하위체계가 되는 현상을 홀론(holon)이라고 한다.","ㄷ. 환경체계와 정보, 에너지의 교환이 자유롭게 일어나는 체계를 폐쇄체계라고 한다.","ㄹ. 투입은 전환활동의 결과물이 체계 밖으로 나타나 다른 체계에 영향을 미치는 것이다."],"c":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1},{"id":"26-2-13","y":2026,"g":2,"n":13,"t":"실천모델·이론적 관점","f":"옳은 것 모두 고르기","s":["역량강화(empowerment) 실천에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 클라이언트의 능력과 영향을 강조한다.","ㄴ. 클라이언트와 사회복지사는 협력관계를 형성한다.","ㄷ. 병리학적 관점에 기반을 두고 발전하였다.","ㄹ. 클라이언트의 참여를 중시한다."],"c":["ㄱ, ㄹ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":4},{"id":"26-2-14","y":2026,"g":2,"n":14,"t":"실천 개념·역사·발달과정","f":"옳지 않은 것","s":["사회복지실천의 통합적 접근에 관한 설명으로 옳지 않은 것은?"],"c":["특정 이론에 얽매이지 않고 다양한 이론과 개념을 사용한다.","클라이언트의 문제 상황에 영향을 미친 개인적ㆍ환경적요소를 복합적으로 고려한다.","개인, 가족, 집단, 지역사회 등 다양한 수준의 체계에 개입한다.","문제에 대해 광범위하고 포괄적으로 접근한다.","일반주의 접근을 지양한다."],"a":5},{"id":"26-2-15","y":2026,"g":2,"n":15,"t":"실천모델·이론적 관점","f":"옳지 않은 것","s":["핀커스와 미나한(A. Pincus &A. Minahan)의 4체계 모델에 관한 설명으로 옳지 않은 것은?","하는 모든 체계는 행동체계이다."],"c":["부모가 자녀의 문제로 상담을 요청한 경우, 부모는 클라이언트체계이다.","법원 명령으로 본인 의사와 관계없이 문제행동 감소를위해 사회복지사에게 의뢰된 청소년은 표적체계이다.","클라이언트가 변화의 대상인 경우 클라이언트체계가 곧행동체계가 된다.","사회복지사의 활동 목적을 달성하기 위해 공동으로 노력","클라이언트의 문제를 해결하기 위해 노력하는 사회복지사와 사회복지기관은 변화매개체계이다."],"a":3},{"id":"26-2-16","y":2026,"g":2,"n":16,"t":"관계 형성·면접·의사소통","f":"사례·제시문 판단","s":["다음에서 설명하고 있는 비스텍(F. Biestek)의 관계 원칙은?","○ 사회복지사는 클라이언트의 감정을 민감하게 관찰한다.","○ 사회복지사는 클라이언트 입장에서 감정을 이해하고, 이에 적절하게 반응한다.","○ 사회복지사의 감정적 반응은 목적의식과 자기인식에 따라 조절되어야 한다."],"c":["통제된 정서적 관여","의도적인 감정표현","수용","비심판적 태도","개별화"],"a":1},{"id":"26-2-17","y":2026,"g":2,"n":17,"t":"관계 형성·면접·의사소통","f":"사례·제시문 판단","s":["다음의 설명에 나타난 전문적 원조관계 형성의 장애요인은?","○ 클라이언트가 과거 다른 관계에서 겪은 경험에 기초하여 현재 사회복지사에게 그 경험이나 감정을 투사한다.","○ 아버지로부터 폭력과 억압을 경험했던 클라이언트가 남성 사회복지사에게 두려움을 느낀다."],"c":["반영","자기노출","저항","전이","역전이"],"a":4},{"id":"26-2-18","y":2026,"g":2,"n":18,"t":"실천 개념·역사·발달과정","f":"옳지 않은 것","s":["펄만(H. Perlman)이 제시한 전문적 관계의 특징으로 옳지 않은 것은?"],"c":["사회복지사는 자신의 감정과 반응을 통제하지 않는다.","사회복지사와 클라이언트는 상호합의한 목적을 가진다.","전문적 관계는 시간 제한적이다.","전문적 관계는 클라이언트를 위한 것이다.","사회복지사는 전문성에 바탕을 둔 권위를 가진다."],"a":1},{"id":"26-2-19","y":2026,"g":2,"n":19,"t":"사회복지사 역할·기술","f":"사례·제시문 판단","s":["다음 사례에서 사회복지사가 사용한 면담기술로 적절한 것은?","A: 선생님, 저는 학교에서 조별 과제를 할 때 친구들이 저만 빼고 모여 회의를 하고, 저에게 내용만 통보해서 난감한 경우가 많았어요. 그리고 결과가 안 좋으면 제 탓을 해서 너무 억울해요.","사회복지사: 친구들이 너를 따돌린다고 생각해서 그동안 속상했구나."],"c":["직면","반영","도전","전이","정보제공"],"a":2},{"id":"26-2-20","y":2026,"g":2,"n":20,"t":"실천과정(접수~종결·평가·기록)","f":"옳은 것 고르기","s":["프로그램 수행과정 중 문제점을 발견하여 수정ㆍ보완을 통해서 프로그램의 질을 개선하는 데 초점을 둔 평가는?"],"c":["목적평가","총괄평가","탐색평가","결과평가","형성평가"],"a":5},{"id":"26-2-21","y":2026,"g":2,"n":21,"t":"사회복지사 역할·기술","f":"옳지 않은 것","s":["사회복 ,"ㄴ, ㄷ, ㄹ"],"a":4},{"id":"17-1-36","y":2017,"g":1,"n":36,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳지 않은 것","s":["서베이 조사에 관한 설명으로 옳지 않은 것은?"],"c":["면접조사는 우편조사에 비해 비언어적 행위의 관찰이 가능하다.","일반적으로 전화조사는 면접조사에 비해 면접시간이 길다.","질문의 순서는 응답률에 영향을 줄 수 있다.","폐쇄형 질문의 응답범주는 상호배타적이어야 한다.","면접조사는 전화조사에 비해 비용이 높을 수 있지만 무응답률은 낮은 편이다."],"a":2},{"id":"17-1-37","y":2017,"g":1,"n":37,"t":"측정(척도·신뢰도·타당도)","f":"사례·제시문 판단","s":["다음에서 사용한 타당도는?","새로 개발된 주관적인 행복감 측정도구를 사용하여 측정한 결과와 이미 검증되고 널리 사용되고 있는 주관적인 행복감 측정도구의 결과를 비교하여 타당도를 확인한다."],"c":["내용(content) 타당도","동시(concurrent) 타당도","예측(predictive) 타당도","요인(factor) 타당도","판별(discriminant) 타당도"],"a":2},{"id":"17-1-38","y":2017,"g":1,"n":38,"t":"표집(표본추출)","f":"옳지 않은 것","s":["확률표집에 관한 설명으로 옳지 않은 것은?"],"c":["모집단으로부터 표본으로 추출될 확률을 알 수 있다.","무작위방법이 기본 전제이다.","비비례층화(disproportionate stratified)표집은 확률표집이다.","신뢰수준이 높을수록 표본오차는 감소한다.","표본의 수가 증가할수록 표본오차는 감소한다."],"a":4},{"id":"17-1-39","y":2017,"g":1,"n":39,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 고르기","s":["측정의 오류에 관한 설명으로 옳은 것은?"],"c":["편향에 의해 체계적 오류가 발생한다.","무작위 오류는 측정의 타당도를 저해한다.","체계적 오류는 측정의 신뢰도를 저해한다.","표준화된 측정도구를 사용하더라도 체계적 오류를 줄일수 없다.","측정자, 측정 대상자 등에 일관성이 없어 생기는 오류를체계적 오류라 한다."],"a":1},{"id":"17-1-40","y":2017,"g":1,"n":40,"t":"연구윤리·보고서·평가","f":"옳지 않은 것","s":["욕구조사를 위한 자료수집 방법에 관한 설명으로 옳지 않은","것은"],"c":["지역의 통반장을 통해 자료를 수집한다.","지역사회 공청회를 통해 자료를 수집한다.","지역주민에게 서베이를 실시한다.","정부기관에서 발표하는 사회지표를 활용한다.","일반인을 대상으로 델파이 기법을 활용한다."],"a":5},{"id":"17-1-41","y":2017,"g":1,"n":41,"t":"단일사례(개별)연구설계","f":"사례·제시문 판단","s":["다음에서 설명하는 것은?","단일사례설계에서 기초선이 불안정하게 형성되어 있는 경우, 기초선의 변화의 폭과 기울기까지 고려하여 결과를 분석한다."],"c":["평균비교","시각적 분석","경향선 접근","임상적 분석","이론적 분석"],"a":3},{"id":"17-1-42","y":2017,"g":1,"n":42,"t":"변수·가설·연구과정·과학철학","f":"옳지 않은 것","s":["가설에 관한 설명으로 옳지 않은 것은?"],"c":["가설이란 둘 이상의 변수들 간의 관계를 예측하는 진술이다.","영가설은 독립변수가 종속변수에 영향을 미치지 않는다고 가정한다.","연구가설은 이론으로부터 도출된다.","가설은 경험적으로 검증할 수 있어야 한다.","가설은 방향성을 가져야 한다."],"a":5},{"id":"17-1-43","y":2017,"g":1,"n":43,"t":"연구설계(실험·조사유형)","f":"옳지 않은 것","s":["실험설계에 관한 설명으로 옳지 않은 것은?"],"c":["통제집단사후검사설계는 무작위할당으로 통제집단과 실험집단을 나누고 실험집단에만 개입을 한다.","정태적(static) 집단비교설계는 실험집단과 개입이 주어지지 않은 집단을 사후에 구분해서 종속변수의 값을 비교한다.","비동일통제집단설계는 임의적으로 나눈 실험집단과 통제집단 간의 교류를 통제한다.","솔로몬4집단설계는 통제집단사전-사후검사설계와 통제집단사후검사설계를 결합한 것이다.","복수시계열설계는 실험집단과 통제집단에 대해 개입 전과 개입 후 여러 차례 종속변수를 측정한다."],"a":3},{"id":"17-1-44","y":2017,"g":1,"n":44,"t":"연구설계(실험·조사유형)","f":"사례·제시문 판단","s":["다음에서 설명하는 조사는?","기초연금의 노인 빈곤 감소효과를 알아보기 위해 동일한 노인을 표본으로 10년간 매년 조사한다."],"c":["전수조사","추세조사","패널조사","탐색적 조사","횡단적 조사"],"a":3},{"id":"17-1-45","y":2017,"g":1,"n":45,"t":"측정(척도·신뢰도·타당도)","f":"사례·제시문 판단","s":["다음에서 설명하는 오류는?","17개 시·도를 조사하며 대학 졸업 이상의 인구비율이 높은 지역이 낮은 지역에 비해 중위 소득이 더 높음을 알게 되었다. 이를 통해 학력수준이 높은 사람이 낮은 사람에 비해 소득수준이 높다는 결론에 도달했다."],"c":["무작위 오류","체계적 오류","환원주의 오류","생태학적 오류","개체주의적 오류"],"a":4},{"id":"17-1-46","y":2017,"g":1,"n":46,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳은 것 모두 고르기","s":["2차 자료 분석에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 비관여적 방법이다.","ㄴ. 관찰대상에 대한 연구자의 영향이 크다.","ㄷ. 통계적 기법으로 자료의 결측값을 대체할 수 없다.","ㄹ. 신뢰도와 타당도에 관한 문제는 발생하지 않는다."],"c":["ㄱ","ㄱ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1},{"id":"17-1-47","y":2017,"g":1,"n":47,"t":"변수·가설·연구과정·과학철학","f":"옳지 않은 것","s":["과학적 방법에 관한 설명으로 옳지 않은 것은?"],"c":["잠정적이지 않은 지식을 추구한다.","철학이나 신념보다는 이론에 기반한다.","경험적인 증거에 기반하여 지식을 탐구한다.","현상의 규칙성에 대한 관심이 높다.","허위화(falsification)의 가능성에 대해 개방적이어야 한다."],"a":1},{"id":"17-1-48","y":2017,"g":1,"n":48,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 고르기","s":["변수의 측정수준에 관한 설명으로 옳은 것은?"],"c":["성별은 이산적 특성을 가진 서열척도이다.","인종과 종교는 등간척도이다.","석차로 평가된 성적은 등간척도이다.","5점 척도로 측정된 서비스만족도는 비율척도이다.","IQ와 온도는 등간척도이다."],"a":5},{"id":"17-1-49","y":2017,"g":1,"n":49,"t":"연구윤리·보고서·평가","f":"옳은 것 모두 고르기","s":["사회복지조사의 연구윤리에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 연구대상을 관찰하기에 앞서 그들의 동의를 구해야 한다.","ㄴ. 연구로부터 얻을 수 있는 사회적 이익이 비용을 초과해야만 한다.","ㄷ. 조사과정에서 드러난 문제점과 실패도 모두 보고해야 한다.","ㄹ. 비밀성이 보장되면 익명성도 보장된다."],"c":["ㄱ","ㄴ","ㄱ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":3},{"id":"17-1-50","y":2017,"g":1,"n":50,"t":"변수·가설·연구과정·과학철학","f":"옳은 것 고르기","s":["지식을 습득하는 과정에서 발생하는 오류에 관한 설명으로 옳은 것은?"],"c":["부정확한 관찰은 규칙성을 전제로 이와 부합되는 특수한사례만을 관찰하는 것이다.","과도한 일반화는 관찰된 소수의 사건이나 경험을 근거로현상의 규칙성을 일반화시키는 것이다.","선별적 관찰은 관찰자의 자아특성이 현상을 이해하는 데영향을 미치는 것이다.","꾸며진 지식은 의식적 활동의 부재로 현상에 대한 정확한 관찰이 이루어지지 않는 것이다.","자아개입은 일반화된 관점을 유지하기 위해 스스로 사실이 아닌 정보를 만들어 내는 것이다."],"a":2},{"id":"18-1-26","y":2018,"g":1,"n":26,"t":"변수·가설·연구과정·과학철학","f":"옳지 않은 것","s":["사회과학의 패러다임에 관한 설명으로 옳지 않은 것은?"],"c":["비판사회과학적 패러다임은 억압받는 집단의 권한을 강화하는 데에 관심을 둔다.","포스트모더니즘적 패러다임은 객관적 실재라는 개념을신뢰한다.","해석주의적 패러다임은 삶에 대한 주관적 의미에 관해깊이 있게 탐구한다.","실증주의적 패러다임은 경험적 관찰의 중요성을 강조한다.","후기실증주의적 패러다임은 인간의 비합리적 행위도 합리적으로 설명할 수 있다고 본다."],"a":2},{"id":"18-1-27","y":2018,"g":1,"n":27,"t":"연구설계(실험·조사유형)","f":"옳지 않은 것","s":["요인설계(factorial design)에 관한 설명으로 옳지 않은 것은?"],"c":["집단비교 결과의 일반화 가능성이 높은 편이다.","독립변수의 속성에 따라 할당행렬을 만들고 행렬 상의각 범주에 따라 집단을 설정한다.","독립변수가 많을수록 요인설계를 활용하기 쉽다.","주효과와 상호작용효과를 동시에 확인할 수 있다.","분산분석(ANOVA)의 통계적 기법을 활용할 수 있다."],"a":3},{"id":"18-1-28","y":2018,"g":1,"n":28,"t":"변수·가설·연구과정·과학철학","f":"옳은 것 모두 고르기","s":["변수와 가설에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 가설은 검증이 가능해야 한다.","ㄴ. 가설은 변수 간의 관계를 가정하는 문장이다.","ㄷ. 모든 변수는 개념이 아니지만 모든 개념은 변수이다.","ㄹ. 영가설은 독립변수가 종속변수에 영향을 미치지 않는다고 가정한다."],"c":["ㄱ,ㄴ","ㄱ,ㄹ","ㄱ,ㄴ,ㄹ","ㄴ,ㄷ,ㄹ","ㄱ,ㄴ,ㄷ,ㄹ"],"a":3},{"id":"18-1-29","y":2018,"g":1,"n":29,"t":"연구설계(실험·조사유형)","f":"옳지 않은 것","s":["사회복지사가 과학적 조사연구방법을 활용하는 일반적 상황이 아닌 것은?"],"c":["사회복지 전문가로서 실제 조사를 수행할 때","지역주민의 복지적 욕구를 파악할 때","새로운 통계적 분석기법을 개발할 때","학술논문에 있는 실천방법들의 효과성을 비교할 때","새로운 프로그램의 만족도를 평가할 때"],"a":3},{"id":"18-1-30","y":2018,"g":1,"n":30,"t":"변수·가설·연구과정·과학철학","f":"옳지 않은 것","s":["쿤(T. Kuhn)의 과학적 패러다임에 관한 설명으로 옳지 않은 것은?"],"c":["현상에 대한 우리의 관점을 조직하는 근본적인 도식을패러다임이라 한다.","과학은 지식의 누적에 의해 점진적으로 진보한다고 본다.","학문 공동체의 사회적 성격이 과학이론 선택에 중요한역할을 한다.","상이한 과학적 패러다임은 실재의 본질에 대한 다른 입장을 반영한다.","기존 패러다임의 위기가 명백해지면 새로운 패러다임으로 전환된다."],"a":2},{"id":"18-1-31","y":2018,"g":1,"n":31,"t":"변수·가설·연구과정·과학철학","f":"옳은 것 모두 고르기","s":["사회복지 조사의 연구문제에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 연구문제는 연구자의 관심이나 의문의 대상을 포함한다.","ㄴ. 잠정적 결과를 예측하는 연구문제를 제시할 수 있다.","ㄷ. 모든 사회복지 조사는 연구문제가 있다.","ㄹ. 문제형성 과정에 다른 연구자의 참여가 가능하다.","ㅁ. 연구문제가 변수 간의 관계를 예측할 필요는 없다."],"c":["ㄱ,ㅁ","ㄴ,ㄹ","ㄱ,ㄹ,ㅁ","ㄱ,ㄴ,ㄷ,ㅁ","ㄱ,ㄴ,ㄷ,ㄹ,ㅁ"],"a":5},{"id":"18-1-32","y":2018,"g":1,"n":32,"t":"연구윤리·보고서·평가","f":"옳지 않은 것","s":["사회과학의 연구윤리에 관한 설명으로 옳지 않은 것은?"],"c":["수업시간에 조사하는 설문지도 응답자의 동의와 자발적참여가 필요하다.","연구자는 연구대상자에게 피해를 줘서는 안 된다.","응답자의 익명성과 비밀을 보장해야 한다.","연구의 공익적 가치는 일반적으로 연구윤리보다 우선해야 한다.","타인의 연구결과를 인용 없이 사용하는 경우를 표절이라한다."],"a":4},{"id":"18-1-33","y":2018,"g":1,"n":33,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 고르기","s":["척도 수준(level of measurement)에 관한 설명으로 옳은 것은?"],"c":["연령은 모든 척도 수준으로 분석이 가능하다.","표준화된 지능검사점수는 비율척도이다.","소득을 비율척도로 질문하면 다른 척도 수준으로 질문할때보다 응답률이 높은 편이다.","등간척도는 절대영점이 있다.","서열척도는 비율척도로 변환이 가능하다."],"a":1},{"id":"18-1-34","y":2018,"g":1,"n":34,"t":"표집(표본추출)","f":"옳지 않은 것","s":["표집오차(sampling error)와 표준오차(standard error)에 관한 설명으로 옳지 않은 것은?"],"c":["표집오차는 모집단의 모수와 표본의 통계치 간의 차이다.","표준오차는 무수히 많은 표본평균의 통계치가 모집단의모수로부터 평균적으로 떨어진 거리를 의미한다.","동일한 조건이라면 이질적 집단보다 동질적 집단에서 추출한 표본의 표집오차가 작다.","동일한 조건이라면 표준오차가 클수록 검정통계값이 통계적으로 유의할 가능성이 높아진다.","동일한 조건이라면 표본의 크기가 커질수록 표집오차가감소한다."],"a":4},{"id":"18-1-35","y":2018,"g":1,"n":35,"t":"측정(척도·신뢰도·타당도)","f":"옳지 않은 것","s":["측정에 관한 설명으로 옳지 않은 것은?"],"c":["개념이 구체화 과정에서 포괄성의 원칙을 지켜야 한다.","개념의 경험화 과정에서 변수를 구성하는 속성들 간의구분이 분명해야 한다.","신뢰도가 높은 측정을 위해서는 문항 간 내적 일관성을가져야 한다.","측정은 개념의 현상적 구조와 경험적 측정값들이 일치될수록 정확해진다.","개념화가 조작화에 비해 경험적 차원에서의 구체화 정도가 높다."],"a":5},{"id":"18-1-36","y":2018,"g":1,"n":36,"t":"측정(척도·신뢰도·타당도)","f":"사례·제시문 판단","s":["변수의 측정 종류가 바르게 짝지어진 것은?","ㄱ. 사회복지사의 근무지역 동(洞)","ㄴ. 사회복지사가 이수한 보수교육 시간(분)","ㄷ. 사회복지사의 근무기관 평가등급 점수(A, B, C, D)"],"c":["ㄱ: 명목측정, ㄴ: 서열측정, ㄷ: 비율측정","ㄱ: 비율측정, ㄴ: 서열측정, ㄷ: 명목측정","ㄱ: 서열측정, ㄴ: 비율측정, ㄷ: 서열측정","ㄱ: 명목측정, ㄴ: 비율측정, ㄷ: 서열측정","ㄱ: 서열측정, ㄴ: 명목측정, ㄷ: 비율측정"],"a":4},{"id":"18-1-37","y":2018,"g":1,"n":37,"t":"질적연구방법","f":"사례·제시문 판단","s":["근거이론에서 다음 설명에 해당하는 것은?","- 이론을 통합시키고 정교화하는 과정으로 이론적 포화(theoretical saturation)와 변화범위(range of variability)에 대한 작업을 진행한다.","- 주로 근거이론 코딩의 마지막 단계로서 모형 내 범주들의 관계를 진술하는 명제를 구체화하거나 범주들을 통합하는 이야기를 서술한다."],"c":["선택(selective)코딩","자료(data)코딩","축(axial)코딩","개방(open)코딩","역(reverse)코딩"],"a":1},{"id":"18-1-38","y":2018,"g":1,"n":38,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 고르기","s":["신뢰도와 타당도에 관한 설명으로 옳은 것은?"],"c":["측정할 때마다 항상 30분 빠르게 측정되는 시계는 신뢰도가 높은 것이다.","측정도구의 신뢰도가 높으면 타당도도 높아진다.","측정도구를 동일 응답자에게 반복 적용했을 때 일관된결과가 나오면 타당도가 높은 것이다.","동일한 변수를 측정할 때 신뢰도가 타당도를 높이기 위해서는 관련 문항 수를 줄인다.","타당도를 검사하기 위해 복수양식법을 활용한다."],"a":1},{"id":"18-1-39","y":2018,"g":1,"n":39,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 모두 고르기","s":["측정 항목들이 적절한 내용을 담고 있는가에 대해 이론에 비추어 경험적으로 검증해 보는 것과 관련된 것을 모두 고른 것은?","ㄱ. 체계적 오류","ㄴ. 무작위적 오류","ㄷ. 신뢰도","ㄹ. 타당도","ㅁ. 이분절(split-half)기법","ㅂ. 구성타당도"],"c":["ㄱ,ㄹ","ㄱ,ㄷ,ㅁ","ㄱ,ㄹ,ㅂ","ㄴ,ㄷ,ㅁ","ㄱ,ㄹ,ㅁ,ㅂ"],"a":3},{"id":"18-1-40","y":2018,"g":1,"n":40,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳은 것 고르기","s":["설문지 작성에 관한 설명으로 옳은 것은?"],"c":["개방형 질문은 응답률을 높이기 위해 주로 설문지의 앞부분에 배치한다.","수반형(contingency) 질문이 많아질수록 응답률은 높아진다.","명확한 응답을 얻기 위해 이중(double-barreled)질문을사용한다.","문항은 응답자의 특성과 무관하게 작성되어야 한다.","신뢰도 측정을 위해 짝(pair)으로 된 문항들은 가급적 떨어지게 배치한다."],"a":5},{"id":"18-1-41","y":2018,"g":1,"n":41,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳은 것 고르기","s":["대인면접에 비해 우편설문이 갖는 장점은?"],"c":["질문 과정의 유연성 증대","동일 표집조건 시 비용의 절감","높은 응답률","응답환경의 통제 용이","심층규명 증대"],"a":2},{"id":"18-1-42","y":2018,"g":1,"n":42,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳지 않은 것","s":["관찰법에 관한 설명으로 옳지 않은 것은?"],"c":["행위가 일어나는 현장에서 즉시 자료수집이 가능하다.","관찰자의 주관성이 개입될 수 있다.","비언어적 상황에 대한 자료수집이 가능하다.","서베이에 비해 자료의 계량화가 쉽다.","질적연구나 탐색적 연구에 사용하기 용이하다."],"a":4},{"id":"18-1-43","y":2018,"g":1,"n":43,"t":"변수·가설·연구과정·과학철학","f":"옳은 것 모두 고르기","s":["지난 20년 동안 A신문의 사회면 기사를 자료로 노인에 대한 인식변화를 알아보기 위해 진행한 연구에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 범주항목들은 신문기사 자료로부터 도출된다.","ㄴ. 주제보다 단어를 기록단위로 할 때 자료수집 양이 많다.","ㄷ. 맥락단위는 기록단위보다 더 큰 단위여야 한다.","ㄹ. 이 연구에서는 양적 분석방법을 사용할 수 없다."],"c":["ㄱ,ㄴ","ㄱ,ㄷ","ㄱ,ㄴ,ㄷ","ㄱ,ㄴ,ㄹ","ㄴ,ㄷ,ㄹ"],"a":3},{"id":"18-1-44","y":2018,"g":1,"n":44,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳은 것 고르기","s":["집단조사 방법에 관한 설명으로 옳은 것은?"],"c":["초점집단조사에서 집단역학에 관한 것은 분석대상이 될수 없다.","델파이기법은 대면집단의 상호작용을 중요시한다.","델파이기법은 일반인들을 대상으로 한 일반적 주제에 대한 견해를 도출하는데 유용하다.","네트워크분석은 조직간 전달체계 분석에 부적절하다.","네트워크 구조분석에는 관계형 변수를 주로 사용한다."],"a":5},{"id":"18-1-45","y":2018,"g":1,"n":45,"t":"연구설계(실험·조사유형)","f":"옳지 않은 것","s":["패널조사에 관한 설명으로 옳지 않은 것은?"],"c":["동일 대상을 반복 조사하는 것이다.","패널조건화(panel conditioning) 현상으로 연구결과의 정확성이 높아질 수 있다.","조사대상자의 추적과 관리의 비용이 많이 든다.","독립변수의 시간적 우선성을 확보할 수 있어 내적 타당도를 높일 수 있다.","조사대상자의 상실로 변화를 확인하기 어려울 수 있다."],"a":2},{"id":"18-1-46","y":2018,"g":1,"n":46,"t":"연구설계(실험·조사유형)","f":"옳은 것 고르기","s":["조사대상자의 선정편향(selection bias)이 영향을 주기 어려운 것은?"],"c":["내적 타당도","실험집단과 통제집단의 동질성","표본의 대표성","측정의 정확성","결과의 일반화 정도"],"a":4},{"id":"18-1-47","y":2018,"g":1,"n":47,"t":"표집(표본추출)","f":"옳은 것 모두 고르기","s":["신뢰수준에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 99% 신뢰수준은 1% 유의수준을 사용한다는 의미다.","ㄴ. 신뢰수준을 95%에서 99%로 높이면 1종 오류를 줄일 수 있다.","ㄷ. 95% 신뢰수준은 100번 조사하면 5번 정도 오차가 허용될 수 있다는 의미다.","ㄹ. 99% 신뢰수준에서 모집단의 평균값이 신뢰구간 내에 존재한다는 것을 99% 확신할 수 있다."],"c":["ㄱ,ㄴ,ㄷ","ㄱ,ㄴ,ㄹ","ㄱ,ㄷ,ㄹ","ㄴ,ㄷ,ㄹ","ㄱ,ㄴ,ㄷ,ㄹ"],"a":5},{"id":"18-1-48","y":2018,"g":1,"n":48,"t":"표집(표본추출)","f":"옳은 것 고르기","s":["초ㆍ중ㆍ고등학생의 행복도를 조사하기 위해 모집단에서 차지하는 비율에 맞춰 조사대상자를 표집하고자 한다. 이 때 적절하게 사용할 수 있는 비확률표집방법은?"],"c":["층화(stratified)표집","체계(systematic)표집","할당(quota)표집","눈덩이(snowball)표집","편의(convenience)표집"],"a":3},{"id":"18-1-49","y":2018,"g":1,"n":49,"t":"연구설계(실험·조사유형)","f":"옳지 않은 것","s":["혼합연구방법론(mixed methodology)에 관한 설명으로 옳지 않은 것은?"],"c":["질적연구 결과와 양적연구 결과는 일치해야 한다.","양적연구와 질적연구에 대한 전문적 지식이 모두 필요하다.","연구에 따라 양적연구와 질적연구의 상대적 비중이 상이할 수 있다.","질적연구의 결과에 기반하여 양적연구를 시작할 수 있다.","상충되는 패러다임들도 수용할 수 있어야 한다."],"a":1},{"id":"18-1-50","y":2018,"g":1,"n":50,"t":"단일사례(개별)연구설계","f":"옳지 않은 것","s":["단일사례설계에 관한 설명으로 옳지 않은 것은?"],"c":["기초선 국면과 개입 국면이 있다.","연구대상과 개입방법은 여러 개가 될 수 없다.","조사연구 과정과 실천 과정의 통합이 가능하다.","경향과 변화를 파악하도록 반복 관찰한다.","통계적 원리를 적용하여 분석할 수 있다."],"a":2},{"id":"19-1-26","y":2019,"g":1,"n":26,"t":"변수·가설·연구과정·과학철학","f":"옳지 않은 것","s":["실증주의에 관한 설명으로 옳지 않은 것은?"],"c":["인간행위를 예측할 수 있는 확률적 법칙을 강조한다.","과학과 비과학을 철저히 구분하려 한다.","관찰결과의 일반화 가능성을 강조한다.","연구결과를 잠정적인 지식으로 간주한다.","사회적 행동을 행위자의 입장에서 이해하려 한다."],"a":5},{"id":"19-1-27","y":2019,"g":1,"n":27,"t":"변수·가설·연구과정·과학철학","f":"옳은 것 모두 고르기","s":["인과관계를 성립시키기 위한 요건에 해당하는 것을 모두 고른 것은?","ㄱ. 독립변수가 종속변수를 시간적으로 앞서야 한다.","ㄴ. 독립변수와 종속변수가 일정한 방식으로 같이 변해야 한다.","ㄷ. 독립변수와 종속변수의 관계가 허위적 관계이어야 한다."],"c":["ㄱ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"a":2},{"id":"19-1-28","y":2019,"g":1,"n":28,"t":"연구설계(실험·조사유형)","f":"옳지 않은 것","s":["외적타당도와 내적타당도에 관한 설명으로 옳지 않은 것은?"],"c":["사전검사의 실시가 내적타당도에 부정적으로 영향을 미칠 수 있다.","외적타당도를 높이는 중요한 전략 중 하나는 연구를 반복적으로 실시하여 결과를 축적하는 것이다.","내적타당도가 높으면 외적타당도 또한 높다.","자신이 연구대상자라는 인식이 외적타당도를 낮출 수 있다.","내적타당도는 인과관계를 추론할 수 있는 정도를 의미한다."],"a":3},{"id":"19-1-29","y":2019,"g":1,"n":29,"t":"연구윤리·보고서·평가","f":"옳은 것 고르기","s":["‘사회복지사의 근무지역에 따른 직업만족도 차이의 연구’ 라는 논문의 제목에서 알 수 없는 것은?"],"c":["독립변수","종속변수","통제변수","분석단위","독립변수의 측정수준"],"a":3},{"id":"19-1-30","y":2019,"g":1,"n":30,"t":"측정(척도·신뢰도·타당도)","f":"사례·제시문 판단","s":["다음은 무엇에 관한 설명인가?","A연구소가 정치적 보수성을 판단할 수 있는 문항들의 상대적인 강도를 11개의 점수로 평가자들에게 분류하게 한다. 다음 단계로 평가자들 간에 불일치도가 높은 항목들을 제외하고, 각 문항이 평가자들로부터 받은 점수의 중위수를 가중치로 하여 정치적 보수성 척도를 구성한다."],"c":["거트만(Guttman)척도","서스톤(Thurstone)척도","리커트(Likert)척도","보가더스(Borgadus)척도","의미차이(sematic differential)척도"],"a":2},{"id":"19-1-31","y":2019,"g":1,"n":31,"t":"질적연구방법","f":"옳은 것 고르기","s":["질적조사의 자료수집에 관한 설명으로 옳은 것은?"],"c":["심층면접은 주요 자료수집 방법 중 하나이다.","연구자는 자료수집과정에서 배제되는 것이 원칙이다.","완전관찰자로서의 연구자는 먼저 자료제공자들과 라포형성이 요청된다.","가설설정은 자료수집을 위해 필수적 요건이다.","표준화된 측정도구를 갖추어야 자료수집이 가능하다."],"a":1},{"id":"19-1-32","y":2019,"g":1,"n":32,"t":"측정(척도·신뢰도·타당도)","f":"옳은 것 고르기","s":["측정도구의 신뢰도에 관한 설명으로 옳은 것은?"],"c":["일관성 또는 안정성으로 표현될 수 있는 개념이다.","측정도구가 의도하는 개념의 실질적 의미를 반영하는 정도와 관련이 있다.","검사-재검사 신뢰도는 가장 널리 사용되는 신뢰도 유형이다.","사회적 바람직성 편향은 신뢰도를 낮추는 주요 요인이다.","특정 개념을 측정하는 문항수가 많을수록 신뢰도는 낮아진다."],"a":1},{"id":"19-1-33","y":2019,"g":1,"n":33,"t":"변수·가설·연구과정·과학철학","f":"옳은 것 고르기","s":["경험적으로 검증할 수 있는 가설의 예로 옳은 것은?"],"c":["불평등은 모든 사회에서 나타날 것이다.","대한민국에서 65세 이상인 노인이 전체 인구의 14 % 이상이다.","다양성이 존중되는 사회가 그렇지 않은 사회보다 더 바람직하다.","여성의 노동참여율이 높을수록 출산율은 낮을 것이다.","모든 행위는 비용과 보상에 의해 결정된다."],"a":4},{"id":"19-1-34","y":2019,"g":1,"n":34,"t":"연구설계(실험·조사유형)","f":"사례·제시문 판단","s":["다음에 해당하는 설계로 옳은 것은?","  적용하여 개입의 효과를 평가할 수 있다.","수집된 자료의 분석을 위해 통계적 방법이 사용되기도한다."],"a":1},{"id":"19-1-42","y":2019,"g":1,"n":42,"t":"연구설계(실험·조사유형)","f":"순서 나열","s":["조사연구 과정의 일부분이다. 이를 올바르게 나열한 것은?","ㄱ. '대학생들의 전공에 따라 다문화수용성이 다를 것이다' 라는 가설설정","ㄴ. 표본을 추출하여 자료수집","ㄷ. 대학생들의 다문화수용성에 관한 선행연구 고찰","ㄹ. 구조화된 설문지 작성"],"c":["ㄱ → ㄴ → ㄷ → ㄹ","ㄱ → ㄷ → ㄴ → ㄹ","ㄱ → ㄷ → ㄹ → ㄴ","ㄷ → ㄱ → ㄴ → ㄹ","ㄷ → ㄱ → ㄹ → ㄴ"],"a":5},{"id":"19-1-43","y":2019,"g":1,"n":43,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳은 것 모두 고르기","s":["지역사회보장계획을 수립하기 위해 포함될 수 있는 조사를 모두 고른 것은?","ㄱ. 자치단체장의 정책공약 관련 자료의 내용분석","ㄴ. 지역주민의 욕구파악을 위한 서베이","ㄷ. 복지 전문가 대상 초점집단면접","ㄹ. 질적 자료수집을 위한 구청 업무담당자와의 심층면접"],"c":["ㄱ","ㄴ, ㄹ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":5},{"id":"19-1-44","y":2019,"g":1,"n":44,"t":"표집(표본추출)","f":"옳지 않은 것","s":["할당표본추출에 관한 설명으로 옳지 않은 것은?"],"c":["연구자는 모집단에 대한 사전지식을 가지고 있어야 한다.","연구자의 편향적 선정이 이루어질 수 있다.","모집단의 구성요소들이 표본으로 선정될 확률이 동일하지 않다.","표본추출 시 할당틀을 만들어 사용한다.","전체 모집단에서 직접 표본을 추출한다."],"a":5},{"id":"19-1-45","y":2019,"g":1,"n":45,"t":"표집(표본추출)","f":"옳지 않은 것","s":["표본의 대표성에 관한 설명으로 옳지 않은 것은?"],"c":["무작위로 추출된 표본의 크기는 표본의 대표성과 관계가있다.","층화표본추출은 단순무작위 표본추출보다 대표성이 높은표본을 추출하는 방법으로 알려져 있다.","표본의 대표성은 표본의 질을 판단하는 주요 기준이다.","동일확률선정법으로 추출된 표본은 모집단을 완벽하게대표한다.","모집단의 동질성은 표본의 대표성과 관계가 있다."],"a":4},{"id":"19-1-46","y":2019,"g":1,"n":46,"t":"변수·가설·연구과정·과학철학","f":"옳지 않은 것","s":["변수에 관한 설명으로 옳지 않은 것은?"],"c":["직접 관찰할 수 있는 것들만 측정한 것이다.","경험적으로 측정할 수 있는 개념이다.","조작적 정의의 결과물이다.","두 개 이상의 속성을 가져야만 한다.","연속형 또는 비연속형으로 측정될 수 있다."],"a":1},{"id":"19-1-47","y":2019,"g":1,"n":47,"t":"자료수집(설문·면접·관찰·내용분석)","f":"옳지 않은 것","s":["다음 중 옳지 않은 것은?"],"c":["우편설문: 원래 표본으로 추출된 응답자가 응답하지 않을 수 있다.","실험설계: 개입을 제공하기 전에는 종속변수의 측정이사실상 불가능하다.","관찰: 비언어적 자료수집이 가능하다.","비반응성 자료수집: 연구대상의 반응성 오류를 피할 수있다.","대인면접설문: 방문 조사원에 의해 보충적인 자료가 수집될 수 있다."],"a":2},{"id":"19-1-48","y":2019,"g":1,"n":48,"t":"측정(척도·신뢰도·타당도)","f":"옳지 않은 것","s":["측정의 4등급 - 사례 - 가능한 통계분석의 연결이 옳지 않은 것은?"],"c":["명목등급 - 베이비붐세대여부 - 백분율","서열등급 - 학점(A, B, C....) - 최빈치","등간등급 - 온도(°C) - 중위수","비율등급 - 시험점수(0～100점) - 산술평균","명목등급 - 성별, 현재 록 연구자의 신분을 숨기고 자료를 수집하였다.","연구결과의 확산을 위해 연구참여자의 신분을 다른 연구기관에 동의 없이 공개하였다.","연구결과에 영향을 미치지 않도록 연구참여자에게 일어날 수 있는 이익을 미리 알리지 않았다.","연구 참여여부를 성적평과와 연계하여 연구참여자의 참여동기를 높였다.","연구참여자에게 연구과정에서 발생할 수 있는 고통을미리 알리고 사전 동의를 구하였다."],"a":5},{"id":"20-1-32","y":2020,"g":1,"n":32,"t":"연구설계(실험·조사유형)","f":"사례·제시문 판단","s":["다음 연구 상황에 유용한 조사유형은?","일본 후쿠시마 원전 유출이 지역주민들의 삶에 초래한 변화를 연구하고자 하였으나 관련 연구나 선행 자료가 상당히 부족함을 발견하였다."],"c":["평가적 연구","기술적 연구","설명적 연구","탐색적 연구","척도개발 연구"],"a":4},{"id":"20-1-33","y":2020,"g":1,"n":33,"t":"연구설계(실험·조사유형)","f":"옳지 않은 것","s":["다음 연구설계에 관한 설명으로 옳지 않은 것은?","노인복지관의 노노케어 프로그램 자원봉사자 40명을 무작위로 골라 20명씩 두 집단으로 배치하고, 한 집단에는 자원봉사 교육을 실시하고 다른 집단에는 아무런 개입을 하지 않았다. 10주 후 두 집단 간 자원봉사만족도를 비교·분석하였다."],"c":["사전조사를 실시하지 않아 내적타당도를 저해하지 않는다.","무작위 선정으로 내적타당도를 저해하지 않는다.","통제집단을 확보하기 어려울 때 사용할 수 있는 설계이다.","사전검사를 하지 않아도 집단 간 차이를 어느 정도 통제할 수 있다.","통제집단 전후비교에 비해 설계가 간단하여 사회조사에서 많이 활용된다."],"a":3},{"id":"20-1-34","y":2020,"g":1,"n":34,"t":"연구설계(실험·조사유형)","f":"옳지 않은 것","s":["종단연구(longitudinal study)에 관한 설명으로 옳지 않은 것은?"],"c":["시간흐름에 따른 조사 대상의 변화를 측정하는 연구이다.","일정기간의 변화에 대해 가장 포괄적 자료를 제공하는것은 동년배집단연구(cohort study)이다.","조사대상의 추적과 관리 때문에 가장 많은 비용이 드는것은 패널연구(panel study)이다.","일정 주기별 인구변화에 대한 조사는 경향연구(trendstudy)이다.","동년배집단연구는 언제나 동일한 대상을 조사하는 것은아니다."],"a":2},{"id":"20-1-35","y":2020,"g":1,"n":35,"t":"변수·가설·연구과정·과학철학","f":"옳은 것 모두 고르기","s":["가설에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 이론적 배경을 가져야 한다.","ㄴ. 변수 간 관계를 가정한 문장이다.","ㄷ. 가설구성을 통해 연구문제가 도출된다.","ㄹ. 창의적 해석이 가능하도록 개방적으로 구성되어야 한다."],"c":["ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":1},{"id":"20-1-36","y":2020,"g":1,"n":36,"t":"단일사례(개별)연구설계","f":"옳지 않은 것","s":["단일사례설계의 개입효과에 관한 설명으로 옳지 않은 것은?"],"c":["개입 후 변화의 파동이 심하면 효과 판단이 어렵다.","기초선이 불안정할 경우 기초선의 경향선을 이용하여통계적으로 개입효과를 판단한다.","기초선에서 개입기간까지의 경향선을 통해 시각적으로개입효과를 판단한다.","기초선과 개입기간 두 평균값의 통계적 검증을 통해 개입효과를 판단한다.","개입 후 상당한 기간이 지나 최초의 변화가 발생할 경우 개입효과가 있다고 판단한다."],"a":5},{"id":"20-1-37","y":2020,"g":1,"n":37,"t":"연구설계(실험·조사유형)","f":"옳은 것 모두 고르기","s":["실험설계의 내적타당도에 관한 설명으로 옳은 것을 모두 고른 것은?","ㄱ. 우연한 사건은 내적
