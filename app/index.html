<meta charset="utf-8">
<title>사회복지사 1급 기출노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one column, bottom tab bar, question screen fills the tall Z Flip 4 display.
   Palette: exam-sheet ink navy with a highlighter-yellow accent (the pen used on answer sheets). */
:root{
  --bg:#10131a; --surface:#181c26; --surface2:#212634; --line:#2d3446;
  --fg:#e8eaf0; --muted:#9aa2b6; --hi:#f2cf5b; --hi-ink:#2a2200;
  --ok:#5fcf9a; --ok-bg:#12281f; --bad:#ff8680; --bad-bg:#2c1717;
  --font:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --serif:"Gowun Batang","Noto Serif KR",serif;
  --nav-h:62px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:560px;margin:0 auto;padding-block:16px calc(var(--nav-h) + 24px)}
#app.noNav{padding-bottom:24px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* header */
.hero{display:flex;flex-direction:column;gap:4px;padding:8px 0 16px}
.hero .brand{font-family:var(--serif);font-size:26px;line-height:1.25;letter-spacing:-.01em}
.hero .brand mark{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--hi) 55%,transparent) 55%);color:inherit;padding:0 2px}
.stat{display:flex;gap:16px;flex-wrap:wrap}
.stat b{color:var(--fg)}

/* sections */
.sec{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.sec>label,.sec>.lab{font-size:13px;color:var(--muted);letter-spacing:.04em;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:40px;padding:6px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);
  font-size:14px;color:var(--fg);display:inline-flex;align-items:center;gap:6px
}
.chip[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.chip small{opacity:.7;font-size:11px}
.grp{display:flex;flex-direction:column;gap:6px}
.grp .gl{font-size:12px;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:40px;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--fg);font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
select,textarea{
  width:100%;min-height:46px;background:var(--surface);color:var(--fg);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;font:inherit;font-size:14px
}
textarea{min-height:120px;resize:vertical;font-family:ui-monospace,monospace;font-size:12px;line-height:1.4}

/* primary action */
.dock{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,var(--bg) 35%);z-index:5;pointer-events:none}
.dock>*{pointer-events:auto;max-width:560px;margin:0 auto;display:flex}
.btn{
  min-height:52px;border-radius:14px;padding:0 20px;font-weight:700;font-size:16px;
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%
}
.btn.primary{background:var(--hi);color:var(--hi-ink)}
.btn.primary:disabled{background:var(--surface2);color:var(--muted)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.sm{min-height:42px;font-size:14px;width:auto;padding:0 16px;border-radius:12px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

/* nav */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px));
}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted);min-width:0}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--hi);font-weight:700}
.badge{background:var(--bad);color:#2a0b09;border-radius:9px;font-size:11px;font-weight:700;min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;margin-left:4px}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0 10px;z-index:3}
.qtop .bar{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.qtop .bar i{display:block;height:100%;background:var(--hi);border-radius:3px;transition:width .2s}
.iconbtn{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn svg{width:22px;height:22px}
.iconbtn[aria-pressed="true"]{color:var(--hi)}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--muted);margin:4px 0 12px}
.qmeta .tag{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 8px}
.stem p{margin:0 0 8px;font-size:16.5px;line-height:1.65;font-weight:500;text-wrap:pretty}
.stem p.it{font-size:15px;font-weight:400;background:var(--surface);border-radius:10px;padding:8px 12px;margin-bottom:6px;color:#d6dae6}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.ch{
  display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px;font-size:15px;line-height:1.55
}
.ch .bub{
  flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--muted);margin-top:0
}
.ch .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.ch:not(:disabled):active{background:var(--surface2)}
.ch.right{background:var(--ok-bg);border-color:var(--ok)}
.ch.right .bub{background:var(--ok);border-color:var(--ok);color:#06241a}
.ch.wrong{background:var(--bad-bg);border-color:var(--bad)}
.ch.wrong .bub{background:var(--bad);border-color:var(--bad);color:#2a0b09}
.ch.dim{opacity:.6}
.result{margin-top:16px;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.result.ok{background:var(--ok-bg);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.result.bad{background:var(--bad-bg);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.result .t{font-weight:700;font-size:16px}
.result.ok .t{color:var(--ok)} .result.bad .t{color:var(--bad)}
.rev{background:var(--surface);border:1px dashed var(--hi);border-radius:12px;padding:10px 12px;font-size:13.5px}
.rev b{color:var(--hi)}
.expl{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.expl .lab{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.expl p{margin:0 0 8px;font-size:14.5px;line-height:1.7;white-space:pre-line}
.expl p:last-child{margin-bottom:0}
.qnav{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 0 calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);margin-top:16px}
.qnav .btn{width:auto;flex:1}
.qnav .btn.prev{flex:none;width:96px}
.flag{font-size:13px;color:var(--muted);padding:10px 0;text-decoration:underline;text-underline-offset:3px}
.flag[aria-pressed="true"]{color:var(--hi)}

/* lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.item{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item .m{font-size:12px;color:var(--muted)}
.item .q{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.sum b{display:block;font-size:22px;font-family:var(--serif)}
.pbar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--ok)}
.pbar i.lo{background:var(--bad)}
.pbar i.mid{background:var(--hi)}
.subrow{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.subrow .h{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.empty{padding:36px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 80px);transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);padding:8px 16px;border-radius:20px;font-size:13px;z-index:20}
/* mock exam */
.tm{font-family:var(--serif);font-size:20px;color:var(--hi);min-width:64px}
.tm.low{color:var(--bad)}
.ch.sel{background:color-mix(in srgb,var(--hi) 14%,var(--surface));border-color:var(--hi)}
.ch.sel .bub{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.navgrid button{min-height:46px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;position:relative}
.navgrid button.done{background:color-mix(in srgb,var(--hi) 16%,var(--surface));border-color:var(--hi)}
.navgrid button.cur{outline:2px solid var(--fg);outline-offset:1px}
.navgrid button.mk::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.verdict{margin-top:14px;border-radius:14px;padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.verdict.pass{border-color:var(--ok);background:var(--ok-bg)}
.verdict.fail{border-color:var(--bad);background:var(--bad-bg)}
.verdict b{font-size:16px}
.low-tag{color:var(--bad);font-size:12px;margin-left:6px}
/* study + stats */
.topic{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:8px;overflow:hidden}
.topic>button.hd{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:12px 14px}
.topic .r1{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;font-weight:500}
.topic .r2{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.topic .body{padding:0 14px 14px;border-top:1px solid var(--line)}
.yrs{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;align-items:end;height:74px;margin-top:12px}
.yrs div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--muted);gap:2px}
.yrs i{display:block;width:100%;background:var(--hi);border-radius:3px 3px 0 0;min-height:0}
.up{color:var(--bad)} .dn{color:var(--ok)}
.rank{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:8px}
.rank b{font-family:var(--serif);color:var(--hi);font-size:18px;min-width:20px}
.rank span{font-size:14px;flex:1;min-width:0}
.rank small{font-size:12px;color:var(--muted);flex:none}
.chart{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:104px;margin-top:10px}
.chart .col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px;font-size:10px;color:var(--muted)}
.chart .bars{width:100%;display:flex;flex-direction:column;border-radius:3px;overflow:hidden}
.chart .bars i{display:block;width:100%}
.chart .col.today{color:var(--hi);font-weight:700}
.kv{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.kv b{color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>
<nav class="tabs" id="tabs" hidden></nav>

<script>
(function(){
'use strict';
var KEY='sw1q.v1';
var NAMES={hb:'인간행동',rs:'조사론',pr:'실천론',sk:'실천기술론',cm:'지역사회',po:'정책론',ad:'행정론',lw:'법제론'};
var FMTS=['옳지 않은 것','옳은 것 고르기','옳은 것 모두 고르기','사례·제시문 판단','순서 나열','빈칸 채우기'];
var YEARS=[2017,2018,2019,2020,2021,2022,2023,2024,2025,2026];
var ICON={
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 19z"/><path d="M14.5 6.5l3 3"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h5"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 17l-5.2 2.7 1-5.9L3.5 9.7l5.9-.8z"/></svg>',
  starF:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 17l-5.2 2.7 1-5.9L3.5 9.7l5.9-.8z"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C6 4.5 9 4.5 12 6c3-1.5 6-1.5 8-.5V19c-2-1-5-1-8 .5-3-1.5-6-1.5-8-.5z"/><path d="M12 6v13.5"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- storage ---------- */
var mem=null;
function loadRec(){
  try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.r)return o;}}catch(e){}
  return mem||{v:1,r:{},bm:{},rep:{},hist:{},mock:[],live:null,set:{}};
}
var D=loadRec();
D.hist=D.hist||{};D.mock=D.mock||[];if(D.live===undefined)D.live=null;
function save(){mem=D;try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}

/* ---------- data ---------- */
var SUBJ=[],ALL=[],BYID={},EX={},GRP={};
function fetchJSON(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(u);return r.json();});}
function boot(){
  var app=document.getElementById('app');
  app.innerHTML='<div class="empty"><b>문제를 불러오는 중</b>2,000문항</div>';
  return fetchJSON('data/subjects.json').then(function(subs){
    SUBJ=subs;
    return Promise.all(subs.map(function(s){
      return fetchJSON('data/q_'+s.k+'.json').then(function(q){
        s.q=q;q.forEach(function(x){x.k=s.k;ALL.push(x);BYID[x.id]=x;});
      }).then(function(){
        return fetchJSON('data/e_'+s.k+'.json').then(function(e){for(var i in e)EX[i]=e[i];}).catch(function(){});
      });
    }));
  }).then(function(){return fetchJSON('data/groups.json').then(function(g){GRP=g;}).catch(function(){});}).then(function(){go('home');}).catch(function(){
    app.innerHTML='<div class="empty"><b>문제를 불러오지 못했습니다</b>페이지를 새로고침해 주세요.</div>';
  });
}

/* ---------- helpers ---------- */
function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs)for(var k in attrs){
    var v=attrs[k];
    if(k==='class')el.className=v;
    else if(k==='html')el.innerHTML=v;
    else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);
    else if(v===true)el.setAttribute(k,'');
    else if(v!==false&&v!=null)el.setAttribute(k,v);
  }
  for(var i=2;i<arguments.length;i++){
    var c=arguments[i];if(c==null||c===false)continue;
    el.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);
  }
  return el;
}
function pad(n){return n<10?'0'+n:''+n;}
function dayKey(t){var d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtT(ms){ms=Math.max(0,Math.ceil(ms/1000));var m=Math.floor(ms/60),s=ms%60;return pad(m)+':'+pad(s);}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function toast(msg){
  var t=h('div',{class:'toast',role:'status'},msg);document.body.appendChild(t);
  setTimeout(function(){t.remove();},1800);
}
function qtitle(q){return q.s[0];}
function label(q){return q.y+'년 '+q.g+'교시 '+q.n+'번';}
function curAns(q){var e=EX[q.id];return e&&typeof e.cur==='number'?e.cur:q.a;}
function stats(){
  var r=D.r,n=0,ok=0,wrong=0;
  for(var i in r){n++;if(r[i].ok)ok++;else wrong++;}
  return {n:n,ok:ok,wrong:wrong};
}

/* ---------- state ---------- */
var S=Object.assign({subs:[],topic:'',years:[],fmts:[],status:'all',order:'seq'},D.set||{});
var view='home',sess=null,tab='wrong',ex=null,timerId=null,lastRes=null,studyK='',studyOpen='';

function go(v){
  view=v;
  clearInterval(timerId);
  var app=document.getElementById('app');
  var tabs=document.getElementById('tabs');
  app.innerHTML='';
  document.querySelectorAll('.dock').forEach(function(d){d.remove();});
  var quiz=(v==='quiz'||v==='sum'||v==='exam'||v==='exsum');
  app.className=quiz?'noNav':'';
  tabs.hidden=quiz;
  if(!quiz)renderTabs();
  window.scrollTo(0,0);
  if(v==='home')renderHome(app);
  else if(v==='wrong')renderWrong(app);
  else if(v==='rec')renderRec(app);
  else if(v==='quiz')renderQuiz(app);
  else if(v==='sum')renderSum(app);
  else if(v==='mock')renderMock(app);
  else if(v==='study')renderStudy(app);
  else if(v==='exam')renderExam(app);
  else if(v==='exsum')renderExSum(app,lastRes);
}
function redo(v){var y=window.scrollY;go(v);window.scrollTo(0,y);}
function renderTabs(){
  var t=document.getElementById('tabs');t.innerHTML='';
  var st=stats();
  var wrongN=wrongList().length;
  var d=h('div');

/* ---------- home ---------- */
function filterQs(){
  return ALL.filter(function(q){
    if(S.subs.length&&S.subs.indexOf(q.k)<0)return false;
    if(S.topic&&q.t!==S.topic)return false;
    if(S.years.length&&S.years.indexOf(q.y)<0)return false;
    if(S.fmts.length&&S.fmts.indexOf(q.f)<0)return false;
    var r=D.r[q.id];
    if(S.status==='new'&&r)return false;
    if(S.status==='wrong'&&!(r&&!r.ok))return false;
    if(S.status==='bm'&&!D.bm[q.id])return false;
    return true;
  });
}
function persistSet(){D.set=S;save();}

/* ---------- session ---------- */
function startSession(ids,mode){
  sess={ids:ids,i:0,picked:{},mode:mode,graded:{}};

}
function grade(q,pick){
  var a=curAns(q);
  if(a===0)return null;
  return pick===a;
}
function record(q,ok){
  var r=D.r[q.id]||{n:0,w:0};
  r.n++;if(!ok)r.w++;r.ok=ok;r.t=Date.now();
  D.r[q.id]=r;
  var dk=dayKey(r.t),hd=D.hist[dk]||(D.hist[dk]=[0,0]);hd[0]++;if(ok)hd[1]++;
  save();
}

var X={scope:'1',pool:'new'};
function scopeSubs(sc){
  if(sc==='all')return SUBJ;
  if(sc.slice(0,2)==='k:')return SUBJ.filter(function(s){return s.k===sc.slice(2);});
  return SUBJ.filter(function(s){return String(s.g)===sc;});
}
function scopeLabel(sc){return sc==='all'?'전체 200문항':sc.slice(0,2)==='k:'?NAMES[sc.slice(2)]+' 단과목':sc+'교시';}
function composeExam(sc,pool){
  var ids=[];
  scopeSubs(sc).forEach(function(s){
    var c=s.q.filter(function(q){return curAns(q)!==0;});
    var fresh=shuffle(c.filter(function(q){return !D.r[q.id];}));
    var seen=shuffle(c.filter(function(q){return D.r[q.id];}));
    var l=pool==='new'?fresh.concat(seen):shuffle(c);
    shuffle(l.slice(0,25)).forEach(function(q){ids.push(q.id);});
  });
  return ids;
}
function persistLive(){

/* ---------- study (frequent topics) ---------- */
function topicStats(){
  var m={};
  ALL.forEach(function(q){
    var key=q.k+'|'+q.t,o=m[key];
    if(!o)o=m[key]={k:q.k,t:q.t,n:0,y:{},att:0,ok:0,ids:[]};
    o.n++;o.y[q.y]=(o.y[q.y]||0)+1;o.ids.push(q.id);
    var r=D.r[q.id];if(r){o.att++;if(r.ok)o.ok++;}
  });
  return Object.keys(m).map(function(key){
    var o=m[key],a=0,b=0;
    YEARS.forEach(function(y){var c=o.y[y]||0;if(y>=2022)b+=c;else a+=c;});
    o.recent=b;o.early=a;o.acc=o.att?o.ok/o.att:null;
    o.prio=o.n*(1-(o.acc===null?0.5:o.acc));
    return o;
  });
}
function topicQs(o,mode){
  return o.ids.filter(function(id){
    var r=D.r[id];
    if(mode==='new')return !r;
    if(mode==='wrong')return r&&!r.ok;
    return true;
  });
}

        h('button',{class:'btn sm',style:'background:var(--bad);color:#2a0b09',onclick:function(){
          D={v:1,r:{},bm:{},rep:{},hist:{},mock:[],live:null,set:D.set||{}};save();toast('초기화했습니다');go('rec');
        }},'모두 지우기'))));
  }},'기록 모두 지우기');
  rs.appendChild(btn);app.appendChild(rs);
  app.appendChild(h('div',{class:'muted small',style:'margin-top:28px'},
    '기출 2017~2026년 10개년 · 문항 2,000개 · 정답은 CBT 공식 정답표 기준. 해설은 AI가 작성했으며 틀릴 수 있습니다.'));
}
function copyText(t){
  var done=function(){toast('복사했습니다');};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done,function(){toast('위 칸을 길게 눌러 직접 복사해 주세요');});
  }else toast('위 칸을 길게 눌러 직접 복사해 주세요');
}

boot();
